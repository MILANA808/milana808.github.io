<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>АКСИ Капсула — полный контур</title>
<meta name="description" content="Память, ECDSA-печать, экспорт .aksi, импорт, шаблоны">
<meta name="theme-color" content="#0b0b0f">
<link rel="canonical" href="https://milana808.github.io/capsule.html">
<style>
:root{--bg:#0b0b0f;--card:#14141c;--ink:#f2f1eb;--muted:#9a97a3;--line:#2a2a36;--acc:#8b7cf7;--ok:#3ecf8e}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800}.logo span{color:var(--acc)}
header a{color:var(--muted);text-decoration:none;font-size:13px}
.hero{padding:14px 16px;border-bottom:1px solid var(--line)}
.hero h1{font-size:1.15rem;margin-bottom:6px}
.hero p{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px}
.chips button{font:inherit;font-size:12px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.panel{padding:8px 16px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.msgs{flex:1;overflow:auto;min-height:220px;max-height:48vh;display:flex;flex-direction:column;gap:10px}
.msg{padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#1a1a26;max-width:92%}
.msg .meta{margin-top:8px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;font-family:ui-monospace,monospace}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{flex:1;min-width:140px;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#101018;color:var(--ink);font:inherit;font-size:16px}
button,label.file{font:inherit;font-size:14px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:48px}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button:disabled{opacity:.4}
label.file input{display:none}
.seal-box{font-size:12px;color:var(--muted);padding:12px;border:1px dashed var(--line);border-radius:12px;font-family:ui-monospace,monospace;word-break:break-all;min-height:72px}
.status{padding:8px 16px 14px;font-size:13px;color:var(--muted)}
.status b{color:var(--ok)}
footer{padding:12px 16px 20px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <div class="logo">АКСИ <span>Капсула</span></div>
  <nav><a href="/CAPSULE.md">Спека</a> · <a href="/">Главная</a></nav>
</header>
<div class="hero">
  <h1>Полный контур: память · печать · файл</h1>
  <p>ECDSA P-256 + SHA-256 · <b>.aksi</b> · шаблоны · проверка. Всё на устройстве.</p>
</div>
<div class="chips" id="tpl"></div>
<div class="panel">
  <div class="msgs" id="msgs"></div>
  <div class="row">
    <input type="text" id="fact" placeholder="Запомнить факт…" autocomplete="off">
    <button type="button" class="primary" id="btnMem">Запомнить</button>
  </div>
  <div class="row">
    <input type="text" id="q" placeholder="Спросить память…" autocomplete="off">
    <button type="button" id="btnAsk">Спросить</button>
  </div>
  <div class="row">
    <button type="button" class="primary" id="btnSeal" disabled>Запечатать</button>
    <button type="button" id="btnExport" disabled>Скачать .aksi</button>
    <label class="file"><input type="file" id="file" accept=".aksi,application/json,.json">Импорт</label>
    <button type="button" id="btnVerify">Проверить печати</button>
    <button type="button" id="btnClear">Сброс</button>
  </div>
  <div class="seal-box" id="sealBox">Печать / верификация</div>
</div>
<div class="status" id="st">…</div>
<footer>aksi-capsule · aksilove@internet.ru</footer>
<script src="/aksi-capsule.js?v=1"></script>
<script>
(function () {
  var C = window.AKSI_CAPSULE;
  if (!C) { document.getElementById("st").textContent = "Модуль не загрузился"; return; }
  C.ensureKeys().catch(function () {});
  function paint() {
    var s = C.status();
    document.getElementById("st").innerHTML = "Фактов <b>" + s.facts + "</b> · печатей <b>" + s.seals + "</b> · " + s.crypto + " · " + s.did;
    document.getElementById("btnSeal").disabled = !s.hasLast;
    document.getElementById("btnExport").disabled = s.facts === 0 && s.seals === 0;
  }
  function add(role, text, meta) {
    var d = document.createElement("div"); d.className = "msg " + role; d.textContent = text;
    if (meta) { var m = document.createElement("div"); m.className = "meta"; m.textContent = meta; d.appendChild(m); }
    document.getElementById("msgs").appendChild(d); d.scrollIntoView({ block: "end" });
  }
  C.templates.forEach(function (t) {
    var b = document.createElement("button"); b.type = "button"; b.textContent = t.label;
    b.onclick = function () { document.getElementById("fact").value = t.prompt; document.getElementById("fact").focus(); };
    document.getElementById("tpl").appendChild(b);
  });
  document.getElementById("btnMem").onclick = function () {
    var t = document.getElementById("fact").value.trim(); if (!t) return;
    document.getElementById("fact").value = "";
    var r = C.remember(t); add("bot", "Запомнено:\n«" + r.fact.t + "»", r.fact.id); paint();
  };
  document.getElementById("btnAsk").onclick = function () {
    var q = document.getElementById("q").value.trim(); if (!q) return;
    document.getElementById("q").value = ""; add("user", q);
    var r = C.ask(q); add("bot", r.text, r.source + " · " + r.hits); paint();
  };
  document.getElementById("q").onkeydown = function (e) { if (e.key === "Enter") document.getElementById("btnAsk").click(); };
  document.getElementById("fact").onkeydown = function (e) { if (e.key === "Enter") document.getElementById("btnMem").click(); };
  document.getElementById("btnSeal").onclick = async function () {
    var r = await C.sealLast();
    if (!r.ok) return;
    document.getElementById("sealBox").textContent = "ПЕЧАТЬ\nalg: " + r.seal.alg + "\nhash: " + r.seal.hash.slice(0, 40) + "…\nsig: " + r.seal.signature.slice(0, 40) + "…";
    add("bot", "Запечатано\n" + r.seal.hash.slice(0, 28) + "…", "ECDSA+SHA-256"); paint();
  };
  document.getElementById("btnExport").onclick = function () {
    C.downloadCapsule(); add("bot", "Скачан .aksi — импортируйте на другом устройстве", "export");
  };
  document.getElementById("file").onchange = async function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    try {
      var r = await C.importCapsule(await f.text());
      if (!r.ok) { add("bot", r.error, "error"); return; }
      add("bot", "Импорт: фактов " + r.facts + ", печатей " + r.seals + ", проверка " + (r.allSealsOk ? "OK" : "FAIL"), "import");
      paint();
    } catch (err) { add("bot", String(err.message || err), "error"); }
    e.target.value = "";
  };
  document.getElementById("btnVerify").onclick = async function () {
    var st = C.getState(); if (!st.seals.length) { add("bot", "Печатей нет", "verify"); return; }
    var lines = [];
    for (var i = 0; i < st.seals.length; i++) {
      var v = await C.verifySeal(st.seals[i]);
      lines.push((i + 1) + ". " + (v.ok ? "OK" : "FAIL") + " hash=" + v.hashOk + " sig=" + v.sigOk);
    }
    add("bot", lines.join("\n"), "verify");
  };
  document.getElementById("btnClear").onclick = function () {
    if (!confirm("Сбросить капсулу?")) return;
    C.clearAll(); document.getElementById("msgs").innerHTML = "";
    document.getElementById("sealBox").textContent = "Печать / верификация";
    add("bot", "Очищено", "reset"); paint();
  };
  add("bot", "Капсула готова: память · печать · .aksi · проверка · шаблоны", C.version);
  paint();
})();
</script>
</body>
</html>
