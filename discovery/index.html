<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AKSI Discovery</title><style>body{margin:0;background:#07080c;color:#eef2ff;font:14px system-ui}.w{max-width:900px;margin:auto;padding:20px}.c{background:#11151e;border:1px solid #252b3b;border-radius:15px;padding:15px;margin:10px 0}textarea{width:100%;min-height:230px;background:#090c13;color:#eef2ff;border:1px solid #252b3b;border-radius:10px;padding:10px;box-sizing:border-box;font:11px monospace}button{padding:10px 14px;border:0;border-radius:10px;background:#8b7cff;color:white;font-weight:700}pre{white-space:pre-wrap;background:#090c13;padding:10px;border-radius:10px}a{color:#9eb7ff}.m{color:#8f9ab2}</style></head><body><main class="w"><h1>AKSI Discovery</h1><p class="m">Гипотезы → различающий эксперимент → наблюдение → evidence → receipt. Серверный режим используется только при фактическом ответе.</p><div class="c"><textarea id="x">{"hypotheses":[{"id":"H1","description":"rule A","predictions":[{"experiment_id":"E1","value":"red"},{"experiment_id":"E2","value":"circle"}]},{"id":"H2","description":"rule B","predictions":[{"experiment_id":"E1","value":"blue"},{"experiment_id":"E2","value":"circle"}]}],"experiments":[{"id":"E1","input":"test-1","cost":1},{"id":"E2","input":"test-2","cost":1}]}</textarea><button id="b">RUN DISCOVERY</button><pre id="o">ready</pre></div><p><a href="/">← Hub</a></p></main><script>
const BACKENDS=['https://milana-backend.replit.app','https://milana-backend.onrender.com'];
async function serverRun(r){let last=null;for(const B of BACKENDS){try{const res=await fetch(B+'/api/discovery/synthetic',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(r)});if(res.ok)return await res.json();last=new Error('HTTP '+res.status)}catch(e){last=e}}throw last||new Error('backend unavailable')}
async function hash(v){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(v)));return 'sha256:'+Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function localPlan(r){let best=null,rank=[];for(const e of r.experiments){let vals=r.hypotheses.map(h=>JSON.stringify((h.predictions.find(p=>p.experiment_id===e.id)||{}).value));let unique=new Set(vals).size;let score=(unique-1)/Math.max(e.cost,1);rank.push({experiment_id:e.id,score,unique_predictions:unique});if(!best||score>best.score)best=rank[rank.length-1]}return {protocol:'AKSI-DISCOVERY/LOCAL-1',selected:best,ranked:rank.sort((a,b)=>b.score-a.score),claim_boundary:'selection heuristic; not proof of truth'}}
document.getElementById('b').onclick=async()=>{const o=document.getElementById('o');let r;try{r=JSON.parse(document.getElementById('x').value)}catch(e){o.textContent='INVALID JSON';return}o.textContent='planning…';try{const res=await serverRun(r);o.textContent=JSON.stringify(res,null,2)}catch(e){const p=localPlan(r);p.receipt=await hash(p);p.mode='local-fallback';o.textContent=JSON.stringify(p,null,2)}};</script></body></html>
