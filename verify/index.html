<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AKSI Independent Verifier</title><style>body{font:15px system-ui;background:#f5efe5;color:#29231c;margin:0}.wrap{max-width:820px;margin:auto;padding:24px 14px}.card{background:#fffaf2;border:1px solid #dacdbb;border-radius:16px;padding:16px;margin:12px 0}textarea{width:100%;min-height:260px;box-sizing:border-box;padding:12px;border:1px solid #dacdbb;border-radius:12px;font:12px ui-monospace,monospace}button{padding:11px 16px;border:0;border-radius:12px;background:#6b4f35;color:#fff;font-weight:800;margin-top:10px}.ok{color:#276b46}.bad{color:#9a3b32}pre{white-space:pre-wrap;word-break:break-word}.small{color:#756b5e;font-size:12px}</style></head><body><main class="wrap"><h1>AKSI Independent Verifier</h1><p class="small">Проверяет SHA-256 и криптографическую подпись прямо в браузере. Приватный ключ не нужен и данные не отправляются.</p><div class="card"><textarea id="packet" placeholder="Вставьте DecisionPacket JSON..."></textarea><button id="verify">Проверить</button><pre id="result">Ожидание пакета…</pre></div><p><a href="/decision/">← Decision Runtime</a></p></main><script src="../aksi-ciphersuite.js?v=4"></script><script src="../decision/decision-packet-v2.js?v=3"></script><script>document.getElementById('verify').onclick=async function(){var out=document.getElementById('result');try{var p=JSON.parse(document.getElementById('packet').value);var v=await AKSI_DECISION_PACKET.verify(p);out.className=v.ok?'ok':'bad';out.textContent=JSON.stringify(v,null,2)}catch(e){out.className='bad';out.textContent='VERIFY ERROR: '+e.message}};</script></body></html>
