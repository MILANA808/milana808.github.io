<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AKSI Verify</title><style>body{font-family:system-ui;background:#111;color:#eee;max-width:900px;margin:40px auto;padding:20px}textarea{width:100%;min-height:300px;background:#181818;color:#eee;border:1px solid #555;padding:12px;border-radius:10px}button{padding:12px 18px;border:0;border-radius:9px;margin:10px 0;cursor:pointer}pre{white-space:pre-wrap;background:#181818;padding:15px;border-radius:10px}</style></head><body><h1>AKSI Independent Verifier</h1><p>Проверяет переносимый DecisionPacket без приватного ключа и без доверия к исходному runtime.</p><textarea id="packet" placeholder="Вставьте полный DecisionPacket JSON"></textarea><br><button id="verify">Проверить</button><pre id="out">Ожидание пакета…</pre><script src="../aksi-ciphersuite.js"></script><script src="../decision/decision-packet-v2.js"></script><script>(async()=>{await AKSI_CRYPTO.boot({tryPq:false});document.getElementById('verify').onclick=async()=>{try{var p=JSON.parse(document.getElementById('packet').value);var r=await AKSI_DECISION_PACKET.verify(p);document.getElementById('out').textContent=JSON.stringify(r,null,2)}catch(e){document.getElementById('out').textContent='INVALID: '+e.message}}})();</script></body></html>
