<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AKSI — Verifiable Agent Demo</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:20px}button{padding:10px 14px;border-radius:9px;border:1px solid #aaa;background:#111;color:#fff}pre{white-space:pre-wrap;background:#f4f4f4;padding:14px;border-radius:10px}</style><h1>AKSI</h1><p>Демонстрация: результат AI → provenance → proof → verification.</p><button id="run">Запустить демонстрацию</button><pre id="out">Готово.</pre><script src="/sdk/aksi-verifier.js"></script><script>run.onclick=async()=>{const result={agent:'demo-agent',task:'Сформировать тестовый результат',answer:'Это демонстрационный результат.',provenance:{type:'synthetic-demo',sources:[]},permissions:{web:false},uncertainty:'demo-only'};const record=await AKSIVerifier.proof(result);const first=await AKSIVerifier.verify(record);record.payload.answer='Изменённая версия';const tampered=await AKSIVerifier.verify(record);out.textContent=JSON.stringify({record,verificationBeforeChange:first,verificationAfterChange:tampered,note:'Hash integrity is not proof of truth.'},null,2)}</script>
