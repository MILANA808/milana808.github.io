<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AKSI Protocol Demo</title><style>body{font:16px system-ui;max-width:820px;margin:32px auto;padding:20px}button{padding:10px 14px;margin:4px;border:1px solid #999;border-radius:9px}pre{background:#f4f4f4;padding:14px;border-radius:10px;overflow:auto}</style><h1>AKSI Protocol v1</h1><p>Проверяемый envelope для AI-agent run.</p><button onclick="createRun()">Создать run</button><button onclick="tamper()">Изменить результат</button><pre id="out">Готово.</pre><script src="/sdk/aksi-protocol.js"></script><script>let record;async function createRun(){record=await AKSIProtocol.create({agent:{id:'demo-agent',model:'demo'},policy:{network:false,tools:[]},result:{answer:'Демонстрационный ответ',uncertainty:'unknown'}});out.textContent=JSON.stringify({record,verification:await AKSIProtocol.verify(record)},null,2)}async function tamper(){if(!record){return createRun()}record.result.answer='Подменённый ответ';out.textContent=JSON.stringify({record,verification:await AKSIProtocol.verify(record)},null,2)}</script>
