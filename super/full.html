<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>АКСИ Super Full</title>
<meta name="theme-color" content="#05070d"/>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#05070d;color:#eef3fb;font:15px/1.45 system-ui,sans-serif}
.shell{max-width:820px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{padding:12px 14px;border-bottom:1px solid #1a2233;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:1.05rem;background:linear-gradient(90deg,#2dd4bf,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent}
a.back{color:#8490a6;font-size:12px;text-decoration:none}
.pills{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px}
.pill{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid #1a2233;color:#8490a6}
.pill.on{border-color:#34d399;color:#34d399}
#chat{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
.user{align-self:flex-end;background:#152033}
.bot{align-self:flex-start;background:#0b1019;border:1px solid #1a2233}
.sys{align-self:center;color:#8490a6;font-size:12px}
.composer{padding:10px 12px 14px;border-top:1px solid #1a2233;display:flex;gap:8px}
input{flex:1;border:1px solid #1a2233;border-radius:12px;background:#0b1019;color:inherit;padding:12px;font:inherit}
button{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#2dd4bf,#818cf8);color:#041016}
button.sec{background:transparent;border:1px solid #1a2233;color:#eef3fb;font-weight:600}
button:disabled{opacity:.4}
</style>
</head>
<body>
<div class="shell">
<header><h1>АКСИ Full</h1><a class="back" href="/super/">← быстрая</a></header>
<div class="pills">
<span class="pill" id="st">loading…</span>
<span class="pill" id="llm">llm off</span>
</div>
<div id="chat"></div>
<div class="composer">
<input id="q" placeholder="Вопрос…"/>
<button type="button" class="sec" id="load">Модель</button>
<button type="button" id="go">→</button>
</div>
</div>
<script src="/aksi-exocortex.js?v=1" defer></script>
<script src="/aksi-webllm.js?v=44" defer></script>
<script src="/aksi-super-mind.js?v=6" defer></script>
<script src="/aksi-super.js?v=30" defer></script>
<script>
document.addEventListener("DOMContentLoaded",function(){
"use strict";
var S=window.AKSI_SUPER,M=window.AKSI_SUPER_MIND,W=window.AKSI_WEBLLM,f=null,busy=false;
var chat=document.getElementById("chat");
function add(c,t){var d=document.createElement("div");d.className="msg "+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function llmOn(){try{return W&&((W.ready&&W.ready())||(W.status&&W.status().ready))}catch(e){return false}}
async function boot(){
  if(!S){document.getElementById("st").textContent="scripts?";return}
  f=new S.SuperFabric();f.boot(8,2);f.startScheduler(200);
  try{await f.attachExocortex()}catch(e){}
  document.getElementById("st").textContent="online "+S.version;
  document.getElementById("st").classList.add("on");
  add("sys","Full stack готов. Быстрая версия: /super/");
}
document.getElementById("load").onclick=async function(){
  if(!W){add("sys","нет WebLLM");return}
  this.disabled=true;add("sys","загрузка модели…");
  try{await (W.load||W.loadModel||W.autoLoad).call(W);document.getElementById("llm").textContent=llmOn()?"llm ON":"llm fail";if(llmOn())document.getElementById("llm").classList.add("on")}catch(e){add("sys",""+e.message)}
  this.disabled=false;
};
document.getElementById("go").onclick=async function(){
  var q=document.getElementById("q").value.trim();if(!q||busy)return;
  document.getElementById("q").value="";add("user",q);busy=true;this.disabled=true;
  var w=add("bot","…");
  try{
    if(llmOn()&&W.complete){
      var r=await W.complete(q,{system:"Ты АКСИ. Русский, кратко и по делу.",max_tokens:400});
      if(r&&r.text&&r.text.trim().length>10){w.textContent=r.text.trim();busy=false;this.disabled=false;return}
    }
    if(!f)await boot();
    var job=f.submit({type:"agent",prompt:q,size:24});
    var done=await f.waitJob(job,60000);
    w.textContent=(done&&done.result&&(done.result.answer||done.result.report))||"пусто";
  }catch(e){w.textContent="ошибка: "+(e.message||e)}
  busy=false;this.disabled=false;
};
document.getElementById("q").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("go").click()});
setTimeout(boot,50);
});
</script>
</body>
</html>
