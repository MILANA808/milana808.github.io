<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>АКСИ</title>
<meta name="theme-color" content="#0a0c10"/>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0a0c10;color:#e8ecf4;font:15px/1.45 system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{padding:12px 14px;border-bottom:1px solid #1c2230;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{background:linear-gradient(90deg,#2dd4bf,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent}
header a{color:#7d8799;font-size:12px;text-decoration:none}
#log{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:90%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
.u{align-self:flex-end;background:#152033}
.a{align-self:flex-start;background:#121820;border:1px solid #1c2230}
.s{align-self:center;color:#7d8799;font-size:12px;background:0;padding:2px}
footer{padding:10px 12px 14px;border-top:1px solid #1c2230;display:flex;gap:8px}
input{flex:1;border:1px solid #1c2230;border-radius:12px;background:#121820;color:inherit;padding:12px;font:inherit}
button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#2dd4bf,#818cf8);color:#041016}
button:disabled{opacity:.4}
</style>
</head>
<body>
<div class="wrap">
<header><b>АКСИ</b> <a href="/super/full/">полная версия</a></header>
<div id="log"></div>
<footer>
<input id="q" placeholder="Вопрос…" autocomplete="off"/>
<button id="go">→</button>
</footer>
</div>
<script>
(function(){
"use strict";
var L=document.getElementById("log"),Q=document.getElementById("q"),G=document.getElementById("go");
function add(cls,t){var d=document.createElement("div");d.className="m "+cls;d.textContent=t;L.appendChild(d);L.scrollTop=L.scrollHeight;return d}
function hash(s){var h=2166136261>>>0,i;for(i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function math(q){
  var s=String(q).toLowerCase().replace(/,/g,".").replace(/\s+/g," ").trim(),m,n,r,expr,val;
  m=s.match(/x\s*\^\s*2\s*=\s*([0-9.]+)|x\s*\*\*\s*2\s*=\s*([0-9.]+)|x²\s*=\s*([0-9.]+)/);
  if(m){n=parseFloat(m[1]||m[2]||m[3]);r=Math.sqrt(n);return "x = ±"+r+" (проверка: "+r+"² = "+(r*r)+")"}
  m=s.match(/(?:корень|sqrt)\s*(?:из\s*)?([0-9.]+)/i);
  if(m){n=parseFloat(m[1]);r=Math.sqrt(n);return "√"+n+" ≈ "+r}
  m=s.match(/([0-9.]+)\s*%\s*(?:от\s*)?([0-9.]+)/);
  if(m){return m[1]+"% от "+m[2]+" = "+(+m[2]*+m[1]/100)}
  m=s.match(/([0-9.]+\s*[+\-*/^]\s*[0-9.]+(?:\s*[+\-*/^]\s*[0-9.]+)*)/);
  if(m){try{expr=m[1].replace(/\^/g,"**").replace(/\s+/g,"");if(!/^[\d.+\-*/()]+$/.test(expr.replace(/\*\*/g,"")))return null;val=Function('"use strict";return('+expr+")")();if(typeof val==="number"&&isFinite(val))return m[1].trim()+" = "+val}catch(e){}}
  return null;
}
var KB=[
  [/привет|здравствуй|добрый/i,"Привет. Я АКСИ — локальный агент. Спросите пример (12*12) или тему: Permit, кубит, ИИ."],
  [/что\s*умеешь|что\s*ты\s*можешь/i,"Считаю, объясняю базовые темы, работаю без сервера. Живая LLM — в полной версии."],
  [/permit|пермит/i,"Permit — default-deny: действие только после ALLOW, затем крипто-чек (receipt)."],
  [/кубит|qubit|суперпозиц/i,"Кубит: α|0⟩+β|1⟩. Суперпозиция — несколько амплитуд до измерения."],
  [/акси|aksi|кто ты/i,"АКСИ — offline-first агент: быстрый Mind прямо в странице."],
  [/небо.*голуб|голуб.*небо/i,"Небо голубое из‑за рассеяния Рэлея: короткие волны рассеиваются сильнее."],
  [/ии|искусственн|нейросет/i,"ИИ — модели для текста и решений. АКСИ — локальный быстрый контур."],
  [/энтропи/i,"Энтропия S=−Σ p log p — мера неопределённости распределения."]
];
function answer(q){
  q=String(q||"").trim();
  if(!q)return "Напишите вопрос.";
  var bits=((hash(q)%16).toString(2)).padStart(4,"0");
  var m=math(q);
  if(m)return m+"\n· |"+bits+"⟩";
  for(var i=0;i<KB.length;i++)if(KB[i][0].test(q))return KB[i][1]+"\n· |"+bits+"⟩";
  var words=q.toLowerCase().split(/[^a-zа-яё0-9]+/i).filter(function(w){return w.length>2}).slice(0,6);
  return "По «"+(words.join(" ")||q.slice(0,40))+"» точного узла в быстрой базе нет.\nПопробуйте: 12*12, Permit, кубит, почему небо голубое.\nПолная версия (кластер + WebLLM): /super/full/\n· |"+bits+"⟩";
}
function send(){
  var t=Q.value.trim();if(!t)return;
  Q.value="";add("u",t);G.disabled=true;
  var a=answer(t);
  setTimeout(function(){add("a",a);G.disabled=false;Q.focus()},0);
}
G.onclick=send;
Q.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();send()}});
add("s","Готов · ~5KB · без сети");
Q.focus();
})();
</script>
</body>
</html>
