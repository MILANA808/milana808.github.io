<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>АКСИ — агент с допуском</title>
<link rel="canonical" href="https://milana808.github.io/super/"/>
<meta name="description" content="АКСИ: локальный агент с ответом, Permit-допуском и криптографическим чеком. Offline-first."/>
<meta name="theme-color" content="#0b0f16"/>
<style>
:root{
  --bg:#0b0f16;--panel:#121826;--line:#1e293b;--text:#e8eef8;--muted:#94a3b8;
  --accent:#14b8a6;--accent2:#6366f1;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.logo{font-size:1.2rem;font-weight:700;letter-spacing:.02em}
.logo span{color:var(--accent)}
.tag{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.4}
.status{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.ok{color:var(--ok);border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.08)}
.chip.warn{color:var(--warn);border-color:rgba(245,158,11,.35)}
.chip.off{opacity:.7}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:transparent;color:var(--text);
  border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.btn:hover{background:rgba(255,255,255,.03)}
.btn.main{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#041016}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{height:3px;background:#0f172a;border-radius:2px;margin-top:10px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#feed{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 14px}
.card.user{align-self:flex-end;max-width:90%;background:#152033}
.card.bot{align-self:flex-start;max-width:94%}
.card.sys{align-self:center;border:0;background:transparent;color:var(--muted);font-size:12.5px;padding:4px 8px}
.role{font-size:11px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.body{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.55}
.meta{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:grid;gap:4px}
.meta b{color:var(--text);font-weight:600}
.meta .allow{color:var(--ok)}
.meta .block{color:var(--bad)}
.composer{padding:12px 18px 18px;border-top:1px solid var(--line);background:rgba(11,15,22,.92)}
.row{display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;min-height:48px;max-height:140px;resize:vertical;border:1px solid var(--line);
  border-radius:12px;background:#0f172a;color:var(--text);padding:12px;font:inherit}
textarea:focus{outline:2px solid rgba(20,184,166,.25);border-color:#334155}
.send{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#041016}
.send:disabled{opacity:.45}
.hint{margin-top:8px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">АКСИ <span>Agent</span></div>
    <div class="tag">Ответ + допуск (Permit) + чек. Локально в браузере. Технология служит человеку.</div>
    <div class="status">
      <span class="chip" id="cCore">ядро…</span>
      <span class="chip" id="cExo">permit…</span>
      <span class="chip" id="cLlm">модель off</span>
    </div>
    <div class="toolbar">
      <button type="button" class="btn main" id="btnModel">Подключить модель</button>
      <button type="button" class="btn" id="btnVerify">Проверка</button>
      <button type="button" class="btn" id="btnClear">Очистить</button>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </header>
  <div id="feed"></div>
  <div class="composer">
    <div class="row">
      <textarea id="q" rows="2" placeholder="Вопрос или задача…"></textarea>
      <button type="button" class="send" id="send">Отправить</button>
    </div>
    <div class="hint">Каждый ответ проходит quantum → reasoning → Permit → receipt. Модель — по желанию (WebGPU).</div>
  </div>
</div>
<script src="/aksi-exocortex.js?v=1"></script>
<script src="/aksi-webllm.js?v=44"></script>
<script src="/aksi-super-mind.js?v=6"></script>
<script src="/aksi-super.js?v=30"></script>
<script>
(function () {
  "use strict";
  var S = window.AKSI_SUPER, M = window.AKSI_SUPER_MIND, W = window.AKSI_WEBLLM;
  var fabric = null, history = [], busy = false;

  function $(id) { return document.getElementById(id); }
  function chip(id, text, cls) {
    var el = $(id);
    el.textContent = text;
    el.className = "chip" + (cls ? " " + cls : "");
  }
  function feed(role, body, meta) {
    var card = document.createElement("div");
    card.className = "card " + role;
    if (role === "sys") {
      card.textContent = body;
    } else {
      var r = document.createElement("div");
      r.className = "role";
      r.textContent = role === "user" ? "Вы" : "АКСИ";
      var b = document.createElement("div");
      b.className = "body";
      b.textContent = body;
      card.appendChild(r);
      card.appendChild(b);
      if (meta) {
        var m = document.createElement("div");
        m.className = "meta";
        m.innerHTML = meta;
        card.appendChild(m);
      }
    }
    $("feed").appendChild(card);
    $("feed").scrollTop = $("feed").scrollHeight;
    return card;
  }
  function llmReady() {
    try {
      if (!W) return false;
      if (typeof W.ready === "function") return !!W.ready();
      var st = W.status && W.status();
      return !!(st && st.ready);
    } catch (e) { return false; }
  }
  function paint() {
    chip("cCore", S ? ("ядро " + (S.version || "").replace("super-", "")) : "ядро нет", S ? "ok" : "off");
    chip("cExo", fabric && fabric.exo ? "permit on" : "permit…", fabric && fabric.exo ? "ok" : "warn");
    if (llmReady()) chip("cLlm", "модель on", "ok");
    else if (W && W.status && W.status().loading) chip("cLlm", "модель…", "warn");
    else chip("cLlm", "модель off", "off");
  }
  function setBar(p) { $("bar").style.width = Math.min(100, Math.round((p || 0) * 100)) + "%"; }

  async function boot() {
    if (!S) {
      feed("sys", "Не загрузилось ядро. Обновите страницу (Ctrl+Shift+R).");
      paint();
      return null;
    }
    if (!fabric) {
      fabric = new S.SuperFabric();
      fabric.loadMemory();
    }
    if (!fabric.booted) {
      fabric.boot(6, 2);
      fabric.startScheduler(160);
      try { await fabric.attachExocortex(); } catch (e) {}
      feed("sys", "Готов. Спросите что угодно — ответ с допуском и чеком.");
    }
    paint();
    return fabric;
  }

  function metaHTML(result, stages) {
    var permit = (result && result.permit) || "—";
    var src = (result && result.source) || "—";
    var q = result && result.quantum && result.quantum.bits ? result.quantum.bits : "—";
    var rid = result && result.receipt_id ? String(result.receipt_id).slice(0, 18) : "—";
    var st = (stages || []).map(function (s) { return s.name; }).join(" → ");
    var pcls = permit === "ALLOW" ? "allow" : (permit === "BLOCK" ? "block" : "");
    return "<div>Источник: <b>" + src + "</b></div>" +
      "<div>Допуск: <b class=\"" + pcls + "\">" + permit + "</b></div>" +
      "<div>Quantum: <b>|" + q + "⟩</b> · чек: <b>" + rid + "</b></div>" +
      (st ? "<div>Путь: " + st + "</div>" : "");
  }

  async function ask() {
    var text = $("q").value.trim();
    if (!text || busy) return;
    busy = true;
    $("send").disabled = true;
    $("q").value = "";
    feed("user", text);
    history.push({ role: "user", content: text });

    var f = await boot();
    if (!f) {
      busy = false;
      $("send").disabled = false;
      return;
    }

    if (llmReady() && W && W.complete) {
      var thinking = feed("bot", "Думаю…");
      try {
        var r = await Promise.race([
          W.complete(text, {
            system: "Ты АКСИ — полезный русскоязычный агент. Отвечай ясно и честно. Если не знаешь — скажи. Не выдумывай факты.",
            history: history.slice(-12),
            max_tokens: 500
          }),
          new Promise(function (res) { setTimeout(function () { res({ text: "" }); }, 45000); })
        ]);
        var t = (r && r.text) ? String(r.text).trim() : "";
        if (t.length > 15) {
          var job = f.submit({ type: "agent", prompt: text, size: 12 });
          var done = await f.waitJob(job, 20000);
          thinking.remove();
          feed("bot", t, metaHTML(done && done.result ? Object.assign({}, done.result, { source: "webllm" }) : { source: "webllm", permit: "ALLOW" }, done && done.stages));
          history.push({ role: "assistant", content: t });
          busy = false;
          $("send").disabled = false;
          paint();
          return;
        }
      } catch (e) {}
      thinking.remove();
    }

    var pending = feed("bot", "Считаю…");
    var job = f.submit({ type: "agent", prompt: text, size: 36 });
    var done = await f.waitJob(job, 90000);
    pending.remove();
    busy = false;
    $("send").disabled = false;
    paint();

    if (done && done.result) {
      var ans = done.result.answer || done.result.report || done.result.error || "Нет ответа";
      feed("bot", ans, metaHTML(done.result, done.stages));
      history.push({ role: "assistant", content: ans });
    } else {
      feed("bot", "Таймаут. Попробуйте ещё раз.");
    }
  }

  $("send").onclick = ask;
  $("q").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
  });

  $("btnClear").onclick = function () {
    history = [];
    $("feed").innerHTML = "";
    feed("sys", "История очищена.");
  };

  $("btnVerify").onclick = async function () {
    var f = await boot();
    if (!f) return;
    var job = f.submit({ type: "agent", prompt: "12*12", size: 16 });
    var done = await f.waitJob(job, 25000);
    var ans = (done && done.result && (done.result.answer || done.result.report)) || "";
    var ok = ans.indexOf("144") >= 0;
    var chain = null;
    try { chain = await f.verifyExoChain(); } catch (e) {}
    feed("sys", (ok ? "✓ Математика OK" : "✗ Математика fail") +
      " · цепочка " + (chain && chain.ok ? "OK" : "—") +
      " · " + (done && done.stages || []).map(function (s) { return s.name; }).join(" → "));
  };

  $("btnModel").onclick = async function () {
    if (!W) {
      feed("sys", "WebLLM не подключен к странице.");
      return;
    }
    $("btnModel").disabled = true;
    feed("sys", "Загрузка локальной модели (нужен Chrome + WebGPU, 1–3 мин)…");
    try {
      await (W.load || W.loadModel || W.autoLoad).call(W, null, function (p, msg) {
        var progress = typeof p === "number" ? p : (p && p.progress) || 0;
        if (progress > 1) progress = progress / 100;
        setBar(progress);
        if (msg) chip("cLlm", String(msg).slice(0, 28), "warn");
      });
      setBar(llmReady() ? 1 : 0);
      feed("sys", llmReady() ? ("Модель готова: " + ((W.status && W.status().model) || "ok")) : "Модель не поднялась — работаем на Mind.");
    } catch (e) {
      feed("sys", "Модель: " + (e.message || e));
    }
    $("btnModel").disabled = false;
    paint();
  };

  if (W) {
    window.addEventListener("aksi-webllm-progress", function (e) {
      var d = e.detail || {};
      var p = typeof d.progress === "number" ? d.progress : 0;
      if (p > 1) p = p / 100;
      setBar(p);
      paint();
    });
  }

  boot();
})();
</script>
</body>
</html>
