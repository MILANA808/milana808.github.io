<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>АКСИ Super Agent</title>
<link rel="canonical" href="https://milana808.github.io/super/"/>
<meta name="theme-color" content="#070a12"/>
<style>
:root{--bg:#070a12;--p:#0d121c;--l:#1c2536;--t:#eef2f8;--m:#8b97ab;--a:#5eead4;--q:#a78bfa;--ok:#34d399;--bad:#f87171;--gpu:#38bdf8}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,sans-serif}
.shell{max-width:820px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{padding:10px 14px 8px;border-bottom:1px solid var(--l);background:rgba(7,10,18,.94);position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:1.05rem}
header h1 span{background:linear-gradient(90deg,var(--a),var(--q),var(--gpu));-webkit-background-clip:text;background-clip:text;color:transparent}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.meta span{font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--l);color:var(--m)}
.meta span.on{border-color:var(--ok);color:var(--ok)}
.meta span.gpu{border-color:var(--gpu);color:var(--gpu)}
.meta span.bad{border-color:var(--bad);color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tools button{border:1px solid var(--l);background:transparent;color:var(--t);border-radius:8px;padding:7px 10px;font:12px system-ui;font-weight:600;cursor:pointer}
.tools button.primary{background:linear-gradient(135deg,var(--a),var(--q));border:0;color:#041016}
.tools button:disabled{opacity:.4}
.bar{height:3px;background:#121820;border-radius:2px;overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gpu),var(--a))}
.cluster{display:none;padding:8px 14px;border-bottom:1px solid var(--l);background:#0a0e16;font:11px/1.4 ui-monospace,monospace;color:var(--m);max-height:140px;overflow:auto;white-space:pre-wrap}
.cluster.on{display:block}
#chat{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word;font-size:14px}
.msg.user{align-self:flex-end;background:#152033;border:1px solid var(--l)}
.msg.bot{align-self:flex-start;background:var(--p);border:1px solid var(--l)}
.msg.sys{align-self:center;border:0;color:var(--m);font-size:12px;padding:4px;background:transparent}
.msg .src{display:block;margin-top:6px;font-size:11px;color:var(--m)}
.composer{border-top:1px solid var(--l);padding:10px 12px 14px;background:rgba(7,10,18,.96)}
.composer textarea{width:100%;min-height:52px;max-height:120px;resize:vertical;background:#0a0e16;color:var(--t);border:1px solid var(--l);border-radius:12px;padding:10px 12px;font:inherit}
.composer .row{display:flex;gap:8px;margin-top:8px}
.composer button#send{flex:1;border:0;border-radius:11px;padding:12px;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--q));color:#041016}
.composer button#send:disabled{opacity:.45}
.hint{font-size:11px;color:var(--m);margin-top:6px}
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1><span>АКСИ Super Agent</span></h1>
    <div class="meta">
      <span id="cBoot">boot…</span>
      <span id="cCluster">cluster: —</span>
      <span id="cLlm">llm: —</span>
      <span id="cMind">mind: —</span>
      <span id="cExo">exo: —</span>
    </div>
    <div class="tools">
      <button type="button" class="primary" id="loadLlm">Загрузить ИИ-модель</button>
      <button type="button" id="toggleCluster">Кластер</button>
      <button type="button" id="bench">Bench</button>
      <button type="button" id="clearChat">Очистить</button>
      <button type="button" id="verify">Проверить</button>
    </div>
    <div class="bar"><i id="llmBar"></i></div>
    <div class="hint" id="llmHint">Кластер + Mind всегда. WebLLM — живая генерация (WebGPU).</div>
  </header>
  <div class="cluster" id="clusterBox">кластер…</div>
  <div id="chat"></div>
  <div class="composer">
    <textarea id="q" placeholder="Задача агенту АКСИ…" rows="2"></textarea>
    <div class="row"><button type="button" id="send">Отправить в кластер</button></div>
    <div class="hint">pipeline: plan → quantum → compute → mind/WebLLM → permit → receipt</div>
  </div>
</div>
<script src="/aksi-exocortex.js?v=1"></script>
<script src="/aksi-webllm.js?v=44"></script>
<script src="/aksi-super-mind.js?v=5"></script>
<script src="/aksi-super.js?v=30"></script>
<script>
(function(){
"use strict";
var S=window.AKSI_SUPER, M=window.AKSI_SUPER_MIND, W=window.AKSI_WEBLLM;
var fabric=null, history=[], busy=false;
function $(id){return document.getElementById(id);}
function chip(id,t,cls){var el=$(id);if(!el)return;el.textContent=t;el.className=cls||"";}
function addMsg(role,text){var d=document.createElement("div");d.className="msg "+role;d.textContent=text;$("chat").appendChild(d);$("chat").scrollTop=$("chat").scrollHeight;return d;}
function llmReady(){try{if(!W)return false;if(typeof W.ready==="function")return!!W.ready();var st=W.status&&W.status();return!!(st&&st.ready);}catch(e){return false;}}
function paintLlm(detail){
  var st=null;try{st=W&&W.status&&W.status();}catch(e){}
  var prog=(detail&&typeof detail.progress==="number")?detail.progress:(st&&st.progress)||0;
  if(prog>1)prog=prog/100;
  $("llmBar").style.width=Math.min(100,Math.round(prog*100))+"%";
  if(llmReady()){chip("cLlm","llm: ON","on");$("llmHint").textContent="WebLLM готов · ответы с модели";}
  else if(st&&st.loading){chip("cLlm","llm: loading…","gpu");$("llmHint").textContent=(detail&&detail.message)||st.message||"Загрузка…";}
  else if(!W){chip("cLlm","llm: нет","bad");}
  else{chip("cLlm","llm: off","");$("llmHint").textContent=(st&&st.error)||"Загрузите ИИ-модель (Chrome+WebGPU)";}
}
function paintCluster(){
  if(!fabric)return;
  var sn=fabric.snapshot();
  chip("cBoot",sn.booted?"ONLINE":"off",sn.booted?"on":"");
  chip("cCluster",sn.nodes+"n/"+sn.gpus+"gpu · "+sn.avg_util.toFixed(0)+"%",sn.avg_util>5?"gpu":"on");
  chip("cExo",sn.exo?"exo: ON":"exo: off",sn.exo?"on":"bad");
  chip("cMind",M?"mind "+(M.version||""):"mind off",M?"on":"bad");
  paintLlm();
  if($("clusterBox").classList.contains("on")){
    var lines=[];
    lines.push(fabric.clusterReport?fabric.clusterReport():("Super "+sn.version));
    lines.push("--- racks ---");
    sn.nodes_detail.forEach(function(n){
      lines.push(n.id+" ["+n.role+"] load="+n.load.toFixed(0)+"% gpus="+n.gpus.map(function(g){return g.util.toFixed(0);}).join(","));
    });
    $("clusterBox").textContent=lines.join("\n");
  }
}
async function ensure(){
  if(!S){addMsg("sys","Super не загружен — Ctrl+Shift+R");return null;}
  if(!fabric){
    fabric=new S.SuperFabric();fabric.loadMemory();fabric.onTick=paintCluster;
    fabric.onEvent=function(ev){if(ev.stage==="error")addMsg("sys","error: "+(ev.detail&&ev.detail.error));};
  }
  if(!fabric.booted){
    fabric.boot(12,4);fabric.startScheduler(160);
    try{await fabric.attachExocortex();}catch(e){}
    addMsg("sys","Кластер "+S.version+" · 12 nodes × 4 GPU · Mind "+(M&&M.version));
  }
  paintCluster();return fabric;
}
$("toggleCluster").onclick=function(){$("clusterBox").classList.toggle("on");paintCluster();};
$("loadLlm").onclick=async function(){
  if(!W){addMsg("sys","WebLLM скрипт нет");return;}
  $("loadLlm").disabled=true;addMsg("sys","Загрузка модели (1–3 мин)…");
  try{
    await (W.load||W.loadModel||W.autoLoad).call(W,null,function(p,msg){
      var progress=typeof p==="number"?p:(p&&p.progress)||0;paintLlm({progress:progress,message:msg||(p&&p.text)});
    });
    addMsg("sys",llmReady()?"Модель ON: "+((W.status&&W.status().model)||"ok"):"Модель не поднялась");
  }catch(e){addMsg("sys","WebLLM: "+(e.message||e));}
  $("loadLlm").disabled=false;paintCluster();
};
$("bench").onclick=async function(){
  var f=await ensure();if(!f)return;addMsg("sys","Bench кластера…");
  var job=f.submit({type:"cluster_bench",size:64});
  var d=await f.waitJob(job,20000);
  var r=d&&d.result;
  addMsg("sys",r?("Bench OK flops="+r.flops+" ms="+Math.round(r.ms||0)+" nodes="+r.nodes):"Bench fail");
  paintCluster();
};
$("clearChat").onclick=function(){history=[];$("chat").innerHTML="";addMsg("sys","Чат очищен");};
$("verify").onclick=async function(){
  var f=await ensure();if(!f)return;
  var job=f.submit({type:"agent",prompt:"12*12",size:16});
  var d=await f.waitJob(job,20000);
  var ans=(d&&d.result&&(d.result.answer||d.result.report))||"";
  var ok=ans.indexOf("144")>=0;
  var chain=null;try{chain=await f.verifyExoChain();}catch(e){}
  addMsg("sys",(ok?"PASS":"FAIL")+" math · stages "+(d&&d.stages||[]).map(function(s){return s.name;}).join("→")+" · chain "+(chain&&chain.ok?"OK":"—"));
};
async function send(){
  var text=$("q").value.trim();if(!text||busy)return;
  busy=true;$("send").disabled=true;$("q").value="";
  addMsg("user",text);history.push({role:"user",content:text});
  var f=await ensure();if(!f){busy=false;$("send").disabled=false;return;}
  var wait=addMsg("bot",llmReady()?"Кластер + WebLLM…":"Кластер + Mind…");
  if(llmReady()&&W&&W.complete){
    try{
      var r=await Promise.race([
        W.complete(text,{system:"Ты АКСИ-агент. Русский, полно, по делу. Не выдумывай.",history:history.slice(-12),max_tokens:500}),
        new Promise(function(res){setTimeout(function(){res({text:""});},45000);})
      ]);
      var t=(r&&r.text)?String(r.text).trim():"";
      if(t.length>15){
        wait.textContent=t;
        var s=document.createElement("span");s.className="src";s.textContent="webllm · agent · cluster "+f.snapshot().nodes+"n";wait.appendChild(s);
        history.push({role:"assistant",content:t});
        f.submit({type:"agent",prompt:text,size:16});
        busy=false;$("send").disabled=false;paintCluster();return;
      }
    }catch(e){}
  }
  var job=f.submit({type:"agent",prompt:text,size:40});
  var done=await f.waitJob(job,90000);
  busy=false;$("send").disabled=false;paintCluster();
  if(done&&done.result){
    var ans=done.result.answer||done.result.report||done.result.error||"Пусто";
    wait.textContent=ans;
    var s=document.createElement("span");s.className="src";
    s.textContent=(done.result.source||done.status)+" · "+(done.stages||[]).map(function(x){return x.name;}).join("→")+" · "+(done.node||"");
    wait.appendChild(s);history.push({role:"assistant",content:ans});
  }else wait.textContent="Таймаут кластера.";
}
$("send").onclick=send;
$("q").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
if(W)window.addEventListener("aksi-webllm-progress",function(e){paintLlm(e.detail||{});});
ensure().then(function(){paintCluster();});
})();
</script>
</body>
</html>
