<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>АКСИ Agent</title>
<link rel="canonical" href="https://milana808.github.io/super/"/>
<meta name="theme-color" content="#070a12"/>
<style>
:root{--bg:#070a12;--p:#0d121c;--l:#1c2536;--t:#eef2f8;--m:#8b97ab;--a:#5eead4;--q:#a78bfa;--ok:#34d399;--bad:#f87171;--gpu:#38bdf8}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,sans-serif}
.shell{max-width:760px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:0 0 env(safe-area-inset-bottom)}
header{padding:12px 14px 8px;border-bottom:1px solid var(--l);background:rgba(7,10,18,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:1.05rem;letter-spacing:.02em}
header h1 span{background:linear-gradient(90deg,var(--a),var(--q));-webkit-background-clip:text;background-clip:text;color:transparent}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.meta span{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--l);color:var(--m)}
.meta span.on{border-color:var(--ok);color:var(--ok)}
.meta span.gpu{border-color:var(--gpu);color:var(--gpu)}
.meta span.bad{border-color:var(--bad);color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tools button{border:1px solid var(--l);background:transparent;color:var(--t);border-radius:9px;padding:8px 10px;font:12px system-ui;font-weight:600;cursor:pointer}
.tools button.primary{background:linear-gradient(135deg,var(--a),var(--q));border:0;color:#041016}
.tools button:disabled{opacity:.4}
.bar{height:4px;background:#121820;border-radius:3px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gpu),var(--a))}
#chat{flex:1;overflow:auto;padding:12px 14px 8px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5}
.msg.user{align-self:flex-end;background:#152033;border:1px solid var(--l)}
.msg.bot{align-self:flex-start;background:var(--p);border:1px solid var(--l)}
.msg.sys{align-self:center;background:transparent;border:0;color:var(--m);font-size:12px;padding:4px}
.msg .src{display:block;margin-top:6px;font-size:11px;color:var(--m)}
.composer{border-top:1px solid var(--l);padding:10px 12px 14px;background:rgba(7,10,18,.96)}
.composer textarea{width:100%;min-height:52px;max-height:140px;resize:vertical;background:#0a0e16;color:var(--t);border:1px solid var(--l);border-radius:12px;padding:10px 12px;font:inherit}
.composer .row{display:flex;gap:8px;margin-top:8px;align-items:center}
.composer button#send{flex:1;border:0;border-radius:11px;padding:12px;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--q));color:#041016}
.composer button#send:disabled{opacity:.45}
.hint{font-size:11px;color:var(--m);margin-top:6px}
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1><span>АКСИ Agent</span></h1>
    <div class="meta">
      <span id="cBoot">boot…</span>
      <span id="cLlm">llm: —</span>
      <span id="cMind">mind: —</span>
      <span id="cExo">exo: —</span>
    </div>
    <div class="tools">
      <button type="button" class="primary" id="loadLlm">Загрузить ИИ-модель</button>
      <button type="button" id="clearChat">Очистить чат</button>
      <button type="button" id="verify">Проверить</button>
    </div>
    <div class="bar"><i id="llmBar"></i></div>
    <div class="hint" id="llmHint">Без модели отвечает Mind. С WebGPU — локальная LLM в браузере.</div>
  </header>
  <div id="chat"></div>
  <div class="composer">
    <textarea id="q" placeholder="Сообщение агенту АКСИ…" rows="2"></textarea>
    <div class="row"><button type="button" id="send">Отправить</button></div>
    <div class="hint">В браузере: квантизованные модели ~0.5–1.5B (не облачные триллионы). Это максимум offline WebGPU.</div>
  </div>
</div>
<script src="/aksi-exocortex.js?v=1"></script>
<script src="/aksi-webllm.js?v=44"></script>
<script src="/aksi-super-mind.js?v=5"></script>
<script src="/aksi-super.js?v=23"></script>
<script>
(function(){
"use strict";
var S=window.AKSI_SUPER, M=window.AKSI_SUPER_MIND, X=window.AKSI_EXOCORTEX, W=window.AKSI_WEBLLM;
var fabric=null, history=[], busy=false;
function $(id){return document.getElementById(id);}
function chip(id,t,cls){var el=$(id);if(!el)return;el.textContent=t;el.className=cls||"";}
function addMsg(role,text,src){
  var d=document.createElement("div");d.className="msg "+role;d.textContent=text;
  if(src){var s=document.createElement("span");s.className="src";s.textContent=src;d.appendChild(s);}
  $("chat").appendChild(d);$("chat").scrollTop=$("chat").scrollHeight;return d;
}
function llmReady(){try{if(!W)return false;if(typeof W.ready==="function")return!!W.ready();var st=W.status&&W.status();return!!(st&&st.ready);}catch(e){return false;}}
function paintLlm(detail){
  var st=null;try{st=W&&W.status&&W.status();}catch(e){}
  var prog=(detail&&typeof detail.progress==="number")?detail.progress:(st&&st.progress)||0;
  if(prog>1)prog=prog/100;
  $("llmBar").style.width=Math.min(100,Math.round(prog*100))+"%";
  if(llmReady()){chip("cLlm","llm: ON · "+((st&&st.model)||"").replace(/-Instruct.*$/,""),"on");$("llmHint").textContent="Локальная модель готова. Ответы через WebLLM.";}
  else if(st&&st.loading){chip("cLlm","llm: loading…","gpu");$("llmHint").textContent=(detail&&detail.message)||(st&&st.message)||"Загрузка…";}
  else if(!W){chip("cLlm","llm: нет скрипта","bad");$("llmHint").textContent="aksi-webllm.js не загрузился.";}
  else{chip("cLlm","llm: off","");$("llmHint").textContent=(st&&st.error)||"Нажмите «Загрузить ИИ-модель». Нужен WebGPU (Chrome).";}
}
function paint(){
  var sn=fabric?fabric.snapshot():null;
  chip("cBoot",sn&&sn.booted?"ONLINE":"boot…",sn&&sn.booted?"on":"");
  chip("cExo",sn&&sn.exo?"exo: ON":"exo: off",sn&&sn.exo?"on":"bad");
  chip("cMind",M?"mind "+(M.version||""):"mind off",M?"on":"bad");
  paintLlm();
}
async function ensure(){
  if(!S){addMsg("sys","Super не загрузился — Ctrl+Shift+R");return null;}
  if(!fabric){fabric=new S.SuperFabric();fabric.loadMemory();}
  if(!fabric.booted){fabric.boot(6,2);fabric.startScheduler(180);try{await fabric.attachExocortex();}catch(e){}}
  paint();return fabric;
}
async function loadModel(){
  if(!W){addMsg("sys","WebLLM скрипт не найден");return;}
  $("loadLlm").disabled=true;
  addMsg("sys","Загружаю локальную модель (первый раз 1–3 мин)…");
  var loadFn=W.load||W.loadModel||W.autoLoad;
  try{
    await loadFn.call(W,null,function(p,msg){
      var progress=typeof p==="number"?p:(p&&p.progress)||0;
      paintLlm({progress:progress,message:msg||(p&&p.text)});
    });
    if(llmReady())addMsg("sys","Модель готова: "+((W.status&&W.status().model)||"ok"));
    else addMsg("sys","Модель не поднялась — работаю на Mind.");
  }catch(e){addMsg("sys","WebLLM: "+(e.message||e)+" — Mind доступен.");}
  $("loadLlm").disabled=false;paint();
}
async function send(){
  var text=$("q").value.trim();if(!text||busy)return;
  busy=true;$("send").disabled=true;$("q").value="";
  addMsg("user",text);history.push({role:"user",content:text});
  var f=await ensure();if(!f){busy=false;$("send").disabled=false;return;}
  var wait=addMsg("bot",llmReady()?"Думаю (WebLLM)…":"Думаю (Mind)…");
  if(llmReady()&&W&&W.complete){
    try{
      var sys="Ты АКСИ — суверенный агент. Отвечай на русском, по делу, полно. Если не знаешь — скажи. Не придумывай факты.";
      var r=await Promise.race([
        W.complete(text,{system:sys,history:history.slice(-12),max_tokens:500}),
        new Promise(function(res){setTimeout(function(){res({text:""});},45000);})
      ]);
      var t=(r&&r.text)?String(r.text).trim():"";
      if(t.length>15){
        wait.textContent=t;
        var s=document.createElement("span");s.className="src";s.textContent="source: webllm · agent";wait.appendChild(s);
        history.push({role:"assistant",content:t});
        try{f.submit({type:"mind",prompt:text,size:8});}catch(e){}
        busy=false;$("send").disabled=false;paint();return;
      }
    }catch(e){}
  }
  var job=f.submit({type:"mind",prompt:text,size:32});
  var t0=Date.now();
  var iv=setInterval(function(){
    var done=f.done.find(function(j){return j.id===job.id;});
    if(done||Date.now()-t0>90000){
      clearInterval(iv);busy=false;$("send").disabled=false;paint();
      if(done&&done.result){
        var ans=done.result.answer||done.result.report||done.result.error||"Пусто";
        wait.textContent=ans;
        var s=document.createElement("span");s.className="src";
        s.textContent="source: "+(done.result.source||done.status)+" · "+(done.stages||[]).map(function(x){return x.name;}).join("→");
        wait.appendChild(s);history.push({role:"assistant",content:ans});
      }else wait.textContent="Таймаут. Ещё раз.";
    }
  },80);
}
$("send").onclick=send;
$("q").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
$("loadLlm").onclick=loadModel;
$("clearChat").onclick=function(){history=[];$("chat").innerHTML="";addMsg("sys","Чат очищен.");};
$("verify").onclick=async function(){
  var f=await ensure();if(!f)return;
  addMsg("sys","Проверка: Super="+(S&&S.version)+" Mind="+(M&&M.version)+" WebLLM="+(llmReady()?"READY":"off")+" Exo="+(f.exo?"on":"off"));
  var job=f.submit({type:"mind",prompt:"12*12",size:8});
  var t0=Date.now();
  var iv=setInterval(async function(){
    var d=f.done.find(function(j){return j.id===job.id;});
    if(d||Date.now()-t0>15000){
      clearInterval(iv);
      var ok=d&&d.status==="done"&&String(d.result&&d.result.answer||"").indexOf("144")>=0;
      var chain=null;try{chain=await f.verifyExoChain();}catch(e){}
      addMsg("sys",(ok?"PASS math":"FAIL math")+" · chain "+(chain&&chain.ok?"OK count="+chain.count:"—"));
    }
  },50);
};
if(W){window.addEventListener("aksi-webllm-progress",function(e){paintLlm(e.detail||{});});window.addEventListener("aksi:webllm-ready",function(){paintLlm();});}
ensure().then(function(){addMsg("sys","АКСИ Agent онлайн. Нажми «Загрузить ИИ-модель» для живой LLM.");paint();});
})();
</script>
</body>
</html>
