<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>АКСИ Super · Cluster</title>
<link rel="canonical" href="https://milana808.github.io/super/"/>
<meta name="description" content="АКСИ Super: браузерный кластер, quantum seed, Mind/WebLLM, Permit. Offline-first command center."/>
<meta name="theme-color" content="#04060a"/>
<style>
:root{
  --bg:#04060a;--panel:#0c111a;--line:#1a2332;--text:#eef3fb;--muted:#8490a3;
  --c:#2dd4bf;--v:#818cf8;--q:#f472b6;--ok:#34d399;--bad:#f87171;--gpu:#38bdf8;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font:14px/1.45 system-ui,-apple-system,sans-serif}
body{background:
  radial-gradient(1000px 500px at 0% 0%,rgba(45,212,191,.1),transparent 50%),
  radial-gradient(800px 400px at 100% 0%,rgba(129,140,248,.1),transparent 45%),
  var(--bg)}
.app{max-width:960px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
h1 span{background:linear-gradient(100deg,var(--c),var(--v),var(--q));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:4px 0 0;font-size:12px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:10px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.on{border-color:rgba(52,211,153,.45);color:var(--ok);background:rgba(52,211,153,.08)}
.pill.gpu{border-color:rgba(56,189,248,.4);color:var(--gpu)}
.pill.q{border-color:rgba(244,114,182,.4);color:var(--q)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);
  border-radius:9px;padding:7px 10px;font:12px system-ui;font-weight:600;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.06)}
.btn.pri{border:0;background:linear-gradient(135deg,var(--c),var(--v));color:#041016}
.btn:disabled{opacity:.4}
.main{flex:1;display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:800px){.main{grid-template-columns:280px 1fr}}
.side{border-bottom:1px solid var(--line);padding:12px;background:rgba(12,17,26,.6)}
@media(min-width:800px){.side{border-bottom:0;border-right:1px solid var(--line)}}
.side h2{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.node{border:1px solid var(--line);border-radius:8px;padding:5px 3px;text-align:center;background:var(--panel)}
.node.hot{border-color:rgba(45,212,191,.5);box-shadow:0 0 10px rgba(45,212,191,.15)}
.node .id{font-size:9px;color:var(--muted)}
.node .u{font-size:11px;font-weight:700;color:var(--gpu)}
.metrics{margin-top:12px;font:11px/1.5 ui-monospace,monospace;color:var(--muted);white-space:pre-wrap}
.qbox{margin-top:12px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.qbox .ql{font-size:10px;color:var(--q);text-transform:uppercase;letter-spacing:.06em}
.qbox .qv{font:13px ui-monospace,monospace;margin-top:4px;color:var(--text)}
.chat-wrap{display:flex;flex-direction:column;min-height:420px}
#feed{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;max-height:55vh}
.msg{max-width:92%;padding:10px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.msg.user{align-self:flex-end;background:#152033;border:1px solid var(--line)}
.msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.msg.sys{align-self:center;border:0;background:0;color:var(--muted);font-size:12px;padding:2px}
.msg .meta{display:block;margin-top:6px;font-size:10px;color:var(--muted)}
.stage-line{padding:0 14px 6px;font-size:11px;color:var(--muted);min-height:16px}
.composer{padding:10px 12px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
.composer input{flex:1;border:1px solid var(--line);border-radius:10px;background:#0a0e16;color:var(--text);padding:11px;font:inherit}
.composer button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;
  background:linear-gradient(135deg,var(--c),var(--v));color:#041016}
.composer button:disabled{opacity:.4}
.hint{font-size:11px;color:var(--muted);padding:0 14px 10px}
.hint a{color:var(--c);text-decoration:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div>
        <h1><span>АКСИ Super</span></h1>
        <div class="sub">Кластер · Quantum · Mind/WebLLM · Permit — в браузере</div>
      </div>
    </div>
    <div class="pills">
      <span class="pill" id="pBoot">boot…</span>
      <span class="pill" id="pCluster">cluster</span>
      <span class="pill" id="pQ">quantum</span>
      <span class="pill" id="pMind">mind</span>
      <span class="pill" id="pLlm">llm</span>
      <span class="pill" id="pExo">exo</span>
    </div>
    <div class="tools">
      <button type="button" class="btn pri" id="btnBoot">Boot 16×4</button>
      <button type="button" class="btn" id="btnBench">Bench</button>
      <button type="button" class="btn" id="btnQ">Quantum pulse</button>
      <button type="button" class="btn" id="btnLlm">Загрузить LLM</button>
      <button type="button" class="btn" id="btnVerify">Verify</button>
      <button type="button" class="btn" id="btnClear">Clear</button>
    </div>
  </header>
  <div class="main">
    <aside class="side">
      <h2>Nodes</h2>
      <div class="nodes" id="nodes"></div>
      <div class="metrics" id="metrics">ожидание boot…</div>
      <div class="qbox">
        <div class="ql">Last quantum</div>
        <div class="qv" id="qView">—</div>
      </div>
    </aside>
    <div class="chat-wrap">
      <div id="feed"></div>
      <div class="stage-line" id="stage"></div>
      <div class="composer">
        <input id="q" placeholder="Задача кластеру / вопрос ИИ…" autocomplete="off"/>
        <button type="button" id="send">Run</button>
      </div>
      <div class="hint">pipeline: plan → quantum → compute → mind/WebLLM → permit → receipt · <a href="/super/gate.html">Gate</a></div>
    </div>
  </div>
</div>
<script src="/aksi-exocortex.js?v=1"></script>
<script src="/aksi-webllm.js?v=44"></script>
<script src="/aksi-super-mind.js?v=6"></script>
<script src="/aksi-super.js?v=30"></script>
<script>
(function(){
"use strict";
var S=window.AKSI_SUPER, M=window.AKSI_SUPER_MIND, W=window.AKSI_WEBLLM;
var fabric=null, busy=false, lastQ=null;
function $(id){return document.getElementById(id);}
function pill(id,t,cls){var el=$(id);el.textContent=t;el.className="pill"+(cls?" "+cls:"");}
function add(role,text,meta){
  var d=document.createElement("div");d.className="msg "+role;d.textContent=text;
  if(meta){var m=document.createElement("span");m.className="meta";m.textContent=meta;d.appendChild(m);}
  $("feed").appendChild(d);$("feed").scrollTop=$("feed").scrollHeight;return d;
}
function setStage(t){$("stage").textContent=t||"";}
function llmReady(){
  try{if(!W)return false;if(W.ready)return!!W.ready();var st=W.status&&W.status();return!!(st&&st.ready);}catch(e){return false;}
}
function paint(){
  if(!fabric)return;
  var sn=fabric.snapshot();
  pill("pBoot",sn.booted?"ONLINE":"off",sn.booted?"on":"");
  pill("pCluster",sn.nodes+"n/"+sn.gpus+"gpu · "+sn.avg_util.toFixed(0)+"%",sn.avg_util>5?"gpu":"on");
  pill("pExo",sn.exo?"exo on":"exo off",sn.exo?"on":"");
  pill("pMind",M?"mind "+(M.version||"").replace("mind-",""):"mind","on");
  pill("pLlm",llmReady()?"llm on":(W?"llm off":"llm —"),llmReady()?"on":"");
  if(lastQ){pill("pQ","|"+(lastQ.bits||"????")+"⟩ S="+(lastQ.entropy!=null?lastQ.entropy.toFixed(2):"—"),"q");
    $("qView").textContent="|"+(lastQ.bits||"")+"⟩  entropy "+(lastQ.entropy!=null?lastQ.entropy.toFixed(3):"—")+"  sumP "+(lastQ.sumP!=null?lastQ.sumP.toFixed(4):"—");
  }
  var box=$("nodes");box.innerHTML="";
  (sn.nodes_detail||[]).forEach(function(n){
    var avg=n.gpus.reduce(function(a,g){return a+g.util;},0)/Math.max(1,n.gpus.length);
    var el=document.createElement("div");
    el.className="node"+(avg>12?" hot":"");
    el.innerHTML="<div class=\"id\">"+n.id.replace("node-","n")+"</div><div class=\"u\">"+avg.toFixed(0)+"%</div>";
    box.appendChild(el);
  });
  $("metrics").textContent=(fabric.clusterReport?fabric.clusterReport():"")
    +"\nflops "+sn.stats.flops+" · agents "+(sn.stats.agents||0)
    +"\nqueue "+sn.queue+" run "+sn.running+" done "+sn.done;
}
async function ensure(nodes,gpus){
  if(!S){add("sys","Super не загружен — Ctrl+Shift+R");return null;}
  if(!fabric){
    fabric=new S.SuperFabric();
    fabric.loadMemory();
    fabric.onTick=paint;
    fabric.onEvent=function(ev){
      if(ev.stage==="stage"&&ev.detail&&ev.detail.name){
        var map={plan:"plan",quantum:"quantum",compute:"compute",mind:"mind",permit:"permit",receipt:"receipt",done:"done"};
        setStage("stage · "+(map[ev.detail.name]||ev.detail.name));
      }
    };
  }
  if(!fabric.booted){
    fabric.boot(nodes||16,gpus||4);
    fabric.startScheduler(120);
    try{await fabric.attachExocortex();}catch(e){}
    add("sys","Кластер "+S.version+" · "+(nodes||16)+"×"+(gpus||4)+" · Mind "+(M&&M.version||"—"));
  }
  paint();
  return fabric;
}
$("btnBoot").onclick=async function(){
  if(fabric&&fabric.booted){fabric.scale(16,4);add("sys","Rescale 16×4");paint();return;}
  await ensure(16,4);
};
$("btnBench").onclick=async function(){
  var f=await ensure(16,4);if(!f)return;
  setStage("bench…");
  var d=await f.waitJob(f.submit({type:"cluster_bench",size:64}),25000);
  var r=d&&d.result;
  add("sys",r?"Bench OK · flops "+r.flops+" · "+Math.round(r.ms||0)+"ms · nodes "+r.nodes:"Bench fail");
  setStage("");paint();
};
$("btnQ").onclick=async function(){
  var f=await ensure(16,4);if(!f)return;
  if(S.quantumCollapse){lastQ=S.quantumCollapse("pulse|"+Date.now());}
  else {
    var d=await f.waitJob(f.submit({type:"quantum",prompt:"pulse-"+Date.now()}),10000);
    if(d&&d.result)lastQ={bits:d.result.bits,entropy:d.result.entropy,sumP:d.result.sumP};
    else if(d&&d.quantum) lastQ=d.quantum;
  }
  add("sys","Quantum |"+((lastQ&&lastQ.bits)||"?")+"⟩ S="+((lastQ&&lastQ.entropy)!=null?lastQ.entropy.toFixed(3):"—"));
  paint();
};
$("btnLlm").onclick=async function(){
  if(!W){add("sys","WebLLM нет");return;}
  $("btnLlm").disabled=true;add("sys","Загрузка LLM (WebGPU)…");
  try{
    await (W.load||W.loadModel||W.autoLoad).call(W,null,function(p){
      var pr=typeof p==="number"?p:(p&&p.progress)||0;
      setStage("llm "+Math.round((pr>1?pr:pr*100))+"%");
    });
    add("sys",llmReady()?"LLM online: "+((W.status&&W.status().model)||"ok"):"LLM не поднялась — Mind работает");
  }catch(e){add("sys","LLM: "+(e.message||e));}
  $("btnLlm").disabled=false;setStage("");paint();
};
$("btnVerify").onclick=async function(){
  var f=await ensure(16,4);if(!f)return;
  var d=await f.waitJob(f.submit({type:"agent",prompt:"12*12",size:16}),25000);
  var ans=(d&&d.result&&(d.result.answer||d.result.report))||"";
  var ok=ans.indexOf("144")>=0;
  if(d&&d.quantum)lastQ=d.quantum;
  var chain=null;try{chain=await f.verifyExoChain();}catch(e){}
  add("sys",(ok?"✓ math":"✗ math")+" · "+(d&&d.stages||[]).map(function(s){return s.name;}).join("→")+" · chain "+(chain&&chain.ok?"OK":"—"));
  paint();
};
$("btnClear").onclick=function(){$("feed").innerHTML="";add("sys","cleared");};
async function send(){
  var text=$("q").value.trim();if(!text||busy)return;
  busy=true;$("send").disabled=true;$("q").value="";
  add("user",text);
  var f=await ensure(16,4);if(!f){busy=false;$("send").disabled=false;return;}
  if(llmReady()&&W&&W.complete){
    var think=add("bot","cluster + LLM…");
    try{
      var r=await Promise.race([
        W.complete(text,{system:"Ты АКСИ Super — умный агент кластера. Русский, ясно, по делу.",max_tokens:480}),
        new Promise(function(res){setTimeout(function(){res({text:""});},45000);})
      ]);
      var t=(r&&r.text)?String(r.text).trim():"";
      if(t.length>15){
        think.textContent=t;
        var s=document.createElement("span");s.className="meta";s.textContent="webllm · fabric";think.appendChild(s);
        f.submit({type:"agent",prompt:text,size:12});
        busy=false;$("send").disabled=false;setStage("");paint();return;
      }
    }catch(e){}
    think.remove();
  }
  setStage("agent pipeline…");
  var job=f.submit({type:"agent",prompt:text,size:40});
  var done=await f.waitJob(job,90000);
  busy=false;$("send").disabled=false;setStage("");
  if(done&&done.quantum)lastQ=done.quantum;
  paint();
  if(done&&done.result){
    var ans=done.result.answer||done.result.report||done.result.error||"пусто";
    var meta=(done.result.source||"")+" · "+(done.stages||[]).map(function(x){return x.name;}).join("→")+" · "+(done.node||"");
    add("bot",ans,meta);
  }else add("bot","timeout");
}
$("send").onclick=send;
$("q").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();send();}});
ensure(16,4).then(function(){
  add("sys","Super Cluster готов. Задача → quantum → compute → mind → permit.");
  paint();
});
})();
</script>
</body>
</html>
