<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>АКСИ ИИ — локальный мозг</title>
<meta name="description" content="АКСИ: WebLLM + Neuro SEED + quantum seed + receipt. Единый ИИ-контур."/>
<link rel="canonical" href="https://milana808.github.io/llm/"/>
<meta name="theme-color" content="#0a0a0b"/>
<style>
:root{--bg:#0a0a0b;--panel:#121214;--line:rgba(255,255,255,.1);--t:#f4f4f5;--m:#a1a1aa;--a:#a78bfa;--g:#5eead4;--bad:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,sans-serif}
.shell{max-width:720px;margin:0 auto;padding:16px 14px 48px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.logo{font-weight:800;letter-spacing:.08em;font-size:12px;text-transform:uppercase}
.logo b{opacity:.45}
nav a{color:var(--m);font-size:12px;text-decoration:none;margin-left:10px}
h1{font-size:1.25rem;margin:0 0 6px}
.lead{color:var(--m);font-size:13px;margin:0 0 14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.panel h2{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--m);margin:0 0 8px}
.chips span{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--m);margin:2px 4px 0 0}
.chips span.on{border-color:var(--g);color:var(--g)}
.chips span.bad{border-color:var(--bad);color:var(--bad)}
.bar{height:6px;background:#1a1a1e;border-radius:4px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--a));transition:width .2s}
.meta{font-size:12px;color:var(--m);min-height:1.2em}
#log{height:min(48vh,380px);overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.msg{max-width:94%;padding:10px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#1a1a22;border:1px solid var(--line)}
.msg.bot{align-self:flex-start;background:#0e1620;border:1px solid rgba(94,234,212,.2)}
.msg .sub{font-size:10px;color:var(--m);margin-top:5px}
textarea{width:100%;min-height:52px;border-radius:10px;border:1px solid var(--line);background:#08080a;color:var(--t);padding:10px;font:inherit}
button{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--a),#7eb6ff);color:#0a0a0b;margin:6px 6px 0 0}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--t)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.ex button{font-size:12px;padding:6px 10px;background:#1a1a22;color:var(--t);border:1px solid var(--line);border-radius:8px;font-weight:500}
footer{font-size:12px;color:var(--m);margin-top:16px}
footer a{color:var(--a);margin-right:8px}
</style>
</head>
<body>
<div class="shell">
<header>
  <div class="logo">AKSI <b>ИИ</b></div>
  <nav>
    <a href="/">Главная</a>
    <a href="/runtime/">Runtime</a>
    <a href="/permit/">Permit</a>
    <a href="/matrix/">MATRIX</a>
    <a href="/whole/">Whole</a>
  </nav>
</header>
<h1>Локальный ИИ АКСИ</h1>
<p class="lead">WebLLM + Neuro SEED + quantum seed + receipt. Один контур с остальным сайтом.</p>

<div class="panel">
  <h2>Статус</h2>
  <div class="chips">
    <span id="bReady">idle</span>
    <span id="bGpu">gpu?</span>
    <span id="bModel">—</span>
    <span id="bSeed">Q-seed: —</span>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="meta" id="msg">Нажми «Загрузить» или дождись автозагрузки.</div>
  <div class="row">
    <button type="button" id="btnLoad">Загрузить</button>
    <button type="button" class="ghost" id="btnSkip">Не грузить авто</button>
  </div>
</div>

<div class="panel">
  <h2>Чат</h2>
  <div id="log"></div>
  <textarea id="q" placeholder="Вопрос на русском…"></textarea>
  <div class="row">
    <button type="button" id="send" disabled>Спросить</button>
    <button type="button" class="ghost" id="clr">Очистить</button>
  </div>
  <div class="ex row">
    <button type="button" data-q="Кто ты и как связан с АКСИ?">кто ты</button>
    <button type="button" data-q="Объясни суперпозицию простыми словами">суперпозиция</button>
    <button type="button" data-q="Чем Permit в АКСИ отличается от обычного чата?">Permit</button>
  </div>
</div>

<footer>
  <a href="/">home</a><a href="/runtime/">runtime</a><a href="/qai/">q-mind</a><a href="/permit/">permit</a>
  · aksilove@internet.ru · не AGI
</footer>
</div>

<script src="/aksi-webllm.js?v=5"></script>
<script src="/aksi-neuro.js?v=10"></script>
<script>
(function(){
  "use strict";
  var W = window.AKSI_WEBLLM;
  var history = [];
  var logEl = document.getElementById("log");
  function chip(id, text, on, bad) {
    var el = document.getElementById(id);
    el.textContent = text;
    el.className = bad ? "bad" : (on ? "on" : "");
  }
  function add(role, text, sub) {
    var d = document.createElement("div");
    d.className = "msg " + role;
    d.textContent = text;
    if (sub) {
      var s = document.createElement("div");
      s.className = "sub";
      s.textContent = sub;
      d.appendChild(s);
    }
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
    return d;
  }
  function qseed(t) {
    var h = 2166136261 >>> 0, s = String(t || "");
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    h ^= (performance.now() | 0);
    return (h >>> 0) / 4294967295;
  }
  function receipt(q, a, seed, model) {
    var payload = "AKSI|" + seed.toFixed(6) + "|" + (q||"").length + "|" + (a||"").length + "|" + (model||"");
    var h = 2166136261 >>> 0;
    for (var i = 0; i < payload.length; i++) { h ^= payload.charCodeAt(i); h = Math.imul(h, 16777619); }
    return "receipt aksi1:" + (h >>> 0).toString(16) + " · seed " + seed.toFixed(4);
  }
  function paint(st) {
    if (!W) return;
    st = st || W.status();
    var p = st.progress || 0;
    document.getElementById("bar").style.width = (p > 1 ? Math.round(p) : Math.round(p * 100)) + "%";
    document.getElementById("msg").textContent = st.message || "";
    chip("bReady", st.ready ? "ready" : (st.loading ? "loading" : "idle"), !!st.ready, !!st.error);
    chip("bGpu", st.webgpu === true ? "WebGPU" : (st.webgpu === false ? "no GPU" : "gpu?"), st.webgpu === true, st.webgpu === false);
    chip("bModel", st.model ? String(st.model).slice(0, 32) : "—", !!st.model);
    document.getElementById("send").disabled = !st.ready;
  }
  if (!W) {
    document.getElementById("msg").textContent = "aksi-webllm.js не загрузился";
    add("bot", "Модуль WebLLM не найден. Проверь /aksi-webllm.js", "error");
    return;
  }
  window.addEventListener("aksi-webllm-progress", function (e) { paint(e.detail); });
  window.addEventListener("aksi:webllm-ready", function () {
    paint();
    add("bot", "Модель готова: " + (W.status().model || ""), "system");
  });
  document.getElementById("btnLoad").onclick = function () {
    try { localStorage.removeItem("aksi_webllm_skip"); } catch (e) {}
    W.load(null, paint).then(paint).catch(function (e) {
      add("bot", String(e.message || e), "error");
      paint();
    });
  };
  document.getElementById("btnSkip").onclick = function () {
    try { localStorage.setItem("aksi_webllm_skip", "1"); } catch (e) {}
    document.getElementById("msg").textContent = "авто отключено";
  };
  document.getElementById("clr").onclick = function () {
    history = [];
    logEl.innerHTML = "";
    add("bot", "Чат очищен. Модель в кэше браузера.", "system");
  };
  document.getElementById("send").onclick = async function () {
    var q = document.getElementById("q").value.trim();
    if (!q || !W.ready()) return;
    document.getElementById("q").value = "";
    add("user", q);
    var seed = qseed(q);
    chip("bSeed", "Q-seed: " + seed.toFixed(4), true);
    document.getElementById("send").disabled = true;
    var bot = add("bot", "…", "генерация");
    try {
      var r = await W.complete(q, {
        history: history,
        temperature: 0.4 + seed * 0.35,
        max_tokens: 600
      });
      if (r.error && !r.text) {
        bot.textContent = r.error;
        bot.querySelector(".sub").textContent = "error";
      } else {
        var text = String(r.text || "").trim() || "(пусто)";
        history.push({ role: "user", content: q });
        history.push({ role: "assistant", content: text });
        if (history.length > 20) history = history.slice(-20);
        bot.textContent = text;
        bot.querySelector(".sub").textContent = receipt(q, text, seed, r.model || W.status().model);
      }
    } catch (e) {
      bot.textContent = String(e.message || e);
      bot.querySelector(".sub").textContent = "error";
    }
    document.getElementById("send").disabled = !W.ready();
  };
  document.querySelectorAll("[data-q]").forEach(function (b) {
    b.onclick = function () {
      document.getElementById("q").value = b.getAttribute("data-q");
      if (W.ready()) document.getElementById("send").click();
    };
  });
  document.getElementById("q").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      document.getElementById("send").click();
    }
  });
  paint();
  add("bot", "Единый ИИ-контур АКСИ.\nЗагрузка модели → любой вопрос.\nСвязан с Runtime, Permit, MATRIX с главной.", "system");
  setTimeout(function () {
    try {
      if (localStorage.getItem("aksi_webllm_skip") === "1") {
        document.getElementById("msg").textContent = "авто отключено — нажми Загрузить";
        return;
      }
    } catch (e) {}
    if (!W.ready() && !W.loading()) {
      W.autoLoad({ onProgress: paint }).catch(function (e) {
        add("bot", "Авто: " + (e.message || e) + " — нажми Загрузить", "system");
        paint();
      });
    }
  }, 300);
})();
</script>
</body>
</html>
