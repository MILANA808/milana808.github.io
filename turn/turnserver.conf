# AKSI coturn — production-ready baseline
# Docs: https://github.com/coturn/coturn
# Replace YOUR_PUBLIC_IP and secrets before deploy.

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=YOUR_PUBLIC_IP
external-ip=YOUR_PUBLIC_IP

fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=CHANGE_ME_LONG_RANDOM_SECRET

realm=aksi-turn
server-name=aksi-turn

# Ports for media relay
min-port=49152
max-port=49200

# Logging
verbose
log-file=/var/log/turnserver/turn.log
simple-log

# Security
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
# Prefer modern TLS if certs present (optional):
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# Keep-alive / mobility
stale-nonce=600
mobility

# Deny loopback relay
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

user-quota=12
total-quota=1200
