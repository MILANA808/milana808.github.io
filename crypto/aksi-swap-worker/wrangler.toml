name = "aksi-bitcoin-swap"
main = "src/index.ts"
compatibility_date = "2026-11-12"

[vars]
SITE_ORIGIN = "https://milana808.github.io"

# Configure these as encrypted Worker secrets, never commit them:
# npx wrangler secret put ZEROX_API_KEY
# npx wrangler secret put AKSI_TOKEN_ADDRESS

[secrets]
required = ["ZEROX_API_KEY", "AKSI_TOKEN_ADDRESS"]

[[ratelimits]]
name = "QUOTE_LIMITER"
namespace_id = "2026111201"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "STATUS_LIMITER"
namespace_id = "2026111202"

  [ratelimits.simple]
  limit = 30
  period = 60
