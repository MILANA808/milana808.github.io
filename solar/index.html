<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>АКСИ · Солнечная система</title>
<meta name="theme-color" content="#000010"/>
<style>
*{margin:0;box-sizing:border-box}
body{background:#000010;color:#e2e8f0;font-family:system-ui,sans-serif;overflow:hidden;height:100dvh}
.hud{position:fixed;z-index:2;top:0;left:0;right:0;padding:12px 14px;display:flex;justify-content:space-between;background:linear-gradient(#000010,transparent)}
.hud a{color:#94a3b8;text-decoration:none;font-size:13px}
.brand{font-size:11px;letter-spacing:.18em}
.panel{position:fixed;z-index:2;left:12px;right:12px;bottom:72px;max-width:440px;margin:0 auto;background:rgba(0,0,20,.88);border:1px solid rgba(168,85,247,.3);border-radius:14px;padding:12px 14px;font-size:12px;color:#94a3b8;line-height:1.45}
.panel b{color:#fbbf24}
.panel #name{color:#e9d5ff;font-size:14px}
</style>
</head>
<body>
<div class="hud">
  <a href="/">← домой</a>
  <span class="brand">SOLAR SYSTEM</span>
  <a href="/earth3d/">3D Земля</a>
</div>
<div class="panel">
  <div id="name">Солнце</div>
  <div id="desc">Клик по планете · колесо — зум · тяните — орбита камеры. Масштаб орбит условный (для наглядности).</div>
</div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="/nav.js"></script>
<script>
(function(){
  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,500);
  camera.position.set(0,18,42);
  var renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  document.body.appendChild(renderer.domElement);

  // stars
  var sg=new THREE.BufferGeometry();var sp=[];
  for(var i=0;i<3000;i++)sp.push((Math.random()-0.5)*200,(Math.random()-0.5)*200,(Math.random()-0.5)*200);
  sg.setAttribute("position",new THREE.Float32BufferAttribute(sp,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:0.08})));

  scene.add(new THREE.AmbientLight(0x334155,0.4));
  var sunLight=new THREE.PointLight(0xfff2cc,2,80);scene.add(sunLight);

  var planets=[
    {name:"Меркурий",color:0xa8a29e,r:0.38,dist:4,speed:0.04,info:"Ближайшая к Солнцу. Год ~88 земных суток."},
    {name:"Венера",color:0xfbbf24,r:0.55,dist:5.5,speed:0.015,info:"Самая горячая атмосфера в системе."},
    {name:"Земля",color:0x3b82f6,r:0.6,dist:7.2,speed:0.01,info:"Наш дом. Есть Луна."},
    {name:"Марс",color:0xef4444,r:0.45,dist:9,speed:0.008,info:"Красная планета."},
    {name:"Юпитер",color:0xd97706,r:1.4,dist:13,speed:0.004,info:"Газовый гигант."},
    {name:"Сатурн",color:0xf59e0b,r:1.2,dist:17,speed:0.003,info:"Кольца (упрощённо)."},
    {name:"Уран",color:0x22d3ee,r:0.9,dist:20.5,speed:0.002,info:"Ледяной гигант."},
    {name:"Нептун",color:0x2563eb,r:0.85,dist:23.5,speed:0.0015,info:"Далёкий синий мир."}
  ];

  // Sun
  var sun=new THREE.Mesh(
    new THREE.SphereGeometry(2.2,32,32),
    new THREE.MeshBasicMaterial({color:0xfbbf24})
  );
  scene.add(sun);
  var sunGlow=new THREE.Mesh(
    new THREE.SphereGeometry(2.6,16,16),
    new THREE.MeshBasicMaterial({color:0xf59e0b,transparent:true,opacity:0.25})
  );
  scene.add(sunGlow);

  var meshes=[];
  planets.forEach(function(p){
    // orbit ring
    var orb=new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(
        (function(){
          var pts=[];for(var a=0;a<=64;a++){var t=a/64*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(t)*p.dist,0,Math.sin(t)*p.dist));}
          return pts;
        })()
      ),
      new THREE.LineBasicMaterial({color:0x312e81,transparent:true,opacity:0.5})
    );
    scene.add(orb);
    var m=new THREE.Mesh(
      new THREE.SphereGeometry(p.r,24,24),
      new THREE.MeshStandardMaterial({color:p.color,roughness:0.6})
    );
    m.userData=p;m.userData.angle=Math.random()*Math.PI*2;
    scene.add(m);meshes.push(m);
    if(p.name==="Сатурн"){
      var ring=new THREE.Mesh(
        new THREE.RingGeometry(p.r*1.3,p.r*2.1,48),
        new THREE.MeshBasicMaterial({color:0xfcd34d,side:THREE.DoubleSide,transparent:true,opacity:0.55})
      );
      ring.rotation.x=Math.PI/2.3;m.add(ring);
    }
    if(p.name==="Земля"){
      var moon=new THREE.Mesh(
        new THREE.SphereGeometry(0.16,12,12),
        new THREE.MeshStandardMaterial({color:0xcbd5e1})
      );
      moon.position.x=1.1;m.add(moon);
    }
  });

  var raycaster=new THREE.Raycaster();
  var mouse=new THREE.Vector2();
  function pick(e){
    var r=renderer.domElement.getBoundingClientRect();
    mouse.x=((e.clientX-r.left)/r.width)*2-1;
    mouse.y=-((e.clientY-r.top)/r.height)*2+1;
    raycaster.setFromCamera(mouse,camera);
    var hits=raycaster.intersectObjects(meshes);
    if(hits.length){
      var p=hits[0].object.userData;
      document.getElementById("name").textContent=p.name;
      document.getElementById("desc").textContent=p.info+" Условный масштаб для красоты и обучения.";
    }
  }
  renderer.domElement.addEventListener("click",pick);

  // orbit camera drag
  var drag=false,lx=0,ly=0,theta=0.4,phi=0.35,dist=45;
  renderer.domElement.addEventListener("pointerdown",function(e){drag=true;lx=e.clientX;ly=e.clientY;});
  window.addEventListener("pointerup",function(){drag=false;});
  window.addEventListener("pointermove",function(e){
    if(!drag)return;
    theta-=(e.clientX-lx)*0.005;phi+=(e.clientY-ly)*0.005;
    phi=Math.max(0.05,Math.min(Math.PI/2-0.05,phi));
    lx=e.clientX;ly=e.clientY;
  });
  renderer.domElement.addEventListener("wheel",function(e){
    dist=Math.min(90,Math.max(12,dist+e.deltaY*0.02));
  },{passive:true});

  window.addEventListener("resize",function(){
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });

  (function loop(){
    requestAnimationFrame(loop);
    meshes.forEach(function(m){
      var p=m.userData;p.angle+=p.speed;
      m.position.x=Math.cos(p.angle)*p.dist;
      m.position.z=Math.sin(p.angle)*p.dist;
      m.rotation.y+=0.01;
    });
    sun.rotation.y+=0.002;
    camera.position.x=dist*Math.sin(phi)*Math.sin(theta);
    camera.position.y=dist*Math.cos(phi);
    camera.position.z=dist*Math.sin(phi)*Math.cos(theta);
    camera.lookAt(0,0,0);
    renderer.render(scene,camera);
  })();
})();
</script>
</body>
</html>
