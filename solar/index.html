<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>АКСИ · Солнечная система (сейчас)</title>
<meta name="theme-color" content="#000010"/>
<style>
*{margin:0;box-sizing:border-box}
body{background:#000010;color:#e2e8f0;font-family:system-ui,sans-serif;overflow:hidden;height:100dvh}
.hud{position:fixed;z-index:2;top:0;left:0;right:0;padding:12px 14px;display:flex;justify-content:space-between;background:linear-gradient(#000010,transparent)}
.hud a{color:#94a3b8;text-decoration:none;font-size:13px}
.brand{font-size:11px;letter-spacing:.15em}
.panel{position:fixed;z-index:2;left:12px;right:12px;bottom:72px;max-width:460px;margin:0 auto;background:rgba(0,0,16,.9);border:1px solid rgba(251,191,36,.25);border-radius:14px;padding:12px 14px;font-size:12px;color:#94a3b8;line-height:1.45}
#clock{color:#fbbf24;font-variant-numeric:tabular-nums}
#name{color:#e9d5ff;font-size:14px;margin-top:4px}
</style>
</head>
<body>
<div class="hud">
  <a href="/">←</a>
  <span class="brand">SOLAR · LIVE EPOCH</span>
  <a href="/drive/">в пути</a>
</div>
<div class="panel">
  <div>Эпоха: <span id="clock">—</span></div>
  <div id="name">Клик по планете</div>
  <div id="desc">Положения по упрощённым кеплеровым элементам на текущую дату (хорошая наглядность, не эфемериды JPL). Орбиты в условном масштабе.</div>
</div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="/nav.js"></script>
<script>
(function(){
  /* Approximate mean longitude rates (deg/day) from J2000-ish simplified model */
  function daysSinceJ2000(d){
    return (d.getTime()-Date.UTC(2000,0,1,12))/86400000;
  }
  // L0 deg at J2000, n deg/day — simplified
  var ORB=[
    {name:"Меркурий",color:0xa8a29e,r:0.38,dist:4,L0:252.25,n:4.09233,info:"Ближайшая к Солнцу"},
    {name:"Венера",color:0xfbbf24,r:0.55,dist:5.5,L0:181.98,n:1.60213,info:"Плотная атмосфера"},
    {name:"Земля",color:0x3b82f6,r:0.6,dist:7.2,L0:100.47,n:0.98561,info:"Вы здесь"},
    {name:"Марс",color:0xef4444,r:0.45,dist:9,L0:355.43,n:0.52402,info:"Красная планета"},
    {name:"Юпитер",color:0xd97706,r:1.35,dist:13,L0:34.35,n:0.08309,info:"Газовый гигант"},
    {name:"Сатурн",color:0xf59e0b,r:1.15,dist:17,L0:50.08,n:0.03346,info:"Кольца"},
    {name:"Уран",color:0x22d3ee,r:0.9,dist:20.5,L0:314.05,n:0.01173,info:"Ледяной гигант"},
    {name:"Нептун",color:0x2563eb,r:0.85,dist:23.5,L0:304.35,n:0.00598,info:"Дальний гигант"}
  ];
  function lonNow(p,day){
    var L=(p.L0+p.n*day)%360;if(L<0)L+=360;return L*Math.PI/180;
  }

  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,500);
  camera.position.set(0,18,42);
  var renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  document.body.appendChild(renderer.domElement);

  var sg=new THREE.BufferGeometry();var sp=[];
  for(var i=0;i<2800;i++)sp.push((Math.random()-0.5)*200,(Math.random()-0.5)*200,(Math.random()-0.5)*200);
  sg.setAttribute("position",new THREE.Float32BufferAttribute(sp,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:0.07})));
  scene.add(new THREE.AmbientLight(0x334155,0.45));
  scene.add(new THREE.PointLight(0xfff2cc,2.2,90));

  var sun=new THREE.Mesh(new THREE.SphereGeometry(2.2,32,32),new THREE.MeshBasicMaterial({color:0xfbbf24}));
  scene.add(sun);

  var meshes=[];
  ORB.forEach(function(p){
    var orb=new THREE.Line(
      new THREE.BufferGeometry().setFromPoints((function(){
        var pts=[];for(var a=0;a<=64;a++){var t=a/64*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(t)*p.dist,0,Math.sin(t)*p.dist));}return pts;
      })()),
      new THREE.LineBasicMaterial({color:0x1e1b4b,transparent:true,opacity:0.55})
    );
    scene.add(orb);
    var m=new THREE.Mesh(new THREE.SphereGeometry(p.r,24,24),new THREE.MeshStandardMaterial({color:p.color,roughness:0.55}));
    m.userData=p;scene.add(m);meshes.push(m);
    if(p.name==="Сатурн"){
      var ring=new THREE.Mesh(new THREE.RingGeometry(p.r*1.3,p.r*2.1,48),new THREE.MeshBasicMaterial({color:0xfcd34d,side:THREE.DoubleSide,transparent:true,opacity:0.55}));
      ring.rotation.x=Math.PI/2.3;m.add(ring);
    }
  });

  function place(){
    var now=new Date();
    document.getElementById("clock").textContent=now.toISOString().replace("T"," ").slice(0,19)+" UTC";
    var day=daysSinceJ2000(now);
    meshes.forEach(function(m){
      var ang=lonNow(m.userData,day);
      m.position.x=Math.cos(ang)*m.userData.dist;
      m.position.z=Math.sin(ang)*m.userData.dist;
    });
  }
  place();
  setInterval(place,1000);

  var raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
  renderer.domElement.addEventListener("click",function(e){
    var r=renderer.domElement.getBoundingClientRect();
    mouse.x=((e.clientX-r.left)/r.width)*2-1;
    mouse.y=-((e.clientY-r.top)/r.height)*2+1;
    raycaster.setFromCamera(mouse,camera);
    var hits=raycaster.intersectObjects(meshes);
    if(hits[0]){
      var p=hits[0].object.userData;
      document.getElementById("name").textContent=p.name;
      document.getElementById("desc").textContent=p.info+" · угол по упрощённой модели на сейчас.";
    }
  });

  var drag=false,lx=0,ly=0,theta=0.5,phi=0.35,dist=45;
  renderer.domElement.addEventListener("pointerdown",function(e){drag=true;lx=e.clientX;ly=e.clientY;});
  window.addEventListener("pointerup",function(){drag=false;});
  window.addEventListener("pointermove",function(e){
    if(!drag)return;theta-=(e.clientX-lx)*0.005;phi+=(e.clientY-ly)*0.005;
    phi=Math.max(0.05,Math.min(Math.PI/2-0.05,phi));lx=e.clientX;ly=e.clientY;
  });
  renderer.domElement.addEventListener("wheel",function(e){dist=Math.min(90,Math.max(12,dist+e.deltaY*0.02));},{passive:true});
  window.addEventListener("resize",function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

  (function loop(){
    requestAnimationFrame(loop);
    camera.position.x=dist*Math.sin(phi)*Math.sin(theta);
    camera.position.y=dist*Math.cos(phi);
    camera.position.z=dist*Math.sin(phi)*Math.cos(theta);
    camera.lookAt(0,0,0);
    sun.rotation.y+=0.002;
    renderer.render(scene,camera);
  })();
})();
</script>
</body>
</html>
