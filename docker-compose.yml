version: "3.8"

services:
  aksi-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - RESONANCE_SEED=${RESONANCE_SEED:-Alfiya_AKSI_DIMAX_v3_2026}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
      - AKSI_TAVILY_API_KEY=${AKSI_TAVILY_API_KEY:-}
      - AKSI_SERPER_API_KEY=${AKSI_SERPER_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
