services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: >
      bash -c "pip install -q -r requirements.txt && python main.py"
    ports:
      - "8000:8000"
    environment:
      AKSI_LLM_PROVIDER: auto
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:3b
      PORT: "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
