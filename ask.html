*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
header{border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.brand h1{font-size:16px;font-weight:800;display:inline}
.brand .sub{font-size:12px;color:var(--muted);margin-left:8px}
.nav a{color:var(--muted);text-decoration:none;font-size:12px;margin-left:12px}
main{flex:1;display:grid;grid-template-columns:1fr 300px;max-width:1100px;width:100%;margin:0 auto}

.chat{display:flex;flex-direction:column;border-right:1px solid var(--line)}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:280px;max-height:calc(100vh - 200px)}
.msg{max-width:95%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#151528}
.msg.bot{align-self:flex-start}
.msg .meta{font-size:11px;color:var(--muted);margin-top:6px}
.badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;background:#1a1a28;margin-right:4px}
.badge.ok{color:var(--green)}.badge.no{color:var(--red)}
.presets{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line)}
.presets button,.side button{font-size:11px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#15151f;color:var(--ink);cursor:pointer}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.composer input{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.composer button#send{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
.composer button:disabled{opacity:.5}
.side{padding:12px;overflow-y:auto;max-height:calc(100vh - 56px)}
.side h2{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;font-size:12px}
.card .n{font-size:16px;font-weight:800}
.pipe .s{font-size:11px;padding:5px 8px;margin:3px 0;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.pipe .s.done{color:var(--green);border-color:#2a4a2a}
.pipe .s.on{color:var(--ink);border-color:var(--blue)}
.cand{font-size:11px;padding:6px;border-left:3px solid #456;margin:4px 0;background:var(--panel)}
.hint{font-size:11px;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:8px 16px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
code{font-family:ui-monospace,monospace;font-size:10px;word-break:break-all}
</style>

function localAnswer(q){
  const s=q.toLowerCase().replace(/ё/g,"е");
  let best=null,score=0;
  for(const row of KB){
    let sc=0;
    for(const k of row.k){
      const kk=k.toLowerCase();
      if(s.includes(kk)) sc+=kk.length*(kk.includes(" ")?2.5:1.3);
      else if(kk.length>=4 && s.split(/\s+/).some(w=>w.startsWith(kk.slice(0,4)))) sc+=kk.length*0.6;

  return null;

function calibrate(cands,q){const lambda=0.4,cfW=0.15;const seed=Array.from(q).reduce((h,c)=>((h*31+c.charCodeAt(0))>>>0),0)%1000/1000;const prep=cands.map((c,i)=>{const align=((c.mem||0.5)+(c.src||0.5)+c.coh+(c.spe||0.6))/4;const P=Math.max(1e-12,c.eqs);const phi=Math.PI*(1-align)*lambda+Math.PI*seed*0.06*lambda;const a=cadd(fromPolar(Math.sqrt(P),phi),fromPolar(Math.sqrt(P*cfW*(0.4+0.6*(1-align))),phi+Math.PI/2));return{i,c,eqs:c.eqs,P,phi,a,align};});const sumP=prep.reduce((s,x)=>s+x.P,0);prep.forEach(x=>x.Pc=x.P/sumP);const raw=prep.map(xi=>{let s=cabs2(xi.a);for(const xj of prep)if(xj.i!==xi.i)s+=lambda*2*cmul(xi.a,cconj(xj.a)).re;return Math.max(1e-12,s);});const S=raw.reduce((a,b)=>a+b,0);const pQ=raw.map(v=>v/S);let best=0;for(let i=1;i<pQ.length;i++)if(pQ[i]>pQ[best])best=i;return{prep,pQ,best};}

function pipeReset(){document.querySelectorAll("#pipe .s").forEach(el=>el.classList.remove("on","done"));}
let abort=null;
async function ask(){if(busy)return;const q=document.getElementById("q").value.trim();if(!q)return;busy=true;document.getElementById("send").disabled=true;document.getElementById("q").value="";add("user",q);pipeReset();if(abort)abort.abort();abort=new AbortController();const signal=abort.signal;try{pipe(1,"on");document.getElementById("mode").textContent="поиск…";const loc=localAnswer(q);const mem=memHit(q);let wiki=null,ddg=null;const isSelf=/акси|aksi|кто ты|что ты/.test(q.toLowerCase());if(navigator.onLine!==false&&!isSelf){const pair=await Promise.all([fetchWiki(q,signal),fetchDDG(q,signal)]);wiki=pair[0];ddg=pair[1];}pipe(1,"done");pipe(2,"on");let cands=[];if(loc)cands.push({engine:"Local KB",text:loc.text,src:0.96,mem:0.92,spe:0.9});if(mem)cands.push({engine:"Memory",text:mem.text,src:0.72,mem:0.95,spe:0.7});if(wiki)cands.push({engine:"Wikipedia/"+wiki.lang,text:wiki.text,src:0.9,mem:0.45,spe:0.75});if(ddg)cands.push({engine:"DDG",text:ddg,src:0.8,mem:0.4,spe:0.7});if(!cands.length){cands.push({engine:"Guide",text:"По запросу «"+q.slice(0,80)+"» локальных фактов нет, а сеть не дала релевантной статьи. Уточните формулировку или проверьте источник вручную. АКСИ не выдумывает уверенный ответ без данных.",src:0.4,mem:0.3,spe:0.4});}while(cands.length<3){cands.push({engine:"Conservative",text:"Если источники слабые или конфликтуют, лучше DEFERRED: не выдавать непроверяемое за факт.",src:0.4,mem:0.3,spe:0.35});}cands=cands.slice(0,3).map(c=>adia(c,q)).sort((a,b)=>b.eqs-a.eqs);const mode=(wiki||ddg||mem)?"hybrid":"local";document.getElementById("mode").textContent=mode+(navigator.onLine!==false?" · online":" · offline");document.getElementById("cands").innerHTML=cands.map((c,i)=>`<div class="cand" style="border-color:${['#2d6dff','#4ade80','#fb923c'][i]}"><b>${c.engine}</b> EQS ${c.eqs.toFixed(2)} · rel ${c.rel.toFixed(2)}<br>${c.text.slice(0,110)}…</div>`).join("");pipe(2,"done");pipe(3,"on");const cal=calibrate(cands,q);pipe(3,"done");pipe(4,"on");let choice=cal.best;if(loc&&cands[0].engine==="Local KB"&&cands[0].eqs>=0.75){const idx=cal.prep.findIndex(p=>p.c.engine==="Local KB");if(idx>=0)choice=idx;}const chosen=cal.prep[choice];const pq2=cal.pQ[choice];const decision=(pq2>=0.34||(chosen.Pc>=0.4&&chosen.eqs>=0.7))?"ALLOWED":"DEFERRED";document.getElementById("dec").textContent=decision+" · "+pq2.toFixed(3);document.getElementById("dec").style.color=decision==="ALLOWED"?"var(--green)":"var(--red)";const body={query:q,decision,final_answer:chosen.c.text,confidence:+pq2.toFixed(6),engine:chosen.c.engine,eqs:chosen.eqs,mode,candidates:cal.prep.map((p,i)=>({engine:p.c.engine,eqs:p.eqs,p_q:+cal.pQ[i].toFixed(4)})),prev_receipt_hash:prev,public_key:pub,timestamp:new Date().toISOString()};lastC=JSON.stringify(body);body.signature=await sign(new TextEncoder().encode(lastC));lastR=body;prev=await sha256(JSON.stringify(body));sealed++;document.getElementById("sig").textContent=(body.signature||"").slice(0,40)+"…";if(decision==="ALLOWED"){await memAdd({q,a:chosen.c.text,engine:chosen.c.engine,ts:Date.now()});memories=await memAll();document.getElementById("memN").textContent="memory: "+memories.length;}pipe(4,"done");const meta=`<span class="badge ${decision==="ALLOWED"?"ok":"no"}">${decision}</span><span class="badge">${chosen.c.engine}</span>P_q ${pq2.toFixed(3)}`;add("bot",chosen.c.text,meta);}catch(e){if(e.name!=="AbortError")add("bot","Ошибка: "+(e.message||e));}busy=false;document.getElementById("send").disabled=false;document.getElementById("q").focus();}
document.getElementById("send").onclick=ask;
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")ask();});
document.querySelectorAll("#presets [data-q]").forEach(b=>b.onclick=()=>{document.getElementById("q").value=b.getAttribute("data-q");ask();});
document.getElementById("btnV").onclick=async()=>{if(!lastR||!lastC)return alert("Нет receipt");alert((await verify(lastR.signature,new TextEncoder().encode(lastC)))?"VALID ✓":"INVALID");};
document.getElementById("btnD").onclick=()=>{if(!lastR)return;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(lastR,null,2)],{type:"application/json"}));a.download="aksi-receipt.json";a.click();};
document.getElementById("btnM").onclick=async()=>{if(confirm("Очистить память?")){await memClr();memories=[];document.getElementById("memN").textContent="memory: 0";}};
(async()=>{await keys();memories=await memAll();document.getElementById("memN").textContent="memory: "+memories.length;add("bot","АКСИ Ask v1.2.1\n\nГотов. Локальная база + Wikipedia. Ответ подписывается. Не AGI.");})();
</script>
