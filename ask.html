<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="АКСИ — полезный интеллект с Fly-Brain v2 gate и Decision Receipt.">
<meta name="theme-color" content="#0b0b10">
<link rel="canonical" href="https://milana808.github.io/ask.html">
<link rel="manifest" href="/manifest.webmanifest">
<title>АКСИ · Спросить</title>
<style>
:root{--bg:#0b0b10;--ink:#e8e8f0;--muted:#8b8b9a;--line:#1c1c28;--blue:#2d6dff;--green:#4ade80;--red:#f87171;--card:#12121a;--panel:#0e0e16}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{border-bottom:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-shrink:0}
.brand h1{font-size:16px;font-weight:800;display:inline}
.brand .sub{font-size:11px;color:var(--muted);margin-left:6px}
.nav{display:flex;gap:10px;align-items:center}
.nav a{color:var(--muted);text-decoration:none;font-size:12px}
#tog{display:none;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
main{flex:1;display:grid;grid-template-columns:1fr 300px;max-width:1100px;width:100%;margin:0 auto;min-height:0}
.chat{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.msg{max-width:95%;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#151528}
.msg.bot{align-self:flex-start}
.msg .meta{font-size:11px;color:var(--muted);margin-top:6px}
.badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;background:#1a1a28;margin-right:4px}
.badge.ok{color:var(--green)}.badge.no{color:var(--red)}.badge.learn{color:#a78bfa}
.presets{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line);flex-shrink:0}
.presets button,.side button{font-size:12px;padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:#15151f;color:var(--ink);cursor:pointer}
.composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-shrink:0;background:var(--bg)}
.composer input{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:16px}
.composer button#send{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:14px 18px;font-weight:700;cursor:pointer;font-size:15px}
.side{padding:12px;overflow-y:auto;max-height:calc(100vh - 52px)}
.side h2{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;font-size:12px}
.card .n{font-size:16px;font-weight:800}
.pipe .s{font-size:11px;padding:5px 8px;margin:3px 0;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.pipe .s.done{color:var(--green);border-color:#2a4a2a}
.pipe .s.on{color:var(--ink);border-color:var(--blue)}
.hint{font-size:11px;color:var(--muted);line-height:1.4}
code{font-family:ui-monospace,monospace;font-size:10px;word-break:break-all}
@media(max-width:860px){
  #tog{display:inline-block}
  main{grid-template-columns:1fr}
  .side{display:none;position:fixed;inset:52px 0 0 0;z-index:40;background:var(--bg);max-height:none;border-top:1px solid var(--line)}
  .side.open{display:block}
  .chat{border-right:0}
}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>АКСИ</h1><span class="sub">v2.1 · fly-brain v2 gate</span></div>
  <nav class="nav">
    <button type="button" id="tog">Статус</button>
    <a href="/brain.html">Brain</a>
    <a href="/">Главная</a>
    <a href="/verify.html">Verify</a>
  </nav>
</header>
<main>
<section class="chat">
  <div class="msgs" id="msgs"></div>
  <div class="presets" id="presets">
    <button type="button" data-q="Как пользоваться АКСИ?">Как пользоваться</button>
    <button type="button" data-q="Что такое фишинг?">Фишинг</button>
    <button type="button" data-q="Как проверить факт?">Проверка факта</button>
    <button type="button" data-q="Что такое полезный интеллект?">Зачем АКСИ</button>
    <button type="button" data-q="верно">Верно ✓</button>
    <button type="button" data-q="неверно">Неверно</button>
  </div>
  <div class="composer">
    <input id="q" type="text" placeholder="Ваш вопрос…" autocomplete="off" enterkeyhint="send">
    <button type="button" id="send">Спросить</button>
  </div>
</section>
<aside class="side" id="side">
  <h2>Контур</h2>
  <div class="pipe" id="pipe">
    <div class="s" data-s="1">1 Источники + Memory</div>
    <div class="s" data-s="2">2 Синтез</div>
    <div class="s" data-s="3">3 ADIA + Fly-Brain v2</div>
    <div class="s" data-s="4">4 Seal + Learn</div>
  </div>
  <h2>Статус</h2>
  <div class="card"><div class="hint">Режим</div><div id="mode">—</div></div>
  <div class="card"><div class="hint">Decision</div><div class="n" id="dec">—</div></div>
  <div class="card"><div class="hint">AKSI score</div><div class="n" id="aksiScore">—</div></div>
  <div class="card"><div class="hint">Опыт n</div><div class="n" id="nXP">0</div></div>
  <h2>Память</h2>
  <div id="memList"><div class="hint">—</div></div>
  <h2>Фрагменты</h2>
  <div id="cands">—</div>
  <h2>Proof</h2>
  <div class="card hint">sig <code id="sig">—</code></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
    <button type="button" id="btnV">Проверить</button>
    <button type="button" id="btnD">Receipt</button>
    <button type="button" id="btnM">Очистить память</button>
  </div>
  <p class="hint" style="margin-top:10px">Gate = Fly-Brain v2 · <a href="/brain.html" style="color:#2d6dff">Full Brain SUPER</a></p>
  <p class="hint" id="memN">memory: 0</p>
</aside>
</main>
<script src="/aksi-receipt.js?v=2"></script>
<script src="/aksi-fly-brain.js?v=2"></script>
<script src="/aksi-fly-gate.js?v=2"></script>
<script src="/aksi-rec-core.js?v=19"></script>
<script src="/aksi-rec-ui.js?v=19"></script>
<script>document.getElementById("tog").onclick=function(){document.getElementById("side").classList.toggle("open");};</script>
</body>
</html>
