name: AKSI deterministic goal planner
on:
  pull_request:
    paths:
      - "modules/aksi-agent-reflection.js"
      - "modules/aksi-agent-orchestrator.js"
      - "tests/aksi-agent-reflection.test.cjs"
      - "tests/aksi-agent-orchestrator.test.cjs"
      - "modules/aksi-agent-planner.js"
      - "modules/aksi-self-model.js"
      - "tests/aksi-self-model.test.cjs"
      - "tests/aksi-agent-planner.test.cjs"
      - "tests/aksi-agent-action-contract.test.cjs"
      - "system/aksi-boot.js"
      - "index.html"
      - ".github/workflows/aksi-agent-planner.yml"
  push:
    branches: [main]
    paths:
      - "modules/aksi-agent-planner.js"
      - "modules/aksi-self-model.js"
      - "tests/aksi-self-model.test.cjs"
      - "tests/aksi-agent-planner.test.cjs"
      - "tests/aksi-agent-action-contract.test.cjs"
      - "system/aksi-boot.js"
      - "index.html"
      - ".github/workflows/aksi-agent-planner.yml"
jobs:
  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/aksi-agent-reflection.test.cjs
      - run: node tests/aksi-agent-orchestrator.test.cjs
      - run: node tests/aksi-self-model.test.cjs
      - run: node tests/aksi-agent-planner.test.cjs
      - run: node tests/aksi-agent-action-contract.test.cjs
