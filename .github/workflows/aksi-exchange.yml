name: AKSI Exchange page checks
on:
  push:
    paths:
      - "aksi-exchange/**"
      - "crypto/aksi-exchange/**"
      - ".github/workflows/aksi-exchange.yml"
  pull_request:
    paths:
      - "aksi-exchange/**"
      - "crypto/aksi-exchange/**"
      - ".github/workflows/aksi-exchange.yml"
permissions:
  contents: read
jobs:
  page-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate exchange page script and safety guards
        run: node crypto/aksi-exchange/check-page.mjs
