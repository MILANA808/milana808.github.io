name: AKSI Self Tool Safety Tests

on:
  push:
    branches: [main, "fix/**"]
    paths:
      - "aksi-self.js"
      - "tests/aksi-self-tool-safety.test.cjs"
      - ".github/workflows/aksi-self-tool-safety.yml"
  pull_request:
    paths:
      - "aksi-self.js"
      - "tests/aksi-self-tool-safety.test.cjs"
      - ".github/workflows/aksi-self-tool-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-tool-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check aksi-self.js
      - run: node --test tests/aksi-self-tool-safety.test.cjs
