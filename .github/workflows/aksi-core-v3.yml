name: AKSI Core v3
on:
  push:
    branches: [main, 'aksi-core-v3-world-class']
  pull_request:
    branches: [main]
jobs:
  static-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate core markers
        run: |
          test -s aksi-core-v3.js
          test -s quantum-playground/v3/index.html
          grep -q "AKSI-VAI/1" aksi-core-v3.js
          grep -q "Ed25519" aksi-core-v3.js
          grep -q "quantum-like" aksi-core-v3.js
      - name: JavaScript syntax check
        run: node --check aksi-core-v3.js
      - name: HTML script sanity
        run: node -e "const fs=require('fs'); const h=fs.readFileSync('quantum-playground/v3/index.html','utf8'); if(!h.includes('AKSICoreV3.run')||!h.includes('id=\"q\"')) process.exit(1); console.log('OK')"
