name: AKSI Quantum Core
on:
  push:
    paths:
      - "aksi-quantum-ai/**"
      - ".github/workflows/aksi-quantum-core.yml"
  pull_request:
    paths:
      - "aksi-quantum-ai/**"
      - ".github/workflows/aksi-quantum-core.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q .
        working-directory: aksi-quantum-ai
      - name: Unit tests
        run: python -m unittest -v
        working-directory: aksi-quantum-ai
