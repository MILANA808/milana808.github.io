name: AKSI Evidence Lifecycle Conformance
on:
  push:
    paths:
      - 'evidence-lifecycle/**'
      - 'schemas/**'
      - 'tests/evidence-lifecycle.test.js'
      - 'tools/evidence-lifecycle-verifier.mjs'
      - '.github/workflows/evidence-lifecycle.yml'
  pull_request:
    paths:
      - 'evidence-lifecycle/**'
      - 'schemas/**'
      - 'tests/evidence-lifecycle.test.js'
      - '.github/workflows/evidence-lifecycle.yml'
  workflow_dispatch:
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate schema fixture and verifier syntax
        run: node tests/evidence-lifecycle.test.js
