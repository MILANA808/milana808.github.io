name: AKSI browser-smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS syntax check
        run: |
          set -e
          for f in aksi-*.js app-runtime.js sw.js; do
            [ -f "$f" ] || continue
            node --check "$f"
            echo OK $f
          done
      - name: Required files
        run: |
          test -f index.html
          test -f aksi-security.js
          echo MVP files present
