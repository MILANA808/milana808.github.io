name: AKSI runtime-smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS syntax check
        run: |
          set -e
          for f in aksi-*.js app-runtime.js sw.js bio/*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
            echo "OK $f"
          done
      - name: Runtime contract — core
        run: node tests/aksi-runtime.test.js
      - name: Runtime contract — semantic reasoning
        run: node tests/aksi-semantic-reasoning.test.cjs
      - name: Runtime contract — weather command
        run: node tests/aksi-weather.test.cjs
      - name: Runtime contract — local knowledge base
        run: node tests/aksi-knowledge-base.test.cjs
      - name: Runtime contract — knowledge command routing
        run: node tests/aksi-knowledge-routing.test.cjs
      - name: Runtime contract — answer router
        run: node tests/aksi-answer-router.test.cjs
      - name: Runtime contract — end-to-end answer routing
        run: node tests/aksi-answer-integration.test.cjs
      - name: Runtime contract — WebLLM evidence context
        run: node tests/aksi-webllm-context.test.cjs
      - name: Runtime contract — chat storage failure
        run: node tests/chat-storage-recursion.test.cjs
      - name: Runtime contract — world
        run: node tests/world-surface.test.js
      - name: Runtime contract — intelligence git
        run: node tests/intelligence-git.test.js
      - name: Runtime contract — fly brain
        run: node tests/fly-brain.test.js
      - name: Runtime contract — digital life
        run: node tests/digital-life.test.js
      - name: Runtime contract — self-apply safety
        run: node tests/self-apply-workflow.test.cjs
      - name: Runtime contract — default backend isolation
        run: node tests/default-backend-isolation.test.cjs
      - name: Runtime contract — control plane
        run: |
          set +e
          node tests/aksi-control-plane.test.js 2>&1 | tee control-plane.log
          code=${PIPESTATUS[0]}
          exit $code
      - name: Upload control-plane diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-diagnostics
          path: |
            control-plane.log
            control-plane-failure.log
          if-no-files-found: ignore
      - name: Required files
        run: |
          test -f index.html
          test -f aksi-security.js
          test -f aksi-runtime.js
          test -f bio/aksi-reality-engine.js
          test -f bio/intelligence-git.js
          test -f bio/aksi-digital-life.js
          test -f bio/flywire/fly-brain.js
          test -f bio/flywire/experiment.json
          test -f bio/life/index.html
          test -f tests/aksi-runtime.test.js
          test -f tests/aksi-semantic-reasoning.test.cjs
          test -f aksi-answer-router.js
          test -f aksi-knowledge-base.js
          test -f tests/aksi-knowledge-base.test.cjs
          test -f tests/aksi-knowledge-routing.test.cjs
          test -f tests/aksi-answer-router.test.cjs
          test -f tests/aksi-answer-integration.test.cjs
          test -f tests/aksi-webllm-context.test.cjs
          test -f aksi-semantic-reasoning.js
          test -f tests/world-surface.test.js
          test -f tests/intelligence-git.test.js
          test -f tests/fly-brain.test.js
          test -f tests/digital-life.test.js
          test -f tests/self-apply-workflow.test.cjs
          test -f tests/default-backend-isolation.test.cjs
          test -f tests/aksi-control-plane.test.js
          echo MVP files present
