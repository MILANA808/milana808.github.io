name: AKSI Unified Core smoke tests

on:
  push:
    branches: [main, aksi-core-v3-world-class]
  pull_request:
    branches: [main]

jobs:
  unified-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check required modules and navigation
        run: |
          test -s unified/index.html
          test -s aksi-core-v3.js
          grep -q 'AKSICoreV3.run' unified/index.html
          grep -q '/aksi-superpose.js' unified/index.html
          grep -q '/aksi-quantum.js' unified/index.html
          grep -q '/aksi-hrr.js' unified/index.html
          grep -q 'href="/unified/"' index.html
          test -s aksi-unified-runtime.js
          grep -q 'AKSI_UNIFIED.request' runtime/backend/client.js
          grep -q 'aksi-unified-runtime.js' index.html
          grep -q 'aksi-unified-runtime.js' runtime/index.html
          grep -q 'aksi-unified-runtime.js' chat/index.html
          grep -q 'aksi-unified-runtime.js' superpose/index.html
          grep -q 'aksi-unified-runtime.js' agent/index.html
      - name: Syntax-check canonical runtime, homepage and safety contracts
        run: |
          node --check aksi-unified-runtime.js
          node --check aksi-crypto-provider.js
          node --check runtime/backend/client.js
          node --check aksi-agent-runtime.js
          node --check aksi-seal.js
          node --check aksi-capsule.js
          node --check aksi-trust.js
          node --check permit/aksi-permit.js
          node --check mandate/aksi-mandate.js
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          script_blocks = re.findall(r"""(<script\b[^>]*>)([\s\S]*?)</script\s*>""", html, re.I)
          blocks = [body for tag, body in script_blocks if body.strip() and not re.search(r"""type=["']application/ld\+json["']""", tag, re.I)]
          if not blocks:
              raise SystemExit("No inline JavaScript found in homepage")
          for i, block in enumerate(blocks):
              Path(f"/tmp/aksi-home-inline-{i}.js").write_text(block, encoding="utf-8")
              Path(f"/tmp/aksi-home-inline-{i}.js").write_text(block, encoding="utf-8")
          print(f"Extracted {len(blocks)} homepage inline script block(s)")
          PY
          for file in /tmp/aksi-home-inline-*.js; do node --check "$file"; done
          node --test tests/aksi-unified-runtime.test.js tests/aksi-crypto-provider.test.js
      - name: Syntax-check unified inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("unified/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script\s*>", html, re.I)
          if not blocks:
              raise SystemExit("No inline script block found")
          Path("/tmp/aksi-unified-inline.js").write_text(blocks[-1], encoding="utf-8")
          print(f"Extracted {len(blocks)} inline script block(s)")
          PY
          node --check /tmp/aksi-unified-inline.js
      - name: Check Core v3 syntax
        run: node --check aksi-core-v3.js
