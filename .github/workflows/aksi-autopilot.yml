name: AKSI Autopilot

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: aksi-autopilot-main
  cancel-in-progress: true

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax audit
        run: |
          set -e
          for f in aksi-*.js app-runtime.js sw.js bio/*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
          done

      - name: Runtime contracts
        run: |
          set -e
          node tests/aksi-runtime.test.js
          node tests/intelligence-git.test.js
          node tests/fly-brain.test.js
          node tests/digital-life.test.js

      - name: Required surface audit
        run: |
          set -e
          for f in index.html product/index.html ask.html trust/index.html bridge/index.html verify/index.html bio/index.html bio/life/index.html bio/arena/index.html bio/flywire/index.html .well-known/aksi.json AKSI-VAI.md llms.txt; do
            test -f "$f"
          done

      - name: Public-surface privacy audit
        run: |
          set -e
          files=$(find . -type f \( -name '*.html' -o -name '*.js' -o -name '*.json' -o -name '*.css' -o -name '*.txt' \) -not -path './.git/*' -not -path './node_modules/*' -not -name '*.map')
          # Official public contact (CONTRIBUTING) is allowed. Fail on any other email.
          hits=$(printf '%s\n' "$files" | xargs grep -nHiE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' || true)
          bad=$(printf '%s\n' "$hits" | grep -viE 'aksilove@internet\.ru' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "Non-official email on public surface. Only aksilove@internet.ru is allowed."
            exit 1
          fi
          echo "Privacy OK — only official contact aksilove@internet.ru"

      - name: Write audit summary
        if: always()
        run: |
          {
            echo "## AKSI Autopilot"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Syntax, runtime, required-surface and public privacy audits were executed."
          } >> "$GITHUB_STEP_SUMMARY"

  failure-record:
    if: failure()
    needs: audit-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Record failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `AKSI Autopilot failure: ${context.sha.slice(0,7)}`;
            const body = [
              'Automated AKSI audit/test pipeline failed.',
              '',
              `Commit: ${context.sha}`,
              `Workflow: ${context.workflow}`,
              `Run: ${context.runId}`,
              '',
              'Inspect the failed job and fix the root cause.'
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            if (!existing.data.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
