name: AKSI Cortex Password Guard

on:
  push:
    branches: [main, "fix/**"]
    paths:
      - "aksi-bot.js"
      - "tests/aksi-cortex-password.test.cjs"
      - ".github/workflows/aksi-cortex-password.yml"
  pull_request:
    paths:
      - "aksi-bot.js"
      - "tests/aksi-cortex-password.test.cjs"
      - ".github/workflows/aksi-cortex-password.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cortex-password:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check aksi-bot.js
      - run: node --test tests/aksi-cortex-password.test.cjs
