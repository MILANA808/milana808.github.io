name: AKSI swap Worker checks
on:
  push:
    paths:
      - "crypto/aksi-swap-worker/**"
      - ".github/workflows/aksi-swap-worker.yml"
  pull_request:
    paths:
      - "crypto/aksi-swap-worker/**"
      - ".github/workflows/aksi-swap-worker.yml"
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto/aksi-swap-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Report dependency audit findings
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); for (const [n,v] of Object.entries(a.vulnerabilities||{})) console.log(n, v.severity, "fixAvailable="+JSON.stringify(v.fixAvailable));'
      - run: npm run typecheck
      - run: npm test
