name: AKSI site verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required core files
        run: |
          test -f index.html
          test -f app.js
          test -f app.css
          test -f aksi-global.js
          test -f aksi-global.css
          test -f 404.html
          test -f aksi-runtime.js
          test -f aksi-quantum-runtime.js
          test -f aksi-quantum-chat.js
          test -f aksi-learning.js
          test -f aksi-proof-graph.js
          test -f aksi-counterfactual.js
          test -f aksi-quantum-reasoner.js
          test -f aksi-frontier.js
          test -f aksi-passport.js
      - name: JavaScript syntax
        run: |
          for f in app.js aksi-global.js aksi-runtime.js aksi-quantum-runtime.js aksi-quantum-chat.js aksi-learning.js aksi-proof-graph.js aksi-counterfactual.js aksi-quantum-reasoner.js aksi-frontier.js aksi-passport.js; do node --check "$f"; done
      - name: Global interface contract
        run: |
          grep -q 'АКСИ' 404.html
          grep -q 'aksi-global.js' aksi-global.js
          grep -q 'aksi-global.css' aksi-global.css
      - name: Quantum contract
        run: |
          grep -q 'AKSI-QUANTUM-INFERENCE-1' aksi-quantum-runtime.js
          grep -q 'local-state-vector' aksi-quantum-runtime.js
          grep -q 'AKSIQuantum.run' aksi-quantum-chat.js
      - name: Build universal shell into every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          snippet='<!-- AKSI-GLOBAL -->\n<script src="/aksi-global.js" defer></script>'
          for p in Path('.').rglob('*.html'):
              if any(x in p.parts for x in ('.git','node_modules')): continue
              s=p.read_text(encoding='utf-8')
              if 'aksi-global.js' not in s:
                  s=s.replace('</body>',snippet+'\n</body>',1) if '</body>' in s else s+'\n'+snippet+'\n'
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Static HTML sanity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.').rglob('*.html'):
              if any(x in p.parts for x in ('.git','node_modules')): continue
              s=p.read_text(encoding='utf-8')
              assert '<html' in s.lower(), p
              assert 'aksi-global.js' in s, p
          PY
