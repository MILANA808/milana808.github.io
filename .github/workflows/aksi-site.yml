name: AKSI verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required runtime files
        run: |
          set -e
          for f in index.html aksi-console.html 404.html aksi-core.js aksi-runtime.js aksi-global.js aksi-global.css; do test -f "$f"; done
      - name: JavaScript syntax
        run: |
          set -e
          for f in aksi-core.js aksi-runtime.js aksi-global.js; do node --check "$f"; done
      - name: HTML sanity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts or 'node_modules' in p.parts: continue
              s=p.read_text(encoding='utf-8',errors='replace').lower()
              assert '<html' in s and '</html>' in s, p
          print('HTML OK')
          PY
      - name: Runtime contract
        run: |
          set -e
          grep -q 'AKSI-RESULT-1' aksi-runtime.js
          grep -q 'localFirst:true' aksi-runtime.js
          grep -q 'AKSI-EVENT-5' aksi-core.js
          grep -q 'SHA-256' aksi-core.js
          grep -q 'setWebEnabled' aksi-core.js
      - name: Global shell contract
        run: |
          set -e
          grep -q 'aksi-global.js' index.html
          grep -q 'aksi-runtime.js' aksi-console.html
          grep -q 'АКСИ' 404.html
      - name: No obvious secret literals
        run: |
          ! grep -RInE 'sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}' --exclude-dir=.git --exclude='*.map' .
