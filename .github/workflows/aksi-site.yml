name: AKSI verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required runtime files
        run: |
          set -e
          for f in index.html 404.html aksi.html; do test -f "$f" || { echo "missing $f"; exit 1; }; done
          echo "core files OK"
      - name: HTML sanity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bad=[]
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts or 'node_modules' in p.parts: continue
              try:
                  s=p.read_text(encoding='utf-8',errors='replace').lower()
              except Exception as e:
                  bad.append(f'{p}: read error {e}'); continue
              if '<html' not in s or '</html>' not in s:
                  bad.append(str(p))
          if bad:
              print('BAD:', bad); raise SystemExit(1)
          print('HTML OK')
          PY
      - name: No obvious secret literals
        run: |
          ! grep -RInE 'sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}' --exclude-dir=.git --exclude='*.map' . || true
      - name: aksi.html size
        run: |
          sz=$(wc -c < aksi.html)
          echo "aksi.html bytes=$sz"
          test "$sz" -gt 10000
