# AKSI product CI — Release 1.0 + ADIA 3.0
name: AKSI verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  product:
    name: Product + ADIA 3.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Required product files
        run: |
          set -euo pipefail
          for f in \
            index.html \
            aksi-algorithm.js \
            aksi-func.js \
            aksi-mind-l2.js \
            aksi-neuro.js \
            aksi-rag.js \
            aksi-quantum.js \
            aksi-trust-vault.js \
            aksi-webllm.js \
            aksi-chats.js \
            aksi-p2p-sdp.js \
            app-runtime.js \
            sw.js \
            PRODUCT.md \
            ALGORITHM.md \
            present.html
          do
            test -f "$f" || { echo "MISSING $f"; exit 1; }
            echo "OK $f"
          done

      - name: JavaScript syntax (product surface)
        run: |
          set -euo pipefail
          for f in aksi-algorithm.js aksi-func.js aksi-mind-l2.js aksi-neuro.js \
                   aksi-rag.js aksi-quantum.js aksi-trust-vault.js aksi-webllm.js \
                   aksi-chats.js aksi-p2p-sdp.js aksi-product.js app-runtime.js sw.js
          do
            node --check "$f"
            echo "syntax OK $f"
          done

      - name: ADIA 3.0 contract
        run: |
          node <<'NODE'
          global.window = global;
          global.localStorage = {
            _d: {},
            getItem(k) { return this._d[k] || null; },
            setItem(k, v) { this._d[k] = String(v); }
          };
          require('./aksi-algorithm.js');
          const A = global.AKSI_ALGORITHM;
          if (!A) throw new Error('AKSI_ALGORITHM missing');
          if (A.version !== '3.0.0') throw new Error('expected ADIA 3.0.0, got ' + A.version);
          if (typeof A.process !== 'function') throw new Error('process() required');
          if (typeof A.evaluate !== 'function') throw new Error('evaluate() required');

          const r = A.process(
            'кто ты',
            [
              { text: 'Я АКСИ — локальный ИИ в браузере. Offline Mind L2.', source: 'mind-l2' },
              { text: 'ok', source: 'fallback' }
            ],
            { policy: 'companion', seal: true }
          );
          if (!r.ok || !r.best) throw new Error('process failed');
          if (r.best.source !== 'mind-l2') throw new Error('rank failed: ' + r.best.source);
          const m = r.best.metrics;
          for (const k of ['H', 'QCLI', 'EQS', 'AKSI', 'resonance', 'DIMAX', 'quantum']) {
            if (!(k in m)) throw new Error('missing metric ' + k);
          }
          if (!m.quantum || m.quantum.mode !== 'deterministic-client-simulation') {
            throw new Error('quantum sim contract failed');
          }
          const st = A.status();
          if (!st.ledgerOk) throw new Error('ledger not ok');
          if (st.formula.indexOf('AKSI') < 0) throw new Error('formula missing');

          const ev = A.evaluate('test', 'AKSI local verification answer', { seal: false });
          if (!ev.ok || !ev.metrics.EQS) throw new Error('evaluate failed');

          console.log('ADIA 3.0 contract OK', {
            EQS: m.EQS,
            AKSI: m.AKSI,
            best: r.best.source,
            ledger: st.ledgerLen
          });
          NODE

      - name: Privacy scan (no public FIO)
        run: |
          set -euo pipefail
          if grep -RInE 'BIRTH|dateOfBirth' \
              index.html aksi-func.js aksi-product.js app-runtime.js aksi-algorithm.js 2>/dev/null; then
            echo "privacy leak pattern found"
            exit 1
          fi
          echo "privacy scan OK"

      - name: Present + PRODUCT docs
        run: |
          test -f present.html
          test -f PRODUCT.md
          test -f ALGORITHM.md
          grep -q 'ADIA 3.0' ALGORITHM.md
          echo "docs OK"
