name: AKSI site verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required core files
        run: |
          set -e
          for f in index.html 404.html app.js app.css aksi-global.js aksi-global.css aksi-runtime.js aksi-quantum-runtime.js aksi-quantum-chat.js aksi-learning.js aksi-proof-graph.js aksi-counterfactual.js aksi-quantum-reasoner.js aksi-frontier.js aksi-passport.js; do test -f "$f"; done

      - name: JavaScript syntax — entire repository
        run: |
          set -e
          find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0 | while IFS= read -r -d '' f; do node --check "$f"; done

      - name: Python syntax — backend
        run: |
          set -e
          if find backend -type f -name '*.py' | grep -q .; then
            python3 -m compileall -q backend
          fi

      - name: Global interface contract
        run: |
          set -e
          grep -q 'АКСИ' 404.html
          grep -q 'window.AKSI' aksi-runtime.js
          grep -q 'aksi:runtime-ready' aksi-runtime.js
          grep -q 'local-first' aksi-global.js

      - name: Quantum contract
        run: |
          set -e
          grep -q 'AKSI-QUANTUM-INFERENCE-1' aksi-quantum-runtime.js
          grep -q 'local-state-vector' aksi-quantum-runtime.js
          grep -q 'AKSIQuantum.run' aksi-quantum-chat.js

      - name: Static link sanity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          errors = []
          for p in root.rglob('*.html'):
              if '.git' in p.parts or 'node_modules' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8', errors='replace')
              for attr in ('href', 'src'):
                  for raw in re.findall(rf'{attr}=["\']([^"\']+)', text, flags=re.I):
                      if raw.startswith(('#','http://','https://','mailto:','tel:','data:','javascript:')):
                          continue
                      # JS template literals inside HTML/scripts — not static paths
                      if '${' in raw or '{' in raw:
                          continue
                      target = raw.split('?',1)[0].split('#',1)[0]
                      if not target:
                          continue
                      if target.startswith('/'):
                          candidate = root / target.lstrip('/')
                      else:
                          candidate = (p.parent / target).resolve()
                      if candidate.suffix == '':
                          candidate_index = candidate / 'index.html'
                          if candidate_index.exists():
                              continue
                      if not candidate.exists():
                          errors.append(f'{p}: missing {attr}={raw}')
          if errors:
              print('\n'.join(errors))
              raise SystemExit(1)
          print('Static links OK')
          PY

      - name: HTML sanity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.').rglob('*.html'):
              if any(x in p.parts for x in ('.git','node_modules')): continue
              s=p.read_text(encoding='utf-8', errors='replace').lower()
              assert '<html' in s, p
              assert '</html>' in s, p
          PY
