name: AKSI site verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required site files
        run: |
          test -f index.html
          test -f app.js
          test -f app.css
          test -f aksi-runtime.js
          test -f aksi-enhancements.js
          test -f aksi-control-plane.js
          test -f aksi-quantum-runtime.js
          test -f aksi-quantum-chat.js
          test -f integrations/aksi-unified.js
          test -f integrations/repository-registry.json
          test -f sw.js
          test -f manifest.webmanifest
          test -f aksii-matrix/index.html
          test -f aksii-matrix/matrix.css
          test -f aksii-matrix/src/main.js
          test -f aksii-matrix/src/core/aksii-agent.js
          test -f aksii-matrix/src/ai/webllm-wrapper.js
          test -f aksii-matrix/src/quantum/quirk-controller.js
          test -f aksii-matrix/src/storage/history.js
          test -f aksii-matrix/src/utils/quantum-logic.js
          test -f aksii-matrix/data/templates.json
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check aksi-runtime.js
          node --check aksi-enhancements.js
          node --check aksi-control-plane.js
          node --check aksi-quantum-runtime.js
          node --check aksi-quantum-chat.js
          node --check integrations/aksi-unified.js
          node --check sw.js
          node --check aksii-matrix/src/main.js
          node --check aksii-matrix/src/core/aksii-agent.js
          node --check aksii-matrix/src/ai/webllm-wrapper.js
          node --check aksii-matrix/src/quantum/quirk-controller.js
          node --check aksii-matrix/src/storage/history.js
          node --check aksii-matrix/src/utils/quantum-logic.js
      - name: JSON validation
        run: |
          node -e "JSON.parse(require('fs').readFileSync('integrations/repository-registry.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('aksii-matrix/data/templates.json','utf8'))"
      - name: Required runtime wiring
        run: |
          grep -q 'aksi-runtime.js' index.html
          grep -q 'aksi-quantum-runtime.js' index.html
          grep -q 'aksi-quantum-chat.js' index.html
          grep -q 'aksi-enhancements.js' index.html
          grep -q 'AKSI_COGNITIVE_LEDGER_V1' app.js
          grep -q 'AKSI-EVIDENCE-2' aksi-runtime.js
          grep -q 'AKSI_LOCAL_MEMORY_V1' aksi-enhancements.js
          grep -q 'aksi-control-plane.js' index.html
      - name: Quantum inference contract
        run: |
          grep -q 'AKSI-QUANTUM-INFERENCE-1' aksi-quantum-runtime.js
          grep -q 'local-state-vector' aksi-quantum-runtime.js
          grep -q 'applyCNOT' aksi-quantum-runtime.js
          grep -q 'AKSIQuantum.run' aksi-quantum-chat.js
          grep -q 'aksi:quantum-inference' aksi-quantum-chat.js
          grep -q 'classical-browser-simulator' aksi-quantum-runtime.js
      - name: Matrix wiring and safety
        run: |
          grep -q 'matrix.css' aksii-matrix/index.html
          grep -q './src/main.js' aksii-matrix/index.html
          grep -q 'local-first' aksii-matrix/index.html
          grep -q 'CreateMLCEngine' aksii-matrix/src/ai/webllm-wrapper.js
          grep -q 'runCircuit' aksii-matrix/src/quantum/quirk-controller.js
          grep -q 'indexedDB' aksii-matrix/src/storage/history.js
          grep -q 'bell_state' aksii-matrix/data/templates.json
      - name: Integration contract
        run: |
          grep -q 'AKSI-REPOSITORY-REGISTRY-1' integrations/repository-registry.json
          grep -q 'AKSIUnified' integrations/aksi-unified.js
          grep -q 'AKSIUnified' aksi-control-plane.js
      - name: Static HTML sanity
        run: |
          grep -q '<html' index.html
          grep -q '</html>' index.html
          grep -q '<html' aksii-matrix/index.html
          grep -q '</html>' aksii-matrix/index.html
