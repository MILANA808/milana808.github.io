name: AKSI Independent Evidence Verifier
on:
  push:
    paths:
      - 'tools/aksi_evidence_verify.py'
      - 'tests/test_aksi_evidence_verify.py'
      - 'schemas/**'
      - '.github/workflows/aksi-independent-verifier.yml'
  pull_request:
    paths:
      - 'tools/aksi_evidence_verify.py'
      - 'tests/test_aksi_evidence_verify.py'
      - 'schemas/**'
      - '.github/workflows/aksi-independent-verifier.yml'
  workflow_dispatch:
jobs:
  python-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run semantic verifier tests
        run: python -m unittest discover -s tests -p 'test_aksi_evidence_verify.py' -v
      - name: Verify published example through CLI
        run: python tools/aksi_evidence_verify.py schemas/fixtures/aksi-evidence-lifecycle-v1.example.json --pretty
