name: AKSI Cognition Kernel
on:
  push:
    branches: [main, aksi-cognition-kernel-01]
    paths:
      - "aksi-evidence-kernel.js"
      - "tests/aksi-evidence-kernel.test.cjs"
      - ".github/workflows/aksi-cognition-kernel.yml"
  pull_request:
    paths:
      - "aksi-evidence-kernel.js"
      - "tests/aksi-evidence-kernel.test.cjs"
      - ".github/workflows/aksi-cognition-kernel.yml"
permissions:
  contents: read
jobs:
  evidence-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check aksi-evidence-kernel.js
      - name: Evidence kernel tests
        run: node tests/aksi-evidence-kernel.test.cjs
