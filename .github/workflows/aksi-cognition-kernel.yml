name: AKSI Cognition Kernel
on:
  push:
    branches: [main, aksi-cognition-kernel-01, aksi-language-claim-bridge-01]
    paths:
      - "aksi-evidence-kernel.js"
      - "aksi-language-claim-bridge.js"
      - "aksi-integrated-cognition.js"
      - "tests/aksi-integrated-cognition.test.cjs"
      - "tests/aksi-evidence-kernel.test.cjs"
      - "tests/aksi-language-claim-bridge.test.cjs"
      - ".github/workflows/aksi-cognition-kernel.yml"
  pull_request:
    paths:
      - "aksi-evidence-kernel.js"
      - "aksi-language-claim-bridge.js"
      - "aksi-integrated-cognition.js"
      - "tests/aksi-integrated-cognition.test.cjs"
      - "tests/aksi-evidence-kernel.test.cjs"
      - "tests/aksi-language-claim-bridge.test.cjs"
      - ".github/workflows/aksi-cognition-kernel.yml"
permissions:
  contents: read
jobs:
  evidence-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check aksi-evidence-kernel.js
          node --check aksi-language-claim-bridge.js
          node --check aksi-integrated-cognition.js
      - name: Evidence kernel tests
        run: node tests/aksi-evidence-kernel.test.cjs
      - name: Language bridge tests
        run: node tests/aksi-language-claim-bridge.test.cjs
      - name: Integrated cognition tests
        run: node tests/aksi-integrated-cognition.test.cjs
