name: AKSI Main Product Integrity
on:
  push:
    paths:
      - "index.html"
      - "scripts/test_aksi_main_chat_runtime.cjs"
      - "aksi-webllm.js"
      - "aksi-internet.js"
      - "aksi-calculator.js"
      - "aksi-visible-neural-lab.js"
      - "neural-lab/index.html"
      - "scripts/test_aksi_visible_neural_lab.cjs"
      - "modules/engine-adapter.mjs"
      - "tests/engine-adapter.test.cjs"
      - "modules/evidence-passport.js"
      - "modules/progress-manager.js"
      - "tests/evidence-passport.test.cjs"
      - "tests/progress-manager.test.cjs"
      - "tests/main-ui-contract.test.cjs"
      - "tests/aksi-calculator.test.js"
      - "package.json"
      - "eslint.config.js"
      - ".prettierrc.json"
      - "CONTRIBUTING.md"
      - "quantum-mind/index.html"
      - "datasets/aksi-archive-theorem-corpus-v1.json"
      - "scripts/test_aksi_archive_theorem_corpus.cjs"
      - "scripts/train_aksi_archive_model.cjs"
      - "docs/AKSI-VISIBLE-NEURAL-LAB.md"
      - "aksi-unified-adaptive-core.js"
      - "aksi-dna-topology-engine.js"
      - "aksi-open-training-lab.js"
      - "training-lab/index.html"
      - "scripts/test_aksi_open_training_lab.cjs"
      - "docs/AKSI-OPEN-TRAINING-LAB.md"
      - "scripts/test_aksi_dna_topology_engine.cjs"
      - "aksi-cognitive-core.js"
      - "aksi-wave-bayesian-engine.js"
      - "aksi-geometric-knowledge-core.js"
      - "scripts/test_aksi_unified_adaptive_core.cjs"
      - "scripts/test_aksi_cognitive_core.mjs"
      - "scripts/test_aksi_wave_bayesian_engine.cjs"
      - "scripts/test_aksi_geometric_knowledge_core.cjs"
      - "scripts/check_aksi_main_product.mjs"
      - ".github/workflows/aksi-main-product.yml"
  pull_request:
    paths:
      - "index.html"
      - "modules/evidence-passport.js"
      - "modules/progress-manager.js"
      - "tests/evidence-passport.test.cjs"
      - "tests/progress-manager.test.cjs"
      - "modules/engine-adapter.mjs"
      - "tests/engine-adapter.test.cjs"
      - "tests/aksi-calculator.test.js"
      - "package.json"
      - "eslint.config.js"
      - ".prettierrc.json"
      - "CONTRIBUTING.md"
      - "quantum-mind/index.html"
      - "index.html"
      - "aksi-webllm.js"
      - "aksi-internet.js"
      - "aksi-calculator.js"
      - "aksi-visible-neural-lab.js"
      - "neural-lab/index.html"
      - "datasets/aksi-archive-theorem-corpus-v1.json"
      - "scripts/test_aksi_archive_theorem_corpus.cjs"
      - "scripts/train_aksi_archive_model.cjs"
      - "scripts/test_aksi_visible_neural_lab.cjs"
      - "docs/AKSI-VISIBLE-NEURAL-LAB.md"
      - ".github/workflows/aksi-main-product.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install AKSI quality tools
        run: npm install --no-audit --no-fund
      - name: Test provider adapter and deterministic calculator
        run: npm test
      - name: Lint new modules
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Validate integrated product
        run: node scripts/check_aksi_main_product.mjs
      - name: Test main chat runtime escapes
        run: node scripts/test_aksi_main_chat_runtime.cjs
      - name: Test unified adaptive core
        run: node scripts/test_aksi_unified_adaptive_core.cjs
      - name: Test native DNA topology generator
        run: node scripts/test_aksi_dna_topology_engine.cjs
      - name: Test open training lab
        run: node scripts/test_aksi_open_training_lab.cjs
      - name: Validate AKSI archive and theorem corpus
        run: node scripts/test_aksi_archive_theorem_corpus.cjs
      - name: Test visible neural training lab
        run: node scripts/test_aksi_visible_neural_lab.cjs
      - name: Train AKSI model on archive and theorem corpus
        run: node scripts/train_aksi_archive_model.cjs
      - name: Publish model checkpoint and training report
        uses: actions/upload-artifact@v4
        with:
          name: aksi-theorem-training-${{ github.sha }}
          path: |
            training-results/aksi-theorem-pretrained.json
            training-results/training-report.json
          if-no-files-found: error
          retention-days: 90
      - name: Test cognitive evidence core
        run: node scripts/test_aksi_cognitive_core.mjs
      - name: Test wave Bayesian engine
        run: node scripts/test_aksi_wave_bayesian_engine.cjs
      - name: Test geometric knowledge core
        run: node scripts/test_aksi_geometric_knowledge_core.cjs
