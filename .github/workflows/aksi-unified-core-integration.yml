name: AKSI unified-core integration tests

on:
  pull_request:
    paths:
      - "aksi-unified-adaptive-core.js"
      - "aksi-cognitive-core.js"
      - "aksi-wave-bayesian-engine.js"
      - "aksi-geometric-knowledge-core.js"
      - "aksi-dna-topology-engine.js"
      - "scripts/test_aksi_unified_adaptive_core.cjs"
      - ".github/workflows/aksi-unified-core-integration.yml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run unified core integration tests
        run: node scripts/test_aksi_unified_adaptive_core.cjs
