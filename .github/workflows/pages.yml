name: AKSI Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Validate static site
        run: |
          test -f index.html
          test -f runtime/index.html
          test -f discovery/index.html
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              assert '<html' in s.lower(), p
              assert '</html>' in s.lower(), p
          import re
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              refs=re.findall(r'(?:href|src)=["\\']([^"\\'#?]+)', s, flags=re.I)
              for ref in refs:
                  if ref.startswith(('http://','https://','mailto:','tel:','data:','javascript:','//','/')):
                      continue
                  target=(p.parent/ref).resolve()
                  assert target.is_file(), f'{p}: missing local asset {ref}'
          print('AKSI static validation + local asset validation: OK')
          PY
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-validation
          path: .
          include-hidden-files: false
          if-no-files-found: ignore

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
