<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>АКСИ · Экзокортекс</title>
<meta name="theme-color" content="#5b21b6">
<style>
:root{
  --bg:#f3effc;--ink:#160f2a;--muted:#6b6285;--line:#e5ddf5;--violet:#7c3aed;--card:#fff;
}
html[data-cognitive="sparse"] body{--bg:#faf8ff}
html[data-cognitive="soft"] body{--bg:#f0f9ff}
html[data-cognitive="compact"] .msg{font-size:15px}
*{box-sizing:border-box;margin:0}
body{
  font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);
  min-height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
}
header{
  padding:max(12px,env(safe-area-inset-top)) 14px 10px;background:#5b21b6;color:#fff;
}
header a{color:#fff;font-weight:700;text-decoration:none;font-size:15px}
h1{font-size:1.15rem;margin-top:6px}
.modes{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.modes button{
  flex:1;min-height:44px;border-radius:12px;border:2px solid var(--line);
  background:#fff;font-weight:700;font-size:13px;
}
.modes button.on{border-color:var(--violet);background:#ede9fe;color:var(--violet)}
#thread{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.msg{padding:12px 14px;border-radius:14px;margin-bottom:10px;font-size:16px;line-height:1.45;max-width:92%}
.msg.u{background:var(--violet);color:#fff;margin-left:auto}
.msg.a{background:var(--card);border:1px solid var(--line)}
.msg .s{display:block;font-size:11px;margin-top:6px;opacity:.75;font-weight:700}
.sys{font-size:12px;color:var(--muted);text-align:center;margin:8px 0}
footer{padding:10px 12px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.row{display:flex;gap:8px}
input{
  flex:1;font-size:16px;padding:14px;border-radius:12px;border:2px solid var(--line);
}
button.send{
  width:56px;border:none;border-radius:12px;background:var(--violet);color:#fff;font-weight:800;font-size:1.1rem;
}
.meta{font-size:11px;color:var(--muted);padding:6px 14px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<header>
  <a href="/">← Меню</a>
  <h1>Экзокортекс · ядро v0.1</h1>
</header>
<div class="modes">
  <button type="button" data-m="aksi" id="m-aksi">АКСИ</button>
  <button type="button" data-m="milana" id="m-milana">Милана</button>
  <button type="button" data-m="unified" id="m-unified">Вместе</button>
</div>
<div class="meta">
  <span id="cog">когнитивно: normal</span>
  <span id="mods">модули: —</span>
</div>
<div id="thread"></div>
<footer>
  <div class="row">
    <input id="in" type="text" placeholder="Задача или вопрос…" enterkeyhint="send" autocomplete="off">
    <button type="button" class="send" id="go">OK</button>
  </div>
</footer>

<script src="/kernel/aksi-bus.js"></script>
<script src="/kernel/aksi-kernel.js"></script>
<script src="/kernel/modules/persona.js"></script>
<script src="/kernel/modules/cognitive.js"></script>
<script src="/kernel/modules/skills.js"></script>
<script src="/aksi-knowledge.js"></script>
<script src="/aksi-core.js"></script>
<script>
(function(){
  var thread=document.getElementById("thread");
  var persona=AksiKernel.get("persona");
  var cognitive=AksiKernel.get("cognitive");

  document.getElementById("mods").textContent="модули: "+AksiKernel.list().map(function(m){return m.id;}).join(", ");

  function paintModes(){
    var m=persona.getMode();
    ["aksi","milana","unified"].forEach(function(x){
      document.getElementById("m-"+x).className=m===x?"on":"";
    });
  }
  paintModes();
  document.querySelectorAll(".modes button").forEach(function(b){
    b.onclick=function(){
      persona.setMode(b.getAttribute("data-m"));
      paintModes();
      addSys("Режим: "+b.textContent);
    };
  });

  AksiBus.on("cognitive.state",function(intent){
    document.getElementById("cog").textContent="когнитивно: "+intent.payload.density;
  });

  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function add(u,text,src){
    var d=document.createElement("div");
    d.className="msg "+(u?"u":"a");
    d.innerHTML=esc(text).replace(/\n/g,"<br>")+(src?"<span class=\"s\">"+esc(src)+"</span>":"");
    thread.appendChild(d);
    thread.scrollTop=thread.scrollHeight;
  }
  function addSys(t){
    var d=document.createElement("div");d.className="sys";d.textContent=t;thread.appendChild(d);
  }

  addSys("Context Bus + микроядро активны. Данные локально.");

  async function send(){
    var v=(document.getElementById("in").value||"").trim();
    if(!v)return;
    document.getElementById("in").value="";
    add(true,v);
    if(cognitive)cognitive.update(v);
    await AksiBus.emit("user.message","ui",{text:v});
    var raw=await AksiCore.reply(v);
    var styled=persona.styleReply(raw.text,raw.source);
    add(false,styled.text,styled.source);
    await AksiBus.emit("agent.reply","exocortex",{text:styled.text});
  }
  document.getElementById("go").onclick=send;
  document.getElementById("in").addEventListener("keydown",function(e){
    if(e.key==="Enter"){e.preventDefault();send();}
  });
})();
</script>
</body>
</html>
