<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>АКСИ · генерация (WebLLM)</title>
<link rel="canonical" href="https://milana808.github.io/qai/"/>
<meta name="theme-color" content="#07090f"/>
<style>
:root{--bg:#07090f;--p:#0e1219;--l:#1c2433;--t:#eef2ff;--m:#9aa6b8;--a:#5eead4;--q:#a78bfa;--ok:#34d399;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,sans-serif}
.w{max-width:720px;margin:0 auto;padding:14px 12px 40px}
h1{font-size:1.3rem;margin:0 0 4px;background:linear-gradient(90deg,var(--a),var(--q));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--m);font-size:13px;margin:0 0 12px}
.panel{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:12px;margin-bottom:10px}
.chips span{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--l);color:var(--m);margin:2px 3px 0 0}
.chips span.on{border-color:var(--ok);color:var(--ok)}
.chips span.bad{border-color:var(--bad);color:var(--bad)}
.chips span.warn{border-color:var(--warn);color:var(--warn)}
.bar{height:8px;background:#121820;border-radius:6px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--q));transition:width .2s}
#msg{font-size:13px;color:var(--m);min-height:1.3em}
#log{height:min(48vh,380px);overflow:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:94%;padding:10px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.msg.u{align-self:flex-end;background:#152033;border:1px solid var(--l)}
.msg.b{align-self:flex-start;background:#0c1420;border:1px solid rgba(94,234,212,.25)}
.msg .s{font-size:10px;color:var(--m);margin-top:5px}
textarea{width:100%;min-height:56px;border-radius:12px;border:1px solid var(--l);background:#080b11;color:var(--t);padding:12px;font:inherit;margin-top:8px}
button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--q));color:#041016;margin:6px 6px 0 0}
button:disabled{opacity:.4;cursor:not-allowed}
button.g{background:transparent;border:1px solid var(--l);color:var(--t)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.note{font-size:12px;color:var(--m);margin-top:8px;line-height:1.4}
footer{margin-top:12px;font-size:12px;color:var(--m)}footer a{color:var(--a);margin-right:8px}
</style>
</head>
<body>
<div class="w">
  <h1>АКСИ · живая генерация</h1>
  <p class="lead">Не заученные фразы. Локальная нейросеть генерирует текст. Нужен Chrome/Edge + WebGPU.</p>
  <div class="panel">
    <div class="chips">
      <span id="cGpu">gpu?</span>
      <span id="cState">idle</span>
      <span id="cModel">модель: —</span>
      <span id="cQ">Q-seed: —</span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div id="msg">Сейчас загрузим модель…</div>
    <div class="row">
      <button type="button" id="load">Загрузить / перезагрузить модель</button>
      <button type="button" class="g" id="skip">Не грузить авто</button>
    </div>
    <p class="note">Первый раз — скачивание весов в кэш (0.5–2 ГБ). Потом из кэша. Без WebGPU генерации не будет.</p>
  </div>
  <div class="panel">
    <div id="log"></div>
    <textarea id="q" placeholder="Любой вопрос — модель сгенерирует ответ…" disabled></textarea>
    <div class="row">
      <button type="button" id="send" disabled>Сгенерировать</button>
      <button type="button" class="g" id="clr">Очистить</button>
    </div>
  </div>
  <footer><a href="/">home</a><a href="/llm/">llm</a><a href="/runtime/">runtime</a> · aksilove@internet.ru</footer>
</div>
<script src="/aksi-webllm.js?v=8"></script>
<script>
(function(){
"use strict";
var W=window.AKSI_WEBLLM,hist=[],logEl=document.getElementById("log"),busy=false;
function chip(id,t,cls){var el=document.getElementById(id);el.textContent=t;el.className=cls||"";}
function add(role,text,sub){var d=document.createElement("div");d.className="msg "+(role==="user"?"u":"b");d.textContent=text;if(sub){var s=document.createElement("div");s.className="s";s.textContent=sub;d.appendChild(s);}logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;return d;}
function qseed(text){var h=2166136261>>>0,s=String(text||""),i;for(i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}h^=(Date.now()&0xffff);return (h>>>0)/4294967295;}
function paint(){if(!W){chip("cGpu","нет aksi-webllm.js","bad");document.getElementById("msg").textContent="Модуль WebLLM не загрузился.";return;}
var st=W.status(),p=st.progress||0;document.getElementById("bar").style.width=(p>1?Math.round(p):Math.round(p*100))+"%";
document.getElementById("msg").textContent=st.message||(st.ready?"Модель готова — пиши любой вопрос.":"…");
chip("cGpu",st.webgpu===true?"WebGPU":(st.webgpu===false?"no GPU":"gpu?"),st.webgpu===true?"on":(st.webgpu===false?"bad":"warn"));
chip("cState",st.ready?"ready":(st.loading?"loading":(st.error?"error":"idle")),st.ready?"on":(st.loading?"warn":(st.error?"bad":"")));
chip("cModel",st.model?String(st.model).slice(0,28):"модель: —",st.ready?"on":"");
var ready=!!(W.ready&&W.ready());document.getElementById("send").disabled=!ready||busy;document.getElementById("q").disabled=!ready;}
async function generate(text){text=String(text||"").trim();if(!text||busy)return;
if(!W||!W.ready||!W.ready()){add("bot","Сначала дождись загрузки модели (ready / 100%).","система");return;}
busy=true;document.getElementById("send").disabled=true;add("user",text);
var seed=qseed(text);chip("cQ","Q-seed: "+seed.toFixed(4),"on");
var bot=add("bot","…генерация","WebLLM");
try{var r=await W.complete(text,{history:hist,temperature:0.35+seed*0.55,max_tokens:600});
if(r.error&&!r.text){bot.textContent="Ошибка: "+r.error;bot.querySelector(".s").textContent="error";}
else{var out=String(r.text||"").trim()||"(пустой ответ)";bot.textContent=out;bot.querySelector(".s").textContent="генерация · "+(r.model||"")+" · seed "+seed.toFixed(4);
hist.push({role:"user",content:text});hist.push({role:"assistant",content:out});if(hist.length>20)hist=hist.slice(-20);}
}catch(e){bot.textContent=String(e.message||e);bot.querySelector(".s").textContent="error";}
busy=false;paint();document.getElementById("q").focus();}
function startLoad(){if(!W){add("bot","aksi-webllm.js не найден.","error");return;}
try{localStorage.removeItem("aksi_webllm_skip");}catch(e){}
document.getElementById("msg").textContent="Загрузка модели…";
W.load(null,paint).then(function(){paint();
if(W.ready())add("bot","Модель: "+(W.status().model||"")+".\nПиши любой вопрос — генерация, не шаблон.","система");
else add("bot","Не удалось: "+(W.status().error||W.status().message||"?")+"\nНужен Chrome/Edge + WebGPU.","error");});}
if(!W){document.getElementById("msg").textContent="aksi-webllm.js не загрузился";add("bot","Генерация невозможна без /aksi-webllm.js","error");}
else{
window.addEventListener("aksi-webllm-progress",paint);
window.addEventListener("aksi:webllm-ready",paint);
document.getElementById("load").onclick=startLoad;
document.getElementById("skip").onclick=function(){try{localStorage.setItem("aksi_webllm_skip","1");}catch(e){}document.getElementById("msg").textContent="Авто отключено. Нажми Загрузить.";};
document.getElementById("send").onclick=function(){var v=document.getElementById("q").value;document.getElementById("q").value="";generate(v);};
document.getElementById("q").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();document.getElementById("send").click();}});
document.getElementById("clr").onclick=function(){hist=[];logEl.innerHTML="";add("bot","Чат очищен.","система");};
paint();
add("bot","Режим ГЕНЕРАЦИИ. Шаблоны выключены.\nЖди ready, затем любой вопрос.","система");
setTimeout(function(){try{if(localStorage.getItem("aksi_webllm_skip")==="1")return;}catch(e){}if(!W.ready()&&!W.loading())startLoad();},200);
}
})();
</script>
</body>
</html>
