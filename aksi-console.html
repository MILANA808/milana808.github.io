<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0c"><title>АКСИ · Console</title><style>:root{color-scheme:dark;font:15px system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0a0a0c;color:#f4f4f5}main{width:min(760px,100%);margin:auto;padding:24px 16px 110px}.head{display:flex;gap:12px;align-items:center;margin-bottom:18px}.logo{width:44px;height:44px;border-radius:14px;background:#7c3aed;display:grid;place-items:center;font-weight:800}.muted{color:#a1a1aa;font-size:13px}.card{background:#15151a;border:1px solid #292930;border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{border:1px solid #292930;border-radius:12px;padding:10px}.ok{color:#34d399}.no{color:#a1a1aa}textarea{width:100%;min-height:70px;background:#0f0f13;color:#fff;border:1px solid #333;border-radius:13px;padding:12px;font:inherit;resize:vertical}button{border:1px solid #333;background:#1d1d23;color:#fff;border-radius:11px;padding:10px 13px;font:inherit}button.primary{background:#7c3aed;border:0}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.answer{white-space:pre-wrap;line-height:1.6}.proof{font:11px ui-monospace,monospace;word-break:break-all;color:#c4b5fd}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style><script src="/aksi-runtime.js"></script></head><body><main><div class="head"><div class="logo">A</div><div><h1 style="margin:0">АКСИ</h1><div class="muted">единый cognitive runtime</div></div></div><section class="card"><b id="headline">Запуск…</b><div id="grid" class="grid" style="margin-top:12px"></div><div class="row"><button id="status">Проверить</button><button id="verify">Проверить цепочку</button></div></section><section class="card"><textarea id="q" placeholder="Задайте вопрос АКСИ…"></textarea><div class="row"><button id="ask" class="primary">Спросить</button><button id="learn">Сохранить как урок</button></div></section><section id="out" class="card" style="display:none"><div class="muted">Ответ</div><div id="answer" class="answer" style="margin-top:8px"></div><div id="meta" class="muted" style="margin-top:10px"></div><div id="proof" class="proof" style="margin-top:8px"></div></section><section class="card"><div class="muted">Честный режим</div><p class="muted">АКСИ отделяет вычисленное, наблюдаемое и непроверенное. Proof подтверждает целостность записи, а не истинность утверждения.</p></section></main><script>(async()=>{const $=id=>document.getElementById(id);const r=await window.AKSI_BOOT;const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function status(){const s=await r.status(),m=s.modules||{};const rows=[['Runtime',true],['Core',m.core],['Crypto',m.crypto],['IndexedDB',m.indexedDB],['WebAssembly',m.webAssembly],['Local-first',s.localFirst],['Network',s.online]];$('headline').textContent=s.selfTest?.ok?'АКСИ готова':'АКСИ работает с ограничениями';$('grid').innerHTML=rows.map(x=>`<div class="stat"><b>${esc(x[0])}</b><span class="${x[1]?'ok':'no'}">${x[1]?'AVAILABLE':'NOT ACTIVE'}</span></div>`).join('')}async function ask(){const q=$('q').value.trim();if(!q)return;$('ask').disabled=true;try{const x=await r.ask(q);$('out').style.display='block';$('answer').textContent=x.answer||'Нет ответа';$('meta').textContent=`status: ${x.status||'unknown'} · source: ${x.source||'local'} · ${x.timestamp}`;$('proof').textContent=x.proof?JSON.stringify(x.proof,null,2):'Proof не создан';}finally{$('ask').disabled=false}}$('ask').onclick=ask;$('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});$('status').onclick=status;$('verify').onclick=async()=>{const x=await r.verify();alert(x.ok?`Цепочка цела. Записей: ${x.count}.`:`Ошибка проверки: ${x.reason||'unknown'}`)};$('learn').onclick=()=>{const q=$('q').value.trim();if(!q)return;const ok=r.learn(q,{source:'user',approved:true});$('q').value='';alert(ok?'Урок сохранён локально.':'Не удалось сохранить урок.');};await status()})().catch(e=>{document.getElementById('headline').textContent='Ошибка запуска';console.error(e)})</script></body></html>
