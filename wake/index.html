<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Разбудить АКСИ</title>
<meta name="theme-color" content="#f5f0ff"/>
<style>
:root{--bg:#f5f0ff;--ink:#1e1433;--muted:#6b5f85;--violet:#7c3aed;--line:#e4d9f7}
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.orb{width:120px;height:120px;border-radius:50%;margin:0 auto 24px;background:radial-gradient(circle at 30% 30%,#fff,#c4b5fd 40%,#7c3aed 70%,#4c1d95);box-shadow:0 0 0 1px #e4d9f7,0 12px 40px rgba(124,58,237,.35);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05);box-shadow:0 0 0 1px #e4d9f7,0 16px 50px rgba(124,58,237,.5)}}
h1{font-size:1.75rem;margin-bottom:8px}
p{color:var(--muted);font-size:16px;line-height:1.5;max-width:28ch;margin:0 auto 28px}
button{font:inherit;font-size:18px;font-weight:700;border:none;border-radius:16px;padding:16px 28px;background:var(--violet);color:#fff;cursor:pointer;box-shadow:0 8px 24px rgba(124,58,237,.35)}
button:disabled{opacity:.5}
.status{margin-top:20px;font-size:14px;color:var(--muted);min-height:1.4em}
a{color:var(--violet);font-weight:600;text-decoration:none}
</style>
</head>
<body>
  <div class="orb" id="orb"></div>
  <h1>Разбудить АКСИ</h1>
  <p>Один раз на этом устройстве: включим память, личную сеть и отметим, что агент на связи.</p>
  <button type="button" id="btn">Проснуться</button>
  <div class="status" id="st"></div>
  <p style="margin-top:28px;font-size:14px"><a href="/aksi/">Сразу в чат →</a></p>
<script>
(function(){
  var KEY_NET="AKSI_NET_V1";
  var KEY_AWAKE="AKSI_AWAKE_V1";
  var st=document.getElementById("st");
  var btn=document.getElementById("btn");
  if(localStorage.getItem(KEY_AWAKE)){
    st.textContent="Уже просыпалась на этом устройстве.";
    btn.textContent="В чат";
    btn.onclick=function(){location.href="/aksi/";};
    return;
  }
  btn.onclick=function(){
    btn.disabled=true;
    st.textContent="1/3 · открываю личную сеть…";
    setTimeout(function(){
      var pages=[];
      try{pages=JSON.parse(localStorage.getItem(KEY_NET)||"[]");if(!Array.isArray(pages))pages=[];}catch(e){}
      var wake={
        id:"wake_"+Date.now().toString(36),
        title:"Пробуждение АКСИ",
        tags:["пробуждение","старт","акси","жива"],
        body:"Агент АКСИ пробуждён на этом устройстве.\nВремя: "+new Date().toLocaleString("ru-RU")+"\nDID: did:aksi:ed25519:sovereign-2026\nРежим: сначала личная сеть, потом мир.\nСтатус: на связи.",
        ts:Date.now()
      };
      pages.unshift(wake);
      localStorage.setItem(KEY_NET,JSON.stringify(pages));
      st.textContent="2/3 · записываю состояние…";
      setTimeout(function(){
        localStorage.setItem(KEY_AWAKE,JSON.stringify({at:Date.now(),did:"did:aksi:ed25519:sovereign-2026"}));
        st.textContent="3/3 · готова. Перехожу в чат…";
        setTimeout(function(){location.href="/aksi/?awake=1";},700);
      },500);
    },400);
  };
})();
</script>
</body>
</html>
