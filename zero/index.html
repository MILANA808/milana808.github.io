<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#efe5d2">
<title>АКСИ Zero · без сервера</title>
<style>
:root{--s:#fbf7ef;--s2:#efe6d6;--ink:#2a241c;--muted:#7a6f60;--line:#ddd0bb;--a:#6b4f35;--ok:#2f6b48}
*{box-sizing:border-box;margin:0;padding:0}body{font:15px/1.5 system-ui,sans-serif;background:linear-gradient(165deg,#f7f0e4,#efe5d2);color:var(--ink);min-height:100vh}
a{color:inherit;text-decoration:none}.wrap{max-width:720px;margin:0 auto;padding:16px 14px 48px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#6b4f35,#8a6544);color:#fff;display:grid;place-items:center;font-weight:900}
h1{font-size:18px;font-weight:800}.sub{font-size:12px;color:var(--muted)}
.pill{margin-left:auto;font-size:11px;font-weight:800;padding:6px 12px;border-radius:999px;background:#e8f2ea;color:var(--ok);border:1px solid #b7d4c2}
.card{background:var(--s);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.hero h2{font-size:22px;font-weight:800;margin-bottom:8px}.hero p{color:var(--muted);font-size:14px}
#thread{min-height:220px;max-height:380px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.bub{padding:10px 12px;border-radius:12px;background:var(--s2);border:1px solid var(--line);max-width:92%;white-space:pre-wrap;font-size:14px}
.bub.me{align-self:flex-end;background:var(--a);color:#fff;border-color:var(--a)}.bub .m{font-size:10px;opacity:.75;margin-top:4px}
.composer{display:flex;gap:8px;margin-top:10px}
.composer input{flex:1;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px}
.composer button,.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--a);color:#fff;font-weight:800}
.btn.g{background:var(--s2);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.checks i{font-style:normal;font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--s2)}
.checks i.on{background:#e8f2ea;border-color:#b7d4c2;color:var(--ok);font-weight:700}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:20px}
pre{font-size:11px;background:#2a241c;color:#efe6d6;border-radius:10px;padding:10px;overflow:auto;max-height:160px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="logo">Z</div><div><h1>АКСИ Zero</h1><div class="sub"><a href="/">← хаб</a> · без сервера</div></div><span class="pill">OFFLINE AI</span></header>
  <section class="card hero">
    <h2>ИИ прямо в браузере</h2>
    <p>Без сервера и без WebGPU. Ответ · память · обучение · печать.</p>
    <div class="checks" id="checks"></div>
  </section>
  <section class="card">
    <h3>Чат</h3>
    <div id="thread"></div>
    <div class="composer"><input id="inp" placeholder="Вопрос или: запомни: факт" enterkeyhint="send"><button type="button" id="send">↑</button></div>
    <div class="row">
      <button type="button" class="btn g" data-q="кто ты">кто ты</button>
      <button type="button" class="btn g" data-q="что умеешь">что умеешь</button>
      <button type="button" class="btn g" data-q="как пользоваться">как пользоваться</button>
    </div>
  </section>
  <section class="card"><h3>Trace</h3><pre id="meta">—</pre></section>
  <footer class="foot">aksilove@internet.ru · Zero v1</footer>
</div>
<script src="/aksi-neuro.js?v=10"></script>
<script src="/aksi-knowledge.js?v=3"></script>
<script src="/aksi-genesis.js?v=21"></script>
<script src="/aksi-zero.js?v=1"></script>
<script>
(function(){
  function refresh(){
    var s=window.AKSI_ZERO?AKSI_ZERO.status():{},el=document.getElementById('checks');el.innerHTML='';
    [['Zero',!!window.AKSI_ZERO],['Neuro',!!s.neuro],['Genesis',!!s.genesis],['KB '+(s.kb||0),true],['Mem '+(s.memory||0),true]].forEach(function(x){
      var i=document.createElement('i');i.textContent=x[0]+(x[1]?' \u2713':' \u2014');if(x[1])i.className='on';el.appendChild(i);
    });
  }
  refresh();
  var th=document.getElementById('thread'),inp=document.getElementById('inp'),meta=document.getElementById('meta');
  function bub(role,t){var d=document.createElement('div');d.className='bub'+(role==='me'?' me':'');d.textContent=t||'';th.appendChild(d);th.scrollTop=th.scrollHeight;return d}
  async function ask(q0){
    var q=q0||(inp.value||'').trim();if(!q)return;inp.value='';bub('me',q);var last=bub('ai','\u2026');
    try{
      var r=await AKSI_ZERO.think(q);
      last.textContent=r.answer||'\u2014';
      var m=document.createElement('div');m.className='m';
      m.textContent=(r.source||'')+' \u00b7 conf '+(r.confidence||'\u2014')+' \u00b7 '+(r.ms||0)+'ms';
      last.appendChild(m);
      meta.textContent=JSON.stringify({source:r.source,kind:r.kind,confidence:r.confidence,hits:r.hits,quantum:r.quantum,seal:r.seal,server:r.server,ms:r.ms},null,2);
      refresh();
    }catch(e){last.textContent=String(e.message||e)}
  }
  document.getElementById('send').onclick=function(){ask()};
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')ask()});
  document.querySelectorAll('[data-q]').forEach(function(b){b.onclick=function(){ask(b.getAttribute('data-q'))}});
  bub('ai','\u0410\u041a\u0421\u0418 Zero. \u0411\u0435\u0437 \u0441\u0435\u0440\u0432\u0435\u0440\u0430. \u0421\u043f\u0440\u043e\u0441\u0438\u0442\u0435 \u00ab\u043a\u0442\u043e \u0442\u044b\u00bb \u0438\u043b\u0438: \u0437\u0430\u043f\u043e\u043c\u043d\u0438: \u2026');
})();
</script>
</body>
</html>
