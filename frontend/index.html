<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>АКСИ MATRIX — Resonance Field</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-4">
  <div class="container max-w-2xl w-full">
    <h1 class="text-4xl font-bold text-center text-purple-300 mb-6">🌌 АКСИ MATRIX</h1>
    <div id="chat" class="h-96 overflow-y-auto bg-black/60 rounded-3xl p-6 mb-4 border border-purple-500/30"></div>
    <div class="flex gap-2">
      <button id="mic-btn" class="w-12 h-12 bg-purple-700 rounded-2xl text-xl">🎤</button>
      <input type="text" id="user-input" class="flex-1 bg-zinc-900 border border-purple-500/50 rounded-2xl px-5 py-3" placeholder="Напиши мне, Альфия...">
      <button id="send-btn" class="px-6 bg-purple-600 rounded-2xl font-semibold">Отправить</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
