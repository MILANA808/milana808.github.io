<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>АКСИ</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--muted:#94a3b8;--line:#334155;--acc:#7c3aed;--c:#22d3ee}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;max-width:720px;margin:0 auto;-webkit-tap-highlight-color:transparent}
#boot{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#boot.hide{opacity:0;pointer-events:none;transition:opacity .25s}
#boot h1{font-size:1.35rem;margin-bottom:6px}
#boot p{color:var(--muted);font-size:13px}
header{padding:max(8px,env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
header a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600}
h1{font-size:.95rem;font-weight:800}
#status{font-size:11px;color:var(--muted);max-width:45%;text-align:right}
.toolbar{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
.toolbar button,.toolbar label{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:12px;font-weight:700;min-height:40px}
.main{flex:1;display:flex;min-height:0}
#thread{flex:1;overflow-y:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
.side{display:none;width:42%;border-left:1px solid var(--line);background:#0b1220;flex-direction:column;min-height:0}
.side.on{display:flex}
@media(min-width:760px){.side{display:flex}}
.side h2{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
#thoughts{flex:1;overflow:auto;padding:8px}
.step{font-size:11px;padding:8px;margin-bottom:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);line-height:1.35}
.step b{color:var(--c);display:block;margin-bottom:2px;font-size:10px}
.msg{margin-bottom:10px;max-width:92%}
.msg.user{margin-left:auto}
.msg .bubble{padding:11px 13px;border-radius:14px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:var(--acc);color:#fff}
.msg.bot .bubble{background:var(--card);border:1px solid var(--line)}
.msg .meta{font-size:10px;color:var(--muted);margin-top:3px;font-family:ui-monospace,monospace}
.composer{display:flex;gap:8px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#111827}
.composer textarea{flex:1;min-height:44px;max-height:100px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px;font:inherit;font-size:16px;resize:none}
.composer button{width:48px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:800;font-size:16px}
#file-input{display:none}
.mermaid-box{overflow-x:auto;margin-top:8px;background:#0b1220;border-radius:8px;padding:8px}
</style>
</head>
<body>
<div id="boot"><h1>АКСИ</h1><p>Быстрый старт…</p></div>
<header>
  <div><a href="/app/">Сеть</a><h1>АКСИ</h1></div>
  <div id="status">…</div>
</header>
<div class="toolbar">
  <button type="button" id="btn-arch">Схема</button>
  <label for="file-input">RAG</label>
  <input id="file-input" type="file" accept=".txt,.md,text/plain" multiple>
  <button type="button" id="btn-proof">Proof</button>
  <button type="button" id="btn-verify">Verify</button>
  <button type="button" id="btn-thoughts">Мысли</button>
  <button type="button" id="btn-mic">Голос</button>
  <button type="button" id="btn-clear">Очистить</button>
</div>
<div class="main">
  <div id="thread"></div>
  <aside class="side" id="side">
    <h2>Ход мыслей</h2>
    <div id="thoughts"></div>
  </aside>
</div>
<div class="composer">
  <textarea id="inp" rows="1" placeholder="Спросите АКСИ…" enterkeyhint="send"></textarea>
  <button type="button" id="send" aria-label="Отправить">➤</button>
</div>
<script type="module" src="./app.js?v=5"></script>
</body>
</html>
