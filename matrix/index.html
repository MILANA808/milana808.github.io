<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>АКСИ</title>
<meta name="theme-color" content="#0f172a">
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
  mermaid.initialize({ startOnLoad: false, theme: "dark" });
  window.__mermaid = mermaid;
</script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--muted:#94a3b8;--line:#334155;--acc:#8b5cf6;--c:#22d3ee}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:0 auto}
#boot{position:fixed;inset:0;z-index:100;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#boot.hide{opacity:0;pointer-events:none;transition:opacity .4s}
#boot h1{font-size:1.5rem;margin-bottom:8px}
#boot p{color:var(--muted);font-size:14px;margin-bottom:16px;max-width:20em;line-height:1.4}
.bar-wrap{width:min(280px,80vw);height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar-wrap i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#8b5cf6,#22d3ee);transition:width .15s}
#boot-msg{margin-top:12px;font-size:12px;color:var(--muted)}
header{padding:max(10px,env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
header a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600}
h1{font-size:1rem;font-weight:800}
#status{font-size:11px;color:var(--muted);max-width:48%;text-align:right}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:#111827}
.toolbar button,.toolbar label.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer}
.toolbar button.primary{background:var(--acc);border-color:var(--acc)}
.main{flex:1;display:grid;grid-template-columns:1.2fr .8fr;min-height:0}
@media(max-width:720px){.main{grid-template-columns:1fr}.side{display:none}.side.on{display:flex}}
#thread{overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}
.side{display:flex;flex-direction:column;border-left:1px solid var(--line);background:#0b1220;min-height:0}
.side h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
#thoughts{flex:1;overflow:auto;padding:10px 12px}
.step{font-size:12px;line-height:1.4;padding:8px 10px;margin-bottom:8px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.step b{color:var(--c);display:block;margin-bottom:4px;font-size:11px}
.step .sig{font-family:ui-monospace,monospace;font-size:10px;color:var(--muted);word-break:break-all;margin-top:6px}
.msg{margin-bottom:12px;max-width:95%}
.msg.user{margin-left:auto}
.msg .bubble{padding:12px 14px;border-radius:14px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:var(--acc);color:#fff}
.msg.bot .bubble{background:var(--card);border:1px solid var(--line)}
.msg .meta{font-size:10px;color:var(--muted);margin-top:4px;font-family:ui-monospace,monospace}
.mermaid-box{background:#0b1220;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;overflow-x:auto}
.composer{display:flex;gap:8px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#111827}
.composer textarea{flex:1;min-height:48px;max-height:140px;resize:vertical;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;font:inherit;font-size:16px}
.composer button{width:52px;border:none;border-radius:12px;background:var(--acc);color:#fff;font-weight:800}
#file-input{display:none}
</style>
</head>
<body>
<div id="boot">
  <h1>АКСИ</h1>
  <p>Память · знания · модель · подпись мыслей</p>
  <div class="bar-wrap"><i id="boot-bar"></i></div>
  <div id="boot-msg">Старт</div>
</div>
<header>
  <div>
    <a href="/app/">Сеть</a>
    <h1>АКСИ MATRIX</h1>
  </div>
  <div id="status">запуск…</div>
</header>
<div class="toolbar">
  <button type="button" class="primary" id="btn-model">Модель</button>
  <button type="button" id="btn-mic">Голос</button>
  <label class="btn" for="file-input">RAG</label>
  <input id="file-input" type="file" accept=".txt,.md,text/plain,text/markdown" multiple>
  <button type="button" id="btn-arch">Схема</button>
  <button type="button" id="btn-thoughts">Мысли</button>
  <button type="button" id="btn-clear">Очистить</button>
</div>
<div class="main">
  <div id="thread"></div>
  <aside class="side on" id="side">
    <h2>Ход мыслей · Resonance</h2>
    <div id="thoughts"><div class="step"><b>ожидание</b>Задайте вопрос — появится подписанная цепочка TTP.</div></div>
  </aside>
</div>
<div class="composer">
  <textarea id="inp" rows="2" placeholder="Спросите АКСИ… «кто ты», «архитектура», «покажи схему»" enterkeyhint="send"></textarea>
  <button type="button" id="send">➤</button>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
