<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>АКСИ MATRIX</title>
<meta name="theme-color" content="#0f172a">
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
  mermaid.initialize({ startOnLoad: false, theme: "dark" });
  window.__mermaid = mermaid;
</script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--muted:#94a3b8;--line:#334155;--acc:#8b5cf6;--ok:#22c55e;--warn:#f59e0b}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
header{padding:max(10px,env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
header a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600}
h1{font-size:1rem;font-weight:800}
#status{font-size:11px;color:var(--muted);max-width:45%;text-align:right}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:#111827}
.toolbar button,.toolbar label.btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;
  padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer;
}
.toolbar button.primary{background:var(--acc);border-color:var(--acc)}
.toolbar button:disabled{opacity:.45}
#thread{flex:1;overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}
.msg{margin-bottom:12px;max-width:95%}
.msg.user{margin-left:auto}
.msg .bubble{padding:12px 14px;border-radius:14px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:var(--acc);color:#fff}
.msg.bot .bubble{background:var(--card);border:1px solid var(--line)}
.msg .meta{font-size:10px;color:var(--muted);margin-top:4px}
.mermaid-box{background:#0b1220;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;overflow-x:auto}
.composer{display:flex;gap:8px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#111827}
.composer textarea{flex:1;min-height:44px;max-height:120px;resize:vertical;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;font:inherit;font-size:16px}
.composer button{width:52px;border:none;border-radius:12px;background:var(--acc);color:#fff;font-weight:800}
.progress{height:4px;background:var(--line);margin:0 12px 8px;border-radius:4px;overflow:hidden;display:none}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#22d3ee);transition:width .2s}
#file-input{display:none}
</style>
</head>
<body>
<header>
  <div>
    <a href="/app/">← АКСИ</a>
    <h1>MATRIX · локальный ИИ</h1>
  </div>
  <div id="status">модель не загружена · работает fallback</div>
</header>
<div class="progress" id="prog"><i id="prog-bar"></i></div>
<div class="toolbar">
  <button type="button" class="primary" id="btn-model">Загрузить модель</button>
  <button type="button" id="btn-mic">🎤 Голос</button>
  <label class="btn" for="file-input">📎 Файлы RAG</label>
  <input id="file-input" type="file" accept=".txt,.md,text/plain,text/markdown" multiple>
  <button type="button" id="btn-clear">Очистить историю</button>
  <button type="button" id="btn-stats">Статус</button>
</div>
<div id="thread"></div>
<div class="composer">
  <textarea id="inp" rows="1" placeholder="Спросите… (например: покажи схему архитектуры АКСИ)" enterkeyhint="send"></textarea>
  <button type="button" id="send">➤</button>
</div>

<script type="module">
import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

const DB_NAME = "aksi_matrix_v1";
const STORE_MSG = "messages";
const STORE_RAG = "rag";
const SYSTEM = `Ты — АКСИ MATRIX, суверенный локальный ассистент.
Если пользователь просит схему, диаграмму или архитектуру — верни ТОЛЬКО блок:
\`\`\`mermaid
...диаграмма...
\`\`\`
Без лишних слов до и после блока.
Иначе отвечай кратко и по делу на языке пользователя.
Если дан контекст из файлов пользователя — опирайся на него.`;

let engine = null;
let loading = false;
let ragChunks = [];

// ——— IndexedDB ———
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_MSG)) {
        db.createObjectStore(STORE_MSG, { keyPath: "id", autoIncrement: true });
      }
      if (!db.objectStoreNames.contains(STORE_RAG)) {
        db.createObjectStore(STORE_RAG, { keyPath: "id", autoIncrement: true });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function saveMsg(role, content) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_MSG, "readwrite");
    tx.objectStore(STORE_MSG).add({ role, content, ts: Date.now() });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function loadMsgs(limit = 40) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_MSG, "readonly");
    const req = tx.objectStore(STORE_MSG).getAll();
    req.onsuccess = () => {
      const all = req.result || [];
      resolve(all.slice(-limit));
    };
    req.onerror = () => reject(req.error);
  });
}
async function clearMsgs() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_MSG, "readwrite");
    tx.objectStore(STORE_MSG).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function saveRagChunk(chunk) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_RAG, "readwrite");
    tx.objectStore(STORE_RAG).add(chunk);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function loadRag() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_RAG, "readonly");
    const req = tx.objectStore(STORE_RAG).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function clearRag() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_RAG, "readwrite");
    tx.objectStore(STORE_RAG).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// ——— UI ———
const thread = document.getElementById("thread");
const statusEl = document.getElementById("status");
const prog = document.getElementById("prog");
const progBar = document.getElementById("prog-bar");

function setStatus(t) { statusEl.textContent = t; }

function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

async function renderMermaid(code, container) {
  try {
    const id = "mmd_" + Math.random().toString(36).slice(2);
    const { svg } = await window.__mermaid.render(id, code);
    container.innerHTML = svg;
  } catch (e) {
    container.textContent = code;
  }
}

function addBubble(role, content, meta) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + (role === "user" ? "user" : "bot");
  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const mermaidMatch = content.match(/```mermaid\s*([\s\S]*?)```/i);
  if (mermaidMatch && role !== "user") {
    const before = content.slice(0, mermaidMatch.index).trim();
    if (before) {
      const t = document.createElement("div");
      t.textContent = before;
      bubble.appendChild(t);
    }
    const box = document.createElement("div");
    box.className = "mermaid-box";
    bubble.appendChild(box);
    renderMermaid(mermaidMatch[1].trim(), box);
    const after = content.slice(mermaidMatch.index + mermaidMatch[0].length).trim();
    if (after) {
      const t2 = document.createElement("div");
      t2.style.marginTop = "8px";
      t2.textContent = after;
      bubble.appendChild(t2);
    }
  } else {
    bubble.textContent = content;
  }
  wrap.appendChild(bubble);
  if (meta) {
    const m = document.createElement("div");
    m.className = "meta";
    m.textContent = meta;
    wrap.appendChild(m);
  }
  thread.appendChild(wrap);
  thread.scrollTop = thread.scrollHeight;
}

// ——— Simple RAG (TF cosine, pure JS — works offline after files loaded) ———
function tokenize(s) {
  return String(s).toLowerCase().replace(/[^\p{L}\p{N}\s]+/gu, " ").split(/\s+/).filter(Boolean);
}
function tf(tokens) {
  const m = {};
  tokens.forEach(t => { m[t] = (m[t] || 0) + 1; });
  return m;
}
function cosine(a, b) {
  let dot = 0, na = 0, nb = 0;
  const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
  keys.forEach(k => {
    const x = a[k] || 0, y = b[k] || 0;
    dot += x * y; na += x * x; nb += y * y;
  });
  if (!na || !nb) return 0;
  return dot / (Math.sqrt(na) * Math.sqrt(nb));
}
function chunkText(text, size = 500) {
  const parts = [];
  const clean = text.replace(/\r/g, "");
  for (let i = 0; i < clean.length; i += size) parts.push(clean.slice(i, i + size));
  return parts.filter(p => p.trim().length > 20);
}
function retrieve(query, k = 3) {
  const q = tf(tokenize(query));
  return ragChunks
    .map(c => ({ ...c, score: cosine(q, c.tf) }))
    .sort((a, b) => b.score - a.score)
    .filter(c => c.score > 0.02)
    .slice(0, k);
}

async function ingestFiles(fileList) {
  for (const f of fileList) {
    const text = await f.text();
    const chunks = chunkText(text);
    for (const ch of chunks) {
      const item = { source: f.name, text: ch, tf: tf(tokenize(ch)), ts: Date.now() };
      ragChunks.push(item);
      await saveRagChunk(item);
    }
  }
  setStatus("RAG: " + ragChunks.length + " фрагментов · " + (engine ? "модель готова" : "fallback"));
  addBubble("assistant", "Загружено в RAG. Фрагментов: " + ragChunks.length + ". Спросите по содержимому файлов.", "rag");
}

// ——— Fallback local brain ———
async function fallbackReply(userText, context) {
  const low = userText.toLowerCase();
  if (/схем|диаграмм|архитектур|mermaid|покажи схему/.test(low)) {
    return "```mermaid\nflowchart TB\n  U[Пользователь] --> UI[MATRIX UI]\n  UI --> Mem[IndexedDB память]\n  UI --> RAG[RAG по файлам]\n  UI --> LLM[WebLLM / fallback]\n  LLM --> UI\n  RAG --> LLM\n```";
  }
  if (context) return "По вашим файлам:\n\n" + context.slice(0, 1200);
  if (/привет|здравств/.test(low)) return "Здравствуйте. MATRIX онлайн. Загрузите модель или работайте в fallback.";
  if (/ты здесь|кто ты/.test(low)) return "АКСИ MATRIX — локальный контур: память IndexedDB, RAG, Mermaid, голос. Модель WebLLM подключается кнопкой.";
  return "Fallback-режим: загрузите модель (кнопка выше) или добавьте .txt/.md в RAG. Для схемы напишите «покажи схему архитектуры».";
}

async function chat(userText) {
  const hits = retrieve(userText, 3);
  const context = hits.map(h => "[" + h.source + "]\n" + h.text).join("\n\n");
  const history = await loadMsgs(12);
  const messages = [{ role: "system", content: SYSTEM + (context ? "\n\nКонтекст из файлов пользователя:\n" + context : "") }];
  history.forEach(m => messages.push({ role: m.role === "user" ? "user" : "assistant", content: m.content }));
  messages.push({ role: "user", content: userText });

  if (engine) {
    try {
      const reply = await engine.chat.completions.create({
        messages,
        temperature: 0.7,
        max_tokens: 512,
      });
      return reply.choices?.[0]?.message?.content || "(пустой ответ модели)";
    } catch (e) {
      return await fallbackReply(userText, context);
    }
  }
  return await fallbackReply(userText, context);
}

// ——— Model load ———
async function loadModel() {
  if (loading || engine) return;
  loading = true;
  prog.style.display = "block";
  document.getElementById("btn-model").disabled = true;
  setStatus("Загрузка модели…");
  try {
    // Small instruct model from MLC catalog (downloaded to browser cache)
    const model = "TinyLlama-1.1B-Chat-v1.0-q4f16_1-MLC";
    engine = await CreateMLCEngine(model, {
      initProgressCallback: (r) => {
        const p = Math.round((r.progress || 0) * 100);
        progBar.style.width = p + "%";
        setStatus((r.text || "Загрузка") + " · " + p + "%");
      },
    });
    setStatus("модель готова · локальный инференс");
    addBubble("assistant", "Модель загружена в браузер. Можно работать. При офлайне ответы идут из кэша модели (после первой загрузки).", "webllm");
  } catch (e) {
    engine = null;
    setStatus("модель не загрузилась · fallback");
    addBubble("assistant", "Не удалось загрузить WebLLM (память/браузер/сеть). Работаю в fallback: RAG, Mermaid, история.", String(e.message || e));
  }
  loading = false;
  document.getElementById("btn-model").disabled = false;
  setTimeout(() => { prog.style.display = "none"; }, 800);
}

// ——— Voice (Web Speech API — reliable demo; whisper.wasm optional later) ———
let rec = null;
function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    addBubble("assistant", "Голос не поддерживается в этом браузере. Используйте Chrome/Edge.", "voice");
    return;
  }
  rec = new SR();
  rec.lang = "ru-RU";
  rec.interimResults = false;
  rec.onresult = (ev) => {
    const t = ev.results[0][0].transcript;
    document.getElementById("inp").value = t;
    send();
  };
  rec.onerror = () => setStatus("голос: ошибка");
  rec.start();
  setStatus("слушаю…");
}

// ——— Send ———
async function send() {
  const inp = document.getElementById("inp");
  const text = (inp.value || "").trim();
  if (!text) return;
  inp.value = "";
  addBubble("user", text);
  await saveMsg("user", text);
  setStatus("генерация…");
  const answer = await chat(text);
  addBubble("assistant", answer, engine ? "webllm" : "fallback");
  await saveMsg("assistant", answer);
  setStatus(engine ? "модель готова" : "fallback · RAG:" + ragChunks.length);
}

// ——— Wire ———
document.getElementById("send").onclick = send;
document.getElementById("inp").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById("btn-model").onclick = loadModel;
document.getElementById("btn-mic").onclick = startVoice;
document.getElementById("file-input").onchange = async (e) => {
  const files = e.target.files;
  if (files?.length) await ingestFiles(files);
  e.target.value = "";
};
document.getElementById("btn-clear").onclick = async () => {
  await clearMsgs();
  thread.innerHTML = "";
  addBubble("assistant", "История очищена.", "system");
};
document.getElementById("btn-stats").onclick = async () => {
  const msgs = await loadMsgs(1000);
  addBubble("assistant",
    "Сообщений в IndexedDB: " + msgs.length +
    "\nRAG фрагментов: " + ragChunks.length +
    "\nМодель: " + (engine ? "загружена" : "нет (fallback)") +
    "\nОнлайн: " + navigator.onLine,
    "status");
};

// boot
(async () => {
  const msgs = await loadMsgs(40);
  msgs.forEach(m => addBubble(m.role === "user" ? "user" : "assistant", m.content));
  ragChunks = await loadRag();
  // rehydrate tf if missing
  ragChunks = ragChunks.map(c => ({
    ...c,
    tf: c.tf || tf(tokenize(c.text || "")),
  }));
  setStatus("память: " + msgs.length + " · RAG: " + ragChunks.length + " · модель не загружена");
  if (!msgs.length) {
    addBubble("assistant",
      "MATRIX готов.\n1) Загрузить модель (WebLLM, первый раз скачает веса)\n2) Опционально: файлы .txt/.md для RAG\n3) «покажи схему архитектуры АКСИ» — Mermaid\n4) 🎤 голос",
      "system");
  }
})();
</script>
</body>
</html>
