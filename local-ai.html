<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>АКСИ Local AI + Quantum — полный контур</title>
<meta name="description" content="Neuro + память + ECDSA + quantum state-vector">
<meta name="theme-color" content="#0b0b0f">
<link rel="canonical" href="https://milana808.github.io/local-ai.html">
<style>
:root{--bg:#0b0b0f;--card:#14141c;--ink:#f2f1eb;--muted:#9a97a3;--line:#2a2a36;--acc:#8b7cf7;--ok:#3ecf8e;--cyan:#5eead4}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink);max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800}.logo span{color:var(--acc)}
header a{color:var(--muted);font-size:12px;text-decoration:none;margin-left:8px}
.banner{padding:10px 16px;background:#101018;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.banner b{color:var(--cyan)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 16px}
.board div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.board b{display:block;font-size:1rem;color:var(--ok)}
.board span{font-size:10px;color:var(--muted)}
.mods{padding:0 16px 8px;font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:11px 6px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.panel{display:none;flex:1;flex-direction:column}
.panel.on{display:flex}
.msgs{flex:1;overflow:auto;padding:10px 16px;display:flex;flex-direction:column;gap:8px;min-height:200px;max-height:38vh}
.msg{padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#1a1a26;max-width:92%}
.msg .meta{margin-top:6px;font-size:11px;color:var(--muted);font-family:ui-monospace,monospace;border-top:1px solid var(--line);padding-top:6px}
.bar{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
input,textarea{flex:1;min-width:100px;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#101018;color:var(--ink)}
button{font:inherit;font-size:13px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:44px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button:disabled{opacity:.4}
.qgrid{padding:12px 16px;display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.card h3{font-size:13px;color:var(--acc);margin-bottom:8px}
.qbtns{display:flex;flex-wrap:wrap;gap:8px}
pre{background:#0e0e14;padding:10px;border-radius:10px;font-size:11px;overflow:auto;max-height:220px;color:var(--muted);white-space:pre-wrap;margin-top:8px}
.bloch-wrap{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-top:8px}
canvas.bloch{width:180px;height:180px;background:#0e0e14;border-radius:12px;border:1px solid var(--line)}
footer{padding:10px 16px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
footer a{color:var(--muted)}
@media(max-width:520px){.board{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <div class="logo">АКСИ <span>Local+Q</span></div>
  <nav><a href="/">След</a> <a href="/capsule.html">Капсула</a> <a href="/HONEST.md">Честно</a></nav>
</header>
<div class="banner"><b>Полный контур:</b> Neuro + память + ECDSA + quantum state-vector. Quantum = <b>классический симулятор</b>.</div>
<div class="board">
  <div><b id="nF">0</b><span>память</span></div>
  <div><b id="nS">0</b><span>печати</span></div>
  <div><b id="nG">—</b><span>QCLI</span></div>
  <div><b id="nE">—</b><span>engine</span></div>
</div>
<div class="mods" id="mods">…</div>
<div class="tabs">
  <button type="button" class="on" data-tab="ai">ИИ</button>
  <button type="button" data-tab="q">Quantum</button>
  <button type="button" data-tab="pipe">Контур</button>
</div>
<div class="panel on" id="p-ai">
  <div class="msgs" id="msgs"></div>
  <div class="bar">
    <input type="text" id="qin" placeholder="запомни: факт · или вопрос" autocomplete="off">
    <button type="button" class="p" id="send">Отправить</button>
  </div>
  <div class="bar" style="border-top:0;padding-top:0">
    <button type="button" id="seal" disabled>Запечатать</button>
    <button type="button" id="exp">Экспорт</button>
    <button type="button" id="clr">Сброс</button>
  </div>
</div>
<div class="panel" id="p-q">
  <div class="qgrid"><div class="card">
    <h3>Квантовый симулятор</h3>
    <div class="qbtns">
      <button type="button" class="p" data-q="bell">Bell Φ+</button>
      <button type="button" data-q="chsh">CHSH</button>
      <button type="button" data-q="grover">Grover</button>
      <button type="button" data-q="qft">QFT-3</button>
      <button type="button" data-q="gate">answerGate</button>
      <button type="button" data-q="shot">shot</button>
    </div>
    <div class="bloch-wrap">
      <canvas class="bloch" id="bloch" width="180" height="180"></canvas>
      <pre id="qout" style="flex:1;min-width:160px;margin:0">Выберите схему</pre>
    </div>
    <pre id="qcirc">circuit</pre>
  </div></div>
</div>
<div class="panel" id="p-pipe">
  <div class="qgrid"><div class="card">
    <h3>Вопрос → AI → Gate → Печать</h3>
    <input type="text" id="pq" value="кто ты?" style="width:100%;margin-bottom:8px">
    <div class="qbtns">
      <button type="button" class="p" id="prun">Запустить</button>
      <button type="button" id="pseal" disabled>Запечатать</button>
      <button type="button" id="prec" disabled>Квитанция</button>
    </div>
    <pre id="pout">—</pre>
  </div></div>
</div>
<footer>aksilove@internet.ru · <a href="/trail.html">След</a> · <span id="ver"></span></footer>
<script src="/aksi-capsule.js?v=13"></script>
<script src="/aksi-quantum.js"></script>
<script src="/aksi-neuro.js"></script>
<script>
(function(){
  var C=window.AKSI_CAPSULE,Q=window.AKSI_QUANTUM,N=window.AKSI_NEURO;
  var neuroThink=N&&(N.think||N.ask)?function(q){return (N.think||N.ask)(q);}:null;
  var last=null;
  function j(x){try{return JSON.stringify(x,null,2);}catch(e){return String(x);}}
  document.querySelectorAll(".tabs button").forEach(function(btn){
    btn.onclick=function(){
      document.querySelectorAll(".tabs button").forEach(function(b){b.classList.remove("on");});
      document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("on");});
      btn.classList.add("on");
      document.getElementById("p-"+btn.getAttribute("data-tab")).classList.add("on");
    };
  });
  function paint(){
    var facts=0,seals=0,ver="";
    if(C&&C.status){var s=C.status();facts=s.facts||0;seals=s.seals||0;ver=s.version||"";}
    document.getElementById("nF").textContent=facts;
    document.getElementById("nS").textContent=seals;
    document.getElementById("nG").textContent=last&&last.gate&&last.gate.QCLI!=null?Number(last.gate.QCLI).toFixed(2):"—";
    document.getElementById("nE").textContent=last&&last.engine?last.engine:"—";
    document.getElementById("seal").disabled=!last;
    document.getElementById("mods").textContent="модули: capsule"+(C?"✓":"✗")+" quantum"+(Q?"✓":"✗")+" neuro"+(neuroThink?"✓":"✗");
    document.getElementById("ver").textContent=(Q&&Q.version?"q "+Q.version:"")+(ver?" · "+ver:"");
  }
  var msgs=document.getElementById("msgs");
  function add(role,text,meta){
    var d=document.createElement("div");d.className="msg "+role;d.textContent=text;
    if(meta){var m=document.createElement("div");m.className="meta";m.textContent=meta;d.appendChild(m);}
    msgs.appendChild(d);d.scrollIntoView({block:"end"});
  }
  if(C)C.ensureKeys().catch(function(){});
  add("bot","Полный контур:\n• запомни: факт\n• вопрос → Neuro/память\n• Gate (QCLI)\n• Запечатать ECDSA\n\nВкладка Quantum — симулятор.","start");
  paint();
  function neuroAnswer(q){
    if(!neuroThink)return null;
    try{
      var r=neuroThink(q);
      if(typeof r==="string"&&r.trim())return{text:r.trim(),engine:"neuro"};
      if(r&&(r.text||r.answer))return{text:String(r.text||r.answer),engine:"neuro",score:r.score};
    }catch(e){}
    return null;
  }
  async function answer(q){
    if(C){var ca=await C.ask(q,{research:false});if(ca&&ca.source==="memory"&&ca.text)return{text:ca.text,engine:"memory"};}
    var n=neuroAnswer(q);if(n)return n;
    if(C){var cw=await C.ask(q,{research:true});if(cw&&cw.text)return{text:cw.text,engine:cw.source||"capsule"};}
    return{text:"Нет данных. запомни: факт  или  спросите «кто ты?»","engine":"empty"};
  }
  function attachGate(q,text){
    if(!Q||!Q.answerGate)return null;
    try{return Q.answerGate(q,text);}catch(e){return null;}
  }
  async function send(){
    var raw=document.getElementById("qin").value.trim();if(!raw)return;
    document.getElementById("qin").value="";add("user",raw);
    var teach=raw.match(/^(?:запомни|remember)\s*[:：]\s*(.+)$/i);
    if(teach){
      if(C)C.remember(teach[1].trim());
      if(N&&N.learn)try{N.learn(teach[1].trim());}catch(e){}
      add("bot","В память:\n«"+teach[1].trim()+"»","memory");paint();return;
    }
    var a=await answer(raw);
    var gate=attachGate(raw,a.text);
    last={q:raw,text:a.text,engine:a.engine,gate:gate};
    var meta=[a.engine||""];
    if(gate){meta.push("QCLI "+Number(gate.QCLI).toFixed(2));meta.push("H "+Number(gate.entropy).toFixed(2));}
    add("bot",a.text,meta.filter(Boolean).join(" · "));paint();
  }
  document.getElementById("send").onclick=send;
  document.getElementById("qin").onkeydown=function(e){if(e.key==="Enter")send();};
  document.getElementById("seal").onclick=async function(){
    if(!last||!C)return;
    C.remember("seal-ctx: "+last.q);await C.ask(last.q,{research:false});
    var r=await C.sealLast();
    if(!r.ok){add("bot","Печать: "+(r.error||""),"");return;}
    last.seal=r.seal;
    add("bot","ECDSA\n"+r.seal.hash.slice(0,40)+"…"+(last.gate?"\nQCLI "+Number(last.gate.QCLI).toFixed(3):""),"seal");
    paint();
  };
  document.getElementById("exp").onclick=function(){if(C&&C.downloadCapsule)C.downloadCapsule({alsoAksi:true});};
  document.getElementById("clr").onclick=function(){
    if(!confirm("Сбросить?"))return;
    if(C)C.clearAll();last=null;msgs.innerHTML="";add("bot","Очищено","");paint();
  };
  function drawBloch(b){
    var canvas=document.getElementById("bloch");if(!canvas||!b)return;
    if(Q&&Q.drawBloch){try{Q.drawBloch(canvas,b);return;}catch(e){}}
    var ctx=canvas.getContext("2d");if(!ctx)return;
    var w=canvas.width,h=canvas.height,cx=w/2,cy=h/2,R=Math.min(w,h)*0.38;
    ctx.clearRect(0,0,w,h);ctx.strokeStyle="rgba(139,124,247,.35)";
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();
    var px=cx+(b.x||0)*R,py=cy-(b.z||0)*R;
    ctx.strokeStyle="#c4b5fd";ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(px,py);ctx.stroke();
    ctx.fillStyle="#a78bfa";ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill();
  }
  function runQ(kind){
    var out=document.getElementById("qout"),circ=document.getElementById("qcirc");
    if(!Q){out.textContent="нет quantum";return;}
    try{
      var r;
      if(kind==="bell"){r=Q.bell("phi+");out.textContent=j(r.summary?r.summary():r);circ.textContent=r.circuitString?r.circuitString():"Bell";if(r.bloch)drawBloch(r.bloch(0));else if(r.bloch0)drawBloch(r.bloch0);}
      else if(kind==="chsh"){out.textContent=j(Q.chsh(512));circ.textContent="CHSH |S|≤2 classical, ≤2√2 quantum";}
      else if(kind==="grover"){r=Q.grover?Q.grover(2,1):null;if(!r){out.textContent="no grover";return;}out.textContent=j(r.summary?r.summary():r);circ.textContent=r.circuitString?r.circuitString():"Grover";if(r.bloch)drawBloch(r.bloch(0));}
      else if(kind==="qft"){if(!Q.create){out.textContent="no create";return;}r=Q.create(3).x(0).qft();out.textContent=j(r.summary?r.summary():{ok:1});circ.textContent=r.circuitString?r.circuitString():"QFT";if(r.bloch)drawBloch(r.bloch(0));}
      else if(kind==="gate"){r=Q.answerGate("кто ты?","Я АКСИ");out.textContent=j({QCLI:r.QCLI,entropy:r.entropy,purity:r.purity,resonance:r.resonance,outcome:r.outcome});circ.textContent=r.circuit||"gate";if(r.bloch0)drawBloch(r.bloch0);}
      else if(kind==="shot"){out.textContent=j(Q.shot?Q.shot("aksi"):{});circ.textContent="shot";}
    }catch(e){out.textContent=String(e.message||e);}
  }
  document.querySelectorAll("[data-q]").forEach(function(b){b.onclick=function(){runQ(b.getAttribute("data-q"));};});
  document.getElementById("prun").onclick=async function(){
    var q=document.getElementById("pq").value.trim()||"кто ты?";
    document.getElementById("pout").textContent="…";
    var a=await answer(q);var gate=attachGate(q,a.text);
    last={q:q,text:a.text,engine:a.engine,gate:gate};
    document.getElementById("pseal").disabled=false;
    document.getElementById("prec").disabled=true;
    document.getElementById("pout").textContent=j({engine:a.engine,answer:a.text,gate:gate&&{QCLI:gate.QCLI,entropy:gate.entropy,purity:gate.purity,outcome:gate.outcome},next:"Запечатать"});
    if(gate&&gate.bloch0)drawBloch(gate.bloch0);paint();
  };
  document.getElementById("pseal").onclick=async function(){
    if(!last||!C)return;
    C.remember("pipe: "+last.q);await C.ask(last.q,{research:false});
    var r=await C.sealLast();
    if(!r.ok){document.getElementById("pout").textContent="error "+(r.error||"");return;}
    last.seal=r.seal;document.getElementById("prec").disabled=false;
    document.getElementById("pout").textContent=j({answer:last.text,engine:last.engine,gate:last.gate&&{QCLI:last.gate.QCLI},seal:{hash:r.seal.hash,alg:r.seal.alg,at:r.seal.sealedAt}});paint();
  };
  document.getElementById("prec").onclick=function(){
    if(!last||!last.seal)return;
    var receipt={format:"aksi-receipt",product:"AKSI Local+Q",contact:"aksilove@internet.ru",query:last.q,answer:last.text,engine:last.engine,gate:last.gate&&{QCLI:last.gate.QCLI,entropy:last.gate.entropy},seal:last.seal};
    var blob=new Blob([JSON.stringify(receipt,null,2)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="aksi-local-q.json";a.click();
  };
})();
</script>
</body>
</html>
