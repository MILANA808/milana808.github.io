<style>
:root{--bg:#0a0a0b;--card:#121214;--line:rgba(255,255,255,.1);--t:#f4f4f5;--m:#a1a1aa;--a:#67e8f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif}
.wrap{max-width:800px;margin:0 auto;padding:16px 14px 48px}
h1{margin:0;font-size:1.25rem}.sub{color:var(--m);font-size:13px;margin:6px 0 10px}
button{border:0;border-radius:10px;padding:9px 12px;font-weight:600;cursor:pointer;background:#1c1c1f;color:var(--t);font:inherit;font-size:12px;margin:3px}
button.primary{background:linear-gradient(135deg,#67e8f9,#a78bfa);color:#0a0a0b}
button.dream{background:linear-gradient(135deg,#312e81,#7c3aed);color:#e9d5ff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
canvas{width:100%;background:#0a0a12;border-radius:12px;border:1px solid var(--line);display:block}
pre{white-space:pre-wrap;font:11px ui-monospace,monospace;color:var(--m);max-height:200px;overflow:auto;margin:8px 0 0;background:#0e0e10;padding:10px;border-radius:10px}

footer{margin-top:18px;font-size:12px;color:var(--m)}footer a{color:var(--a)}

<body>
<div class="wrap">
  <h1>АКСИ Phase-HRR · Geometric + Dreams</h1>
  <p class="sub">Аналогии + consolidation («сон») против cross-talk. CPU only. not AGI.</p>
  <div class="card">
    <button type="button" class="primary" id="btn-reason">Reason analogy</button>
    <button type="button" id="btn-noise">Inject noise</button>
    <button type="button" class="dream" id="btn-sleep">Запустить Сны (Sleep Cycle)</button>
    <button type="button" id="btn-health">Health</button>
  </div>
  <div class="card"><canvas id="cv" width="760" height="400"></canvas><div class="stat" id="stat">—</div></div>
  <div class="card"><pre id="out">Reason / Noise / Sleep…</pre></div>
  <footer><a href="/">Home</a> · <a href="/permit/">Permit</a> · aksilove@internet.ru</footer>
</div>
<script type="module">
const PI=Math.PI, TWO_PI=2*Math.PI;
function wrapPhase(x){ let a=x-TWO_PI*Math.floor((x+PI)/TWO_PI); if(a<=-PI)a+=TWO_PI; if(a>PI)a-=TWO_PI; return a; }
class HyperSpace {
  constructor(D=4096, seed=0xd1e){ this.D=D; this._state=seed>>>0; this.atoms=new Map(); }
  _rand(){ let x=this._state; x^=x<<13; x^=x>>>17; x^=x<<5; this._state=x>>>0; return this._state; }
  _rp(){ return (this._rand()/0x100000000)*TWO_PI-PI; }
  random(){ const v=new Float64Array(this.D); for(let i=0;i<this.D;i++)v[i]=this._rp(); return v; }
  atom(n){ const k=String(n); let v=this.atoms.get(k); if(!v){v=this.random();this.atoms.set(k,v);} return v; }
  bind(a,b){ const o=new Float64Array(this.D); for(let i=0;i<this.D;i++)o[i]=wrapPhase(a[i]+b[i]); return o; }
  unbind(a,b){ const o=new Float64Array(this.D); for(let i=0;i<this.D;i++)o[i]=wrapPhase(a[i]-b[i]); return o; }
  bundle(...vs){ if(!vs.length)return new Float64Array(this.D); if(vs.length===1)return Float64Array.from(vs[0]);
    const sc=new Float64Array(this.D), ss=new Float64Array(this.D);
    for(const v of vs) for(let i=0;i<this.D;i++){ sc[i]+=Math.cos(v[i]); ss[i]+=Math.sin(v[i]); }
    const o=new Float64Array(this.D); for(let i=0;i<this.D;i++)o[i]=Math.atan2(ss[i],sc[i]); return o; }
  cosine(a,b){ let s=0; for(let i=0;i<this.D;i++)s+=Math.cos(a[i]-b[i]); return s/this.D; }
  zeros(){ return new Float64Array(this.D); }
}
class MatrixMind {
  constructor(space){ this.space=space; this.factMemory=space.zeros(); this.context=space.zeros(); this.items=new Map(); this.facts=[]; this._factCount=0; }
  remember(label){ const k=String(label).toLowerCase(); let v=this.space.atom(k); if(this.items.has(k))v=this.space.bundle(this.items.get(k),v); this.items.set(k,v); return v; }
  train(){ const junk=this.space.bind(this.space.random(), this.space.random()); this.factMemory=this.space.bundle(this.factMemory,junk); this._factCount++; this.remember('noise_'+Math.random().toString(36).slice(2,8)); }
  trainEntity(entity, slots){
    const e=String(entity).toLowerCase(); const eA=this.space.atom(e); this.remember(e);
    const parts=[]; const slotRecs=[];
    for(const {role,value} of slots){ const v=String(value).toLowerCase(); this.remember(v);
      const slot=this.space.bind(this.space.atom('ROLE:'+role), this.space.atom(v));
      parts.push(this.space.bind(eA, slot)); slotRecs.push({role,value:v}); }
    this.factMemory=this.facts.length?this.space.bundle(this.factMemory,...parts):this.space.bundle(...parts);
    this._factCount+=parts.length; this.facts.push({entity:e, slots:slotRecs});
  }
  probeSlot(entity, role){ return this.space.unbind(this.space.unbind(this.factMemory, this.space.atom(String(entity).toLowerCase())), this.space.atom('ROLE:'+role)); }
}
class QuantumDreamEngine {
  measureCapitalHealth(mind){
    const tests=[['france','paris'],['japan','tokyo'],['germany','berlin'],['italy','rome']];
    const scores=tests.map(([entity,expect])=>({entity,expect,score:mind.space.cosine(mind.probeSlot(entity,'capital'), mind.space.atom(expect))}));
    return {scores, mean:scores.reduce((s,x)=>s+x.score,0)/scores.length};
  }
  injectNoise(mind, count=40){ for(let i=0;i<count;i++) mind.train(); return count; }
  consolidateMemory(mind){
    const before=this.measureCapitalHealth(mind); const parts=[];
    for(const fact of mind.facts){ const eA=mind.space.atom(fact.entity);
      for(const {role,value} of fact.slots){ const slot=mind.space.bind(mind.space.atom('ROLE:'+role), mind.space.atom(value)); parts.push(mind.space.bind(eA, slot)); } }
    if(parts.length){ mind.factMemory=mind.space.bundle(...parts); mind._factCount=parts.length; }
    for(const [label,vec] of [...mind.items.entries()]){ if(/^noise_/i.test(label)){ mind.items.delete(label); continue; }
      const pure=mind.space.atom(label); mind.items.set(label, mind.space.bundle(pure,pure,pure,vec)); }
    const after=this.measureCapitalHealth(mind);
    const nb=Math.max(0,1-before.mean), na=Math.max(0,1-after.mean);
    const noiseReducedPct=nb>1e-6?Math.max(0,Math.min(100,((nb-na)/nb)*100)):0;
    return {before, after, meanBefore:before.mean, meanAfter:after.mean, noiseReducedPct};
  }
  sleepCycle(mind){ return {consolidation:this.consolidateMemory(mind)}; }
}
const out=document.getElementById('out'), stat=document.getElementById('stat');
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
function log(s){ out.textContent+=s+'\n'; }
let world=null;
function boot(){
  const space=new HyperSpace(4096,0xd1e); const mind=new MatrixMind(space);
  for(const x of ['paris','berlin','tokyo','rome','moscow','france','germany','japan','italy','russia','aksi']) mind.remember(x);
  mind.trainEntity('france',[{role:'capital',value:'paris'}]);
  mind.trainEntity('germany',[{role:'capital',value:'berlin'}]);
  mind.trainEntity('japan',[{role:'capital',value:'tokyo'}]);
  mind.trainEntity('italy',[{role:'capital',value:'rome'}]);
  world={mind, dreams:new QuantumDreamEngine(), cand:['paris','berlin','tokyo','rome','moscow','france','germany','japan','italy','aksi']};
  return world;
}
function ensure(){ return world||boot(); }
let anim=null;
function dreamAnim(report, onDone){
  if(anim) cancelAnimationFrame(anim);
  const w=cv.width,h=cv.height;
  const targets=[{x:w*0.2,y:h*0.4,l:'france'},{x:w*0.35,y:h*0.25,l:'paris'},{x:w*0.55,y:h*0.35,l:'japan'},{x:w*0.7,y:h*0.5,l:'tokyo'}];
  const particles=Array.from({length:100},(_,i)=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,target:targets[i%targets.length]}));
  let t=0;
  const step=()=>{
    const cool=Math.min(1,t/1.2);
    ctx.fillStyle='rgba(10,10,18,0.28)'; ctx.fillRect(0,0,w,h);
    for(const p of particles){ p.vx+=(p.target.x-p.x)*0.012*cool; p.vy+=(p.target.y-p.y)*0.012*cool; p.vx*=0.93; p.vy*=0.93;
      p.x+=p.vx*(1.4-cool); p.y+=p.vy*(1.4-cool);
      ctx.beginPath(); ctx.arc(p.x,p.y,2+(1-cool)*3,0,TWO_PI);
      ctx.fillStyle=`hsla(${200+80*cool},90%,65%,${0.35+0.5*cool})`; ctx.fill(); }
    if(cool>0.65) for(const tg of targets){ ctx.fillStyle=`rgba(196,181,253,${(cool-0.65)*2.5})`; ctx.font='12px system-ui'; ctx.textAlign='center'; ctx.fillText(tg.l,tg.x,tg.y-12); ctx.beginPath(); ctx.arc(tg.x,tg.y,6,0,TWO_PI); ctx.fill(); }
    stat.textContent=cool<1?('Сон… '+(cool*100|0)+'%'):('Шум памяти уменьшен на '+report.noiseReducedPct.toFixed(1)+'% · mean '+report.meanBefore.toFixed(3)+' → '+report.meanAfter.toFixed(3));
    t+=0.016; if(t<1.35) anim=requestAnimationFrame(step); else if(onDone) onDone();
  }; step();
}
document.getElementById('btn-health').onclick=function(){ out.textContent=''; var w=ensure(); var h=w.dreams.measureCapitalHealth(w.mind);
  log('mean '+h.mean.toFixed(4)); h.scores.forEach(function(s){ log(s.entity+' → '+s.expect+' '+s.score.toFixed(4)); }); stat.textContent='health '+h.mean.toFixed(4); };
document.getElementById('btn-noise').onclick=function(){ out.textContent=''; var w=ensure(); var b=w.dreams.measureCapitalHealth(w.mind); w.dreams.injectNoise(w.mind,45); var a=w.dreams.measureCapitalHealth(w.mind);
  log('noise x45'); log('mean '+b.mean.toFixed(4)+' → '+a.mean.toFixed(4)); a.scores.forEach(function(s){ log(s.entity+' '+s.score.toFixed(4)); });
  stat.textContent='NOISY '+a.mean.toFixed(4);
  ctx.fillStyle='#0a0a12'; ctx.fillRect(0,0,cv.width,cv.height);
  for(var i=0;i<180;i++){ ctx.fillStyle='hsla('+Math.random()*360+',70%,60%,0.45)'; ctx.beginPath(); ctx.arc(Math.random()*cv.width,Math.random()*cv.height,Math.random()*4+1,0,TWO_PI); ctx.fill(); } };
document.getElementById('btn-sleep').onclick=function(){ out.textContent=''; var w=ensure(); var before=w.dreams.measureCapitalHealth(w.mind); log('Before '+before.mean.toFixed(4));
  var rep=w.dreams.sleepCycle(w.mind).consolidation;
  dreamAnim(rep, function(){ log('After '+rep.meanAfter.toFixed(4)); log('Noise reduced '+rep.noiseReducedPct.toFixed(1)+'%');
    rep.after.scores.forEach(function(s){ log(s.entity+' → '+s.expect+' '+s.score.toFixed(4)); });
    log(rep.meanAfter>0.25&&rep.meanAfter>rep.meanBefore?'PASS recovery':'check'); }); };
document.getElementById('btn-reason').onclick=function(){ out.textContent=''; var w=ensure();
  var probe=w.mind.probeSlot('japan','capital');
  var ranked=w.cand.map(function(l){ return {l:l,s:w.mind.space.cosine(probe,w.mind.space.atom(l))}; }).sort(function(a,b){ return b.s-a.s; });
  log('france:paris :: japan:? → '+ranked[0].l+' ('+ranked[0].s.toFixed(3)+')');
  log(ranked[0].l==='tokyo'?'PASS':'…'); stat.textContent='answer '+ranked[0].l; };
</script>
