<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>АКСИ Talk — полноценные ответы</title>
<meta name="description" content="Полноценный гибрид АКСИ: local + math + Wikipedia. Отвечает на вопросы в браузере."/>
<link rel="canonical" href="https://milana808.github.io/talk/"/>
<meta name="theme-color" content="#0b0b0d"/>
<style>
:root{--bg:#0b0b0d;--t:#f4f4f5;--m:#a1a1aa;--a:#34d399;--acc:#a78bfa;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
.top{padding:12px 14px 0;max-width:720px;width:100%;margin:0 auto}
h1{margin:0;font-size:1.15rem;font-weight:700}
.sub{color:var(--m);font-size:12px;margin:4px 0 8px;line-height:1.4}
.badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--m);margin:2px}
.badge.on{border-color:var(--a);color:var(--a)}
#chat{flex:1;overflow-y:auto;padding:8px 14px 12px;max-width:720px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
.msg{margin:8px 0;padding:10px 12px;border-radius:14px;max-width:92%;line-height:1.5;font-size:15px;white-space:pre-wrap;word-break:break-word}
.msg.user{background:#1e1b2e;margin-left:auto;border:1px solid rgba(167,139,250,.35)}
.msg.bot{background:#121a16;border:1px solid rgba(52,211,153,.3)}
.msg.sys{color:var(--m);font-size:12px;background:transparent;border:0;padding:4px 0;max-width:100%}
.msg.typing{color:var(--m);font-style:italic}
.composer{max-width:720px;width:100%;margin:0 auto;padding:8px 14px 16px;display:flex;gap:8px;border-top:1px solid var(--line);background:var(--bg);position:sticky;bottom:0}
.composer textarea{flex:1;min-height:48px;max-height:140px;resize:none;border-radius:14px;border:1px solid var(--line);background:#111;color:var(--t);padding:12px;font:inherit;font-size:15px}
button.go{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:linear-gradient(135deg,#a78bfa,#34d399);color:#0a0a0b;cursor:pointer;font-size:15px}
button.go:disabled{opacity:.4;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{border:0;background:#1c1c1f;color:var(--m);border-radius:999px;padding:7px 12px;font-size:12px;cursor:pointer}
footer{max-width:720px;margin:0 auto;padding:0 14px 14px;font-size:11px;color:var(--m)}footer a{color:var(--acc)}
.meta{font-size:11px;color:var(--m);margin-top:8px;line-height:1.4}
.meta a{color:var(--acc)}
</style>
</head>
<body>
<div class="top">
  <h1>АКСИ Talk</h1>
  <p class="sub">Полноценный контур ответа: знания АКСИ → счёт → поиск Wikipedia → текст ответа. Работает на телефоне без WebGPU.</p>
  <span class="badge on" id="net">online</span>
  <span class="badge">hybrid</span>
  <div class="chips">
    <button type="button" data-q="Привет! Кто ты?">Кто ты</button>
    <button type="button" data-q="Что такое чёрная дыра?">Чёрная дыра</button>
    <button type="button" data-q="Кто такой Ломоносов?">Ломоносов</button>
    <button type="button" data-q="Как устроен АКСИ Permit?">Permit</button>
    <button type="button" data-q="Сколько будет (25+5)*4?">Счёт</button>
    <button type="button" data-q="What is photosynthesis?">Photosynthesis</button>
  </div>
</div>
<div id="chat" role="log" aria-live="polite"></div>
<div class="composer">
  <textarea id="inp" placeholder="Задай любой вопрос…" rows="1" enterkeyhint="send"></textarea>
  <button type="button" class="go" id="go" aria-label="Отправить">→</button>
</div>
<footer>
  <a href="/">Home</a> · <a href="/permit/">Permit</a> · <a href="/math/">Math</a> · <a href="/llm/">WebLLM</a><br/>
  Факты: Wikipedia · контакт aksilove@internet.ru
</footer>
<script>
(function () {
  "use strict";

  var LOCAL = [
    { re: /привет|здравств|добрый\s+(день|вечер|утро)|hello|hi\b/i,
      a: "Привет! Я АКСИ — отвечаю в браузере: знаю свой проект, считаю простые примеры и по остальным темам собираю ответ из Wikipedia. Спрашивай что угодно." },
    { re: /кто ты|что ты такое|представься|о себе|who are you/i,
      a: "Я АКСИ (проект milana808.github.io).\n\n• Локально — про Permit, offline, сам проект\n• Счёт — простые выражения\n• Мир — краткий пересказ из Wikipedia + ссылка\n\nЭто не облачный GPT и не AGI. Принцип: technology serves human.\nКонтакт: aksilove@internet.ru" },
    { re: /permit|мандат|action permit|\bgate\b|allow\s*\/?\s*block/i,
      a: "АКСИ Action Permit — слой между «модель решила» и «система сделала».\n\n1) Мандат: какие tools и домены можно\n2) Intent: совпадает ли действие с целью\n3) Gate: ALLOW или BLOCK\n4) ECDSA receipt для audit\n\nЖивое демо: https://milana808.github.io/permit/" },
    { re: /offline|оффлайн|без сервер|приватност/i,
      a: "Offline-first: ядро АКСИ и Permit живут в браузере. Для фактов о мире нужен интернет (Wikipedia). Сообщения не обязаны уходить на сервер АКСИ." },
    { re: /что умеешь|помоги|help|команд/i,
      a: "Можешь спросить:\n• кто ты / Permit / offline\n• посчитать, например (2+3)*10\n• любой факт: «что такое …», «кто такой …»\n\nЯ найду страницу в Wikipedia и кратко перескажу." },
    { re: /спасибо|благодар/i, a: "Пожалуйста. Если нужно уточнение — напиши." },
    { re: /пока|до свид|увидимся|bye\b/i, a: "До связи. Удачи." }
  ];

  var cache = Object.create(null);

  function tryMath(q) {
    var raw = String(q);
    if (!/\d/.test(raw)) return null;
    var want = /(посчита|вычисл|сколько\s+будет|равняется)|^[\d\s\+\-\*\/\^\(\)\.]+$/i.test(raw);
    if (!want && !/[\+\-\*\/]\s*\d/.test(raw)) return null;
    try {
      var expr = raw.replace(/[^0-9\+\-\*\/\(\)\.\^\s]/g, " ").replace(/\^/g, "**").replace(/\s+/g, "");
      if (!expr || expr.length > 80) return null;
      if (!/^[0-9\+\-\*\/\(\)\.]+$/.test(expr.replace(/\*\*/g, ""))) return null;
      var v = Function('"use strict"; return (' + expr + ')')();
      if (typeof v === "number" && isFinite(v)) {
        return "Считаю:\n" + expr.replace(/\*\*/g, "^") + " = " + v;
      }
    } catch (e) {}
    return null;
  }

  function stripQuestion(q) {
    return String(q)
      .replace(/[«»"']/g, "")
      .replace(/^(пожалуйста|скажи|расскажи|объясни|подскажи)\s+/i, "")
      .replace(/^(что|кто|где|когда|какой|какая|какие|как|почему|зачем|сколько)\s+(такое|такой|такая|такие|это)?\s*/i, "")
      .replace(/^(what|who|where|when|why|how|tell me about|explain)\s+(is|are|was|were)?\s*/i, "")
      .replace(/[?!.]+$/g, "")
      .trim();
  }

  function queriesFor(q) {
    var base = stripQuestion(q) || q.trim();
    var list = [base];
    if (base !== q.trim()) list.push(q.trim().replace(/[?!.]+$/g, ""));
    // light variants
    if (/[а-яё]/i.test(base)) {
      list.push(base.replace(/ё/g, "е"));
    }
    return list.filter(function (x, i, a) { return x && a.indexOf(x) === i; }).slice(0, 4);
  }

  function wikiSearch(lang, term) {
    var url = "https://" + lang + ".wikipedia.org/w/api.php?action=opensearch&search=" +
      encodeURIComponent(term) + "&limit=5&namespace=0&format=json&origin=*";
    return fetch(url, { credentials: "omit" })
      .then(function (r) { return r.json(); })
      .then(function (data) { return (data && data[1]) || []; })
      .catch(function () { return []; });
  }

  function wikiSummary(lang, title) {
    var url = "https://" + lang + ".wikipedia.org/api/rest_v1/page/summary/" +
      encodeURIComponent(title.replace(/ /g, "_"));
    return fetch(url, { credentials: "omit" })
      .then(function (r) {
        if (!r.ok) throw new Error("summary " + r.status);
        return r.json();
      })
      .then(function (j) {
        if (j.type === "disambiguation") return null;
        var extract = (j.extract || "").trim();
        if (extract.length < 30) return null;
        return {
          title: j.title || title,
          extract: extract,
          url: (j.content_urls && j.content_urls.desktop && j.content_urls.desktop.page) ||
            ("https://" + lang + ".wikipedia.org/wiki/" + encodeURIComponent(title))
        };
      });
  }

  function clipExtract(extract) {
    var parts = extract.split(/(?<=[.!?…])\s+/);
    var body = parts.slice(0, 5).join(" ");
    if (body.length > 1100) body = body.slice(0, 1080).replace(/\s+\S*$/, "") + "…";
    return body;
  }

  async function research(question) {
    var key = question.toLowerCase().trim();
    if (cache[key]) return cache[key];

    var terms = queriesFor(question);
    var langs = /[а-яё]/i.test(question) ? ["ru", "en"] : ["en", "ru"];

    for (var li = 0; li < langs.length; li++) {
      var lang = langs[li];
      for (var ti = 0; ti < terms.length; ti++) {
        var titles = await wikiSearch(lang, terms[ti]);
        for (var i = 0; i < Math.min(titles.length, 4); i++) {
          try {
            var hit = await wikiSummary(lang, titles[i]);
            if (hit) {
              var out = { hit: hit, lang: lang, method: "wikipedia:" + lang };
              cache[key] = out;
              return out;
            }
          } catch (e) {}
        }
      }
    }
    return null;
  }

  function localMatch(q) {
    for (var i = 0; i < LOCAL.length; i++) {
      if (LOCAL[i].re.test(q)) return LOCAL[i].a;
    }
    return null;
  }

  function isSmallTalk(q) {
    return /привет|здравств|добрый|кто ты|что ты|permit|мандат|offline|оффлайн|спасибо|пока|hello|hi\b|bye|help|что умеешь|представь/i.test(q);
  }

  async function answer(q) {
    var math = tryMath(q);
    if (math) return { text: math, method: "math", link: null };

    var loc = localMatch(q);
    if (loc && isSmallTalk(q)) return { text: loc, method: "local", link: null };

    // network path
    if (!navigator.onLine) {
      if (loc) return { text: loc, method: "local-offline", link: null };
      return {
        text: "Сейчас нет сети, а этот вопрос требует Wikipedia. Локально могу: кто ты, Permit, offline, простой счёт.",
        method: "offline",
        link: null
      };
    }

    var res = await research(q);
    if (res && res.hit) {
      var body = clipExtract(res.hit.extract);
      var text = "Кратко:\n\n" + body + "\n\n— " + res.hit.title;
      if (loc && /акси|permit/i.test(q)) text = loc + "\n\n" + text;
      return { text: text, method: res.method, link: res.hit.url };
    }

    if (loc) return { text: loc, method: "local", link: null };

    return {
      text: "Не нашла устойчивую статью по «" + q + "».\n\nПопробуй короче: имя, термин или «что такое …». Для АКСИ: Permit, кто ты, offline.",
      method: "fallback",
      link: null
    };
  }

  // UI
  var chat = document.getElementById("chat");
  var inp = document.getElementById("inp");
  var go = document.getElementById("go");
  var net = document.getElementById("net");
  var busy = false;

  function setNet() {
    if (navigator.onLine) {
      net.textContent = "online";
      net.classList.add("on");
    } else {
      net.textContent = "offline";
      net.classList.remove("on");
    }
  }
  setNet();
  window.addEventListener("online", setNet);
  window.addEventListener("offline", setNet);

  function add(role, text) {
    var d = document.createElement("div");
    d.className = "msg " + role;
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  async function send(pre) {
    var q = (pre != null ? pre : inp.value).trim();
    if (!q || busy) return;
    inp.value = "";
    busy = true;
    go.disabled = true;
    add("user", q);
    var bot = add("bot", "Ищу ответ…");
    bot.classList.add("typing");
    var t0 = performance.now();
    try {
      var r = await answer(q);
      bot.classList.remove("typing");
      bot.textContent = r.text;
      var meta = document.createElement("div");
      meta.className = "meta";
      var ms = Math.round(performance.now() - t0);
      var html = r.method + " · " + ms + " ms";
      if (r.link) {
        html += ' · <a href="' + r.link.replace(/"/g, "") + '" target="_blank" rel="noopener noreferrer">источник</a>';
      }
      meta.innerHTML = html;
      bot.appendChild(meta);
    } catch (e) {
      bot.classList.remove("typing");
      bot.textContent = "Сбой: " + (e.message || e) + ". Проверь сеть и попробуй ещё раз.";
    }
    busy = false;
    go.disabled = false;
    try { inp.focus(); } catch (e) {}
  }

  go.addEventListener("click", function () { send(); });
  inp.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  document.querySelectorAll(".chips [data-q]").forEach(function (b) {
    b.addEventListener("click", function () {
      send(b.getAttribute("data-q"));
    });
  });

  add("sys", "Готово. Пиши вопрос — отвечу (local / math / Wikipedia).");
  try { inp.focus(); } catch (e) {}
})();
</script>
</body>
</html>
