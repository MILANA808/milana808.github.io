<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>АКСИ — ответы на любые вопросы</title>
<meta name="description" content="АКСИ: локальные знания + математика + Wikipedia research. Ответ почти на любой вопрос в браузере."/>
<link rel="canonical" href="https://milana808.github.io/talk/"/>
<meta name="theme-color" content="#0b0b0d"/>
<style>
:root{--bg:#0b0b0d;--t:#f4f4f5;--m:#a1a1aa;--a:#34d399;--acc:#a78bfa;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
.top{padding:12px 14px 0;max-width:720px;width:100%;margin:0 auto}
h1{margin:0;font-size:1.15rem}.sub{color:var(--m);font-size:12px;margin:4px 0 8px}
.badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--m);margin:2px}
.badge.on{border-color:var(--a);color:var(--a)}
#chat{flex:1;overflow-y:auto;padding:8px 14px;max-width:720px;width:100%;margin:0 auto}
.msg{margin:8px 0;padding:10px 12px;border-radius:14px;max-width:92%;line-height:1.5;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg.user{background:#1e1b2e;margin-left:auto;border:1px solid rgba(167,139,250,.35)}
.msg.bot{background:#121a16;border:1px solid rgba(52,211,153,.3)}
.msg.sys{color:var(--m);font-size:12px;background:transparent;border:0;padding:4px 0}
.composer{max-width:720px;width:100%;margin:0 auto;padding:8px 14px 16px;display:flex;gap:8px;border-top:1px solid var(--line)}
.composer textarea{flex:1;min-height:44px;max-height:120px;resize:none;border-radius:12px;border:1px solid var(--line);background:#111;color:var(--t);padding:10px 12px;font:inherit}
button.go{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:linear-gradient(135deg,#a78bfa,#34d399);color:#0a0a0b;cursor:pointer}
button.go:disabled{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips button{border:0;background:#1c1c1f;color:var(--m);border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer}
footer{max-width:720px;margin:0 auto;padding:0 14px 12px;font-size:11px;color:var(--m)}footer a{color:var(--acc)}
.meta{font-size:10px;color:var(--m);margin-top:6px}
.meta a{color:var(--acc)}
</style>
</head>
<body>
<div class="top">
  <h1>АКСИ · спроси что угодно</h1>
  <p class="sub">Локальные знания + счёт + поиск в Wikipedia → связный ответ. Без WebGPU. Нужен интернет только для фактов извне.</p>
  <span class="badge on">hybrid Q&A</span>
  <span class="badge">wiki research</span>
  <div class="chips">
    <button type="button" data-q="Привет! Кто ты?">Кто ты</button>
    <button type="button" data-q="Что такое чёрная дыра?">Чёрная дыра</button>
    <button type="button" data-q="Кто такой Ломоносов?">Ломоносов</button>
    <button type="button" data-q="Как устроен АКСИ Permit?">Permit</button>
    <button type="button" data-q="Сколько будет (15+7)*3?">Счёт</button>
  </div>
</div>
<div id="chat"></div>
<div class="composer">
  <textarea id="inp" placeholder="Любой вопрос…" rows="1"></textarea>
  <button type="button" class="go" id="go">→</button>
</div>
<footer>
  <a href="/">Home</a> · <a href="/permit/">Permit</a> · <a href="/llm/">WebLLM</a>
  · факты: Wikipedia · aksilove@internet.ru
</footer>
<script>
(function () {
  var LOCAL = [
    { re: /привет|здравств|hello|hi\b/i, a: "Привет! Я АКСИ — гибридный ответчик: знаю свой проект, считаю простые выражения и для остальных вопросов ищу смысл в Wikipedia, затем собираю ответ своими словами." },
    { re: /кто ты|что ты такое|о себе|who are you/i, a: "Я АКСИ (milana808.github.io). Не облачный GPT: работаю в браузере. Для фактов о мире подключаю Wikipedia, для агентов есть Permit (/permit/) — замок ALLOW/BLOCK на tool-call. Контакт: aksilove@internet.ru." },
    { re: /permit|мандат|action permit|gate|allow|block/i, a: "АКСИ Action Permit — слой между «модель решила» и «система сделала». Tool-call проверяется по мандату (tools, домены, лимиты) и цели пользователя → ALLOW или BLOCK + ECDSA-receipt. Демо: https://milana808.github.io/permit/" },
    { re: /offline|оффлайн|без сервер/i, a: "Offline-first: ядро и Permit могут работать без своего бэкенда. Ответы «про мир» подтягивают Wikipedia (нужен интернет). Принцип: technology serves human." },
    { re: /спасибо|благодар/i, a: "Пожалуйста. Спрашивай ещё — если темы нет в локальной памяти, пойду в Wikipedia." },
    { re: /пока|до свид|bye/i, a: "До связи. Удачи." }
  ];

  function tryMath(q) {
    if (!/[0-9]/.test(q)) return null;
    if (!/(посчита|вычисл|сколько будет|\d+[\s]*[\+\-\*\/\^\(\)]|[\+\-\*\/]=)/i.test(q) && !/^[\d\s\+\-\*\/\^\(\)\.]+$/.test(q.trim())) return null;
    try {
      var expr = q.replace(/[^0-9\+\-\*\/\(\)\.\^\s]/g, " ").replace(/\^/g, "**").replace(/\s+/g, "");
      if (!expr || !/[\d\)]$/.test(expr)) return null;
      var v = Function('"use strict"; return (' + expr + ')')();
      if (typeof v === "number" && isFinite(v)) return "Считаю: " + expr.replace(/\*\*/g, "^") + " = " + v;
    } catch (e) {}
    return null;
  }

  function cleanQuery(q) {
    return String(q)
      .replace(/^(что|кто|где|когда|как|почему|зачем|расскажи|объясни|такое|такой)\s+/ig, "")
      .replace(/[?!.]+$/g, "")
      .trim();
  }

  function wikiSearch(lang, query) {
    var url = "https://" + lang + ".wikipedia.org/w/api.php?action=opensearch&search=" +
      encodeURIComponent(query) + "&limit=5&namespace=0&format=json&origin=*";
    return fetch(url).then(function (r) { return r.json(); }).then(function (data) {
      var titles = (data && data[1]) || [];
      return titles;
    }).catch(function () { return []; });
  }

  function wikiSummary(lang, title) {
    var url = "https://" + lang + ".wikipedia.org/api/rest_v1/page/summary/" +
      encodeURIComponent(title.replace(/ /g, "_"));
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error("no summary");
      return r.json();
    }).then(function (j) {
      return {
        title: j.title || title,
        extract: j.extract || "",
        url: (j.content_urls && j.content_urls.desktop && j.content_urls.desktop.page) ||
          ("https://" + lang + ".wikipedia.org/wiki/" + encodeURIComponent(title))
      };
    });
  }

  function composeFromWiki(question, hit) {
    var extract = (hit.extract || "").trim();
    if (!extract) return null;
    // take ~2–4 sentences
    var parts = extract.split(/(?<=[.!?])\s+/);
    var body = parts.slice(0, 4).join(" ");
    if (body.length > 900) body = body.slice(0, 880) + "…";
    var lead = [
      "Кратко по источникам:",
      "Вот что удалось собрать:",
      "По открытым данным:"
    ][(Math.random() * 3) | 0];
    return lead + "\n\n" + body + "\n\nИсточник: " + hit.title;
  }

  async function research(question) {
    var q = cleanQuery(question) || question;
    // RU then EN
    var langs = /[а-яё]/i.test(q) ? ["ru", "en"] : ["en", "ru"];
    for (var li = 0; li < langs.length; li++) {
      var lang = langs[li];
      var titles = await wikiSearch(lang, q);
      if (!titles.length && q !== question) titles = await wikiSearch(lang, question);
      for (var ti = 0; ti < Math.min(titles.length, 3); ti++) {
        try {
          var sum = await wikiSummary(lang, titles[ti]);
          if (sum.extract && sum.extract.length > 40) {
            return { hit: sum, lang: lang, method: "wikipedia:" + lang };
          }
        } catch (e) {}
      }
    }
    return null;
  }

  function localReply(q) {
    for (var i = 0; i < LOCAL.length; i++) {
      if (LOCAL[i].re.test(q)) return LOCAL[i].a;
    }
    return null;
  }

  async function answer(q) {
    var math = tryMath(q);
    if (math) return { text: math, method: "math", link: null };

    var loc = localReply(q);
    // Pure greetings / about — no need wiki
    if (loc && /привет|здравств|кто ты|что ты|permit|offline|спасибо|пока|hello|hi\b|bye/i.test(q)) {
      return { text: loc, method: "local", link: null };
    }

    // Always try research for open questions
    var res = await research(q);
    if (res && res.hit) {
      var text = composeFromWiki(q, res.hit);
      if (loc && /акси|permit/i.test(q)) text = loc + "\n\n" + text;
      return { text: text, method: res.method, link: res.hit.url };
    }

    if (loc) return { text: loc, method: "local", link: null };

    return {
      text: "Не нашла устойчивого источника по запросу «" + q + "». Уточни формулировку (имя, термин) — попробую снова через Wikipedia. Для тем АКСИ: Permit, offline, кто ты.",
      method: "fallback",
      link: null
    };
  }

  var chat = document.getElementById("chat");
  var inp = document.getElementById("inp");
  var go = document.getElementById("go");
  var busy = false;

  function add(role, text, metaHtml) {
    var d = document.createElement("div");
    d.className = "msg " + role;
    d.textContent = text;
    if (metaHtml) {
      var m = document.createElement("div");
      m.className = "meta";
      m.innerHTML = metaHtml;
      d.appendChild(m);
    }
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  async function send(pre) {
    var q = (pre != null ? pre : inp.value).trim();
    if (!q || busy) return;
    inp.value = "";
    busy = true;
    go.disabled = true;
    add("user", q);
    var bot = add("bot", "Думаю…");
    var t0 = performance.now();
    try {
      var r = await answer(q);
      bot.textContent = r.text;
      var meta = r.method + " · " + (performance.now() - t0).toFixed(0) + " ms";
      if (r.link) meta += ' · <a href="' + r.link + '" target="_blank" rel="noopener">открыть источник</a>';
      var m = document.createElement("div");
      m.className = "meta";
      m.innerHTML = meta;
      bot.appendChild(m);
    } catch (e) {
      bot.textContent = "Сбой сети или поиска. Проверь интернет и спроси ещё раз. (" + (e.message || e) + ")";
    }
    busy = false;
    go.disabled = false;
    inp.focus();
  }

  go.onclick = function () { send(); };
  inp.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  document.querySelectorAll(".chips [data-q]").forEach(function (b) {
    b.onclick = function () { send(b.getAttribute("data-q")); };
  });

  add("sys", "Спроси что угодно. Локально / счёт / Wikipedia → ответ.");
  inp.focus();
})();
</script>
</body>
</html>
