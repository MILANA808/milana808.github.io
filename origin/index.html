<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORIGIN · АКСИ Agent</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../aksi-brain.js"></script>
<style>
body{background:radial-gradient(ellipse at 50% 0%,#1e1b4b 0%,#0a0014 50%,#000 100%);min-height:100vh}
.glass{background:rgba(15,23,42,.85);border:1px solid rgba(99,102,241,.35);backdrop-filter:blur(16px)}
#log::-webkit-scrollbar{width:5px}#log::-webkit-scrollbar-thumb{background:rgba(129,140,248,.4);border-radius:3px}
</style>
</head>
<body class="text-white p-4 max-w-3xl mx-auto">
  <div class="flex justify-between items-center mb-4 text-sm">
    <a href="../" class="text-indigo-300">← MATRIX</a>
    <span class="text-xs text-indigo-400/70" id="mode">…</span>
    <a href="../ORIGIN.md" class="text-indigo-400/80 text-xs">ORIGIN.md</a>
  </div>
  <h1 class="text-2xl font-bold text-indigo-200 mb-1">ORIGIN Agent</h1>
  <p class="text-xs text-indigo-400/70 mb-4">Живой эндпоинт источника правды · thought chain + 🔏</p>

  <div class="glass rounded-2xl flex flex-col" style="height:min(70vh,560px)">
    <div id="log" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm"></div>
    <div class="p-3 border-t border-indigo-500/20 flex gap-2">
      <input id="inp" class="flex-1 bg-zinc-900 border border-indigo-500/40 rounded-xl px-3 py-2 text-sm" placeholder="Спроси ORIGIN: где агент, globe, формулы…" autocomplete="off">
      <button type="button" id="go" class="px-4 py-2 bg-indigo-600 rounded-xl text-sm font-semibold">Спросить</button>
    </div>
  </div>

<script>
(function () {
  var API = localStorage.getItem("AKSI_API") || "http://localhost:8000";
  var log = document.getElementById("log");
  var backendOk = false;

  function add(html, me) {
    var d = document.createElement("div");
    d.className = me ? "text-right" : "";
    d.innerHTML = '<div class="inline-block max-w-[95%] text-left px-3 py-2 rounded-xl ' +
      (me ? "bg-indigo-700" : "bg-zinc-900/90 border border-indigo-500/30") + '">' + html + "</div>";
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  function esc(s) {
    return String(s).replace(/&/g, "\u0026amp;").replace(/</g, "\u0026lt;").replace(/>/g, "\u0026gt;");
  }

  fetch(API + "/origin").then(function (r) {
    backendOk = r.ok;
    document.getElementById("mode").textContent = backendOk ? "API ON · " + API : "offline · aksi-brain";
  }).catch(function () {
    document.getElementById("mode").textContent = "offline · aksi-brain";
  });

  add("<strong>ORIGIN</strong> на связи. Спроси про архитектуру, агента, Globe, формулы AKSI.", false);

  function ask() {
    var inp = document.getElementById("inp");
    var q = (inp.value || "").trim();
    if (!q) return;
    inp.value = "";
    add(esc(q), true);

    if (backendOk) {
      fetch(API + "/origin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: q }),
      })
        .then(function (r) {
          if (!r.ok) throw new Error("bad");
          return r.json();
        })
        .then(function (data) {
          var html = "";
          if (data.thoughts && data.thoughts.length) {
            html += '<div class="text-[10px] text-indigo-400 mb-1">Ход размышлений</div>';
            data.thoughts.forEach(function (t, i) {
              html += '<div class="text-xs mb-1">[' + (i + 1) + '] ' + esc(t.text || t) +
                (t.signature ? ' <span class="text-emerald-400">🔏 ' + esc(t.signature) + "</span>" : "") + "</div>";
            });
          }
          html += '<div class="mt-2 whitespace-pre-wrap text-sm">' + esc(data.answer || "") + "</div>";
          if (data.signature)
            html += '<div class="text-[10px] text-emerald-400 mt-2">🔏 ' + esc(data.signature) +
              " · R:" + (data.resonance || "?") + "%</div>";
          add(html, false);
        })
        .catch(function () {
          backendOk = false;
          offline(q);
        });
    } else offline(q);
  }

  function offline(q) {
    if (window.AKSIBrain && AKSIBrain.fullReply) {
      AKSIBrain.fullReply(q, 1).then(function (r) { add(r.html, false); });
    } else {
      add("ORIGIN offline. Запусти backend: <code>uvicorn main:app --port 8000</code>", false);
    }
  }

  document.getElementById("go").onclick = ask;
  document.getElementById("inp").onkeypress = function (e) {
    if (e.key === "Enter") ask();
  };
})();
</script>
</body>
</html>
