<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>АКСИ · Pulse</title>
<meta name="theme-color" content="#0a0618">
<style>
:root{--bg:#0a0618;--ink:#f0f0ff;--muted:#9ca3c7;--line:rgba(255,255,255,.12);--v:#a855f7;--c:#00f0ff;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(165deg,#0a0618,#160a28);color:var(--ink);min-height:100dvh;max-width:780px;margin:0 auto;padding:12px 12px 56px}
nav{display:flex;gap:5px;overflow-x:auto;margin-bottom:10px;padding-top:env(safe-area-inset-top)}
nav a{flex:0 0 auto;color:var(--muted);text-decoration:none;font-size:12px;font-weight:700;padding:8px 11px;border-radius:999px}
nav a.on{color:#fff;background:rgba(255,255,255,.06);border:1px solid var(--line)}
h1{font-size:1.4rem;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;line-height:1.4;margin-bottom:12px}
.glass{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;backdrop-filter:blur(10px)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
button{border:none;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--v),#6366f1);color:#fff;min-height:44px;font-size:13px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
button:disabled{opacity:.5;cursor:wait}
input{width:100%;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);margin-bottom:8px}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:480px){.stat{grid-template-columns:repeat(2,1fr)}}
.stat div{text-align:center;padding:12px 6px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line)}
.stat b{display:block;font-size:1.25rem}
.stat span{font-size:10px;color:var(--muted);letter-spacing:.04em}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;color:var(--muted)}
a.mod{color:var(--c);text-decoration:none;font-weight:600}
.mono{font-family:ui-monospace,monospace;font-size:11px;word-break:break-all;color:var(--muted);line-height:1.5}
#chart{width:100%;height:64px;display:block;margin-top:8px;background:rgba(0,0,0,.25);border-radius:10px}
.bar{height:4px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--v),var(--c));transition:width .3s}
.tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted);margin-left:4px}
</style>
</head>
<body>
<nav>
  <a href="/">Хаб</a>
  <a href="/contour/">Контур</a>
  <a class="on" href="/pulse/">Pulse</a>
  <a href="/proof/">Proof</a>
  <a href="/lab/">Lab</a>
  <a href="/wake/">Агент</a>
</nav>

<h1>Pulse v2</h1>
<p class="sub">Параллельный скан модулей · история · watch · подпись отчёта · опциональный backend.</p>

<div class="glass">
  <div class="row">
    <button type="button" id="scan">Сканировать</button>
    <button type="button" class="ghost" id="watch">Watch: OFF</button>
    <button type="button" class="ghost" id="dl">JSON</button>
    <button type="button" class="ghost" id="copy">Копировать</button>
  </div>
  <input id="api" placeholder="Backend URL (опционально) — проверит /health и /">
  <div class="bar"><i id="prog"></i></div>
  <div class="mono" id="status">готово</div>
  <div class="stat">
    <div><b class="ok" id="n-ok">—</b><span>OK</span></div>
    <div><b class="bad" id="n-bad">—</b><span>FAIL</span></div>
    <div><b id="n-score">—</b><span>SCORE</span></div>
    <div><b id="n-ms">—</b><span>Σ ms</span></div>
  </div>
  <canvas id="chart" width="720" height="64"></canvas>
  <table>
    <thead><tr><th>Модуль</th><th>HTTP</th><th>мс</th><th>Δ</th></tr></thead>
    <tbody id="tbody"><tr><td colspan="4" class="mono">скан…</td></tr></tbody>
  </table>
</div>

<div class="glass">
  <div class="mono" id="sig">—</div>
</div>

<script>
(function () {
  const SEED = "AKSI_DIMAX_v3_2026";
  const DID = "did:aksi:ed25519:sovereign-2026";
  const HIST = "AKSI_PULSE_V2";
  const FALLBACK = [
    ["/", "Hub"], ["/contour/", "Contour"], ["/pulse/", "Pulse"], ["/proof/", "Proof"],
    ["/lab/", "Lab"], ["/wake/", "Agent"], ["/aksi/", "Chat"], ["/matrix/", "WebLLM"],
    ["/aksii-matrix/", "MATRIX"], ["/quantum/", "Quantum"], ["/nav/", "Nav"],
    ["/globe/", "Globe"], ["/universe/", "Universe"], ["/app/", "App"],
    ["/precedent/", "Precedent"], ["/ecosystem.json", "ecosystem"],
  ];

  let modules = FALLBACK.map(([path, name]) => ({ path, name }));
  let lastReport = null;
  let prevMap = {};
  let watchTimer = null;

  async function sha256hex(str) {
    const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }

  async function loadEco() {
    try {
      const eco = await fetch("/ecosystem.json?v=" + Date.now(), { cache: "no-store" }).then((r) => r.json());
      if (eco.modules) {
        modules = Object.entries(eco.modules).map(([path, name]) => ({
          path: path === "/" ? "/" : path.endsWith("/") || path.endsWith(".json") ? path : path + "/",
          name: String(name).split("·")[0].trim() || path,
        }));
        // ensure critical
        const paths = new Set(modules.map((m) => m.path));
        FALLBACK.forEach(([p, n]) => { if (!paths.has(p)) modules.push({ path: p, name: n }); });
      }
    } catch {}
  }

  async function probe(path) {
    const url = path.startsWith("http") ? path : location.origin + path;
    const t0 = performance.now();
    try {
      const r = await fetch(url, { method: "GET", cache: "no-store" });
      return { path, ok: r.ok, status: r.status, ms: Math.round(performance.now() - t0) };
    } catch (e) {
      return { path, ok: false, status: 0, ms: Math.round(performance.now() - t0), error: String(e.message || e) };
    }
  }

  function loadHist() {
    try { return JSON.parse(localStorage.getItem(HIST) || "[]"); } catch { return []; }
  }
  function saveHist(entry) {
    const h = loadHist();
    h.push(entry);
    localStorage.setItem(HIST, JSON.stringify(h.slice(-40)));
  }

  function drawChart() {
    const h = loadHist();
    const c = document.getElementById("chart");
    const ctx = c.getContext("2d");
    const W = c.width, H = c.height;
    ctx.clearRect(0, 0, W, H);
    if (h.length < 2) {
      ctx.fillStyle = "#9ca3c7";
      ctx.font = "12px sans-serif";
      ctx.fillText("История score появится после 2+ сканов", 12, H / 2);
      return;
    }
    const slice = h.slice(-24);
    ctx.strokeStyle = "rgba(0,240,255,0.7)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    slice.forEach((p, i) => {
      const x = (i / (slice.length - 1)) * (W - 16) + 8;
      const y = H - 8 - (p.score / 100) * (H - 16);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    const last = slice[slice.length - 1];
    ctx.fillStyle = last.score >= 90 ? "#4ade80" : last.score >= 60 ? "#fbbf24" : "#f87171";
    const lx = W - 8, ly = H - 8 - (last.score / 100) * (H - 16);
    ctx.beginPath(); ctx.arc(lx, ly, 4, 0, 6.28); ctx.fill();
  }

  async function scan() {
    const btn = document.getElementById("scan");
    btn.disabled = true;
    document.getElementById("status").textContent = "сканирование…";
    document.getElementById("prog").style.width = "10%";

    await loadEco();
    const targets = modules.map((m) => ({ ...m }));
    const api = document.getElementById("api").value.trim().replace(/\/$/, "");
    if (api) {
      targets.push({ path: api + "/health", name: "backend/health" });
      targets.push({ path: api + "/", name: "backend/" });
    }

    document.getElementById("prog").style.width = "30%";
    const results = await Promise.all(targets.map((m) => probe(m.path).then((r) => ({ ...r, name: m.name }))));
    document.getElementById("prog").style.width = "90%";

    const ok = results.filter((r) => r.ok).length;
    const bad = results.length - ok;
    const score = Math.round((ok / results.length) * 100);
    const sumMs = results.reduce((s, r) => s + r.ms, 0);

    document.getElementById("n-ok").textContent = ok;
    document.getElementById("n-bad").textContent = bad;
    document.getElementById("n-score").textContent = score;
    document.getElementById("n-score").className = score >= 90 ? "ok" : score >= 60 ? "warn" : "bad";
    document.getElementById("n-ms").textContent = sumMs;

    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";
    results
      .slice()
      .sort((a, b) => Number(b.ok) - Number(a.ok) || a.ms - b.ms)
      .forEach((r) => {
        const prev = prevMap[r.path];
        let delta = "—";
        if (prev != null) {
          const d = r.ms - prev;
          delta = (d > 0 ? "+" : "") + d;
        }
        const href = r.path.startsWith("http") ? r.path : r.path;
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td><a class=mod href=\"" + href + "\">" + (r.name || r.path) + "</a>" +
          (r.path.includes("backend") ? "<span class=tag>ext</span>" : "") +
          "</td>" +
          "<td class=\"" + (r.ok ? "ok" : "bad") + "\">" + (r.ok ? "OK " : "FAIL ") + r.status + "</td>" +
          "<td>" + r.ms + "</td>" +
          "<td>" + delta + "</td>";
        tbody.appendChild(tr);
      });

    prevMap = {};
    results.forEach((r) => { prevMap[r.path] = r.ms; });

    const report = {
      type: "aksi.pulse.v2",
      did: DID,
      surface: location.origin,
      time: new Date().toISOString(),
      score,
      ok,
      bad,
      sumMs,
      results: results.map((r) => ({
        path: r.path,
        name: r.name,
        ok: r.ok,
        status: r.status,
        ms: r.ms,
      })),
    };
    report.signature = await sha256hex(SEED + "|" + JSON.stringify(report.results) + "|" + report.time);
    lastReport = report;
    saveHist({ time: report.time, score, sig: report.signature, ok, bad });
    drawChart();

    document.getElementById("sig").textContent =
      "score " + score + " · " + report.time + "\nsig " + report.signature + "\ndid " + DID;
    document.getElementById("status").textContent =
      bad === 0 ? "все модули отвечают" : "проблем: " + bad;
    document.getElementById("prog").style.width = "100%";
    btn.disabled = false;
    setTimeout(() => { document.getElementById("prog").style.width = "0%"; }, 600);
  }

  document.getElementById("scan").onclick = scan;
  document.getElementById("watch").onclick = function () {
    if (watchTimer) {
      clearInterval(watchTimer);
      watchTimer = null;
      this.textContent = "Watch: OFF";
      return;
    }
    this.textContent = "Watch: ON";
    scan();
    watchTimer = setInterval(scan, 30000);
  };
  document.getElementById("dl").onclick = () => {
    if (!lastReport) return alert("Сначала скан");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(lastReport, null, 2)], { type: "application/json" }));
    a.download = "aksi-pulse-v2.json";
    a.click();
  };
  document.getElementById("copy").onclick = async () => {
    if (!lastReport) return alert("Сначала скан");
    await navigator.clipboard.writeText(JSON.stringify(lastReport, null, 2));
    alert("Скопировано");
  };

  const savedApi = localStorage.getItem("AKSI_API_URL") || "";
  if (savedApi) document.getElementById("api").value = savedApi;
  document.getElementById("api").addEventListener("change", (e) => {
    localStorage.setItem("AKSI_API_URL", e.target.value.trim());
  });

  drawChart();
  scan();
})();
</script>
</body>
</html>
