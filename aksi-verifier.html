<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AKSI Verifier</title><style>body{margin:0;background:#0b0d12;color:#eef1f7;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:48px 20px}.card{background:#131720;border:1px solid #2a3140;border-radius:22px;padding:24px;margin:18px 0}h1{font-size:42px;margin:0 0 8px}textarea{width:100%;min-height:220px;background:#0a0d12;color:#fff;border:1px solid #303849;border-radius:14px;padding:14px;box-sizing:border-box}button{background:#fff;color:#0b0d12;border:0;border-radius:12px;padding:12px 18px;font-weight:700;margin-top:12px}.ok{color:#7ee787}.warn{color:#f2cc60}.bad{color:#ff7b72}code{word-break:break-all}</style></head><body><main><div class="card"><small>AKSI / PUBLIC VERIFIER</small><h1>Проверь AI-решение.</h1><p>Вставь AKSI Decision Passport. Проверка выполняется в браузере. Ничего не отправляется на сервер.</p><textarea id="in" placeholder="Вставь JSON паспорта сюда…"></textarea><button id="go">Проверить</button></div><div id="out" class="card" hidden></div></main><script>const $=x=>document.querySelector(x);async function hash(x){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}function canonical(p){const q={...p};delete q.sha256;return JSON.stringify(q)}$('#go').onclick=async()=>{let p;try{p=JSON.parse($('#in').value)}catch{show('bad','Неверный JSON','Файл не удалось разобрать.');return}if(!p||p.protocol!=='AKSI Decision Passport v1'||!p.sha256){show('bad','Неизвестный формат','Это не распознаваемый AKSI Passport.');return}const actual=await hash(canonical(p)),ok=actual===p.sha256;show(ok?'ok':'bad',ok?'✓ ПАСПОРТ ЦЕЛОСТНЫЙ':'✕ ПАСПОРТ ИЗМЕНЁН',`<p>Ожидаемый SHA-256:</p><code>${p.sha256}</code><p>Вычисленный SHA-256:</p><code>${actual}</code><p class="warn">Важно: хэш подтверждает целостность сохранённого содержимого, но не доказывает истинность утверждения.</p>`)};function show(c,t,b){const o=$('#out');o.hidden=false;o.className='card '+c;o.innerHTML='<h2>'+t+'</h2>'+b}</script></body></html>
