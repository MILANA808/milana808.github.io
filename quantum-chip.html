<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>АКСИ Q-Chip</title>
<meta name="description" content="Улучшенный state-vector симулятор. Не физический QPU.">
<meta name="theme-color" content="#07070b">
<link rel="canonical" href="https://milana808.github.io/quantum-chip.html">
<style>
:root{--bg:#07070b;--panel:#0e0e14;--card:#14141c;--ink:#f4f3ee;--muted:#8b8796;--line:#252532;--acc:#a78bfa;--acc2:#7c3aed;--ok:#34d399;--warn:#fbbf24;--cyan:#22d3ee;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.45 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 56px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{font-weight:800;letter-spacing:.04em;font-size:13px;color:var(--muted)}
.brand b{color:var(--acc)}
.top a{color:var(--muted);font-size:12px;text-decoration:none;margin-left:10px}
.hero h1{font-size:clamp(1.4rem,4vw,1.85rem);letter-spacing:-.03em;margin-bottom:6px}
.hero p{color:var(--muted);font-size:14px;max-width:52ch}
.badge{display:inline-block;margin-top:8px;font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid #3d3520;color:var(--warn);background:#16140c}
.layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:14px;margin-top:14px}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);margin-bottom:10px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.m{background:var(--panel);border-radius:12px;padding:10px 8px;text-align:center;border:1px solid var(--line)}
.m b{display:block;font-size:15px;color:var(--ok)}
.m span{font-size:10px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
label{font-size:12px;color:var(--muted)}
select,input[type=number]{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 11px;font:inherit}
button{font:inherit;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 12px;cursor:pointer}
button.p{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#0b0b10;font-weight:700}
button.g{min-width:44px;font-family:ui-monospace,monospace;font-size:13px}
button:disabled{opacity:.35}
.seg{display:flex;background:var(--panel);border-radius:12px;padding:3px;border:1px solid var(--line);margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink)}
.panel{display:none}.panel.on{display:block}
.wires{background:var(--panel);border-radius:12px;padding:12px;border:1px solid var(--line);overflow-x:auto;min-height:72px;margin-bottom:10px}
.wire{display:flex;align-items:center;margin:8px 0;min-height:28px}
.wire .q{width:28px;font-size:11px;color:var(--cyan);font-family:ui-monospace,monospace}
.wire .line{flex:1;height:2px;background:linear-gradient(90deg,#2a2a3a,#4c1d95);position:relative;border-radius:1px}
.wire .gate{position:absolute;top:50%;transform:translate(-50%,-50%);background:#1e1b2e;border:1px solid var(--acc);color:var(--acc);font-size:10px;font-family:ui-monospace,monospace;padding:2px 6px;border-radius:6px}
.bloch-box{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
canvas#bloch{width:200px;height:200px;background:var(--panel);border-radius:14px;border:1px solid var(--line)}
.hist{flex:1;min-width:180px}
.bar-row{display:flex;align-items:center;gap:8px;margin:4px 0}
.bar-row .lab{width:52px;font-size:11px;font-family:ui-monospace,monospace;color:var(--muted)}
.bar-row .track{flex:1;height:10px;background:#1a1a24;border-radius:6px;overflow:hidden}
.bar-row .fill{height:100%;background:linear-gradient(90deg,#7c3aed,#c4b5fd);border-radius:6px;transition:width .25s ease}
.bar-row .pct{width:48px;text-align:right;font-size:11px;color:var(--muted)}
pre{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:11px;color:var(--muted);overflow:auto;max-height:160px;white-space:pre-wrap}
.log{font-size:12px;color:var(--muted);max-height:88px;overflow:auto;margin-top:8px}
.examples{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ex{text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.ex strong{display:block;color:var(--ink);font-size:13px}
.ex span{font-size:11px;color:var(--muted)}
footer{margin-top:18px;font-size:12px;color:var(--muted)}
footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand">АКСИ · <b>Q-CHIP</b></div>
<nav><a href="/local-ai.html">Local AI</a><a href="/">След</a></nav></div>
<div class="hero">
<h1>Квантовый симулятор</h1>
<p>Собирайте схемы, смотрите вероятности и сферу Блоха. В браузере, без сервера.</p>
<div class="badge">State-vector · не физический QPU · до 10 кубитов</div>
</div>
<div class="layout">
<div>
<div class="card">
<h2>Регистр</h2>
<div class="metrics">
<div class="m"><b id="sN">2</b><span>qubits</span></div>
<div class="m"><b id="sD">4</b><span>dim</span></div>
<div class="m"><b id="sE">—</b><span>entropy</span></div>
<div class="m"><b id="sP">—</b><span>purity</span></div>
</div>
<div class="row">
<label>n</label>
<select id="nq"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>8</option><option>10</option></select>
<button type="button" class="p" id="reset">Сброс |0⟩</button>
<button type="button" id="undo" disabled>↩ Undo</button>
<button type="button" id="export">JSON</button>
</div>
<div class="row">
<label>target</label><input type="number" id="t" value="0" min="0" max="9" style="width:56px">
<label>ctrl</label><input type="number" id="c" value="0" min="0" max="9" style="width:56px">
<label>ctrl2</label><input type="number" id="c2" value="1" min="0" max="9" style="width:56px">
<label>θ°</label><input type="number" id="th" value="90" step="15" style="width:64px">
</div>
</div>
<div class="card">
<div class="seg">
<button type="button" class="on" data-tab="gates">Гейты</button>
<button type="button" data-tab="ex">Примеры</button>
<button type="button" data-tab="run">Измерить</button>
</div>
<div class="panel on" id="tab-gates">
<div class="row">
<button type="button" class="g" data-g="h">H</button>
<button type="button" class="g" data-g="x">X</button>
<button type="button" class="g" data-g="y">Y</button>
<button type="button" class="g" data-g="z">Z</button>
<button type="button" class="g" data-g="s">S</button>
<button type="button" class="g" data-g="t">T</button>
<button type="button" class="g" data-g="rx">Rx</button>
<button type="button" class="g" data-g="ry">Ry</button>
<button type="button" class="g" data-g="rz">Rz</button>
</div>
<div class="row">
<button type="button" class="g" data-g="cnot">CNOT</button>
<button type="button" class="g" data-g="cz">CZ</button>
<button type="button" class="g" data-g="swap">SWAP</button>
<button type="button" class="g" data-g="ccx">Toffoli</button>
</div>
</div>
<div class="panel" id="tab-ex">
<div class="examples">
<button type="button" class="ex" data-p="bell"><strong>Bell Φ+</strong><span>Запутанная пара</span></button>
<button type="button" class="ex" data-p="ghz"><strong>GHZ</strong><span>Многокубитная запутанность</span></button>
<button type="button" class="ex" data-p="super"><strong>Суперпозиция</strong><span>H на q0</span></button>
<button type="button" class="ex" data-p="qft"><strong>QFT</strong><span>Квантовое преобразование</span></button>
<button type="button" class="ex" data-p="grover"><strong>Grover</strong><span>Поиск n=2</span></button>
<button type="button" class="ex" data-p="chsh"><strong>CHSH</strong><span>Тест Белла</span></button>
</div>
</div>
<div class="panel" id="tab-run">
<div class="row">
<button type="button" class="p" id="measure">1 измерение</button>
<button type="button" id="sample">512 shots</button>
<button type="button" id="copy">Копировать probs</button>
</div>
</div>
<h2 style="margin-top:14px">Схема</h2>
<div class="wires" id="wires"></div>
<pre id="circ">—</pre>
<div class="log" id="log"></div>
</div>
</div>
<div>
<div class="card">
<h2>Состояние</h2>
<div class="row"><label>Bloch qubit</label><select id="bq"><option>0</option><option>1</option></select></div>
<div class="bloch-box">
<canvas id="bloch" width="200" height="200"></canvas>
<div class="hist" id="hist"></div>
</div>
<h2 style="margin-top:12px">Вероятности</h2>
<pre id="probs">—</pre>
</div>
</div>
</div>
<footer>aksilove@internet.ru · <a href="/local-ai.html">Local AI</a></footer>
</div>
<script src="/aksi-quantum.js?v=2"></script>
<script>
(function(){
  var Q=window.AKSI_QUANTUM;
  if(!Q||!Q.create){document.getElementById("circ").textContent="Модуль не загрузился";return;}
  var chip=null,ops=[],stack=[];
  function nQ(){return +document.getElementById("nq").value||2;}
  function clamp(a,b,x){return Math.max(a,Math.min(b,x));}
  function tgt(){return clamp(0,nQ()-1,+document.getElementById("t").value||0);}
  function ctrl(){return clamp(0,nQ()-1,+document.getElementById("c").value||0);}
  function ctrl2(){return clamp(0,nQ()-1,+document.getElementById("c2").value||1);}
  function theta(){return ((+document.getElementById("th").value||0)*Math.PI)/180;}
  function log(m){var el=document.getElementById("log");el.textContent=m+"\n"+el.textContent;}
  function fillBq(){var sel=document.getElementById("bq"),n=nQ(),v=sel.value;sel.innerHTML="";for(var i=0;i<n;i++){var o=document.createElement("option");o.value=i;o.textContent="q"+i;sel.appendChild(o);}if(+v<n)sel.value=v;}
  function applyOp(op){
    var t=op.t,c=op.c,c2=op.c2,th=op.th,name=op.name;
    if(name==="h")chip.h(t);else if(name==="x")chip.x(t);else if(name==="y")chip.y(t);else if(name==="z")chip.z(t);
    else if(name==="s")chip.s(t);else if(name==="t")chip.t(t);
    else if(name==="rx")chip.rx(t,th);else if(name==="ry")chip.ry(t,th);else if(name==="rz")chip.rz(t,th);
    else if(name==="cnot")chip.cnot(c,t);else if(name==="cz")chip.cz(c,t);else if(name==="swap")chip.swap(c,t);
    else if(name==="ccx")chip.ccx(c,c2,t);
  }
  function rebuild(){chip=Q.create(nQ());for(var i=0;i<ops.length;i++){if(String(ops[i].name).indexOf("preset:")===0)continue;applyOp(ops[i]);}refresh();}
  function snap(){stack.push(JSON.stringify(ops));if(stack.length>50)stack.shift();document.getElementById("undo").disabled=!stack.length;}
  function drawWires(){
    var box=document.getElementById("wires");box.innerHTML="";
    var n=nQ(),steps=ops.filter(function(o){return String(o.name).indexOf("preset:")!==0;});
    if(!steps.length){box.innerHTML="<div style=\"color:var(--muted);font-size:12px;padding:8px\">Нажмите гейт или пример</div>";return;}
    for(var q=0;q<n;q++){
      var row=document.createElement("div");row.className="wire";
      var lab=document.createElement("div");lab.className="q";lab.textContent="q"+q;row.appendChild(lab);
      var line=document.createElement("div");line.className="line";
      steps.forEach(function(op,idx){
        var on=false,label=op.name.toUpperCase();
        if(["h","x","y","z","s","t","rx","ry","rz"].indexOf(op.name)>=0&&op.t===q)on=true;
        if((op.name==="cnot"||op.name==="cz"||op.name==="swap")&&(op.t===q||op.c===q)){on=true;if(op.name==="cnot"&&op.c===q)label="•";if(op.name==="cnot"&&op.t===q)label="⊕";}
        if(op.name==="ccx"&&(op.t===q||op.c===q||op.c2===q)){on=true;label=op.t===q?"⊞":"•";}
        if(!on)return;
        var g=document.createElement("div");g.className="gate";g.textContent=label;g.style.left=((idx+1)/(steps.length+1)*100)+"%";line.appendChild(g);
      });
      row.appendChild(line);box.appendChild(row);
    }
  }
  function drawBloch(b){
    var canvas=document.getElementById("bloch");
    if(Q.drawBloch&&b){try{Q.drawBloch(canvas,b);return;}catch(e){}}
    var ctx=canvas.getContext("2d");if(!ctx)return;
    var dpr=window.devicePixelRatio||1,size=200;
    canvas.width=size*dpr;canvas.height=size*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    var cx=size/2,cy=size/2,R=size*0.38;
    ctx.clearRect(0,0,size,size);
    var grd=ctx.createRadialGradient(cx-R*0.3,cy-R*0.3,R*0.1,cx,cy,R);
    grd.addColorStop(0,"rgba(167,139,250,.12)");grd.addColorStop(1,"rgba(15,15,25,.9)");
    ctx.fillStyle=grd;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="rgba(167,139,250,.4)";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.ellipse(cx,cy,R,R*0.32,0,0,Math.PI*2);ctx.stroke();
    if(!b)return;
    var px=cx+(b.x||0)*R,py=cy-(b.z||0)*R;
    ctx.strokeStyle="#c4b5fd";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(px,py);ctx.stroke();
    ctx.fillStyle="#a78bfa";ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.fill();
  }
  function refresh(){
    if(!chip)return;
    var p=chip.probs(),ent=chip.entropy?chip.entropy():0,pur=chip.purity?chip.purity():0,i;
    document.getElementById("sN").textContent=chip.n;
    document.getElementById("sD").textContent=p.length;
    document.getElementById("sE").textContent=Number(ent).toFixed(3);
    document.getElementById("sP").textContent=Number(pur).toFixed(3);
    document.getElementById("circ").textContent=chip.circuitString?chip.circuitString():ops.map(function(o){return o.name;}).join(" → ");
    var hist=document.getElementById("hist");hist.innerHTML="";
    var max=0;for(i=0;i<p.length;i++)if(p[i]>max)max=p[i];
    var show=p.length<=8?p.map(function(_,i){return i;}):p.map(function(v,i){return v>0.001?i:-1;}).filter(function(i){return i>=0;}).slice(0,8);
    if(!show.length)show=[0];
    show.forEach(function(i){
      var row=document.createElement("div");row.className="bar-row";
      var lab=document.createElement("div");lab.className="lab";lab.textContent="|"+i.toString(2).padStart(chip.n,"0")+"⟩";
      var track=document.createElement("div");track.className="track";
      var fill=document.createElement("div");fill.className="fill";fill.style.width=(max>0?(p[i]/max)*100:0)+"%";track.appendChild(fill);
      var pct=document.createElement("div");pct.className="pct";pct.textContent=(p[i]*100).toFixed(1)+"%";
      row.appendChild(lab);row.appendChild(track);row.appendChild(pct);hist.appendChild(row);
    });
    var lines=[];for(i=0;i<p.length;i++)if(p[i]>1e-4)lines.push("|"+i.toString(2).padStart(chip.n,"0")+"⟩  "+(p[i]*100).toFixed(2)+"%");
    document.getElementById("probs").textContent=lines.join("\n")||"—";
    try{drawBloch(chip.bloch?chip.bloch(+document.getElementById("bq").value||0):null);}catch(e){}
    drawWires();
  }
  function pushGate(name){
    snap();
    if(name==="ccx"&&nQ()<3){log("Toffoli: n≥3");return;}
    ops.push({name:name,t:tgt(),c:ctrl(),c2:ctrl2(),th:theta()});
    try{rebuild();log(name.toUpperCase());}catch(e){ops.pop();rebuild();log("ошибка: "+(e.message||e));}
  }
  function preset(name){
    snap();
    try{
      if(name==="bell"){document.getElementById("nq").value="2";fillBq();chip=Q.bell("phi+");ops=[{name:"preset:bell"}];refresh();log("Bell Φ+");return;}
      if(name==="super"){document.getElementById("nq").value="1";ops=[{name:"h",t:0}];fillBq();rebuild();log("H|0⟩");return;}
      if(name==="ghz"){var n=Math.max(3,nQ());document.getElementById("nq").value=String(n);ops=[{name:"h",t:0}];for(var i=1;i<n;i++)ops.push({name:"cnot",c:0,t:i});fillBq();rebuild();log("GHZ-"+n);return;}
      if(name==="qft"){fillBq();chip=Q.create(nQ());chip.x(0);if(chip.qft)chip.qft();ops=[{name:"preset:qft"}];refresh();log("QFT");return;}
      if(name==="grover"){document.getElementById("nq").value="2";fillBq();chip=Q.grover?Q.grover(2,1):Q.create(2);ops=[{name:"preset:grover"}];refresh();log("Grover");return;}
      if(name==="chsh"){var r=Q.chsh(1024);document.getElementById("probs").textContent=JSON.stringify(r,null,2);log("CHSH S≈"+Number(r.S!=null?r.S:r.s).toFixed(3));return;}
      fillBq();rebuild();
    }catch(e){log("preset: "+(e.message||e));}
  }
  document.querySelectorAll(".seg button").forEach(function(btn){
    btn.onclick=function(){
      document.querySelectorAll(".seg button").forEach(function(b){b.classList.remove("on");});
      document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("on");});
      btn.classList.add("on");document.getElementById("tab-"+btn.getAttribute("data-tab")).classList.add("on");
    };
  });
  document.getElementById("reset").onclick=function(){snap();ops=[];fillBq();rebuild();log("сброс");};
  document.getElementById("nq").onchange=function(){ops=[];fillBq();rebuild();};
  document.getElementById("bq").onchange=refresh;
  document.getElementById("undo").onclick=function(){if(!stack.length)return;ops=JSON.parse(stack.pop());document.getElementById("undo").disabled=!stack.length;fillBq();rebuild();log("undo");};
  document.querySelectorAll("[data-g]").forEach(function(b){b.onclick=function(){pushGate(b.getAttribute("data-g"));};});
  document.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){preset(b.getAttribute("data-p"));};});
  document.getElementById("measure").onclick=function(){if(!chip)rebuild();log("измерение "+JSON.stringify(chip.measure?chip.measure():null));refresh();};
  document.getElementById("sample").onclick=function(){if(!chip)rebuild();if(!chip.sample){log("нет sample");return;}document.getElementById("probs").textContent=JSON.stringify(chip.sample(512),null,2);log("512 shots");};
  document.getElementById("copy").onclick=function(){var t=document.getElementById("probs").textContent;if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){log("скопировано");});};
  document.getElementById("export").onclick=function(){
    var data={format:"aksi-qchip",version:"2",note:"Classical sim, not QPU",n:nQ(),ops:ops,probs:chip?chip.probs():[],contact:"aksilove@internet.ru",at:new Date().toISOString()};
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="aksi-qchip.json";a.click();
  };
  fillBq();rebuild();log("Готово · max "+(Q.MAX_QUBITS||10));
})();
</script>
</body>
</html>
