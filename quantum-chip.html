<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>АКСИ Q-Chip — полный симулятор</title>
<meta name="description" content="State-vector симулятор 1–10 кубитов. Не физический QPU.">
<meta name="theme-color" content="#0b0b0f">
<link rel="canonical" href="https://milana808.github.io/quantum-chip.html">
<style>
:root{--bg:#09090e;--card:#12121a;--ink:#f2f1eb;--muted:#9a97a3;--line:#2a2a36;--acc:#a78bfa;--ok:#3ecf8e;--warn:#e6b84d}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink);max-width:960px;margin:0 auto;padding:12px 14px 48px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.logo{font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.logo span{color:var(--acc)}
header a{color:var(--muted);font-size:12px;text-decoration:none;margin-left:8px}
h1{font-size:1.4rem;margin:4px 0 8px}
.warn{background:#1a1810;border:1px solid #3d3520;color:var(--warn);padding:10px 12px;border-radius:12px;font-size:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h2{font-size:11px;color:var(--acc);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
label{font-size:12px;color:var(--muted)}
select,input[type=number]{background:#101018;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit}
button{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#1a1a24;color:var(--ink);cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#0b0b0f;font-weight:700}
button.g{min-width:40px;font-family:ui-monospace,monospace;font-size:12px}
button:disabled{opacity:.35}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat div{background:#0e0e14;border-radius:8px;padding:8px;text-align:center}
.stat b{display:block;color:var(--ok);font-size:13px}
.stat span{font-size:9px;color:var(--muted)}
canvas{display:block;margin:8px auto;background:#0e0e14;border-radius:12px;border:1px solid var(--line)}
.hist{display:flex;align-items:flex-end;gap:2px;height:110px;margin:12px 0 18px}
.hist i{flex:1;display:block;background:linear-gradient(180deg,#c4b5fd,#6d28d9);border-radius:3px 3px 0 0;min-width:3px;position:relative}
.hist i span{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--muted)}
pre{background:#0e0e14;padding:10px;border-radius:10px;font-size:11px;overflow:auto;max-height:200px;color:var(--muted);white-space:pre-wrap}
.log{font-size:11px;color:var(--muted);max-height:100px;overflow:auto;margin-top:6px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:10px}
.tabs button{flex:1;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted);font-weight:600}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.panel{display:none}.panel.on{display:block}
footer{margin-top:8px;font-size:12px;color:var(--muted)}
footer a{color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="logo">АКСИ <span>Q-CHIP</span></div>
  <nav><a href="/local-ai.html">Local AI</a> <a href="/">След</a> <a href="/HONEST.md">Честно</a></nav>
</header>
<h1>Полный виртуальный квантовый чип</h1>
<div class="warn"><b>Не физический QPU.</b> State-vector симулятор до 10 кубитов на aksi-quantum.js. Шум — игрушечная модель.</div>
<div class="grid">
<div>
<div class="card">
<h2>Регистр</h2>
<div class="row">
<label>n</label>
<select id="nq"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>8</option><option>10</option></select>
<button type="button" class="p" id="reset">|0…0⟩</button>
<button type="button" id="undo" disabled>Undo</button>
<button type="button" id="export">Export</button>
</div>
<div class="row">
<label>target</label><input type="number" id="t" value="0" min="0" max="9" style="width:52px">
<label>ctrl</label><input type="number" id="c" value="0" min="0" max="9" style="width:52px">
<label>ctrl2</label><input type="number" id="c2" value="1" min="0" max="9" style="width:52px">
<label>θ°</label><input type="number" id="th" value="90" step="15" style="width:60px">
</div>
<div class="row">
<label><input type="checkbox" id="noise"> шум p=</label>
<input type="number" id="np" value="0.02" min="0" max="0.5" step="0.01" style="width:64px">
</div>
</div>
<div class="card">
<div class="tabs">
<button type="button" class="on" data-tab="gates">Гейты</button>
<button type="button" data-tab="preset">Пресеты</button>
<button type="button" data-tab="run">Измерение</button>
</div>
<div class="panel on" id="tab-gates">
<div class="row">
<button type="button" class="g" data-g="h">H</button>
<button type="button" class="g" data-g="x">X</button>
<button type="button" class="g" data-g="y">Y</button>
<button type="button" class="g" data-g="z">Z</button>
<button type="button" class="g" data-g="s">S</button>
<button type="button" class="g" data-g="t">T</button>
<button type="button" class="g" data-g="rx">Rx</button>
<button type="button" class="g" data-g="ry">Ry</button>
<button type="button" class="g" data-g="rz">Rz</button>
</div>
<div class="row">
<button type="button" class="g" data-g="cnot">CNOT</button>
<button type="button" class="g" data-g="cz">CZ</button>
<button type="button" class="g" data-g="swap">SWAP</button>
<button type="button" class="g" data-g="ccx">Toffoli</button>
</div>
</div>
<div class="panel" id="tab-preset">
<div class="row">
<button type="button" data-p="bell">Bell</button>
<button type="button" data-p="ghz">GHZ</button>
<button type="button" data-p="w">W-3</button>
<button type="button" data-p="qft">QFT</button>
<button type="button" data-p="grover">Grover</button>
<button type="button" data-p="chsh">CHSH</button>
<button type="button" data-p="gate">answerGate</button>
</div>
</div>
<div class="panel" id="tab-run">
<div class="row">
<button type="button" class="p" id="measure">Measure</button>
<button type="button" id="sample">Sample 512</button>
<button type="button" id="refresh">Refresh</button>
</div>
</div>
</div>
<div class="card"><h2>Circuit</h2><pre id="circ">—</pre><div class="log" id="log"></div></div>
</div>
<div>
<div class="card">
<h2>Состояние</h2>
<div class="stat">
<div><b id="sN">2</b><span>qubits</span></div>
<div><b id="sD">4</b><span>dim</span></div>
<div><b id="sE">—</b><span>entropy</span></div>
<div><b id="sP">—</b><span>purity</span></div>
</div>
<div class="row" style="margin-top:8px"><label>Bloch q</label><select id="bq"><option>0</option><option>1</option></select></div>
<canvas id="bloch" width="220" height="220"></canvas>
<div class="hist" id="hist"></div>
<pre id="probs">—</pre>
</div>
</div>
</div>
<footer>aksilove@internet.ru · <a href="/local-ai.html">Local+Q</a></footer>
<script src="/aksi-quantum.js?v=2"></script>
<script>
(function(){
  var Q=window.AKSI_QUANTUM;
  if(!Q||!Q.create){document.getElementById("circ").textContent="aksi-quantum.js не загружен";return;}
  var chip=null,stack=[],ops=[];
  function nQ(){return +document.getElementById("nq").value||2;}
  function clamp(a,b,x){return Math.max(a,Math.min(b,x));}
  function tgt(){return clamp(0,nQ()-1,+document.getElementById("t").value||0);}
  function ctrl(){return clamp(0,nQ()-1,+document.getElementById("c").value||0);}
  function ctrl2(){return clamp(0,nQ()-1,+document.getElementById("c2").value||1);}
  function theta(){return ((+document.getElementById("th").value||0)*Math.PI)/180;}
  function noiseOn(){return document.getElementById("noise").checked;}
  function noiseP(){return Math.max(0,Math.min(0.5,+document.getElementById("np").value||0));}
  function log(m){var el=document.getElementById("log");el.textContent=m+"\n"+el.textContent;}
  function fillBlochSelect(){
    var sel=document.getElementById("bq"),n=nQ(),v=sel.value;sel.innerHTML="";
    for(var i=0;i<n;i++){var o=document.createElement("option");o.value=i;o.textContent=String(i);sel.appendChild(o);}
    if(+v<n)sel.value=v;
  }
  function applyOp(op){
    var t=op.t,c=op.c,c2=op.c2,th=op.th,name=op.name;
    if(name==="h")chip.h(t);else if(name==="x")chip.x(t);else if(name==="y")chip.y(t);else if(name==="z")chip.z(t);
    else if(name==="s")chip.s(t);else if(name==="t")chip.t(t);
    else if(name==="rx")chip.rx(t,th);else if(name==="ry")chip.ry(t,th);else if(name==="rz")chip.rz(t,th);
    else if(name==="cnot")chip.cnot(c,t);else if(name==="cz")chip.cz(c,t);else if(name==="swap")chip.swap(c,t);
    else if(name==="ccx")chip.ccx(c,c2,t);
  }
  function rebuild(){
    chip=Q.create(nQ());
    for(var i=0;i<ops.length;i++){
      if(String(ops[i].name).indexOf("preset:")===0)continue;
      applyOp(ops[i]);
    }
    if(noiseOn()&&noiseP()>0){
      for(var q=0;q<chip.n;q++)if(Math.random()<noiseP())try{chip.x(q);}catch(e){}
    }
    refresh();
  }
  function snapshot(){stack.push(JSON.stringify(ops));if(stack.length>40)stack.shift();document.getElementById("undo").disabled=!stack.length;}
  function reset(){snapshot();ops=[];fillBlochSelect();rebuild();log("reset");}
  function pushGate(name){
    snapshot();
    if(name==="ccx"&&nQ()<3){log("Toffoli n≥3");return;}
    ops.push({name:name,t:tgt(),c:ctrl(),c2:ctrl2(),th:theta()});
    try{rebuild();log(name);}catch(e){ops.pop();rebuild();log("error "+(e.message||e));}
  }
  function drawBloch(b){
    var canvas=document.getElementById("bloch");
    if(Q.drawBloch&&b){try{Q.drawBloch(canvas,b);return;}catch(e){}}
    var ctx=canvas.getContext("2d");if(!ctx)return;
    var w=canvas.width,h=canvas.height,cx=w/2,cy=h/2,R=Math.min(w,h)*0.4;
    ctx.clearRect(0,0,w,h);ctx.strokeStyle="rgba(167,139,250,.35)";
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();
    if(!b)return;
    var px=cx+(b.x||0)*R,py=cy-(b.z||0)*R;
    ctx.strokeStyle="#c4b5fd";ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(px,py);ctx.stroke();
    ctx.fillStyle="#a78bfa";ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.fill();
  }
  function refresh(){
    if(!chip)return;
    var p=chip.probs(),ent=chip.entropy?chip.entropy():0,pur=chip.purity?chip.purity():0,i;
    document.getElementById("sN").textContent=chip.n;
    document.getElementById("sD").textContent=p.length;
    document.getElementById("sE").textContent=Number(ent).toFixed(3);
    document.getElementById("sP").textContent=Number(pur).toFixed(3);
    document.getElementById("circ").textContent=(chip.circuitString?chip.circuitString():"")+(ops.length?"\n\nops: "+ops.map(function(o){return o.name;}).join(" · "):"");
    var hist=document.getElementById("hist");hist.innerHTML="";
    var max=0;for(i=0;i<p.length;i++)if(p[i]>max)max=p[i];
    var show=p.length<=16?p.map(function(_,i){return i;}):p.map(function(v,i){return v>1e-6?i:-1;}).filter(function(i){return i>=0;}).slice(0,16);
    if(!show.length)show=[0];
    show.forEach(function(i){
      var el=document.createElement("i");el.style.height=(max>0?Math.max(2,(p[i]/max)*100):2)+"px";
      var s=document.createElement("span");s.textContent=i.toString(2).padStart(chip.n,"0");el.appendChild(s);hist.appendChild(el);
    });
    var lines=[];for(i=0;i<p.length;i++)if(p[i]>1e-4)lines.push("|"+i.toString(2).padStart(chip.n,"0")+"⟩  "+(p[i]*100).toFixed(2)+"%");
    document.getElementById("probs").textContent=lines.join("\n")||"—";
    try{drawBloch(chip.bloch?chip.bloch(+document.getElementById("bq").value||0):null);}catch(e){}
  }
  function preset(name){
    snapshot();
    try{
      if(name==="bell"){document.getElementById("nq").value="2";fillBlochSelect();chip=Q.bell("phi+");ops=[{name:"preset:bell"}];refresh();log("Bell");return;}
      if(name==="ghz"){var n=Math.max(3,nQ());document.getElementById("nq").value=String(n);ops=[{name:"h",t:0}];for(var i=1;i<n;i++)ops.push({name:"cnot",c:0,t:i});}
      else if(name==="w"){document.getElementById("nq").value="3";ops=[{name:"ry",t:0,th:2*Math.acos(Math.sqrt(1/3))},{name:"cnot",c:0,t:1},{name:"x",t:0},{name:"ry",t:1,th:2*Math.acos(Math.sqrt(.5))},{name:"cnot",c:1,t:2},{name:"x",t:1}];log("W-approx");}
      else if(name==="qft"){fillBlochSelect();chip=Q.create(nQ());chip.x(0);if(chip.qft)chip.qft();ops=[{name:"preset:qft"}];refresh();log("QFT");return;}
      else if(name==="grover"){document.getElementById("nq").value="2";fillBlochSelect();chip=Q.grover?Q.grover(2,1):Q.create(2);ops=[{name:"preset:grover"}];refresh();log("Grover");return;}
      else if(name==="chsh"){var r=Q.chsh(1024);document.getElementById("probs").textContent=JSON.stringify(r,null,2);log("CHSH S="+(r.S!=null?r.S:r.s));return;}
      else if(name==="gate"){var g=Q.answerGate("AKSI","virtual chip");document.getElementById("probs").textContent=JSON.stringify({QCLI:g.QCLI,entropy:g.entropy,purity:g.purity,outcome:g.outcome,circuit:g.circuit},null,2);if(g.bloch0)drawBloch(g.bloch0);log("answerGate");return;}
      fillBlochSelect();rebuild();log("preset "+name);
    }catch(e){log("preset "+(e.message||e));}
  }
  document.querySelectorAll(".tabs button").forEach(function(btn){
    btn.onclick=function(){
      document.querySelectorAll(".tabs button").forEach(function(b){b.classList.remove("on");});
      document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("on");});
      btn.classList.add("on");document.getElementById("tab-"+btn.getAttribute("data-tab")).classList.add("on");
    };
  });
  document.getElementById("reset").onclick=reset;
  document.getElementById("nq").onchange=function(){ops=[];fillBlochSelect();rebuild();};
  document.getElementById("bq").onchange=refresh;
  document.getElementById("refresh").onclick=refresh;
  document.getElementById("undo").onclick=function(){if(!stack.length)return;ops=JSON.parse(stack.pop());document.getElementById("undo").disabled=!stack.length;fillBlochSelect();rebuild();log("undo");};
  document.querySelectorAll("[data-g]").forEach(function(b){b.onclick=function(){pushGate(b.getAttribute("data-g"));};});
  document.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){preset(b.getAttribute("data-p"));};});
  document.getElementById("measure").onclick=function(){if(!chip)reset();log("measure "+JSON.stringify(chip.measure?chip.measure():null));refresh();};
  document.getElementById("sample").onclick=function(){if(!chip)reset();if(!chip.sample){log("no sample");return;}document.getElementById("probs").textContent=JSON.stringify(chip.sample(512),null,2);log("sample 512");};
  document.getElementById("export").onclick=function(){
    var data={format:"aksi-qchip",note:"Classical simulation, not QPU",n:nQ(),ops:ops,probs:chip?chip.probs():[],entropy:chip&&chip.entropy?chip.entropy():null,circuit:chip&&chip.circuitString?chip.circuitString():"",contact:"aksilove@internet.ru",at:new Date().toISOString()};
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="aksi-qchip.json";a.click();
  };
  fillBlochSelect();rebuild();log("Q-Chip ready · MAX "+(Q.MAX_QUBITS||10));
})();
</script>
</body>
</html>
