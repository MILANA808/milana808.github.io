<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-cache"/>
<title>АКСИ — ответы</title>
<link rel="canonical" href="https://milana808.github.io/generate/"/>
<meta name="theme-color" content="#0b0b0d"/>
<style>
:root{--bg:#0b0b0d;--t:#f4f4f5;--m:#a1a1aa;--a:#34d399;--line:rgba(255,255,255,.12);--p:#141416}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,sans-serif;min-height:100vh}
.w{max-width:640px;margin:0 auto;padding:14px 12px 40px}
.tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--a)}
h1{font-size:1.25rem;margin:6px 0 4px}
.lead{color:var(--m);font-size:13px;margin:0 0 12px}
.box{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
textarea{width:100%;min-height:70px;border-radius:10px;border:1px solid var(--line);background:#0a0a0b;color:var(--t);padding:10px;font:inherit}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
button{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--a);color:#052e1c}
button:disabled{opacity:.5}
.chip{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--m)}
.chip.on{border-color:var(--a);color:var(--a)}
.out{white-space:pre-wrap;word-break:break-word;min-height:5em;line-height:1.55}
.meta{font-size:12px;color:var(--m);margin-top:8px}
.meta a{color:var(--a)}
.ex{margin-top:8px}
.ex button{background:#1c1c1f;color:var(--t);border:1px solid var(--line);font-weight:600;font-size:12px;padding:6px 10px}
footer{margin-top:14px;font-size:12px;color:var(--m)}
footer a{color:var(--a);margin-right:10px}
.err{color:#fca5a5;font-size:13px;margin-top:6px}
</style>
</head>
<body>
<div class="w">
  <div class="tag">AKSI · v5</div>
  <h1>Спроси</h1>
  <p class="lead">Счёт локально. Факты — Wikipedia. АКСИ — локально. Нужен интернет для фактов о мире.</p>
  <div class="box">
    <textarea id="q">что такое квантовая механика?</textarea>
    <div class="row">
      <button type="button" id="go">Ответить</button>
      <span class="chip" id="net">…</span>
    </div>
    <div class="ex">
      <button type="button" data-q="что такое квантовая механика?">квантовая механика</button>
      <button type="button" data-q="кто такой Ломоносов?">Ломоносов</button>
      <button type="button" data-q="почему небо синее?">небо синее</button>
      <button type="button" data-q="(2+3)*10">счёт</button>
      <button type="button" data-q="кто ты?">кто ты</button>
    </div>
    <div class="err" id="err" hidden></div>
  </div>
  <div class="box">
    <div class="out" id="ans">Нажми «Ответить».</div>
    <div class="meta" id="meta"></div>
  </div>
  <footer>
    <a href="/">home</a>
    <a href="/talk/">talk</a>
    <a href="/permit/">permit</a>
  </footer>
</div>
<script>
(function(){
"use strict";
var LOCAL=[
{re:/привет|здравств|hello|hi\b/i,a:"Привет! Спрашивай факт («что такое …»), счёт или про АКСИ (кто ты, Permit)."},
{re:/кто ты|что ты такое|представься|о себе/i,a:"Я АКСИ (milana808.github.io).\n\n• Факты — краткий пересказ Wikipedia\n• Счёт — в браузере\n• Permit — замок на действия агента\n\nНе облачный GPT. Контакт: aksilove@internet.ru"},
{re:/permit|мандат|action permit/i,a:"Permit — default-deny допуск действия агента: ALLOW/BLOCK + receipt.\nДемо: https://milana808.github.io/permit/"},
{re:/спасибо|благодар/i,a:"Пожалуйста."}
];
var cache=Object.create(null);
function tryMath(q){
  var raw=String(q);
  if(!/\d/.test(raw))return null;
  var want=/(посчита|вычисл|сколько\s+будет|равняется)|^[\d\s\+\-\*\/\^\(\)\.]+$/i.test(raw);
  if(!want&&!/[\+\-\*\/]\s*\d/.test(raw))return null;
  try{
    var expr=raw.replace(/[^0-9\+\-\*\/\(\)\.\^\s]/g," ").replace(/\^/g,"**").replace(/\s+/g,"");
    if(!expr||expr.length>80)return null;
    if(!/^[0-9\+\-\*\/\(\)\.]+$/.test(expr.replace(/\*\*/g,"")))return null;
    var v=Function('"use strict";return ('+expr+')')();
    if(typeof v==="number"&&isFinite(v))return "Считаю:\n"+expr.replace(/\*\*/g,"^")+" = "+v;
  }catch(e){}
  return null;
}
function stripQuestion(q){
  return String(q)
    .replace(/[«»"']/g,"")
    .replace(/^(пожалуйста|скажи|расскажи|объясни|подскажи)\s+/i,"")
    .replace(/^(что|кто|где|когда|какой|какая|какие|как|почему|зачем|сколько)\s+(такое|такой|такая|такие|это)?\s*/i,"")
    .replace(/^(what|who|where|when|why|how|tell me about|explain)\s+(is|are|was|were)?\s*/i,"")
    .replace(/[?!.]+$/g,"")
    .trim();
}
function queriesFor(q){
  var base=stripQuestion(q)||q.trim();
  var list=[base];
  if(base!==q.trim())list.push(q.trim().replace(/[?!.]+$/g,""));
  if(/[а-яё]/i.test(base))list.push(base.replace(/ё/g,"е"));
  var low=q.toLowerCase();
  if(/небо/.test(low)&&/син/.test(low))list.unshift("Рассеяние Рэлея");
  if(/(океан|море)/.test(low)&&/син/.test(low))list.unshift("Цвет воды");
  return list.filter(function(x,i,a){return x&&a.indexOf(x)===i;}).slice(0,5);
}
function wikiSearch(lang,term){
  var url="https://"+lang+".wikipedia.org/w/api.php?action=opensearch&search="+
    encodeURIComponent(term)+"&limit=5&namespace=0&format=json&origin=*";
  return fetch(url,{credentials:"omit",mode:"cors"})
    .then(function(r){return r.json();})
    .then(function(data){return(data&&data[1])||[];})
    .catch(function(){return[];});
}
function wikiSummary(lang,title){
  var url="https://"+lang+".wikipedia.org/api/rest_v1/page/summary/"+
    encodeURIComponent(title.replace(/ /g,"_"));
  return fetch(url,{credentials:"omit",mode:"cors"})
    .then(function(r){
      if(!r.ok)throw new Error("summary "+r.status);
      return r.json();
    })
    .then(function(j){
      if(j.type==="disambiguation")return null;
      var extract=(j.extract||"").trim();
      if(extract.length<30)return null;
      return{
        title:j.title||title,
        extract:extract,
        url:(j.content_urls&&j.content_urls.desktop&&j.content_urls.desktop.page)||
          ("https://"+lang+".wikipedia.org/wiki/"+encodeURIComponent(title))
      };
    });
}
function clipExtract(extract){
  var parts=extract.split(/(?<=[.!?…])\s+/);
  var body=parts.slice(0,6).join(" ");
  if(body.length>1200)body=body.slice(0,1180).replace(/\s+\S*$/,"")+"…";
  return body;
}
async function research(question){
  var key=question.toLowerCase().trim();
  if(cache[key])return cache[key];
  var terms=queriesFor(question);
  var langs=/[а-яё]/i.test(question)?["ru","en"]:["en","ru"];
  for(var li=0;li<langs.length;li++){
    var lang=langs[li];
    for(var ti=0;ti<terms.length;ti++){
      var titles=await wikiSearch(lang,terms[ti]);
      for(var i=0;i<Math.min(titles.length,4);i++){
        try{
          var hit=await wikiSummary(lang,titles[i]);
          if(hit){
            var out={hit:hit,lang:lang,method:"wikipedia:"+lang};
            cache[key]=out;
            return out;
          }
        }catch(e){}
      }
    }
  }
  return null;
}
function localMatch(q){
  for(var i=0;i<LOCAL.length;i++){
    if(LOCAL[i].re.test(q))return LOCAL[i].a;
  }
  return null;
}
function isSmallTalk(q){
  return /привет|здравств|кто ты|что ты|permit|мандат|спасибо|hello|hi\b|представь/i.test(q);
}
async function answer(q){
  var math=tryMath(q);
  if(math)return{text:math,method:"math",link:null};
  var loc=localMatch(q);
  if(loc&&isSmallTalk(q))return{text:loc,method:"local",link:null};
  if(!navigator.onLine){
    if(loc)return{text:loc,method:"local-offline",link:null};
    return{text:"Нет сети. Нужен интернет для Wikipedia.\nЛокально: кто ты, Permit, простой счёт.",method:"offline",link:null};
  }
  var res=await research(q);
  if(res&&res.hit){
    var body=clipExtract(res.hit.extract);
    var text="Кратко:\n\n"+body+"\n\n— "+res.hit.title;
    return{text:text,method:res.method,link:res.hit.url};
  }
  if(loc)return{text:loc,method:"local",link:null};
  return{text:"Не нашла статью по «"+q+"».\nПопробуй короче: имя или термин.",method:"fallback",link:null};
}
var qEl=document.getElementById("q");
var ans=document.getElementById("ans");
var meta=document.getElementById("meta");
var go=document.getElementById("go");
var net=document.getElementById("net");
var err=document.getElementById("err");
var busy=false;
function setNet(){
  if(navigator.onLine){net.textContent="online";net.classList.add("on");}
  else{net.textContent="offline";net.classList.remove("on");}
}
setNet();
window.addEventListener("online",setNet);
window.addEventListener("offline",setNet);
document.querySelectorAll("[data-q]").forEach(function(b){
  b.addEventListener("click",function(){qEl.value=b.getAttribute("data-q");});
});
async function run(){
  var q=(qEl.value||"").trim();
  if(!q||busy)return;
  busy=true;go.disabled=true;
  err.hidden=true;
  ans.textContent="Ищу…";
  meta.textContent="";
  var t0=performance.now();
  try{
    var r=await answer(q);
    ans.textContent=r.text;
    var ms=Math.round(performance.now()-t0);
    var html=r.method+" · "+ms+" ms";
    if(r.link)html+=' · <a href="'+r.link.replace(/"/g,"")+'" target="_blank" rel="noopener noreferrer">источник</a>';
    meta.innerHTML=html;
  }catch(e){
    err.hidden=false;
    err.textContent=String(e&&e.message||e);
    ans.textContent="Ошибка запроса. Проверь интернет.";
  }
  busy=false;go.disabled=false;
}
go.addEventListener("click",run);
qEl.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();run();}
});
setTimeout(function(){ if((qEl.value||"").trim()) run(); }, 400);
})();
</script>
</body>
</html>
