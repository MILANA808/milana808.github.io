<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АКСИ · Сообщения</title>
<meta name="theme-color" content="#f3ebe0">
<link rel="stylesheet" href="../styles.css">
<script src="../aksi-core.js" defer></script>
<style>
  .msg-layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    min-height: 520px;
  }
  @media (min-width: 800px) {
    .msg-layout { grid-template-columns: 240px 1fr; }
  }
  .peers { padding: 12px; max-height: 520px; overflow-y: auto; }
  .peer {
    display: block; width: 100%; text-align: left;
    background: transparent; border: none; border-radius: 12px;
    padding: 12px; cursor: pointer; font: inherit; color: var(--ink);
    margin-bottom: 4px;
  }
  .peer:hover, .peer.active { background: rgba(166,124,82,0.12); }
  .peer .pn { font-weight: 600; font-size: 14px; }
  .peer .pl { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread {
    display: flex; flex-direction: column;
    min-height: 520px; max-height: 70vh;
  }
  .thread-head {
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  .thread-body {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
    background: linear-gradient(180deg, #faf6f0, #f7f1e8);
  }
  .bubble {
    max-width: 85%; padding: 12px 14px; border-radius: 16px; font-size: 14px;
    line-height: 1.5;
  }
  .bubble.me {
    align-self: flex-end;
    background: linear-gradient(135deg, #8b5e34, #a67c52);
    color: #fffbf5;
    border-bottom-right-radius: 6px;
  }
  .bubble.them {
    align-self: flex-start;
    background: #fffbf5;
    border: 1px solid var(--border);
    border-bottom-left-radius: 6px;
  }
  .bubble .t { font-size: 10px; opacity: 0.7; margin-top: 4px; }
  .thread-input {
    display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border);
  }
  .thread-input input {
    flex: 1; background: #f5efe6; border: 1px solid var(--border);
    border-radius: 999px; padding: 12px 16px; font: inherit; outline: none;
  }
  .new-peer { padding: 12px; border-top: 1px solid var(--border); }
  .new-peer input {
    width: 100%; background: #f5efe6; border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; font: inherit; margin-bottom: 8px;
  }
</style>
</head>
<body>
<div class="shell">
<nav class="topnav" style="padding-top:20px">
  <div class="nav-inner">
    <a class="brand" href="../"><span class="mark">АКСИ</span></a>
    <div class="nav-links">
      <a href="../">Главная</a>
      <a href="../feed/">Лента</a>
      <a href="./" style="color:var(--accent-deep)">Сообщения</a>
      <a href="../cabinet/">Кабинет</a>
      <a href="../#demo">Агент</a>
    </div>
  </div>
</nav>
<main>
  <h1 class="sec-title">Сообщения</h1>
  <p class="sec-sub">Личные диалоги в браузере. Для живого API укажите backend в кабинете.</p>

  <div class="msg-layout">
    <div class="glass peers">
      <div id="peer-list"></div>
      <div class="new-peer">
        <input id="new-peer" placeholder="Новый диалог (id)">
        <button type="button" class="btn btn-ghost btn-sm" id="new-peer-btn" style="width:100%">Открыть</button>
      </div>
    </div>
    <div class="glass thread">
      <div class="thread-head" id="thread-title">Выберите диалог</div>
      <div class="thread-body" id="thread-body"></div>
      <div class="thread-input">
        <input id="msg-input" placeholder="Сообщение…" autocomplete="off">
        <button type="button" class="btn btn-primary" id="msg-send">→</button>
      </div>
    </div>
  </div>
</main>
<footer>АКСИ · Messages</footer>
</div>
<script>
(function(){
  var peer="aksi";
  function ready(){
    if(!window.AksiCore){setTimeout(ready,30);return;}
    var C=AksiCore;
    C.ensureAksiThread();

    function renderPeers(){
      var list=C.listPeers();
      if(!list.length) list=[{peer:"aksi",last:"…",ts:0}];
      var el=document.getElementById("peer-list");
      el.innerHTML=list.map(function(x){
        return '<button type="button" class="peer'+(x.peer===peer?' active':'')+'" data-peer="'+x.peer+'">'+ 
          '<div class="pn">'+x.peer+'</div><div class="pl">'+esc(x.last||"")+'</div></button>';
      }).join("");
      el.querySelectorAll("[data-peer]").forEach(function(b){
        b.onclick=function(){peer=b.getAttribute("data-peer");renderPeers();renderThread();};
      });
    }
    function renderThread(){
      document.getElementById("thread-title").textContent=peer;
      var msgs=C.getMessages(peer);
      var body=document.getElementById("thread-body");
      body.innerHTML=msgs.map(function(m){
        return '<div class="bubble '+(m.me?'me':'them')+'">'+esc(m.text)+
          '<div class="t">'+C.fmtTime(m.ts)+'</div></div>';
      }).join("");
      body.scrollTop=body.scrollHeight;
    }
    function esc(s){return String(s||"").replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">");}
    function send(){
      var inp=document.getElementById("msg-input");
      var t=(inp.value||"").trim();
      if(!t)return;
      inp.value="";
      C.sendMessage(peer,t);
      renderPeers();
      renderThread();
    }
    document.getElementById("msg-send").onclick=send;
    document.getElementById("msg-input").onkeydown=function(e){if(e.key==="Enter")send();};
    document.getElementById("new-peer-btn").onclick=function(){
      var n=(document.getElementById("new-peer").value||"").trim().slice(0,32);
      if(!n)return;
      peer=n;
      document.getElementById("new-peer").value="";
      if(!C.getMessages(peer).length)C.sendMessage(peer,"👋");
      renderPeers();renderThread();
    };
    renderPeers();renderThread();
  }
  ready();
})();
</script>
</body>
</html>
