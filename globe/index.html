<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>АКСИ · Глобус</title>
<meta name="theme-color" content="#05010f"/>
<style>
:root{--bg:#05010f;--ink:#f3e8ff;--muted:#9d8ec4;--cyan:#22d3ee;--violet:#a855f7}
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;overflow:hidden}
header{position:fixed;top:0;left:0;right:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:linear-gradient(#05010f,transparent)}
a{color:var(--muted);text-decoration:none;font-size:13px}
.brand{letter-spacing:.2em;font-size:12px;font-weight:600}
#c{display:block;width:100%;height:100dvh}
.hud{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:2;background:rgba(12,6,28,.85);border:1px solid rgba(168,85,247,.3);border-radius:16px;padding:12px 18px;font-size:13px;color:var(--muted);text-align:center;max-width:90vw;backdrop-filter:blur(10px)}
.hud b{color:var(--cyan)}
</style>
</head>
<body>
<header>
  <a href="/">← домой</a>
  <span class="brand">АКСИ GLOBE</span>
  <a href="/lab/">квант</a>
</header>
<canvas id="c"></canvas>
<div class="hud">Резонансная карта · узлов: <b id="n">12</b> · тяни мышью / пальцем</div>
<script>
(function(){
var c=document.getElementById("c"),x=c.getContext("2d");
var W,H,rot=0.3,tilt=0.4,drag=false,lx=0,ly=0;
var nodes=[];
function rz(){W=c.width=innerWidth;H=c.height=innerHeight;}
addEventListener("resize",rz);rz();
for(var i=0;i<12;i++){
  var la=(Math.random()-0.5)*Math.PI*0.9;
  var lo=Math.random()*Math.PI*2;
  nodes.push({la:la,lo:lo,p:0.5+Math.random()*0.5});
}
function project(la,lo){
  var x3=Math.cos(la)*Math.cos(lo+rot);
  var y3=Math.sin(la);
  var z3=Math.cos(la)*Math.sin(lo+rot);
  var y2=y3*Math.cos(tilt)-z3*Math.sin(tilt);
  var z2=y3*Math.sin(tilt)+z3*Math.cos(tilt);
  var R=Math.min(W,H)*0.32;
  return {x:W/2+x3*R,y:H/2+y2*R,z:z2,vis:z2>-0.15};
}
function draw(){
  x.fillStyle="#05010f";x.fillRect(0,0,W,H);
  var R=Math.min(W,H)*0.32;
  // globe disk
  var g=x.createRadialGradient(W/2-R*0.3,H/2-R*0.3,R*0.1,W/2,H/2,R);
  g.addColorStop(0,"#1e1b4b");g.addColorStop(0.6,"#0f172a");g.addColorStop(1,"#020617");
  x.beginPath();x.arc(W/2,H/2,R,0,Math.PI*2);x.fillStyle=g;x.fill();
  x.strokeStyle="rgba(34,211,238,.25)";x.lineWidth=1.5;x.stroke();
  // meridians
  x.strokeStyle="rgba(168,85,247,.12)";x.lineWidth=1;
  for(var m=0;m<6;m++){
    x.beginPath();
    for(var t=-90;t<=90;t+=6){
      var p=project(t*Math.PI/180,m*Math.PI/3);
      if(t===-90)x.moveTo(p.x,p.y);else x.lineTo(p.x,p.y);
    }
    x.stroke();
  }
  nodes.forEach(function(n){
    var p=project(n.la,n.lo);
    if(!p.vis)return;
    var s=3+n.p*4;
    x.beginPath();x.arc(p.x,p.y,s,0,Math.PI*2);
    x.fillStyle="rgba(34,211,238,"+(0.5+n.p*0.5)+")";x.fill();
    x.beginPath();x.arc(p.x,p.y,s*2.5,0,Math.PI*2);
    x.strokeStyle="rgba(168,85,247,.25)";x.stroke();
  });
  if(!drag)rot+=0.003;
  requestAnimationFrame(draw);
}
c.addEventListener("pointerdown",function(e){drag=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId);});
c.addEventListener("pointerup",function(){drag=false;});
c.addEventListener("pointermove",function(e){
  if(!drag)return;
  rot+=(e.clientX-lx)*0.008;
  tilt=Math.max(-1,Math.min(1,tilt+(e.clientY-ly)*0.005));
  lx=e.clientX;ly=e.clientY;
});
document.getElementById("n").textContent=String(nodes.length);
draw();
})();
</script>
</body>
</html>
