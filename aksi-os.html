<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>АКСИ OS</title><style>body{margin:0;background:#09090b;color:#f4f4f5;font:15px system-ui,-apple-system,sans-serif}main{max-width:860px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.card{background:#18181b;border:1px solid #27272a;border-radius:16px;padding:16px}.ok{color:#86efac}.off{color:#a1a1aa}.warn{color:#fbbf24}button{border:1px solid #3f3f46;background:#27272a;color:#fff;border-radius:10px;padding:10px 12px;cursor:pointer}textarea,input{width:100%;box-sizing:border-box;background:#09090b;color:#fff;border:1px solid #3f3f46;border-radius:10px;padding:10px;margin:6px 0}.wide{grid-column:1/-1}.mono{font:12px ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}.row{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-block;border:1px solid #3f3f46;border-radius:999px;padding:4px 8px;margin:3px;font-size:12px}</style></head><body><main><div class="top"><div><div style="font-size:11px;letter-spacing:.12em;color:#a1a1aa">SOVEREIGN LOCAL-FIRST</div><h1 style="margin:4px 0">АКСИ OS</h1><div style="color:#a1a1aa">Один вход ко всем реально доступным контурам.</div></div><button id="run">Проверить систему</button></div><section class="grid"><div class="card wide"><b>Возможности</b><div id="caps" class="mono" style="margin-top:10px">Проверка…</div></div><div class="card wide"><b>Диалог</b><textarea id="q" rows="3" placeholder="Задайте вопрос АКСИ"></textarea><div class="row"><button id="ask">Ответить</button><button id="teach">Обучить</button><button id="quantum">Прогнать через AKSI-Q</button></div><pre id="answer" class="mono"></pre></div><div class="card"><b>Proof</b><div id="proof" class="mono">Нет операции</div><button id="passport">Создать паспорт</button></div><div class="card"><b>Learning</b><div id="learn" class="mono">Локальное обучение</div><button id="memory">Показать знания</button></div><div class="card"><b>Quantum</b><div id="qout" class="mono">Симулятор 3 кубитов</div></div><div class="card"><b>Security</b><div id="sec" class="mono">Web Crypto / IndexedDB</div></div></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));const load=(src)=>new Promise(r=>{if(document.querySelector('script[src="'+src+'"]'))return r(true);const s=document.createElement('script');s.src=src;s.onload=()=>r(true);s.onerror=()=>r(false);document.head.appendChild(s)});async function boot(){const files=['aksi-core.js','aksi-proof.js','aksi-proof-graph.js','aksi-counterfactual.js','aksi-learning.js','aksi-quantum-reasoner.js','aksi-frontier.js','aksi-passport.js','aksi-auth.js'];const res={};for(const f of files)res[f]=await load(f);const caps=[['Web Crypto',!!crypto?.subtle],['IndexedDB',!!window.indexedDB],['WebAssembly',!!window.WebAssembly],['WebGPU',!!navigator.gpu],['Learning',!!window.AKSILearning],['Quantum Reasoner',!!window.AKSIQuantumReasoner],['Proof Graph',!!window.AKSIProofGraph],['Frontier',!!window.AKSIFrontier],['Passport',!!window.AKSIPassport],['Core',!!window.AKSI],['Auth',!!window.AKSIAuth]];$('caps').innerHTML=caps.map(([n,v])=>`${v?'✓':'—'} ${n} <span class="${v?'ok':'off'}">${v?'AVAILABLE':'NOT ACTIVE'}</span>`).join('\n');$('sec').textContent='Web Crypto: '+(crypto?.subtle?'available':'unavailable')+'\nIndexedDB: '+(indexedDB?'available':'unavailable')+'\nNo capability is marked active unless detected.';return res}async function ask(){const q=$('q').value.trim();if(!q)return;let out='';if(window.AKSI?.ask)try{const r=await window.AKSI.ask(q);out=typeof r==='string'?r:(r?.answer||JSON.stringify(r,null,2))}catch(e){}if(!out)out='АКСИ OS: локальный ответный контур не предоставляет API ask; используйте подключённый чат.';$('answer').textContent=out;window.__last={q,answer:out,at:new Date().toISOString()};$('proof').textContent='Ответ получен. Целостность и доказательства проверяются отдельными контурами.'}async function quantum(){const q=$('q').value.trim()||'current request';if(!window.AKSIQuantumReasoner){$('qout').textContent='AKSI-Q недоступен';return}const r=window.AKSIQuantumReasoner.run(q);$('qout').textContent=JSON.stringify(r,null,2);window.__q=r}async function teach(){const q=$('q').value.trim();if(!q||!window.AKSILearning){$('learn').textContent='Введите вопрос и убедитесь, что Learning доступен.';return}const a=prompt('Какой ответ/правило сохранить локально?');if(!a)return;await window.AKSILearning.add({question:q,answer:a,source:'user',approved:true});$('learn').textContent='✓ Сохранено локально. Это память/обучение примерами, не переобучение весов LLM.'}async function memory(){if(!window.AKSILearning){$('learn').textContent='Learning недоступен';return}const a=await window.AKSILearning.all();$('learn').textContent=a.length? a.map(x=>`[${x.id}] ${x.question}\n→ ${x.answer}`).join('\n\n'):'Знаний нет.'}async function passport(){const d=window.__last;if(!d){$('proof').textContent='Сначала получите ответ.';return}if(window.AKSIPassport?.create){try{$('proof').textContent=JSON.stringify(await window.AKSIPassport.create(d),null,2);return}catch(e){}}if(crypto?.subtle){const b=new TextEncoder().encode(JSON.stringify(d));const h=await crypto.subtle.digest('SHA-256',b);const hex=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');$('proof').textContent='Decision Passport\nSHA-256: '+hex+'\nIntegrity only: hash does not prove truth.'}}$('ask').onclick=ask;$('quantum').onclick=quantum;$('teach').onclick=teach;$('memory').onclick=memory;$('passport').onclick=passport;$('run').onclick=boot;boot()})();
</script></body></html>
