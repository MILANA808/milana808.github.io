<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>АКСИ · Вход</title>
<meta name="theme-color" content="#05010f"/>
<style>
:root{--bg:#05010f;--ink:#f3e8ff;--muted:#9d8ec4;--line:rgba(168,85,247,.25);--violet:#a855f7}
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;background:radial-gradient(ellipse 80% 40% at 50% 0%,rgba(168,85,247,.22),transparent),var(--bg);color:var(--ink);font-family:system-ui,sans-serif;padding:24px}
.w{max-width:400px;margin:0 auto}
a{color:var(--muted);text-decoration:none;font-size:13px}
h1{font-size:1.4rem;margin:18px 0 8px}
.sub{color:var(--muted);font-size:13px;line-height:1.45;margin-bottom:20px}
.box{background:rgba(18,10,36,.85);border:1px solid var(--line);border-radius:18px;padding:20px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;cursor:pointer}
.tabs button.on{background:var(--violet);color:#fff;border-color:transparent}
label{display:block;font-size:11px;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.04em}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0c0818;color:var(--ink);font:inherit}
.btn{width:100%;margin-top:16px;padding:14px;border:none;border-radius:14px;background:linear-gradient(145deg,#a855f7,#6366f1);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.msg{margin-top:12px;font-size:13px;min-height:1.3em}
.ok{color:#6ee7b7}.err{color:#fca5a5}
.did{font-family:ui-monospace,monospace;font-size:11px;word-break:break-all;color:var(--muted);margin-top:8px}
.who{margin-top:16px;padding:12px;border-radius:12px;background:#0a0614;font-size:13px;display:none}
</style>
</head>
<body>
<div class="w">
  <a href="/">← домой</a>
  <h1>Вход / регистрация</h1>
  <p class="sub">Аккаунт только в этом браузере. Пароль хранится как хэш, не на чужом сервере.</p>
  <div class="box">
    <div class="tabs">
      <button type="button" class="on" id="tab-reg">Регистрация</button>
      <button type="button" id="tab-in">Вход</button>
    </div>
    <div id="panel-reg">
      <label>Имя</label>
      <input id="r-name" placeholder="Имя" maxlength="48" autocomplete="name">
      <label>Handle</label>
      <input id="r-handle" placeholder="handle" maxlength="24" autocomplete="username">
      <label>Пароль</label>
      <input id="r-pass" type="password" placeholder="минимум 6 символов" autocomplete="new-password">
      <button type="button" class="btn" id="btn-reg">Создать</button>
    </div>
    <div id="panel-in" style="display:none">
      <label>Handle</label>
      <input id="i-handle" placeholder="handle" autocomplete="username">
      <label>Пароль</label>
      <input id="i-pass" type="password" placeholder="пароль" autocomplete="current-password">
      <button type="button" class="btn" id="btn-in">Войти</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="who" id="who"></div>
  </div>
</div>
<script>
(function(){
"use strict";
var KEY="AKSI_USERS_V1", SESSION="AKSI_SESSION_V1";
function users(){try{return JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){return{};}}
function saveUsers(u){localStorage.setItem(KEY,JSON.stringify(u));}
async function sha(s){
  var b=new TextEncoder().encode(s);
  var h=await crypto.subtle.digest("SHA-256",b);
  return Array.from(new Uint8Array(h)).map(function(x){return x.toString(16).padStart(2,"0");}).join("");
}
function didFor(handle){
  return "did:aksi:web:"+String(handle||"anon").toLowerCase().replace(/[^a-z0-9_-]/g,"").slice(0,24);
}
function msg(t,ok){var m=document.getElementById("msg");m.textContent=t;m.className="msg "+(ok?"ok":"err");}
function showSession(){
  var s=null;try{s=JSON.parse(localStorage.getItem(SESSION)||"null");}catch(e){}
  var el=document.getElementById("who");
  if(!s){el.style.display="none";return;}
  el.style.display="block";
  el.innerHTML="Вы вошли: <b>"+s.name+"</b> (@"+s.handle+")<div class=\"did\">"+s.did+"</div><button type=\"button\" class=\"btn\" id=\"btn-out\" style=\"margin-top:10px;background:#333\">Выйти</button>";
  document.getElementById("btn-out").onclick=function(){localStorage.removeItem(SESSION);showSession();msg("Вышли",true);};
}
document.getElementById("tab-reg").onclick=function(){
  this.classList.add("on");document.getElementById("tab-in").classList.remove("on");
  document.getElementById("panel-reg").style.display="";document.getElementById("panel-in").style.display="none";
};
document.getElementById("tab-in").onclick=function(){
  this.classList.add("on");document.getElementById("tab-reg").classList.remove("on");
  document.getElementById("panel-in").style.display="";document.getElementById("panel-reg").style.display="none";
};
document.getElementById("btn-reg").onclick=async function(){
  var name=document.getElementById("r-name").value.trim();
  var handle=document.getElementById("r-handle").value.trim().toLowerCase();
  var pass=document.getElementById("r-pass").value;
  if(!name||!handle||pass.length<6){msg("Имя, handle и пароль ≥6",false);return;}
  var u=users();
  if(u[handle]){msg("Handle занят",false);return;}
  var hash=await sha(handle+":"+pass);
  u[handle]={name:name,handle:handle,hash:hash,did:didFor(handle),ts:Date.now()};
  saveUsers(u);
  localStorage.setItem(SESSION,JSON.stringify({name:name,handle:handle,did:u[handle].did}));
  msg("Аккаунт создан",true);showSession();
};
document.getElementById("btn-in").onclick=async function(){
  var handle=document.getElementById("i-handle").value.trim().toLowerCase();
  var pass=document.getElementById("i-pass").value;
  var u=users()[handle];
  if(!u){msg("Нет такого handle",false);return;}
  var hash=await sha(handle+":"+pass);
  if(hash!==u.hash){msg("Неверный пароль",false);return;}
  localStorage.setItem(SESSION,JSON.stringify({name:u.name,handle:u.handle,did:u.did}));
  msg("Вход выполнен",true);showSession();
};
showSession();
})();
</script>
</body>
</html>
