<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe5d2">
<title>АКСИ Contour</title>
<style>
:root{--s:#fbf7ef;--s2:#efe6d6;--ink:#2a241c;--muted:#7a6f60;--line:#ddd0bb;--a:#6b4f35;--ok:#2f6b48}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.45 system-ui,sans-serif;background:linear-gradient(165deg,#f7f0e4,#efe5d2);color:var(--ink);min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{max-width:820px;margin:0 auto;padding:14px 12px 64px}
.badge{display:inline-block;background:#e8f2ea;color:var(--ok);font-weight:900;font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid #b7d4c2;margin-bottom:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tab{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--s);font-weight:800;font-size:12px;cursor:pointer}
.tab.on{background:var(--a);color:#fff;border-color:transparent}
.card{background:var(--s);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.composer{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:160px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:var(--a);color:#fff;font-weight:800}
button.g{background:var(--s2);color:var(--ink);border:1px solid var(--line)}
.out{margin-top:10px;padding:12px;border-radius:12px;background:var(--s2);border:1px solid var(--line);white-space:pre-wrap;min-height:48px}
.panel{display:none}.panel.on{display:block}
.muted{color:var(--muted);font-size:12px}
.foot{text-align:center;margin-top:18px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">Contour · Brain RU fusion</div>
  <h1 style="font-size:20px;font-weight:900">АКСИ Contour</h1>
  <p class="muted">Decision Integrity · русский offline · <a href="/platform.html">Platform</a></p>
  <div class="tabs">
    <button type="button" class="tab on" data-p="d">Decision</button>
    <button type="button" class="tab" data-p="c">Chat</button>
    <button type="button" class="tab" data-p="m">Memory</button>
  </div>
  <div class="panel on" id="p-d">
    <div class="card">
      <div class="composer"><input id="dq" placeholder="Вопрос…" autofocus><button type="button" id="dgo">Решить</button></div>
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
        <button type="button" class="g" data-q="кто ты">кто ты</button>
        <button type="button" class="g" data-q="миссия">миссия</button>
        <button type="button" class="g" data-q="формула">формула</button>
      </div>
      <div class="out" id="dout">—</div>
      <div class="muted" id="dmeta" style="margin-top:6px"></div>
    </div>
  </div>
  <div class="panel" id="p-c">
    <div class="card">
      <div class="composer"><input id="cq" placeholder="Чат…"><button type="button" id="cgo">Спросить</button></div>
      <div class="out" id="cout">—</div>
    </div>
  </div>
  <div class="panel" id="p-m">
    <div class="card">
      <div class="composer"><input id="mq" placeholder="запомни: факт"><button type="button" id="mgo">Сохранить</button></div>
      <div class="muted" id="mmsg" style="margin-top:8px"></div>
    </div>
  </div>
  <p class="foot">aksilove@internet.ru</p>
</div>
<script src="/aksi-neuro.js?v=301"></script>
<script src="/aksi-crystal.js?v=301"></script>
<script src="/aksi-mind.js?v=301"></script>
<script src="/aksi-brain-ru.js?v=301"></script>
<script src="/aksi-api.js?v=301"></script>
<script>
(function(){
  function $(id){return document.getElementById(id)}
  function show(n){
    document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('on',p.id==='p-'+n)});
    document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.getAttribute('data-p')===n)});
  }
  document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){show(t.getAttribute('data-p'))});});
  async function ask(q, out, meta){
    q=String(q||'').trim(); if(!q)return;
    out.textContent='…'; if(meta) meta.textContent='';
    try{
      var p=window.AKSI_BRAIN?await AKSI_BRAIN.decide(q):(window.AKSI?await AKSI.decide(q):{answer:'нет Brain'});
      out.textContent=p.answer||'—';
      if(meta) meta.textContent='source: '+(p.source||'?')+' · '+(p.version||'');
    }catch(e){out.textContent=String(e.message||e)}
  }
  $('dgo').onclick=function(){ask($('dq').value,$('dout'),$('dmeta'))};
  $('cgo').onclick=function(){ask($('cq').value,$('cout'))};
  $('mgo').onclick=async function(){
    var q=$('mq').value.trim(); if(!q)return;
    if(!/^запомни/i.test(q)) q='запомни: '+q;
    await ask(q,$('mmsg'));
  };
  document.querySelectorAll('[data-q]').forEach(function(b){
    b.onclick=function(){$('dq').value=b.getAttribute('data-q');ask(b.getAttribute('data-q'),$('dout'),$('dmeta'))};
  });
  $('dq').addEventListener('keydown',function(e){if(e.key==='Enter')ask($('dq').value,$('dout'),$('dmeta'))});
  setTimeout(function(){ask('кто ты',$('dout'),$('dmeta'))},200);
})();
</script>
</body>
</html>
