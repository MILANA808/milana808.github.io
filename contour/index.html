<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe5d2">
<title>АКСИ Contour v290</title>
<style>
:root{--s:#fbf7ef;--s2:#efe6d6;--ink:#2a241c;--muted:#7a6f60;--line:#ddd0bb;--a:#6b4f35;--ok:#2f6b48;--bad:#8b3a2f}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.45 system-ui,sans-serif;background:linear-gradient(165deg,#f7f0e4,#efe5d2);color:var(--ink);min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{max-width:900px;margin:0 auto;padding:12px 12px 64px}
.badge{display:inline-block;background:#e8f2ea;color:var(--ok);font-weight:900;font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid #b7d4c2;margin-bottom:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tab{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--s);font-weight:800;font-size:12px;cursor:pointer}
.tab.on{background:var(--a);color:#fff;border-color:transparent}
.card{background:var(--s);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.composer{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:160px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:var(--a);color:#fff;font-weight:800}
button.g{background:var(--s2);color:var(--ink);border:1px solid var(--line)}
.out{margin-top:10px;padding:12px;border-radius:12px;background:var(--s2);border:1px solid var(--line);white-space:pre-wrap;min-height:48px}
.panel{display:none}.panel.on{display:block}
.muted{color:var(--muted);font-size:12px}
.foot{text-align:center;margin-top:20px;color:var(--muted);font-size:12px}
.pill{font-size:11px;font-weight:800;color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">v290 · BRAIN RU · offline first</div>
  <h1 style="font-size:22px;font-weight:900">АКСИ Contour</h1>
  <p class="muted">Русский интеллект по умолчанию (Brain). WebLLM — опция, английский мусор отсекается.</p>
  <div class="tabs">
    <button type="button" class="tab on" data-p="decision">Decision</button>
    <button type="button" class="tab" data-p="chat">Chat</button>
    <button type="button" class="tab" data-p="mem">Memory</button>
    <button type="button" class="tab" data-p="status">Status</button>
  </div>

  <div class="panel on" id="p-decision">
    <div class="card">
      <div class="composer">
        <input id="dq" placeholder="Вопрос на русском…" autofocus>
        <button type="button" id="dgo">Решить</button>
      </div>
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
        <button type="button" class="g" id="dex3">кто ты</button>
        <button type="button" class="g" id="dex2">формула</button>
        <button type="button" class="g" id="dex1">π</button>
      </div>
      <div class="out" id="danswer">—</div>
      <div class="muted" id="dmeta" style="margin-top:6px"></div>
      <div class="pill" id="dgate" style="margin-top:6px"></div>
    </div>
  </div>

  <div class="panel" id="p-chat">
    <div class="card">
      <div class="composer">
        <input id="cq" placeholder="Чат…">
        <button type="button" id="cgo">Спросить</button>
      </div>
      <div class="out" id="cthread">—</div>
    </div>
  </div>

  <div class="panel" id="p-mem">
    <div class="card">
      <div class="composer">
        <input id="mq" placeholder="запомни: факт">
        <button type="button" id="mgo">Сохранить</button>
      </div>
      <div class="muted" id="mmsg" style="margin-top:8px"></div>
    </div>
  </div>

  <div class="panel" id="p-status">
    <div class="card">
      <pre class="out" id="fullStatus" style="font-size:11px">—</pre>
      <button type="button" class="g" id="btnRefresh" style="margin-top:8px">Обновить</button>
    </div>
  </div>

  <p class="foot"><a href="/">Хаб</a> · <a href="/sovereign/index.html">Sovereign</a> · aksilove@internet.ru</p>
</div>
<script src="/aksi-neuro.js?v=290"></script>
<script src="/aksi-mind.js?v=290"></script>
<script src="/aksi-crystal.js?v=290"></script>
<script src="/aksi-brain-ru.js?v=290"></script>
<script src="/aksi-pi-contour.js?v=290"></script>
<script src="/aksi-organism.js?v=290"></script>
<script src="/aksi-api.js?v=290"></script>
<script src="/aksi-webllm.js?v=290"></script>
<script>
(function(){
  function $(id){return document.getElementById(id)}
  function show(n){
    document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('on', p.id==='p-'+n)});
    document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on', t.getAttribute('data-p')===n)});
  }
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){ show(t.getAttribute('data-p')); });
  });

  async function decide(q){
    q = q || ($('dq') && $('dq').value) || '';
    q = String(q).trim(); if(!q) return;
    $('danswer').textContent = '…';
    $('dmeta').textContent = '';
    $('dgate').textContent = '';
    try {
      var p = null;
      if (window.AKSI_BRAIN) p = await AKSI_BRAIN.decide(q);
      if ((!p || !p.answer) && window.AKSI) p = await AKSI.decide(q);
      if (!p || !p.answer) p = { answer: 'Нет ответа', source: 'empty' };
      $('danswer').textContent = p.answer;
      $('dmeta').textContent = 'source: ' + (p.source || '?') + ' · ' + (p.version || '');
      $('dgate').textContent = (p.gate && p.gate.ok) ? ('Gate OK · ' + (p.gate.reason || '')) : 'Gate —';
    } catch (e) {
      $('danswer').textContent = String(e.message || e);
    }
  }

  async function chat(q){
    q = q || ($('cq') && $('cq').value) || '';
    q = String(q).trim(); if(!q) return;
    $('cthread').textContent = '…';
    try {
      var p = window.AKSI_BRAIN ? await AKSI_BRAIN.decide(q) : (window.AKSI ? await AKSI.decide(q) : null);
      $('cthread').textContent = (p && p.answer) || '—';
    } catch (e) {
      $('cthread').textContent = String(e.message || e);
    }
  }

  async function mem(){
    var q = ($('mq') && $('mq').value || '').trim();
    if (!q) return;
    if (!/^запомни/i.test(q)) q = 'запомни: ' + q;
    try {
      if (window.AKSI_BRAIN) await AKSI_BRAIN.decide(q);
      else if (window.AKSI) await AKSI.learn(q);
      $('mmsg').textContent = 'Сохранено';
    } catch (e) {
      $('mmsg').textContent = String(e.message || e);
    }
  }

  function status(){
    var o = {
      brain: !!(window.AKSI_BRAIN),
      mind: !!(window.AKSI_MIND),
      crystal: !!(window.AKSI_CRYSTAL),
      neuro: !!(window.AKSI_NEURO),
      api: !!(window.AKSI && AKSI.decide),
      webllm: !!(window.AKSI_WEBLLM && AKSI_WEBLLM.ready && AKSI_WEBLLM.ready()),
      apiStatus: window.AKSI && AKSI.status ? AKSI.status() : null
    };
    $('fullStatus').textContent = JSON.stringify(o, null, 2);
  }

  $('dgo').onclick = function(){ decide(); };
  $('dex1').onclick = function(){ $('dq').value='π'; decide('π'); };
  $('dex2').onclick = function(){ $('dq').value='формула'; decide('формула'); };
  $('dex3').onclick = function(){ $('dq').value='кто ты'; decide('кто ты'); };
  $('cgo').onclick = function(){ chat(); };
  $('mgo').onclick = function(){ mem(); };
  $('btnRefresh').onclick = status;
  $('dq').addEventListener('keydown', function(e){ if(e.key==='Enter') decide(); });
  $('cq').addEventListener('keydown', function(e){ if(e.key==='Enter') chat(); });

  setTimeout(function(){ decide('кто ты'); status(); }, 200);
})();
</script>
</body>
</html>
