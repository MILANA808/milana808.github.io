<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>АКСИ</title>
<meta name="theme-color" content="#0a0612"/>
<meta name="description" content="АКСИ — суверенный ИИ"/>
<link rel="icon" href="/icon.svg" type="image/svg+xml"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<style>
:root{
  --bg:#0a0612;
  --ink:#f4f0ff;
  --muted:#9b92b0;
  --line:rgba(255,255,255,.08);
  --accent:#a78bfa;
  --accent2:#38bdf8;
  --card:rgba(255,255,255,.04);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"SF Pro Text",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding:0 16px;min-height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px;flex-shrink:0}
header a{color:var(--muted);text-decoration:none;font-size:13px;letter-spacing:.02em}
header a:hover{color:var(--ink)}
.logo{font-weight:600;letter-spacing:.28em;font-size:12px;color:var(--ink)}
.langs{display:flex;gap:2px}
.langs button{
  background:transparent;border:none;color:var(--muted);font-size:11px;padding:6px 8px;
  border-radius:8px;cursor:pointer;letter-spacing:.04em
}
.langs button.on{color:var(--ink);background:var(--card)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0;min-height:0;width:100%}
.orb{
  width:88px;height:88px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#f5f3ff 0%,#a78bfa 38%,#1e1b4b 72%,#0a0612 100%);
  box-shadow:0 0 0 1px rgba(167,139,250,.25),0 12px 40px rgba(88,28,135,.35);
  display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;font-weight:300;color:#fff;transition:transform .5s ease,box-shadow .5s
}
.orb.pulse{transform:scale(1.04);box-shadow:0 0 0 1px rgba(56,189,248,.4),0 16px 48px rgba(56,189,248,.2)}
.status{margin-top:20px;font-size:13px;color:var(--muted);min-height:1.3em;letter-spacing:.01em}
.thoughts{width:100%;margin-top:16px;max-height:20vh;overflow-y:auto}
.th{
  font-size:12px;color:var(--muted);padding:8px 12px;margin:4px 0;
  border-left:2px solid var(--accent);background:var(--card);border-radius:0 10px 10px 0;
  opacity:0;animation:fade .35s ease forwards
}
@keyframes fade{to{opacity:1}}
.answer{
  width:100%;margin-top:16px;font-size:15px;line-height:1.6;color:var(--ink);
  text-align:left;max-height:36vh;overflow-y:auto;
  opacity:0;transform:translateY(6px);transition:.4s ease
}
.answer.show{opacity:1;transform:none}
.sig{font-size:10px;color:#6b6578;margin-top:12px;font-family:ui-monospace,monospace;letter-spacing:.03em}
footer{flex-shrink:0;padding:8px 0 12px}
.dock{
  display:flex;gap:8px;align-items:flex-end;
  padding:10px;border-radius:20px;background:var(--card);
  border:1px solid var(--line);backdrop-filter:blur(16px)
}
.dock textarea{
  flex:1;resize:none;min-height:44px;max-height:100px;border:none;background:transparent;
  color:var(--ink);padding:10px 8px;font:inherit;font-size:16px;outline:none;line-height:1.4
}
.dock button{
  width:44px;height:44px;border-radius:14px;border:none;cursor:pointer;
  background:linear-gradient(145deg,#8b5cf6,#6366f1);color:#fff;font-size:1.1rem;
  flex-shrink:0;display:grid;place-items:center
}
.dock button:disabled{opacity:.35}
.dock button.mic{background:transparent;border:1px solid var(--line);color:var(--muted)}
.dock button.mic.on{border-color:var(--accent2);color:var(--accent2)}
</style>
</head>
<body>
<header>
  <a href="/">←</a>
  <span class="logo">АКСИ</span>
  <div class="langs">
    <button type="button" data-lang="ru" class="on">RU</button>
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="tt">TT</button>
  </div>
</header>

<main>
  <div class="orb" id="orb">Ψ</div>
  <div class="status" id="status">Слушаю</div>
  <div class="thoughts" id="thoughts"></div>
  <div class="answer" id="answer"></div>
  <div class="sig" id="sig"></div>
</main>

<footer>
  <div class="dock">
    <button type="button" class="mic" id="mic" aria-label="Микрофон">🎙</button>
    <textarea id="input" rows="1" placeholder="Сообщение…" enterkeyhint="send"></textarea>
    <button type="button" id="send" aria-label="Отправить">↑</button>
  </div>
</footer>

<script src="../i18n.js"></script>
<script src="../codex.js"></script>
<script src="../aksi-brain.js"></script>
<script>
(function(){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
  if(window.AksiI18n){AksiI18n.setLang(AksiI18n.lang());}
  document.querySelectorAll('[data-lang]').forEach(function(b){
    b.classList.toggle('on',b.getAttribute('data-lang')===(localStorage.getItem('AKSI_LANG')||'ru'));
    b.onclick=function(){
      document.querySelectorAll('[data-lang]').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
      if(window.AksiI18n)AksiI18n.setLang(b.getAttribute('data-lang'));
    };
  });

  var orb=document.getElementById('orb');
  var status=document.getElementById('status');
  var answer=document.getElementById('answer');
  var thoughts=document.getElementById('thoughts');
  var sig=document.getElementById('sig');
  var input=document.getElementById('input');
  var sendBtn=document.getElementById('send');
  var micBtn=document.getElementById('mic');
  var busy=false,n=0;

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}

  async function resonate(text){
    if(!text||busy)return;
    busy=true;n++;sendBtn.disabled=true;
    answer.classList.remove('show');answer.innerHTML='';thoughts.innerHTML='';sig.textContent='';
    orb.classList.add('pulse');
    status.textContent='…';

    if(window.AksiCodex){
      var gate=AksiCodex.check(text);
      if(!gate.ok){
        status.textContent='Кодекс';
        answer.innerHTML=esc(gate.message);
        answer.classList.add('show');
        orb.classList.remove('pulse');
        busy=false;sendBtn.disabled=false;
        return;
      }
    }

    var replyText='';
    try{
      if(window.AKSIBrain&&AKSIBrain.fullReply){
        var r=await AKSIBrain.fullReply(text,n);
        replyText=r.text||'';
        if(r.signature)sig.textContent=r.signature;
      }else{
        replyText='Обновите страницу.';
      }
    }catch(e){
      replyText='Не удалось ответить. Попробуйте ещё раз.';
    }

    status.textContent='АКСИ';
    answer.innerHTML=esc(replyText).replace(/\n/g,'<br>');
    answer.classList.add('show');
    orb.classList.remove('pulse');
    busy=false;sendBtn.disabled=false;

    try{
      if(speechSynthesis&&replyText){
        var u=new SpeechSynthesisUtterance(replyText.slice(0,400));
        u.lang=(localStorage.getItem('AKSI_LANG')==='en')?'en-US':'ru-RU';
        speechSynthesis.cancel();speechSynthesis.speak(u);
      }
    }catch(e){}
  }

  function go(){
    var v=(input.value||'').trim();
    if(!v)return;
    input.value='';
    resonate(v);
  }
  sendBtn.onclick=go;
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go();}
  });

  var rec=null,listening=false;
  if(window.SpeechRecognition||window.webkitSpeechRecognition){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    rec=new SR();rec.lang='ru-RU';rec.interimResults=false;
    rec.onresult=function(ev){
      var tx=ev.results[0][0].transcript;
      listening=false;micBtn.classList.remove('on');
      resonate(tx);
    };
    rec.onerror=rec.onend=function(){listening=false;micBtn.classList.remove('on');};
  }else micBtn.style.display='none';

  micBtn.onclick=function(){
    if(!rec)return;
    if(listening){rec.stop();return;}
    listening=true;micBtn.classList.add('on');
    status.textContent='Говорите…';
    try{rec.start();}catch(e){}
  };
})();
</script>
</body>
</html>
