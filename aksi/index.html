<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Чат АКСИ</title>
<meta name="theme-color" content="#5b21b6">
<style>
* { box-sizing: border-box; margin: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #f5f5f5;
  color: #111;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 640px;
  margin: 0 auto;
}
header {
  background: #5b21b6;
  color: #fff;
  padding: 14px 16px;
  padding-top: max(14px, env(safe-area-inset-top));
  display: flex;
  align-items: center;
  gap: 12px;
}
header a {
  color: #fff;
  font-size: 1.1rem;
  font-weight: 700;
  text-decoration: none;
  padding: 8px 4px;
}
header strong { font-size: 1.2rem; }
#thread {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  -webkit-overflow-scrolling: touch;
}
.msg {
  margin-bottom: 14px;
  padding: 14px 16px;
  border-radius: 14px;
  font-size: 1.15rem;
  line-height: 1.45;
  max-width: 95%;
  word-break: break-word;
}
.msg.me {
  background: #5b21b6;
  color: #fff;
  margin-left: auto;
}
.msg.bot {
  background: #fff;
  border: 2px solid #ddd;
  color: #111;
}
.msg .src {
  display: block;
  margin-top: 8px;
  font-size: 0.85rem;
  opacity: 0.75;
  font-weight: 700;
}
.hint {
  text-align: center;
  color: #555;
  font-size: 1.1rem;
  padding: 24px 12px;
  line-height: 1.4;
}
.quick {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 16px;
}
.quick button {
  width: 100%;
  padding: 16px;
  font-size: 1.1rem;
  font-weight: 700;
  border: 2px solid #5b21b6;
  background: #fff;
  color: #5b21b6;
  border-radius: 12px;
}
footer {
  border-top: 2px solid #ddd;
  background: #fff;
  padding: 12px 12px max(12px, env(safe-area-inset-bottom));
}
.row { display: flex; gap: 10px; }
#text {
  flex: 1;
  font-size: 16px;
  padding: 14px;
  border: 2px solid #ccc;
  border-radius: 12px;
  font-family: inherit;
}
#send {
  width: 64px;
  border: none;
  border-radius: 12px;
  background: #5b21b6;
  color: #fff;
  font-size: 1.4rem;
  font-weight: 800;
}
</style>
</head>
<body>
<header>
  <a href="/">← Меню</a>
  <strong>ЧАТ АКСИ</strong>
</header>
<div id="thread">
  <div class="hint" id="hint">
    Напишите вопрос внизу<br>или нажмите кнопку:
    <div class="quick">
      <button type="button" id="q1">Ты здесь?</button>
      <button type="button" id="q2">Что умеешь?</button>
      <button type="button" id="q3">Как открыть навигатор?</button>
    </div>
  </div>
</div>
<footer>
  <div class="row">
    <input id="text" type="text" placeholder="Пишите здесь…" autocomplete="off">
    <button type="button" id="send">OK</button>
  </div>
</footer>
<script src="/aksi-knowledge.js"></script>
<script src="/aksi-core.js"></script>
<script>
(function () {
  var thread = document.getElementById("thread");
  var hint = document.getElementById("hint");
  var input = document.getElementById("text");

  function esc(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function add(me, text, src) {
    if (hint) hint.style.display = "none";
    var d = document.createElement("div");
    d.className = "msg " + (me ? "me" : "bot");
    d.innerHTML = esc(text).replace(/\n/g, "<br>") + (src ? "<span class=\"src\">" + esc(src) + "</span>" : "");
    thread.appendChild(d);
    thread.scrollTop = thread.scrollHeight;
  }
  async function ask(t) {
    t = (t || input.value || "").trim();
    if (!t) return;
    input.value = "";
    add(true, t);
    try {
      var r = await AksiCore.reply(t);
      add(false, r.text || "…", r.source);
    } catch (e) {
      add(false, "Ошибка. Проверьте интернет или попробуйте ещё раз.");
    }
  }
  document.getElementById("send").onclick = function () { ask(); };
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); ask(); }
  });
  document.getElementById("q1").onclick = function () { ask("ты здесь?"); };
  document.getElementById("q2").onclick = function () { ask("что умеешь"); };
  document.getElementById("q3").onclick = function () { ask("навигатор"); };
})();
</script>
</body>
</html>
