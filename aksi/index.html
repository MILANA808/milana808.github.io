<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>АКСИ</title>
<meta name="theme-color" content="#05010f"/>
<meta http-equiv="Cache-Control" content="no-cache"/>
<link rel="icon" href="/icon.svg" type="image/svg+xml"/>
<style>
:root{--bg:#05010f;--ink:#f3e8ff;--muted:#9d8ec4;--line:rgba(168,85,247,.22);--cyan:#22d3ee;--violet:#a855f7;--card:rgba(20,10,40,.75)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}
body{max-width:720px;margin:0 auto;min-height:100dvh;position:relative;overflow:hidden;background:radial-gradient(ellipse 90% 55% at 50% -15%,rgba(168,85,247,.3),transparent 55%),radial-gradient(ellipse 40% 35% at 100% 100%,rgba(34,211,238,.07),transparent),var(--bg)}
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}
.shell{position:relative;z-index:1;display:flex;flex-direction:column;height:100dvh;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px}
header a{color:var(--muted);text-decoration:none;font-size:13px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.2em;font-size:12px}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);display:block;animation:pulse 2s ease infinite}
@keyframes pulse{50%{opacity:.4}}
.meta{font-size:11px;color:var(--muted)}
#thread{flex:1;overflow-y:auto;padding:8px 0 16px;min-height:0;display:flex;flex-direction:column;gap:14px}
.bubble{max-width:min(92%,520px);padding:14px 16px;border-radius:18px;font-size:15px;line-height:1.55;word-break:break-word;animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bubble.user{align-self:flex-end;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border-bottom-right-radius:6px;box-shadow:0 8px 28px rgba(79,70,229,.35)}
.bubble.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);border-bottom-left-radius:6px}
.bubble .time{font-size:10px;opacity:.5;margin-top:8px}
.empty{margin:auto;text-align:center;padding:28px 12px;max-width:340px}
.empty .orb{width:96px;height:96px;border-radius:50%;margin:0 auto 18px;background:radial-gradient(circle at 30% 25%,#f5f3ff,#c084fc 35%,#4c1d95 70%,#05010f);box-shadow:0 0 0 1px rgba(168,85,247,.35),0 0 50px rgba(168,85,247,.35);display:grid;place-items:center;font-size:2rem;color:#fff;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.empty p{color:var(--muted);font-size:14px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chips button{border:1px solid var(--line);background:rgba(168,85,247,.1);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:12px;cursor:pointer}
footer{flex-shrink:0;padding:6px 0 16px}
.dock{display:flex;gap:10px;align-items:flex-end;padding:12px;border-radius:22px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px)}
.dock textarea{flex:1;resize:none;min-height:46px;max-height:120px;border:none;background:transparent;color:var(--ink);padding:10px 8px;font:inherit;font-size:16px;outline:none}
.dock button.send{width:48px;height:48px;border-radius:16px;border:none;cursor:pointer;background:linear-gradient(145deg,#a855f7,#6366f1);color:#fff;font-size:1.2rem;box-shadow:0 6px 20px rgba(168,85,247,.4)}
.dock button.send:disabled{opacity:.4}
.dock button.mic{width:48px;height:48px;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:1.1rem}
.dock button.mic.on{border-color:var(--cyan);color:var(--cyan)}
.toolbar{display:flex;justify-content:flex-end;padding:2px 0 6px}
.toolbar button{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer}
.typing{align-self:flex-start;padding:12px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:13px}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="shell">
<header>
  <a href="/">← домой</a>
  <div class="brand"><i></i>АКСИ</div>
  <span class="meta" id="mem-count"></span>
</header>
<div class="toolbar"><button type="button" id="btn-clear">очистить</button></div>
<div id="thread">
  <div class="empty" id="empty">
    <div class="orb">Ψ</div>
    <p>Суверенный интеллект.<br>Пишите — отвечу.</p>
    <div class="chips">
      <button type="button" data-q="кто ты">кто ты</button>
      <button type="button" data-q="почему небо голубое">почему небо голубое</button>
      <button type="button" data-q="что такое квантовый компьютер">квантовый компьютер</button>
      <button type="button" data-q="биткоин">биткоин</button>
    </div>
  </div>
</div>
<footer>
  <div class="dock">
    <button type="button" class="mic" id="mic">🎙</button>
    <textarea id="input" rows="1" placeholder="Спросите АКСИ…" enterkeyhint="send"></textarea>
    <button type="button" class="send" id="send">↑</button>
  </div>
</footer>
</div>
<script src="/aksi-memory.js?v=9"></script>
<script src="/aksi-brain.js?v=9"></script>
<script>
(function(){
"use strict";
try{if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});}catch(e){}

(function(){
  var c=document.getElementById("bg-canvas");if(!c)return;
  var x=c.getContext("2d"),W,H,pts=[];
  function rz(){W=c.width=innerWidth;H=c.height=innerHeight;pts=[];for(var i=0;i<24;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15});}
  addEventListener("resize",rz);rz();
  (function loop(){x.clearRect(0,0,W,H);for(var i=0;i<pts.length;i++){var p=pts[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;x.beginPath();x.arc(p.x,p.y,1.3,0,6.3);x.fillStyle="rgba(192,132,252,.4)";x.fill();}requestAnimationFrame(loop);})();
})();

var thread=document.getElementById("thread");
var empty=document.getElementById("empty");
var input=document.getElementById("input");
var sendBtn=document.getElementById("send");
var micBtn=document.getElementById("mic");
var memEl=document.getElementById("mem-count");
var busy=false;

function esc(s){
  return String(s).replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">");
}
function fmt(ts){
  try{return new Date(ts).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit";});}catch(e){return"";}
}
function hideEmpty(){if(empty)empty.style.display="none";}
function addBubble(role,text,ts){
  hideEmpty();
  var d=document.createElement("div");
  d.className="bubble "+(role==="user"?"user":"bot");
  d.innerHTML=esc(text).replace(/\n/g,"<br>")+(ts?"<div class=\"time\">"+fmt(ts)+"</div>":"");
  thread.appendChild(d);
  thread.scrollTop=thread.scrollHeight;
}
function withTimeout(p,ms){
  return new Promise(function(resolve){
    var done=false;
    var t=setTimeout(function(){if(!done){done=true;resolve(null);}},ms);
    Promise.resolve(p).then(function(v){if(!done){done=true;clearTimeout(t);resolve(v);}})
      .catch(function(){if(!done){done=true;clearTimeout(t);resolve(null);}});
  });
}
function instant(text){
  var t=String(text||"");
  var low=t.toLowerCase();
  if(/небо/i.test(t)&&/голуб|син/i.test(t))
    return"Небо кажется голубым из‑за рассеяния Рэлея: молекулы воздуха сильнее рассеивают синюю часть солнечного спектра. Днём — голубой купол, на закате — красные тона.";
  if(/привет|здравств|hello|hi\b/.test(low))
    return"Здравствуйте. Я АКСИ — на связи.";
  if(/кто ты|что ты|что такое акси/.test(low))
    return"Я АКСИ — суверенный ИИ-агент. Отвечаю по существу, ищу факты в Wikipedia, храню память в браузере.";
  if(/как дела/.test(low))return"В рабочем режиме. Чем помочь?";
  if(/спасибо|благодар/.test(low))return"Пожалуйста.";
  return null;
}
async function wiki(text){
  try{
    var q=String(text||"").replace(/[?!]+/g," ").replace(/^(что такое|почему|расскажи про|who is|what is)\s+/i,"").trim();
    if(/небо/i.test(text)&&/голуб/i.test(text))q="Рассеяние Рэлея";
    if(!q)return null;
    var s=await withTimeout(fetch("https://ru.wikipedia.org/w/api.php?action=opensearch&search="+encodeURIComponent(q)+"&limit=1&namespace=0&format=json&origin=*").then(function(r){return r.json();}),5000);
    var title=s&&s[1]&&s[1][0];
    if(!title)return null;
    var j=await withTimeout(fetch("https://ru.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title)).then(function(r){return r.json();}),5000);
    if(!j||!j.extract)return null;
    return j.title+".\n\n"+String(j.extract).slice(0,900)+"\n\nИсточник: Wikipedia";
  }catch(e){return null;}
}
async function crypto(){
  try{
    var d=await withTimeout(fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd,rub").then(function(r){return r.json();}),5000);
    if(!d)return null;
    var lines=[];
    if(d.bitcoin)lines.push("BTC: $"+d.bitcoin.usd+" / ₽"+d.bitcoin.rub);
    if(d.ethereum)lines.push("ETH: $"+d.ethereum.usd+" / ₽"+d.ethereum.rub);
    return lines.length?lines.join("\n"):null;
  }catch(e){return null;}
}
async function getReply(text){
  var a=instant(text);
  if(a)return a;
  if(window.AKSIBrain&&typeof AKSIBrain.fullReply==="function"){
    var r=await withTimeout(AKSIBrain.fullReply(text,0,{}),8000);
    if(r&&r.text)return r.text;
  }
  if(/биткоин|bitcoin|курс|крипт|\bbtc\b/i.test(text)){
    var c=await crypto();
    if(c)return c;
  }
  var w=await wiki(text);
  if(w)return w;
  return"Пока нет точного ответа на «"+String(text).slice(0,80)+"». Спросите короче: «фотосинтез», «Эйнштейн», «биткоин».";
}
async function respond(text){
  text=String(text||"").trim();
  if(!text||busy)return;
  busy=true;sendBtn.disabled=true;
  try{
    addBubble("user",text,Date.now());
    if(window.AksiMemory){try{await withTimeout(AksiMemory.remember("user",text),1500);}catch(e){}}
    var tip=document.createElement("div");
    tip.className="typing";tip.id="typing";tip.textContent="АКСИ…";
    thread.appendChild(tip);thread.scrollTop=thread.scrollHeight;
    var reply=await getReply(text);
    if(!reply)reply="На связи. Уточните вопрос.";
    var t=document.getElementById("typing");if(t)t.remove();
    addBubble("bot",reply,Date.now());
    if(window.AksiMemory){try{await withTimeout(AksiMemory.remember("assistant",reply),1500);}catch(e){}}
    if(window.AksiMemory){try{var c=await withTimeout(AksiMemory.count(),1000);if(c!=null)memEl.textContent=c+" в памяти";}catch(e){}}
  }catch(err){
    var t2=document.getElementById("typing");if(t2)t2.remove();
    addBubble("bot",instant(text)||"Сбой ответа. Попробуйте ещё раз.",Date.now());
  }
  busy=false;sendBtn.disabled=false;input.focus();
}
function go(){var v=(input.value||"").trim();if(!v)return;input.value="";respond(v);}
sendBtn.onclick=go;
input.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();go();}});
document.querySelectorAll("[data-q]").forEach(function(b){b.onclick=function(){respond(b.getAttribute("data-q"));};});
document.getElementById("btn-clear").onclick=async function(){
  if(!confirm("Очистить?"))return;
  if(window.AksiMemory){try{await withTimeout(AksiMemory.clear(),1500);}catch(e){}}
  thread.innerHTML="";empty.style.display="";thread.appendChild(empty);memEl.textContent="";
};
var rec=null,listening=false;
if(window.SpeechRecognition||window.webkitSpeechRecognition){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  rec=new SR();rec.lang="ru-RU";rec.interimResults=false;
  rec.onresult=function(ev){listening=false;micBtn.classList.remove("on");respond(ev.results[0][0].transcript);};
  rec.onerror=rec.onend=function(){listening=false;micBtn.classList.remove("on");};
}else{micBtn.style.display="none";}
micBtn.onclick=function(){if(!rec)return;if(listening){rec.stop();return;}listening=true;micBtn.classList.add("on");try{rec.start();}catch(e){};};
(async function(){
  if(!window.AksiMemory)return;
  try{
    var rows=await withTimeout(AksiMemory.history(100),2500);
    if(rows&&rows.length){rows.forEach(function(r){addBubble(r.role==="user"?"user":"bot",r.content,r.ts);});}
    var c=await withTimeout(AksiMemory.count(),1000);if(c!=null)memEl.textContent=c+" в памяти";
  }catch(e){}
})();
})();
</script>
</body>
</html>
