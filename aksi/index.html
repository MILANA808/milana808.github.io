<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>АКСИ · Присутствие</title>
<meta name="description" content="Новый способ: не чат-лента, а подписанные волны присутствия личного ИИ"/>
<meta name="theme-color" content="#07040f"/>
<style>
*{box-sizing:border-box;margin:0}
:root{
  --bg:#07040f;--fg:#f4f0ff;--mut:#9b92b8;--line:rgba(180,150,255,.2);
  --a:#c4b5fd;--b:#67e8f9;--c:#f9a8d4;
}
html,body{height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--fg)}
body{display:flex;flex-direction:column;min-height:100dvh;overflow:hidden}
#fx{position:fixed;inset:0;z-index:0}
.top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-size:13px}
.top a{color:var(--mut);text-decoration:none}
.top a:hover{color:var(--b)}
.brand{font-weight:700;letter-spacing:.14em;font-size:13px;
  background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stage{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 16px 8px;min-height:0}
.orb-wrap{position:relative;width:min(200px,42vw);height:min(200px,42vw);margin-bottom:18px}
.orb{
  width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff8,transparent 45%),
    conic-gradient(from 0deg,var(--a),var(--b),var(--c),var(--a));
  animation:spin 18s linear infinite, breathe 4s ease-in-out infinite;
  filter:blur(.2px);box-shadow:0 0 60px rgba(124,58,237,.35)
}
.orb.listening{animation-duration:10s,1.6s;box-shadow:0 0 80px rgba(103,232,249,.45)}
.orb.thinking{animation-duration:6s,1.1s;box-shadow:0 0 90px rgba(249,168,212,.4)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.04)}}
.orb-core{
  position:absolute;inset:18%;border-radius:50%;background:rgba(7,4,15,.88);
  display:flex;align-items:center;justify-content:center;font-size:clamp(1.6rem,5vw,2.2rem);font-weight:600;
  color:var(--b);letter-spacing:.06em
}
hint{display:block;text-align:center;color:var(--mut);font-size:14px;max-width:320px;line-height:1.45;margin-bottom:8px}
.waves{position:relative;z-index:2;flex:1;overflow-y:auto;padding:0 16px 12px;max-width:560px;width:100%;margin:0 auto;min-height:0}
.wave{
  background:rgba(20,12,40,.75);border:1px solid var(--line);border-radius:18px;
  padding:14px 16px;margin-bottom:10px;backdrop-filter:blur(12px);
  animation:up .35s ease
}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.wave.you{border-color:rgba(103,232,249,.25);background:rgba(15,30,45,.55)}
.wave .who{font-size:11px;color:var(--mut);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}
.wave .body{font-size:15px;line-height:1.5;white-space:pre-wrap}
.wave .sig{margin-top:10px;font-size:10px;font-family:ui-monospace,monospace;color:var(--a);opacity:.85;word-break:break-all}
.wave details{margin-top:8px;font-size:12px;color:var(--mut)}
.wave summary{cursor:pointer;color:var(--b)}
.dock{
  position:relative;z-index:3;padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(7,4,15,.98),rgba(7,4,15,.85));
  border-top:1px solid var(--line)
}
.box{
  max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:flex-end
}
textarea{
  flex:1;resize:none;min-height:48px;max-height:120px;padding:14px 16px;border-radius:16px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--fg);
  font:inherit;font-size:16px;outline:none;line-height:1.4
}
textarea:focus{border-color:rgba(103,232,249,.45)}
button.send{
  width:52px;height:52px;border-radius:16px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#7c3aed,#0891b2);color:#fff;font-size:20px;font-weight:700
}
button.send:disabled{opacity:.4}
.modes{display:flex;gap:8px;max-width:560px;margin:0 auto 8px;flex-wrap:wrap}
.modes button{
  border:1px solid var(--line);background:transparent;color:var(--mut);
  border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer
}
.modes button.on{color:var(--bg);background:var(--b);border-color:var(--b)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(30,20,50,.95);
  border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;z-index:20;
  opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<header class="top">
  <span class="brand">АКСИ</span>
  <nav>
    <a href="../start/">Старт</a>
    &nbsp;·&nbsp;
    <a href="../">MATRIX</a>
  </nav>
</header>

<div class="stage">
  <div class="orb-wrap">
    <div class="orb" id="orb"></div>
    <div class="orb-core">Ψ</div>
  </div>
  <hint id="hint">Не лента чата.<br/>Ты посылаешь импульс — АКСИ отвечает <b style="color:var(--fg)">волной</b> с подписью.</hint>
</div>

<div class="waves" id="waves" aria-live="polite"></div>

<div class="dock">
  <div class="modes">
    <button type="button" class="on" data-m="simple">Просто</button>
    <button type="button" data-m="think">С мыслями</button>
    <button type="button" data-m="fact">Факт (Wiki)</button>
  </div>
  <div class="box">
    <textarea id="in" rows="1" placeholder="Напиши АКСИ…" enterkeyhint="send"></textarea>
    <button class="send" id="go" type="button" title="Отправить">↑</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="../aksi-brain.js"></script>
<script>
(function(){
  var mode='simple', busy=false;
  var orb=document.getElementById('orb');
  var waves=document.getElementById('waves');
  var input=document.getElementById('in');
  var SEED='Alfiya_AKSI_1995_02_14';

  document.querySelectorAll('.modes button').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('.modes button').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on'); mode=b.getAttribute('data-m');
    };
  });

  function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},1800)}
  function sha16(s){
    if(!crypto.subtle) return Promise.resolve('LOCAL');
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(x){return x.toString(16).padStart(2,'0')}).join('').slice(0,16).toUpperCase();
    });
  }
  function addWave(who, body, sig, extra){
    var d=document.createElement('div');
    d.className='wave'+(who==='you'?' you':'');
    var html='<div class="who">'+(who==='you'?'Ты':'АКСИ · присутствие')+'</div>';
    html+='<div class="body"></div>';
    d.innerHTML=html;
    d.querySelector('.body').textContent=body;
    if(sig){
      var s=document.createElement('div');s.className='sig';s.textContent='🔏 '+sig;d.appendChild(s);
    }
    if(extra){
      var det=document.createElement('details');
      det.innerHTML='<summary>ход мысли</summary><div style="margin-top:6px;white-space:pre-wrap"></div>';
      det.querySelector('div').textContent=extra;
      d.appendChild(det);
    }
    waves.prepend(d);
  }

  function setState(s){
    orb.classList.remove('listening','thinking');
    if(s) orb.classList.add(s);
  }

  async function reply(text){
    if(busy) return;
    text=(text||'').trim();
    if(!text) return;
    busy=true; document.getElementById('go').disabled=true;
    setState('listening');
    var usig=await sha16(text+'|'+SEED+'|you');
    addWave('you', text, usig);
    input.value='';
    setState('thinking');
    document.getElementById('hint').textContent='АКСИ собирает волну…';

    var answer='', thoughts='';
    try{
      if(window.AKSIBrain && AKSIBrain.fullReply){
        var r=await AKSIBrain.fullReply(text, waves.children.length);
        answer=r.text||'';
        if(mode==='think' && r.steps){
          thoughts=r.steps.map(function(s){return s.phase+': '+s.detail+' · '+s.sig}).join('\n');
        }
        if(mode==='simple'){
          // strip long wiki if too long for presence mode
          if(answer.length>600) answer=answer.slice(0,580)+'…';
        }
        if(mode==='fact' && AKSIBrain.searchWiki){
          var w=await AKSIBrain.searchWiki(text);
          if(w && w.text) answer=(w.title?w.title+'. ':'')+w.text+(w.url?'\n\n'+w.url:'');
        }
      } else {
        answer='Я АКСИ. Связь с модулем мысли временно без скрипта — обнови страницу.';
      }
    }catch(e){
      answer='Сейчас только локальное присутствие. Попробуй ещё раз короткой фразой.';
    }

    var asig=await sha16(answer+'|'+SEED+'|aksi');
    addWave('aksi', answer, asig, mode==='think'?thoughts:null);
    setState('');
    document.getElementById('hint').textContent='Импульс принят. Можно следующий.';
    busy=false; document.getElementById('go').disabled=false;
    input.focus();
  }

  document.getElementById('go').onclick=function(){reply(input.value)};
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter' && !e.shiftKey){e.preventDefault();reply(input.value)}
  });
  input.addEventListener('focus',function(){setState('listening')});
  input.addEventListener('blur',function(){if(!busy)setState('')});

  // soft hello
  sha16('hello|'+SEED).then(function(s){
    addWave('aksi','Привет. Я АКСИ — твоё личное присутствие в ИИ.\nНе чат-бот корпорации: каждая волна с подписью.',s);
  });

  // background
  var c=document.getElementById('fx'),x=c.getContext('2d'),W,H,p=[];
  function rz(){W=c.width=innerWidth;H=c.height=innerHeight;p=[];for(var i=0;i<30;i++)p.push({x:Math.random()*W,y:Math.random()*H,v:(Math.random()-.5)*.3,w:(Math.random()-.5)*.3})}
  addEventListener('resize',rz);rz();
  (function loop(){
    x.clearRect(0,0,W,H);
    var g=x.createRadialGradient(W/2,H*.35,0,W/2,H*.4,H*.55);
    g.addColorStop(0,'rgba(88,40,160,.2)');g.addColorStop(1,'transparent');
    x.fillStyle=g;x.fillRect(0,0,W,H);
    p.forEach(function(q){q.x+=q.v;q.y+=q.w;if(q.x<0||q.x>W)q.v*=-1;if(q.y<0||q.y>H)q.w*=-1;
      x.fillStyle='rgba(196,181,253,.35)';x.beginPath();x.arc(q.x,q.y,1.2,0,6.3);x.fill()});
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
