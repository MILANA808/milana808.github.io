<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>АКСИ</title>
<meta name="theme-color" content="#05010f"/>
<link rel="icon" href="/icon.svg" type="image/svg+xml"/>
<style>
:root{
  --bg:#05010f;
  --bg2:#0c0520;
  --ink:#f3e8ff;
  --muted:#9d8ec4;
  --line:rgba(168,85,247,.2);
  --glow:rgba(168,85,247,.45);
  --cyan:#22d3ee;
  --violet:#a855f7;
  --card:rgba(20,10,40,.72);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}
body{
  display:flex;flex-direction:column;max-width:720px;margin:0 auto;
  min-height:100dvh;position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse 90% 60% at 50% -20%,rgba(168,85,247,.28),transparent 55%),
    radial-gradient(ellipse 50% 40% at 100% 100%,rgba(34,211,238,.08),transparent),
    var(--bg);
}
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
.shell{position:relative;z-index:1;display:flex;flex-direction:column;height:100dvh;padding:0 16px}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 0 8px;flex-shrink:0
}
header a{color:var(--muted);text-decoration:none;font-size:13px}
.brand{
  display:flex;align-items:center;gap:10px;font-weight:600;
  letter-spacing:.22em;font-size:12px
}
.brand i{
  width:10px;height:10px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 12px var(--cyan);display:block;animation:pulse 2s ease infinite
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.meta{font-size:11px;color:var(--muted)}
#thread{
  flex:1;overflow-y:auto;padding:8px 0 16px;min-height:0;
  display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth
}
.bubble{
  max-width:min(92%,520px);padding:14px 16px;border-radius:18px;
  font-size:15px;line-height:1.55;word-break:break-word;
  animation:rise .35s ease
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bubble.user{
  align-self:flex-end;
  background:linear-gradient(135deg,#7c3aed 0%,#4f46e5 100%);
  color:#fff;border-bottom-right-radius:6px;
  box-shadow:0 8px 28px rgba(79,70,229,.35)
}
.bubble.bot{
  align-self:flex-start;
  background:var(--card);border:1px solid var(--line);
  backdrop-filter:blur(16px);border-bottom-left-radius:6px;
  box-shadow:0 4px 24px rgba(0,0,0,.25)
}
.bubble .time{font-size:10px;opacity:.5;margin-top:8px;font-variant-numeric:tabular-nums}
.empty{
  margin:auto;text-align:center;padding:32px 16px;max-width:320px
}
.empty .orb{
  width:96px;height:96px;border-radius:50%;margin:0 auto 20px;
  background:radial-gradient(circle at 30% 25%,#f5f3ff,#c084fc 35%,#4c1d95 70%,#05010f);
  box-shadow:0 0 0 1px rgba(168,85,247,.35),0 0 60px rgba(168,85,247,.35);
  display:grid;place-items:center;font-size:2rem;color:#fff;
  animation:float 4s ease-in-out infinite
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.empty p{color:var(--muted);font-size:14px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.chips button{
  border:1px solid var(--line);background:rgba(168,85,247,.08);color:var(--ink);
  border-radius:999px;padding:8px 14px;font-size:12px;cursor:pointer
}
.chips button:hover{border-color:var(--violet);background:rgba(168,85,247,.18)}
footer{flex-shrink:0;padding:6px 0 16px}
.dock{
  display:flex;gap:10px;align-items:flex-end;padding:12px;
  border-radius:22px;background:var(--card);border:1px solid var(--line);
  backdrop-filter:blur(20px);box-shadow:0 12px 40px rgba(0,0,0,.35)
}
.dock textarea{
  flex:1;resize:none;min-height:46px;max-height:120px;border:none;background:transparent;
  color:var(--ink);padding:10px 8px;font:inherit;font-size:16px;outline:none;line-height:1.4
}
.dock button.send{
  width:48px;height:48px;border-radius:16px;border:none;cursor:pointer;
  background:linear-gradient(145deg,#a855f7,#6366f1);color:#fff;font-size:1.2rem;
  box-shadow:0 6px 20px rgba(168,85,247,.4)
}
.dock button.send:disabled{opacity:.4}
.dock button.mic{
  width:48px;height:48px;border-radius:16px;border:1px solid var(--line);
  background:transparent;color:var(--muted);cursor:pointer;font-size:1.1rem
}
.dock button.mic.on{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 16px rgba(34,211,238,.3)}
.toolbar{display:flex;justify-content:flex-end;gap:12px;padding:2px 0 6px}
.toolbar button{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer}
.toolbar button:hover{color:var(--ink)}
.typing{
  align-self:flex-start;padding:12px 16px;border-radius:16px;
  background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:13px
}
.typing span{animation:blink 1.2s infinite;opacity:0}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="shell">
<header>
  <a href="/">← домой</a>
  <div class="brand"><i></i>АКСИ</div>
  <span class="meta" id="mem-count"></span>
</header>
<div class="toolbar">
  <button type="button" id="btn-clear">очистить память</button>
</div>
<div id="thread">
  <div class="empty" id="empty">
    <div class="orb">Ψ</div>
    <p>Суверенный интеллект.<br>Пишите — отвечу. Память хранится у вас.</p>
    <div class="chips">
      <button type="button" data-q="кто ты">кто ты</button>
      <button type="button" data-q="что такое квантовый компьютер">квантовый компьютер</button>
      <button type="button" data-q="биткоин">биткоин</button>
      <button type="button" data-q="погода Москва">погода</button>
    </div>
  </div>
</div>
<footer>
  <div class="dock">
    <button type="button" class="mic" id="mic" aria-label="микрофон">🎙</button>
    <textarea id="input" rows="1" placeholder="Спросите АКСИ…" enterkeyhint="send"></textarea>
    <button type="button" class="send" id="send" aria-label="отправить">↑</button>
  </div>
</footer>
</div>

<script src="/aksi-memory.js"></script>
<script src="/codex.js"></script>
<script src="/aksi-brain.js"></script>
<script>
(function(){
"use strict";

/* background particles */
(function(){
  var c=document.getElementById("bg-canvas");if(!c)return;
  var x=c.getContext("2d"),W,H,pts=[];
  function rz(){W=c.width=innerWidth;H=c.height=innerHeight;pts=[];for(var i=0;i<28;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15});}
  addEventListener("resize",rz);rz();
  (function loop(){
    x.clearRect(0,0,W,H);
    pts.forEach(function(p,i){
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      x.beginPath();x.arc(p.x,p.y,1.4,0,6.3);x.fillStyle="rgba(192,132,252,.45)";x.fill();
      for(var j=i+1;j<pts.length;j++){
        var q=pts[j],d=Math.hypot(p.x-q.x,p.y-q.y);
        if(d<100){x.strokeStyle="rgba(34,211,238,"+(1-d/100)*.12+")";x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke();}
      }
    });
    requestAnimationFrame(loop);
  })();
})();

var thread=document.getElementById("thread");
var empty=document.getElementById("empty");
var input=document.getElementById("input");
var sendBtn=document.getElementById("send");
var micBtn=document.getElementById("mic");
var memEl=document.getElementById("mem-count");
var busy=false,n=0;

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmt(ts){try{return new Date(ts).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}catch(e){return"";}}
function hideEmpty(){if(empty)empty.style.display="none";}
function addBubble(role,text,ts){
  hideEmpty();
  var d=document.createElement("div");
  d.className="bubble "+(role==="user"?"user":"bot");
  d.innerHTML=esc(text).replace(/\n/g,"<br>")+(ts?'<div class="time">'+fmt(ts)+"</div>":"");
  thread.appendChild(d);
  thread.scrollTop=thread.scrollHeight;
}
function withTimeout(p,ms){
  return new Promise(function(resolve){
    var done=false;
    var t=setTimeout(function(){if(!done){done=true;resolve(null);}},ms);
    Promise.resolve(p).then(function(v){if(!done){done=true;clearTimeout(t);resolve(v);}})\
      .catch(function(){if(!done){done=true;clearTimeout(t);resolve(null);}});
  });
}
/* FIX: remove accidental backslash - rewrite cleanly below */
})();
</script>
</body>
</html>
