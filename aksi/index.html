<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>АКСИ</title>
<meta name="theme-color" content="#f3effc"/>
<link rel="icon" href="/icon.svg" type="image/svg+xml"/>
<style>
:root{--bg:#f3effc;--card:#fff;--ink:#160f2a;--muted:#6b6285;--line:#e5ddf5;--violet:#7c3aed;--ok:#059669}
*{box-sizing:border-box;margin:0}
html,body{height:100%;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
body{max-width:640px;margin:0 auto;display:flex;flex-direction:column;min-height:100dvh}
header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(243,239,252,.95);z-index:2}
header a{color:var(--violet);font-weight:600;text-decoration:none}
.brand{font-weight:700;display:flex;gap:8px;align-items:center}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
#thread{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.b{max-width:90%;padding:12px 14px;border-radius:16px;font-size:16px;line-height:1.45}
.b.u{align-self:flex-end;background:var(--violet);color:#fff}
.b.a{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.b .s{display:block;margin-top:6px;font-size:11px;opacity:.75;font-weight:600}
.empty{margin:auto;text-align:center;color:var(--muted);padding:24px;font-size:15px}
footer{padding:8px 16px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.dock{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px}
textarea{flex:1;border:none;resize:none;min-height:44px;font:inherit;font-size:16px;outline:none;padding:8px}
button.send{width:48px;height:48px;border:none;border-radius:12px;background:var(--violet);color:#fff;font-size:1.1rem;font-weight:700}
.help{text-align:center;font-size:12px;margin-bottom:6px}
.help a{color:var(--violet);font-weight:600;text-decoration:none;margin:0 6px}
</style>
</head>
<body>
<header>
  <a href="/">←</a>
  <div class="brand"><i></i>АКСИ</div>
  <span style="font-size:12px;color:var(--muted)">ядро</span>
</header>
<div id="thread"><div class="empty" id="empty">Спросите что угодно.<br>Сначала ваша сеть.</div></div>
<footer>
  <div class="help"><a href="/drive/">Путь</a><a href="/net/">Сеть</a><a href="/backup/">Бэкап</a></div>
  <div class="dock">
    <textarea id="in" rows="1" placeholder="Сообщение…" enterkeyhint="send"></textarea>
    <button class="send" id="go" type="button">➤</button>
  </div>
</footer>
<script src="/aksi-knowledge.js"></script>
<script src="/aksi-core.js"></script>
<script src="/nav.js"></script>
<script>
(function(){
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(function(){});
var th=document.getElementById("thread"),empty=document.getElementById("empty");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function add(role,text,src){
  if(empty)empty.style.display="none";
  var d=document.createElement("div");d.className="b "+(role==="u"?"u":"a");
  d.innerHTML=esc(text).replace(/\n/g,"<br>")+(src?"<span class=\"s\">"+esc(src)+"</span>":"");
  th.appendChild(d);th.scrollTop=th.scrollHeight;
}
async function send(){
  var v=(document.getElementById("in").value||"").trim();if(!v)return;
  document.getElementById("in").value="";add("u",v);
  var r=await AksiCore.reply(v);add("a",r.text,r.source);
}
document.getElementById("go").onclick=send;
document.getElementById("in").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
})();
</script>
</body>
</html>
