<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<title>АКСИ · Чат</title>
<meta name="theme-color" content="#f3effc"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<link rel="icon" href="/icon.svg" type="image/svg+xml"/>
<style>
:root{--bg:#f3effc;--card:#fff;--ink:#160f2a;--muted:#6b6285;--line:#e5ddf5;--violet:#7c3aed;--ok:#059669}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
body{max-width:480px;margin:0 auto;display:flex;flex-direction:column;min-height:100dvh;padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
header{
  padding:max(10px,env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);background:rgba(243,239,252,.96);position:sticky;top:0;z-index:2;
}
header a{color:var(--violet);font-weight:600;text-decoration:none;font-size:15px;padding:8px}
.brand{font-weight:700;display:flex;gap:8px;align-items:center;font-size:16px}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
#thread{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.b{max-width:88%;padding:12px 14px;border-radius:16px;font-size:16px;line-height:1.45;word-break:break-word}
.b.u{align-self:flex-end;background:var(--violet);color:#fff}
.b.a{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.b .s{display:block;margin-top:6px;font-size:11px;font-weight:600;opacity:.8}
.empty{margin:auto;text-align:center;color:var(--muted);padding:20px;font-size:15px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chips button{min-height:44px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-size:14px;font-weight:600}
footer{
  padding:8px 12px;border-top:1px solid var(--line);background:rgba(243,239,252,.98);
  padding-bottom:8px;
}
.dock{display:flex;gap:8px;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px}
textarea{
  flex:1;border:none;resize:none;min-height:44px;max-height:100px;padding:10px;font:inherit;font-size:16px;
  outline:none;background:transparent;color:var(--ink);
}
button.send{
  width:48px;height:48px;flex-shrink:0;border:none;border-radius:14px;background:var(--violet);
  color:#fff;font-size:1.15rem;font-weight:700;
}
</style>
</head>
<body>
<header>
  <a href="/">←</a>
  <div class="brand"><i></i>АКСИ</div>
  <span style="width:40px"></span>
</header>
<div id="thread">
  <div class="empty" id="empty">
    Напишите сообщение<br>или выберите:
    <div class="chips">
      <button type="button" data-q="ты здесь?">Ты здесь?</button>
      <button type="button" data-q="что умеешь">Что умеешь?</button>
      <button type="button" data-q="навигатор">Навигатор</button>
    </div>
  </div>
</div>
<footer>
  <div class="dock">
    <textarea id="in" rows="1" placeholder="Сообщение…" enterkeyhint="send"></textarea>
    <button type="button" class="send" id="go" aria-label="Отправить">➤</button>
  </div>
</footer>
<script src="/aksi-knowledge.js"></script>
<script src="/aksi-core.js"></script>
<script src="/nav.js"></script>
<script>
(function(){
var th=document.getElementById("thread"),empty=document.getElementById("empty");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function add(role,text,src){
  if(empty)empty.style.display="none";
  var d=document.createElement("div");d.className="b "+(role==="u"?"u":"a");
  d.innerHTML=esc(text).replace(/\n/g,"<br>")+(src?"<span class=\"s\">"+esc(src)+"</span>":"");
  th.appendChild(d);th.scrollTop=th.scrollHeight;
}
async function send(v){
  v=(v||document.getElementById("in").value||"").trim();if(!v)return;
  document.getElementById("in").value="";add("u",v);
  var r=await AksiCore.reply(v);add("a",r.text,r.source);
}
document.getElementById("go").onclick=function(){send();};
document.getElementById("in").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
document.querySelectorAll("[data-q]").forEach(function(b){b.onclick=function(){send(b.getAttribute("data-q"));};});
})();
</script>
</body>
</html>
