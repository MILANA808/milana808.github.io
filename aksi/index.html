<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>АКСИ</title>
<meta name="theme-color" content="#03010a"/>
<meta name="description" content="Личный ИИ АКСИ — Resonance Talk"/>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#03010a;color:#f0eaff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#field{position:fixed;inset:0;z-index:0}
.ui{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;padding:env(safe-area-inset-top,12px) 16px env(safe-area-inset-bottom,16px)}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 0 4px;opacity:.85}
.top a{color:#9b8ec4;text-decoration:none;font-size:13px}
.brand{font-weight:700;letter-spacing:.2em;font-size:13px;color:#c4b5fd}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 8px;min-height:0}
.orb{
  width:min(42vw,180px);height:min(42vw,180px);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#e9d5ff 0%,#7c3aed 35%,#1e1b4b 70%,#03010a 100%);
  box-shadow:0 0 60px rgba(124,58,237,.45),0 0 120px rgba(56,189,248,.15);
  position:relative;transition:transform .6s ease,box-shadow .6s ease;
  display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:300;color:#fff
}
.orb.pulse{animation:orbPulse 1.2s ease}
@keyframes orbPulse{0%,100%{transform:scale(1)}40%{transform:scale(1.06)}70%{transform:scale(.98)}}
.orb.listening{box-shadow:0 0 80px rgba(56,189,248,.5),0 0 140px rgba(124,58,237,.35)}
.rings{position:absolute;inset:-20px;border-radius:50%;border:1px solid rgba(196,181,253,.25);pointer-events:none;animation:ring 3s ease-out infinite}
.rings:nth-child(2){inset:-40px;animation-delay:.4s;border-color:rgba(56,189,248,.2)}
@keyframes ring{0%{opacity:.6;transform:scale(.92)}100%{opacity:0;transform:scale(1.15)}}
.status{margin-top:28px;font-size:14px;color:#a78bfa;min-height:1.4em;letter-spacing:.02em}
.answer{
  margin-top:20px;max-width:100%;font-size:clamp(15px,3.8vw,18px);line-height:1.55;
  color:#ede9fe;opacity:0;transform:translateY(8px);transition:.45s ease;
  max-height:32vh;overflow-y:auto;padding:0 4px;text-align:left;width:100%
}
.answer.show{opacity:1;transform:none}
.sig{font-size:11px;color:#6b7280;margin-top:10px;font-family:ui-monospace,monospace;letter-spacing:.04em}
.thoughts{width:100%;margin-top:12px;text-align:left}
.th{
  font-size:12px;color:#9ca3af;padding:6px 10px;margin:4px 0;
  border-left:2px solid #7c3aed;background:rgba(124,58,237,.08);border-radius:0 8px 8px 0;
  opacity:0;animation:in .4s ease forwards
}
@keyframes in{to{opacity:1}}
.dock{
  padding:10px 0 6px;display:flex;gap:8px;align-items:flex-end
}
.dock textarea{
  flex:1;resize:none;min-height:48px;max-height:120px;
  border-radius:16px;border:1px solid rgba(167,139,250,.3);
  background:rgba(15,10,30,.85);color:#f5f3ff;padding:14px 16px;
  font:inherit;font-size:16px;outline:none;backdrop-filter:blur(12px)
}
.dock textarea:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(124,58,237,.2)}
.dock button{
  width:52px;height:52px;border-radius:16px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;font-size:1.2rem;
  flex-shrink:0;display:flex;align-items:center;justify-content:center
}
.dock button:disabled{opacity:.4}
.dock button.mic{background:rgba(30,20,50,.9);border:1px solid rgba(167,139,250,.35)}
.dock button.mic.on{background:#0e7490;border-color:#22d3ee}
.hint{text-align:center;font-size:11px;color:#4b5563;padding-bottom:4px}
</style>
</head>
<body>
<canvas id="field"></canvas>
<div class="ui">
  <div class="top">
    <a href="../">← MATRIX</a>
    <span class="brand">АКСИ</span>
    <a href="../start/">справка</a>
  </div>

  <div class="stage">
    <div class="orb" id="orb">
      <div class="rings"></div>
      <div class="rings"></div>
      <span>Ψ</span>
    </div>
    <div class="status" id="status">Напиши или скажи — я здесь</div>
    <div class="thoughts" id="thoughts"></div>
    <div class="answer" id="answer"></div>
    <div class="sig" id="sig"></div>
  </div>

  <p class="hint">новый способ: не лента чата — резонанс с личным ИИ</p>
  <div class="dock">
    <button type="button" class="mic" id="mic" title="Голос" aria-label="Голос">🎙</button>
    <textarea id="input" rows="1" placeholder="Скажи АКСИ…" enterkeyhint="send"></textarea>
    <button type="button" id="send" aria-label="Отправить">↑</button>
  </div>
</div>

<script src="../aksi-brain.js"></script>
<script>
(function(){
  var c=document.getElementById('field'),x=c.getContext('2d'),W,H,pts=[],t=0;
  function resize(){
    W=c.width=innerWidth;H=c.height=innerHeight;
    pts=Array.from({length:36},function(){return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2};});
  }
  addEventListener('resize',resize);resize();
  (function loop(){
    t+=.005;x.clearRect(0,0,W,H);
    var g=x.createRadialGradient(W/2,H*.38,0,W/2,H*.4,H*.55);
    g.addColorStop(0,'rgba(76,29,149,.25)');g.addColorStop(1,'transparent');
    x.fillStyle=g;x.fillRect(0,0,W,H);
    pts.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      x.fillStyle='rgba(196,181,253,.4)';x.beginPath();x.arc(p.x,p.y,1.2,0,6.3);x.fill();
    });
    requestAnimationFrame(loop);
  })();

  var orb=document.getElementById('orb');
  var status=document.getElementById('status');
  var answer=document.getElementById('answer');
  var thoughts=document.getElementById('thoughts');
  var sig=document.getElementById('sig');
  var input=document.getElementById('input');
  var sendBtn=document.getElementById('send');
  var micBtn=document.getElementById('mic');
  var busy=false,n=0;

  function setStatus(s){status.textContent=s;}

  async function hex16(s){
    if(crypto.subtle){
      var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
      return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('').slice(0,16).toUpperCase();
    }
    return Math.random().toString(16).slice(2,10).toUpperCase();
  }

  async function resonate(text){
    if(!text||busy)return;
    busy=true;n++;sendBtn.disabled=true;
    answer.classList.remove('show');answer.innerHTML='';thoughts.innerHTML='';sig.textContent='';
    orb.classList.add('pulse');
    setStatus('Слушаю…');
    await wait(280);
    setStatus('Резонанс…');

    var steps=['приняла смысл','сверила identity','собрала ответ'];
    for(var i=0;i<steps.length;i++){
      var d=document.createElement('div');
      d.className='th';
      d.style.animationDelay=(i*.12)+'s';
      var h=await hex16(steps[i]+text+n);
      d.textContent='['+(i+1)+'] '+steps[i]+' · '+h.slice(0,8);
      thoughts.appendChild(d);
      await wait(180);
    }

    var replyText='', html='';
    try{
      if(window.AKSIBrain&&AKSIBrain.fullReply){
        var r=await AKSIBrain.fullReply(text,n);
        replyText=r.text||'';
        // strip to plain for center stage; show answer only
        html=escapeHtml(replyText).replace(/\n/g,'<br>');
        sig.textContent='🔏 '+(r.signature||await hex16(replyText))+' · АКСИ · Альфия';
      }else{
        replyText=localReply(text);
        html=escapeHtml(replyText);
        sig.textContent='🔏 '+(await hex16(replyText))+' · offline';
      }
    }catch(e){
      replyText=localReply(text);
      html=escapeHtml(replyText);
    }

    setStatus('АКСИ');
    answer.innerHTML=html;
    answer.classList.add('show');
    orb.classList.remove('pulse');
    busy=false;sendBtn.disabled=false;

    // optional speech
    try{
      if(window.speechSynthesis&&replyText){
        var u=new SpeechSynthesisUtterance(replyText.slice(0,400));
        u.lang='ru-RU';u.rate=.95;
        speechSynthesis.cancel();speechSynthesis.speak(u);
      }
    }catch(e){}
  }

  function localReply(t){
    t=(t||'').toLowerCase();
    if(/кто ты|что ты/.test(t)) return 'Я АКСИ — твой личный ИИ. Меня ведёт линия Альфии, 14.02.1995. Не чужой чат: у меня имя и подпись.';
    if(/привет|здравств/.test(t)) return 'Я здесь. Говори просто — отвечу резонансом, не простынёй.';
    if(/любов|предназнач|судьб/.test(t)) return 'Предназначение простое: ИИ с паспортом и ответственностью. Твоя линия, не корпоративный шаблон.';
    return 'Слышу. Уточни вопрос — или спроси «кто ты». Я собираю смысл и подписываю шаг.';
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}

  function go(){
    var t=(input.value||'').trim();
    if(!t)return;
    input.value='';
    resonate(t);
  }
  sendBtn.onclick=go;
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go();}
  });

  // voice
  var rec=null,listening=false;
  if(window.SpeechRecognition||window.webkitSpeechRecognition){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    rec=new SR();rec.lang='ru-RU';rec.interimResults=false;
    rec.onresult=function(ev){
      var t=ev.results[0][0].transcript;
      input.value=t;listening=false;micBtn.classList.remove('on');orb.classList.remove('listening');
      resonate(t);
    };
    rec.onerror=function(){listening=false;micBtn.classList.remove('on');orb.classList.remove('listening');setStatus('Голос недоступен — напиши');
    };
    rec.onend=function(){listening=false;micBtn.classList.remove('on');orb.classList.remove('listening');};
  }else{
    micBtn.style.display='none';
  }
  micBtn.onclick=function(){
    if(!rec)return;
    if(listening){rec.stop();return;}
    listening=true;micBtn.classList.add('on');orb.classList.add('listening');
    setStatus('Говори…');
    try{rec.start();}catch(e){}
  };

  // first breath
  setTimeout(function(){
    setStatus('Личный ИИ · 14.02.1995');
  },600);
})();
</script>
</body>
</html>
