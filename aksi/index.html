<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>АКСИ</title>
<meta name="theme-color" content="#0a0612"/>
<link rel="icon" href="/icon.svg" type="image/svg+xml"/>
<style>
:root{--bg:#0a0612;--ink:#f4f0ff;--muted:#9b92b0;--line:rgba(255,255,255,.08);--card:rgba(255,255,255,.04)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}
body{display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding:0 16px;min-height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px;gap:8px}
header a{color:var(--muted);text-decoration:none;font-size:13px}
.logo{font-weight:600;letter-spacing:.28em;font-size:12px}
.meta{font-size:11px;color:var(--muted)}
#thread{flex:1;overflow-y:auto;padding:12px 0 16px;min-height:0;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:92%;padding:12px 14px;border-radius:16px;font-size:15px;line-height:1.55;word-break:break-word}
.bubble.user{align-self:flex-end;background:linear-gradient(145deg,#7c3aed,#4f46e5);color:#fff;border-bottom-right-radius:6px}
.bubble.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubble .time{font-size:10px;opacity:.55;margin-top:6px}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:14px;padding:40px 12px}
.empty .orb{width:72px;height:72px;border-radius:50%;margin:0 auto 16px;background:radial-gradient(circle at 32% 28%,#f5f3ff,#a78bfa 40%,#1e1b4b 75%,#0a0612);display:grid;place-items:center;font-size:1.4rem;color:#fff}
footer{flex-shrink:0;padding:8px 0 14px}
.dock{display:flex;gap:8px;align-items:flex-end;padding:10px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.dock textarea{flex:1;resize:none;min-height:44px;max-height:120px;border:none;background:transparent;color:var(--ink);padding:10px 8px;font:inherit;font-size:16px;outline:none}
.dock button{width:44px;height:44px;border-radius:14px;border:none;cursor:pointer;background:linear-gradient(145deg,#8b5cf6,#6366f1);color:#fff;font-size:1.1rem;flex-shrink:0}
.dock button:disabled{opacity:.35}
.dock button.mic{background:transparent;border:1px solid var(--line);color:var(--muted)}
.dock button.mic.on{border-color:#38bdf8;color:#38bdf8}
.toolbar{display:flex;justify-content:flex-end;gap:10px;padding:4px 0}
.toolbar button{background:transparent;border:none;color:var(--muted);font-size:11px;cursor:pointer}
.typing{align-self:flex-start;padding:10px 14px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <a href="/">←</a>
  <span class="logo">АКСИ</span>
  <span class="meta" id="mem-count"></span>
</header>
<div class="toolbar">
  <button type="button" id="btn-api" title="URL backend">API</button>
  <button type="button" id="btn-clear">Очистить память</button>
</div>
<div id="thread">
  <div class="empty" id="empty">
    <div class="orb">Ψ</div>
    <div>Напишите — АКСИ ответит.<br>Память в браузере. Для «полной» модели — backend + Ollama.</div>
  </div>
</div>
<footer>
  <div class="dock">
    <button type="button" class="mic" id="mic">🎙</button>
    <textarea id="input" rows="1" placeholder="Сообщение…" enterkeyhint="send"></textarea>
    <button type="button" id="send">↑</button>
  </div>
</footer>
<script src="/aksi-memory.js"></script>
<script src="/codex.js"></script>
<script src="/aksi-brain.js"></script>
<script>
(function(){
"use strict";
var thread=document.getElementById("thread");
var empty=document.getElementById("empty");
var input=document.getElementById("input");
var sendBtn=document.getElementById("send");
var micBtn=document.getElementById("mic");
var memEl=document.getElementById("mem-count");
var busy=false,n=0;

function esc(s){return String(s).replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">");}
function fmtTime(ts){try{return new Date(ts).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}catch(e){return"";}}
function hideEmpty(){if(empty)empty.style.display="none";}
function addBubble(role,text,ts){
  hideEmpty();
  var d=document.createElement("div");
  d.className="bubble "+(role==="user"?"user":"bot");
  d.innerHTML=esc(text).replace(/\n/g,"<br>")+(ts?'<div class="time">'+fmtTime(ts)+"</div>":"");
  thread.appendChild(d);
  thread.scrollTop=thread.scrollHeight;
}
function withTimeout(p,ms){
  return new Promise(function(resolve){
    var done=false;
    var t=setTimeout(function(){if(!done){done=true;resolve(null);}},ms);
    Promise.resolve(p).then(function(v){if(!done){done=true;clearTimeout(t);resolve(v);}}).catch(function(){if(!done){done=true;clearTimeout(t);resolve(null);}});
  });
}
async function safeRemember(role,content){
  if(!window.AksiMemory)return;
  try{await withTimeout(AksiMemory.remember(role,content),2000);}catch(e){}
}
async function refreshCount(){
  if(!window.AksiMemory){memEl.textContent="";return;}
  try{var c=await withTimeout(AksiMemory.count(),2000);memEl.textContent=c!=null?(c+" в памяти"):"";}catch(e){memEl.textContent="";}
}
async function loadHistory(){
  if(!window.AksiMemory)return;
  try{
    var rows=await withTimeout(AksiMemory.history(200),3000);
    if(!rows||!rows.length){await refreshCount();return;}
    rows.forEach(function(r){addBubble(r.role==="user"?"user":"bot",r.content,r.ts);});
    await refreshCount();
    thread.scrollTop=thread.scrollHeight;
  }catch(e){}
}

async function getReply(text){
  var mem="", hist=[];
  if(window.AksiMemory){
    mem=(await withTimeout(AksiMemory.contextBlock(30,10000),2500))||"";
    var rows=(await withTimeout(AksiMemory.history(20),2000))||[];
    hist=rows.map(function(r){return{role:r.role==="user"?"user":"assistant",content:r.content};});
  }
  // 1) Backend LLM (Ollama via Milana-backend)
  if(window.AKSIBrain&&AKSIBrain.backendReply){
    var br=await withTimeout(AKSIBrain.backendReply(text,hist,mem),20000);
    if(br&&br.text)return br.text;
  }
  // 2) Client brain
  if(window.AKSIBrain&&AKSIBrain.fullReply){
    var r=await withTimeout(AKSIBrain.fullReply(text,n,{memory:mem}),10000);
    if(r&&r.text)return r.text;
  }
  return "Я АКСИ. Сейчас доступен базовый режим. Спросите «кто ты» или факт из Wikipedia.";
}

async function respond(text){
  text=String(text||"").trim();
  if(!text||busy)return;
  busy=true;n++;sendBtn.disabled=true;
  try{
    if(window.AksiCodex&&AksiCodex.check){
      var gate=AksiCodex.check(text);
      if(gate&&gate.ok===false){
        addBubble("bot",gate.message||"Отказ по Кодексу.",Date.now());
        busy=false;sendBtn.disabled=false;return;
      }
    }
    addBubble("user",text,Date.now());
    await safeRemember("user",text);
    var tip=document.createElement("div");
    tip.className="typing";tip.id="typing";tip.textContent="АКСИ…";
    thread.appendChild(tip);thread.scrollTop=thread.scrollHeight;
    var reply=await getReply(text);
    if(!reply)reply="Не удалось сформировать ответ. Попробуйте ещё раз.";
    var t=document.getElementById("typing");if(t)t.remove();
    addBubble("bot",reply,Date.now());
    await safeRemember("assistant",reply);
    await refreshCount();
  }catch(err){
    var t2=document.getElementById("typing");if(t2)t2.remove();
    addBubble("bot","Сбой. Обновите страницу (Ctrl+F5) и попробуйте снова.",Date.now());
  }
  busy=false;sendBtn.disabled=false;
}

function go(){var v=(input.value||"").trim();if(!v)return;input.value="";respond(v);}
sendBtn.onclick=go;
input.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();go();}});

document.getElementById("btn-clear").onclick=async function(){
  if(!confirm("Очистить память?"))return;
  if(window.AksiMemory){try{await withTimeout(AksiMemory.clear(),2000);}catch(e){}}
  thread.innerHTML="";empty.style.display="";thread.appendChild(empty);
  await refreshCount();
};
document.getElementById("btn-api").onclick=function(){
  var cur="";try{cur=localStorage.getItem("AKSI_API")||"http://localhost:8000";}catch(e){}
  var v=prompt("URL backend АКСИ (пустой = только браузер)",cur);
  if(v===null)return;
  try{
    if(v.trim())localStorage.setItem("AKSI_API",v.trim().replace(/\/$/,""));
    else localStorage.removeItem("AKSI_API");
    alert(v.trim()?"API сохранён: "+v.trim():"Только браузерный режим");
  }catch(e){}
};

var rec=null,listening=false;
if(window.SpeechRecognition||window.webkitSpeechRecognition){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  rec=new SR();rec.lang="ru-RU";rec.interimResults=false;
  rec.onresult=function(ev){listening=false;micBtn.classList.remove("on");respond(ev.results[0][0].transcript);};
  rec.onerror=rec.onend=function(){listening=false;micBtn.classList.remove("on");};
}else micBtn.style.display="none";
micBtn.onclick=function(){if(!rec)return;if(listening){rec.stop();return;}listening=true;micBtn.classList.add("on");try{rec.start();}catch(e){};};

loadHistory();
})();
</script>
</body>
</html>
