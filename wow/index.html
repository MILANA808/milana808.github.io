<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>АКСИ · Поле</title>
<meta name="theme-color" content="#030014"/>
<style>
:root{--ink:#f5f3ff;--muted:#a5b4fc;--violet:#8b5cf6;--cyan:#22d3ee;--pink:#e879f9}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#030014;color:var(--ink);font-family:system-ui,-apple-system,sans-serif}
canvas#fx{position:fixed;inset:0;z-index:0}
.ui{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;pointer-events:auto}
.top a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600}
.live{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:pulse 1.6s ease infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.85)}}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px;pointer-events:none}
.orb-wrap{position:relative;width:min(72vw,280px);height:min(72vw,280px);margin-bottom:28px;pointer-events:auto;cursor:pointer}
.orb{position:absolute;inset:0;border-radius:50%;background:
  radial-gradient(circle at 32% 28%,#fff 0%,#e9d5ff 12%,#a78bfa 28%,#6d28d9 55%,#1e1b4b 78%,#030014 100%);
  box-shadow:0 0 60px rgba(139,92,246,.55),0 0 120px rgba(34,211,238,.15),inset 0 0 40px rgba(255,255,255,.15);
  animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.ring{position:absolute;inset:-12%;border-radius:50%;border:1px solid rgba(34,211,238,.25);animation:spin 24s linear infinite}
.ring2{position:absolute;inset:-22%;border-radius:50%;border:1px dashed rgba(232,121,249,.2);animation:spin 40s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:clamp(1.8rem,6vw,2.6rem);font-weight:750;letter-spacing:-.03em;line-height:1.1;margin-bottom:8px;text-shadow:0 0 40px rgba(139,92,246,.5)}
.sub{color:var(--muted);font-size:15px;max-width:28ch;line-height:1.5;margin-bottom:18px}
.seal-box{pointer-events:auto;background:rgba(15,10,35,.75);border:1px solid rgba(34,211,238,.3);border-radius:16px;padding:12px 16px;backdrop-filter:blur(12px);max-width:min(92vw,400px)}
.seal-box .lab{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
.seal-box code{font-family:ui-monospace,monospace;font-size:11px;color:#c4b5fd;word-break:break-all}
.nodes{pointer-events:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 14px 90px;max-width:480px;margin:0 auto;width:100%}
.nodes a{text-decoration:none;color:var(--ink);background:rgba(30,20,60,.75);border:1px solid rgba(139,92,246,.3);border-radius:14px;padding:12px 8px;text-align:center;font-size:12px;font-weight:600;backdrop-filter:blur(8px);transition:transform .15s,border-color .15s}
.nodes a:hover,.nodes a:active{transform:scale(1.04);border-color:var(--cyan)}
.nodes a span{display:block;font-size:18px;margin-bottom:4px}
.stats{pointer-events:auto;display:flex;justify-content:center;gap:18px;padding:0 16px 8px;font-size:12px;color:var(--muted)}
.stats b{color:var(--cyan);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="ui">
  <div class="top">
    <a href="/">← Домой</a>
    <div class="live"><i></i> LIVE</div>
    <a href="/aksi/">Чат</a>
  </div>
  <div class="center">
    <div class="orb-wrap" id="orb" title="Пульс">
      <div class="ring2"></div>
      <div class="ring"></div>
      <div class="orb"></div>
    </div>
    <h1>АКСИ</h1>
    <p class="sub">Живое поле: печать, сны, сеть и знание — в одном контуре</p>
    <div class="seal-box">
      <div class="lab">Пульс Resonance · обновляется</div>
      <code id="pulse">…</code>
    </div>
  </div>
  <div class="stats">
    <div>сеть <b id="n-net">0</b></div>
    <div>сны <b id="n-dreams">0</b></div>
    <div>печать <b id="n-ok">—</b></div>
  </div>
  <nav class="nodes">
    <a href="/aksi/"><span>✦</span>Чат</a>
    <a href="/dreams/"><span>☁</span>Сны</a>
    <a href="/net/"><span>◈</span>Сеть</a>
    <a href="/drive/"><span>▶</span>Путь</a>
    <a href="/solar/"><span>✧</span>Космос</a>
    <a href="/citizen/"><span>◎</span>ID</a>
  </nav>
</div>
<script>
(function(){
  var SEED="AKSI_DIMAX_v3_2026";
  var DID="did:aksi:ed25519:sovereign-2026";

  // particles
  var c=document.getElementById("fx"),x=c.getContext("2d");
  var W,H,pts=[],mx=0,my=0;
  function rz(){W=c.width=innerWidth;H=c.height=innerHeight;pts=[];
    for(var i=0;i<70;i++)pts.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*1.5+0.3,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25});
  }
  rz();addEventListener("resize",rz);
  addEventListener("pointermove",function(e){mx=e.clientX;my=e.clientY;});
  (function loop(){
    x.clearRect(0,0,W,H);
    var g=x.createRadialGradient(W/2,H*0.35,0,W/2,H*0.35,H*0.55);
    g.addColorStop(0,"rgba(91,33,182,.2)");g.addColorStop(1,"transparent");
    x.fillStyle=g;x.fillRect(0,0,W,H);
    for(var i=0;i<pts.length;i++){
      var p=pts[i];
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      var dx=p.x-mx,dy=p.y-my,d=Math.sqrt(dx*dx+dy*dy);
      if(d<120){p.x+=dx/d*0.4;p.y+=dy/d*0.4;}
      x.beginPath();x.arc(p.x,p.y,p.z,0,6.3);
      x.fillStyle="rgba(196,181,253,"+(0.3+p.z*0.3)+")";x.fill();
      for(var j=i+1;j<pts.length;j++){
        var q=pts[j],dx2=p.x-q.x,dy2=p.y-q.y,d2=dx2*dx2+dy2*dy2;
        if(d2<90*90){
          x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);
          x.strokeStyle="rgba(34,211,238,"+(0.12*(1-d2/8100))+")";x.stroke();
        }
      }
    }
    requestAnimationFrame(loop);
  })();

  function hex(buf){return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");}
  async function pulse(){
    var ts=Date.now();
    var payload=DID+"|PULSE|"+ts+"|"+SEED;
    var dig=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(SEED+"|"+payload));
    var sig=hex(dig);
    document.getElementById("pulse").textContent=sig.slice(0,32)+"… · "+new Date(ts).toLocaleTimeString("ru-RU");
    document.getElementById("n-ok").textContent=sig.slice(0,6);
  }
  pulse();setInterval(pulse,3000);

  function count(){
    try{
      var n=JSON.parse(localStorage.getItem("AKSI_NET_V1")||"[]");
      document.getElementById("n-net").textContent=Array.isArray(n)?n.length:0;
    }catch(e){}
    try{
      var d=JSON.parse(localStorage.getItem("AKSI_DREAMS_V1")||"[]");
      document.getElementById("n-dreams").textContent=Array.isArray(d)?d.length:0;
    }catch(e){}
  }
  count();setInterval(count,2000);

  document.getElementById("orb").onclick=function(){pulse();this.querySelector(".orb").style.transform="scale(1.08)";setTimeout(function(){},200);};
})();
</script>
<script src="/nav.js"></script>
</body>
</html>
