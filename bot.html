<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>АКСИ Bot — Whole stack</title>
<meta name="description" content="AKSI Bot: Agent + Organism + Gate + Cortex + Research + ADIA.">
<link rel="canonical" href="https://milana808.github.io/bot.html">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#06060a">
<style>
:root{--bg:#06060a;--ink:#f2f0eb;--muted:#9b98a6;--line:rgba(255,255,255,.08);--violet:#8b7cf6;--green:#5ee9a8;--red:#f87171;--card:#0b0b11}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center}
.logo{font-weight:900}.logo span{color:var(--violet)}
header a{color:var(--muted);text-decoration:none;font-size:12px;margin-left:10px}
#st{font-size:11px;color:var(--muted);padding:8px 16px}
.msgs{flex:1;overflow-y:auto;padding:16px;max-width:720px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-height:50vh}
.msg{max-width:92%;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#12121a}
.msg .meta{font-size:11px;color:var(--muted);margin-top:6px}
.badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;background:#15151f;margin-right:4px}
.badge.ok{color:var(--green)}.badge.no{color:var(--red)}
.bar{max-width:720px;width:100%;margin:0 auto;padding:12px 16px 20px;display:flex;gap:8px;border-top:1px solid var(--line)}
.bar input{flex:1;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#0a0a10;color:var(--ink);font:inherit;font-size:16px}
.bar button{min-height:48px;background:var(--violet);color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:800;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-width:720px;margin:0 auto;padding:0 16px 8px}
.chips button{font-size:12px;padding:0 12px;min-height:36px;border-radius:999px;border:1px solid var(--line);background:#0f0f16;color:var(--ink);cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<header>
  <div class="logo">АКСИ <span>Bot</span></div>
  <nav>
    <a href="/product.html">Whole</a>
    <a href="/seal.html">Seal</a>
    <a href="/infinity.html">Infinity</a>
    <a href="/">Home</a>
  </nav>
</header>
<p id="st">загрузка…</p>
<div class="chips">
  <button type="button" data-q="Кто ты?">Кто ты</button>
  <button type="button" data-q="статус">Статус</button>
  <button type="button" data-q="запомни: АКСИ Bot Whole — Agent+Organism+Gate+ADIA">Научить</button>
  <button type="button" data-q="исследуй: искусственный интеллект">Research</button>
</div>
<div class="msgs" id="msgs" role="log" aria-live="polite"></div>
<div class="bar">
  <input id="q" type="text" placeholder="запомни: … · исследуй: … · вопрос" enterkeyhint="send" aria-label="Сообщение">
  <button type="button" id="go">Отправить</button>
</div>
<script src="/aksi-fly-brain.js?v=2"></script>
<script src="/aksi-fly-gate.js?v=2"></script>
<script src="/aksi-receipt.js?v=2"></script>
<script src="/aksi-organism.js?v=13"></script>
<script src="/agent.js?v=4"></script>
<script src="/aksi-algorithm.js?v=3"></script>
<script src="/aksi-self-github.js?v=1"></script>
<script src="/aksi-cortex-kernel.js?v=3"></script>
<script src="/aksi-agent-runtime.js?v=1"></script>
<script src="/aksi-bot.js?v=7"></script>
<script>
(function(){
  var B=window.AKSI_BOT;
  if(!B){document.getElementById('st').textContent='Bot module missing';return;}
  B.status().then(function(s){
    document.getElementById('st').textContent='v'+s.version+' · seed '+s.seed+' · cortex='+(s.cortexDocs||0)+' · gate='+!!s.flyGate+' · adia='+!!s.adia+' · org='+!!s.organism;
  });
  function add(role,text,meta){
    var d=document.createElement('div');d.className='msg '+role;d.textContent=text;
    if(meta){var m=document.createElement('div');m.className='meta';m.innerHTML=meta;d.appendChild(m);}
    document.getElementById('msgs').appendChild(d);d.scrollIntoView({block:'end'});
  }
  add('bot','АКСИ Bot Whole.\nAgent + Organism + Gate + Cortex + Research + ADIA.\n«запомни:» · «исследуй:» · вопрос');
  async function send(){
    var q=document.getElementById('q').value.trim();if(!q)return;
    document.getElementById('q').value='';add('user',q);
    document.getElementById('go').disabled=true;
    try{
      var out=await B.think(q);
      var meta='<span class="badge">'+(out.source||'')+'</span>';
      if(out.gate)meta+='<span class="badge '+(out.gate.decision==='ALLOWED'?'ok':'no')+'">gate '+out.gate.decision+'</span>';
      if(out.eqs!=null)meta+='<span class="badge">EQS '+Math.round(Number(out.eqs))+'</span>';
      if(out.sources)meta+=' · sources '+out.sources.length;
      add('bot',out.text||'—',meta);
    }catch(e){add('bot','Ошибка: '+e.message);}
    document.getElementById('go').disabled=false;
    B.status().then(function(s){
      document.getElementById('st').textContent='v'+s.version+' · cortex='+(s.cortexDocs||0)+' · adia='+!!s.adia;
    });
  }
  document.getElementById('go').onclick=send;
  document.getElementById('q').addEventListener('keydown',function(e){if(e.key==='Enter')send();});
  document.querySelectorAll('.chips button').forEach(function(b){
    b.onclick=function(){document.getElementById('q').value=b.getAttribute('data-q');send();};
  });
})();
</script>
</body>
</html>
