<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#efe5d2">
<title>АКСИ-AI · алгоритм мышления</title>
<style>
:root{--s:#fbf7ef;--s2:#efe6d6;--ink:#2a241c;--muted:#7a6f60;--line:#ddd0bb;--a:#6b4f35}
*{box-sizing:border-box;margin:0;padding:0}body{font:15px/1.5 system-ui,sans-serif;background:linear-gradient(165deg,#f7f0e4,#efe5d2);color:var(--ink);min-height:100vh}
a{color:inherit}.wrap{max-width:820px;margin:0 auto;padding:16px 14px 40px}
.top{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#6b4f35,#8a6544);color:#fff;display:grid;place-items:center;font-weight:900}
h1{font-size:18px;font-weight:800}.sub{font-size:12px;color:var(--muted)}
.card{background:var(--s);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.flow span{font-size:11px;padding:5px 8px;border-radius:8px;background:var(--s2);border:1px solid var(--line);font-weight:700}
#thread{min-height:160px;max-height:320px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.bub{padding:10px 12px;border-radius:12px;background:var(--s2);border:1px solid var(--line);max-width:92%;white-space:pre-wrap;font-size:14px}
.bub.me{align-self:flex-end;background:var(--a);color:#fff;border-color:var(--a)}.bub .m{font-size:10px;opacity:.75;margin-top:4px}
.composer{display:flex;gap:8px;margin-top:10px}
.composer input{flex:1;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px}
.composer button,.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--a);color:#fff;font-weight:700}
.btn.g{background:var(--s2);color:var(--ink);border:1px solid var(--line)}
pre{font-size:11px;background:#f3ebe0;border-radius:10px;padding:10px;overflow:auto;max-height:180px;margin-top:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="logo">A</div><div><h1>АКСИ-AI</h1><div class="sub"><a href="/">← хаб</a> · алгоритм v1</div></div></header>
  <div class="card"><h3>Pipeline</h3>
    <div class="flow"><span>PERCEIVE</span><span>INTENT</span><span>RETRIEVE</span><span>REASON</span><span>GENERATE</span><span>CRITIQUE</span><span>SEAL</span></div>
    <p style="font-size:13px;color:var(--muted)">Offline. «запомни: факт» — обучение. Thought-chain ниже.</p>
  </div>
  <div class="card"><h3>Диалог</h3>
    <div id="thread"></div>
    <div class="composer"><input id="inp" placeholder="Вопрос или запомни: …" enterkeyhint="send" autocomplete="off"><button type="button" id="send">↑</button></div>
    <div class="row">
      <button type="button" class="btn g" data-q="кто ты">кто ты</button>
      <button type="button" class="btn g" data-q="архитектура">архитектура</button>
      <button type="button" class="btn g" data-q="как пользоваться">как пользоваться</button>
    </div>
  </div>
  <div class="card"><h3>Thought / seal</h3><pre id="meta">—</pre></div>
</div>
<script src="/aksi-ai.js?v=1"></script>
<script src="/aksi-ciphersuite.js?v=1"></script>
<script>
(function(){
  var th=document.getElementById('thread'),meta=document.getElementById('meta'),inp=document.getElementById('inp');
  function bub(role,t){var d=document.createElement('div');d.className='bub'+(role==='me'?' me':'');d.textContent=t||'';th.appendChild(d);th.scrollTop=th.scrollHeight;return d}
  async function ask(q0){
    var q=q0||(inp.value||'').trim();if(!q)return;inp.value='';bub('me',q);var last=bub('ai','…');
    try{
      if(window.AKSI_CRYPTO&&AKSI_CRYPTO.boot)try{await AKSI_CRYPTO.boot({tryPq:false})}catch(e){}
      var r=await AKSI_AI.think(q);var payload=r.payload||r;
      last.textContent=payload.answer||'—';
      var m=(payload.kind||'')+' · score '+(payload.critique&&payload.critique.score)+' · '+payload.ms+'ms';
      var s=document.createElement('div');s.className='m';s.textContent=m;last.appendChild(s);
      meta.textContent=JSON.stringify({intent:payload.intent,thought:payload.thought,critique:payload.critique,seal:r.seal,hits:payload.hits},null,2);
    }catch(e){last.textContent=String(e.message||e)}
  }
  document.getElementById('send').onclick=function(){ask()};
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')ask()});
  document.querySelectorAll('[data-q]').forEach(function(b){b.onclick=function(){ask(b.getAttribute('data-q'))}});
  bub('ai','АКСИ-AI online. Pipeline: perceive→…→seal');
})();
</script>
</body>
</html>
