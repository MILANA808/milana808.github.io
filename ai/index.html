<!DOCTYPE html>
<html lang="ru" data-aksi-autoload="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#efe5d2">
<title>АКСИ · ИИ работает сейчас</title>
<style>
:root{--s:#fbf7ef;--s2:#efe6d6;--ink:#2a241c;--muted:#7a6f60;--line:#ddd0bb;--a:#6b4f35;--ok:#2f6b48;--bad:#a33}
*{box-sizing:border-box;margin:0;padding:0}body{font:15px/1.5 system-ui,sans-serif;background:linear-gradient(165deg,#f7f0e4,#efe5d2);color:var(--ink);min-height:100vh}
a{color:inherit}.wrap{max-width:720px;margin:0 auto;padding:16px 14px 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,#6b4f35,#8a6544);color:#fff;display:grid;place-items:center;font-weight:900}
h1{font-size:18px}.sub{font-size:12px;color:var(--muted)}
.pill{margin-left:auto;font-size:11px;font-weight:800;padding:6px 10px;border-radius:999px;background:#e8f2ea;color:var(--ok);border:1px solid #b7d4c2}
.card{background:var(--s);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
#thread{min-height:200px;max-height:360px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.bub{padding:10px 12px;border-radius:12px;background:var(--s2);border:1px solid var(--line);max-width:92%;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--a);color:#fff;border-color:var(--a)}.bub .m{font-size:10px;opacity:.75;margin-top:4px}
.composer{display:flex;gap:8px;margin-top:10px}
.composer input{flex:1;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);font-size:16px;background:#fff}
.composer button,.btn{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--a);color:#fff;font-weight:800;cursor:pointer}
.btn.g{background:var(--s2);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.bar{height:8px;background:#e8dfd0;border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;width:0;background:var(--a)}
#llm{font-size:12px;color:var(--muted)}.tip{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body data-aksi-autoload="1">
<div class="wrap">
  <header class="top"><div class="logo">A</div><div><h1>АКСИ ИИ</h1><div class="sub"><a href="/">← хаб</a> · отвечает сразу</div></div><span class="pill" id="pill">ONLINE</span></header>
  <div class="card">
    <h3>Статус</h3>
    <div id="st">Neuro \u00b7 Genesis \u00b7 LLM</div>
    <div class="bar"><i id="bar"></i></div>
    <div id="llm">LLM: фон</div>
    <p class="tip">Веса LLM (сотни МБ) нельзя вшить в GitHub Pages. На сайте сразу работает Neuro+Genesis. LLM кэшируется браузером после первой загрузки с CDN.</p>
  </div>
  <div class="card">
    <h3>Чат</h3>
    <div id="thread"></div>
    <div class="composer"><input id="inp" placeholder="Спросите…" enterkeyhint="send"><button type="button" id="send">↑</button></div>
    <div class="row">
      <button type="button" class="btn g" data-q="кто ты">кто ты</button>
      <button type="button" class="btn g" data-q="что умеешь">что умеешь</button>
      <button type="button" class="btn g" id="btnLlm">догрузить LLM</button>
    </div>
  </div>
</div>
<script>window.AKSI_WEBLLM_AUTO=true;try{localStorage.removeItem('aksi_webllm_skip')}catch(e){}</script>
<script src="/aksi-neuro.js?v=10"></script>
<script src="/aksi-genesis.js?v=21"></script>
<script src="/aksi-fir.js?v=1"></script>
<script src="/aksi-webllm.js?v=14"></script>
<script type="module" src="/aksi-llm-boot.mjs?v=1"></script>
<script>
(function(){
  var th=document.getElementById('thread'),inp=document.getElementById('inp'),pill=document.getElementById('pill'),st=document.getElementById('st'),bar=document.getElementById('bar'),llm=document.getElementById('llm');
  function bub(role,t){var d=document.createElement('div');d.className='bub'+(role==='me'?' me':'');d.textContent=t||'';th.appendChild(d);th.scrollTop=th.scrollHeight;return d}
  function refresh(){
    var n=!!(window.AKSI_NEURO&&AKSI_NEURO.think),g=!!(window.AKSI_GENESIS&&AKSI_GENESIS.think),w=window.AKSI_WEBLLM&&AKSI_WEBLLM.ready&&AKSI_WEBLLM.ready();
    st.textContent='Neuro: '+(n?'\u2713':'\u2014')+' \u00b7 Genesis: '+(g?'\u2713':'\u2014')+' \u00b7 LLM: '+(w?'\u2713':'\u2026');
    pill.textContent=n?'ONLINE':'BOOT';
  }
  window.addEventListener('aksi-webllm-progress',function(e){var s=e.detail||{};bar.style.width=(s.progress||0)+'%';llm.textContent=(s.ready?'\u2713 ':'')+(s.message||'')+(s.error?' \u00b7 '+s.error:'');refresh()});
  async function answer(q){
    if(window.AKSI_FIR&&AKSI_FIR.think){try{var r=await AKSI_FIR.think(q,{forceLlm:!!(AKSI_WEBLLM&&AKSI_WEBLLM.ready&&AKSI_WEBLLM.ready())});var p=r.payload||r;return{text:p.answer||r.answer,source:p.source||'fir',ms:p.ms}}catch(e){}}
    if(window.AKSI_WEBLLM&&AKSI_WEBLLM.ready&&AKSI_WEBLLM.ready()){try{var w=await AKSI_WEBLLM.complete(q);if(w&&w.text)return{text:w.text,source:w.source||'llm'}}catch(e){}}
    if(window.AKSI_GENESIS&&AKSI_GENESIS.think){try{var g=await AKSI_GENESIS.think(q);var gp=g.payload||g;if(gp.answer)return{text:gp.answer,source:'genesis'}}catch(e){}}
    if(window.AKSI_NEURO&&AKSI_NEURO.think){var n=AKSI_NEURO.think(q);if(n&&n.text)return{text:n.text,source:'neuro'}}
    return{text:'\u041e\u0431\u043d\u043e\u0432\u0438\u0442\u0435 \u0441\u0442\u0440\u0430\u043d\u0438\u0446\u0443 Ctrl+Shift+R',source:'none'};
  }
  async function ask(q0){
    var q=q0||(inp.value||'').trim();if(!q)return;inp.value='';bub('me',q);var last=bub('ai','\u2026');
    try{var r=await answer(q);last.textContent=r.text||'\u2014';var m=document.createElement('div');m.className='m';m.textContent=(r.source||'')+(r.ms!=null?' \u00b7 '+r.ms+'ms':'');last.appendChild(m)}catch(e){last.textContent=String(e.message||e)}
  }
  document.getElementById('send').onclick=function(){ask()};
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')ask()});
  document.querySelectorAll('[data-q]').forEach(function(b){b.onclick=function(){ask(b.getAttribute('data-q'))}});
  document.getElementById('btnLlm').onclick=function(){
    llm.textContent='\u0437\u0430\u0433\u0440\u0443\u0437\u043a\u0430\u2026';
    try{localStorage.removeItem('aksi_webllm_skip')}catch(e){}
    var L=window.AKSI_LLM_BOOT||window.AKSI_WEBLLM;
    if(L&&L.autoLoad)L.autoLoad({force:true}).then(function(s){llm.textContent=(s&&s.message)||JSON.stringify(s);refresh()});
  };
  refresh();setInterval(refresh,2000);
  bub('ai','\u042f \u0410\u041a\u0421\u0418. \u041e\u0442\u0432\u0435\u0447\u0430\u044e \u0441\u0440\u0430\u0437\u0443 (Neuro/Genesis). LLM \u2014 \u0432 \u0444\u043e\u043d\u0435, \u0435\u0441\u043b\u0438 \u0431\u0440\u0430\u0443\u0437\u0435\u0440 \u043f\u043e\u0437\u0432\u043e\u043b\u044f\u0435\u0442.');
  setTimeout(function(){try{localStorage.removeItem('aksi_webllm_skip')}catch(e){}var L=window.AKSI_LLM_BOOT||window.AKSI_WEBLLM;if(L&&L.autoLoad)L.autoLoad().catch(function(){})},700);
})();
</script>
</body>
</html>
