<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#03060c"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>АКСИ · Навигатор</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--bg:#03060c;--panel:rgba(10,14,22,.96);--line:#1e2a3c;--txt:#f2f6fc;--muted:#8a9bb0;--acc:#2ee6a8}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;height:100dvh;width:100%}#map{position:absolute;inset:0;z-index:0}
#setup{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding:14px 14px calc(14px + env(safe-area-inset-bottom,0));backdrop-filter:blur(18px)}#setup.hide{display:none}
#setup h1{font-size:15px;font-weight:800;margin-bottom:10px}.row{display:flex;gap:8px;margin-bottom:8px}
input{flex:1;min-height:48px;border-radius:14px;border:1px solid var(--line);background:#0c121c;color:var(--txt);padding:12px 14px;font:inherit;font-size:16px}
button{min-height:48px;border-radius:14px;border:1px solid var(--line);background:#0c121c;color:var(--txt);font:inherit;font-size:15px;font-weight:800;padding:0 16px;cursor:pointer}
button.go{flex:1;background:#0f2f26;border-color:var(--acc);color:var(--acc);font-size:17px}button:disabled{opacity:.35}
.hint{font-size:12px;color:var(--muted);margin-top:6px}#statusLine{font-size:11px;color:var(--muted);margin-top:8px}#statusLine b{color:var(--txt)}
#nav{position:absolute;inset:0;z-index:30;pointer-events:none;display:none}#nav.on{display:block}
#navTop{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0)) 12px 12px;background:linear-gradient(to bottom,rgba(3,6,12,.94),rgba(3,6,12,.5),transparent)}

#arrowSvg{width:56px;height:56px}#navText{flex:1;min-width:0}
#navTurn{font-size:20px;font-weight:850;line-height:1.2}#navMeta{font-size:13px;color:var(--muted);margin-top:4px}
#navDist{font-size:28px;font-weight:900;color:var(--acc);margin-top:2px}

.warn{display:none;border-radius:16px;padding:14px 16px;font-weight:850;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.45)}.warn.on{display:block}
.warn.cam{background:rgba(255,59,92,.94);color:#fff;animation:pulse 1.15s ease-in-out infinite}
.warn.fuel{background:rgba(255,201,51,.94);color:#1a1200}.warn.dps{background:rgba(77,159,255,.94);color:#fff}

</style></head><body>
<div id="app">
<div id="map"></div>

<div id="setup">

<div id="nav">
<div id="navTop"><div id="navCard">
<div id="arrowBox"><svg id="arrowSvg" viewBox="0 0 64 64" fill="none"><path id="arrowPath" d="M32 8 L32 48 M32 8 L20 22 M32 8 L44 22" stroke="#2ee6a8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div id="navText"><div id="navDist">—</div><div id="navTurn">По маршруту</div><div id="navMeta">—</div></div>
</div><div id="navBar"><i id="prog"></i></div></div>
<div id="warn">

<div class="warn dps" id="wDps"><div id="wDpsMain">ДПС</div><div class="sub" id="wDpsSub"></div></div>
<div class="warn fuel" id="wFuel"><div id="wFuelMain">АЗС</div><div class="sub" id="wFuelSub"></div></div>
</div>
<div id="navBottom"><div id="navStats">
<div class="pill">Осталось<b id="left">—</b></div>
<div class="pill">Камера<b id="nextCam">—</b></div>
<button type="button" id="btnStopNav">Стоп</button>
</div></div></div></div>

function nextStep(lat,lng){var steps=state.route.steps||[],best=null,bestD=1e15;for(var i=0;i<steps.length;i++){var s=steps[i];if(!s.location)continue;var d=distM([lat,lng],s.location);if(d<bestD){bestD=d;best=s}}if(best&&bestD<1200)return{step:best,dist:bestD};for(var j=0;j<steps.length;j++){if(steps[j].type==="arrive")continue;if(steps[j].location)return{step:steps[j],dist:distM([lat,lng],steps[j].location)}}return best?{step:best,dist:bestD}:null}
function buzz(){try{if(navigator.vibrate)navigator.vibrate([80,40,80])}catch(e){}}
function tick(lat,lng){var n=nearestOn(lat,lng),rem=remain(n.idx),tot=state.route.distance||1;$("prog").style.width=(Math.max(0,Math.min(1,1-rem/tot))*100).toFixed(1)+"%";$("left").textContent=fmtKm(rem);var nx=nextStep(lat,lng);if(n.dist>150){setArrow("straight","#f5c542");$("navDist").textContent=Math.round(n.dist)+" \u043c";$("navTurn").textContent="\u0412\u0435\u0440\u043d\u0438\u0442\u0435\u0441\u044c \u043d\u0430 \u043f\u0443\u0442\u044c";$("navMeta").textContent=""}else if(rem<40){setArrow("arrive");$("navDist").textContent="0";$("navTurn").textContent="\u041f\u0440\u0438\u0435\u0445\u0430\u043b\u0438";$("navMeta").textContent=""}else if(nx&&nx.step){var key=maneuverKey(nx.step);setArrow(key);$("navDist").textContent=fmtKm(nx.dist);$("navTurn").textContent=humanStep(nx.step);$("navMeta").textContent=(nx.step.name?nx.step.name+" \u00b7 ":"")+fmtKm(nx.step.distance)}else{setArrow("straight");$("navDist").textContent=fmtKm(rem);$("navTurn").textContent="\u041f\u0440\u044f\u043c\u043e";$("navMeta").textContent=""}
var c=nearestAhead(along.cam,lat,lng,900);if(c&&c.d<=500){$("wCam").classList.add("on");$("wCamMain").textContent="\ud83d\udcf7 \u041a\u0430\u043c\u0435\u0440\u0430 \u0447\u0435\u0440\u0435\u0437 "+fmtKm(c.d);$("wCamSub").textContent=c.o.name||"\u0441\u043d\u0438\u0437\u044c\u0442\u0435 \u0441\u043a\u043e\u0440\u043e\u0441\u0442\u044c";$("nextCam").textContent=fmtKm(c.d);if(Date.now()-state.lastCamBuzz>8000){state.lastCamBuzz=Date.now();buzz()}}else if(c){$("wCam").classList.remove("on");$("nextCam").textContent=fmtKm(c.d)}else{$("wCam").classList.remove("on");$("nextCam").textContent="\u043d\u0435\u0442"}
var d=nearestAhead(along.dps,lat,lng,700);if(d&&d.d<=600){$("wDps").classList.add("on");$("wDpsMain").textContent="\ud83d\ude93 \u0414\u041f\u0421 \u0447\u0435\u0440\u0435\u0437 "+fmtKm(d.d);$("wDpsSub").textContent=d.o.name||""}else $("wDps").classList.remove("on");
var f=nearestAhead(along.fuel,lat,lng,1200);if(f&&f.d<=900){$("wFuel").classList.add("on");$("wFuelMain").textContent="\u26fd \u0410\u0417\u0421 \u0447\u0435\u0440\u0435\u0437 "+fmtKm(f.d);$("wFuelSub").textContent=f.o.name||""}else $("wFuel").classList.remove("on");
if(state.gps.mode==="live")map.panTo([lat,lng],{animate:true,duration:.25})}
function enterDrive(){state.driving=true;$("setup").classList.add("hide");$("nav").classList.add("on");try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}startWatch();if(state.gps.lat!=null){tick(state.gps.lat,state.gps.lng);map.setView([state.gps.lat,state.gps.lng],17)}else locateOnce().then(function(p){tick(p.lat,p.lng);map.setView([p.lat,p.lng],17)}).catch(function(){})}
function exitDrive(){state.driving=false;$("nav").classList.remove("on");$("setup").classList.remove("hide");["wCam","wDps","wFuel"].forEach(function(id){$(id).classList.remove("on")});try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}}
$("btnGo").onclick=function(){var btn=$("btnGo");btn.disabled=true;btn.textContent="\u0421\u0442\u0440\u043e\u0438\u043c\u2026";var fromP=state.from?Promise.resolve(state.from):geocode($("from").value||"\u044f \u0437\u0434\u0435\u0441\u044c");fromP.then(function(from){state.from=from;setMark("s",[from.lat,from.lng]);return geocode($("to").value).then(function(to){state.to=to;setMark("e",[to.lat,to.lng]);return buildRoute(from,to)})}).then(function(route){state.route=route;drawRoute(route);$("left").textContent=fmtKm(route.distance);return loadAlong(route.coords).then(function(){enterDrive()})}).catch(function(e){alert(e.message||"error")}).then(function(){btn.disabled=false;btn.textContent="\u041f\u043e\u0435\u0445\u0430\u043b\u0438"})};
$("btnStopNav").onclick=exitDrive;
$("to").addEventListener("keydown",function(e){if(e.key==="Enter")$("btnGo").click()});
try{startWatch();locateOnce().catch(function(){$("boot").classList.add("hide")})}catch(e){$("boot").classList.add("hide")}
setTimeout(function(){$("boot").classList.add("hide")},10000);
})();
</script></body></html>
