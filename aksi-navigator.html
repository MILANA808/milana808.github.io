<!DOCTYPE html>
<html lang="ru">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#03060c"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>АКСИ · Навигатор</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>

.label{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:650}
.field{margin-bottom:12px}.field-row{display:flex;gap:8px;align-items:stretch}

.btn-loc{min-width:52px;min-height:52px;border-radius:14px;border:1px solid #1e3a50;background:#132033;color:#9ec9ff;font-size:20px;font-weight:800;cursor:pointer;padding:0 12px}

.actions{display:flex;gap:8px;margin-top:10px}
.hint{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.45}
#st{font-size:12px;color:var(--muted);margin-top:10px}#st b{color:var(--txt)}

#ab{width:64px;height:64px;border-radius:14px;background:#0c1820;border:1px solid #1e3a30;display:flex;align-items:center;justify-content:center;flex-shrink:0}#ab svg{width:48px;height:48px}

</style>
</head>
<body>
<div id="app">
<div id="map"></div>
<div id="boot"><div style="font-weight:700;color:#8a9bb0;font-size:16px">АКСИ · навигатор</div></div>
<div id="toast"></div>
<div id="off">OFFLINE</div>
<div id="setup">
<h1>Куда едем?</h1>
<div class="field">
<div class="label">Откуда</div>
<div class="field-row">
<input type="text" id="from" placeholder="Адрес или «Я здесь»" autocomplete="off"/>
<button type="button" class="btn-loc" id="btnHere" title="Моё место">◎</button>
</div>
</div>
<div class="field">
<div class="label">Куда</div>
<input type="text" id="to" placeholder="Город, улица, адрес" autocomplete="off" enterkeyhint="go"/>
</div>
<button type="button" class="btn-go" id="go">Поехали</button>
<div class="actions">
<button type="button" class="btn-sec" id="resume" style="display:none">Продолжить сохранённый</button>
<button type="button" class="btn-sec" id="share">Ссылка на маршрут</button>
</div>
<div class="hint">Стрелки манёвров · камера за 500 м · АЗС и ДПС · весь маршрут · Live</div>
<div id="st">GPS: <b id="gps">…</b> · точность ±<b id="acc">—</b></div>
</div>
<div id="nav">
<div id="top"><div id="card">
<div id="ab"><svg viewBox="0 0 64 64" fill="none"><path id="ap" d="M32 10 L32 50 M32 10 L18 26 M32 10 L46 26" stroke="#2ee6a8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div id="nb"><svg viewBox="0 0 64 64" fill="none"><path id="np" d="M32 10 L32 50 M32 10 L18 26 M32 10 L46 26" stroke="#8a9bb0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div id="tx"><div id="dist">—</div><div id="turn">По маршруту</div><div id="meta">—</div></div>
</div><div id="bar"><i id="prog"></i></div></div>
<div id="warn"><div class="w cam" id="wCam"></div><div class="w dps" id="wDps"></div><div class="w fuel" id="wFuel"></div></div>
<div id="bot"><div class="row">
<div class="pill">Осталось<b id="left">—</b></div>
<div class="pill">Камера<b id="nCam">—</b></div>
<button type="button" id="ov">Весь путь</button>
<button type="button" id="live">Live</button>
<button type="button" id="stop">Стоп</button>
</div></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

function loadPOI(coords){if(!navigator.onLine)return;poiG.clearLayers();along={cam:[],fuel:[],dps:[]};var step=Math.max(1,Math.floor(coords.length/12)),samples=[];for(var i=0;i<coords.length;i+=step)samples.push(coords[i]);if(samples.length>14)samples=samples.filter(function(_,i){return i%2===0});var parts=[];samples.forEach(function(p){parts.push('node["highway"="speed_camera"](around:160,'+p[0]+','+p[1]+');');parts.push('node["amenity"="fuel"](around:200,'+p[0]+','+p[1]+');');parts.push('node["amenity"="police"](around:220,'+p[0]+','+p[1]+');')});fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent("[out:json][timeout:25];("+parts.join("")+");out body;")}).then(function(r){return r.json()}).then(function(data){var seen={};(data.elements||[]).forEach(function(n){if(n.lat==null)return;var k=n.type+n.id;if(seen[k])return;seen[k]=1;var t=n.tags||{},kind,col;if(t.highway==="speed_camera"){kind="cam";col="#ff3b5c"}else if(t.amenity==="fuel"){kind="fuel";col="#ffc933"}else if(t.amenity==="police"){kind="dps";col="#4d9fff"}else return;var near=1e12;for(var i=0;i<coords.length;i+=Math.max(1,Math.floor(coords.length/60))){var d=dist([n.lat,n.lon],coords[i]);if(d<near)near=d}if(near>280)return;poiG.addLayer(L.marker([n.lat,n.lon],{icon:ico(col)}));along[kind].push({lat:n.lat,lng:n.lon,name:t.name||t.brand||kind})})}).catch(function(){})}
function nearest(lat,lng){var c=S.route.coords,b=0,bd=1e15;for(var i=0;i<c.length;i++){var d=dist([lat,lng],c[i]);if(d<bd){bd=d;b=i}}return{i:b,d:bd}}
function remain(i){var c=S.route.coords,s=0;for(var j=i;j<c.length-1;j++)s+=dist(c[j],c[j+1]);return s}
function nearList(list,lat,lng,max){var best=null,bd=1e15;list.forEach(function(o){var d=dist([lat,lng],[o.lat,o.lng]);if(d<bd){bd=d;best=o}});return best&&bd<=max?{o:best,d:bd}:null}
function stepsAt(lat,lng){var steps=S.route.steps||[],scored=[];for(var i=0;i<steps.length;i++){if(!steps[i].location)continue;scored.push({s:steps[i],d:dist([lat,lng],steps[i].location),i:i})}scored.sort(function(a,b){return a.d-b.d});if(!scored.length)return{cur:null,next:null};var cur=scored[0],next=null;for(var j=0;j<steps.length;j++){if(j>cur.i&&steps[j].location&&steps[j].type!=="arrive"){next={s:steps[j],d:dist([lat,lng],steps[j].location)};break}}return{cur:cur,next:next}}
function tick(lat,lng){var n=nearest(lat,lng),rem=remain(n.i),tot=S.route.distance||1;$("prog").style.width=(Math.max(0,Math.min(1,1-rem/tot))*100).toFixed(1)+"%";$("left").textContent=km(rem);var ord=stepsAt(lat,lng);if(n.d>160){setArr("ap","straight","#f5c542");setArr("np","straight","#8a9bb0");$("dist").textContent=Math.round(n.d)+" \u043c";$("turn").textContent="\u041d\u0430 \u043f\u0443\u0442\u044c";$("meta").textContent=""}else if(rem<45){setArr("ap","arrive");setArr("np","arrive","#8a9bb0");$("dist").textContent="0";$("turn").textContent="\u041f\u0440\u0438\u0435\u0445\u0430\u043b\u0438";$("meta").textContent=""}else if(ord.cur){setArr("ap",mKey(ord.cur.s));$("dist").textContent=km(ord.cur.d);$("turn").textContent=mTxt(ord.cur.s);$("meta").textContent=(ord.cur.s.name?ord.cur.s.name+" \u00b7 ":"")+km(ord.cur.s.distance);if(ord.next){setArr("np",mKey(ord.next.s),"#8a9bb0");$("meta").textContent=$("meta").textContent+" \u2192 "+mTxt(ord.next.s)}else setArr("np","arrive","#8a9bb0")}else{setArr("ap","straight");setArr("np","straight","#8a9bb0");$("dist").textContent=km(rem);$("turn").textContent="\u041f\u0440\u044f\u043c\u043e";$("meta").textContent=""}
var c=nearList(along.cam,lat,lng,900);if(c&&c.d<=500){$("wCam").classList.add("on");$("wCam").textContent="\ud83d\udcf7 \u041a\u0430\u043c\u0435\u0440\u0430 \u0447\u0435\u0440\u0435\u0437 "+km(c.d);$("nCam").textContent=km(c.d);if(Date.now()-S.lastBuzz>9000){S.lastBuzz=Date.now();try{navigator.vibrate&&navigator.vibrate([70,40,70])}catch(e){}}}else{$("wCam").classList.remove("on");$("nCam").textContent=c?km(c.d):"\u043d\u0435\u0442"}
var d=nearList(along.dps,lat,lng,700);if(d&&d.d<=600){$("wDps").classList.add("on");$("wDps").textContent="\ud83d\ude93 \u0414\u041f\u0421 \u0447\u0435\u0440\u0435\u0437 "+km(d.d)}else $("wDps").classList.remove("on");
var f=nearList(along.fuel,lat,lng,1100);if(f&&f.d<=900){$("wFuel").classList.add("on");$("wFuel").textContent="\u26fd \u0410\u0417\u0421 \u0447\u0435\u0440\u0435\u0437 "+km(f.d)}else $("wFuel").classList.remove("on");
if(S.gps.mode==="live"&&!S.overview&&Date.now()-S.lastPan>280){S.lastPan=Date.now();map.panTo([lat,lng],{animate:true,duration:.2})}}
function goDrive(){S.drive=true;S.overview=false;$("setup").classList.add("hide");$("nav").classList.add("on");watch();if(S.gps.lat!=null){tick(S.gps.lat,S.gps.lng);map.setView([S.gps.lat,S.gps.lng],16)}else once().then(function(c){tick(c.latitude,c.longitude);map.setView([c.latitude,c.longitude],16)}).catch(function(){});$("off").classList.toggle("on",!navigator.onLine&&!!S.route)}
function stopDrive(){S.drive=false;S.overview=false;$("nav").classList.remove("on");$("setup").classList.remove("hide");["wCam","wDps","wFuel"].forEach(function(id){$(id).classList.remove("on")})}
function shareStatic(){if(!S.route){toast("\u0421\u043d\u0430\u0447\u0430\u043b\u0430 \u043c\u0430\u0440\u0448\u0440\u0443\u0442");return}var c=S.route.coords,thin=[];for(var i=0;i<c.length;i+=Math.max(1,Math.floor(c.length/70)))thin.push([Math.round(c[i][0]*1e5)/1e5,Math.round(c[i][1]*1e5)/1e5]);var token=btoa(unescape(encodeURIComponent(JSON.stringify({c:thin,d:Math.round(S.route.distance||0),to:S.to&&S.to.name,from:S.from&&S.from.name})))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");var url=location.origin+location.pathname+"#r="+token;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(function(){toast("\u0421\u0441\u044b\u043b\u043a\u0430 \u0441\u043a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u0430")}).catch(function(){prompt("URL",url)});else prompt("URL",url)}
function decodeR(s){try{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return JSON.parse(decodeURIComponent(escape(atob(s))))}catch(e){return null}}
$("btnHere").onclick=useHere;
$("from").addEventListener("input",function(){$("from").dataset.auto="0";S.from=null});
$("go").onclick=function(){var btn=$("go");btn.disabled=true;btn.textContent="\u0421\u0442\u0440\u043e\u0438\u043c\u2026";var fromQ=$("from").value.trim()||"\u044f \u0437\u0434\u0435\u0441\u044c";var toQ=$("to").value.trim();if(!toQ){toast("\u0412\u0432\u0435\u0434\u0438\u0442\u0435 \u00ab\u041a\u0443\u0434\u0430\u00bb");btn.disabled=false;btn.textContent="\u041f\u043e\u0435\u0445\u0430\u043b\u0438";return}geo(fromQ).then(function(from){S.from=from;mark("s",[from.lat,from.lng]);$("from").value=from.name||fromQ;return geo(toQ).then(function(to){S.to=to;mark("e",[to.lat,to.lng]);$("to").value=to.name||toQ;return buildRoute(from,to)})}).then(function(rt){S.route=rt;draw(rt);save();$("left").textContent=km(rt.distance);goDrive();loadPOI(rt.coords)}).catch(function(e){toast(e.message||"\u041e\u0448\u0438\u0431\u043a\u0430")}).then(function(){btn.disabled=false;btn.textContent="\u041f\u043e\u0435\u0445\u0430\u043b\u0438"})};
$("stop").onclick=stopDrive;
$("ov").onclick=function(){if(!S.route||!routeLayer)return;S.overview=!S.overview;if(S.overview){map.fitBounds(routeLayer.getBounds(),{padding:[40,40]});$("ov").textContent="\u0417\u0430 \u043c\u043d\u043e\u0439"}else{$("ov").textContent="\u0412\u0435\u0441\u044c \u043f\u0443\u0442\u044c";if(S.gps.lat!=null)map.setView([S.gps.lat,S.gps.lng],16)}};
$("share").onclick=shareStatic;
$("live").onclick=function(){toast("Live: \u0441\u043d\u0430\u0447\u0430\u043b\u0430 \u043f\u043e\u0441\u0442\u0440\u043e\u0439\u0442\u0435 \u043c\u0430\u0440\u0448\u0440\u0443\u0442")};
$("to").addEventListener("keydown",function(e){if(e.key==="Enter")$("go").click()});
$("from").addEventListener("keydown",function(e){if(e.key==="Enter")$("to").focus()});
var saved=loadSaved();if(saved){$("resume").style.display="block";$("resume").onclick=function(){S.route=saved.route;S.from=saved.from;S.to=saved.to;if(S.from&&S.from.lat)mark("s",[S.from.lat,S.from.lng]);if(S.to&&S.to.lat)mark("e",[S.to.lat,S.to.lng]);draw(S.route);$("to").value=(S.to&&S.to.name)||"";$("from").value=(S.from&&S.from.name)||"\u042f \u0437\u0434\u0435\u0441\u044c";goDrive();toast("\u0418\u0437 \u043f\u0430\u043c\u044f\u0442\u0438")}}
function hash(){var h=location.hash||"";if(h.indexOf("#r=")===0){var d=decodeR(h.slice(3));if(d&&d.c){S.route={coords:d.c,steps:[],distance:d.d||0};S.to={name:d.to||""};draw(S.route);$("to").value=d.to||"";toast("\u041f\u043e \u0441\u0441\u044b\u043b\u043a\u0435");$("boot").classList.add("hide")}}}
$("setup").classList.remove("hide");$("nav").classList.remove("on");
try{watch();once().catch(function(){$("boot").classList.add("hide")})}catch(e){$("boot").classList.add("hide")}
hash();window.addEventListener("hashchange",hash);
setTimeout(function(){$("boot").classList.add("hide")},4000);
setTimeout(function(){try{$("to").focus()}catch(e){}},500);
window.__AKSI_NAV__=1;
})();
}
