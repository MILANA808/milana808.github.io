<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0b1220"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>АКСИ · Навигатор Россия</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --bg:#0b1220;--panel:#121a2b;--card:#182236;--line:#2a3a55;
  --txt:#eef3fb;--muted:#9aabbf;--acc:#2ee6a8;--acc2:#3b82f6;
  --warn:#f5c542;--bad:#f07178;--ok:#2ee6a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
#map{flex:1;min-height:120px;width:100%;background:#0a101a}
#banner{
  display:none;flex-shrink:0;padding:8px 12px;font-size:13px;font-weight:600;
  background:#3a2e0a;color:var(--warn);border-bottom:1px solid #5a4a12;text-align:center
}
#banner.on{display:block}
#banner.bad{background:#3a1518;color:#ffb4b8;border-color:#5a2025}
#banner.ok{background:#0f2e24;color:var(--ok);border-color:#1a4d3c}
#sheet{
  flex-shrink:0;background:var(--panel);border-top:1px solid var(--line);
  padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:8px;max-height:48vh
}
.row{display:flex;gap:8px;align-items:center}
input{
  flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--txt);padding:10px 12px;font:inherit;font-size:15px
}
input::placeholder{color:var(--muted)}
button{
  min-height:44px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--txt);font:inherit;font-size:14px;font-weight:650;
  padding:10px 12px;cursor:pointer;white-space:nowrap
}
button.primary{background:#14352c;border-color:var(--acc);color:var(--acc)}
button.blue{background:#15253f;border-color:var(--acc2);color:#93c5fd}
button:disabled{opacity:.4}
#guide{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px
}
#guide .turn{font-size:18px;font-weight:700;line-height:1.25}
#guide .meta{font-size:12px;color:var(--muted);margin-top:6px}
#guide .bar{height:4px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
#guide .bar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--acc),#7dffc8);transition:width .3s}
#status{font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
#status b{color:var(--txt)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
.dot.on{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
#fab{
  position:absolute;right:12px;bottom:12px;z-index:1000;display:flex;flex-direction:column;gap:8px
}
#fab button{
  width:46px;height:46px;border-radius:50%;padding:0;font-size:18px;
  box-shadow:0 6px 18px rgba(0,0,0,.4);background:var(--panel);border:1px solid var(--line)
}
.leaflet-control-attribution{font-size:9px!important;background:rgba(11,18,32,.75)!important;color:#9aabbf!important}
</style>
</head>
<body>
<div id="app">
  <div id="banner"></div>
  <div id="map"></div>
  <div id="fab">
    <button type="button" id="btnLoc" title="Моё место">◎</button>
  </div>
  <div id="sheet">
    <div id="guide">
      <div class="turn" id="turn">АКСИ · Навигатор по России</div>
      <div class="meta" id="meta">GPS может пропасть — маршрут не сбросится. «Откуда» можно: «я здесь».</div>
      <div class="bar"><i id="prog"></i></div>
    </div>
    <div class="row">
      <input id="from" placeholder="Откуда (адрес или «я здесь»)" autocomplete="off"/>
    </div>
    <div class="row">
      <input id="to" placeholder="Куда (город, улица, место в РФ)" autocomplete="off"/>
    </div>
    <div class="row">
      <button type="button" class="primary" id="btnGo" style="flex:1.4">Построить</button>
      <button type="button" class="blue" id="btnNav" style="flex:1" disabled>Вести</button>
      <button type="button" id="btnStop" disabled>Стоп</button>
    </div>
    <div id="status">
      <span><span class="dot" id="dotGps"></span> GPS: <b id="gpsTxt">ожидание</b></span>
      <span>осталось <b id="left">—</b></span>
      <span>ETA <b id="eta">—</b></span>
    </div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){

var map=L.map("map",{zoomControl:true}).setView([55.75,37.62],5);

var routeLayer=null,startMarker=null,endMarker=null,userMarker=null,userAccCircle=null;
var state={from:null,to:null,route:null,navigating:false,gps:{ok:false,lat:null,lng:null,acc:null,ts:0,lastOk:0,mode:"none"},progressIdx:0,watchId:null};
var el={banner:document.getElementById("banner"),turn:document.getElementById("turn"),meta:document.getElementById("meta"),prog:document.getElementById("prog"),from:document.getElementById("from"),to:document.getElementById("to"),btnGo:document.getElementById("btnGo"),btnNav:document.getElementById("btnNav"),btnStop:document.getElementById("btnStop"),dotGps:document.getElementById("dotGps"),gpsTxt:document.getElementById("gpsTxt"),left:document.getElementById("left"),eta:document.getElementById("eta")};
function banner(msg,kind){if(!msg){el.banner.className="";el.banner.style.display="none";el.banner.textContent="";return}el.banner.style.display="block";el.banner.className="on"+(kind?" "+kind:"");el.banner.textContent=msg}
function fmtKm(m){if(m==null||isNaN(m))return"\u2014";if(m<1000)return Math.round(m)+" \u043c";return(m/1000).toFixed(m<10000?1:0)+" \u043a\u043c"}

function buildRoute(from,to){var url="https://router.project-osrm.org/route/v1/driving/"+from.lng+","+from.lat+";"+to.lng+","+to.lat+"?overview=full&geometries=geojson&steps=true";
return fetch(url).then(function(r){if(!r.ok)throw new Error("\u041c\u0430\u0440\u0448\u0440\u0443\u0442\u0438\u0437\u0430\u0442\u043e\u0440 \u043d\u0435\u0434\u043e\u0441\u0442\u0443\u043f\u0435\u043d");return r.json()}).then(function(data){if(!data.routes||!data.routes.length)throw new Error("\u041c\u0430\u0440\u0448\u0440\u0443\u0442 \u043d\u0435 \u043d\u0430\u0439\u0434\u0435\u043d");var r=data.routes[0];var coords=r.geometry.coordinates.map(function(c){return[c[1],c[0]]});var steps=[];(r.legs||[]).forEach(function(leg){(leg.steps||[]).forEach(function(s){var name=(s.name&&s.name.length)?s.name:"\u0434\u043e\u0440\u043e\u0433\u0430";var man=(s.maneuver&&s.maneuver.instruction)||"";var type=(s.maneuver&&s.maneuver.type)||"";var mod=(s.maneuver&&s.maneuver.modifier)||"";steps.push({distance:s.distance||0,duration:s.duration||0,name:name,instruction:man||humanManeuver(type,mod,name),location:s.maneuver&&s.maneuver.location?[s.maneuver.location[1],s.maneuver.location[0]]:null})})});return{coords:coords,steps:steps,distance:r.distance,duration:r.duration}})}
function humanManeuver(type,mod,road){var t={"turn":"\u041f\u043e\u0432\u043e\u0440\u043e\u0442","new name":"\u041f\u0440\u043e\u0434\u043e\u043b\u0436\u0430\u0439\u0442\u0435","depart":"\u041d\u0430\u0447\u0430\u043b\u043e","arrive":"\u041f\u0440\u0438\u0431\u044b\u0442\u0438\u0435","merge":"\u0421\u043b\u0438\u044f\u043d\u0438\u0435","on ramp":"\u0421\u044a\u0435\u0437\u0434 \u043d\u0430","off ramp":"\u0421\u044a\u0435\u0437\u0434","fork":"\u0420\u0430\u0437\u0432\u0438\u043b\u043a\u0430","end of road":"\u041a\u043e\u043d\u0435\u0446 \u0434\u043e\u0440\u043e\u0433\u0438","continue":"\u041f\u0440\u044f\u043c\u043e","roundabout":"\u041a\u0440\u0443\u0433\u043e\u0432\u043e\u0435","rotary":"\u041a\u043e\u043b\u044c\u0446\u043e"}[type]||"\u0414\u0432\u0438\u0436\u0435\u043d\u0438\u0435";var m={"left":"\u043d\u0430\u043b\u0435\u0432\u043e","right":"\u043d\u0430\u043f\u0440\u0430\u0432\u043e","slight left":"\u043f\u043b\u0430\u0432\u043d\u043e \u043d\u0430\u043b\u0435\u0432\u043e","slight right":"\u043f\u043b\u0430\u0432\u043d\u043e \u043d\u0430\u043f\u0440\u0430\u0432\u043e","sharp left":"\u0440\u0435\u0437\u043a\u043e \u043d\u0430\u043b\u0435\u0432\u043e","sharp right":"\u0440\u0435\u0437\u043a\u043e \u043d\u0430\u043f\u0440\u0430\u0432\u043e","straight":"\u043f\u0440\u044f\u043c\u043e","uturn":"\u0440\u0430\u0437\u0432\u043e\u0440\u043e\u0442"}[mod]||"";return(t+(m?" "+m:"")+(road?" \u00b7 "+road:"")).trim()}

function currentStep(lat,lng){var steps=state.route.steps||[];if(!steps.length)return null;var best=steps[0],bestD=1e15;for(var i=0;i<steps.length;i++){var s=steps[i];if(!s.location)continue;var d=distM([lat,lng],s.location);if(d<bestD){bestD=d;best=s}}return best}
function tickNavigation(lat,lng){var near=nearestOnRoute(lat,lng);state.progressIdx=near.idx;var rem=remainingFrom(near.idx),total=state.route.distance||1,done=Math.max(0,Math.min(1,1-rem/total));el.prog.style.width=(done*100).toFixed(1)+"%";el.left.textContent=fmtKm(rem);el.eta.textContent=fmtMin(rem/13.5);var step=currentStep(lat,lng);if(near.dist>120){el.turn.textContent="\u0412 \u0441\u0442\u043e\u0440\u043e\u043d\u0435 \u043e\u0442 \u043c\u0430\u0440\u0448\u0440\u0443\u0442\u0430 \u00b7 "+Math.round(near.dist)+" \u043c";el.meta.textContent="\u041c\u0430\u0440\u0448\u0440\u0443\u0442 \u0441\u043e\u0445\u0440\u0430\u043d\u0451\u043d. \u0412\u0435\u0440\u043d\u0438\u0442\u0435\u0441\u044c \u043d\u0430 \u043b\u0438\u043d\u0438\u044e \u0438\u043b\u0438 \u043f\u0435\u0440\u0435\u0441\u0442\u0440\u043e\u0439\u0442\u0435."}else if(rem<40){el.turn.textContent="\u041f\u0440\u0438\u0431\u044b\u0442\u0438\u0435";el.meta.textContent="\u0412\u044b \u0443 \u0446\u0435\u043b\u0438";banner("\u041f\u0440\u0438\u0431\u044b\u043b\u0438","ok")}else if(step){el.turn.textContent=step.instruction;el.meta.textContent=fmtKm(step.distance)+" \u00b7 "+(step.name||"")}else{el.turn.textContent="\u0414\u0432\u0438\u0433\u0430\u0439\u0442\u0435\u0441\u044c \u043f\u043e \u043c\u0430\u0440\u0448\u0440\u0443\u0442\u0443";el.meta.textContent="\u041e\u0441\u0442\u0430\u043b\u043e\u0441\u044c "+fmtKm(rem)}if(state.gps.mode==="live")map.panTo([lat,lng],{animate:true,duration:.5})}
el.btnGo.onclick=function(){el.btnGo.disabled=true;banner("\u0421\u0442\u0440\u043e\u0438\u043c \u043c\u0430\u0440\u0448\u0440\u0443\u0442\u2026");el.turn.textContent="\u041f\u043e\u0438\u0441\u043a\u2026";Promise.all([geocode(el.from.value),geocode(el.to.value)]).then(function(pair){state.from=pair[0];state.to=pair[1];setMarker("start",[state.from.lat,state.from.lng],state.from.name);setMarker("end",[state.to.lat,state.to.lng],state.to.name);return buildRoute(state.from,state.to)}).then(function(route){state.route=route;state.progressIdx=0;drawRoute(route);el.btnNav.disabled=false;el.left.textContent=fmtKm(route.distance);el.eta.textContent=fmtMin(route.duration);el.turn.textContent="\u041c\u0430\u0440\u0448\u0440\u0443\u0442 \u0433\u043e\u0442\u043e\u0432 \u00b7 "+fmtKm(route.distance);el.meta.textContent=(state.from.name||"").split(",")[0]+" \u2192 "+(state.to.name||"").split(",")[0];el.prog.style.width="0%";banner("\u041c\u0430\u0440\u0448\u0440\u0443\u0442 \u043f\u043e\u0441\u0442\u0440\u043e\u0435\u043d. \u041d\u0430\u0436\u043c\u0438\u0442\u0435 \u00ab\u0412\u0435\u0441\u0442\u0438\u00bb.","ok");setTimeout(function(){banner("")},2500)}).catch(function(e){el.turn.textContent="\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c";el.meta.textContent=(e&&e.message)?e.message:"\u041e\u0448\u0438\u0431\u043a\u0430";banner(el.meta.textContent,"bad")}).then(function(){el.btnGo.disabled=false})};
el.btnNav.onclick=function(){if(!state.route)return;state.navigating=true;el.btnStop.disabled=false;el.btnNav.disabled=true;startWatch();el.turn.textContent="\u041d\u0430\u0432\u0438\u0433\u0430\u0446\u0438\u044f";el.meta.textContent="\u0415\u0441\u043b\u0438 GPS \u043f\u0440\u043e\u043f\u0430\u0434\u0451\u0442 \u2014 \u043c\u0430\u0440\u0448\u0440\u0443\u0442 \u043e\u0441\u0442\u0430\u043d\u0435\u0442\u0441\u044f";if(state.gps.lat!=null){tickNavigation(state.gps.lat,state.gps.lng);map.setView([state.gps.lat,state.gps.lng],Math.max(map.getZoom(),15))}else{locateOnce().then(function(p){tickNavigation(p.lat,p.lng);map.setView([p.lat,p.lng],15)}).catch(function(){banner("\u041d\u0435\u0442 GPS \u2014 \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u043c \u043c\u0430\u0440\u0448\u0440\u0443\u0442","warn");if(routeLayer)map.fitBounds(routeLayer.getBounds(),{padding:[40,40]})})}};
el.btnStop.onclick=function(){state.navigating=false;el.btnStop.disabled=true;el.btnNav.disabled=!state.route;banner("");el.turn.textContent=state.route?"\u041c\u0430\u0440\u0448\u0440\u0443\u0442 \u043d\u0430 \u043a\u0430\u0440\u0442\u0435":"\u0410\u041a\u0421\u0418";el.meta.textContent="\u041d\u0430\u0432\u0438\u0433\u0430\u0446\u0438\u044f \u043e\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u0430. \u041c\u0430\u0440\u0448\u0440\u0443\u0442 \u043d\u0435 \u0443\u0434\u0430\u043b\u0451\u043d."};
document.getElementById("btnLoc").onclick=function(){locateOnce().then(function(p){map.setView([p.lat,p.lng],Math.max(map.getZoom(),15))}).catch(function(){})};
[el.from,el.to].forEach(function(inp){inp.addEventListener("keydown",function(e){if(e.key==="Enter")el.btnGo.click()})});
try{startWatch()}catch(e){}
setGpsUi("none","\u043e\u0436\u0438\u0434\u0430\u043d\u0438\u0435");
})();
</script>
