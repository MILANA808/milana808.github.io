<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#03060c"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>АКСИ · Навигатор</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>

#app{position:relative;height:100%;height:100dvh}#map{position:absolute;inset:0}
#setup{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding:14px 14px calc(14px + env(safe-area-inset-bottom,0));backdrop-filter:blur(16px)}#setup.hide{display:none}
h1{font-size:15px;font-weight:800;margin-bottom:10px}.row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
input{flex:1;min-height:48px;border-radius:14px;border:1px solid var(--line);background:#0c121c;color:var(--txt);padding:12px 14px;font:inherit;font-size:16px}
button{min-height:48px;border-radius:14px;border:1px solid var(--line);background:#0c121c;color:var(--txt);font:inherit;font-size:14px;font-weight:800;padding:0 14px;cursor:pointer}
button.go{flex:1;background:#0f2f26;border-color:var(--acc);color:var(--acc);font-size:17px}button:disabled{opacity:.4}
.hint{font-size:12px;color:var(--muted);margin-top:6px}#st{font-size:11px;color:var(--muted);margin-top:8px}#st b{color:var(--txt)}
#nav{position:absolute;inset:0;z-index:30;pointer-events:none;display:none}#nav.on{display:block}

#ab{width:64px;height:64px;border-radius:14px;background:#0c1820;border:1px solid #1e3a30;display:flex;align-items:center;justify-content:center;flex-shrink:0}#ab svg{width:48px;height:48px}

</div>
<div id="nav">

</div><div id="bar"><i id="prog"></i></div></div>

</div></div></div></div>

var c=nearList(along.cam,lat,lng,900);if(c&&c.d<=500){$("wCam").classList.add("on");$("wCam").textContent="\ud83d\udcf7 \u041a\u0430\u043c\u0435\u0440\u0430 \u0447\u0435\u0440\u0435\u0437 "+km(c.d);$("nCam").textContent=km(c.d);if(Date.now()-S.lastBuzz>9000){S.lastBuzz=Date.now();try{navigator.vibrate&&navigator.vibrate([70,40,70])}catch(e){}}}else{$("wCam").classList.remove("on");$("nCam").textContent=c?km(c.d):"\u043d\u0435\u0442"}
var d=nearList(along.dps,lat,lng,700);if(d&&d.d<=600){$("wDps").classList.add("on");$("wDps").textContent="\ud83d\ude93 \u0414\u041f\u0421 \u0447\u0435\u0440\u0435\u0437 "+km(d.d)}else $("wDps").classList.remove("on");
var f=nearList(along.fuel,lat,lng,1100);if(f&&f.d<=900){$("wFuel").classList.add("on");$("wFuel").textContent="\u26fd \u0410\u0417\u0421 \u0447\u0435\u0440\u0435\u0437 "+km(f.d)}else $("wFuel").classList.remove("on");
if(S.gps.mode==="live"&&!S.overview&&Date.now()-S.lastPan>280){S.lastPan=Date.now();map.panTo([lat,lng],{animate:true,duration:.2})}}
function goDrive(){S.drive=true;S.overview=false;$("setup").classList.add("hide");$("nav").classList.add("on");watch();if(S.gps.lat!=null){tick(S.gps.lat,S.gps.lng);map.setView([S.gps.lat,S.gps.lng],16)}else once().then(function(c){tick(c.latitude,c.longitude);map.setView([c.latitude,c.longitude],16)}).catch(function(){});$("off").classList.toggle("on",!navigator.onLine&&!!S.route)}
function stopDrive(){S.drive=false;S.overview=false;$("nav").classList.remove("on");$("setup").classList.remove("hide");["wCam","wDps","wFuel"].forEach(function(id){$(id).classList.remove("on")})}
function shareStatic(){if(!S.route){toast("\u0421\u043d\u0430\u0447\u0430\u043b\u0430 \u043c\u0430\u0440\u0448\u0440\u0443\u0442");return}var c=S.route.coords,thin=[];for(var i=0;i<c.length;i+=Math.max(1,Math.floor(c.length/70)))thin.push([Math.round(c[i][0]*1e5)/1e5,Math.round(c[i][1]*1e5)/1e5]);var payload={c:thin,d:Math.round(S.route.distance||0),to:S.to&&S.to.name,from:S.from&&S.from.name};var token=btoa(unescape(encodeURIComponent(JSON.stringify(payload)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");var url=location.origin+location.pathname+"#r="+token;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(function(){toast("\u0421\u0441\u044b\u043b\u043a\u0430 \u0441\u043a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u0430")}).catch(function(){prompt("URL",url)});else prompt("URL",url)}
function decodeR(s){try{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return JSON.parse(decodeURIComponent(escape(atob(s))))}catch(e){return null}}
function loadPeer(){return new Promise(function(res,rej){if(typeof Peer!=="undefined")return res();var s=document.createElement("script");s.src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";s.onload=function(){res()};s.onerror=function(){rej(new Error("PeerJS"))};document.head.appendChild(s)})}
function ensurePeer(){return loadPeer().then(function(){return new Promise(function(res,rej){if(S.peer&&S.pid)return res(S.pid);var p=new Peer({debug:0});S.peer=p;p.on("open",function(id){S.pid=id;res(id)});p.on("error",function(e){toast("Live: "+(e.type||"err"))});p.on("connection",function(conn){S.conns.push(conn);conn.on("open",function(){toast("\u0417\u0440\u0438\u0442\u0435\u043b\u044c");if(S.route)conn.send(JSON.stringify({t:"route",route:S.route,from:S.from,to:S.to}));if(S.gps.lat!=null)conn.send(JSON.stringify({t:"pos",lat:S.gps.lat,lng:S.gps.lng}))})})})})}
function startLive(){if(!S.route){toast("\u041d\u0443\u0436\u0435\u043d \u043c\u0430\u0440\u0448\u0440\u0443\u0442");return}ensurePeer().then(function(id){S.host=true;var url=location.origin+location.pathname+"#live="+id;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(function(){toast("Live \u0441\u043a\u043e\u043f\u0438\u0440\u043e\u0432\u0430\u043d\u0430")}).catch(function(){prompt("Live",url)});else prompt("Live",url)}).catch(function(){toast("Live fail")})}
function joinLive(id){S.viewer=true;$("setup").classList.add("hide");$("boot").classList.remove("hide");ensurePeer().then(function(){var conn=S.peer.connect(id,{reliable:true});conn.on("open",function(){toast("OK");$("boot").classList.add("hide")});conn.on("data",function(raw){try{var m=typeof raw==="string"?JSON.parse(raw):raw;if(m.t==="route"&&m.route){S.route=m.route;S.from=m.from;S.to=m.to;draw(S.route)}if(m.t==="pos"){if(!liveM)liveM=L.circleMarker([m.lat,m.lng],{radius:9,color:"#fff",weight:2,fillColor:"#ff3b5c",fillOpacity:1}).addTo(map);else liveM.setLatLng([m.lat,m.lng]);map.panTo([m.lat,m.lng]);$("boot").classList.add("hide")}}catch(e){}})}).catch(function(){toast("fail");$("boot").classList.add("hide")})}
$("go").onclick=function(){var btn=$("go");btn.disabled=true;btn.textContent="\u2026";var fp=S.from?Promise.resolve(S.from):geo($("from").value||"\u044f \u0437\u0434\u0435\u0441\u044c");fp.then(function(from){S.from=from;mark("s",[from.lat,from.lng]);return geo($("to").value).then(function(to){S.to=to;mark("e",[to.lat,to.lng]);return route(from,to)})}).then(function(rt){S.route=rt;draw(rt);save();$("left").textContent=km(rt.distance);goDrive();loadPOI(rt.coords)}).catch(function(e){toast(e.message||"err")}).then(function(){btn.disabled=false;btn.textContent="\u041f\u043e\u0435\u0445\u0430\u043b\u0438"})};
$("stop").onclick=stopDrive;
$("ov").onclick=function(){if(!S.route||!routeLayer)return;S.overview=!S.overview;if(S.overview){map.fitBounds(routeLayer.getBounds(),{padding:[40,40]});$("ov").textContent="\u0417\u0430 \u043c\u043d\u043e\u0439";toast("\u0412\u0435\u0441\u044c \u043f\u0443\u0442\u044c")}else{$("ov").textContent="\u0412\u0435\u0441\u044c \u043f\u0443\u0442\u044c";if(S.gps.lat!=null)map.setView([S.gps.lat,S.gps.lng],16);toast("\u0421\u043b\u0435\u0434\u043e\u0432\u0430\u043d\u0438\u0435")}};
$("share").onclick=shareStatic;$("live").onclick=startLive;
$("to").addEventListener("keydown",function(e){if(e.key==="Enter")$("go").click()});
var saved=loadSaved();if(saved){$("resume").style.display="block";$("resume").onclick=function(){S.route=saved.route;S.from=saved.from;S.to=saved.to;if(S.from&&S.from.lat)mark("s",[S.from.lat,S.from.lng]);if(S.to&&S.to.lat)mark("e",[S.to.lat,S.to.lng]);draw(S.route);$("to").value=(S.to&&S.to.name)||"";goDrive();toast("\u0418\u0437 \u043f\u0430\u043c\u044f\u0442\u0438")}}
function hash(){var h=location.hash||"";if(h.indexOf("#live=")===0)joinLive(h.slice(6).trim());else if(h.indexOf("#r=")===0){var d=decodeR(h.slice(3));if(d&&d.c){S.route={coords:d.c,steps:[],distance:d.d||0};S.to={name:d.to||""};draw(S.route);$("to").value=d.to||"";toast("\u041f\u043e \u0441\u0441\u044b\u043b\u043a\u0435");$("boot").classList.add("hide")}}}
try{watch();once().catch(function(){$("boot").classList.add("hide")})}catch(e){$("boot").classList.add("hide")}
hash();window.addEventListener("hashchange",hash);
window.addEventListener("online",function(){$("off").classList.remove("on")});
window.addEventListener("offline",function(){if(S.route)$("off").classList.add("on")});
setTimeout(function(){$("boot").classList.add("hide")},6000);
})();
