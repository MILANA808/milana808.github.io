<html lang="ru">

<style>

*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}#app{display:flex;flex-direction:column;height:100%;height:100dvh}header{flex-shrink:0;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}header .title{font-size:14px;font-weight:650}header .pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pill{font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}.pill.on{border-color:var(--acc);color:var(--acc);background:var(--acc-dim)}#stage{flex:1;position:relative;min-height:0;background:#0a0e14}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas.drag{cursor:grabbing}#float{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5}#float>*{pointer-events:auto;max-width:520px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(0,0,0,.35)}.card .k{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.card .v{font-size:16px;font-weight:600;margin-top:6px;line-height:1.3}.card .s{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}#progress{height:4px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}#progress>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--acc),#7dffc8);border-radius:4px;transition:width .25s ease}#steps{max-height:0;overflow:hidden;transition:max-height .3s ease}#steps.open{max-height:160px;margin-top:10px;overflow-y:auto}#steps ol{list-style:none;font-size:12px}#steps li{padding:6px 8px;border-radius:8px;color:var(--muted);displ </head>
<body>
<div id="app">
<header>
<div class="title">АКСИ · Навигатор</div>
<div class="pills">
<span class="pill on" id="pillOff">OFFLINE</span>
<span class="pill" id="pillGps">NO GPS</span>
<span class="pill" id="pillComp">COMPASS</span>
</div>
</header>
<div id="stage">
<canvas id="map"></canvas>
<div id="float"><div class="card">
<div class="k" id="kLabel">Маршрут</div>
<div class="v" id="instr">Тапни точку А (старт), затем Б (финиш)</div>

<div id="steps"><ol id="stepList"></ol></div>
</div></div>
<div id="zoom">
<button type="button" id="zIn">+</button>
<button type="button" id="zOut">−</button>
<button type="button" id="zFit" style="font-size:12px">⊡</button>
</div>
<div id="compass"><div id="compass-ring"><span class="lbl">N</span><div id="needle"></div></div></div>
</div>
<div id="bar">
<div class="stats">
<span>осталось <b id="remain">—</b></span>
<span>весь путь <b id="total">—</b></span>
<span>шаг <b id="stepN">—</b></span>
</div>
<div class="row">
<button type="button" class="act" id="btnA">Старт А</button>
<button type="button" class="act blue" id="btnB">Финиш Б</button>
<button type="button" class="act ghost" id="btnSteps">Шаги</button>
<button type="button" class="act ghost" id="btnClear">Сброс</button>
</div>
<div class="row">
<button type="button" class="act primary" id="btnNext" disabled>Я на точке · дальше</button>
<button type="button" class="act" id="btnComp">Компас</button>
</div>
</div>
</div>
<script>
(function(){

var UNIT_M=2.4,adj={};Object.keys(NODES).forEach(function(k){adj[k]=[]});

function astar(start,goal){if(start===goal)return{path:[start],cost:0};var open=[{id:start,f:0}],came={},g={};g[start]=0;var closed={},guard=0;

var canvas=document.getElementById("map"),ctx=canvas.getContext("2d");
var vw=0,vh=0,dpr=1,scale=1,ox=0,oy=0,minScale=.5,maxScale=4;
var dragging=false,lastX=0,lastY=0,startId=null,endId=null,route=null,step=0,pickMode="start",heading=null,compassOn=false,stepsOpen=false,pulse=0;
function worldToScreen(x,y){return{x:x*scale+ox,y:y*scale+oy}}

function nearest(sx,sy){var best=null,bestD=1e12,hit=28;Object.keys(NODES).forEach(function(id){var p=worldToScreen(NODES[id].x,NODES[id].y),dx=p.x-sx,dy=p.y-sy,d=dx*dx+dy*dy;if(d<bestD){bestD=d;best=id}});return bestD<=hit*hit?best:null}
function bearing(aId,bId){var a=NODES[aId],b=NODES[bId],ang=Math.atan2(b.x-a.x,-(b.y-a.y))*180/Math.PI;return(ang+360)%360}

function updateUI(){var instr=document.getElementById("instr"),sub=document.getElementById("sub"),kLabel=document.getElementById("kLabel"),remain=document.getElementById("remain"),total=document.getElementById("total"),stepN=document.getElementById("stepN"),btnNext=document.getElementById("btnNext"),bar=document.getElementById("progBar"),list=document.getElementById("stepList");list.innerHTML="";
if(!startId){kLabel.textContent="Старт";instr.textContent="Тапни точку А на карте";sub.textContent="Без GPS: ты подтверждаешь прибытие";remain.textContent=total.textContent=stepN.textContent="—";btnNext.disabled=true;bar.style.width="0%";return}
if(!endId){kLabel.textContent="Финиш";instr.textContent="Старт: «"+NODES[startId].name+"». Выбери Б";sub.textContent="Маршрут посчитается сразу";remain.textContent=total.textContent=stepN.textContent="—";btnNext.disabled=true;bar.style.width="0%";return}

var path=route.path,segs=path.length-1;total.textContent=Math.round(route.cost)+" м";remain.textContent=Math.round(remainMeters())+" м";stepN.textContent=Math.min(step+1,segs)+" / "+segs;bar.style.width=(segs?(step/segs)*100:0)+"%";

if(step>=segs){kLabel.textContent="Финиш";instr.textContent="Ты на месте · «"+NODES[path[path.length-1]].name+"»";sub.textContent="Пройдено "+Math.round(route.cost)+" м";btnNext.disabled=true;bar.style.width="100%"}else{kLabel.textContent="Сейчас";var prev=step>0?path[step-1]:null;instr.textContent=turnPhrase(prev,path[step],path[step+1]);sub.textContent="Точка: «"+NODES[path[step]].name+"»";btnNext.disabled=false}updateNeedle()}
function updateNeedle(){var needle=document.getElementById("needle");if(!route||step>=route.path.length-1){needle.style.transform="rotate(0deg)";return}var target=bearing(route.path[step],route.path[step+1]),rot=heading==null?target:(target-heading);needle.style.transform="rotate("+rot+"deg)"}

if(route&&route.path.length>1){ctx.strokeStyle="rgba(46,230,168,.25)";ctx.lineWidth=10/scale;ctx.beginPath();route.path.forEach(function(id,i){var n=NODES[id];if(i===0)ctx.moveTo(n.x,n.y);else ctx.lineTo(n.x,n.y)});ctx.stroke();ctx.strokeStyle="#2ee6a8";ctx.lineWidth=4/scale;ctx.beginPath();route.path.forEach(function(id,i){var n=NODES[id];if(i===0)ctx.moveTo(n.x,n.y);else ctx.lineTo(n.x,n.y)});ctx.stroke();

Object.keys(NODES).forEach(function(id){var n=NODES[id],isS=id===startId,isE=id===endId,onR=route&&route.path.indexOf(id)>=0,isCur=route&&route.path[step]===id,r=isCur?7:5.5;if(isCur){ctx.beginPath();ctx.fillStyle="rgba(245,197,66,"+(0.15+0.1*Math.sin(pulse))+")";ctx.arc(n.x,n.y,14+2*Math.sin(pulse),0,Math.PI*2);ctx.fill()}ctx.beginPath();ctx.fillStyle=isCur?"#f5c542":isS?"#2ee6a8":isE?"#5ba4e8":onR?"#1a4d3c":"#141b24";ctx.strokeStyle=isCur?"#f5c542":isS?"#2ee6a8":isE?"#5ba4e8":"#5a6a7c";ctx.lineWidth=2/scale;ctx.arc(n.x,n.y,r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=isCur||isS||isE?"#edf2f7":"#8b9aaf";ctx.font=(11/scale)+"px system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="bottom";ctx.fillText(n.name,n.x,n.y-r-3)});ctx.restore()}
var downX=0,downY=0,moved=false;

function onOrient(e){var h=null;if(typeof e.webkitCompassHeading==="number")h=e.webkitCompassHeading;else if(typeof e.alpha==="number")h=(360-e.alpha)%360;if(h==null||isNaN(h))return;heading=h;document.getElementById("pillComp").classList.add("on");updateNeedle()}
document.getElementById("btnComp").onclick=function(){if(compassOn)return;function bind(){window.addEventListener("deviceorientationabsolute",onOrient,true);window.addEventListener("deviceorientation",onOrient,true);compassOn=true;document.getElementById("btnComp").textContent="Компас \u2713"}if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){DeviceOrientationEvent.requestPermission().then(function(s){if(s==="granted")bind()}).catch(function(){})}else bind()};
function tick(){pulse+=.08;if(route)draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
window.addEventListener("resize",resize);resize();updateUI();
})();
</script>
