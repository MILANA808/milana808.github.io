<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#05080f"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>АКСИ · Путь</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;height:100dvh;width:100%}
#map{position:absolute;inset:0;z-index:0;background:#05080f}
#banner{position:absolute;left:0;right:0;top:0;z-index:20;display:none;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0));font-size:13px;font-weight:700;text-align:center;background:rgba(50,30,8,.95);color:#ffd666;backdrop-filter:blur(8px)}
#banner.on{display:block}#banner.cam{background:rgba(60,12,20,.95);color:#ffb0b8}#banner.ok{background:rgba(10,40,30,.95);color:#7dffc8}#banner.bad{background:rgba(60,12,20,.95);color:#ffb0b8}

.alert.fuel{background:rgba(245,197,66,.12);border:1px solid rgba(245,197,66,.4);color:#ffe6a0}

#fab button{width:48px;height:48px;border-radius:50%;padding:0;font-size:18px;box-shadow:0 8px 24px rgba(0,0,0,.5);background:rgba(12,18,28,.95);border:1px solid var(--line)}

#legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.leaflet-control-attribution{font-size:9px!important;background:rgba(5,8,15,.75)!important}
.note{font-size:10px;color:var(--muted);margin-top:4px}
</style></head><body>
<div id="app">
<div id="map"></div><div id="banner"></div>
<div id="hud"><div class="card">
<div class="turn" id="turn">Определяем ваше место…</div>
<div class="meta" id="meta">Старт подставится сам. Укажите «Куда» — покажем заправки, камеры и посты ДПС по пути.</div>
<div class="bar"><i id="prog"></i></div>
<div id="alerts"><div class="alert cam" id="alCam"></div><div class="alert fuel" id="alFuel"></div><div class="alert dps" id="alDps"></div></div>
</div></div>
<div id="legend">
<div><i style="background:#ff4d6d"></i>Камеры</div>
<div><i style="background:#f5c542"></i>Заправки</div>
<div><i style="background:#5b9cff"></i>Посты ДПС</div>
<div><i style="background:#2ee6a8"></i>Маршрут</div>
</div>
<div id="fab"><button type="button" id="btnToggle">☰</button><button type="button" id="btnLoc">◎</button></div>
<div id="sheet">
<div id="grab"></div>
<div class="row"><input id="from" placeholder="Откуда (авто)" readonly/></div>
<div class="row"><input id="to" placeholder="Куда — город, улица, адрес" autocomplete="off"/></div>
<div class="row">
<button type="button" class="primary" id="btnGo" style="flex:1.4">По пути</button>
<button type="button" class="blue" id="btnNav" style="flex:1" disabled>Вести</button>
<button type="button" id="btnStop" disabled>Стоп</button>
</div>
<div id="status">
<span><span class="dot" id="dotGps"></span> GPS <b id="gpsTxt">—</b></span>
<span>осталось <b id="left">—</b></span>
<span>камера <b id="nCam">0</b></span>
<span>АЗС <b id="nFuel">0</b></span>
<span>ДПС <b id="nDps">0</b></span>
</div>
<p class="note">Только заправки, камеры и посты ДПС вдоль маршрута. OSM · GPS не сбрасывает путь.</p>
</div></div>

function tick(lat,lng){var n=nearestOnRoute(lat,lng),rem=remainFrom(n.idx),tot=state.route.distance||1;el.prog.style.width=(Math.max(0,Math.min(1,1-rem/tot))*100).toFixed(1)+"%";el.left.textContent=fmtKm(rem);var step=null;(state.route.steps||[]).forEach(function(s){if(!s.location)return;if(distM([lat,lng],s.location)<550)step=s});if(n.dist>140){el.turn.textContent="\u0421\u044a\u0435\u0445\u0430\u043b\u0438 \u00b7 "+Math.round(n.dist)+" \u043c";el.meta.textContent="\u041c\u0430\u0440\u0448\u0440\u0443\u0442 \u0441\u043e\u0445\u0440\u0430\u043d\u0451\u043d"}else if(rem<40){el.turn.textContent="\u041f\u0440\u0438\u0431\u044b\u0442\u0438\u0435";banner("\u041f\u0440\u0438\u0431\u044b\u043b\u0438","ok")}else if(step){el.turn.textContent=step.instruction||"\u041f\u043e \u043c\u0430\u0440\u0448\u0440\u0443\u0442\u0443";el.meta.textContent=fmtKm(step.distance)+" \u00b7 "+(step.name||"")}else{el.turn.textContent="\u041f\u043e \u043c\u0430\u0440\u0448\u0440\u0443\u0442\u0443";el.meta.textContent="\u041e\u0441\u0442\u0430\u043b\u043e\u0441\u044c "+fmtKm(rem)}var c=nearestAhead(along.cam,lat,lng,1200),f=nearestAhead(along.fuel,lat,lng,2500),d=nearestAhead(along.dps,lat,lng,1500);if(c){el.alCam.className="alert cam on";el.alCam.textContent="\ud83d\udcf7 \u041a\u0430\u043c\u0435\u0440\u0430 \u0447\u0435\u0440\u0435\u0437 "+fmtKm(c.d)+(c.o.name?" \u00b7 "+c.o.name:"");if(c.d<350)banner("\u041a\u0430\u043c\u0435\u0440\u0430 \u0431\u043b\u0438\u0437\u043a\u043e \u00b7 "+fmtKm(c.d),"cam")}else el.alCam.className="alert cam";if(f){el.alFuel.className="alert fuel on";el.alFuel.textContent="\u26fd \u0410\u0417\u0421 \u0447\u0435\u0440\u0435\u0437 "+fmtKm(f.d)+(f.o.name?" \u00b7 "+f.o.name:"")}else el.alFuel.className="alert fuel";if(d){el.alDps.className="alert dps on";el.alDps.textContent="\ud83d\ude93 \u0414\u041f\u0421 \u0447\u0435\u0440\u0435\u0437 "+fmtKm(d.d)+(d.o.name?" \u00b7 "+d.o.name:"")}else el.alDps.className="alert dps";if(state.gps.mode==="live")map.panTo([lat,lng],{anim el.btnGo.onclick=function(){el.btnGo.disabled=true;banner("\u0421\u0442\u0440\u043e\u0438\u043c\u2026");var fromP=state.from?Promise.resolve(state.from):geocode(el.from.value||"\u044f \u0437\u0434\u0435\u0441\u044c");fromP.then(function(from){state.from=from;setMark("start",[from.lat,from.lng]);return geocode(el.to.value).then(function(to){state.to=to;setMark("end",[to.lat,to.lng]);return buildRoute(from,to)})}).then(function(route){state.route=route;drawRoute(route);el.btnNav.disabled=false;el.left.textContent=fmtKm(route.distance);el.turn.textContent="\u041f\u0443\u0442\u044c \u00b7 "+fmtKm(route.distance);el.meta.textContent=(state.from.name||"\u0410")+" \u2192 "+(state.to.name||"\u0411").split(",")[0];return loadAlongRoute(route.coords)}).catch(function(e){banner(e.message||"\u041e\u0448\u0438\u0431\u043a\u0430","bad");el.turn.textContent="\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c"}).then(function(){el.btnGo.disabled=false})};
el.btnNav.onclick=function(){if(!state.route)return;state.navigating=true;el.btnStop.disabled=false;el.btnNav.disabled=true;el.sheet.classList.add("collapsed");state.sheetOpen=false;startWatch();if(state.gps.lat!=null){tick(state.gps.lat,state.gps.lng);map.setView([state.gps.lat,state.gps.lng],16)}else locateOnce().then(function(p){tick(p.lat,p.lng);map.setView([p.lat,p.lng],16)}).catch(function(){banner("\u041d\u0435\u0442 GPS","warn")})};
