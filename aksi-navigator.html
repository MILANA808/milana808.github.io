<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0b1220"/>
<title>АКСИ · Навигатор Россия</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--bg:#0b1220;--panel:#121a2b;--card:#182236;--line:#2a3a55;--txt:#eef3fb;--muted:#9aabbf;--acc:#2ee6a8;--acc2:#3b82f6;--warn:#f5c542;--bad:#f07178;--ok:#2ee6a8}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}#map{flex:1;min-height:100px;background:#0a101a}
#banner{display:none;padding:8px 12px;font-size:13px;font-weight:600;background:#3a2e0a;color:var(--warn);text-align:center}#banner.on{display:block}#banner.bad{background:#3a1518;color:#ffb4b8}#banner.ok{background:#0f2e24;color:var(--ok)}
#sheet{flex-shrink:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 12px calc(12px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto}
.row{display:flex;gap:8px;flex-wrap:wrap}input{flex:1;min-width:120px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:10px 12px;font:inherit;font-size:15px}
button{min-height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-size:13px;font-weight:650;padding:8px 12px;cursor:pointer}
button.primary{background:#14352c;border-color:var(--acc);color:var(--acc)}button.blue{background:#15253f;border-color:var(--acc2);color:#93c5fd}
button.chip{border-radius:999px;font-size:12px;padding:6px 12px;min-height:34px}button.chip.on{border-color:var(--acc);color:var(--acc);background:#14352c}button:disabled{opacity:.4}
#guide{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}#guide .turn{font-size:17px;font-weight:700}#guide .meta{font-size:12px;color:var(--muted);margin-top:6px}
#guide .bar{height:4px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}#guide .bar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--acc),#7dffc8)}
#status{font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}#status b{color:var(--txt)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}.dot.on{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
#fab{position:absolute;right:12px;bottom:12px;z-index:1000}#fab button{width:46px;height:46px;border-radius:50%;padding:0;font-size:18px;box-shadow:0 6px 18px rgba(0,0,0,.4);background:var(--panel);border:1px solid var(--line)}
#poiList{display:none;max-height:120px;overflow:auto;font-size:12px}#poiList.on{display:block}#poiList button{display:block;width:100%;text-align:left;margin-bottom:4px;font-weight:500}
.note{font-size:10px;color:var(--muted);line-height:1.35}
</style></head><body>
<div id="app">
<div id="banner"></div><div id="map"></div>
<div id="fab"><button type="button" id="btnLoc">◎</button></div>
<div id="sheet">
<div id="guide"><div class="turn" id="turn">АКСИ · Навигатор Россия</div>
<div class="meta" id="meta">Карта OSM: улицы, здания (при зуме). Заправки/места — поиск рядом.</div>
<div class="bar"><i id="prog"></i></div></div>
<div class="row" id="chips">
<button type="button" class="chip" data-poi="fuel">Заправки</button>
<button type="button" class="chip" data-poi="parking">Парковки</button>
<button type="button" class="chip" data-poi="hospital">Больницы</button>
<button type="button" class="chip" data-poi="pharmacy">Аптеки</button>
<button type="button" class="chip" data-poi="shop">Магазины</button>
<button type="button" class="chip" data-poi="cafe">Кафе</button>
<button type="button" class="chip" data-poi="clear">Сброс POI</button>
</div>
<div id="poiList"></div>
<div class="row"><input id="from" placeholder="Откуда (адрес или «я здесь»)"/></div>
<div class="row"><input id="to" placeholder="Куда (город, улица, адрес в РФ)"/></div>
<div class="row">
<button type="button" class="primary" id="btnGo" style="flex:1.4">Построить</button>
<button type="button" class="blue" id="btnNav" style="flex:1" disabled>Вести</button>
<button type="button" id="btnStop" disabled>Стоп</button>
</div>
<div id="status"><span><span class="dot" id="dotGps"></span> GPS: <b id="gpsTxt">ожидание</b></span>
<span>осталось <b id="left">—</b></span><span>ETA <b id="eta">—</b></span></div>
<p class="note">Карты России не скачиваются «целиком» в браузер. На экране — OpenStreetMap (улицы/дома при зуме). Заправки и POI — Overpass вокруг вас. Нужен интернет.</p>
</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
"use strict";
var map=L.map("map",{zoomControl:true}).setView([55.75,37.62],5);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OSM"}).addTo(map);
var routeLayer=null,startMarker=null,endMarker=null,userMarker=null,userAccCircle=null,poiLayer=L.layerGroup().addTo(map);
var state={from:null,to:null,route:null,navigating:false,gps:{ok:false,lat:null,lng:null,acc:null,lastOk:0,mode:"none"},watchId:null};
var el={banner:document.getElementById("banner"),turn:document.getElementById("turn"),meta:document.getElementById("meta"),prog:document.getElementById("prog"),from:document.getElementById("from"),to:document.getElementById("to"),btnGo:document.getElementById("btnGo"),btnNav:document.getElementById("btnNav"),btnStop:document.getElementById("btnStop"),dotGps:document.getElementById("dotGps"),gpsTxt:document.getElementById("gpsTxt"),left:document.getElementById("left"),eta:document.getElementById("eta"),poiList:document.getElementById("poiList")};
function banner(msg,kind){if(!msg){el.banner.className="";el.banner.style.display="none";return}el.banner.style.display="block";el.banner.className="on"+(kind?" "+kind:"");el.banner.textContent=msg}
function fmtKm(m){if(m==null||isNaN(m))return"\u2014";if(m<1000)return Math.round(m)+" \u043c";return(m/1000).toFixed(m<10000?1:0)+" \u043a\u043c"}
function fmtMin(sec){if(sec==null||isNaN(sec))return"\u2014";var m=Math.round(sec/60);if(m<60)return m+" \u043c\u0438\u043d";return Math.floor(m/60)+" \u0447 "+(m%60)+" \u043c\u0438\u043d"}
function geocode(q){var query=String(q||"").trim();if(!query)return Promise.reject(new Error("empty"));if(/^(я|здесь|я здесь|me)$/i.test(query)){if(state.gps.lat!=null)return Promise.resolve({lat:state.gps.lat,lng:state.gps.lng,name:"\u042f"});return locateOnce().then(function(p){return{lat:p.lat,lng:p.lng,name:"\u042f"}})}return fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ru&accept-language=ru&q="+encodeURIComponent(query)).then(function(r){if(!r.ok)throw new Error("search");return r.json()}).then(function(arr){if(!arr.length)throw new Error("not found");return{lat:+arr[0].lat,lng:+arr[0].lon,name:arr[0].display_name}})}
function buildRoute(from,to){return fetch("https://router.project-osrm.org/route/v1/driving/"+from.lng+","+from.lat+";"+to.lng+","+to.lat+"?overview=full&geometries=geojson&steps=true").then(function(r){if(!r.ok)throw new Error("osrm");return r.json()}).then(function(data){if(!data.routes||!data.routes.length)throw new Error("no route");var r=data.routes[0];var coords=r.geometry.coordinates.map(function(c){return[c[1],c[0]]});var steps=[];(r.legs||[]).forEach(function(leg){(leg.steps||[]).forEach(function(s){var name=(s.name&&s.name.length)?s.name:"";var type=(s.maneuver&&s.maneuver.type)||"";var mod=(s.maneuver&&s.maneuver.modifier)||"";steps.push({distance:s.distance||0,name:name,instruction:(s.maneuver&&s.maneuver.instruction)||(type+" "+mod+" "+name),location:s.maneuver&&s.maneuver.location?[s.maneuver.location[1],s.maneuver.location[0]]:null})})});return{coords:coords,steps:steps,distance:r.distance,duration:r.duration}})}
function drawRoute(route){if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.polyline(route.coords,{color:"#2ee6a8",weight:6,opacity:.9}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[40,40]})}
function setMarker(kind,ll,title){var icon=L.divIcon({className:"",html:'<div style="width:14px;height:14px;border-radius:50%;background:'+(kind==="start"?"#2ee6a8":"#3b82f6")+';border:2px solid #fff"></div>',iconSize:[14,14],iconAnchor:[7,7]});if(kind==="start"){if(startMarker)map.removeLayer(startMarker);startMarker=L.marker(ll,{icon:icon}).addTo(map)}else{if(endMarker)map.removeLayer(endMarker);endMarker=L.marker(ll,{icon:icon}).addTo(map)}}
function updateUserMarker(lat,lng,acc){var ll=[lat,lng];if(!userMarker)userMarker=L.circleMarker(ll,{radius:8,color:"#fff",weight:2,fillColor:"#3b82f6",fillOpacity:1}).addTo(map);else userMarker.setLatLng(ll);if(acc&&acc<500){if(!userAccCircle)userAccCircle=L.circle(ll,{radius:acc,color:"#3b82f6",weight:1,fillOpacity:.12}).addTo(map);else{userAccCircle.setLatLng(ll);userAccCircle.setRadius(acc)}}}
var POI={fuel:'node["amenity"="fuel"]',parking:'node["amenity"="parking"]',hospital:'node["amenity"="hospital"]',pharmacy:'node["amenity"="pharmacy"]',shop:'node["shop"]',cafe:'node["amenity"="cafe"]'};
function clearPoi(){poiLayer.clearLayers();el.poiList.className="";el.poiList.innerHTML="";document.querySelectorAll("#chips .chip").forEach(function(b){b.classList.remove("on")})}
function loadPoi(kind){if(kind==="clear"){clearPoi();banner("POI clear","ok");return}var lat=state.gps.lat!=null?state.gps.lat:map.getCenter().lat,lng=state.gps.lng!=null?state.gps.lng:map.getCenter().lng;var filter=POI[kind];if(!filter)return;banner("POI...");var q="[out:json][timeout:25];("+filter+"(around:3500,"+lat+","+lng+"););out body 40;";fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:q}).then(function(r){if(!r.ok)throw new Error("overpass");return r.json()}).then(function(data){clearPoi();document.querySelectorAll("#chips .chip").forEach(function(b){if(b.getAttribute("data-poi")===kind)b.classList.add("on")});var els=data.elements||[];if(!els.length){banner("empty","warn");return}el.poiList.className="on";els.forEach(function(n){if(n.lat==null)return;var name=(n.tags&&(n.tags.name||n.tags.brand||n.tags.operator))||kind;var m=L.circleMarker([n.lat,n.lon],{radius:6,color:"#fff",weight:1,fillColor:"#f5c542",fillOpacity:.95});m.bindPopup("<b>"+name+"</b>");poiLayer.addLayer(m);var btn=document.createElement("button");btn.type="button";btn.textContent=name;btn.onclick=function(){el.to.value=n.lat.toFixed(6)+", "+n.lon.toFixed(6);state.to={lat:n.lat,lng:n.lon,name:name};setMarker("end",[n.lat,n.lon],name);map.setView([n.lat,n.lon],16)};el.poiList.appendChild(btn)});banner("OK "+els.length,"ok")}).catch(function(e){banner(String(e.message||e),"bad")})}
document.getElementById("chips").addEventListener("click",function(e){var t=e.target.closest("[data-poi]");if(t)loadPoi(t.getAttribute("data-poi"))});
function setGpsUi(mode,text){state.gps.mode=mode;el.gpsTxt.textContent=text;el.dotGps.className="dot"+(mode==="live"?" on":mode==="stale"?" warn":mode==="dead"?" bad":"")}
function onPos(pos){var lat=pos.coords.latitude,lng=pos.coords.longitude,acc=pos.coords.accuracy;state.gps.ok=true;state.gps.lat=lat;state.gps.lng=lng;state.gps.acc=acc;state.gps.lastOk=Date.now();setGpsUi("live","\u00b1"+Math.round(acc)+"\u043c");if(state.navigating&&acc>80)banner("GPS weak","warn");else if(state.navigating)banner("");updateUserMarker(lat,lng,acc);if(state.navigating&&state.route)tickNavigation(lat,lng)}
function onPosErr(){if(state.gps.lat!=null){setGpsUi("stale","no signal");banner("GPS lost - keep route","warn");if(state.navigating&&state.route)tickNavigation(state.gps.lat,state.gps.lng)}else{setGpsUi("dead","no GPS");banner(state.navigating?"no GPS - map route":"no geo",state.navigating?"warn":"bad")}}
function locateOnce(){return new Promise(function(resolve,reject){if(!navigator.geolocation)return reject();navigator.geolocation.getCurrentPosition(function(p){onPos(p);resolve({lat:p.coords.latitude,lng:p.coords.longitude})},function(e){onPosErr(e);reject(e)},{enableHighAccuracy:true,timeout:12000,maximumAge:5000})})}
function startWatch(){if(!navigator.geolocation||state.watchId!=null)return;state.watchId=navigator.geolocation.watchPosition(onPos,onPosErr,{enableHighAccuracy:true,maximumAge:2000,timeout:15000})}
function distM(a,b){var R=6371000,toR=Math.PI/180,dLat=(b[0]-a[0])*toR,dLng=(b[1]-a[1])*toR,la1=a[0]*toR,la2=b[0]*toR;var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)*Math.sin(dLng/2);return 2*R*Math.asin(Math.sqrt(x))}
function nearestOnRoute(lat,lng){var c=state.route.coords,best=0,bestD=1e15;for(var i=0;i<c.length;i++){var d=distM([lat,lng],c[i]);if(d<bestD){bestD=d;best=i}}return{idx:best,dist:bestD}}
function remainingFrom(idx){var c=state.route.coords,s=0;for(var i=idx;i<c.length-1;i++)s+=distM(c[i],c[i+1]);return s}
function tickNavigation(lat,lng){var near=nearestOnRoute(lat,lng);var rem=remainingFrom(near.idx),total=state.route.distance||1;el.prog.style.width=(Math.max(0,Math.min(1,1-rem/total))*100).toFixed(1)+"%";el.left.textContent=fmtKm(rem);el.eta.textContent=fmtMin(rem/13.5);var steps=state.route.steps||[],step=steps[0];for(var i=0;i<steps.length;i++)if(steps[i].location){var d=distM([lat,lng],steps[i].location);if(d<500)step=steps[i]}if(near.dist>120){el.turn.textContent="off route "+Math.round(near.dist)+"m"}else if(rem<40){el.turn.textContent="\u041f\u0440\u0438\u0431\u044b\u0442\u0438\u0435";banner("OK","ok")}else if(step){el.turn.textContent=step.instruction;el.meta.textContent=fmtKm(step.distance)+" "+(step.name||"")}else el.turn.textContent="go";if(state.gps.mode==="live")map.panTo([lat,lng])}
el.btnGo.onclick=function(){el.btnGo.disabled=true;banner("...");var parseLL=function(v){if(/^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(v.trim())){var p=v.split(",");return Promise.resolve({lat:+p[0],lng:+p[1],name:"pt"})}return geocode(v)};Promise.all([parseLL(el.from.value),parseLL(el.to.value)]).then(function(pair){state.from=pair[0];state.to=pair[1];setMarker("start",[state.from.lat,state.from.lng]);setMarker("end",[state.to.lat,state.to.lng]);return buildRoute(state.from,state.to)}).then(function(route){state.route=route;drawRoute(route);el.btnNav.disabled=false;el.left.textContent=fmtKm(route.distance);el.eta.textContent=fmtMin(route.duration);el.turn.textContent="route "+fmtKm(route.distance);banner("ready","ok")}).catch(function(e){banner(String(e.message||e),"bad")}).then(function(){el.btnGo.disabled=false})};
el.btnNav.onclick=function(){if(!state.route)return;state.navigating=true;el.btnStop.disabled=false;el.btnNav.disabled=true;startWatch();if(state.gps.lat!=null){tickNavigation(state.gps.lat,state.gps.lng);map.setView([state.gps.lat,state.gps.lng],15)}else locateOnce().then(function(p){tickNavigation(p.lat,p.lng);map.setView([p.lat,p.lng],15)}).catch(function(){banner("no GPS","warn")})};
el.btnStop.onclick=function(){state.navigating=false;el.btnStop.disabled=true;el.btnNav.disabled=!state.route;banner("")};
document.getElementById("btnLoc").onclick=function(){locateOnce().then(function(p){map.setView([p.lat,p.lng],15)}).catch(function(){})};
try{startWatch()}catch(e){}setGpsUi("none","...");
})();
</script></body></html>
