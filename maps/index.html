<style>

#status b{color:var(--acc)}#status .off{color:var(--warn)}

#panel.drive{transform:translateY(110%)}
#panel h1{font-size:16px;font-weight:850;margin-bottom:10px}
.field{margin-bottom:10px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:650}
.row{display:flex;gap:8px}

input:focus{outline:none;border-color:var(--acc)}
button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:#121a28;color:var(--txt);font:inherit;font-size:14px;font-weight:800;padding:0 14px;cursor:pointer}
button.primary{background:#0f2f26;border-color:var(--acc);color:var(--acc);flex:1;font-size:16px}
button.loc{min-width:48px;color:#9ec9ff}button:disabled{opacity:.4}
.hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.4}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.actions button{flex:1;min-width:120px;min-height:42px;font-size:13px}

#bnav button.on{color:var(--acc)}#bnav button span{font-size:16px;line-height:1}

function lon2tile(lon,z){return Math.floor((lon+180)/360*Math.pow(2,z))}
function lat2tile(lat,z){return Math.floor((1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*Math.pow(2,z))}
function tileUrls(bounds,zMin,zMax){var urls=[],subs=["a","b","c"];for(var z=zMin;z<=zMax;z++){var x0=lon2tile(bounds.getWest(),z),x1=lon2tile(bounds.getEast(),z);var y0=lat2tile(bounds.getNorth(),z),y1=lat2tile(bounds.getSouth(),z);if(x1-x0>40)x1=x0+40;if(y1-y0>40)y1=y0+40;for(var x=x0;x<=x1;x++)for(var y=y0;y<=y1;y++){var s=subs[(x+y)%3];urls.push("https://"+s+".tile.openstreetmap.org/"+z+"/"+x+"/"+y+".png")}}return urls}
