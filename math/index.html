<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AKSI MATRIX MATH — solver · verify · receipt</title>
<meta name="theme-color" content="#0a0e14"/>
<link rel="canonical" href="https://milana808.github.io/math/"/>
<style>
:root{--bg:#0a0e14;--p:#121820;--l:#243044;--t:#e8eef7;--m:#8b9bb0;--a:#3dffa8;--bad:#ff6b7a;--ok:#3dffa8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,system-ui,sans-serif}
.w{max-width:720px;margin:0 auto;padding:16px 14px 48px}
.tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--a)}
h1{font-size:1.2rem;margin:6px 0 4px;font-weight:700}
.lead{color:var(--m);font-size:12px;margin:0 0 14px;line-height:1.4}
.box{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:12px;margin:10px 0}
label{display:block;font-size:11px;color:var(--m);margin-bottom:4px}
input[type=text]{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--l);background:#0c1018;color:var(--t);font:inherit}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--a);color:#04140c}
button.sec{background:transparent;border:1px solid var(--l);color:var(--t)}
button:disabled{opacity:.45}
.log{background:#080c12;border:1px solid var(--l);border-radius:8px;padding:10px;max-height:180px;overflow:auto;font-size:12px;color:var(--m);white-space:pre-wrap}
.log .ok{color:var(--ok)}.log .bad{color:var(--bad)}.log .info{color:#7eb8ff}
pre.out{background:#080c12;border:1px solid var(--l);border-radius:8px;padding:12px;overflow:auto;font-size:12px;line-height:1.4;margin:0;white-space:pre-wrap;word-break:break-word}
.chips{margin-top:8px}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--l);color:var(--m);margin:2px 4px 0 0}
.chip.pass{border-color:var(--ok);color:var(--ok)}
.chip.fail{border-color:var(--bad);color:var(--bad)}
.ex{margin-top:8px}
.ex button{font-size:11px;padding:6px 10px;font-weight:600;background:#1a2230;color:var(--t);border:1px solid var(--l)}
footer{margin-top:16px;font-size:11px;color:var(--m)}
footer a{color:var(--a)}
</style>
</head>
<body>
<div class="w">
  <div class="tag">AKSI-MATRIX-MATH-v0.1</div>
  <h1>Solver → Verification → Receipt</h1>
  <p class="lead">Локальный контур: гипотезы корней → жёсткая подстановка → JSON-чек. Без нейросетей. Offline-first.</p>
  <div class="box">
    <label for="eq">Уравнение</label>
    <input type="text" id="eq" value="x^2 - 4 = 0" autocomplete="off" spellcheck="false"/>
    <div class="row">
      <button type="button" id="run">Запустить цикл AKSI</button>
      <button type="button" class="sec" id="dl">Скачать receipt.json</button>
      <button type="button" class="sec" id="inject">Тест: ложная гипотеза 5</button>
    </div>
    <div class="ex">
      <button type="button" data-eq="x^2 - 4 = 0">x²−4=0</button>
      <button type="button" data-eq="x^2 - 9 = 0">x²−9=0</button>
      <button type="button" data-eq="2*x + 4 = 10">2x+4=10</button>
      <button type="button" data-eq="x^2 - 5*x + 6 = 0">x²−5x+6=0</button>
      <button type="button" data-eq="x^3 - 8 = 0">x³−8=0</button>
    </div>
  </div>
  <div class="box">
    <div class="tag">Live log</div>
    <div class="log" id="log"></div>
  </div>
  <div class="box">
    <div class="tag">Digital receipt</div>
    <div class="chips" id="chips"></div>
    <pre class="out" id="out">{}</pre>
  </div>
  <footer>
    <a href="https://milana808.github.io/">home</a> ·
    <a href="https://milana808.github.io/permit/">permit</a> ·
    <a href="https://milana808.github.io/generate/">generate</a>
  </footer>
</div>
<script>
(function () {
  "use strict";
  function parseEquation(eq) {
    var s = String(eq).replace(/\s+/g, "").replace(/−/g, "-").replace(/×/g, "*").replace(/÷/g, "/");
    var left, right;
    if (s.indexOf("=") >= 0) {
      var parts = s.split("=");
      left = parts[0];
      right = parts.slice(1).join("=") || "0";
    } else {
      left = s;
      right = "0";
    }
    return { left: left, right: right, residual: "(" + left + ")-(" + right + ")", raw: eq };
  }
  function toEvalExpr(expr) {
    return String(expr)
      .replace(/\^/g, "**")
      .replace(/(\d+(?:\.\d+)?)([a-zA-Z])/g, "($1*$2)")
      .replace(/([a-zA-Z])(\d+(?:\.\d+)?)/g, "($1*$2)");
  }
  function makeValueAt(residual) {
    var e = toEvalExpr(residual);
    return function (x) {
      var fn = new Function("x", "\"use strict\"; return (" + e + ");");
      return fn(x);
    };
  }
  function findHypotheses(equation, range) {
    range = range == null ? 100 : range;
    var parsed = parseEquation(equation);
    var valueAt = makeValueAt(parsed.residual);
    var hyps = [];
    var seen = {};
    function add(x) {
      if (seen[x]) return;
      try {
        var v = valueAt(x);
        if (typeof v === "number" && isFinite(v) && Math.abs(v) < 1e-9) {
          hyps.push(x);
          seen[x] = 1;
        }
      } catch (err) {}
    }
    for (var x = -range; x <= range; x++) add(x);
    for (var k = -range * 2; k <= range * 2; k++) {
      if (k % 2 === 0) continue;
      add(k / 2);
    }
    hyps.sort(function (a, b) { return a - b; });
    return { parsed: parsed, hypotheses: hyps, valueAt: valueAt };
  }
  function prettySub(residual, root) {
    var r = root < 0 ? "(" + root + ")" : String(root);
    return residual.replace(/\bx\b/gi, r).replace(/\*\*/g, "^");
  }
  function verifyRoots(equation, hypotheses) {
    var parsed = parseEquation(equation);
    var valueAt = makeValueAt(parsed.residual);
    var steps = [];
    var verified = [];
    for (var i = 0; i < hypotheses.length; i++) {
      var root = hypotheses[i];
      var expression = prettySub(toEvalExpr(parsed.residual), root);
      var result = null;
      var status = "REJECTED";
      try {
        result = valueAt(root);
        if (typeof result === "number" && isFinite(result) && Math.abs(result) < 1e-9) {
          status = "VERIFIED";
          result = 0;
          verified.push(root);
        }
      } catch (e) {
        expression = String(e && e.message ? e.message : e);
        result = null;
        status = "REJECTED";
      }
      steps.push({ root: root, expression: expression, result: result, status: status });
    }
    return { steps: steps, verified_roots: verified };
  }
  function buildReceipt(inputEquation, hypotheses, verification, extra) {
    var verified = verification.verified_roots;
    var integrity = verification.steps.every(function (s) {
      if (s.status === "VERIFIED") return Math.abs(s.result) < 1e-9;
      return true;
    });
    return {
      system_id: "AKSI-MATRIX-MATH-v0.1",
      timestamp: new Date().toISOString(),
      input_equation: inputEquation,
      hypotheses_found: hypotheses.slice(),
      verification_steps: verification.steps,
      verified_roots: verified.slice(),
      integrity_status: integrity ? "PASSED" : "FAILED",
      note: (extra && extra.note) || "Integer/half-integer search ±100; verification by substitution."
    };
  }
  var logEl = document.getElementById("log");
  var outEl = document.getElementById("out");
  var chips = document.getElementById("chips");
  var eqEl = document.getElementById("eq");
  var lastReceipt = null;
  function log(msg, cls) {
    var line = document.createElement("div");
    if (cls) line.className = cls;
    line.textContent = msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function clearLog() { logEl.textContent = ""; }
  function runCycle(opts) {
    opts = opts || {};
    var eq = (eqEl.value || "").trim();
    if (!eq) return;
    clearLog();
    log("[Intent] Получено уравнение: " + eq, "info");
    var found = findHypotheses(eq, 100);
    log("[Math] Парсинг residual: " + found.parsed.residual, "info");
    log("[Math] Сгенерированы гипотезы: [" + found.hypotheses.join(", ") + "]", "info");
    var hyps = found.hypotheses.slice();
    if (opts.injectFalse) {
      if (hyps.indexOf(5) < 0) hyps.push(5);
      log("[Test] Подмешана ложная гипотеза 5", "bad");
    }
    log("[Verification] Старт подстановки…", "info");
    var ver = verifyRoots(eq, hyps);
    for (var i = 0; i < ver.steps.length; i++) {
      var s = ver.steps[i];
      var cls = s.status === "VERIFIED" ? "ok" : "bad";
      log("[Verification] x=" + s.root + " → " + s.expression + " = " + s.result + " → " + s.status, cls);
    }
    var receipt = buildReceipt(eq, hyps, ver, {
      note: opts.injectFalse ? "False hypothesis 5 injected; verification must REJECT it." : undefined
    });
    lastReceipt = receipt;
    outEl.textContent = JSON.stringify(receipt, null, 2);
    chips.innerHTML = "";
    var c1 = document.createElement("span");
    c1.className = "chip " + (receipt.integrity_status === "PASSED" ? "pass" : "fail");
    c1.textContent = "integrity: " + receipt.integrity_status;
    chips.appendChild(c1);
    var c2 = document.createElement("span");
    c2.className = "chip pass";
    c2.textContent = "verified: [" + receipt.verified_roots.join(", ") + "]";
    chips.appendChild(c2);
    log("[Receipt] Чек сформирован · " + receipt.timestamp, "ok");
    return receipt;
  }
  document.getElementById("run").addEventListener("click", function () { runCycle({}); });
  document.getElementById("inject").addEventListener("click", function () { runCycle({ injectFalse: true }); });
  document.getElementById("dl").addEventListener("click", function () {
    if (!lastReceipt) runCycle({});
    if (!lastReceipt) return;
    var blob = new Blob([JSON.stringify(lastReceipt, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "aksi-math-receipt.json";
    a.click();
    URL.revokeObjectURL(a.href);
  });
  document.querySelectorAll("[data-eq]").forEach(function (b) {
    b.addEventListener("click", function () { eqEl.value = b.getAttribute("data-eq"); });
  });
  eqEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") runCycle({});
  });
  setTimeout(function () {
    runCycle({});
    var ver = verifyRoots("x^2 - 4 = 0", [-2, 2, 5]);
    var ok =
      ver.verified_roots.indexOf(2) >= 0 &&
      ver.verified_roots.indexOf(-2) >= 0 &&
      ver.verified_roots.indexOf(5) < 0 &&
      ver.steps.some(function (s) { return s.root === 5 && s.status === "REJECTED"; });
    log(ok ? "[Self-test] REJECTED root 5 correctly — PASS" : "[Self-test] FAIL", ok ? "ok" : "bad");
  }, 200);
})();
</script>
</body>
</html>
