<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>АКСИ Math AI — токены → ответ</title>
<meta name="description" content="Математический слой АКСИ: токены, энтропия, safe math, ответ. Offline."/>
<link rel="canonical" href="https://milana808.github.io/math/"/>
<meta name="theme-color" content="#0b0c10"/>
<style>
:root{--bg:#0b0c10;--card:#14161c;--line:rgba(255,255,255,.08);--t:#eef0f4;--m:#9aa3b2;--a:#8ab4f8;--ok:#3dd68c}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.45;min-height:100vh}
.w{max-width:720px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:1.2rem;margin:0 0 4px}.sub{color:var(--m);font-size:.9rem;margin:0 0 14px}
.composer{display:flex;gap:8px;margin:12px 0}
.composer input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--t);border-radius:12px;padding:12px 14px;font-size:15px}
.composer button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--a);color:#0b0c10;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{background:var(--card);border:1px solid var(--line);color:var(--m);border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h2{margin:0 0 8px;font-size:13px;color:var(--m);text-transform:uppercase}
.ans{font-size:15px;white-space:pre-wrap;word-break:break-word}
.meta{font:12px/1.5 ui-monospace,monospace;color:var(--m);margin-top:10px}
.ok{color:var(--ok)}a{color:var(--a)}footer{margin-top:24px;font-size:12px;color:var(--m)}
</style>
</head>
<body>
<div class="w">
  <h1>АКСИ Math AI</h1>
  <p class="sub">Токены → веса → math → ответ · offline · no LLM required</p>
  <div class="chips">
    <button type="button" data-q="кто ты">кто ты</button>
    <button type="button" data-q="посчитай (2+3)*4">math</button>
    <button type="button" data-q="2^10">2^10</button>
    <button type="button" data-q="формула aksi">формула</button>
  </div>
  <div class="composer">
    <input id="q" type="text" placeholder="Вопрос или выражение…"/>
    <button type="button" id="go">Считать</button>
  </div>
  <div class="card"><h2>Ответ</h2><div class="ans" id="ans">—</div><div class="meta" id="meta"></div></div>
  <div class="card"><h2>Токены</h2><div class="meta" id="tok">—</div></div>
  <footer>technology_serves_human · <a href="/one/">ONE</a> · <a href="/authority/">Authority</a> · aksilove@internet.ru</footer>
</div>
<script src="/aksi-neuro.js?v=m1"></script>
<script src="/aksi-clm.js?v=m1"></script>
<script src="/aksi-algorithm.js?v=m1"></script>
<script src="/aksi-math-ai.js?v=m1"></script>
<script>
(function(){
  function run(){
    var q=document.getElementById('q').value.trim();
    if(!q||!window.AKSI_MATH)return;
    var r=AKSI_MATH.answer(q);
    document.getElementById('ans').textContent=r.answer||r.error||'—';
    document.getElementById('meta').innerHTML='conf <span class="ok">'+r.confidence+'</span> · tokens '+(r.tokens&&r.tokens.count)+' · unique '+(r.tokens&&r.tokens.unique)+' · H='+(r.tokens&&r.tokens.entropy)+(r.math&&r.math.ok?' · math='+r.math.value:'');
    document.getElementById('tok').textContent=r.tokens?JSON.stringify(r.tokens.list||r.tokens.tokens):'—';
  }
  document.getElementById('go').onclick=run;
  document.getElementById('q').addEventListener('keydown',function(e){if(e.key==='Enter')run();});
  document.querySelectorAll('[data-q]').forEach(function(b){b.onclick=function(){document.getElementById('q').value=b.getAttribute('data-q');run();};});
})();
</script>
</body>
</html>
