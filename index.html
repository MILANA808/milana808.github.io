<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>АКСИ</title>
<meta name="theme-color" content="#5b21b6">
<meta http-equiv="Cache-Control" content="no-cache">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#5b21b6;color:#fff;min-height:100dvh;padding:28px 20px 40px}
h1{font-size:2rem;font-weight:900;margin:16px 0 12px}
p{font-size:1.15rem;margin-bottom:24px;opacity:.95}
a{
  display:block;width:100%;text-align:center;text-decoration:none;
  font-size:1.3rem;font-weight:900;padding:22px 16px;border-radius:16px;margin-bottom:14px;
}
a.main{background:#fff;color:#5b21b6}
a.sec{background:transparent;color:#fff;border:3px solid #fff}
</style>
</head>
<body>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});
}
if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}
</script>
<div style="font-weight:800;letter-spacing:.15em">АКСИ</div>
<h1>Меню</h1>
<p>Нажимайте кнопку</p>
<a class="main" href="/nav/">НАВИГАТОР</a>
<a class="main" href="/aksi/">ЧАТ</a>
<a class="sec" href="/net/">Сеть</a>
<a class="sec" href="/backup/">Бэкап</a>
</body>
</html>
