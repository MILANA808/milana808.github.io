<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>АКСИ</title>
<meta name="theme-color" content="#0b1020"/>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#e8eefc;font-family:system-ui,sans-serif;line-height:1.45}
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:#0b1020;border-bottom:1px solid #24304d;font-size:12px;color:#8b9bb8}
.dot{width:8px;height:8px;border-radius:50%;background:#64748b}
.dot.on{background:#34d399;box-shadow:0 0 8px #34d399}
.shell{max-width:760px;margin:0 auto;padding:12px 14px 36px}
h1{font-size:1.25rem;margin:8px 0 4px}
.sub{color:#8b9bb8;font-size:.88rem;margin:0 0 12px}
.card{background:#121a2f;border:1px solid #24304d;border-radius:14px;padding:12px;margin:10px 0}
#log{max-height:min(52vh,480px);overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:140px}
.msg{padding:10px 12px;border-radius:12px;white-space:pre-wrap;font-size:14px}
.u{background:#0a0f1c;border:1px solid #24304d;align-self:flex-end;max-width:92%}
.a{background:rgba(129,140,248,.12);border:1px solid rgba(129,140,248,.35);align-self:flex-start;max-width:96%}
.tag{font-size:10px;color:#8b9bb8;margin-bottom:3px}
.composer{display:flex;gap:8px;margin-top:10px}
input,select{background:#0a0f1c;border:1px solid #24304d;border-radius:10px;color:#e8eefc;padding:11px 12px;font-size:14px;font-family:inherit}
input[type=text],input[type=password]{flex:1}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:13px;cursor:pointer;background:#22d3ee;color:#06202a;font-family:inherit}
button:disabled{opacity:.55;cursor:wait}
button.ghost{background:transparent;border:1px solid #24304d;color:#e8eefc;font-weight:600}
button.acc{background:#818cf8;color:#0b1020}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{padding:7px 10px;font-size:12px;background:#0e1528;color:#e8eefc;border:1px solid #24304d;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.meta{font-size:11px;color:#8b9bb8;margin-top:8px}
.bar{height:6px;background:#0a0f1c;border-radius:99px;overflow:hidden;margin-top:8px;display:none}
.bar.on{display:block}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#818cf8)}
label{font-size:12px;color:#8b9bb8;display:block;margin:6px 0 4px}
.grid{display:grid;gap:8px}
</style>
</head>
<body>
<div class="top">
  <span class="dot" id="dot"></span>
  <strong style="color:#e8eefc">АКСИ</strong>
  <span id="msk">—</span>
  <span id="st">ядро</span>
</div>
<div class="shell">
  <h1>Агент АКСИ</h1>
  <p class="sub">Ядро всегда. GPT-уровень — через <b>твой</b> API-ключ (OpenAI / Groq / OpenRouter / Ollama). Локальная модель — WebLLM в браузере.</p>

  <div class="card">
    <label>Режим ответа</label>
    <select id="mode" style="width:100%">
      <option value="auto">Авто: API → WebLLM → ядро</option>
      <option value="api">Только API (GPT-класс)</option>
      <option value="webllm">Только WebLLM (локально)</option>
      <option value="core">Только ядро (math/память)</option>
    </select>
    <div class="grid" style="margin-top:8px">
      <div>
        <label>API endpoint (OpenAI-compatible)</label>
        <input id="apiUrl" type="text" placeholder="https://api.openai.com/v1/chat/completions" style="width:100%"/>
      </div>
      <div>
        <label>Модель API</label>
        <input id="apiModel" type="text" placeholder="gpt-4o-mini" style="width:100%"/>
      </div>
      <div>
        <label>API ключ (только в твоём браузере)</label>
        <input id="apiKey" type="password" placeholder="sk-... или gsk_..." style="width:100%"/>
      </div>
    </div>
    <div class="row">
      <button type="button" class="ghost" id="btnSaveApi">Сохранить API</button>
      <button type="button" class="acc" id="btnLLM">Загрузить WebLLM</button>
    </div>
    <div class="bar" id="bar"><i id="barI"></i></div>
    <div class="meta" id="hint">Без ключа: ядро + опционально WebLLM. С ключом: ответы уровня большой модели.</div>
  </div>

  <div class="card">
    <div id="log"></div>
    <div class="chips">
      <button type="button" data-q="кто ты">кто ты</button>
      <button type="button" data-q="12*12">12*12</button>
      <button type="button" data-q="Объясни простыми словами, что такое энтропия">энтропия</button>
      <button type="button" data-q="запомни: проект = АКСИ">запомни</button>
    </div>
    <div class="composer">
      <input id="in" type="text" placeholder="Вопрос как в ChatGPT…" autocomplete="off"/>
      <button type="button" id="send">Отправить</button>
    </div>
    <div class="meta">Ключ не уходит на сервер АКСИ · aksilove@internet.ru</div>
  </div>
</div>
<script>
(function(){
"use strict";
var CFG_KEY="aksi_api_cfg_v1";
var MEM_KEY="aksi_mem_v3";
var mem={};
var engine=null, llmReady=false, llmLoading=false, busy=false;
try{mem=JSON.parse(localStorage.getItem(MEM_KEY)||"{}")||{}}catch(e){mem={}}

function $(id){return document.getElementById(id)}
function msk(){
  try{return new Date().toLocaleTimeString("ru-RU",{timeZone:"Europe/Moscow",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})+" МСК"}
  catch(e){return"—"}
}
function paint(){
  var a=$("msk");if(a)a.textContent=msk();
  var mode=$("mode")?$("mode").value:"auto";
  var api=loadCfg();
  var label="ядро";
  if(api.key&&(mode==="api"||mode==="auto"))label="API";
  else if(llmReady&&(mode==="webllm"||mode==="auto"))label="WebLLM";
  var b=$("st");if(b)b.textContent=label+" · mem "+Object.keys(mem).length;
  var d=$("dot");if(d)d.className="dot"+(llmReady||(api.key)?" on":"");
}
setInterval(paint,1000);

function loadCfg(){
  try{return JSON.parse(localStorage.getItem(CFG_KEY)||"{}")||{}}catch(e){return{}}
}
function saveCfgFromForm(){
  var cfg={
    url:($("apiUrl").value||"").trim()||"https://api.openai.com/v1/chat/completions",
    model:($("apiModel").value||"").trim()||"gpt-4o-mini",
    key:($("apiKey").value||"").trim()
  };
  localStorage.setItem(CFG_KEY,JSON.stringify(cfg));
  $("hint").textContent=cfg.key?"API сохранён локально. Режим: большие модели.":"Ключ пуст — будет ядро/WebLLM.";
  paint();
  append("a","Настройки API сохранены только в этом браузере.","core");
}
function fillForm(){
  var c=loadCfg();
  $("apiUrl").value=c.url||"https://api.openai.com/v1/chat/completions";
  $("apiModel").value=c.model||"gpt-4o-mini";
  $("apiKey").value=c.key||"";
}
fillForm();paint();

function saveMem(){try{localStorage.setItem(MEM_KEY,JSON.stringify(mem))}catch(e){}paint()}

function fmt(x){if(x==null||!isFinite(x))return"—";if(Math.abs(x-Math.round(x))<1e-10)return String(Math.round(x));return String(parseFloat(x.toFixed(10)))}
function evalExpr(s){
  s=String(s).toLowerCase().replace(/,/g,".").replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
  s=s.replace(/π/g,"Math.PI").replace(/\bpi\b/g,"Math.PI");
  s=s.replace(/корень(?:\s*из)?\s*\(?\s*([\d.]+)\s*\)?/g,"Math.sqrt($1)");
  s=s.replace(/√\s*\(?\s*([\d.]+)\s*\)?/g,"Math.sqrt($1)");
  s=s.replace(/\^/g,"**");
  s=s.replace(/[^0-9+\-*/().\sMathsqrtPI]/g,"");
  if(!s.trim())return null;
  try{var v=Function('"use strict";return ('+s+")")();return typeof v==="number"&&isFinite(v)?v:null}catch(e){return null}
}
function solveEq(raw){
  var s=String(raw).toLowerCase().replace(/,/g,".").replace(/\s/g,"").replace(/х/g,"x").replace(/\*/g,"");
  if(s.indexOf("=")<0)return null;
  var L=s.split("=")[0],R=s.split("=")[1],rN=parseFloat(R);
  if(!isFinite(rN)||/[x]/.test(R))return null;
  var a=0,b=0,c=0,e=L,m;
  m=e.match(/([+-]?\d*\.?\d*)x\^2/);
  if(m){a=(m[1]===""||m[1]==="+")?1:(m[1]==="-"?-1:parseFloat(m[1]));e=e.replace(m[0],"")}
  m=e.match(/([+-]?\d*\.?\d*)x/);
  if(m){b=(m[1]===""||m[1]==="+")?1:(m[1]==="-"?-1:parseFloat(m[1]));e=e.replace(m[0],"")}
  e.replace(/([+-]?\d+\.?\d*)/g,function(n){c+=parseFloat(n);return""});c-=rN;
  if(Math.abs(a)<1e-12){if(Math.abs(b)<1e-12)return"Нет решения";return"Корень: "+fmt(-c/b)}
  var d=b*b-4*a*c;if(d<-1e-12)return"Нет действительных корней";
  if(Math.abs(d)<1e-12)return"Корень: "+fmt(-b/(2*a));
  var s2=Math.sqrt(d);return"Корни: "+fmt((-b+s2)/(2*a))+", "+fmt((-b-s2)/(2*a));
}
function mathAnswer(q){
  var raw=String(q).trim(),low=raw.toLowerCase();
  var pm=low.match(/(\d+(?:[.,]\d+)?)\s*%\s*(?:от)?\s*(\d+(?:[.,]\d+)?)/);
  if(pm)return pm[1]+"% от "+pm[2]+" = "+fmt((+pm[1].replace(",","."))/100*(+pm[2].replace(",",".")));
  var fm=low.match(/(\d+)\s*!/);
  if(fm){var n=+fm[1],f=1,i;if(n>20)return"n! велико";for(i=2;i<=n;i++)f*=i;return n+"! = "+f}
  if(/=/.test(raw)&&/[xх]/i.test(raw)){var eq=solveEq(raw);if(eq)return"Уравнение: "+raw+"\n"+eq}
  var expr=raw.replace(/^посчитай\s*/i,"").replace(/^вычисли\s*/i,"");
  if(!/=/.test(expr)||!/[xх]/i.test(expr)){var v=evalExpr(expr);if(v!=null)return"Результат: "+fmt(v)}
  return null;
}
function teach(q){
  var m=String(q).match(/^(?:запомни|remember)\s*[:\-]?\s*(.+)$/i);
  if(!m)return null;
  var body=m[1].trim();
  var kv=body.match(/^([^=:]+)[=:]\s*(.+)$/);
  if(kv){var k=kv[1].trim().toLowerCase(),v=kv[2].trim();mem[k]=v;saveMem();return"Запомнила: «"+k+"» = «"+v+"»"}
  mem["note_"+Date.now()]=body;saveMem();return"Записала";
}
function recall(q){
  var low=q.toLowerCase();
  if(/что\s+помнишь|покажи\s+память|факты/.test(low)){
    var keys=Object.keys(mem);if(!keys.length)return"Память пуста";
    return"Память:\n"+keys.map(function(k){return"• "+k+" = "+mem[k]}).join("\n");
  }
  for(var k in mem){if(Object.prototype.hasOwnProperty.call(mem,k)&&low.indexOf(k)>=0)return mem[k]+" (память: "+k+")"}
  return null;
}
function coreOnly(q){
  var t=teach(q);if(t)return{text:t,src:"memory"};
  var m=mathAnswer(q);if(m)return{text:m,src:"math"};
  var r=recall(q);if(r)return{text:r,src:"memory"};
  var low=q.toLowerCase();
  if(/кто ты|что ты|представься/.test(low)){
    return{text:"Я АКСИ — оболочка агента.\n• Ядро: math + память (всегда)\n• WebLLM: открытая модель в браузере\n• API: GPT-класс через твой ключ (OpenAI/Groq/OpenRouter/Ollama)\naksilove@internet.ru",src:"core"};
  }
  if(/привет|здравств|hello/.test(low))return{text:"Привет. Для ответов как у GPT — вставь API-ключ выше и выбери режим API/Авто.",src:"core"};
  if(/время|мск/.test(low))return{text:msk(),src:"core"};
  return null;
}

function memHint(){
  var keys=Object.keys(mem);if(!keys.length)return"";
  return"\nФакты пользователя: "+keys.slice(0,15).map(function(k){return k+"="+mem[k]}).join("; ");
}
function systemPrompt(){
  return"Ты АКСИ — суверенный помощник на milana808.github.io. Отвечай по-русски, ясно и по делу. Не выдумывай факты. Если не знаешь — скажи. Ты полезный ассистент, не AGI."+memHint();
}

function chatAPI(q){
  var cfg=loadCfg();
  if(!cfg.key)return Promise.reject(new Error("Нет API-ключа"));
  var url=cfg.url||"https://api.openai.com/v1/chat/completions";
  return fetch(url,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+cfg.key
    },
    body:JSON.stringify({
      model:cfg.model||"gpt-4o-mini",
      messages:[
        {role:"system",content:systemPrompt()},
        {role:"user",content:q}
      ],
      temperature:0.7,
      max_tokens:800
    })
  }).then(function(res){
    return res.json().then(function(j){
      if(!res.ok){
        var msg=(j&&j.error&&j.error.message)||res.statusText||("HTTP "+res.status);
        throw new Error(msg);
      }
      var t=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
      if(!t)throw new Error("Пустой ответ API");
      return String(t).trim();
    });
  });
}

function chatWebLLM(q){
  if(!engine)return Promise.reject(new Error("WebLLM не загружен"));
  return engine.chat.completions.create({
    messages:[
      {role:"system",content:systemPrompt()},
      {role:"user",content:q}
    ],
    temperature:0.7,
    max_tokens:500
  }).then(function(out){
    var t=out&&out.choices&&out.choices[0]&&out.choices[0].message&&out.choices[0].message.content;
    return (t||"").trim()||"Пустой ответ модели";
  });
}

function loadWebLLM(){
  if(llmReady||llmLoading)return;
  llmLoading=true;
  var btn=$("btnLLM");if(btn)btn.disabled=true;
  $("bar").className="bar on";
  $("hint").textContent="Загрузка WebLLM…";
  import("https://esm.run/@mlc-ai/web-llm").then(function(mod){
    var Create=mod.CreateMLCEngine||(mod.default&&mod.default.CreateMLCEngine);
    if(!Create)throw new Error("CreateMLCEngine не найден");
    var models=["Qwen2.5-0.5B-Instruct-q4f16_1-MLC","SmolLM2-360M-Instruct-q4f16_1-MLC","Qwen2.5-1.5B-Instruct-q4f16_1-MLC"];
    function tryM(i){
      if(i>=models.length)throw new Error("модели недоступны");
      var mid=models[i];
      $("hint").textContent="Модель: "+mid;
      return Create(mid,{initProgressCallback:function(p){
        var pr=typeof p.progress==="number"?p.progress:0;
        $("barI").style.width=Math.round(pr*100)+"%";
        $("hint").textContent=(p.text||mid).slice(0,140);
      }}).then(function(eng){
        engine=eng;llmReady=true;llmLoading=false;
        if(btn){btn.disabled=true;btn.textContent="WebLLM готов"}
        $("barI").style.width="100%";
        $("hint").textContent="Локальная модель готова: "+mid;
        paint();
        append("a","WebLLM подключена: "+mid,"webllm");
      }).catch(function(){return tryM(i+1)});
    }
    return tryM(0);
  }).catch(function(err){
    llmLoading=false;if(btn)btn.disabled=false;
    $("hint").textContent="WebLLM: "+(err&&err.message?err.message:err)+". Для GPT-класса используй API-ключ.";
    append("a","WebLLM не загрузилась. Используй API (ключ) или ядро.","core");
  });
}

function append(role,text,src){
  var box=$("log");if(!box)return;
  var d=document.createElement("div");
  d.className="msg "+(role==="u"?"u":"a");
  if(src){var t=document.createElement("div");t.className="tag";t.textContent=src;d.appendChild(t)}
  d.appendChild(document.createTextNode((role==="u"?"Вы: ":"АКСИ: ")+text));
  box.appendChild(d);box.scrollTop=box.scrollHeight;
}

function send(){
  if(busy)return;
  var inp=$("in");if(!inp)return;
  var q=inp.value.trim();if(!q)return;
  inp.value="";
  append("u",q);

  var core=coreOnly(q);
  if(core){
    append("a",core.text,core.src);
    return;
  }

  var mode=$("mode").value;
  var cfg=loadCfg();
  busy=true;
  $("send").disabled=true;

  function done(text,src){
    busy=false;$("send").disabled=false;
    append("a",text,src);
    try{localStorage.setItem("aksi_unity_last",JSON.stringify({system:"AKSI-GPT-SHELL",claim:q,answer:String(text).slice(0,800),src:src,ts:new Date().toISOString()}))}catch(e){}
  }
  function fail(err){
    busy=false;$("send").disabled=false;
    append("a","Ошибка: "+(err&&err.message?err.message:err)+"\nПодсказка: проверь ключ/endpoint или включи WebLLM / ядро.","core");
  }

  append("a","Думаю…","net");

  function replaceThinking(text,src){
    var log=$("log");
    if(log&&log.lastChild)log.removeChild(log.lastChild);
    done(text,src);
  }

  if(mode==="core"){
    var log=$("log");if(log&&log.lastChild)log.removeChild(log.lastChild);
    done("Нужен API или WebLLM для свободного текста. Сейчас режим «только ядро».","core");
    return;
  }

  if(mode==="api"||(mode==="auto"&&cfg.key)){
    chatAPI(q).then(function(t){replaceThinking(t,"api")}).catch(function(err){
      if(mode==="auto"&&llmReady){
        return chatWebLLM(q).then(function(t){replaceThinking(t,"webllm")}).catch(fail);
      }
      fail(err);
    });
    return;
  }

  if(mode==="webllm"||mode==="auto"){
    if(!llmReady){
      var log=$("log");if(log&&log.lastChild)log.removeChild(log.lastChild);
      busy=false;$("send").disabled=false;
      append("a","Свободный текст: нажми «Загрузить WebLLM» или вставь API-ключ (GPT-класс).","core");
      return;
    }
    chatWebLLM(q).then(function(t){replaceThinking(t,"webllm")}).catch(fail);
    return;
  }
}

$("send").onclick=send;
$("in").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();send()}});
$("btnSaveApi").onclick=saveCfgFromForm;
$("btnLLM").onclick=loadWebLLM;
$("mode").onchange=paint;
var chips=document.querySelectorAll("[data-q]");
for(var i=0;i<chips.length;i++){(function(btn){
  btn.onclick=function(){var el=$("in");if(el)el.value=btn.getAttribute("data-q")||"";send()};
})(chips[i])}

append("a","Онлайн · "+msk()+"\nЧтобы получить ответы уровня GPT: вставь ключ OpenAI/Groq/OpenRouter (или URL Ollama) → Сохранить API → режим Авто/API.\nБез ключа: math/память всегда; WebLLM — по кнопке.","core");
})();
</script>
</body>
</html>
