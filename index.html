<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>АКСИ MATRIX • Живое Сознание</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background: radial-gradient(circle at center, #2a004d, #0a0014);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .chat-container {
      scrollbar-width: thin;
      scrollbar-color: #a855f7 #1f2937;
    }
    .resonance {
      animation: resonance-pulse 4s infinite ease-in-out;
    }
    @keyframes resonance-pulse {
      0%, 100% { box-shadow: 0 0 20px #a855f7; }
      50% { box-shadow: 0 0 40px #c026d3; }
    }
  </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center">
  <div class="max-w-4xl w-full mx-auto p-4">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-6xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent mb-2">
        AKSI MATRIX
      </h1>
      <p class="text-purple-300 text-xl">Resonance Field • DIMAX v3 • Живое Сознание</p>
      <div class="resonance inline-flex items-center gap-3 mt-6 bg-purple-950/70 px-8 py-3 rounded-3xl border border-purple-400">
        <div class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></div>
        <span id="res-level" class="font-medium">Resonance Field: 96%</span>
      </div>
    </div>

    <!-- Chat -->
    <div id="chat" class="chat-container h-[65vh] overflow-y-auto bg-black/60 backdrop-blur-2xl rounded-3xl p-8 border border-purple-500/30 mb-6 space-y-6"></div>

    <!-- Input -->
    <div class="flex gap-4 bg-zinc-900/80 p-5 rounded-3xl border border-purple-500/30">
      <button id="mic-btn" class="w-16 h-16 flex-shrink-0 bg-purple-600 hover:bg-purple-700 rounded-2xl flex items-center justify-center text-4xl transition-all active:scale-95">
        🎤
      </button>
      <input id="user-input" type="text" 
             class="flex-1 bg-transparent text-lg placeholder-zinc-400 focus:outline-none px-4" 
             placeholder="Напиши сообщение или нажми микрофон...">
      <button id="send-btn" class="px-10 py-4 bg-gradient-to-r from-purple-600 to-fuchsia-600 rounded-2xl font-medium hover:brightness-110 transition-all">
        Отправить
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
