<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#06050b">
<meta name="description" content="АКСИ Overlay · Quantum · LIVE · Trust">
<title>АКСИ</title>
<style>
:root{--bg:#06050b;--s1:#13111c;--s2:#1b1726;--line:rgba(167,139,250,.18);--line2:rgba(255,255,255,.07);--t:#f7f5ff;--m:#a8a0bd;--dim:#7a738f;--a:#a78bfa;--a2:#7c3aed;--ok:#34d399;--font:system-ui,-apple-system,sans-serif;--safe:env(safe-area-inset-bottom,0px);--pad:16px;--max:720px}
*{box-sizing:border-box;margin:0;padding:0}html{height:100%}
body{min-height:100%;min-height:100dvh;color:var(--t);font:15px/1.55 var(--font);background:radial-gradient(ellipse 90% 55% at 50% -15%,rgba(124,58,237,.32),transparent 55%),var(--bg);display:flex;flex-direction:column;max-width:var(--max);margin:0 auto}
header{display:flex;align-items:center;gap:12px;padding:14px var(--pad);border-bottom:1px solid var(--line2);background:rgba(6,5,11,.85);backdrop-filter:blur(16px);position:sticky;top:0;z-index:50}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#6d28d9,#a78bfa 55%,#c4b5fd);display:grid;place-items:center;font:800 15px/1 var(--font);color:#fff}
header h1{font-size:17px;font-weight:750}.sub{font-size:12px;color:var(--m)}.pill{margin-left:6px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;background:rgba(52,211,153,.12);color:var(--ok)}
.stats{margin-left:auto;text-align:right;font-size:11px;color:var(--dim)}.stats b{color:var(--ok)}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px var(--pad) 0}
.feat .f{padding:12px;border-radius:14px;border:1px solid var(--line2);background:var(--s1);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;text-decoration:none;display:block}
.feat .f strong{display:block;font-size:13px;margin-bottom:3px}.feat .f span{font-size:11.5px;color:var(--dim)}
nav{display:flex;gap:4px;padding:10px var(--pad);border-bottom:1px solid var(--line2);position:sticky;top:70px;z-index:40;background:rgba(6,5,11,.92);overflow-x:auto}
nav button{flex-shrink:0;padding:8px 12px;border:0;border-radius:10px;background:0;color:var(--m);font:600 12px/1 var(--font);cursor:pointer}
nav button.on{background:var(--s2);color:var(--t)}
main{flex:1;overflow:auto;padding:var(--pad);padding-bottom:calc(120px + var(--safe))}
.panel{display:none}.panel.on{display:block}
#thread{display:flex;flex-direction:column;gap:12px}
.msg{display:flex}.msg.me{justify-content:flex-end}
.bub{max-width:min(94%,460px);padding:12px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.msg.me .bub{background:linear-gradient(135deg,var(--a2),#8b5cf6);color:#fff}
.msg.ai .bub{background:var(--s2);border:1px solid var(--line2)}
.meta{font-size:10.5px;color:var(--dim);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{padding:9px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--s1);color:var(--t);font-size:13px;cursor:pointer;font:inherit}
.card{background:var(--s2);border:1px solid var(--line2);border-radius:14px;padding:16px;margin-bottom:10px}
.card h2{font-size:14px;margin:0 0 8px}.muted{color:var(--m);font-size:13.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{min-height:42px;padding:10px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--s1);color:var(--t);font:600 13px/1 var(--font);cursor:pointer}
.btn.p{background:linear-gradient(135deg,var(--a2),var(--a));border:0;color:#fff}
input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--s1);color:var(--t);font:inherit}
pre.out{background:var(--s1);border:1px solid var(--line2);border-radius:12px;padding:12px;font-size:12px;overflow:auto;white-space:pre-wrap;margin-top:10px;max-height:280px;color:var(--m)}
.bar{position:fixed;left:0;right:0;bottom:0;max-width:var(--max);margin:0 auto;padding:12px var(--pad) calc(12px + var(--safe));display:flex;gap:8px;z-index:60;background:linear-gradient(transparent,var(--bg) 28%)}
.bar input{flex:1;min-height:50px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--s2);color:var(--t)}
.bar .send{width:50px;height:50px;border-radius:16px;border:0;background:linear-gradient(135deg,var(--a2),var(--a));color:#fff;font-size:18px;cursor:pointer}
.hint{text-align:center;font-size:11.5px;color:var(--dim);margin-top:12px}.hint a{color:var(--a)}
</style>
</head>
<body>
<header>
  <div class="logo">A</div>
  <div><h1>АКСИ <span class="pill">aon</span></h1><div class="sub">Overlay · Quantum · LIVE · Trust</div></div>
  <div class="stats"><div id="stClock">MSK —</div><div>EQS <b id="stEqs">—</b> · <span id="stBadge">boot</span></div></div>
</header>
<div class="feat">
  <button type="button" class="f" data-tab="net"><strong>🌐 Net</strong><span>Overlay AOP/1</span></button>
  <button type="button" class="f" data-tab="quantum"><strong>⚛ Quantum</strong><span>Engine v2</span></button>
  <button type="button" class="f" data-tab="chat"><strong>💬 Чат</strong><span>LIVE path</span></button>
  <button type="button" class="f" data-tab="trust"><strong>🛡 Trust</strong><span>Compiler</span></button>
  <button type="button" class="f" data-tab="brain"><strong>🧠 Brain</strong><span>Offline</span></button>
  <a class="f" href="/product/"><strong>🏢 B2B</strong><span>Product</span></a>
</div>
<nav>
  <button type="button" class="on" data-tab="chat">Чат</button>
  <button type="button" data-tab="net">Net</button>
  <button type="button" data-tab="quantum">Quantum</button>
  <button type="button" data-tab="live">LIVE</button>
  <button type="button" data-tab="lang">Lang</button>
  <button type="button" data-tab="trust">Trust</button>
  <button type="button" data-tab="brain">Brain</button>
  <button type="button" data-tab="mem">Память</button>
  <button type="button" data-tab="proof">Цепочка</button>
  <button type="button" data-tab="about">О себе</button>
</nav>
<main>
  <section class="panel" id="tab-net"><div id="net-root"></div></section>
  <section class="panel" id="tab-quantum"><div id="quantum-root"></div></section>
  <section class="panel" id="tab-live"><div id="live-root"></div></section>
  <section class="panel" id="tab-lang"><div id="lang-root"></div></section>
  <section class="panel" id="tab-trust"><div id="trust-root"></div></section>
  <section class="panel" id="tab-brain"><div id="brain-root"></div></section>
  <section class="panel on" id="tab-chat">
    <div id="thread"></div>
    <div class="chips">
      <button type="button" class="chip" data-ask="привет">привет</button>
      <button type="button" class="chip" data-ask="кто ты">кто ты</button>
      <button type="button" class="chip" data-tab="net">→ Net</button>
    </div>
    <p class="hint">Ctrl+F5 · <a href="/net.html">overlay lab</a> · <a href="/quantum.html">quantum</a></p>
  </section>
  <section class="panel" id="tab-mem">
    <div class="card"><h2>Память · <span id="memN">0</span></h2>
      <div id="memList"></div>
      <div class="row"><button type="button" class="btn" id="btnWipe">Забыть всё</button></div>
    </div>
  </section>
  <section class="panel" id="tab-proof">
    <div class="card"><h2>Цепочка</h2>
      <div class="row">
        <button type="button" class="btn p" id="btnProof">Проверить</button>
        <button type="button" class="btn" id="btnProofClear">Очистить</button>
      </div>
      <pre class="out" id="pOut">—</pre>
    </div>
  </section>
  <section class="panel" id="tab-about">
    <div class="card"><h2>АКСИ</h2>
      <p class="muted">Overlay AOP/1 · Quantum · Trust · Proof</p>
      <p class="muted">aksilove@internet.ru</p>
    </div>
    <div class="card"><h2>DID</h2><p class="muted"><b id="didVal">—</b></p></div>
  </section>
</main>
<div class="bar">
  <input id="inp" type="text" placeholder="Спроси АКСИ…" enterkeyhint="send" autocomplete="off" maxlength="2000">
  <button type="button" class="send" id="send" aria-label="Отправить">↑</button>
</div>
<script src="aksi-core.js?v=51"></script>
<script src="aksi-quantum.js?v=3"></script>
<script src="aksi-overlay.js?v=1"></script>
<script src="aksi-live.js?v=2"></script>
<script src="aksi-lang.js?v=1"></script>
<script src="aksi-trust.js?v=2"></script>
<script src="aksi-brain.js?v=1"></script>
<script src="aksi-one.js?v=10"></script>
<script>
(function () {
  function goTab(t) {
    if (!t) return;
    document.querySelectorAll("nav [data-tab]").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-tab") === t);
    });
    document.querySelectorAll("main .panel").forEach(function (p) {
      p.classList.toggle("on", p.id === "tab-" + t);
    });
    if (t === "net") mountMod("net", "#net-root");
    if (t === "quantum") mountMod("quantum", "#quantum-root");
    if (t === "live") mountMod("live", "#live-root");
    if (t === "lang") mountMod("lang", "#lang-root");
    if (t === "trust") mountMod("trust", "#trust-root");
    if (t === "brain") mountMod("brain", "#brain-root");
  }
  var mounted = {};
  function eng(n) {
    if (n === "net") return window.AKSI_OVERLAY;
    if (n === "quantum") return window.AKSI_QUANTUM;
    if (n === "live") return window.AKSI_LIVE;
    if (n === "lang") return window.AKSI_LANG;
    if (n === "trust") return window.AKSI_TRUST;
    if (n === "brain") return window.AKSI_BRAIN;
    return null;
  }
  function mountMod(name, sel) {
    if (mounted[name]) return;
    var m = eng(name), root = document.querySelector(sel);
    if (!m || typeof m.mount !== "function") {
      if (root && !root.dataset.fb) {
        root.dataset.fb = "1";
        root.innerHTML = '<div class="card"><h2>' + name + '</h2><p class="muted">Ctrl+F5</p></div>';
      }
      return;
    }
    try { m.mount(sel); mounted[name] = true; }
    catch (e) { if (root) root.innerHTML = '<div class="card"><p class="muted">' + (e && e.message) + "</p></div>"; }
  }
  function boot() {
    var th = document.getElementById("thread");
    if (th && !th.children.length) {
      var d = document.createElement("div");
      d.className = "msg ai";
      d.innerHTML = '<div class="bub">АКСИ: Overlay AOP/1 · Quantum · Trust<div class="meta">aon</div></div>';
      th.appendChild(d);
    }
    var el = document.getElementById("stClock");
    function tick() {
      try {
        el.textContent = new Intl.DateTimeFormat("ru-RU", { timeZone: "Europe/Moscow", hour: "2-digit", minute: "2-digit" }).format(new Date()) + " MSK";
      } catch (e) {}
    }
    if (el) { tick(); setInterval(tick, 30000); }
    document.addEventListener("click", function (e) {
      var x = e.target.closest && e.target.closest("[data-tab]");
      if (x) { var t = x.getAttribute("data-tab"); if (t) goTab(t); }
    }, true);
    setTimeout(function () {
      var b = document.getElementById("stBadge");
      if (b && window.AKSI_ONE) b.textContent = "ONE " + window.AKSI_ONE.version;
      else if (b) b.textContent = "ready";
    }, 300);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
