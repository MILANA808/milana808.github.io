<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>АКСИ</title>
<meta name="theme-color" content="#5b21b6">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box;margin:0}
body{
  font-family:system-ui,-apple-system,sans-serif;
  background:#5b21b6;color:#fff;
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px;text-align:center;
}
.orb{
  width:88px;height:88px;border-radius:50%;margin-bottom:24px;
  background:radial-gradient(circle at 30% 30%,#fff,#c4b5fd 40%,#7c3aed);
  box-shadow:0 0 48px rgba(167,139,250,.5);
}
h1{font-size:2rem;font-weight:900;margin-bottom:10px}
p{font-size:1.1rem;opacity:.9;margin-bottom:28px;max-width:16em;line-height:1.4}
a{
  display:block;width:100%;max-width:320px;text-align:center;text-decoration:none;
  font-size:1.25rem;font-weight:900;padding:20px;border-radius:16px;margin-bottom:12px;
}
a.main{background:#fff;color:#5b21b6}
a.sec{border:3px solid #fff;color:#fff}
</style>
</head>
<body>
<div class="orb"></div>
<h1>АКСИ</h1>
<p>Суверенный экзокортекс на вашем телефоне</p>
<a class="main" href="/app/">ОТКРЫТЬ ПРИЛОЖЕНИЕ</a>
<a class="sec" href="/nav/">Навигатор</a>
</body>
</html>
