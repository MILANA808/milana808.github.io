<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АКСИ — offline-агент на вашем устройстве</title>
<meta name="description" content="АКСИ: локальные ответы, память, Студия режимов. Не AGI.">
<link rel="canonical" href="https://milana808.github.io/">
<meta name="theme-color" content="#11100e">
<style>
:root{--bg:#11100e;--panel:#1a1815;--ink:#f2ebe3;--muted:#9a9288;--line:#2f2c28;--acc:#e8e0d4;--ok:#4a9b6a;--mono:ui-monospace,Consolas,monospace;--sans:system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font:15px/1.45 var(--sans);background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;letter-spacing:.12em;font-size:12px;text-transform:uppercase}.logo span{opacity:.4;font-weight:600}
header a{color:var(--muted);font-size:12px;text-decoration:none;margin-left:12px}
.shell{max-width:720px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;min-height:0;padding:0 12px}
.intro{padding:16px 0 8px}.intro h1{font-size:1.35rem;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}.intro p{color:var(--muted);font-size:14px;max-width:42ch}
#st{font-family:var(--mono);font-size:11px;color:var(--muted);margin:8px 0}
#feed{flex:1;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:280px}
.msg{margin-bottom:14px}.msg .h{font-size:11px;font-family:var(--mono);color:var(--muted);margin-bottom:3px}.msg .h.bot{color:var(--ok)}.msg .b{white-space:pre-wrap;word-break:break-word}
.composer{display:flex;gap:8px;padding:12px 0 18px}
input{flex:1;background:#0c0b0a;border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;padding:12px 14px}
button{background:var(--acc);color:var(--bg);border:0;border-radius:10px;font:inherit;font-weight:700;padding:12px 16px;cursor:pointer}button:disabled{opacity:.4}
.hint{font-size:12px;color:var(--muted);padding-bottom:8px}
</style>
</head>
<body>
<header>
  <div class="logo">АКСИ <span>OFFLINE</span></div>
  <div><a href="/studio/">Студия</a><a href="/llm/">LLM</a><a href="/runtime/">Runtime</a><a href="mailto:aksilove@internet.ru">контакт</a></div>
</header>
<div class="shell">
  <div class="intro">
    <h1>Локальный агент на вашем устройстве</h1>
    <p>Offline-агент + <a href="/studio/" style="color:#e8e0d4">Студия режимов</a> (ядро 2025: метакод, Guardian, оси). Не AGI.</p>
  </div>
  <div id="st">загрузка…</div>
  <div class="hint">«кто ты?» · «запомни: факт» · Студия: /studio/</div>
  <div id="feed"></div>
  <div class="composer">
    <input id="q" placeholder="Спросите АКСИ…" maxlength="2000" autocomplete="off">
    <button type="button" id="go">Спросить</button>
  </div>
</div>
<script src="/aksi-neuro.js?v=10"></script>
<script src="/aksi-knowledge.js?v=3"></script>
<script>
(function(){
  var MEM='aksi_product_mem_v1';
  var feed=document.getElementById('feed');
  var st=document.getElementById('st');
  function esc(s){return String(s||'').replace(/[&<>]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;'})[c];});}
  function loadMem(){try{var a=JSON.parse(localStorage.getItem(MEM)||'[]');return Array.isArray(a)?a:[];}catch(e){return[];}}
  function saveMem(a){try{localStorage.setItem(MEM,JSON.stringify(a.slice(0,200)));}catch(e){}}
  function add(who,text,meta){
    var d=document.createElement('div');d.className='msg';
    d.innerHTML='<div class="h '+(who==='АКСИ'?'bot':'')+'">'+esc(who)+(meta?' · '+esc(meta):'')+'</div><div class="b">'+esc(text)+'</div>';
    feed.appendChild(d);feed.scrollTop=feed.scrollHeight;
  }
  function status(){
    var n=!!(window.AKSI_NEURO&&(AKSI_NEURO.think||AKSI_NEURO.query));
    st.textContent=(n?'Neuro on':'Neuro off')+' · память '+loadMem().length+' · offline';
  }
  function teach(q){
    var m=q.match(/^(?:запомни|запомнить|remember)\s*[:：]\s*(.+)$/i);
    if(!m)return null;
    var fact=m[1].trim();if(!fact)return null;
    var arr=loadMem();arr.unshift({t:fact,at:Date.now()});saveMem(arr);
    if(window.AKSI_NEURO&&typeof AKSI_NEURO.learn==='function'){try{AKSI_NEURO.learn(fact);}catch(e){}}
    return 'Запомнила локально: «'+fact.slice(0,180)+'».';
  }
  function fromMem(q){
    var best=null,bs=0,ql=q.toLowerCase().split(/\s+/).filter(function(w){return w.length>2;});
    loadMem().forEach(function(m){
      var t=String(m.t||''),tl=t.toLowerCase(),n=0;
      ql.forEach(function(w){if(tl.indexOf(w)>=0)n++;});
      var s=ql.length?n/ql.length:0;if(s>bs){bs=s;best=t;}
    });
    return bs>=0.3?best:null;
  }
  function neuro(q){
    try{
      if(window.AKSI_NEURO&&typeof AKSI_NEURO.think==='function'){
        var r=AKSI_NEURO.think(q);
        if(typeof r==='string'&&r.trim())return r;
        if(r&&(r.text||r.answer))return String(r.text||r.answer);
      }
    }catch(e){}
    return null;
  }
  function fallback(q){
    var ql=q.toLowerCase();
    if(/кто ты|что ты|что такое акси/.test(ql))return 'Я АКСИ — offline-агент. Студия режимов: /studio/. aksilove@internet.ru. Не AGI.';
    if(/привет|здравств/.test(ql))return 'Привет. Спросите или «запомни: …». Студия: /studio/';
    if(/студи|метакод|guardian/.test(ql))return 'Студия режимов (ядро 2025): https://milana808.github.io/studio/';
    return 'Точного ответа нет. «запомни: …» или /studio/.';
  }
  function answer(q){
    var t=teach(q);if(t)return{text:t,src:'память'};
    var m=fromMem(q);if(m)return{text:m,src:'память'};
    var n=neuro(q);if(n)return{text:n,src:'neuro'};
    return{text:fallback(q),src:'ядро'};
  }
  function send(){
    var q=document.getElementById('q').value.trim();if(!q)return;
    document.getElementById('q').value='';add('Вы',q);
    document.getElementById('go').disabled=true;
    setTimeout(function(){var r=answer(q);add('АКСИ',r.text,r.src);document.getElementById('go').disabled=false;status();},30);
  }
  document.getElementById('go').onclick=send;
  document.getElementById('q').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();send();}});
  status();
  add('АКСИ','На связи. Агент + Студия режимов /studio/ (метакод 2025).','система');
})();
</script>
</body>
</html>
