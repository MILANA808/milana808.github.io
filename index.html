<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>АКСИ</title>
<meta name="theme-color" content="#0b1020"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:#0b1020;color:#e8eefc;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
header{padding:8px 12px;border-bottom:1px solid #24304d;display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}
#msk{margin-left:auto;color:#8b9bb8;font-size:11px}
main{flex:1;max-width:720px;width:100%;margin:0 auto;padding:8px 12px 70px;display:flex;flex-direction:column;gap:8px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(max-width:520px){.board{grid-template-columns:1fr 1fr}}
.metric{background:#121a2f;border:1px solid #24304d;border-radius:10px;padding:8px}
.metric .k{font-size:9px;color:#8b9bb8;text-transform:uppercase}
.metric .v{font-size:13px;font-weight:700;margin-top:2px;word-break:break-all}
.metric .s{font-size:10px;color:#94a3b8}
.seal{background:#0e1528;border:1px solid #334155;border-radius:10px;padding:8px;font-size:11px;font-family:ui-monospace,monospace;color:#a5b4fc;white-space:pre-wrap;line-height:1.35}
.seal.good{border-color:#14532d;color:#86efac}
.seal.bad{border-color:#7f1d1d;color:#fca5a5}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:100px;max-height:calc(100dvh - 340px)}
.msg{padding:10px 12px;border-radius:12px;white-space:pre-wrap;font-size:14px;line-height:1.45;max-width:94%}
.u{align-self:flex-end;background:#0a0f1c;border:1px solid #24304d}
.a{align-self:flex-start;background:rgba(129,140,248,.12);border:1px solid rgba(129,140,248,.3)}
.tag{font-size:10px;color:#8b9bb8;margin-bottom:3px}
.bar{display:flex;gap:8px}
input{flex:1;background:#121a2f;border:1px solid #24304d;border-radius:12px;color:#e8eefc;padding:12px;font-size:15px;outline:none}
input:focus{border-color:#818cf8}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:13px;cursor:pointer;background:#22d3ee;color:#06202a;font-family:inherit}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{padding:7px 10px;font-size:11px;background:#121a2f;color:#c7d2fe;border:1px solid #24304d}
.panel{display:flex;flex-direction:column;gap:8px}
.panel[hidden]{display:none!important}
.card{background:#121a2f;border:1px solid #24304d;border-radius:12px;padding:12px;font-size:13px;white-space:pre-wrap;line-height:1.4}
#star{width:100%;max-width:300px;height:160px;background:#f8fafc;border-radius:12px;align-self:center}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#0b1020f2;border-top:1px solid #24304d;display:flex;justify-content:center;gap:2px;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
.bnav button{flex:1;max-width:88px;background:transparent;color:#94a3b8;border:1px solid transparent;font-size:11px;padding:10px 2px;border-radius:10px}
.bnav button.on{color:#e8eefc;border-color:#334155;background:#121a2f}
.foot{font-size:10px;color:#64748b;text-align:center}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <strong>АКСИ</strong>
  <span id="testBadge" style="color:#8b9bb8;font-size:11px">…</span>
  <span id="msk">—</span>
</header>
<main>
  <div class="board">
    <div class="metric"><div class="k">H_eff</div><div class="v" id="mH">—</div><div class="s" id="mSt">QBM</div></div>
    <div class="metric"><div class="k">Гершгорин</div><div class="v" id="mG">—</div><div class="s" id="mGs">стаб.</div></div>
    <div class="metric"><div class="k">Proof</div><div class="v" id="mP" style="font-family:ui-monospace,monospace;font-size:12px;color:#a5b4fc">—</div><div class="s" id="mPs">seal</div></div>
    <div class="metric"><div class="k">Тесты</div><div class="v" id="mT">—</div><div class="s" id="mTs">авто</div></div>
  </div>
  <div class="seal" id="sealBox">загрузка…</div>
  <div class="panel" data-panel="chat">
    <div id="log"></div>
    <div class="chips">
      <button type="button" data-q="кто ты">кто ты</button>
      <button type="button" data-q="12*12">12×12</button>
      <button type="button" data-q="что такое энтропия">энтропия</button>
      <button type="button" data-q="матрица">матрица</button>
      <button type="button" data-act="retest">перетест</button>
    </div>
    <div class="bar">
      <input id="in" type="text" placeholder="Спроси что угодно…" autocomplete="off" enterkeyhint="send"/>
      <button type="button" id="send">→</button>
    </div>
  </div>
  <div class="panel" data-panel="matrix" hidden>
    <canvas id="star" width="300" height="160"></canvas>
    <div class="card" id="matrixCard">MATRIX D4 · QBM + Гершгорин</div>
  </div>
  <div class="panel" data-panel="trust" hidden>
    <div class="card" id="trustList">чеки…</div>
  </div>
  <div class="panel" data-panel="memory" hidden>
    <div class="card" id="memList">память…</div>
    <button type="button" data-act="clearMem" style="align-self:flex-start;background:#121a2f;color:#c7d2fe;border:1px solid #24304d">очистить</button>
  </div>
  <div class="panel" data-panel="lab" hidden>
    <div class="card" id="labOut">lab…</div>
    <button type="button" data-act="qrun" style="align-self:flex-start">коллапс</button>
  </div>
  <div class="foot">aksilove@internet.ru · WHOLE mono</div>
</main>
<nav class="bnav">
  <button type="button" data-tab="chat" class="on">Chat</button>
  <button type="button" data-tab="matrix">Matrix</button>
  <button type="button" data-tab="trust">Trust</button>
  <button type="button" data-tab="memory">Memory</button>
  <button type="button" data-tab="lab">Lab</button>
</nav>
<script src="./aksi-whole.js?v=1"></script>
</body>
</html>
