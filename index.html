<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АКСИ</title>
<meta name="theme-color" content="#05010f">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#05010f;--ink:#f3e8ff;--muted:#9d8ec4;--line:rgba(168,85,247,.2);--violet:#a855f7}
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;color:var(--ink);font-family:system-ui,sans-serif;background:radial-gradient(ellipse 90% 50% at 50% -10%,rgba(168,85,247,.28),transparent 50%),#05010f}
.wrap{max-width:480px;margin:0 auto;padding:56px 20px 72px}
.mark{font-size:11px;letter-spacing:.35em;font-weight:600;color:var(--muted);margin-bottom:28px}
h1{font-size:clamp(2.5rem,9vw,3.4rem);font-weight:600;letter-spacing:-.04em;line-height:1.05;margin-bottom:16px}
.lead{font-size:16px;line-height:1.55;color:var(--muted);margin-bottom:36px;max-width:34ch}
.btn{display:inline-flex;padding:15px 24px;border-radius:16px;font-size:15px;font-weight:600;text-decoration:none}
.btn-main{background:linear-gradient(145deg,#a855f7,#6366f1);color:#fff;box-shadow:0 10px 36px rgba(168,85,247,.4)}
.btn-ghost{color:var(--muted);border:1px solid var(--line);margin-left:10px}
.links{margin-top:56px;display:flex;flex-direction:column}
.links a{display:flex;justify-content:space-between;padding:16px 2px;color:var(--ink);text-decoration:none;font-size:15px;border-bottom:1px solid var(--line)}
.links a span{color:#6b6578;font-size:13px}
.links a:hover{color:var(--violet)}
foot{display:block;margin-top:48px;font-size:12px;color:#5c5668}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">АКСИ</div>
  <h1>Суверенный<br>интеллект</h1>
  <p class="lead">Именной ИИ с памятью, кодексом и открытыми источниками.</p>
  <div>
    <a class="btn btn-main" href="/aksi/">Открыть АКСИ</a>
    <a class="btn btn-ghost" href="/CODEX.md">Кодекс</a>
  </div>
  <nav class="links">
    <a href="/aksi/">Диалог <span>главное</span></a>
    <a href="/showcase/">Паспорт <span>DID</span></a>
    <a href="/messages/">Сообщения <span>E2E</span></a>
    <a href="/matrix.html">Лаборатория <span>quantum</span></a>
    <a href="/hub/">Все разделы <span>hub</span></a>
  </nav>
  <foot>aksilove@internet.ru</foot>
</div>
</body>
</html>
