<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АКСИ</title>
<meta name="theme-color" content="#030014">
<style>
:root{--bg:#030014;--ink:#f5f3ff;--muted:#a5b4fc;--violet:#8b5cf6;--cyan:#22d3ee}
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(91,33,182,.45),transparent 55%),var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
.wrap{max-width:440px;margin:0 auto;padding:40px 18px 100px}
.logo{font-size:11px;letter-spacing:.4em;font-weight:700;color:var(--muted);margin-bottom:20px}
h1{font-size:clamp(2rem,7vw,2.6rem);font-weight:750;letter-spacing:-.04em;line-height:1.05;margin-bottom:12px}
.lead{font-size:15px;color:var(--muted);line-height:1.5;margin-bottom:24px}
a.hero{display:block;padding:20px;border-radius:18px;text-decoration:none;color:#fff;text-align:center;font-weight:700;margin-bottom:10px}
a.hero.main{background:linear-gradient(135deg,#7c3aed,#4f46e5 40%,#0891b2);box-shadow:0 12px 40px rgba(124,58,237,.4);font-size:18px}
a.hero.alt{background:rgba(139,92,246,.2);border:1px solid rgba(139,92,246,.4);font-size:16px}
a.hero span{display:block;font-size:12px;font-weight:500;opacity:.85;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.card{display:block;padding:14px;border-radius:14px;background:rgba(30,20,60,.6);border:1px solid rgba(139,92,246,.25);text-decoration:none;color:var(--ink)}
.card strong{display:block;font-size:14px}
.card span{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">АКСИ</div>
  <h1>Не сайт.<br>Поле.</h1>
  <p class="lead">Пульс с печатью, сны, личная сеть, навигатор и космос — соберись в одной точке.</p>
  <a class="hero main" href="/wow/">Войти в поле<span>вау-сцена · live Resonance</span></a>
  <a class="hero alt" href="/aksi/">Чат с АКСИ<span>на связи</span></a>
  <nav class="grid">
    <a class="card" href="/dreams/"><strong>Сны + печать</strong><span>подписанные</span></a>
    <a class="card" href="/net/"><strong>Сеть</strong><span>ваши знания</span></a>
    <a class="card" href="/drive/"><strong>Путь</strong><span>навигатор</span></a>
    <a class="card" href="/solar/"><strong>Космос</strong><span>планеты</span></a>
  </nav>
</div>
<script src="/nav.js"></script>
</body>
</html>
