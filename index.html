<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>АКСИ</title>
<meta name="theme-color" content="#0b1020"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:#0b1020;color:#e8eefc;font-family:system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:10px 14px;border-bottom:1px solid #24304d;display:flex;align-items:center;gap:10px;font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:#34d399}
#st{margin-left:auto;font-size:11px;color:#8b9bb8}
main{flex:1;max-width:720px;width:100%;margin:0 auto;padding:10px 14px 80px;display:flex;flex-direction:column;gap:10px}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:200px}
.msg{padding:12px 14px;border-radius:14px;white-space:pre-wrap;font-size:15px;line-height:1.55;max-width:92%}
.u{align-self:flex-end;background:#121a2f;border:1px solid #24304d}
.a{align-self:flex-start;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.25)}
.bar{display:flex;gap:8px}
input{flex:1;background:#121a2f;border:1px solid #24304d;border-radius:14px;color:#e8eefc;padding:14px;font-size:16px;outline:none}
button#send{border:0;border-radius:14px;padding:14px 18px;font-weight:700;background:#22d3ee;color:#06202a;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:8px 12px;font-size:12px;background:#121a2f;color:#c7d2fe;border:1px solid #24304d;border-radius:10px;cursor:pointer}
.foot{font-size:11px;color:#64748b;text-align:center;padding:8px}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <strong>АКСИ</strong>
  <span id="st">…</span>
</header>
<main>
  <div id="log"></div>
  <div class="chips">
    <button type="button" data-q="кто ты">кто ты</button>
    <button type="button" data-q="что такое энтропия">энтропия</button>
    <button type="button" data-q="что такое искусственный интеллект">ИИ</button>
    <button type="button" data-q="что такое сознание">сознание</button>
    <button type="button" data-q="2+2">2+2</button>
  </div>
  <div class="bar">
    <input id="in" type="text" placeholder="Вопрос…" autocomplete="off" enterkeyhint="send"/>
    <button type="button" id="send">→</button>
  </div>
  <div class="foot">aksilove@internet.ru</div>
</main>
<script src="./aksi-seed.js?v=32"></script>
<script src="./aksi-net.js?v=2"></script>
<script>
(function(){
"use strict";
var FK="aksi_facts_v1", facts={};
try{facts=JSON.parse(localStorage.getItem(FK)||"{}")||{}}catch(e){}
function $(id){return document.getElementById(id)}
function saveF(){try{localStorage.setItem(FK,JSON.stringify(facts))}catch(e){}}
function norm(s){return String(s||"").toLowerCase().replace(/[«»"'`?!.,;:()]/g," ").replace(/\s+/g," ").trim()}
function toks(s){return norm(s).split(" ").filter(function(w){return w.length>1})}
function fmt(x){if(!isFinite(x))return"—";if(Math.abs(x-Math.round(x))<1e-10)return String(Math.round(x));return String(parseFloat(x.toFixed(6)))}

function seedScore(q){
  var SEED=(window.__AKSI_SEED||[]), n=norm(q), t=toks(q), best=[], i,j;
  for(i=0;i<SEED.length;i++){
    var s=SEED[i], k=norm(s.q), sc=0;
    if(n===k||n.indexOf(k)>=0||k.indexOf(n)>=0)sc+=12;
    for(j=0;j<t.length;j++){
      if(k.indexOf(t[j])>=0)sc+=4;
      if(norm(s.a).indexOf(t[j])>=0)sc+=1;
    }
    if(sc>0)best.push({sc:sc,a:s.a,q:s.q});
  }
  best.sort(function(a,b){return b.sc-a.sc});
  return best;
}

function identity(q){
  var l=norm(q);
  if(/^(кто ты|who are you|представься)$/.test(l)||l==="кто ты"||l.indexOf("кто ты")===0)
    return"Я Акси — помощник в этом браузере. Отвечаю по знаниям, считаю, запоминаю факты. Работаю без облака. Контакт: aksilove@internet.ru";
  if(/что ты умеешь|помощь|help/.test(l))
    return"Могу ответить на вопросы из базы знаний, посчитать, запомнить («запомни: ключ = значение»). Спроси, например, про энтропию, ИИ или сознание.";
  if(/статус|status/.test(l)){
    var net=window.AKSI_NET&&window.AKSI_NET.status?window.AKSI_NET.status():{};
    return"Работаю. Знаний: "+((window.__AKSI_SEED&&window.__AKSI_SEED.length)||0)+". Сеть: "+(net.ready?"готова":"учится")+".";
  }
  return null;
}

function remember(q){
  var m=String(q).match(/^запомни\s*[:：]?\s*(.+?)\s*[=:]\s*(.+)$/i);
  if(!m)return null;
  var k=norm(m[1]),v=m[2].trim();
  if(!k)return null;
  facts[k]=v;saveF();
  return"Запомнила: "+k+" = "+v;
}
function recall(q){
  var l=norm(q),keys=Object.keys(facts),i;
  for(i=0;i<keys.length;i++){
    if(l.indexOf(keys[i])>=0||keys[i].indexOf(l)>=0)return facts[keys[i]];
  }
  return null;
}

function mathA(q){
  var raw=String(q).trim(),low=raw.toLowerCase();
  var pm=low.match(/(\d+(?:[.,]\d+)?)\s*%\s*(?:от)?\s*(\d+(?:[.,]\d+)?)/);
  if(pm)return fmt((+pm[1].replace(",","."))/100*(+pm[2].replace(",",".")));
  var fact=low.match(/(\d+)\s*!/);
  if(fact){var n=+fact[1];if(n>20)return null;var f=1,i;for(i=2;i<=n;i++)f*=i;return String(f)}
  var expr=raw.replace(/[=?]/g,"").replace(/×/g,"*").replace(/÷/g,"/").replace(/,/g,".").trim();
  if(!/^[0-9+\-*/().\s]+$/.test(expr)||expr.length>40)return null;
  try{var v=Function('"use strict";return('+expr+")")();return typeof v==="number"&&isFinite(v)?fmt(v):null}catch(e){return null}
}

function knowledge(q){
  var hits=seedScore(q);
  if(!hits.length||hits[0].sc<4)return null;
  return hits[0].a;
}

function wiki(q,cb){
  var term=toks(q).slice(0,5).join(" ")||q;
  fetch("https://ru.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(term))
    .then(function(r){if(!r.ok)throw new Error();return r.json()})
    .then(function(j){if(j&&j.extract)cb(j.extract.slice(0,500));else cb(null)})
    .catch(function(){cb(null)});
}

function add(role,text){
  var log=$("log");if(!log)return;
  var d=document.createElement("div");
  d.className="msg "+(role==="u"?"u":"a");
  d.textContent=text;
  log.appendChild(d);
  log.scrollTop=log.scrollHeight;
}

function answer(q,cb){
  var a;
  a=identity(q);if(a){cb(a);return}
  a=remember(q);if(a){cb(a);return}
  a=recall(q);if(a){cb(a);return}
  a=mathA(q);if(a){cb(a);return}
  a=knowledge(q);if(a){cb(a);return}
  wiki(q,function(txt){
    if(txt){cb(txt);return}
    try{
      if(window.AKSI_NET&&window.AKSI_NET.status&&window.AKSI_NET.status().ready){
        var g=window.AKSI_NET.generate(q+" ",{n:80,temperature:0.5});
        if(g&&g.text&&g.text.length>q.length+10){cb(g.text.slice(q.length).trim());return}
      }
    }catch(e){}
    cb("Не нашла ответ. Попробуй другой вопрос или «запомни: тема = текст».");
  });
}

function send(){
  var inp=$("in");if(!inp)return;
  var q=inp.value.trim();if(!q)return;
  inp.value="";
  add("u",q);
  answer(q,function(txt){add("a",txt||"…")});
}

function boot(){
  try{
    if(window.AKSI_NET&&window.AKSI_NET.autoPretrain){
      setTimeout(function(){try{window.AKSI_NET.autoPretrain()}catch(e){}},300);
    }
  }catch(e){}
  var n=(window.__AKSI_SEED&&window.__AKSI_SEED.length)||0;
  if($("st"))$("st").textContent=n?"знаний: "+n:"готово";
  if($("dot"))$("dot").style.background="#34d399";
  $("send").onclick=send;
  $("in").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();send()}});
  document.addEventListener("click",function(ev){
    var t=ev.target;if(!t||!t.getAttribute)return;
    var q=t.getAttribute("data-q");
    if(q!=null){if($("in"))$("in").value=q;send()}
  });
  add("a","Акси на связи. Задай вопрос.");
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();
</script>
</body>
</html>
