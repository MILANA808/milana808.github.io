<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><meta name="description" content="АКСИ — персональная local-first когнитивная система."><title>АКСИ — личная когнитивная система</title><style>:root{font:16px system-ui,-apple-system,sans-serif;color-scheme:dark;--bg:#09090b;--panel:#15151a;--line:#2a2a31;--text:#f4f4f5;--muted:#a1a1aa;--accent:#8b5cf6;--ok:#34d399}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);display:grid;place-items:center;padding:22px}main{width:min(680px,100%)}.mark{width:54px;height:54px;border-radius:16px;background:var(--accent);display:grid;place-items:center;font-weight:800;margin-bottom:18px}h1{font-size:36px;letter-spacing:-.04em;margin:0 0 8px}.lead{color:var(--muted);line-height:1.55}.status{margin:22px 0;padding:14px 16px;border:1px solid var(--line);background:var(--panel);border-radius:14px;font-size:13px}.ok{color:var(--ok)}.btn{display:block;text-align:center;text-decoration:none;padding:15px;border-radius:13px;background:var(--accent);color:#fff;font-weight:700}.small{color:var(--muted);font-size:12px;line-height:1.5}</style></head><body><main><div class="mark">A</div><h1>АКСИ</h1><p class="lead">Персональная <b>local-first</b> система для диалога, памяти, обучения и проверяемого следа.</p><div class="status"><span class="ok">●</span> <span id="state">Проверяю локальное ядро…</span></div><a class="btn" href="aksi-console.html">Открыть АКСИ</a><p class="small">Внутри одной консоли: Чат · Trust · Память · Lab. Интернет выключен по умолчанию. Хэш подтверждает целостность записи, а не истинность утверждения.</p><script src="/aksi-runtime.js"></script><script>(async()=>{try{const r=await window.AKSI_BOOT,s=await r.status();document.getElementById('state').textContent=s.selfTest?.ok?'АКСИ готова · локальное ядро работает':'АКСИ запущена с ограничениями'}catch(e){document.getElementById('state').textContent='Локальное ядро не запустилось: '+(e.message||e)}})();</script></main></body></html>
