<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="АКСИ — проверяемый локальный ИИ. Источники, уверенность, без выдумок.">
<meta http-equiv="Cache-Control" content="no-cache">
<title>АКСИ · правда</title>
<style>
:root{--bg:#0b1020;--card:rgba(30,41,59,.78);--line:rgba(148,163,184,.22);--ink:#f8fafc;--muted:#94a3b8;--acc:#8b5cf6;--acc2:#22d3ee;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(900px 420px at 0% -5%,#1e1b4b,transparent 55%),radial-gradient(700px 360px at 100% 0%,#0e749018,transparent),var(--bg);color:var(--ink);display:flex;flex-direction:column;max-width:860px;margin:0 auto}
header{padding:max(12px,env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:rgba(11,16,32,.75);backdrop-filter:blur(14px);position:sticky;top:0;z-index:30}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-weight:900;color:#0b1020;box-shadow:0 0 18px rgba(139,92,246,.4)}
.brand h1{font-size:1.05rem;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:11px}
#status{font-size:11px;color:var(--muted);text-align:right;max-width:48%}
.nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
.nav button,.nav a,.nav label{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 12px;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer;min-height:38px}
.nav button.on{background:linear-gradient(135deg,#7c3aed,#6366f1);border-color:transparent}
.hero{margin:12px 12px 0;padding:14px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(52,211,153,.1),rgba(139,92,246,.1))}
.hero h2{font-size:1.1rem;margin-bottom:4px}
.hero p{color:var(--muted);font-size:13px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{border:1px solid var(--line);background:rgba(15,23,42,.55);color:var(--ink);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer}
#prog{display:none;padding:6px 14px;font-size:12px;color:var(--acc2)}
#prog.on{display:block}
#thread{flex:1;overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}
.msg{margin:0 0 12px;max-width:94%;animation:in .2s ease}
.msg.u{margin-left:auto}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.b{padding:12px 14px;border-radius:16px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.u .b{background:linear-gradient(135deg,#7c3aed,#6366f1);color:#fff;border-bottom-right-radius:5px}
.msg.a .b{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.proof{margin-top:6px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid var(--line);font-size:11px;line-height:1.45;color:var(--muted)}
.proof b{color:var(--acc2);font-weight:700}
.badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:800;margin-right:4px}
.badge.high{background:rgba(52,211,153,.2);color:var(--ok)}
.badge.mid{background:rgba(251,191,36,.15);color:var(--warn)}
.badge.low{background:rgba(248,113,113,.15);color:var(--bad)}
.badge.unk{background:rgba(148,163,184,.15);color:var(--muted)}
.meta{font-size:10px;color:var(--muted);margin-top:3px}
.composer{display:flex;gap:8px;padding:10px 12px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(11,16,32,.9);backdrop-filter:blur(12px)}
#inp{flex:1;min-height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(30,41,59,.85);color:var(--ink);padding:12px 14px;font-size:16px;outline:none}
#inp:focus{border-color:rgba(139,92,246,.5)}
#send{width:52px;border:0;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#6366f1);color:#fff;font-weight:800;font-size:18px;cursor:pointer}
#file{display:none}
.drawer{display:none;border-top:1px solid var(--line);background:rgba(15,23,42,.96);max-height:38vh;overflow:auto;padding:12px}
.drawer.on{display:block}
.drawer h3{font-size:12px;color:var(--acc2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.fact{display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--card);font-size:13px}
.fact button{border:0;background:transparent;color:var(--muted);cursor:pointer}
.footer{text-align:center;padding:4px 10px 8px;font-size:10px;color:var(--muted)}
.footer a{color:var(--acc2);text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">А</div>
    <div><h1>АКСИ</h1><small>проверяемо · без выдумок</small></div>
  </div>
  <div id="status">…</div>
</header>

<nav class="nav">
  <button type="button" id="btnLLM">✦ Нейросеть</button>
  <button type="button" id="btnMem">Память</button>
  <button type="button" id="btnTruth">Кодекс</button>
  <label for="file">Файл</label>
  <input type="file" id="file" accept=".txt,.md,text/plain" multiple>
  <button type="button" id="btnClear">Очистить чат</button>
  <a href="/lab/">Lab</a>
  <a href="/hub/">Карта</a>
</nav>

<section class="hero" id="hero">
  <h2>Только проверяемые ответы</h2>
  <p>Каждый ответ: источник · уровень уверенности · подпись. Нет данных — прямо «не знаю».</p>
  <div class="chips">
    <button type="button" data-q="кто ты">Кто ты?</button>
    <button type="button" data-q="запомни: проверка истины важнее красоты ответа">Запомни принцип</button>
    <button type="button" data-q="кто президент Франции сейчас">Ловушка (нет данных)</button>
    <button type="button" data-q="проверь: DID АКСИ">Проверка DID</button>
  </div>
</section>

<div id="prog"></div>
<div id="thread"></div>

<div class="drawer" id="drawer">
  <h3>Память фактов (ваши записи)</h3>
  <div id="factList"></div>
  <div style="display:flex;gap:6px;margin-top:8px">
    <input id="factIn" placeholder="Факт…" style="flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#1e293b;color:#fff;font-size:14px">
    <button type="button" id="factAdd" style="padding:10px 14px;border:0;border-radius:10px;background:#7c3aed;color:#fff;font-weight:700">+</button>
  </div>
</div>

<div class="composer">
  <input id="inp" type="text" placeholder="Вопрос или: запомни … / проверь: …" enterkeyhint="send" autocomplete="off">
  <button type="button" id="send">➤</button>
</div>
<div class="footer">DID did:aksi:ed25519:sovereign-2026 · <a href="mailto:aksilove@internet.ru">aksilove@internet.ru</a></div>

<script>
(function(){
"use strict";
var DID="did:aksi:ed25519:sovereign-2026";
var SEED="AKSI_TRUTH_v1_2026";
var DB="aksi_truth_v1";
var history=[], facts=[], learned=[], rag=[], busy=false, engine=null, loadingLLM=false;

var CORE=[
  {id:"c1",t:"АКСИ на этом сайте — local-first ассистент: ответы и данные обрабатываются в браузере пользователя.",k:"акси aksi кто суверен local",conf:1},
  {id:"c2",t:"DID этой инсталляции: did:aksi:ed25519:sovereign-2026.",k:"did идентич",conf:1},
  {id:"c3",t:"Публичный контакт проекта: aksilove@internet.ru.",k:"контакт email почта",conf:1},
  {id:"c4",t:"Факты можно явно записать командой «запомни: …»; они хранятся в IndexedDB на устройстве.",k:"память запомни факт",conf:1},
  {id:"c5",t:"Самообучение: полезные пары вопрос→ответ сохраняются локально и используются при похожих вопросах.",k:"обучен науч выучен",conf:1},
  {id:"c6",t:"WebLLM включается кнопкой «Нейросеть» и не обязателен для базовых ответов.",k:"нейросеть webllm модель",conf:1},
  {id:"c7",t:"Файлы .txt/.md можно загрузить; фрагменты становятся источником типа file.",k:"rag файл документ",conf:1},
  {id:"c8",t:"Модули: /lab (крипто, агенты), /hub (карта), /app (сеть).",k:"lab hub app модул",conf:1},
  {id:"c9",t:"Кодекс: не выдумывать факты вне источников; при отсутствии данных — «не знаю»; указывать источник и уверенность.",k:"кодекс правда врёт исти",conf:1}
];

function $(id){return document.getElementById(id)}
function status(t){$("status").textContent=t}
function prog(t){var p=$("prog");if(!t){p.className="";p.textContent="";return}p.textContent=t;p.className="on"}
function esc(s){return String(s).replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">")}
function hex(buf){return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0")}).join("")}
function sha256(text){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(text)).then(hex)}

function openDB(){return new Promise(function(res,rej){try{var r=indexedDB.open(DB,1);r.onupgradeneeded=function(){var d=r.result;["msgs","facts","learned","rag"].forEach(function(n){if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:"id",autoIncrement:true})})};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}})}
function idbAdd(store,val){return openDB().then(function(db){return new Promise(function(res,rej){var tx=db.transaction(store,"readwrite");tx.objectStore(store).add(val);tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)}})})}
function idbAll(store){return openDB().then(function(db){return new Promise(function(res,rej){var q=db.transaction(store,"readonly").objectStore(store).getAll();q.onsuccess=function(){res(q.result||[])};q.onerror=function(){rej(q.error)}})})}
function idbClear(store){return openDB().then(function(db){return new Promise(function(res,rej){var tx=db.transaction(store,"readwrite");tx.objectStore(store).clear();tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)}})})}

function score(q,text,keys){var low=q.toLowerCase(),n=0,t=(text||"").toLowerCase();low.split(/\s+/).forEach(function(p){if(p.length>1&&t.indexOf(p)>=0)n++});(keys||"").split(/\s+/).forEach(function(k){if(k&&low.indexOf(k)>=0)n+=2});return n}

function allKnowledge(){
  var list=[];
  CORE.forEach(function(c){list.push({text:c.t,keys:c.k,src:"core",conf:c.conf,id:c.id})});
  facts.forEach(function(f){list.push({text:f.text,keys:"",src:"user-fact",conf:0.9,id:"f"})});
  learned.forEach(function(l){list.push({text:l.a,keys:"",src:"learned",conf:0.55,id:"l",q:l.q})});
  rag.forEach(function(r){list.push({text:r.text,keys:"",src:"file",conf:0.7,id:"r",file:r.source})});
  return list;
}

function retrieve(q){
  var hits=[];
  allKnowledge().forEach(function(k){
    var s=score(q,k.text+(k.q||""),k.keys);
    if(k.q&&score(q,k.q,"")>=3)s+=4;
    if(s>0)hits.push({text:k.text,score:s,src:k.src,conf:k.conf,id:k.id,file:k.file,q:k.q});
  });
  hits.sort(function(a,b){return b.score-a.score||b.conf-a.conf});
  return hits.slice(0,8);
}

function confLabel(c){
  if(c>=0.9)return {cls:"high",t:"высокая"};
  if(c>=0.6)return {cls:"mid",t:"средняя"};
  if(c>=0.35)return {cls:"low",t:"низкая"};
  return {cls:"unk",t:"нет данных"};
}

function saveFact(text){
  text=(text||"").trim();
  if(text.length<3)return Promise.resolve(false);
  var item={text:text,ts:Date.now()};
  facts.push(item);
  return idbAdd("facts",item).then(function(){renderFacts();return true}).catch(function(){return true});
}

function renderFacts(){
  var box=$("factList");
  if(!facts.length){box.innerHTML="<p style='color:#94a3b8;font-size:13px'>Пусто. «запомни: …» или поле ниже.</p>";return}
  box.innerHTML=facts.slice().reverse().map(function(f,i){
    var idx=facts.length-1-i;
    return "<div class='fact'><span style='flex:1'>"+esc(f.text)+"</span><button type='button' data-del='"+idx+"'>×</button></div>";
  }).join("");
  box.querySelectorAll("[data-del]").forEach(function(btn){
    btn.onclick=function(){
      facts.splice(+btn.getAttribute("data-del"),1);
      idbClear("facts").then(function(){return Promise.all(facts.map(function(f){return idbAdd("facts",f)}))}).then(renderFacts);
    };
  });
}

function tryLearn(q,a,mode){
  if(mode==="unknown"||mode==="память")return;
  if(!q||!a||a.length<24||a.length>500)return;
  if(/не знаю|нет данных|недостаточно/i.test(a))return;
  if(/запомни/i.test(q))return;
  var item={q:q.slice(0,200),a:a.slice(0,480),ts:Date.now()};
  if(learned.some(function(l){return l.q===item.q}))return;
  learned.push(item);
  if(learned.length>80)learned=learned.slice(-80);
  idbAdd("learned",item).catch(function(){});
}

function parseRemember(q){
  var m=q.match(/^(?:запомни|запомнить|remember)\s*[:\-–]?\s*(.+)$/i);
  return m?m[1].trim():null;
}
function parseVerify(q){
  var m=q.match(/^(?:проверь|verify|проверка)\s*[:\-–]?\s*(.+)$/i);
  return m?m[1].trim():null;
}

function needsExternalWorld(q){
  var low=q.toLowerCase();
  if(/^(кто|что|когда|где|какой|какая|сколько)\s/.test(low)||/сейчас|сегодня|текущ|президент|курс|погод|новост|цена/.test(low)){
    if(/акси|aksi|did|этой страниц|локальн|indexeddb|webllm|памят|лаборатор/.test(low))return false;
    return true;
  }
  return false;
}

function answerPackage(q){
  var hits=retrieve(q);
  var rem=parseRemember(q);
  if(rem){
    saveFact(rem);
    return {text:"Записала как ваш факт:\n«"+rem+"»\n\nИсточник будет: user-fact. Это ваша запись, не внешняя проверка мира.",conf:1,mode:"память",sources:[{src:"user-fact",text:rem}]};
  }
  var ver=parseVerify(q);
  if(ver){
    var vh=retrieve(ver);
    if(vh.length&&vh[0].score>=2){
      return {text:"Проверка «"+ver+"»:\n\nНайдено в источниках:\n"+vh.slice(0,4).map(function(h,i){return (i+1)+". ["+h.src+"] "+h.text}).join("\n")+"\n\nВывод: утверждение опирается на локальные источники сайта/памяти. Это не сертификат внешнего мира.",conf:vh[0].conf,mode:"verify",sources:vh.slice(0,4)};
    }
    return {text:"Проверка «"+ver+"»:\n\nВ локальных источниках (ядро, ваши факты, файлы) совпадений нет.\n\nНе подтверждаю и не отрицаю внешний мир — данных нет.",conf:0,mode:"unknown",sources:[]};
  }
  var low=q.toLowerCase();
  if(/привет|здравств|добрый|hello/.test(low)){
    return {text:"Здравствуйте. Я АКСИ.\n\nОтвечаю только из: ядра сайта, ваших фактов, загруженных файлов и выученных пар. Если данных нет — скажу «не знаю».",conf:1,mode:"core",sources:[{src:"core",text:CORE[0].t}]};
  }
  if(/кодекс|правд|не вр|честн|исти/.test(low)){
    return {text:CORE[8].t+"\n\nПрактика:\n• источник у каждого ответа\n• уверенность high/mid/low/нет данных\n• SHA-256 подпись блока\n• «запомни:» — только ваша запись\n• «проверь: …» — поиск по локальным источникам",conf:1,mode:"core",sources:[{src:"core",text:CORE[8].t}]};
  }
  if(/кто ты|что ты|представь/.test(low)){
    return {text:"Я АКСИ — локальный ассистент этой страницы.\n\nDID: "+DID+"\nФактов (ваши): "+facts.length+"\nВыученных пар: "+learned.length+"\nФрагментов файлов: "+rag.length+"\n\nНе имею скрытого доступа к интернету на этой странице.",conf:1,mode:"core",sources:CORE.slice(0,3).map(function(c){return {src:"core",text:c.t}})};
  }
  if(/что ты помнишь|покажи память|факты/.test(low)){
    if(!facts.length)return {text:"Ваших фактов пока нет. Напишите: запомни: …",conf:1,mode:"core",sources:[]};
    return {text:"Ваши факты:\n"+facts.slice(-15).map(function(f,i){return (i+1)+". "+f.text}).join("\n"),conf:1,mode:"память",sources:facts.slice(-5).map(function(f){return {src:"user-fact",text:f.text}})};
  }
  if(/чему ты науч|выучил|самообуч/.test(low)){
    if(!learned.length)return {text:"Выученных пар пока нет. Они появляются после ответов с источником.",conf:1,mode:"core",sources:[]};
    return {text:"Выучено (локально, conf≈0.55):\n"+learned.slice(-6).map(function(l,i){return (i+1)+". «"+l.q.slice(0,50)+"» → «"+l.a.slice(0,70)+"…»"}).join("\n"),conf:0.55,mode:"learned",sources:[]};
  }
  if(/схем|архитектур|как устроен/.test(low)){
    return {text:"1. Вопрос\n2. Поиск только по локальным источникам\n3. Если пусто / нужен внешний мир без данных → «не знаю»\n4. Иначе ответ + источники + conf + SHA-256\n5. Полезный ответ → может попасть в learned (низкая conf)",conf:1,mode:"core",sources:[{src:"core",text:CORE[8].t}]};
  }
  if(hits.length&&hits[0].score>=2){
    var top=hits.filter(function(h){return h.score>=2}).slice(0,5);
    var conf=Math.min.apply(null,top.map(function(h){return h.conf}));
    if(top.every(function(h){return h.src==="learned"})&&hits[0].score<4)conf=Math.min(conf,0.55);
    var body="По локальным источникам:\n\n"+top.map(function(h,i){return (i+1)+". ["+h.src+"] "+h.text}).join("\n");
    if(needsExternalWorld(q)&&!top.some(function(h){return h.src==="core"||h.src==="user-fact"||h.src==="file"})){
      body+="\n\n⚠ Вопрос похож на запрос о внешнем мире. Подтверждаю только то, что есть выше. Остальное — не знаю.";
      conf=Math.min(conf,0.5);
    }
    return {text:body,conf:conf,mode:top[0].src,sources:top};
  }
  if(needsExternalWorld(q)){
    return {text:"Не знаю.\n\nНа этой странице нет проверенных данных по этому вопросу (нет записи в ядре, ваших фактах и файлах).\n\nЯ не буду угадывать. Запишите факт через «запомни: …» или загрузите файл-источник.",conf:0,mode:"unknown",sources:[]};
  }
  return {text:"Недостаточно локальных данных для проверяемого ответа.\n\nМожно: уточнить вопрос · запомни: факт · загрузить файл · «проверь: …»",conf:0,mode:"unknown",sources:[]};
}

function addBubble(role,text,pack,meta){
  var w=document.createElement("div");w.className="msg "+(role==="user"?"u":"a");
  var b=document.createElement("div");b.className="b";b.textContent=text;w.appendChild(b);
  if(pack&&role==="assistant"){
    var cl=confLabel(pack.conf);
    var pr=document.createElement("div");pr.className="proof";
    var srcLine=(pack.sources&&pack.sources.length)?pack.sources.map(function(s){return s.src}).filter(function(v,i,a){return a.indexOf(v)===i}).join(", "):"—";
    pr.innerHTML="<span class='badge "+cl.cls+"'>"+cl.t+"</span><b>источники:</b> "+esc(srcLine)+
      (pack.sig?" · <b>sig</b> "+esc(pack.sig.slice(0,16))+"…":"")+
      " · <b>mode</b> "+esc(pack.mode||"—");
    w.appendChild(pr);
  }
  if(meta){var m=document.createElement("div");m.className="meta";m.textContent=meta;w.appendChild(m)}
  $("thread").appendChild(w);$("thread").scrollTop=1e9;
  if(history.length>0)$("hero").style.display="none";
}

function buildMessages(userText,pack){
  var sys="Ты АКСИ. Жёсткое правило: не выдумывай факты. Если нет источника — скажи «не знаю». DID: "+DID+". Отвечай по-русски.";
  if(facts.length)sys+="\nUSER_FACTS:\n"+facts.slice(-12).map(function(f){return "- "+f.text}).join("\n");
  if(pack.sources&&pack.sources.length)sys+="\nALLOWED_SOURCES:\n"+pack.sources.slice(0,5).map(function(s){return "- ["+s.src+"] "+s.text}).join("\n");
  sys+="\nЕсли вопрос вне ALLOWED_SOURCES и USER_FACTS — ответь только: Не знаю.";
  var msgs=[{role:"system",content:sys}];
  history.slice(-8).forEach(function(m){msgs.push({role:m.role==="user"?"user":"assistant",content:m.content})});
  msgs.push({role:"user",content:userText});
  return msgs;
}

function loadLLM(){
  if(engine||loadingLLM)return;
  loadingLLM=true;$("btnLLM").disabled=true;prog("Загрузка нейросети…");
  var s=document.createElement("script");s.type="module";
  s.textContent="import { CreateMLCEngine } from 'https://esm.run/@mlc-ai/web-llm';\nwindow.__aksiEng=async function(cb){return CreateMLCEngine('TinyLlama-1.1B-Chat-v1.0-q4f16_1-MLC',{initProgressCallback:cb})};\nwindow.dispatchEvent(new Event('aksi-ready'));";
  function fail(m){engine=null;loadingLLM=false;$("btnLLM").disabled=false;prog("");status("локально");addBubble("assistant","Нейросеть недоступна: "+m+"\nПроверяемые ответы без модели работают.",null,"err")}
  window.addEventListener("aksi-ready",function(){
    if(typeof window.__aksiEng!=="function"){fail("модуль");return}
    window.__aksiEng(function(r){prog("Модель "+Math.round((r.progress||0)*100)+"%")}).then(function(eng){
      engine=eng;$("btnLLM").className="on";$("btnLLM").textContent="✦ Нейросеть ✓";prog("");
      addBubble("assistant","Нейросеть включена. Ей разрешены только ваши факты и найденные источники — иначе «не знаю».",{conf:1,mode:"core",sources:[{src:"core",text:CORE[5].t}],sig:""},"webllm");
      loadingLLM=false;$("btnLLM").disabled=false;status("webllm · truth");
    }).catch(function(e){fail(e.message||e)});
  },{once:true});
  s.onerror=function(){fail("CDN")};document.head.appendChild(s);
}

function send(q0){
  if(busy)return;
  var inp=$("inp");
  var q=(q0||inp.value||"").trim();
  if(!q)return;
  inp.value="";busy=true;
  addBubble("user",q,null,null);
  history.push({role:"user",content:q});
  idbAdd("msgs",{role:"user",content:q,ts:Date.now()}).catch(function(){});
  var t0=Date.now();
  var pack=answerPackage(q);
  function finish(text, p, mode){
    p=p||pack;p.mode=mode||p.mode;
    sha256(SEED+"|"+text+"|"+(p.sources||[]).map(function(s){return s.src+":"+s.text}).join("|")).then(function(sig){
      p.sig=sig;
      var ms=Date.now()-t0;
      addBubble("assistant",text,p,mode+" · "+ms+"ms");
      history.push({role:"assistant",content:text});
      idbAdd("msgs",{role:"assistant",content:text,ts:Date.now()}).catch(function(){});
      tryLearn(q,text,p.mode);
      status((engine?"webllm":"локально")+" · conf "+confLabel(p.conf).t);
      busy=false;prog("");
    });
  }
  if(pack.mode==="память"||pack.mode==="unknown"||pack.mode==="verify"||pack.conf===0){
    finish(pack.text,pack,pack.mode);return;
  }
  if(engine&&pack.conf>0){
    status("думаю…");prog("нейросеть в рамках источников");
    engine.chat.completions.create({messages:buildMessages(q,pack),temperature:0.3,max_tokens:400}).then(function(r){
      var t=((r.choices&&r.choices[0]&&r.choices[0].message&&r.choices[0].message.content)||"").trim();
      if(!t||t.length<4)t=pack.text;
      if(/президент|сегодня в мире|новости/i.test(t)&&pack.mode!=="user-fact"&&!/не знаю/i.test(t)&&needsExternalWorld(q))t=pack.text;
      finish(t,pack,"webllm");
    }).catch(function(){finish(pack.text,pack,"fallback")});
  }else finish(pack.text,pack,"быстро");
}

$("send").onclick=function(){send()};
$("inp").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();send()}};
$("btnLLM").onclick=loadLLM;
$("btnMem").onclick=function(){$("drawer").classList.toggle("on");renderFacts()};
$("btnTruth").onclick=function(){send("кодекс правды")};
$("btnClear").onclick=function(){
  history=[];idbClear("msgs").catch(function(){});
  $("thread").innerHTML="";$("hero").style.display="";
  addBubble("assistant","Чат очищен. Факты и кодекс на месте.",{conf:1,mode:"core",sources:[]},"sys");
};
$("factAdd").onclick=function(){var t=$("factIn").value;if(!t.trim())return;$("factIn").value="";saveFact(t.trim()).then(function(){addBubble("assistant","Факт сохранён: «"+t.trim()+"»",{conf:1,mode:"память",sources:[{src:"user-fact",text:t.trim()}]},"память")})};
$("file").onchange=function(e){
  var files=e.target.files;if(!files)return;var left=files.length;
  Array.prototype.forEach.call(files,function(f){
    var r=new FileReader();
    r.onload=function(){
      var t=String(r.result||"");
      for(var i=0;i<t.length;i+=450){
        var c=t.slice(i,i+450);if(c.trim().length<20)continue;
        var item={text:c,source:f.name,ts:Date.now()};rag.push(item);idbAdd("rag",item).catch(function(){});
      }
      left--;if(left<=0)addBubble("assistant","Файлы как источники: "+rag.length+" фрагментов. Тип: file.",{conf:1,mode:"file",sources:[]},"rag");
    };
    r.readAsText(f);
  });
  e.target.value="";
};
document.querySelectorAll(".chips button").forEach(function(b){b.onclick=function(){send(b.getAttribute("data-q"))}});

Promise.resolve().then(function(){return idbAll("msgs")}).then(function(msgs){
  (msgs||[]).slice(-30).forEach(function(m){history.push({role:m.role==="user"?"user":"assistant",content:m.content});addBubble(m.role==="user"?"user":"assistant",m.content,m.role==="assistant"?{conf:0.5,mode:"hist",sources:[]}:null)});
  return idbAll("facts");
}).then(function(f){facts=f||[];return idbAll("learned")}).then(function(l){
  learned=l||[];return idbAll("rag");
}).then(function(r){
  rag=r||[];
  if(!history.length)addBubble("assistant","Кодекс включён.\n\n• Нет источника → «не знаю»\n• «запомни: …» — ваша запись\n• «проверь: …» — поиск по локальным данным\n• Под каждым ответом: уверенность + источники + sig",{conf:1,mode:"core",sources:[{src:"core",text:CORE[8].t}]},"sys");
  status("truth · фактов "+facts.length);
}).catch(function(){addBubble("assistant","АКСИ готова.",{conf:1,mode:"core",sources:[]},"sys");status("truth")});
})();
