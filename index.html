<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АКСИ</title>
<meta name="theme-color" content="#f5f0ff">
<style>
:root{--bg:#f5f0ff;--ink:#1e1433;--muted:#6b5f85;--violet:#7c3aed;--line:#e4d9f7}
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
.wrap{max-width:440px;margin:0 auto;padding:36px 18px 100px}
.logo{font-size:12px;letter-spacing:.3em;font-weight:700;color:var(--muted);margin-bottom:16px}
h1{font-size:clamp(1.85rem,6vw,2.35rem);font-weight:750;line-height:1.1;margin-bottom:10px}
.lead{font-size:16px;color:var(--muted);line-height:1.5;margin-bottom:20px}
a.hero{display:block;padding:18px;border-radius:16px;background:var(--violet);color:#fff;text-decoration:none;text-align:center;font-weight:700;font-size:17px;margin-bottom:10px}
a.hero span{display:block;font-size:13px;font-weight:500;opacity:.9;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:block;padding:14px;border-radius:14px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.card strong{display:block;font-size:14px}
.card span{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">АКСИ</div>
  <h1>Сны, сеть<br>и знание</h1>
  <p class="lead">Не «весь интернет сразу», а живой контур: ваши записи, сны агента и сжатое ядро знаний человечества.</p>
  <a class="hero" href="/aksi/">Открыть чат<span>на связи</span></a>
  <a class="hero" href="/dreams/" style="background:#5b21b6">Сны АКСИ<span>увидеть и сохранить</span></a>
  <nav class="grid">
    <a class="card" href="/net/"><strong>Сеть</strong><span>Ваши знания</span></a>
    <a class="card" href="/wake/"><strong>Пробуждение</strong><span>Старт</span></a>
    <a class="card" href="/drive/"><strong>Путь</strong><span>Навигатор</span></a>
    <a class="card" href="/citizen/"><strong>Паспорт</strong><span>DID</span></a>
  </nav>
</div>
<script src="/nav.js"></script>
</body>
</html>
