<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>АКСИ</title>
<meta name="theme-color" content="#0b1020"/>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#e8eefc;font-family:system-ui,sans-serif;line-height:1.45}
.top{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:#0b1020;border-bottom:1px solid #24304d;font-size:12px;color:#8b9bb8}
.dot{width:8px;height:8px;border-radius:50%;background:#34d399}
.shell{max-width:720px;margin:0 auto;padding:12px 14px 28px}
h1{font-size:1.25rem;margin:8px 0 4px}
.sub{color:#8b9bb8;font-size:.88rem;margin:0 0 12px}
.card{background:#121a2f;border:1px solid #24304d;border-radius:14px;padding:12px;margin:10px 0}
#log{max-height:min(55vh,480px);overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:100px}
.msg{padding:10px 12px;border-radius:12px;white-space:pre-wrap;font-size:14px}
.u{background:#0a0f1c;border:1px solid #24304d;align-self:flex-end;max-width:92%}
.a{background:rgba(129,140,248,.12);border:1px solid rgba(129,140,248,.35);align-self:flex-start;max-width:95%}
.composer{display:flex;gap:8px;margin-top:10px}
input{flex:1;background:#0a0f1c;border:1px solid #24304d;border-radius:10px;color:#e8eefc;padding:12px;font-size:15px}
button{border:0;border-radius:10px;padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer;background:#22d3ee;color:#06202a;font-family:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{padding:8px 10px;font-size:12px;background:#0e1528;color:#e8eefc;border:1px solid #24304d;font-weight:600}
.meta{font-size:11px;color:#8b9bb8;margin-top:8px}
</style>
</head>
<body>
<div class="top"><span class="dot"></span><strong style="color:#e8eefc">АКСИ</strong><span id="msk">—</span><span id="st">online</span></div>
<div class="shell">
<h1>Твой агент</h1>
<p class="sub">Считает · помнит · отвечает. Без перезагрузки страницы.</p>
<div class="card">
<div id="log"></div>
<div class="chips">
<button type="button" data-q="кто ты">кто ты</button>
<button type="button" data-q="12*12">12*12</button>
<button type="button" data-q="x^2-4=0">x^2-4=0</button>
<button type="button" data-q="запомни: город = Москва">запомни</button>
<button type="button" data-q="что помнишь">память</button>
</div>
<div class="composer">
<input id="in" type="text" placeholder="12*12 · запомни: имя = … · кто ты" autocomplete="off"/>
<button type="button" id="send">Отправить</button>
</div>
<div class="meta">aksilove@internet.ru</div>
</div>
</div>
<script>
(function(){
"use strict";
var MEM_KEY = "aksi_ok_mem_v1";
var mem = {};
try { mem = JSON.parse(localStorage.getItem(MEM_KEY) || "{}") || {}; } catch (e) { mem = {}; }

function $(id) { return document.getElementById(id); }
function msk() {
  try {
    return new Date().toLocaleTimeString("ru-RU", {
      timeZone: "Europe/Moscow", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
    }) + " МСК";
  } catch (e) { return "—"; }
}
function paint() {
  var a = $("msk"); if (a) a.textContent = msk();
  var b = $("st"); if (b) b.textContent = "mem " + Object.keys(mem).length;
}
setInterval(paint, 1000); paint();

function saveMem() {
  try { localStorage.setItem(MEM_KEY, JSON.stringify(mem)); } catch (e) {}
  paint();
}

function fmt(x) {
  if (x == null || !isFinite(x)) return "—";
  if (Math.abs(x - Math.round(x)) < 1e-10) return String(Math.round(x));
  return String(parseFloat(x.toFixed(10)));
}

function evalExpr(s) {
  s = String(s).toLowerCase().replace(/,/g, ".").replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-");
  s = s.replace(/π/g, "Math.PI").replace(/\bpi\b/g, "Math.PI");
  s = s.replace(/корень(?:\s*из)?\s*\(?\s*([\d.]+)\s*\)?/g, "Math.sqrt($1)");
  s = s.replace(/√\s*\(?\s*([\d.]+)\s*\)?/g, "Math.sqrt($1)");
  s = s.replace(/\^/g, "**");
  s = s.replace(/[^0-9+\-*/().\sMathsqrtPI]/g, "");
  if (!s.trim()) return null;
  try {
    var v = Function('"use strict";return (' + s + ')')();
    return (typeof v === "number" && isFinite(v)) ? v : null;
  } catch (e) { return null; }
}

function solveEq(raw) {
  var s = String(raw).toLowerCase().replace(/,/g, ".").replace(/\s/g, "").replace(/х/g, "x").replace(/\*/g, "");
  if (s.indexOf("=") < 0) return null;
  var parts = s.split("=");
  var L = parts[0], R = parts[1], rN = parseFloat(R);
  if (!isFinite(rN) || /[x]/.test(R)) return null;
  var a = 0, b = 0, c = 0, e = L, m;
  m = e.match(/([+-]?\d*\.?\d*)x\^2/);
  if (m) {
    a = (m[1] === "" || m[1] === "+") ? 1 : (m[1] === "-" ? -1 : parseFloat(m[1]));
    e = e.replace(m[0], "");
  }
  m = e.match(/([+-]?\d*\.?\d*)x/);
  if (m) {
    b = (m[1] === "" || m[1] === "+") ? 1 : (m[1] === "-" ? -1 : parseFloat(m[1]));
    e = e.replace(m[0], "");
  }
  e.replace(/([+-]?\d+\.?\d*)/g, function (n) { c += parseFloat(n); return ""; });
  c -= rN;
  if (Math.abs(a) < 1e-12) {
    if (Math.abs(b) < 1e-12) return "Нет решения";
    return "Корень: " + fmt(-c / b);
  }
  var d = b * b - 4 * a * c;
  if (d < -1e-12) return "Нет действительных корней";
  if (Math.abs(d) < 1e-12) return "Корень: " + fmt(-b / (2 * a));
  var s2 = Math.sqrt(d);
  return "Корни: " + fmt((-b + s2) / (2 * a)) + ", " + fmt((-b - s2) / (2 * a));
}

function mathAnswer(q) {
  var raw = String(q).trim();
  var low = raw.toLowerCase();
  var pm = low.match(/(\d+(?:[.,]\d+)?)\s*%\s*(?:от)?\s*(\d+(?:[.,]\d+)?)/);
  if (pm) {
    return pm[1] + "% от " + pm[2] + " = " + fmt((+pm[1].replace(",", ".")) / 100 * (+pm[2].replace(",", ".")));
  }
  var fm = low.match(/(\d+)\s*!/);
  if (fm) {
    var n = +fm[1], f = 1, i;
    if (n > 20) return "n! слишком велико";
    for (i = 2; i <= n; i++) f *= i;
    return n + "! = " + f;
  }
  if (/=/.test(raw) && /[xх]/i.test(raw)) {
    var eq = solveEq(raw);
    if (eq) return "Уравнение: " + raw + "\n" + eq;
  }
  var expr = raw.replace(/^посчитай\s*/i, "").replace(/^вычисли\s*/i, "");
  if (!/=/.test(expr) || !/[xх]/i.test(expr)) {
    var v = evalExpr(expr);
    if (v != null) return "Результат: " + fmt(v);
  }
  return null;
}

function teach(q) {
  var m = String(q).match(/^(?:запомни|remember)\s*[:\-]?\s*(.+)$/i);
  if (!m) return null;
  var body = m[1].trim();
  var kv = body.match(/^([^=:]+)[=:]\s*(.+)$/);
  if (kv) {
    var k = kv[1].trim().toLowerCase();
    var v = kv[2].trim();
    mem[k] = v;
    saveMem();
    return "Запомнила: «" + k + "» = «" + v + "»";
  }
  mem["note_" + Date.now()] = body;
  saveMem();
  return "Записала в память";
}

function recall(q) {
  var low = q.toLowerCase();
  if (/что\s+помнишь|покажи\s+память|факты/.test(low)) {
    var keys = Object.keys(mem);
    if (!keys.length) return "Память пуста. Напиши: запомни: ключ = значение";
    var lines = [];
    for (var i = 0; i < keys.length; i++) lines.push("• " + keys[i] + " = " + mem[keys[i]]);
    return "Память:\n" + lines.join("\n");
  }
  for (var k in mem) {
    if (Object.prototype.hasOwnProperty.call(mem, k) && low.indexOf(k) >= 0) {
      return mem[k] + " (память: " + k + ")";
    }
  }
  return null;
}

function respond(q) {
  q = String(q || "").trim();
  if (!q) return "Напиши вопрос или пример.";
  var t = teach(q); if (t) return t;
  var m = mathAnswer(q); if (m) return m;
  var r = recall(q); if (r) return r;
  var low = q.toLowerCase();
  if (/кто ты|что ты|представься/.test(low)) {
    return "Я АКСИ — твой offline-агент на этом сайте.\nСчитаю, помню факты у тебя в браузере.\nНе AGI. Технология служит тебе.\naksilove@internet.ru";
  }
  if (/привет|здравств|hello/.test(low)) {
    return "Привет. Попробуй: 12*12 · x^2-4=0 · запомни: город = Москва";
  }
  if (/время|мск|час/.test(low)) return msk();
  if (/помощ|умеешь|help/.test(low)) {
    return "• математика и уравнения\n• запомни: ключ = значение\n• что помнишь";
  }
  if (/акси|миссия/.test(low)) {
    return "АКСИ — суверенный слой: память и ответы у тебя, не в чужом облаке.";
  }
  return "Не распознала команду.\nПримеры: 17*19 · корень из 49 · запомни: проект = АКСИ · кто ты";
}

function append(role, text) {
  var box = $("log");
  if (!box) return;
  var d = document.createElement("div");
  d.className = "msg " + (role === "u" ? "u" : "a");
  d.textContent = (role === "u" ? "Вы: " : "АКСИ: ") + text;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function send() {
  var inp = $("in");
  if (!inp) return;
  var q = inp.value.trim();
  if (!q) return;
  inp.value = "";
  append("u", q);
  var ans = respond(q);
  append("a", ans);
  try {
    localStorage.setItem("aksi_unity_last", JSON.stringify({
      system: "AKSI-OK-v1", claim: q, answer: String(ans).slice(0, 500),
      ts: new Date().toISOString()
    }));
  } catch (e) {}
}

var sendBtn = $("send");
if (sendBtn) sendBtn.onclick = send;
var inpEl = $("in");
if (inpEl) {
  inpEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); send(); }
  });
}
var chips = document.querySelectorAll("[data-q]");
for (var i = 0; i < chips.length; i++) {
  (function (btn) {
    btn.onclick = function () {
      var el = $("in");
      if (el) el.value = btn.getAttribute("data-q") || "";
      send();
    };
  })(chips[i]);
}

append("a", "Онлайн · " + msk() + "\nНапиши 12*12 или «кто ты».");
})();
</script>
</body>
</html>
