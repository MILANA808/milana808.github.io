<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>АКСИ</title>
<meta name="theme-color" content="#0a0a0b"/>
<style>
:root{--bg:#0a0a0b;--card:#121214;--line:rgba(255,255,255,.1);--t:#f4f4f5;--m:#a1a1aa;--a:#a78bfa;--g:#5eead4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:28px 16px 48px}
h1{margin:0;font-size:1.55rem}
.lead{color:var(--m);font-size:15px;margin:10px 0 0}
.btn{display:inline-block;margin:6px 6px 0 0;padding:12px 16px;border-radius:12px;background:linear-gradient(135deg,#a78bfa,#7eb6ff);color:#0a0a0b;font-weight:700;text-decoration:none;font-size:14px}
.btn2{display:inline-block;margin:6px 6px 0 0;padding:10px 14px;border-radius:12px;border:1px solid var(--line);color:var(--m);text-decoration:none;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
.card h2{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--g)}
.card p{margin:0 0 10px;color:var(--m);font-size:14px}
footer{margin-top:28px;font-size:12px;color:var(--m)}
</style>
</head>
<body>
<div class="wrap">
  <h1>АКСИ</h1>
  <p class="lead">Quantum AI: симулятор → ответ. Без внешних скриптов для базовых ответов.</p>
  <div class="card">
    <h2>Quantum AI</h2>
    <p>Наверху страницы должно быть зелёное «РАБОТАЕТ». Если красное — напиши.</p>
    <p><a class="btn" href="/qai/?v=32">Открыть Quantum AI →</a></p>
  </div>
  <div class="card">
    <h2>Ещё</h2>
    <p>
      <a class="btn2" href="/llm/">WebLLM</a>
      <a class="btn2" href="/runtime/">Runtime</a>
      <a class="btn2" href="/permit/">Permit</a>
    </p>
  </div>
  <footer>aksilove@internet.ru</footer>
</div>
</body>
</html>
