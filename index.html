<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>АКСИ</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0f172a;color:#f1f5f9;font-family:system-ui,-apple-system,sans-serif}
body{display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header{padding:max(10px,env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:1rem;font-weight:800}
#status{font-size:11px;color:#94a3b8;text-align:right;max-width:55%}
.bar{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid #334155;-webkit-overflow-scrolling:touch}
.bar button,.bar label{border:1px solid #334155;background:#1e293b;color:#f1f5f9;border-radius:10px;padding:10px 12px;font-size:12px;font-weight:700;white-space:nowrap;min-height:40px}
.bar button.on{background:#7c3aed;border-color:#7c3aed}
#thread{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.msg{margin:0 0 10px;max-width:92%}
.msg.u{margin-left:auto}
.b{padding:12px 14px;border-radius:14px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.msg.u .b{background:#7c3aed;color:#fff}
.msg.a .b{background:#1e293b;border:1px solid #334155}
.meta{font-size:10px;color:#94a3b8;margin-top:3px}
.composer{display:flex;gap:8px;padding:8px 10px max(12px,env(safe-area-inset-bottom));border-top:1px solid #334155;background:#111827}
#inp{flex:1;min-height:44px;border-radius:12px;border:1px solid #334155;background:#1e293b;color:#f1f5f9;padding:10px;font-size:16px}
#send{width:48px;border:0;border-radius:12px;background:#7c3aed;color:#fff;font-weight:800;font-size:18px}
#file{display:none}
#prog{display:none;padding:8px 12px;font-size:12px;color:#94a3b8;border-bottom:1px solid #334155;background:#0b1220}
#prog.on{display:block}
</style>
</head>
<body>
<header>
  <h1>АКСИ</h1>
  <div id="status">запуск…</div>
</header>
<div class="bar">
  <button type="button" id="btnLLM">Нейросеть</button>
  <button type="button" id="btnArch">Схема</button>
  <label for="file">Файл</label>
  <input type="file" id="file" accept=".txt,.md,text/plain" multiple>
  <button type="button" id="btnClear">Очистить</button>
</div>
<div id="prog"></div>
<div id="thread"></div>
<div class="composer">
  <input id="inp" type="text" placeholder="Спросите АКСИ…" enterkeyhint="send" autocomplete="off">
  <button type="button" id="send">➤</button>
</div>
<script>
(function () {
  "use strict";
  var DID = "did:aksi:ed25519:sovereign-2026";
  var DB = "aksi_ok_v2";
  var history = [];
  var rag = [];
  var busy = false;
  var engine = null;
  var loadingLLM = false;

  var ONTOLOGY = [
    { t: "АКСИ — суверенный local-first ИИ: ответы и данные на вашем устройстве.", k: "акси aksi контур проект суверен что такое" },
    { t: "DID: did:aksi:ed25519:sovereign-2026. Контакт: aksilove@internet.ru. Лицензия Apache-2.0.", k: "did идентич контакт email лиценз" },
    { t: "Чат на сайте: память диалога, RAG по файлам, опционально WebLLM в браузере.", k: "matrix чат webllm память" },
    { t: "Омега — серверный контур: FastAPI + Ollama + RAG для своего сервера.", k: "омега omega fastapi ollama сервер" },
    { t: "Сеть /app — агенты и лента. Модули: lab, quantum, studio, exocortex.", k: "сеть агент лента lab quantum" },
    { t: "RAG: загрузите .txt или .md через кнопку «Файл» — ответы по содержимому.", k: "rag файл документ загруз" },
    { t: "Память: история хранится в IndexedDB браузера и восстанавливается после перезагрузки.", k: "память контекст история indexeddb" },
    { t: "Нейросеть: кнопка загружает TinyLlama через WebLLM (нужен современный браузер и память).", k: "нейросеть модель llm tinyllama" }
  ];

  function $(id) { return document.getElementById(id); }
  function status(t) { $("status").textContent = t; }
  function prog(t) {
    var p = $("prog");
    if (!t) { p.className = ""; p.textContent = ""; return; }
    p.textContent = t;
    p.className = "on";
  }

  function addBubble(role, text, meta) {
    var wrap = document.createElement("div");
    wrap.className = "msg " + (role === "user" ? "u" : "a");
    var b = document.createElement("div");
    b.className = "b";
    b.textContent = text;
    wrap.appendChild(b);
    if (meta) {
      var m = document.createElement("div");
      m.className = "meta";
      m.textContent = meta;
      wrap.appendChild(m);
    }
    $("thread").appendChild(wrap);
    $("thread").scrollTop = 1e9;
  }

  function openDB() {
    return new Promise(function (res, rej) {
      try {
        var r = indexedDB.open(DB, 1);
        r.onupgradeneeded = function () {
          var d = r.result;
          if (!d.objectStoreNames.contains("msgs")) d.createObjectStore("msgs", { keyPath: "id", autoIncrement: true });
          if (!d.objectStoreNames.contains("rag")) d.createObjectStore("rag", { keyPath: "id", autoIncrement: true });
        };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      } catch (e) { rej(e); }
    });
  }

  function idbAdd(store, val) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(store, "readwrite");
        tx.objectStore(store).add(val);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }

  function idbAll(store) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(store, "readonly");
        var q = tx.objectStore(store).getAll();
        q.onsuccess = function () { res(q.result || []); };
        q.onerror = function () { rej(q.error); };
      });
    });
  }

  function idbClear(store) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(store, "readwrite");
        tx.objectStore(store).clear();
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }

  function score(q, text, keys) {
    var low = q.toLowerCase();
    var n = 0;
    var parts = low.split(/\s+/);
    var tlow = (text || "").toLowerCase();
    for (var i = 0; i < parts.length; i++) {
      if (parts[i] && tlow.indexOf(parts[i]) >= 0) n++;
    }
    var ks = (keys || "").split(/\s+/);
    for (var j = 0; j < ks.length; j++) {
      if (ks[j] && low.indexOf(ks[j]) >= 0) n += 2;
    }
    return n;
  }

  function retrieve(q) {
    var hits = [];
    for (var i = 0; i < ONTOLOGY.length; i++) {
      var s = score(q, ONTOLOGY[i].t, ONTOLOGY[i].k);
      if (s > 0) hits.push({ text: ONTOLOGY[i].t, score: s });
    }
    for (var r = 0; r < rag.length; r++) {
      var s2 = score(q, rag[r].text || "", "");
      if (s2 > 0) hits.push({ text: rag[r].text, score: s2 });
    }
    hits.sort(function (a, b) { return b.score - a.score; });
    return hits.slice(0, 6);
  }

  function contextHint() {
    if (history.length < 2) return "";
    var lastUser = "";
    for (var i = history.length - 1; i >= 0; i--) {
      if (history[i].role === "user") { lastUser = history[i].content; break; }
    }
    return lastUser ? "\n\n(Учитываю прошлый вопрос: «" + lastUser.slice(0, 80) + "»)" : "";
  }

  function instantReply(q, hits) {
    var low = q.toLowerCase();
    if (/привет|здравств|добрый|hello|hi\b/.test(low)) {
      return "Здравствуйте. АКСИ на связи.\n\nПамять диалога включена. «Нейросеть» — WebLLM. «Файл» — RAG.\nСпросите «кто ты» или «покажи схему».";
    }
    if (/кто ты|что ты|представь|версия/.test(low)) {
      return "Я АКСИ — локальный ассистент на этой странице.\n\nDID: " + DID + "\n\nРаботает сейчас:\n• память контекста (IndexedDB)\n• ответы по знаниям проекта\n• RAG по вашим файлам\n• WebLLM по кнопке «Нейросеть»";
    }
    if (/схем|архитектур|покажи схему|как устроен/.test(low)) {
      return "Схема АКСИ:\n\n1. Вы пишете вопрос\n2. Поиск по знаниям + файлам + истории\n3. Ответ (мгновенный или WebLLM)\n4. Сохранение в память\n\nВсё в браузере. DID: " + DID;
    }
    if (/помощ|умеешь|команд|что можешь/.test(low)) {
      return "• обычный вопрос — ответ с учётом истории\n• «Нейросеть» — загрузка LLM в браузере\n• «Файл» — подключить .txt/.md\n• «Очистить» — сброс памяти\n\naksilove@internet.ru";
    }
    if (/памят|контекст|помни/.test(low)) {
      return "Да, я храню историю диалога в IndexedDB. Сейчас сообщений: " + history.length + ".\nПосле перезагрузки страница восстановит последние реплики.";
    }
    if (/uuid|guid/.test(low)) {
      return "UUID: " + "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
        var r = Math.random() * 16 | 0;
        return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }
    if (/который час|сколько времени|дата сейчас/.test(low)) {
      return "Сейчас: " + new Date().toLocaleString("ru-RU");
    }
    var m = low.match(/(?:посчитай|вычисли)\s+([0-9+\-*/().\s]+)/);
    if (m) {
      try {
        var v = Function('"use strict";return(' + m[1].replace(/[^0-9+\-*/().\s]/g, "") + ")")();
        if (typeof v === "number" && isFinite(v)) return "Результат: " + v;
      } catch (e) {}
    }
    if (hits.length && hits[0].score >= 2) {
      var lines = hits.slice(0, 4).map(function (h, i) { return (i + 1) + ". " + h.text; }).join("\n");
      return "По знаниям и файлам:\n\n" + lines + contextHint();
    }
    if (history.length >= 2) {
      return "Уточните вопрос. В диалоге уже " + history.length + " сообщений. Можно включить «Нейросеть» для более свободного ответа.\n" + DID;
    }
    return "Пока мало данных по запросу.\nПопробуйте: кто ты · схема · память · или загрузите файл.\n" + DID;
  }

  function buildMessages(userText, hits) {
    var sys = "Ты — АКСИ, суверенный локальный ассистент. Отвечай на языке пользователя, по делу. DID: " + DID + ". Контакт: aksilove@internet.ru.";
    if (hits.length) {
      sys += "\n\nФакты:\n" + hits.map(function (h) { return "- " + h.text; }).join("\n");
    }
    var msgs = [{ role: "system", content: sys }];
    var start = Math.max(0, history.length - 12);
    for (var i = start; i < history.length; i++) {
      msgs.push({
        role: history[i].role === "user" ? "user" : "assistant",
        content: history[i].content
      });
    }
    msgs.push({ role: "user", content: userText });
    return msgs;
  }

  function loadLLM() {
    if (engine || loadingLLM) return;
    loadingLLM = true;
    $("btnLLM").disabled = true;
    prog("Загрузка WebLLM…");
    status("модель…");

    var s = document.createElement("script");
    s.type = "module";
    s.textContent = [
      "import { CreateMLCEngine } from 'https://esm.run/@mlc-ai/web-llm';",
      "window.__aksiLoadEngine = async function(onProgress){",
      "  return CreateMLCEngine('TinyLlama-1.1B-Chat-v1.0-q4f16_1-MLC', { initProgressCallback: onProgress });",
      "};",
      "window.dispatchEvent(new Event('aksi-llm-ready'));"
    ].join("\n");

    function onReady() {
      if (typeof window.__aksiLoadEngine !== "function") {
        fail("модуль WebLLM не инициализировался");
        return;
      }
      window.__aksiLoadEngine(function (r) {
        var p = Math.round((r.progress || 0) * 100);
        prog("Модель " + p + "%");
        status("модель " + p + "%");
      }).then(function (eng) {
        engine = eng;
        $("btnLLM").className = "on";
        $("btnLLM").textContent = "Нейросеть ✓";
        prog("");
        status("webllm · " + history.length + " сообщ.");
        addBubble("assistant", "Нейросеть готова. Дальше ответы с учётом истории диалога.", "webllm");
        loadingLLM = false;
        $("btnLLM").disabled = false;
      }).catch(function (e) {
        fail(e && e.message ? e.message : String(e));
      });
    }

    function fail(msg) {
      engine = null;
      loadingLLM = false;
      $("btnLLM").disabled = false;
      prog("");
      status("локально");
      addBubble("assistant", "WebLLM не загрузилась: " + msg + "\n\nЧат, память и RAG продолжают работать.", "err");
    }

    window.addEventListener("aksi-llm-ready", onReady, { once: true });
    s.onerror = function () { fail("не удалось скачать web-llm (сеть/CDN)"); };
    document.head.appendChild(s);
  }

  function chatWithLLM(userText, hits) {
    return engine.chat.completions.create({
      messages: buildMessages(userText, hits),
      temperature: 0.7,
      max_tokens: 512
    }).then(function (reply) {
      var t = (reply.choices && reply.choices[0] && reply.choices[0].message && reply.choices[0].message.content) || "";
      return String(t).trim();
    });
  }

  function send() {
    if (busy) return;
    var inp = $("inp");
    var q = (inp.value || "").trim();
    if (!q) return;
    inp.value = "";
    busy = true;
    addBubble("user", q);
    history.push({ role: "user", content: q });
    idbAdd("msgs", { role: "user", content: q, ts: Date.now() }).catch(function () {});

    var t0 = Date.now();
    var hits = retrieve(q);

    function finish(text, mode) {
      var ms = Date.now() - t0;
      prog("");
      addBubble("assistant", text, mode + " · " + ms + "ms · hist " + history.length);
      history.push({ role: "assistant", content: text });
      idbAdd("msgs", { role: "assistant", content: text, ts: Date.now() }).catch(function () {});
      status((engine ? "webllm" : "локально") + " · " + history.length + " сообщ.");
      busy = false;
    }

    if (engine) {
      status("думаю…");
      prog("WebLLM + контекст (" + history.length + ")");
      chatWithLLM(q, hits).then(function (text) {
        if (!text || text.length < 4) text = instantReply(q, hits);
        finish(text, "webllm");
      }).catch(function (e) {
        finish(instantReply(q, hits) + "\n\n(модель: " + (e.message || e) + ")", "fallback");
      });
    } else {
      finish(instantReply(q, hits), "instant");
    }
  }

  $("send").onclick = send;
  $("inp").onkeydown = function (e) {
    if (e.key === "Enter") { e.preventDefault(); send(); }
  };
  $("btnLLM").onclick = loadLLM;
  $("btnArch").onclick = function () { $("inp").value = "покажи схему"; send(); };
  $("btnClear").onclick = function () {
    history = [];
    idbClear("msgs").catch(function () {});
    $("thread").innerHTML = "";
    addBubble("assistant", "Память очищена.", "sys");
    status(engine ? "webllm · 0" : "локально · 0");
  };
  $("file").onchange = function (e) {
    var files = e.target.files;
    if (!files || !files.length) return;
    var left = files.length;
    Array.prototype.forEach.call(files, function (f) {
      var reader = new FileReader();
      reader.onload = function () {
        var text = String(reader.result || "");
        for (var i = 0; i < text.length; i += 450) {
          var chunk = text.slice(i, i + 450);
          if (chunk.trim().length < 20) continue;
          var item = { source: f.name, text: chunk, ts: Date.now() };
          rag.push(item);
          idbAdd("rag", item).catch(function () {});
        }
        left--;
        if (left <= 0) {
          addBubble("assistant", "В RAG: " + rag.length + " фрагментов. Можно спрашивать по файлам.", "rag");
          status((engine ? "webllm" : "локально") + " · RAG " + rag.length);
        }
      };
      reader.readAsText(f);
    });
    e.target.value = "";
  };

  Promise.resolve()
    .then(function () { return idbAll("msgs"); })
    .then(function (msgs) {
      (msgs || []).slice(-40).forEach(function (m) {
        history.push({ role: m.role === "user" ? "user" : "assistant", content: m.content });
        addBubble(m.role === "user" ? "user" : "assistant", m.content);
      });
      return idbAll("rag");
    })
    .then(function (rows) {
      rag = rows || [];
      if (!history.length) {
        addBubble("assistant",
          "АКСИ готов.\n\n• Пишите — ответ с учётом истории\n• «Нейросеть» — WebLLM в браузере\n• «Файл» — знания из документов\n\nПамять сохраняется между перезагрузками.",
          "sys");
      }
      status("локально · " + history.length + " сообщ. · RAG " + rag.length);
    })
    .catch(function () {
      addBubble("assistant", "АКСИ готов. Пишите вопрос.", "sys");
      status("локально");
    });
})();
</script>
</body>
</html>
