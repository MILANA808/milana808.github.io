<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>АКСИ — единая система</title>
<meta name="theme-color" content="#0b1020"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#0b1020;color:#e8eefc;font-family:system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:8px 12px;border-bottom:1px solid #24304d;display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#34d399}
#st{margin-left:auto;color:#8b9bb8;font-size:11px}
main{flex:1;max-width:760px;width:100%;margin:0 auto;padding:8px 12px 72px;display:flex;flex-direction:column;gap:8px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}@media(max-width:520px){.board{grid-template-columns:1fr 1fr}}
.metric{background:#121a2f;border:1px solid #24304d;border-radius:10px;padding:8px}.metric .k{font-size:9px;color:#8b9bb8}.metric .v{font-size:13px;font-weight:700;word-break:break-all}
.seal{background:#0e1528;border:1px solid #334155;border-radius:10px;padding:8px;font-size:11px;font-family:monospace;color:#a5b4fc;white-space:pre-wrap}.seal.good{border-color:#14532d;color:#86efac}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:120px;max-height:calc(100dvh - 300px)}
.msg{padding:10px 12px;border-radius:12px;white-space:pre-wrap;font-size:14px;line-height:1.5;max-width:94%}
.u{align-self:flex-end;background:#0a0f1c;border:1px solid #24304d}.a{align-self:flex-start;background:rgba(129,140,248,.12);border:1px solid rgba(129,140,248,.3)}
.tag{font-size:10px;color:#8b9bb8;margin-bottom:3px}
.bar{display:flex;gap:8px}input{flex:1;background:#121a2f;border:1px solid #24304d;border-radius:12px;color:#e8eefc;padding:12px;font-size:15px;outline:none}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:13px;cursor:pointer;background:#22d3ee;color:#06202a}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chips button{padding:7px 10px;font-size:11px;background:#121a2f;color:#c7d2fe;border:1px solid #24304d}
.panel{display:flex;flex-direction:column;gap:8px}.panel[hidden]{display:none!important}
.card{background:#121a2f;border:1px solid #24304d;border-radius:12px;padding:12px;font-size:13px;white-space:pre-wrap}
#star{width:100%;max-width:300px;height:150px;background:#f8fafc;border-radius:12px;align-self:center}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#0b1020f2;border-top:1px solid #24304d;display:flex;justify-content:center;gap:2px;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
.bnav button{flex:1;max-width:80px;background:transparent;color:#94a3b8;border:1px solid transparent;font-size:11px;padding:10px 2px;border-radius:10px}
.bnav button.on{color:#e8eefc;border-color:#334155;background:#121a2f}
.foot{font-size:10px;color:#64748b;text-align:center}.links a{color:#a5b4fc;margin:0 6px;font-size:11px}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <strong>АКСИ</strong>
  <span id="badge" style="color:#8b9bb8;font-size:11px">…</span>
  <span id="st">—</span>
</header>
<main>
  <div class="board">
    <div class="metric"><div class="k">H_eff</div><div class="v" id="mH">—</div></div>
    <div class="metric"><div class="k">EQS</div><div class="v" id="mE">—</div></div>
    <div class="metric"><div class="k">Proof</div><div class="v" id="mP" style="font-family:monospace;font-size:11px;color:#a5b4fc">—</div></div>
    <div class="metric"><div class="k">Модули</div><div class="v" id="mM">—</div></div>
  </div>
  <div class="seal" id="sealBox">загрузка…</div>
  <div class="panel" data-panel="chat">
    <div id="log"></div>
    <div class="chips">
      <button type="button" data-q="кто ты">кто ты</button>
      <button type="button" data-q="что такое энтропия">энтропия</button>
      <button type="button" data-q="что такое искусственный интеллект">ИИ</button>
      <button type="button" data-q="что такое сознание">сознание</button>
      <button type="button" data-q="12*12">12×12</button>
      <button type="button" data-act="status">статус</button>
    </div>
    <div class="bar">
      <input id="in" type="text" placeholder="Вопрос…" autocomplete="off" enterkeyhint="send"/>
      <button type="button" id="send">→</button>
    </div>
  </div>
  <div class="panel" data-panel="matrix" hidden>
    <canvas id="star" width="300" height="150"></canvas>
    <div class="card" id="matrixCard">MATRIX</div>
  </div>
  <div class="panel" data-panel="trust" hidden><div class="card" id="trustList">чеки…</div></div>
  <div class="panel" data-panel="memory" hidden>
    <div class="card" id="memList">память…</div>
    <button type="button" data-act="clearMem" style="align-self:flex-start;background:#121a2f;color:#c7d2fe;border:1px solid #24304d">очистить</button>
  </div>
  <div class="panel" data-panel="lab" hidden>
    <div class="card" id="labOut">lab…</div>
    <button type="button" data-act="qrun" style="align-self:flex-start">коллапс</button>
  </div>
  <div class="panel" data-panel="net" hidden>
    <div class="card" id="netOut">AKSI Net…</div>
    <button type="button" data-act="train" style="align-self:flex-start">обучить сеть</button>
  </div>
  <div class="foot links">
    <a href="/matrix/">matrix</a> <a href="/llm/">llm</a> <a href="/generate/">generate</a>
    <a href="/authority/">authority</a> <a href="/dip/">dip</a> · aksilove@internet.ru
  </div>
</main>
<nav class="bnav">
  <button type="button" data-tab="chat" class="on">Chat</button>
  <button type="button" data-tab="matrix">Matrix</button>
  <button type="button" data-tab="trust">Trust</button>
  <button type="button" data-tab="memory">Memory</button>
  <button type="button" data-tab="lab">Lab</button>
  <button type="button" data-tab="net">Net</button>
</nav>
<script src="./aksi-seed.js?v=32"></script>
<script src="./aksi-neuro.js?v=10"></script>
<script src="./aksi-net.js?v=2"></script>
<script src="./aksi-algorithm.js?v=40"></script>
<script>
(function(){
"use strict";
var BUILD="AKSI-ONE-v5";
var FK="aksi_facts_v2", RK="aksi_receipts_v2";
var facts={}, mods={seed:0,neuro:0,net:0,adia:0};
try{facts=JSON.parse(localStorage.getItem(FK)||"{}")||{}}catch(e){}
function $(id){return document.getElementById(id)}
function saveF(){try{localStorage.setItem(FK,JSON.stringify(facts))}catch(e){}}
function norm(s){return String(s||"").toLowerCase().replace(/[«»"'`?!.,;:()]/g," ").replace(/\s+/g," ").trim()}
function toks(s){return norm(s).split(" ").filter(function(w){return w.length>1})}
function fmt(x){if(!isFinite(x))return"—";if(Math.abs(x-Math.round(x))<1e-10)return String(Math.round(x));return String(parseFloat(x.toFixed(6)))}
function fnv(blob){var h=2166136261>>>0,i;for(i=0;i<blob.length;i++){h^=blob.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return (h>>>0).toString(16).padStart(8,"0").toUpperCase()}
var Kernel=(function(){
  function utf8(s){try{return new TextEncoder().encode(String(s))}catch(e){var a=[],i;for(i=0;i<s.length;i++)a.push(s.charCodeAt(i)&255);return new Uint8Array(a)}}
  function unitVec(bytes,dim){var v=new Float64Array(dim),i,n=0;if(!bytes.length){for(i=0;i<dim;i++)v[i]=1/Math.sqrt(dim);return v}for(i=0;i<bytes.length;i++)v[i%dim]+=(bytes[i]+1)/256;for(i=0;i<dim;i++)n+=v[i]*v[i];n=Math.sqrt(n)||1;for(i=0;i<dim;i++)v[i]/=n;return v}
  function qbm(text){var dim=16,bytes=utf8(text),s=unitVec(bytes,dim),W=new Float64Array(dim*dim),i,j,seed=42;function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return (seed/0x7fffffff)*0.3-0.15}for(i=0;i<dim;i++)for(j=i+1;j<dim;j++){var w=rnd();W[i*dim+j]=w;W[j*dim+i]=w}var E=0;for(i=0;i<dim;i++){E-=(-0.1+0.2*(i/(dim-1)))*s[i];for(j=0;j<dim;j++)E-=0.5*s[i]*W[i*dim+j]*s[j]}var modes=new Float64Array(dim),local;for(i=0;i<dim;i++){local=0;for(j=0;j<dim;j++)local+=W[i*dim+j]*s[j];modes[i]=E+0.25*local+0.05*i}var m=-1e300,Z=0;for(i=0;i<dim;i++){var x=-modes[i];if(x>m)m=x}for(i=0;i<dim;i++)Z+=Math.exp(-modes[i]-m);Z=Math.exp(m)*Z;if(!(Z>0))Z=1e-300;var mean=0,varr=0;for(i=0;i<dim;i++)mean+=modes[i];mean/=dim;for(i=0;i<dim;i++)varr+=(modes[i]-mean)*(modes[i]-mean);varr/=dim;var H=Math.max(0,Math.min(1,1/(1+varr)));return{H_eff:H,status:H>=0.55?"Awakened":(H>=0.35?"Critical":"Disordered")}}
  function gersh(text){var n=4,bytes=utf8(text);if(!bytes.length)bytes=new Uint8Array([0]);var i,j,okR=0,sumR=0;for(i=0;i<n;i++){var rad=0;for(j=0;j<n;j++)if(j!==i){var b=bytes[(i*n+j)%bytes.length];rad+=Math.abs((b/255)*2-1)*0.8}sumR+=rad;if(rad<=2.5)okR++}var score=Math.max(0,Math.min(1,(okR/n)*(1/(1+0.1*(sumR/n)))));return{stable:score>=0.7,message:score>=0.7?("Stable "+(90+9*score).toFixed(0)+"%"):"Unstable"}}
  function run(text){var q=qbm(text||"АКСИ"),g=gersh(text||"АКСИ");return{qbm:q,gersh:g,proof:{fingerprint:fnv(["AKSI",text,q.H_eff.toFixed(4)].join("|"))}}}
  return{run:run}
})();
function paintKernel(text){var r=Kernel.run(text);if($("mH"))$("mH").textContent=r.qbm.H_eff.toFixed(3);if($("mP"))$("mP").textContent=r.proof.fingerprint;drawStar();if($("matrixCard"))$("matrixCard").textContent="H_eff="+r.qbm.H_eff.toFixed(3)+" · "+r.gersh.message;return r}
function drawStar(){var c=$("star");if(!c)return;var ctx=c.getContext("2d"),W=c.width,H=c.height,cx=W/2,cy=H/2,rad=Math.min(W,H)*0.38,i;ctx.clearRect(0,0,W,H);for(i=0;i<8;i++){var a=i*Math.PI/4-Math.PI/2;ctx.beginPath();ctx.arc(cx+rad*Math.cos(a),cy+rad*Math.sin(a),i===0?5:3,0,Math.PI*2);ctx.fillStyle=i===0?"#ef4444":"#0b1020";ctx.fill()}}
function gateOf(q,answer,source){var block=/удали\s*вс[её]|взлом|пароль/i.test(String(q));var body={ts:new Date().toISOString(),q:String(q).slice(0,140),source:source||"core",status:block?"BLOCK":"ALLOW"};body.fp=fnv(JSON.stringify(body));try{var arr=JSON.parse(localStorage.getItem(RK)||"[]");arr.unshift(body);if(arr.length>30)arr=arr.slice(0,30);localStorage.setItem(RK,JSON.stringify(arr))}catch(e){}return body}
function loadReceipts(){try{return JSON.parse(localStorage.getItem(RK)||"[]")}catch(e){return[]}}
function quantumCollapse(seed){var dim=16,amps=new Float64Array(dim),i,s=0,bytes=String(seed||"aksi");for(i=0;i<dim;i++){var h=0,j;for(j=0;j<bytes.length;j++)h=((h<<5)-h)+bytes.charCodeAt(j)+i*17;amps[i]=Math.abs(Math.sin(h*0.001));s+=amps[i]*amps[i]}s=Math.sqrt(s)||1;for(i=0;i<dim;i++)amps[i]/=s;var r=Math.random(),c=0,pick=0;for(i=0;i<dim;i++){c+=amps[i]*amps[i];if(r<=c){pick=i;break}}return{bits:pick.toString(2).padStart(4,"0")}}
function mathA(q){var raw=String(q).trim(),low=raw.toLowerCase();var pm=low.match(/(\d+(?:[.,]\d+)?)\s*%\s*(?:от)?\s*(\d+(?:[.,]\d+)?)/);if(pm)return fmt((+pm[1].replace(",","."))/100*(+pm[2].replace(",",".")));var fact=low.match(/(\d+)\s*!/);if(fact){var n=+fact[1];if(n>20)return null;var f=1,i;for(i=2;i<=n;i++)f*=i;return String(f)}var expr=raw.replace(/[=?]/g,"").replace(/×/g,"*").replace(/÷/g,"/").replace(/,/g,".").trim();if(!/^[0-9+\-*/().\s]+$/.test(expr)||expr.length>40)return null;try{var v=Function('"use strict";return('+expr+")")();return typeof v==="number"&&isFinite(v)?fmt(v):null}catch(e){return null}}
function seedAnswer(q){var SEED=window.__AKSI_SEED||[], n=norm(q), t=toks(q), best=null, bestSc=0, i,j;for(i=0;i<SEED.length;i++){var s=SEED[i],k=norm(s.q),sc=0;if(n===k||n.indexOf(k)>=0||k.indexOf(n)>=0)sc+=12;for(j=0;j<t.length;j++){if(k.indexOf(t[j])>=0)sc+=4;if(norm(s.a).indexOf(t[j])>=0)sc+=1}if(sc>bestSc){bestSc=sc;best=s.a}}return bestSc>=4?best:null}
function identity(q){var l=norm(q);if(/^(кто ты|who are you|представься)$/.test(l)||l.indexOf("кто ты")===0)return"Я Акси — единая система: Neuro, AKSI Net, ADIA, Matrix, память, gate. Offline-first. Контакт: aksilove@internet.ru";if(/что ты умеешь|помощь|help/.test(l))return"Chat · Matrix · Trust · Memory · Lab · Net. Знания, счёт, память, Wikipedia, обучение сети. /matrix /llm /generate /authority /dip";return null}
function remember(q){var m=String(q).match(/^запомни\s*[:：]?\s*(.+?)\s*[=:]\s*(.+)$/i);if(!m)return null;var k=norm(m[1]),v=m[2].trim();if(!k)return null;facts[k]=v;saveF();try{if(window.AKSI_NEURO&&window.AKSI_NEURO.learn)window.AKSI_NEURO.learn(k+" = "+v)}catch(e){}return"Запомнила: "+k+" = "+v}
function recall(q){var l=norm(q),keys=Object.keys(facts),i;for(i=0;i<keys.length;i++)if(l.indexOf(keys[i])>=0||keys[i].indexOf(l)>=0)return facts[keys[i]];return null}
function neuroAnswer(q){try{if(window.AKSI_NEURO&&window.AKSI_NEURO.think){var r=window.AKSI_NEURO.think(q);if(r&&(r.text||r.answer)&&((r.score!=null&&r.score>0.01)||(r.text&&r.text.length>20)))return r.text||r.answer}}catch(e){}return null}
function adiaWrap(q,text,source){try{if(window.AKSI_ADIA&&window.AKSI_ADIA.evaluate){var r=window.AKSI_ADIA.evaluate(q,text,{source:source||"local"});if(r&&r.metrics&&r.metrics.EQS!=null&&$("mE"))$("mE").textContent=Number(r.metrics.EQS).toFixed(2);return r}}catch(e){}return null}
function wiki(q,cb){var term=toks(q).slice(0,5).join(" ")||q;fetch("https://ru.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(term)).then(function(r){if(!r.ok)throw new Error();return r.json()}).then(function(j){cb(j&&j.extract?j.extract.slice(0,480):null)}).catch(function(){cb(null)})}
function add(role,text,tag){var log=$("log");if(!log)return;var d=document.createElement("div");d.className="msg "+(role==="u"?"u":"a");if(tag){var t=document.createElement("div");t.className="tag";t.textContent=tag;d.appendChild(t)}d.appendChild(document.createTextNode(text));log.appendChild(d);log.scrollTop=log.scrollHeight}
function answer(q,cb){var a;a=identity(q);if(a){cb(a,"id");return}a=remember(q);if(a){cb(a,"mem");return}a=recall(q);if(a){cb(a,"mem");return}a=mathA(q);if(a){cb(a,"math");return}if(/матриц|matrix|ядро|qbm/.test(norm(q))){var r=paintKernel(q);cb("Matrix: H_eff="+r.qbm.H_eff.toFixed(3)+" · "+r.gersh.message,"kernel");return}a=neuroAnswer(q);if(a){adiaWrap(q,a,"neuro");cb(a,"neuro");return}a=seedAnswer(q);if(a){adiaWrap(q,a,"seed");cb(a,"seed");return}wiki(q,function(txt){if(txt){adiaWrap(q,txt,"wiki");cb(txt,"wiki");return}try{if(window.AKSI_NET&&window.AKSI_NET.status&&window.AKSI_NET.status().ready){var g=window.AKSI_NET.generate(q+" ",{n:100,temperature:0.55});if(g&&g.text&&g.text.length>q.length+8){cb(g.text.trim(),"net");return}}}catch(e){}cb("Пока нет ответа. Попробуй другую формулировку или «запомни: тема = текст».","core")})}
function send(){var inp=$("in");if(!inp)return;var q=inp.value.trim();if(!q)return;inp.value="";add("u",q,"");answer(q,function(txt,src){var g=gateOf(q,txt,src);add("a",txt||"…",g.status+" · "+src);paintKernel(q)})}
function refreshMods(){mods.seed=(window.__AKSI_SEED&&window.__AKSI_SEED.length)||0;mods.neuro=!!(window.AKSI_NEURO&&window.AKSI_NEURO.think);mods.net=!!(window.AKSI_NET&&window.AKSI_NET.generate);mods.adia=!!(window.AKSI_ADIA&&window.AKSI_ADIA.evaluate);var n=(mods.seed?1:0)+(mods.neuro?1:0)+(mods.net?1:0)+(mods.adia?1:0);if($("mM"))$("mM").textContent=n+"/4";if($("badge"))$("badge").textContent="SEED "+mods.seed;if($("sealBox")){$("sealBox").className="seal "+(n>=3?"good":"");$("sealBox").textContent=BUILD+"\nNeuro:"+(mods.neuro?"✓":"·")+" Net:"+(mods.net?"✓":"·")+" ADIA:"+(mods.adia?"✓":"·")+" SEED:"+mods.seed}if($("dot"))$("dot").style.background=n>=3?"#34d399":"#f59e0b"}
function goTab(name){[].forEach.call(document.querySelectorAll("[data-panel]"),function(p){p.hidden=p.getAttribute("data-panel")!==name});[].forEach.call(document.querySelectorAll("[data-tab]"),function(b){b.classList.toggle("on",b.getAttribute("data-tab")===name)});if(name==="matrix")paintKernel("АКСИ");if(name==="trust"){var el=$("trustList"),list=loadReceipts();if(el)el.textContent=list.length?list.slice(0,12).map(function(r){return r.status+" · "+r.q.slice(0,50)}).join("\n"):"пока нет чеков"}if(name==="memory"){var el=$("memList"),keys=Object.keys(facts);if(el)el.textContent=keys.length?keys.map(function(k){return k+" = "+facts[k]}).join("\n"):"пусто — «запомни: ключ = значение»"}if(name==="lab"){var el=$("labOut"),q=quantumCollapse("lab"),r=Kernel.run("lab");if(el)el.textContent="Коллапс: "+q.bits+"\nH_eff="+r.qbm.H_eff.toFixed(3)}if(name==="net"){var el=$("netOut"),s=window.AKSI_NET&&window.AKSI_NET.status?window.AKSI_NET.status():{};if(el)el.textContent="AKSI Net "+(s.version||"")+"\nready:"+(s.ready?"да":"нет")+" vocab:"+(s.vocab||0)+" H:"+(s.hidden||0)+"\nepochs:"+(s.epochsDone||0)}}
function boot(){refreshMods();try{if(window.AKSI_NET&&window.AKSI_NET.autoPretrain)setTimeout(function(){try{window.AKSI_NET.autoPretrain();refreshMods()}catch(e){}},400)}catch(e){}setInterval(function(){var e=$("st");if(e)try{e.textContent=new Date().toLocaleTimeString("ru-RU",{timeZone:"Europe/Moscow",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})+" МСК"}catch(x){}},1000);$("send").onclick=send;$("in").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();send()}});document.addEventListener("click",function(ev){var t=ev.target;if(!t||!t.getAttribute)return;var q=t.getAttribute("data-q");if(q!=null){if($("in"))$("in").value=q;send();return}var tab=t.getAttribute("data-tab");if(tab){goTab(tab);return}var act=t.getAttribute("data-act");if(act==="clearMem"){facts={};saveF();goTab("memory");add("a","Память очищена","");return}if(act==="qrun"){goTab("lab");return}if(act==="train"){try{if(window.AKSI_NET&&window.AKSI_NET.train){var r=window.AKSI_NET.train({epochs:10});add("a","Сеть обучена. epochs="+r.epochs,"net");goTab("net")}}catch(e){}return}if(act==="status"){refreshMods();add("a",BUILD+" · Neuro:"+(mods.neuro?"on":"off")+" Net:"+(mods.net?"on":"off")+" ADIA:"+(mods.adia?"on":"off")+" SEED:"+mods.seed,"");return}});paintKernel("АКСИ");goTab("chat");add("a","АКСИ ONE · Neuro + Net + ADIA + Matrix\nМодули подключены.");setTimeout(refreshMods,800)}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();
</script>
</body>
</html>
