<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>АКСИ</title>
<style>
:root{
  --bg:#09090b;--panel:#0c0c0f;--card:#121216;--line:#1f1f27;
  --ink:#fafafa;--muted:#71717a;--acc:#a78bfa;--acc2:#818cf8;
  --ok:#34d399;--soft:rgba(167,139,250,.1);--side:220px;
  --r:12px;--font:ui-sans-serif,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--ink);display:flex;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:0}
.side{
  width:var(--side);min-width:var(--side);background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:12px 10px;position:fixed;inset:0 auto 0 0;z-index:40;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,#7c3aed,#4f46e5);
  display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px;
}
.brand b{font-size:13px;font-weight:700;letter-spacing:-.02em}
.brand span{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.tab{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 12px;border-radius:9px;font-size:13px;font-weight:500;
  color:var(--muted);transition:background .12s,color .12s;
}
.tab:hover{background:#18181b;color:var(--ink)}
.tab.on{background:var(--soft);color:var(--acc)}
.tab .i{width:18px;text-align:center;font-size:14px;opacity:.9}
.foot{padding:10px 8px 4px;border-top:1px solid var(--line);margin-top:8px}
#st{font-size:11px;color:var(--muted);font-weight:500}
#st.ok{color:var(--ok)}
#clock{font-size:10px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.main{margin-left:var(--side);flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;max-height:100dvh}
.top{
  padding:14px 20px;border-bottom:1px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.top-left{display:flex;align-items:center;gap:12px}
.av{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(145deg,#1e1b4b,#312e81);
  border:1.5px solid #6d28d9;display:grid;place-items:center;font-size:16px;
}
.top h1{font-size:15px;font-weight:650;letter-spacing:-.02em}
.top p{font-size:11px;color:var(--muted);margin-top:1px}
.content{flex:1;overflow-y:auto;padding:16px 20px 100px}
.panel{display:none;max-width:720px}.panel.on{display:block}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;margin-bottom:12px;
}
h2{font-size:13px;font-weight:600;margin-bottom:8px;letter-spacing:-.01em}
.muted{color:var(--muted);font-size:12px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.app{
  border:1px solid var(--line);background:var(--panel);border-radius:10px;
  padding:12px;text-align:left;transition:border-color .12s,background .12s;
}
.app:hover{border-color:#3f3f46;background:#18181b}
.app .ic{font-size:18px;margin-bottom:6px;display:block}
.app b{display:block;font-size:12px;font-weight:600}
.app span{font-size:10px;color:var(--muted);margin-top:2px;display:block}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.cell{
  border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px;
}
.cell b{display:block;font-size:10px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.cell .v{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.cell .v.ok{color:var(--ok)}
#thread{max-height:min(44vh,340px);overflow-y:auto;margin-top:10px}
.msg{margin:0 0 10px}
.msg .b{
  padding:10px 14px;border-radius:14px;font-size:13px;
  white-space:pre-wrap;word-break:break-word;line-height:1.45;max-width:92%;
}
.msg.u .b{background:linear-gradient(135deg,#6d28d9,#4f46e5);margin-left:auto;border-bottom-right-radius:4px}
.msg.u{display:flex;justify-content:flex-end}
.msg.a .b{background:#18181b;border:1px solid var(--line);border-bottom-left-radius:4px}
.thought{font-size:10px;color:var(--muted);margin-top:4px;padding-left:2px}
.meta{font-size:9px;color:#52525b;font-family:ui-monospace,monospace;word-break:break-all;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.btn{
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:999px;padding:7px 14px;font-size:12px;font-weight:500;
  transition:border-color .12s,background .12s;
}
.btn:hover{border-color:#3f3f46;background:#18181b}
.btn.p{background:linear-gradient(135deg,#7c3aed,#4f46e5);border:0;color:#fff}
.btn.p:hover{filter:brightness(1.08)}
.row{display:flex;gap:8px;margin-top:8px;align-items:center}
.field{
  flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:14px;outline:0;
  transition:border-color .12s;
}
.field:focus{border-color:#6d28d9}
.composer{
  position:fixed;left:var(--side);right:0;bottom:0;
  display:none;gap:8px;align-items:center;
  padding:10px 16px max(14px,env(safe-area-inset-bottom));
  background:rgba(9,9,11,.92);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);z-index:30;
}
.composer.on{display:flex}
#inp{
  flex:1;min-height:44px;border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;background:var(--panel);color:var(--ink);font-size:15px;outline:0;
}
#inp:focus{border-color:#6d28d9}
#send,#mic{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;
  font-weight:700;font-size:15px;flex-shrink:0;display:grid;place-items:center;
}
#mic{background:var(--panel);border:1px solid var(--line);font-size:14px}
#prog{display:none;font-size:12px;color:var(--acc2);font-weight:500;margin:6px 0}
#prog.on{display:block}
.probs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.probs div{
  text-align:center;padding:10px 4px;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);font-size:10px;color:var(--muted);
}
.probs b{display:block;font-size:14px;color:var(--acc);margin-bottom:2px;font-weight:600}
.fact{
  display:flex;gap:8px;align-items:flex-start;padding:10px 12px;
  border:1px solid var(--line);border-radius:10px;margin-top:6px;
  background:var(--panel);font-size:12px;line-height:1.4;
}
.fact button{color:var(--muted);font-size:16px;line-height:1;padding:0 2px}
.fact button:hover{color:var(--ink)}
.mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
  word-break:break-all;background:var(--panel);padding:10px 12px;
  border-radius:8px;border:1px solid var(--line);
}
.metric{
  display:inline-block;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;margin:3px 4px 3px 0;font-size:11px;
}
.metric b{display:block;font-size:15px;color:var(--acc);font-weight:650;margin-bottom:2px}
table.pt{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
table.pt th,table.pt td{border:1px solid var(--line);padding:8px 10px;text-align:left}
table.pt th{background:var(--panel);color:var(--muted);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.03em}
.burger{
  display:none;position:fixed;top:10px;left:10px;z-index:50;
  width:40px;height:40px;border-radius:10px;background:var(--panel);
  border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:16px;
}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35;backdrop-filter:blur(2px)}
@media(max-width:800px){
  :root{--side:0px}
  .side{transform:translateX(-105%);transition:transform .2s;width:240px;min-width:240px}
  .side.open{transform:none}
  .burger{display:grid;place-items:center}
  .overlay.on{display:block}
  .main{margin-left:0}
  .composer{left:0}
  .top{padding-left:56px}
}
</style>
</head>
<body>
<button type="button" class="burger" id="burger" aria-label="Меню">☰</button>
<div class="overlay" id="overlay"></div>
<aside class="side" id="side">
  <div class="brand">
    <div class="logo">А</div>
    <div><b>АКСИ</b><span>v25</span></div>
  </div>
  <nav class="nav">
    <button type="button" class="tab on" data-p="home"><span class="i">⌂</span>Главная</button>
    <button type="button" class="tab" data-p="chat"><span class="i">💬</span>Чат</button>
    <button type="button" class="tab" data-p="quantum"><span class="i">⚛</span>Квант</button>
    <button type="button" class="tab" data-p="net"><span class="i">🌤</span>Погода</button>
    <button type="button" class="tab" data-p="metrics"><span class="i">📊</span>Метрики</button>
    <button type="button" class="tab" data-p="protocol"><span class="i">🔗</span>Протокол</button>
    <button type="button" class="tab" data-p="search"><span class="i">🔍</span>Поиск</button>
    <button type="button" class="tab" data-p="notes"><span class="i">📝</span>Заметки</button>
    <button type="button" class="tab" data-p="voice"><span class="i">🎙</span>Голос</button>
    <button type="button" class="tab" data-p="files"><span class="i">📎</span>Файлы</button>
    <button type="button" class="tab" data-p="id"><span class="i">🔑</span>ID</button>
  </nav>
  <div class="foot"><div id="st">…</div><div id="clock"></div></div>
</aside>
<div class="main">
  <div class="top">
    <div class="top-left">
      <div class="av" id="avatar">🟣</div>
      <div><h1 id="title">Главная</h1><p id="sub">ядро</p></div>
    </div>
  </div>
  <div class="content">
    <section class="panel on" id="p-home">
      <div class="card">
        <h2>Статус</h2>
        <div class="board" id="statusBoard"></div>
      </div>
      <div class="card">
        <h2>Модули</h2>
        <div class="grid">
          <button type="button" class="app" data-go="chat"><span class="ic">💬</span><b>Чат</b><span>offline</span></button>
          <button type="button" class="app" data-go="quantum"><span class="ic">⚛</span><b>Квант</b><span>Bell</span></button>
          <button type="button" class="app" data-go="net"><span class="ic">🌤</span><b>Погода</b><span>wttr</span></button>
          <button type="button" class="app" data-go="metrics"><span class="ic">📊</span><b>Метрики</b><span>EQS</span></button>
          <button type="button" class="app" data-go="protocol"><span class="ic">🔗</span><b>Протокол</b><span>Agent</span></button>
          <button type="button" class="app" data-go="search"><span class="ic">🔍</span><b>Поиск</b><span>wiki</span></button>
          <button type="button" class="app" data-go="notes"><span class="ic">📝</span><b>Заметки</b><span>local</span></button>
          <button type="button" class="app" data-go="id"><span class="ic">🔑</span><b>ID</b><span>DID</span></button>
        </div>
      </div>
    </section>
    <section class="panel" id="p-chat">
      <div class="card">
        <div class="chips">
          <button type="button" class="btn" data-q="кто ты">кто ты</button>
          <button type="button" class="btn" data-q="что умеешь">умеешь</button>
          <button type="button" class="btn" data-q="запутанность">Bell</button>
          <button type="button" class="btn" data-q="погода Москва">погода</button>
          <button type="button" class="btn" data-act="clearChat">очистить</button>
        </div>
        <div id="prog"></div>
        <div id="thread" role="log"></div>
      </div>
    </section>
    <section class="panel" id="p-quantum">
      <div class="card">
        <h2>2 кубита</h2>
        <div class="chips">
          <button type="button" class="btn p" data-act="qBell">Bell</button>
          <button type="button" class="btn" data-act="qSuper">Суперпозиция</button>
        </div>
        <p class="muted" id="qText" style="margin-top:10px">—</p>
        <div class="probs" id="qProbs"></div>
      </div>
    </section>
    <section class="panel" id="p-net">
      <div class="card">
        <h2>Погода</h2>
        <div class="row">
          <input class="field" id="wCity" value="Moscow" placeholder="город">
          <button type="button" class="btn p" data-act="weather">OK</button>
        </div>
        <div id="wOut" class="muted" style="margin-top:12px"></div>
      </div>
    </section>
    <section class="panel" id="p-metrics">
      <div class="card">
        <h2>Метрики</h2>
        <textarea class="field" id="mText" style="width:100%;min-height:72px;resize:vertical;margin-top:4px" placeholder="текст"></textarea>
        <div class="chips"><button type="button" class="btn p" data-act="metrics">считать</button></div>
        <div id="mOut" style="margin-top:8px"></div>
      </div>
    </section>
    <section class="panel" id="p-protocol">
      <div class="card">
        <h2>Agent-v1</h2>
        <div class="chips">
          <button type="button" class="btn p" data-act="protoRefresh">обновить</button>
          <button type="button" class="btn" data-act="protoPing">ping</button>
        </div>
        <div id="protoOut" style="margin-top:8px"></div>
      </div>
    </section>
    <section class="panel" id="p-search">
      <div class="card">
        <h2>Википедия</h2>
        <div class="row">
          <input class="field" id="sIn" placeholder="запрос">
          <button type="button" class="btn p" data-act="search">OK</button>
        </div>
        <div id="sOut" class="muted" style="margin-top:12px;white-space:pre-wrap"></div>
      </div>
    </section>
    <section class="panel" id="p-notes">
      <div class="card">
        <h2>Заметки</h2>
        <div class="row">
          <input class="field" id="nIn" placeholder="заметка">
          <button type="button" class="btn p" data-act="noteAdd">+</button>
        </div>
        <div id="nList"></div>
      </div>
    </section>
    <section class="panel" id="p-voice">
      <div class="card">
        <h2>Голос</h2>
        <button type="button" class="btn p" data-act="voice" style="margin-top:8px">🎙 слушать</button>
      </div>
    </section>
    <section class="panel" id="p-files">
      <div class="card">
        <h2>Файлы</h2>
        <input type="file" id="fIn" accept=".txt,.md,text/plain" multiple style="margin-top:8px;display:block;font-size:12px;color:var(--muted)">
        <div id="fOut" class="muted" style="margin-top:8px"></div>
      </div>
    </section>
    <section class="panel" id="p-id">
      <div class="card">
        <h2>Локальный ID</h2>
        <div class="mono" id="didFull" style="margin-top:8px">—</div>
        <div class="row" style="margin-top:8px">
          <input class="field" id="didName" placeholder="имя">
          <button type="button" class="btn p" data-act="didGen">создать</button>
        </div>
        <div id="didUser" class="muted" style="margin-top:6px"></div>
      </div>
    </section>
  </div>
</div>
<div class="composer" id="composer">
  <button type="button" id="mic" data-act="voice" title="микрофон">🎙</button>
  <input id="inp" type="text" placeholder="сообщение" enterkeyhint="send" autocomplete="off">
  <button type="button" id="send" data-act="send">➤</button>
</div>
<script>
(function(){
"use strict";
var ST=document.getElementById("st"),THREAD=document.getElementById("thread"),PROG=document.getElementById("prog");
var INP=document.getElementById("inp"),COMP=document.getElementById("composer");
var CHAT_KEY="aksi_chat_v25",mem=[],SEED="Alfiya_AKSI_DIMAX_v3_2026",AKSI_DID="did:aksi:local:core";
var titles={home:["Главная","статус"],chat:["Чат","offline"],quantum:["Квант","2q"],net:["Погода","wttr"],metrics:["Метрики","EQS"],protocol:["Протокол","Agent-v1"],search:["Поиск","wiki"],notes:["Заметки","local"],voice:["Голос","STT"],files:["Файлы","txt"],id:["ID","DID"]};
function esc(s){return String(s).replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">").replace(/\"/g,""");}
function setSt(t,ok){if(!ST)return;ST.textContent=t;ST.classList.toggle("ok",!!ok);}
function showProg(t){if(!PROG)return;if(!t){PROG.classList.remove("on");PROG.textContent="";return;}PROG.textContent=t;PROG.classList.add("on");}
function tick(){var el=document.getElementById("clock");if(!el)return;try{el.textContent=new Date().toLocaleString("ru-RU",{timeZone:"Europe/Moscow",hour:"2-digit",minute:"2-digit",second:"2-digit");}catch(e){}}
function setAv(e){var a=document.getElementById("avatar");if(a)a.textContent=e||"🟣";}
function openPanel(name){if(!titles[name])name="home";document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("on");});document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("on",t.getAttribute("data-p")===name);});var p=document.getElementById("p-"+name);if(p)p.classList.add("on");var m=titles[name],th=document.getElementById("title"),sb=document.getElementById("sub");if(th)th.textContent=m[0];if(sb)sb.textContent=m[1];if(COMP)COMP.classList.toggle("on",name==="chat"||name==="voice");try{history.replaceState(null,"","#"+name);}catch(e){}closeSide();if(name==="notes")renderNotes();if(name==="protocol")renderProto();if(name==="home")renderBoard();}
function closeSide(){var s=document.getElementById("side"),o=document.getElementById("overlay");if(s)s.classList.remove("open");if(o)o.classList.remove("on");}
function openSide(){var s=document.getElementById("side"),o=document.getElementById("overlay");if(s)s.classList.add("open");if(o)o.classList.add("on");}
function loadMem(){try{mem=JSON.parse(localStorage.getItem("aksi_facts")||"[]");}catch(e){mem=[];}}
function saveFact(t){t=(t||"").trim();if(!t)return;mem.unshift({text:t.slice(0,2000),ts:Date.now()});mem=mem.slice(0,200);try{localStorage.setItem("aksi_facts",JSON.stringify(mem));}catch(e){}}
function renderNotes(){var list=document.getElementById("nList");if(!list)return;if(!mem.length){list.innerHTML='<p class="muted" style="margin-top:10px">пусто</p>';return;}list.innerHTML=mem.slice(0,40).map(function(f,i){return '<div class="fact"><div style="flex:1">'+esc(f.text)+'</div><button type="button" data-del="'+i+'">×</button></div>';}).join("");}
function addMsg(role,text,meta,thoughts){if(!THREAD)return;var d=document.createElement("div");d.className="msg "+(role==="u"?"u":"a");var h='<div class="b">'+esc(text)+"</div>";if(thoughts&&thoughts.length)h+='<div class="thought">'+esc(thoughts.join(" → "))+"</div>";if(meta)h+='<div class="meta">'+esc(meta)+"</div>";d.innerHTML=h;THREAD.appendChild(d);THREAD.scrollTop=THREAD.scrollHeight;persist();}
function persist(){try{var n=THREAD.querySelectorAll(".msg"),a=[];for(var i=0;i<n.length;i++){var b=n[i].querySelector(".b");if(b)a.push({role:n[i].classList.contains("u")?"u":"a",text:b.textContent});}localStorage.setItem(CHAT_KEY,JSON.stringify(a.slice(-50)));}catch(e){}}
function restore(){try{var a=JSON.parse(localStorage.getItem(CHAT_KEY)||"[]");if(!a.length)return false;a.forEach(function(m){addMsg(m.role,m.text);});return true;}catch(e){return false;}}
function shannonH(text){var f={},i,n=text.length||1,H=0;for(i=0;i<text.length;i++)f[text[i]]=(f[text[i]]||0)+1;for(var c in f){var p=f[c]/n;if(p>0)H-=p*Math.log(p)/Math.LN2;}return Math.round(H*1e4)/1e4;}
function qcli(text){var H=shannonH(text),u={};for(var i=0;i<text.length;i++)u[text[i]]=1;var m=Math.log(Math.max(1,Object.keys(u).length))/Math.LN2;return m>0?Math.min(1,Math.round(H/m*1e4)/1e4):0;}
function heff(text){var w=text.trim().split(/\s+/).filter(Boolean),u={};w.forEach(function(x){u[x]=1;});return Math.round(shannonH(text)*(Object.keys(u).length/Math.max(1,w.length))*1e4)/1e4;}
function fp(text){var h=0xdeadbeef;for(var i=0;i<text.length;i++)h=(Math.imul(31,h)+text.charCodeAt(i))|0;return(h>>>0).toString(16).toUpperCase().padStart(8,"0");}
function eqs(text){var H=shannonH(text),rel=navigator.onLine?0.85:0.7,coh=Math.min(1,text.length/80);return Math.round((0.30*(H/5)+0.35*rel+0.25*coh+0.10*0.82)*1000)/10;}
function shaLocal(str){if(window.crypto&&crypto.subtle)return crypto.subtle.digest("SHA-256",new TextEncoder().encode(str)).then(function(buf){return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0");}).join("").slice(0,16);});var h=0x811c9dc5;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193);}return Promise.resolve(("00000000"+(h>>>0).toString(16)).slice(-8));}
function statevector(gates){var s=[1,0,0,0];function applyH(q){var n=[0,0,0,0],inv=1/Math.SQRT2;if(q===0){n[0]=inv*(s[0]+s[2]);n[1]=inv*(s[1]+s[3]);n[2]=inv*(s[0]-s[2]);n[3]=inv*(s[1]-s[3]);}else{n[0]=inv*(s[0]+s[1]);n[1]=inv*(s[0]-s[1]);n[2]=inv*(s[2]+s[3]);n[3]=inv*(s[2]-s[3]);}s=n;}function cnot(){var n=s.slice();n[2]=s[3];n[3]=s[2];s=n;}gates.forEach(function(g){if(g==="H0")applyH(0);else if(g==="CNOT")cnot();});return s.map(function(a){return a*a;});}
function showQuantum(mode){var gates=mode==="bell"?["H0","CNOT"]:["H0"],p=statevector(gates),labels=["|00⟩","|01⟩","|10⟩","|11⟩"];var box=document.getElementById("qProbs"),txt=document.getElementById("qText");if(box)box.innerHTML=labels.map(function(l,i){return "<div><b>"+(p[i]*100).toFixed(0)+"%</b>"+l+"</div>";}).join("");if(txt)txt.textContent=mode==="bell"?"Bell · H0+CNOT":"H0 · суперпозиция";setAv(mode==="bell"?"⚛":"✨");return mode==="bell"?"Bell\n|00⟩ ≈ 50%\n|11⟩ ≈ 50%":"Суперпозиция · 0/1 ≈ 50%";}
function loadProto(){try{return JSON.parse(localStorage.getItem("aksi_proto_v1")||"{}");}catch(e){return {};}}
function saveProto(p){try{localStorage.setItem("aksi_proto_v1",JSON.stringify(p));}catch(e){}}
function ensureProto(){var p=loadProto();if(!p.agents)p.agents={};if(!p.agents[AKSI_DID])p.agents[AKSI_DID]={name:"АКСИ",reputationScore:92,messageCount:0,capabilities:["chat","quantum","metrics"],lastSeen:Date.now()};if(!p.messages)p.messages=[];saveProto(p);return p;}
function protoPing(){var p=ensureProto();p.agents[AKSI_DID].messageCount=(p.agents[AKSI_DID].messageCount||0)+1;p.agents[AKSI_DID].lastSeen=Date.now();p.messages.push({from:AKSI_DID,type:"ping",ts:Date.now()});p.messages=p.messages.slice(-30);saveProto(p);renderProto();}
function renderProto(){var p=ensureProto(),out=document.getElementById("protoOut");if(!out)return;var rows=Object.keys(p.agents).map(function(did){var a=p.agents[did];return "<tr><td>"+esc(a.name)+"</td><td>"+esc(String(a.reputationScore))+"</td><td>"+esc(String(a.messageCount||0))+"</td></tr>";}).join("");out.innerHTML="<table class='pt'><tr><th>агент</th><th>EQS</th><th>msg</th></tr>"+rows+"</table>";}
function getWeather(city){return fetch("https://wttr.in/"+encodeURIComponent(city||"Moscow")+"?format=j1").then(function(r){return r.json();}).then(function(data){var c=data.current_condition&&data.current_condition[0];return{city:city||"Moscow",temp:parseInt(c&&c.temp_C||"0",10),cond:(c&&c.weatherDesc&&c.weatherDesc[0]&&c.weatherDesc[0].value)||"—",hum:parseInt(c&&c.humidity||"0",10),wind:parseInt(c&&c.windspeedKmph||"0",10)};}).catch(function(){return null;});}
function searchWiki(q){return fetch("https://ru.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(q)).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){return j&&j.extract?((j.title||"")+".\n\n"+String(j.extract).slice(0,900)):null;}).catch(function(){return null;});}
function safeMath(expr){var e=String(expr||"").replace(/,/g,".").replace(/\s/g,"");if(!/^[\d+\-*/().^]+$/.test(e))return null;e=e.replace(/\^/g,"**");try{var v=Function('"use strict";return ('+e+')')();return typeof v==="number"&&isFinite(v)?v:null;}catch(err){return null;}}
var KB=[{q:["кто ты","что ты","представься"],a:"АКСИ — локальное ядро.\nЧат · квант · EQS · протокол · погода · вики · заметки · голос · ID."},{q:["что умеешь","возможности","функции"],a:"чат · погода · Bell · EQS/QCLI · Agent-v1 · поиск · заметки · голос · ID"},{q:["привет","здравствуй","добрый"],a:"готово."},{q:["помощь","help"],a:"модули слева · запомни: … · 2+2 · Bell · погода Москва"},{q:["запутанность","белл","bell","кубит","квант"],a:"__QB__"},{q:["суперпозиция"],a:"__QS__"}];
function matchKB(text){var t=(text||"").toLowerCase().replace(/ё/g,"е"),best=null,sc=0;for(var i=0;i<KB.length;i++)for(var j=0;j<KB[i].q.length;j++){var k=KB[i].q[j];if(t===k)return KB[i];if(t.indexOf(k)!==-1&&k.length>sc){sc=k.length;best=KB[i];}}return best;}
function answer(q){var steps=["parse"];var m=q.match(/^запомни[:\s]+(.+)/i);if(m){saveFact(m[1]);renderNotes();return Promise.resolve({text:"«"+m[1].slice(0,160)+"»",steps:steps.concat(["mem"]),meta:"mem"});}var wm=q.match(/погода\s+(.+)/i)||(/^погода$/i.test(q.trim())?["","Moscow"]:null);if(wm){steps.push("weather");showProg("…");return getWeather((wm[1]||"Moscow").trim()).then(function(w){if(!w)return{text:"нет данных",steps:steps,meta:"net"};return{text:w.city+": "+w.temp+"°C, "+w.cond+" · "+w.hum+"% · "+w.wind+" км/ч",steps:steps,meta:"wttr"};});}var mq=q.replace(/^(сколько будет|посчитай|вычисли)\s+/i,"").trim();if(/^[\d+\-*/().^\s,]+$/.test(mq)&&/\d/.test(mq)){var v=safeMath(mq);if(v!==null)return Promise.resolve({text:String(v),steps:steps.concat(["math"]),meta:"math"});}var kb=matchKB(q);if(kb){if(kb.a==="__QB__")return Promise.resolve({text:showQuantum("bell"),steps:steps.concat(["q"]),meta:"q"});if(kb.a==="__QS__")return Promise.resolve({text:showQuantum("super"),steps:steps.concat(["q"]),meta:"q"});return Promise.resolve({text:kb.a,steps:steps.concat(["kb"]),meta:"kb"});}var ql=q.toLowerCase();for(var i=0;i<mem.length;i++)if(mem[i].text&&mem[i].text.toLowerCase().indexOf(ql.slice(0,24))!==-1)return Promise.resolve({text:mem[i].text.slice(0,500),steps:steps.concat(["mem"]),meta:"mem"});if(navigator.onLine){showProg("…");var query=q.replace(/^(что такое|кто такой|расскажи про)\s+/i,"").trim();return searchWiki(query).then(function(w){if(w)return{text:w,steps:steps.concat(["wiki"]),meta:"wiki"};return{text:"—",steps:steps,meta:"—"};});}return Promise.resolve({text:"offline",steps:steps.concat(["off"]),meta:"off"});}
function sendText(raw){var q=String(raw||"").trim();if(!q)return;addMsg("u",q);if(INP)INP.value="";showProg("…");openPanel("chat");setAv("💭");answer(q).then(function(ans){return shaLocal(ans.text+"|"+SEED+"|"+Date.now()).then(function(h){showProg("");setAv("🟣");addMsg("a",ans.text,(ans.meta||"")+" · "+h+" · Q"+qcli(ans.text)+" · E"+eqs(ans.text),ans.steps);var p=ensureProto();p.agents[AKSI_DID].messageCount=(p.agents[AKSI_DID].messageCount||0)+1;saveProto(p);});}).catch(function(){showProg("");setAv("🟣");addMsg("a","ошибка","err");});}
function startVoice(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){addMsg("a","нет STT","voice");openPanel("chat");return;}var r=new SR();r.lang="ru-RU";r.onresult=function(e){sendText(e.results[0][0].transcript);};r.onerror=r.onend=function(){setSt("ok",true);};r.start();setSt("…",false);}
function doWeather(){var city=(document.getElementById("wCity")||{}).value||"Moscow",out=document.getElementById("wOut");if(out)out.textContent="…";getWeather(city).then(function(w){if(!out)return;if(!w){out.textContent="—";return;}out.textContent=w.city+": "+w.temp+"°C, "+w.cond+", "+w.hum+"%, "+w.wind+" км/ч";});}
function doMetrics(){var t=(document.getElementById("mText")||{}).value||"",out=document.getElementById("mOut");if(!t.trim()){if(out)out.textContent="—";return;}if(out)out.innerHTML='<span class="metric"><b>'+shannonH(t)+'</b>H</span><span class="metric"><b>'+qcli(t)+'</b>QCLI</span><span class="metric"><b>'+heff(t)+'</b>H_eff</span><span class="metric"><b>'+eqs(t)+'</b>EQS</span><span class="metric"><b>'+fp(t)+'</b>fp</span>';}
function doSearch(){var sIn=document.getElementById("sIn"),q=(sIn&&sIn.value||"").trim();if(!q)return;var out=document.getElementById("sOut");if(out)out.textContent="…";searchWiki(q).then(function(w){if(out)out.textContent=w||"—";});}
function doDid(){var name=(document.getElementById("didName")||{}).value||"aksi";shaLocal(name+"|"+SEED+"|"+Date.now()).then(function(h){var id="did:aksi:local:"+h;try{localStorage.setItem("aksi_local_id",id);localStorage.setItem("aksi_local_name",name);}catch(e){}var full=document.getElementById("didFull"),user=document.getElementById("didUser");if(full)full.textContent=id;if(user)user.textContent=name;});}
function renderBoard(){var el=document.getElementById("statusBoard");if(!el)return;var p=ensureProto(),a=p.agents[AKSI_DID]||{},on=navigator.onLine;var items=[["ядро","ok","ok"],["сеть",on?"online":"off",on?"ok":""],["память",String(mem.length),mem.length?"ok":""],["протокол","v1","ok"],["EQS",String(a.reputationScore||92),"ok"],["msg",String(a.messageCount||0),""]];el.innerHTML=items.map(function(x){return '<div class="cell"><b>'+esc(x[0])+'</b><span class="v '+(x[2]||"")+'">'+esc(x[1])+'</span></div>';}).join("");}
function handleAction(act){if(act==="send"){sendText(INP&&INP.value);return;}if(act==="clearChat"){if(THREAD)THREAD.innerHTML="";try{localStorage.removeItem(CHAT_KEY);}catch(e){}addMsg("a","—","sys");return;}if(act==="qBell"){showQuantum("bell");return;}if(act==="qSuper"){showQuantum("super");return;}if(act==="weather"){doWeather();return;}if(act==="metrics"){doMetrics();return;}if(act==="search"){doSearch();return;}if(act==="noteAdd"){var n=document.getElementById("nIn");if(n){saveFact(n.value);n.value="";renderNotes();}return;}if(act==="voice"){startVoice();return;}if(act==="didGen"){doDid();return;}if(act==="protoRefresh"){renderProto();return;}if(act==="protoPing"){protoPing();return;}}
function bind(){document.addEventListener("click",function(e){var t=e.target.closest(".tab");if(t){e.preventDefault();openPanel(t.getAttribute("data-p"));return;}var g=e.target.closest("[data-go]");if(g){e.preventDefault();openPanel(g.getAttribute("data-go"));return;}var q=e.target.closest("[data-q]");if(q){e.preventDefault();sendText(q.getAttribute("data-q"));return;}var act=e.target.closest("[data-act]");if(act){e.preventDefault();handleAction(act.getAttribute("data-act"));return;}var del=e.target.closest("[data-del]");if(del){e.preventDefault();mem.splice(+del.getAttribute("data-del"),1);try{localStorage.setItem("aksi_facts",JSON.stringify(mem));}catch(err){}renderNotes();return;}if(e.target.id==="burger"||e.target.closest("#burger")){openSide();return;}if(e.target.id==="overlay"){closeSide();return;}});if(INP)INP.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();sendText(INP.value);}});var fIn=document.getElementById("fIn");if(fIn)fIn.addEventListener("change",function(){var files=fIn.files,out=document.getElementById("fOut"),n=0;if(!files)return;Array.prototype.forEach.call(files,function(file){var r=new FileReader();r.onload=function(){saveFact("["+file.name+"] "+String(r.result||"").slice(0,600));n++;if(out)out.textContent=n;renderNotes();};r.readAsText(file);});});try{var id=localStorage.getItem("aksi_local_id");if(id){var full=document.getElementById("didFull"),user=document.getElementById("didUser");if(full)full.textContent=id;if(user)user.textContent=localStorage.getItem("aksi_local_name")||"";}}catch(e){}}
loadMem();ensureProto();bind();setInterval(tick,1000);tick();setSt("ok",true);renderBoard();var hash=(location.hash||"").replace("#","");if(titles[hash])openPanel(hash);else openPanel("home");if(!restore()&&THREAD)addMsg("a","АКСИ online","sys");
})();
