<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>АКСИ</title>
<meta name="theme-color" content="#5b21b6">
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="manifest" href="/manifest.webmanifest">
<style>
*{box-sizing:border-box;margin:0}
body{
  font-family:system-ui,-apple-system,sans-serif;background:#5b21b6;color:#fff;
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px;text-align:center;
}
h1{font-size:2.2rem;font-weight:900;margin-bottom:12px}
p{font-size:1.15rem;margin-bottom:28px;opacity:.95}
a{
  display:block;width:100%;max-width:340px;text-align:center;text-decoration:none;
  font-size:1.3rem;font-weight:900;padding:22px;border-radius:16px;margin-bottom:14px;
}
a.main{background:#fff;color:#5b21b6}
a.sec{border:3px solid #fff;color:#fff}
</style>
</head>
<body>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});
}
if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}
</script>
<h1>АКСИ</h1>
<p>Чат · Сеть · Навигатор</p>
<a class="main" href="/app/">ОТКРЫТЬ</a>
<a class="sec" href="/nav/">НАВИГАТОР</a>
</body>
</html>
