<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0c">
<meta name="description" content="AKSI — Sovereign Agent Layer. Личный агент и платформа владения.">
<title>AKSI</title>
<style>
:root{--bg:#0a0a0c;--card:#141418;--line:#2a2a32;--t:#f4f4f5;--m:#a1a1aa;--a:#a78bfa;--a2:#7c3aed;--font:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--t);font:16px/1.5 var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;-webkit-font-smoothing:antialiased}
.logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--a2),var(--a));display:grid;place-items:center;font:700 20px/1 var(--font);margin:0 auto 20px;box-shadow:0 8px 32px rgba(124,58,237,.35)}
h1{font-size:28px;font-weight:700;letter-spacing:-.03em;text-align:center;margin-bottom:8px}
.sub{color:var(--m);text-align:center;max-width:360px;margin:0 auto 28px;font-size:15px;line-height:1.5}
.actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
a.btn{display:block;text-align:center;padding:14px 18px;border-radius:14px;text-decoration:none;font-weight:600;font-size:15px}
a.p{background:linear-gradient(135deg,var(--a2),var(--a));color:#fff}
a.g{border:1px solid var(--line);color:var(--t);background:var(--card)}
footer{margin-top:36px;font-size:13px;color:var(--m);text-align:center}
footer a{color:var(--a);text-decoration:none}
</style>
</head>
<body>
  <div>
    <div class="logo">A</div>
    <h1>AKSI</h1>
    <p class="sub">Sovereign Agent Layer — слой личных агентов. Память и владение у вас.</p>
    <div class="actions">
      <a class="btn p" href="aksi.html?v=2">Открыть агента</a>
      <a class="btn g" href="platform.html">Манифест платформы</a>
    </div>
    <footer>aksilove@internet.ru</footer>
  </div>
</body>
</html>
