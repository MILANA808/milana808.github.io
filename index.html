<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Акси</title>
<meta name="theme-color" content="#0c0f14"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:#0c0f14;color:#e8eaed;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
header{padding:14px 16px;font-size:15px;font-weight:600;border-bottom:1px solid #1a1f2e}
main{flex:1;max-width:640px;width:100%;margin:0 auto;padding:12px 14px 20px;display:flex;flex-direction:column;min-height:0}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:8px 0;min-height:200px}
.msg{padding:12px 14px;border-radius:14px;font-size:15px;line-height:1.55;white-space:pre-wrap;max-width:90%}
.u{align-self:flex-end;background:#1a2332;border:1px solid #2a3548}
.a{align-self:flex-start;background:#12181f;border:1px solid #1e2836}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{padding:8px 12px;font-size:12px;background:#151a24;color:#9aa3b5;border:1px solid #252b3a;border-radius:20px;cursor:pointer}
.chips button:active{background:#1e2533}
.bar{display:flex;gap:8px;padding-top:4px}
input{flex:1;background:#151a24;border:1px solid #252b3a;border-radius:14px;color:#e8eaed;padding:14px 16px;font-size:16px;outline:none}
input:focus{border-color:#3d4a63}
button#send{border:0;border-radius:14px;padding:14px 18px;background:#5b8def;color:#fff;font-weight:600;font-size:15px;cursor:pointer}
footer{text-align:center;padding:10px;font-size:11px;color:#5a6375}
</style>
</head>
<body>
<header>Акси</header>
<main>
  <div id="log"></div>
  <div class="chips">
    <button type="button" data-q="кто ты">кто ты</button>
    <button type="button" data-q="что такое энтропия">энтропия</button>
    <button type="button" data-q="что такое ии">ИИ</button>
    <button type="button" data-q="что такое сознание">сознание</button>
    <button type="button" data-q="12*12">12×12</button>
  </div>
  <div class="bar">
    <input id="in" type="text" placeholder="Напиши вопрос…" autocomplete="off" enterkeyhint="send"/>
    <button type="button" id="send">→</button>
  </div>
</main>
<footer>aksilove@internet.ru</footer>
<script src="./aksi-seed.js?v=36"></script>
<script>
(function(){
"use strict";
var FK="aksi_mem";
var facts={};
try{facts=JSON.parse(localStorage.getItem(FK)||"{}")||{}}catch(e){}
function $(id){return document.getElementById(id)}
function save(){try{localStorage.setItem(FK,JSON.stringify(facts))}catch(e){}}
function norm(s){return String(s||"").toLowerCase().replace(/[«»"'`?!.,;:()]/g," ").replace(/\s+/g," ").trim()}
function toks(s){return norm(s).split(" ").filter(function(w){return w.length>1})}
function fmt(x){if(!isFinite(x))return"—";if(Math.abs(x-Math.round(x))<1e-10)return String(Math.round(x));return String(parseFloat(x.toFixed(6)))}
function seedA(q){var SEED=window.__AKSI_SEED||[],n=norm(q),t=toks(q),best=null,sc0=0,i,j;for(i=0;i<SEED.length;i++){var s=SEED[i],k=norm(s.q),sc=0;if(n===k)sc+=20;else if(n.indexOf(k)>=0||k.indexOf(n)>=0)sc+=12;for(j=0;j<t.length;j++)if(k.indexOf(t[j])>=0)sc+=5;if(sc>sc0){sc0=sc;best=s.a}}return sc0>=8?best:null}
function mathA(q){var raw=String(q).trim();var expr=raw.replace(/[=?]/g,"").replace(/×/g,"*").replace(/÷/g,"/").replace(/,/g,".").trim();if(!/^[0-9+\-*/().\s]+$/.test(expr)||expr.length>40)return null;try{var v=Function('"use strict";return('+expr+")")();return typeof v==="number"&&isFinite(v)?fmt(v):null}catch(e){return null}}
function identity(q){var l=norm(q);if(/кто ты|who are|представься/.test(l))return"Я Акси — помощник в браузере. Отвечаю из локальных знаний, считаю, могу запомнить. Пиши как человеку.";if(/что ты умеешь|помощь|help/.test(l))return"Спроси что угодно простым языком. Могу объяснить, посчитать, запомнить факт: «запомни: ключ = значение».";return null}
function remember(q){var m=String(q).match(/^запомни\s*[:：]?\s*(.+?)\s*[=:]\s*(.+)$/i);if(!m)return null;var k=norm(m[1]),v=m[2].trim();if(!k)return null;facts[k]=v;save();return"Запомнила: "+k+" = "+v}
function recall(q){var l=norm(q),keys=Object.keys(facts),i;for(i=0;i<keys.length;i++)if(l.indexOf(keys[i])>=0||keys[i].indexOf(l)>=0)return facts[keys[i]];return null}
function wiki(q,cb){var term=toks(q).slice(0,5).join(" ")||q;fetch("https://ru.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(term)).then(function(r){if(!r.ok)throw new Error();return r.json()}).then(function(j){cb(j&&j.extract?j.extract.slice(0,380):null)}).catch(function(){cb(null)})}
function answer(q,cb){var a;a=identity(q);if(a){cb(a);return}a=remember(q);if(a){cb(a);return}a=recall(q);if(a){cb(a);return}a=mathA(q);if(a){cb(a);return}a=seedA(q);if(a){cb(a);return}wiki(q,function(t){cb(t||"Пока не знаю. Попробуй другими словами или «запомни: тема = текст».")})}
function add(role,text){var d=document.createElement("div");d.className="msg "+(role==="u"?"u":"a");d.textContent=text;$("log").appendChild(d);$("log").scrollTop=$("log").scrollHeight}
function send(){var inp=$("in"),q=inp.value.trim();if(!q)return;inp.value="";add("u",q);answer(q,function(t){add("a",t||"…")})}
function boot(){$("send").onclick=send;$("in").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();send()}});document.addEventListener("click",function(ev){var t=ev.target;if(t&&t.getAttribute&&t.getAttribute("data-q")){$("in").value=t.getAttribute("data-q");send()}});add("a","Привет. Я Акси. Спроси что-нибудь.")}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();
</script>
</body>
</html>
