<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АКСИ</title>
<meta name="description" content="АКСИ — суверенный ИИ">
<meta name="theme-color" content="#0a0612">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{
  --bg:#0a0612;
  --ink:#f4f0ff;
  --muted:#9b92b0;
  --line:rgba(255,255,255,.08);
  --accent:#a78bfa;
  --card:rgba(255,255,255,.045);
}
*{box-sizing:border-box;margin:0}
body{
  min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:"SF Pro Text",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(139,92,246,.18),transparent)
}
.wrap{max-width:520px;margin:0 auto;padding:48px 20px 64px}
.mark{
  font-size:11px;letter-spacing:.32em;font-weight:600;color:var(--muted);margin-bottom:28px
}
h1{
  font-size:clamp(2.4rem,8vw,3.2rem);font-weight:600;letter-spacing:-.03em;
  line-height:1.05;margin-bottom:14px
}
.lead{font-size:16px;line-height:1.55;color:var(--muted);margin-bottom:32px;max-width:36ch}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:14px 22px;border-radius:14px;font-size:15px;font-weight:600;
  text-decoration:none;border:none;cursor:pointer;transition:.2s
}
.btn-main{
  background:linear-gradient(145deg,#8b5cf6,#6366f1);color:#fff;
  box-shadow:0 8px 28px rgba(99,102,241,.35)
}
.btn-main:hover{transform:translateY(-1px)}
.btn-ghost{
  background:transparent;color:var(--muted);border:1px solid var(--line);margin-left:10px
}
.btn-ghost:hover{color:var(--ink);border-color:rgba(255,255,255,.18)}
.links{margin-top:48px;display:flex;flex-direction:column;gap:2px}
.links a{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 4px;color:var(--ink);text-decoration:none;font-size:15px;
  border-bottom:1px solid var(--line)
}
.links a span{color:var(--muted);font-size:13px}
.links a:hover{color:var(--accent)}
foot{display:block;margin-top:40px;font-size:12px;color:#5c5668;letter-spacing:.04em}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">АКСИ</div>
  <h1>Суверенный<br>интеллект</h1>
  <p class="lead">Именной ИИ с паспортом, кодексом и открытыми источниками. Просто напишите или скажите.</p>
  <div>
    <a class="btn btn-main" href="/aksi/">Открыть</a>
    <a class="btn btn-ghost" href="/CODEX.md">Кодекс</a>
  </div>
  <nav class="links">
    <a href="/aksi/">Диалог <span>главное</span></a>
    <a href="/showcase/">Паспорт <span>DID</span></a>
    <a href="/messages/">Сообщения <span>E2E</span></a>
    <a href="/matrix.html">Лаборатория <span>quantum</span></a>
    <a href="/hub/">Все разделы <span>hub</span></a>
  </nav>
  <foot>Альфия · 14.02.1995</foot>
</div>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
</script>
</body>
</html>
