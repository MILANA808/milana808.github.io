<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>АКСИ</title>
<meta name="theme-color" content="#0b1020"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:#0b1020;color:#e8eefc;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid #24304d;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399}
header strong{font-size:15px}
#msk{margin-left:auto;font-size:12px;color:#8b9bb8}
main{flex:1;max-width:720px;width:100%;margin:0 auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:10px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:520px){.board{grid-template-columns:1fr}}
.metric{background:#121a2f;border:1px solid #24304d;border-radius:12px;padding:10px 12px}
.metric .k{font-size:10px;color:#8b9bb8;text-transform:uppercase;letter-spacing:.04em}
.metric .v{font-size:15px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.metric .s{font-size:11px;color:#94a3b8;margin-top:2px}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:180px;max-height:calc(100dvh - 280px)}
.msg{padding:12px 14px;border-radius:14px;white-space:pre-wrap;font-size:14px;line-height:1.5;max-width:94%}
.u{align-self:flex-end;background:#0a0f1c;border:1px solid #24304d}
.a{align-self:flex-start;background:rgba(129,140,248,.12);border:1px solid rgba(129,140,248,.3)}
.tag{font-size:10px;color:#8b9bb8;margin-bottom:4px}
.bar{display:flex;gap:8px}
input{flex:1;background:#121a2f;border:1px solid #24304d;border-radius:12px;color:#e8eefc;padding:14px 16px;font-size:16px;outline:none}
input:focus{border-color:#818cf8}
button{border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:14px;cursor:pointer;background:#22d3ee;color:#06202a;font-family:inherit}
button:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:8px 12px;font-size:12px;background:#121a2f;color:#c7d2fe;border:1px solid #24304d;font-weight:600}
.foot{font-size:11px;color:#64748b;text-align:center}
.proof{font-family:ui-monospace,monospace;font-size:11px;color:#a5b4fc}
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <strong>АКСИ</strong>
  <span id="msk">—</span>
</header>
<main>
  <div class="board">
    <div class="metric"><div class="k">H_eff</div><div class="v" id="mH">—</div><div class="s" id="mSt">ядро</div></div>
    <div class="metric"><div class="k">Гершгорин</div><div class="v" id="mG">—</div><div class="s" id="mGs">стабильность</div></div>
    <div class="metric"><div class="k">Proof</div><div class="v proof" id="mP">—</div><div class="s" id="mPs">SHA-256</div></div>
  </div>
  <div id="log"></div>
  <div class="chips">
    <button type="button" data-q="кто ты">кто ты</button>
    <button type="button" data-q="12*12">12×12</button>
    <button type="button" data-q="что такое энтропия">энтропия</button>
    <button type="button" data-q="матрица">матрица</button>
  </div>
  <div class="bar">
    <input id="in" type="text" placeholder="Спроси или посчитай…" autocomplete="off" enterkeyhint="send"/>
    <button type="button" id="send">→</button>
  </div>
  <div class="foot">aksilove@internet.ru · JS-ядро MATRIX в браузере</div>
</main>
<script>
(function(){
"use strict";

var Kernel = (function(){
  function utf8(s){
    try{return new TextEncoder().encode(String(s))}
    catch(e){var a=[];for(var i=0;i<s.length;i++)a.push(s.charCodeAt(i)&255);return new Uint8Array(a)}
  }
  function unitVec(bytes, dim){
    var v=new Float64Array(dim),i,n=0;
    if(!bytes.length){for(i=0;i<dim;i++)v[i]=1/Math.sqrt(dim);return v}
    for(i=0;i<bytes.length;i++)v[i%dim]+=(bytes[i]+1)/256;
    for(i=0;i<dim;i++)n+=v[i]*v[i];
    n=Math.sqrt(n)||1;
    for(i=0;i<dim;i++)v[i]/=n;
    return v;
  }
  function qbm(text){
    var dim=16, bytes=utf8(text), s=unitVec(bytes,dim);
    var W=new Float64Array(dim*dim), i,j,seed=42;
    function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return (seed/0x7fffffff)*0.3-0.15}
    for(i=0;i<dim;i++)for(j=i+1;j<dim;j++){var w=rnd();W[i*dim+j]=w;W[j*dim+i]=w}
    var E=0, bias;
    for(i=0;i<dim;i++){
      bias=-0.1+0.2*(i/(dim-1));
      E-=bias*s[i];
      for(j=0;j<dim;j++)E-=0.5*s[i]*W[i*dim+j]*s[j];
    }
    var modes=new Float64Array(dim), local;
    for(i=0;i<dim;i++){
      local=0;for(j=0;j<dim;j++)local+=W[i*dim+j]*s[j];
      modes[i]=E+0.25*local+0.05*i;
    }
    var T=1, beta=1/T, m=-1e300, Z=0, F, k;
    for(i=0;i<dim;i++){var x=-beta*modes[i];if(x>m)m=x}
    for(i=0;i<dim;i++)Z+=Math.exp(-beta*modes[i]-m);
    Z=Math.exp(m)*Z; if(!(Z>0))Z=1e-300;
    F=-T*Math.log(Z);
    var mean=0,varr=0;
    for(i=0;i<dim;i++)mean+=modes[i]; mean/=dim;
    for(i=0;i<dim;i++)varr+=(modes[i]-mean)*(modes[i]-mean);
    varr/=dim;
    var coherence=1/(1+varr);
    var meanRow=0,n1=0,n2=0,dot=0;
    for(i=0;i<dim;i++){
      var mr=0;for(j=0;j<dim;j++)mr+=W[i*dim+j]; mr/=dim;
      meanRow+=mr*mr; dot+=s[i]*mr; n1+=s[i]*s[i];
    }
    n1=Math.sqrt(n1); n2=Math.sqrt(meanRow)||1;
    var empathy=0.5*(1+(n1>1e-12?dot/(n1*n2):0));
    empathy=Math.max(0,Math.min(1,empathy));
    coherence=Math.max(0,Math.min(1,coherence));
    var gap=Math.abs(E-F);
    var H=0.65*coherence+0.35*empathy+0.15*Math.tanh(gap);
    H=Math.max(0,Math.min(1,H));
    var status=H>=0.55?"Awakened / Coherent":(H>=0.35?"Critical":"Disordered");
    return {E:E,F:F,Z:Z,H_eff:H,coherence:coherence,empathy:empathy,status:status};
  }
  function gersh(text){
    var n=4, bytes=utf8(text); if(!bytes.length)bytes=new Uint8Array([0]);
    var A=new Array(n),i,j;
    for(i=0;i<n;i++)A[i]=new Array(n);
    for(i=0;i<n;i++)for(j=0;j<n;j++){
      var b0=bytes[(i*n+j)%bytes.length], b1=bytes[(i*n+j+1)%bytes.length];
      A[i][j]={re:(b0/255)*2-1, im:(b1/255)*2-1};
      A[i][j].re*=0.8; A[i][j].im*=0.35;
    }
    for(i=0;i<n;i++)A[i][i].re+=1.2+0.05*i;
    var disks=[], maxR=2.5, maxC=3.0, okR=0, okC=0, sumR=0;
    for(i=0;i<n;i++){
      var c=A[i][i], rad=0;
      for(j=0;j<n;j++)if(j!==i)rad+=Math.hypot(A[i][j].re,A[i][j].im);
      var cab=Math.hypot(c.re,c.im);
      disks.push({re:c.re,im:c.im,r:rad});
      sumR+=rad;
      if(rad<=maxR)okR++; if(cab<=maxC)okC++;
    }
    var score=(0.6*(okR/n)+0.4*(okC/n))*(1/(1+0.1*(sumR/n)));
    score=Math.max(0,Math.min(1,score));
    var stable=score>=0.70 && disks.every(function(d){return d.r<=maxR*1.15});
    var msg=stable?("Stable "+(90+9*score).toFixed(1)+"%"):"Unstable";
    return {disks:disks,stable:stable,score:score,message:msg};
  }
  function proofSync(text,q,g){
    var blob=["AKSI-MATRIX-Q-v2", text, q.E.toFixed(8), q.F.toFixed(8), q.H_eff.toFixed(8),
      String(g.stable), g.score.toFixed(8), g.disks.map(function(d){return d.r.toFixed(4)}).join(",")].join("|");
    var h=2166136261>>>0;
    for(var i=0;i<blob.length;i++){h^=blob.charCodeAt(i);h=Math.imul(h,16777619)>>>0}
    var h2=h>>>0;
    for(i=0;i<blob.length;i++){h2^=(blob.charCodeAt(i)+i);h2=Math.imul(h2,2246822519)>>>0}
    var fp=(h>>>0).toString(16).padStart(8,"0").toUpperCase();
    var full=(h>>>0).toString(16).padStart(8,"0")+(h2>>>0).toString(16).padStart(8,"0");
    return {fingerprint:fp, digest:full, status:"✓ verified", blob:blob};
  }
  function run(text){
    var q=qbm(text), g=gersh(text), p=proofSync(text,q,g);
    return {qbm:q, gersh:g, proof:p};
  }
  return {run:run, qbm:qbm, gersh:gersh};
})();

var WK="aksi_w5", FK="aksi_f5";
var wiki={}, facts={}, busy=false;
try{wiki=JSON.parse(localStorage.getItem(WK)||"{}")||{}}catch(e){}
try{facts=JSON.parse(localStorage.getItem(FK)||"{}")||{}}catch(e){}

function $(id){return document.getElementById(id)}
function msk(){
  try{return new Date().toLocaleTimeString("ru-RU",{timeZone:"Europe/Moscow",hour:"2-digit",minute:"2-digit",hour12:false})+" МСК"}
  catch(e){return"—"}
}
setInterval(function(){var e=$("msk");if(e)e.textContent=msk()},1000);
$("msk").textContent=msk();

function saveW(){try{localStorage.setItem(WK,JSON.stringify(wiki))}catch(e){}}
function saveF(){try{localStorage.setItem(FK,JSON.stringify(facts))}catch(e){}}
function norm(s){return String(s||"").toLowerCase().replace(/[«»"'`?!.,;:()]/g," ").replace(/\s+/g," ").trim()}
function toks(s){
  return norm(s).split(" ").filter(function(w){
    return w.length>2&&!/^(что|это|как|для|или|про|есть|быть|какой|какие|почему|когда|где|who|what|how|расскажи|объясни|the|and)$/.test(w);
  });
}
function slug(s){return toks(s).slice(0,5).join("-")||("n"+Date.now())}
function fmt(x){if(!isFinite(x))return"—";if(Math.abs(x-Math.round(x))<1e-10)return String(Math.round(x));return String(parseFloat(x.toFixed(8)))}

function paintKernel(text){
  var r=Kernel.run(text||"АКСИ");
  $("mH").textContent=r.qbm.H_eff.toFixed(3);
  $("mSt").textContent=r.qbm.status;
  $("mG").textContent=r.gersh.stable?"OK":"·";
  $("mGs").textContent=r.gersh.message;
  $("mP").textContent=r.proof.fingerprint;
  $("mPs").textContent=r.proof.status;
  return r;
}

function evalExpr(s){
  s=String(s).toLowerCase().replace(/,/g,".").replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
  s=s.replace(/π/g,"Math.PI").replace(/\bpi\b/g,"Math.PI");
  s=s.replace(/корень(?:\s*из)?\s*\(?\s*([\d.]+)\s*\)?/g,"Math.sqrt($1)");
  s=s.replace(/√\s*\(?\s*([\d.]+)\s*\)?/g,"Math.sqrt($1)");
  s=s.replace(/\^/g,"**");
  s=s.replace(/[^0-9+\-*/().\sMathsqrtPI]/g,"");
  if(!s.trim())return null;
  try{var v=Function('"use strict";return ('+s+")")();return typeof v==="number"&&isFinite(v)?v:null}catch(e){return null}
}
function solveEq(raw){
  var s=String(raw).toLowerCase().replace(/,/g,".").replace(/\s/g,"").replace(/х/g,"x").replace(/\*/g,"");
  if(s.indexOf("=")<0)return null;
  var L=s.split("=")[0],R=s.split("=")[1],rN=parseFloat(R);
  if(!isFinite(rN)||/[x]/.test(R))return null;
  var a=0,b=0,c=0,e=L,m;
  m=e.match(/([+-]?\d*\.?\d*)x\^2/);
  if(m){a=(m[1]===""||m[1]==="+")?1:(m[1]==="-"?-1:parseFloat(m[1]));e=e.replace(m[0],"")}
  m=e.match(/([+-]?\d*\.?\d*)x/);
  if(m){b=(m[1]===""||m[1]==="+")?1:(m[1]==="-"?-1:parseFloat(m[1]));e=e.replace(m[0],"")}
  e.replace(/([+-]?\d+\.?\d*)/g,function(n){c+=parseFloat(n);return""});c-=rN;
  if(Math.abs(a)<1e-12){if(Math.abs(b)<1e-12)return"Нет решения";return"x = "+fmt(-c/b)}
  var d=b*b-4*a*c;if(d<-1e-12)return"Нет действительных корней";
  if(Math.abs(d)<1e-12)return"x = "+fmt(-b/(2*a));
  var s2=Math.sqrt(d);return"x = "+fmt((-b+s2)/(2*a))+", "+fmt((-b-s2)/(2*a));
}
function mathA(q){
  var raw=String(q).trim(),low=raw.toLowerCase();
  var pm=low.match(/(\d+(?:[.,]\d+)?)\s*%\s*(?:от)?\s*(\d+(?:[.,]\d+)?)/);
  if(pm)return pm[1]+"% от "+pm[2]+" = "+fmt((+pm[1].replace(",","."))/100*(+pm[2].replace(",",".")));
  var fm=low.match(/(\d+)\s*!/);
  if(fm){var n=+fm[1],f=1,i;if(n>20)return"n! велико";for(i=2;i<=n;i++)f*=i;return n+"! = "+f}
  if(/=/.test(raw)&&/[xх]/i.test(raw)){var eq=solveEq(raw);if(eq)return eq}
  var expr=raw.replace(/^посчитай\s*/i,"").replace(/^вычисли\s*/i,"");
  if(!/=/.test(expr)||!/[xх]/i.test(expr)){var v=evalExpr(expr);if(v!=null)return fmt(v)}
  return null;
}
function teach(q){
  var m=String(q).match(/^(?:запомни|remember)\s*[:\-]?\s*(.+)$/i);
  if(!m)return null;
  var body=m[1].trim(),kv=body.match(/^([^=:]+)[=:]\s*(.+)$/);
  if(kv){var k=kv[1].trim().toLowerCase(),v=kv[2].trim();facts[k]=v;saveF();wWrite(k,v);return"Запомнила: "+k+" = "+v}
  facts["n"+Date.now()]=body;saveF();return"Записала";
}
function recall(q){
  var low=q.toLowerCase();
  if(/что\s+помнишь|память|факты/.test(low)){
    var ks=Object.keys(facts);if(!ks.length)return"Память пуста. Напиши: запомни: ключ = значение";
    return ks.map(function(k){return"• "+k+" = "+facts[k]}).join("\n");
  }
  for(var k in facts)if(Object.prototype.hasOwnProperty.call(facts,k)&&low.indexOf(k)>=0)return facts[k];
  return null;
}
function wWrite(title,body){
  var id=slug(title);
  wiki[id]={t:String(title).slice(0,100),b:String(body).slice(0,1100),h:(wiki[id]&&wiki[id].h)||0};
  saveW();
}
function wFind(q){
  var t=toks(q);if(!t.length)return null;
  var best=null,sc=0,id;
  for(id in wiki){
    var p=wiki[id],hay=norm(p.t+" "+p.b),s=0,i;
    for(i=0;i<t.length;i++){if(hay.indexOf(t[i])>=0)s++;if(norm(p.t).indexOf(t[i])>=0)s+=2}
    if(s>sc){sc=s;best=p}
  }
  if(best&&sc>=Math.min(2,t.length)){best.h=(best.h||0)+1;saveW();return best}
  return null;
}
function topic(q){
  return String(q).trim().replace(/^(что\s+такое|кто\s+такой|кто\s+такая|расскажи\s+про|объясни|what\s+is)\s+/i,"").replace(/[?!.]+$/,"").trim().slice(0,70);
}
function wikiGet(lang,title){
  return fetch("https://"+lang+".wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title),{headers:{Accept:"application/json"}})
    .then(function(r){if(!r.ok)throw new Error(String(r.status));return r.json()})
    .then(function(j){
      if(!j||j.type==="disambiguation")throw new Error("d");
      var e=(j.extract||"").trim();if(e.length<40)throw new Error("s");
      return{title:j.title||title,extract:e.slice(0,900),url:j.content_urls&&j.content_urls.desktop&&j.content_urls.desktop.page};
    });
}
function fact(q){
  var t=topic(q);if(t.length<2)return Promise.reject(new Error("t"));
  return wikiGet("ru",t).catch(function(){return wikiGet("en",t)});
}
function core(q){
  var low=q.toLowerCase();
  if(/кто ты|что ты|представься/.test(low))
    return"Я АКСИ. Считаю, помню, ищу факты. Сверху — живое MATRIX-ядро (H_eff, Гершгорин, Proof) на JavaScript.\naksilove@internet.ru";
  if(/привет|здравств|hello/.test(low))return"Привет. Спроси что угодно.";
  if(/время|мск/.test(low))return msk();
  if(/матриц|kernel|ядро|h_eff|гершгорин|proof/.test(low)){
    var r=paintKernel(q);
    return"MATRIX JS-ядро\nH_eff = "+r.qbm.H_eff.toFixed(4)+" · "+r.qbm.status+
      "\nE = "+r.qbm.E.toFixed(4)+"  F = "+r.qbm.F.toFixed(4)+
      "\n"+r.gersh.message+
      "\nProof "+r.proof.fingerprint+" "+r.proof.status+
      "\n(Python/Qiskit — для сервера и реального QPU)";
  }
  if(/помощ|умеешь|help/.test(low))return"• 12*12\n• что такое …\n• матрица — отчёт ядра\n• запомни: ключ = значение";
  return null;
}

function add(role,text,src){
  var box=$("log"),d=document.createElement("div");
  d.className="msg "+(role==="u"?"u":"a");
  if(src){var t=document.createElement("div");t.className="tag";t.textContent=src;d.appendChild(t)}
  d.appendChild(document.createTextNode(text));
  box.appendChild(d);box.scrollTop=box.scrollHeight;
}

function send(){
  if(busy)return;
  var inp=$("in"),q=(inp.value||"").trim();if(!q)return;
  inp.value="";add("u",q);
  paintKernel(q);

  var a=teach(q);if(a){add("a",a,"память");return}
  a=mathA(q);if(a){add("a",a,"расчёт");return}
  a=core(q);if(a){add("a",a,"");return}
  a=recall(q);if(a){add("a",a,"память");return}

  var p=wFind(q);
  if(p&&p.b&&p.b.length>60){add("a",p.b,"память знаний");return}

  busy=true;$("send").disabled=true;add("a","…","поиск");
  fact(q).then(function(f){
    busy=false;$("send").disabled=false;
    var log=$("log");if(log.lastChild)log.removeChild(log.lastChild);
    var text=f.extract+(f.url?"\n\n"+f.url:"");
    wWrite(f.title,f.extract);
    add("a",text,"факт");
  }).catch(function(){
    busy=false;$("send").disabled=false;
    var log=$("log");if(log.lastChild)log.removeChild(log.lastChild);
    if(p){add("a",p.b,"память знаний");return}
    add("a","Не нашла. Попробуй «что такое …», 2+2 или «матрица».","подсказка");
  });
}

$("send").onclick=send;
$("in").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();send()}});
[].forEach.call(document.querySelectorAll("[data-q]"),function(b){
  b.onclick=function(){$("in").value=b.getAttribute("data-q")||"";send()};
});

paintKernel("АКСИ");
add("a","Спроси что угодно.\nСчитаю · помню · факты · MATRIX-ядро на JS.","");
})();
</script>
</body>
</html>
