<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>АКСИ</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0f172a;color:#f1f5f9;font-family:system-ui,-apple-system,sans-serif}
body{display:flex;flex-direction:column;max-width:720px;margin:0 auto}
#boot{position:fixed;inset:0;z-index:99;background:#0f172a;display:flex;align-items:center;justify-content:center;flex-direction:column}
#boot h1{font-size:1.4rem;margin-bottom:8px}
#boot p{color:#94a3b8;font-size:13px}
header{padding:max(10px,env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center}
h1{font-size:1rem;font-weight:800}
#status{font-size:11px;color:#94a3b8}
.bar{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid #334155}
.bar button,.bar label{border:1px solid #334155;background:#1e293b;color:#f1f5f9;border-radius:10px;padding:10px 12px;font-size:12px;font-weight:700;white-space:nowrap}
#thread{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.msg{margin:0 0 10px;max-width:92%}
.msg.u{margin-left:auto}
.b{padding:12px 14px;border-radius:14px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.msg.u .b{background:#7c3aed;color:#fff}
.msg.a .b{background:#1e293b;border:1px solid #334155}
.meta{font-size:10px;color:#94a3b8;margin-top:4px}
.composer{display:flex;gap:8px;padding:8px 10px max(12px,env(safe-area-inset-bottom));border-top:1px solid #334155;background:#111827}
#inp{flex:1;min-height:44px;border-radius:12px;border:1px solid #334155;background:#1e293b;color:#f1f5f9;padding:10px;font-size:16px}
#send{width:48px;border:0;border-radius:12px;background:#7c3aed;color:#fff;font-weight:800;font-size:18px}
#file{display:none}
#side{display:none;padding:8px;border-top:1px solid #334155;max-height:28vh;overflow:auto;background:#0b1220;font-size:12px}
#side.on{display:block}
.step{padding:8px;margin-bottom:6px;border:1px solid #334155;border-radius:8px;background:#1e293b}
.step b{color:#22d3ee;display:block;font-size:10px;margin-bottom:2px}
</style>
</head>
<body>
<div id="boot"><h1>АКСИ</h1><p>Секунду…</p></div>
<script>
setTimeout(function(){var b=document.getElementById("boot");if(b)b.style.display="none";},250);
</script>
<header>
  <h1>АКСИ</h1>
  <div id="status">…</div>
</header>
<div class="bar">
  <button type="button" id="btnArch">Схема</button>
  <label for="file">Файл</label>
  <input type="file" id="file" accept=".txt,.md,text/plain" multiple>
  <button type="button" id="btnThink">Мысли</button>
  <button type="button" id="btnClear">Очистить</button>
</div>
<div id="thread"></div>
<div id="side"></div>
<div class="composer">
  <input id="inp" type="text" placeholder="Спросите АКСИ…" enterkeyhint="send" autocomplete="off">
  <button type="button" id="send">➤</button>
</div>
<script>
(function(){
  var DID="did:aksi:ed25519:sovereign-2026";
  var rag=[], busy=false;
  var O=[
    {t:"АКСИ — local-first ИИ: ответы на устройстве.",k:"акси aksi контур проект суверен"},
    {t:"DID: did:aksi:ed25519:sovereign-2026. Контакт aksilove@internet.ru.",k:"did идентич контакт email"},
    {t:"MATRIX — быстрый чат в браузере, без тяжёлой модели на телефоне.",k:"matrix модель быстр"},
    {t:"Омега: FastAPI + Ollama на своём сервере.",k:"омега omega fastapi ollama сервер"},
    {t:"Сеть /app: агенты и лента.",k:"сеть агент лента"},
    {t:"RAG: загрузите .txt — ответы по файлу.",k:"rag файл документ"},
    {t:"Без данных в контексте — честный отказ.",k:"отказ политик"}
  ];
  function $(id){return document.getElementById(id)}
  function hideBoot(){var b=$("boot");if(b)b.style.display="none"}
  function status(t){var s=$("status");if(s)s.textContent=t}
  function add(role,text,meta){
    var w=document.createElement("div");
    w.className="msg "+(role==="user"?"u":"a");
    var b=document.createElement("div");b.className="b";b.textContent=text;w.appendChild(b);
    if(meta){var m=document.createElement("div");m.className="meta";m.textContent=meta;w.appendChild(m)}
    $("thread").appendChild(w);$("thread").scrollTop=1e9;
  }
  function steps(list){
    var s=$("side");if(!s)return;
    s.innerHTML=(list||[]).map(function(x,i){return '<div class="step"><b>'+(i+1)+'. '+x.t+'</b>'+(x.d||'')+'</div>'}).join("");
  }
  function score(q,text,keys){
    var low=q.toLowerCase(), n=0, parts=low.split(/\s+/);
    for(var i=0;i<parts.length;i++){if(parts[i]&&text.toLowerCase().indexOf(parts[i])>=0)n++}
    (keys||"").split(/\s+/).forEach(function(k){if(k&&low.indexOf(k)>=0)n+=2});
    return n;
  }
  function retrieve(q){
    var hits=[];
    O.forEach(function(row){var s=score(q,row.t,row.k);if(s>0)hits.push({text:row.t,score:s})});
    rag.forEach(function(r){var s=score(q,r.text,"");if(s>0)hits.push({text:r.text,score:s})});
    hits.sort(function(a,b){return b.score-a.score});
    return hits.slice(0,5);
  }
  function reply(q,hits){
    var low=q.toLowerCase();
    if(/привет|здравств|добрый|hello/.test(low)) return "Здравствуйте. АКСИ на связи.\n\nСпросите «кто ты» или «покажи схему».";
    if(/кто ты|что ты|представь/.test(low)) return "Я АКСИ — локальный ассистент на этой странице.\n\nDID: "+DID+"\n\nОтвечаю сразу, без облака.";
    if(/схем|архитектур|покажи схему/.test(low)) return "Схема:\nВы → поиск знаний → ответ → экран\n\nВсё на телефоне. DID: "+DID;
    if(/помощ|умеешь|команд/.test(low)) return "• вопрос про АКСИ\n• покажи схему\n• кнопка Файл — загрузить .txt\n\naksilove@internet.ru";
    if(/uuid/.test(low)) return "UUID: "+("xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){var r=Math.random()*16|0;return(c==="x"?r:(r&0x3|0x8)).toString(16)}));
    if(/который час|сколько времени/.test(low)) return "Сейчас: "+new Date().toLocaleString();
    var m=low.match(/(?:посчитай|вычисли)\s+([0-9+\-*/().\s]+)/);
    if(m){try{var v=Function("return("+m[1].replace(/[^0-9+\-*/().\s]/g,"")+")")();if(typeof v==="number"&&isFinite(v))return "Результат: "+v}catch(e){}}
    if(hits.length&&hits[0].score>=2) return "По знаниям:\n\n"+hits.slice(0,4).map(function(h,i){return (i+1)+". "+h.text}).join("\n");
    return "Мало данных. Попробуйте: кто ты · схема · или загрузите файл.\n"+DID;
  }
  function send(){
    if(busy)return;
    var inp=$("inp"), q=(inp.value||"").trim();
    if(!q)return;
    inp.value="";busy=true;
    add("user",q);
    var t0=Date.now();
    var st=[];
    st.push({t:"Приём",d:q.slice(0,80)});
    var hits=retrieve(q);
    st.push({t:"Поиск",d:hits.length?"найдено "+hits.length:"пусто"});
    var text=reply(q,hits);
    st.push({t:"Ответ",d:"готово"});
    steps(st);
    var ms=Date.now()-t0;
    add("assistant",text,ms+" ms");
    status(ms+" ms");
    busy=false;
  }
  $("send").onclick=send;
  $("inp").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();send()}};
  $("btnArch").onclick=function(){$("inp").value="покажи схему";send()};
  $("btnThink").onclick=function(){$("side").classList.toggle("on")};
  $("btnClear").onclick=function(){$("thread").innerHTML="";$("side").innerHTML="";add("assistant","Очищено.")};
  $("file").onchange=function(e){
    var files=e.target.files;if(!files)return;
    Array.prototype.forEach.call(files,function(f){
      var r=new FileReader();
      r.onload=function(){
        var t=String(r.result||"");
        for(var i=0;i<t.length;i+=400){var c=t.slice(i,i+400);if(c.trim().length>15)rag.push({text:c,source:f.name})}
        add("assistant","Файл загружен. Фрагментов: "+rag.length);
      };
      r.readAsText(f);
    });
    e.target.value="";
  };
  add("assistant","АКСИ готов. Пишите вопрос — ответ сразу.\n\nПримеры: кто ты · покажи схему");
  status("готово");
  hideBoot();
})();
</script>
</body>
</html>
