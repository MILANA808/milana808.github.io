<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АКСИ</title>
<meta name="theme-color" content="#05010f">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#030712;--ink:#f8fafc;--muted:#94a3b8;--line:rgba(148,163,184,.15)}
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;color:var(--ink);font-family:system-ui,sans-serif;background:#030712}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(168,85,247,.35),transparent 50%),#030712;z-index:0}
.wrap{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:36px 18px 100px}
.logo{font-size:11px;letter-spacing:.4em;font-weight:600;color:var(--muted);margin-bottom:24px}
h1{font-size:clamp(1.9rem,6.5vw,2.5rem);font-weight:650;letter-spacing:-.04em;line-height:1.05;margin-bottom:12px}
.lead{font-size:14px;line-height:1.55;color:var(--muted);margin-bottom:22px}
.hero{display:block;padding:20px;border-radius:18px;text-decoration:none;color:#fff;background:linear-gradient(135deg,#7c3aed,#4f46e5 50%,#0ea5e9);margin-bottom:10px;box-shadow:0 12px 40px rgba(124,58,237,.3)}
.hero strong{display:block;font-size:1.1rem;margin-bottom:4px}
.hero span{font-size:13px;opacity:.9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:block;padding:14px;border-radius:14px;text-decoration:none;color:var(--ink);background:rgba(15,23,42,.75);border:1px solid var(--line);min-height:80px}
.card strong{display:block;font-size:13px;margin-bottom:3px}
.card span{font-size:11px;color:var(--muted)}
foot{margin-top:24px;font-size:11px;color:#64748b}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <div class="logo">АКСИ</div>
  <h1>Свой интернет<br>для своего ИИ</h1>
  <p class="lead">AKSI Net — личная сеть знаний агента. Плюс чат, путь, космос и паспорт.</p>
  <a class="hero" href="/net/"><strong>◈ Открыть AKSI Net</strong><span>Узлы · поиск · ваши страницы</span></a>
  <nav class="grid">
    <a class="card" href="/aksi/"><strong>Чат</strong><span>ИИ АКСИ</span></a>
    <a class="card" href="/drive/"><strong>Навигатор</strong><span>FOLLOW · маршрут</span></a>
    <a class="card" href="/solar/"><strong>Космос</strong><span>Планеты сейчас</span></a>
    <a class="card" href="/citizen/"><strong>Паспорт</strong><span>DID</span></a>
    <a class="card" href="/manifest/"><strong>Манифест</strong><span>Право</span></a>
    <a class="card" href="/lab/"><strong>Квант</strong><span>Кубиты</span></a>
  </nav>
  <foot>aksilove@internet.ru</foot>
</div>
<script src="/nav.js"></script>
</body>
</html>
