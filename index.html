<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<meta name="description" content="АКСИ — простой помощник">
<title>АКСИ</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--line:#e2e8f0;--ink:#0f172a;--muted:#64748b;--acc:#6d28d9;--soft:#eef2ff}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);max-width:720px;margin:0 auto;padding:0 14px 80px}
header{padding:max(14px,env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;display:grid;place-items:center;font-weight:900}
h1{font-size:1.2rem;font-weight:800}
.sub{font-size:12px;color:var(--muted)}
#status{margin-left:auto;font-size:11px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h2{font-size:1rem;margin-bottom:6px}
.muted{color:var(--muted);font-size:13px;line-height:1.45}
.row{display:flex;gap:8px;margin-top:8px}
.field{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:15px;min-width:0}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:700;font-size:13px;cursor:pointer}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer}
#thread{min-height:70px;max-height:36vh;overflow:auto;margin-top:8px}
.msg{margin:0 0 8px;max-width:92%}
.msg.u{margin-left:auto}
.b{padding:10px 12px;border-radius:14px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.msg.u .b{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff}
.msg.a .b{background:#fff;border:1px solid var(--line)}
.meta{font-size:11px;color:var(--muted);margin-top:2px}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:720px;margin:0 auto;display:flex;gap:8px;padding:10px 14px max(12px,env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--line)}
#inp{flex:1;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:16px}
#send{width:46px;border:0;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;font-weight:800;cursor:pointer}
.probs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.probs div{text-align:center;padding:8px 4px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-size:11px}
.probs b{display:block;font-size:14px;color:#2563eb}
.fact{display:flex;gap:8px;padding:8px;border:1px solid var(--line);border-radius:10px;margin-top:6px;background:var(--soft);font-size:14px}
.fact button{border:0;background:0;cursor:pointer;color:var(--muted)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all;background:#f8fafc;padding:8px;border-radius:8px;border:1px solid var(--line)}
#prog{display:none;font-size:12px;color:#2563eb;padding:4px 0}
#prog.on{display:block}
footer{text-align:center;font-size:11px;color:var(--muted);padding:12px 0 20px}
.links a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);margin-top:6px;font-weight:600;font-size:14px;background:#fff}
.links a span{display:block;font-weight:400;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div class="logo">А</div>
  <div><h1>АКСИ</h1><div class="sub">справа — меню сайта</div></div>
  <span id="status">…</span>
</header>
<div id="prog"></div>

<section id="chat" class="card">
  <h2>Чат</h2>
  <p class="muted">Пишите внизу. Меню справа ведёт по разделам и страницам.</p>
  <div class="chips">
    <button type="button" data-q="кто ты">Кто ты?</button>
    <button type="button" data-q="что умеешь">Что умеешь?</button>
    <button type="button" data-q="найди искусственный интеллект">Найти ИИ</button>
    <button type="button" data-q="покажи запутанность">Квант</button>
  </div>
  <div id="thread"></div>
</section>

<section id="search" class="card">
  <h2>Поиск</h2>
  <div class="row"><input class="field" id="sIn" placeholder="Что найти?"><button class="btn p" type="button" id="sBtn">Найти</button></div>
  <div id="sOut" class="muted" style="margin-top:8px;white-space:pre-wrap;max-height:140px;overflow:auto"></div>
</section>

<section id="notes" class="card">
  <h2>Заметки</h2>
  <p class="muted">Или в чате: запомни: текст</p>
  <div class="row"><input class="field" id="nIn" placeholder="Заметка"><button class="btn p" type="button" id="nBtn">+</button></div>
  <div id="nList"></div>
</section>

<section id="quantum" class="card">
  <h2>Квант</h2>
  <div class="chips">
    <button type="button" class="btn p" id="qBell">Запутанность</button>
    <button type="button" class="btn" id="qSuper">Суперпозиция</button>
  </div>
  <p class="muted" id="qText" style="margin-top:8px">—</p>
  <div class="probs" id="qProbs"></div>
</section>

<section id="tools" class="card">
  <h2>Счёт</h2>
  <div class="row"><input class="field" id="mIn" placeholder="25*4"><button class="btn p" type="button" id="mBtn">=</button></div>
  <div id="mOut" class="muted" style="margin-top:6px"></div>
</section>

<section id="files" class="card">
  <h2>Файлы</h2>
  <input type="file" id="fIn" accept=".txt,.md,text/plain" multiple>
  <div id="fOut" class="muted" style="margin-top:6px"></div>
</section>

<section id="voice" class="card">
  <h2>Голос</h2>
  <button type="button" class="btn p" id="vBtn">Сказать</button>
</section>

<section id="id" class="card">
  <h2>DID</h2>
  <div class="mono" id="didFull">—</div>
  <div class="row" style="margin-top:8px"><input class="field" id="didName" placeholder="Имя агента"><button class="btn p" type="button" id="didGen">Создать</button></div>
  <div id="didUser"></div>
</section>

<section id="apps" class="card links">
  <h2>Страницы сайта</h2>
  <a href="/matrix/">MATRIX <span>симулятор</span></a>
  <a href="/lab/">Lab <span>опыты</span></a>
  <a href="/globe/">Глобус</a>
  <a href="/hub/">Хаб</a>
  <a href="/about/">О проекте</a>
</section>

<footer>aksilove@internet.ru · меню справа на всех страницах</footer>
<div class="composer">
  <input id="inp" type="text" placeholder="Спросите…" enterkeyhint="send" autocomplete="off">
  <button type="button" id="send">➤</button>
</div>
<script src="/nav.js"></script>
<script>
(function(){
"use strict";
var DB="aksi_simple_v2",facts=[],learned=[],rag=[],busy=false;
var CORE=[
  {t:"АКСИ — простой помощник. Меню справа открывает модули и страницы сайта.",k:"акси кто меню"},
  {t:"Команды: найди … · запомни: … · посчитай … · покажи запутанность",k:"запомни поиск посчитай"},
  {t:"Не знаю — говорю прямо, без выдумок.",k:"не знаю правда"},
  {t:"Контакт: aksilove@internet.ru",k:"контакт"}
];
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,"&").replace(/</g,"<")}
function status(t){$("status").textContent=t}
function prog(t){var p=$("prog");if(!t){p.className="";p.textContent="";return}p.className="on";p.textContent=t}
function openDB(){return new Promise(function(res,rej){try{var r=indexedDB.open(DB,1);r.onupgradeneeded=function(){var d=r.result;["msgs","facts","learned","rag"].forEach(function(n){if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:"id",autoIncrement:true})})};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}})}
function idbAdd(s,v){return openDB().then(function(db){return new Promise(function(res,rej){var tx=db.transaction(s,"readwrite");tx.objectStore(s).add(v);tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)}})})}
function idbAll(s){return openDB().then(function(db){return new Promise(function(res,rej){var q=db.transaction(s,"readonly").objectStore(s).getAll();q.onsuccess=function(){res(q.result||[])};q.onerror=function(){rej(q.error)}})})}
function idbClear(s){return openDB().then(function(db){return new Promise(function(res,rej){var tx=db.transaction(s,"readwrite");tx.objectStore(s).clear();tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)}})})}
function score(q,t,k){var low=q.toLowerCase(),n=0,x=(t||"").toLowerCase();low.split(/\s+/).forEach(function(p){if(p.length>1&&x.indexOf(p)>=0)n++});(k||"").split(/\s+/).forEach(function(w){if(w&&low.indexOf(w)>=0)n+=2});return n}
function retrieve(q){var h=[];CORE.forEach(function(c){var s=score(q,c.t,c.k);if(s>0)h.push({text:c.t,s:s,src:"система"})});facts.forEach(function(f){var s=score(q,f.text,"");if(s>0)h.push({text:f.text,s:s,src:"заметка"})});learned.forEach(function(l){var s=score(q,l.q,"");if(s>=3)h.push({text:l.a,s:s+2,src:"опыт"})});rag.forEach(function(r){var s=score(q,r.text,"");if(s>0)h.push({text:r.text,s:s,src:"файл"})});h.sort(function(a,b){return b.s-a.s});return h.slice(0,5)}
function renderNotes(){var box=$("nList");if(!facts.length){box.innerHTML="<p class='muted'>Пусто</p>";return}box.innerHTML=facts.slice().reverse().map(function(f,i){var idx=facts.length-1-i;return "<div class='fact'><span style='flex:1'>"+esc(f.text)+"</span><button type='button' data-i='"+idx+"'>×</button></div>"}).join("");box.querySelectorAll("[data-i]").forEach(function(b){b.onclick=function(){facts.splice(+b.getAttribute("data-i"),1);idbClear("facts").then(function(){return Promise.all(facts.map(function(f){return idbAdd("facts",f)}))}).then(renderNotes)}})}
function saveFact(t){t=(t||"").trim();if(t.length<2)return;var item={text:t,ts:Date.now()};facts.push(item);idbAdd("facts",item).catch(function(){});renderNotes()}
function bubble(role,text,src){var w=document.createElement("div");w.className="msg "+(role==="user"?"u":"a");var b=document.createElement("div");b.className="b";b.textContent=text;w.appendChild(b);if(role==="assistant"&&src){var m=document.createElement("div");m.className="meta";m.textContent=src;w.appendChild(m)}$("thread").appendChild(w);$("thread").scrollTop=1e9}
function say(t,s){bubble("assistant",t,s||"система");idbAdd("msgs",{role:"assistant",content:t,ts:Date.now()}).catch(function(){})}
function ask(q){bubble("user",q);idbAdd("msgs",{role:"user",content:q,ts:Date.now()}).catch(function(){})}
function goChat(){try{$("chat").scrollIntoView({behavior:"smooth"})}catch(e){}}
function safeMath(e){e=String(e).trim();if(!/^(Math\.|[\d\s+\-*/%().,eE^])+$/.test(e))throw new Error("только числа");e=e.replace(/\^/g,"**");var v=(new Function("Math","return ("+e+")"))(Math);if(typeof v!=="number"||!isFinite(v))throw new Error("ошибка");return v}
function ket0(){return [[1,0],[0,0],[0,0],[0,0]]}
function H0(s){var a=1/Math.SQRT2;return [[a*(s[0][0]+s[2][0]),a*(s[0][1]+s[2][1])],[a*(s[1][0]+s[3][0]),a*(s[1][1]+s[3][1])],[a*(s[0][0]-s[2][0]),a*(s[0][1]-s[2][1])],[a*(s[1][0]-s[3][0]),a*(s[1][1]-s[3][1])]]}
function CNOT(s){var o=s.map(function(x){return[x[0],x[1]]});var t=o[2];o[2]=o[3];o[3]=t;return o}
function probs(s){return s.map(function(a){return a[0]*a[0]+a[1]*a[1]})}
function showQ(s,text,toChat){var p=probs(s),L=["00","01","10","11"];$("qText").textContent=text;$("qProbs").innerHTML=L.map(function(l,i){return"<div><b>"+(p[i]*100).toFixed(0)+"%</b>|"+l+"⟩</div>"}).join("");if(toChat){goChat();say(text+"\n"+L.map(function(l,i){return"|"+l+"⟩ "+(p[i]*100).toFixed(0)+"%"}).join(" · "),"квант")}}
function wiki(q){return fetch("https://ru.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(q.trim().replace(/\s+/g,"_"))).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){return{title:j.title,t:j.extract||"",url:(j.content_urls&&j.content_urls.desktop&&j.content_urls.desktop.page)||"",s:"Википедия"}})}
function ddg(q){return fetch("https://api.duckduckgo.com/?q="+encodeURIComponent(q)+"&format=json&no_redirect=1&no_html=1").then(function(r){return r.json()}).then(function(j){return{title:j.Heading||q,t:j.AbstractText||j.Answer||"",url:j.AbstractURL||"",s:"DuckDuckGo"}})}
function doSearch(q){prog("Ищу…");$("sOut").textContent="…";return Promise.all([wiki(q).catch(function(){return null}),ddg(q).catch(function(){return null})]).then(function(arr){var lines=[],ok=false,brief=[];arr.forEach(function(x){if(!x||(!x.t&&!x.title))return;ok=true;lines.push(x.s+(x.title?": "+x.title:""));if(x.t){lines.push(x.t.slice(0,600));brief.push(x.t.slice(0,200))}if(x.url)lines.push(x.url);lines.push("")});var out=ok?lines.join("\n"):"Нет данных";$("sOut").textContent=out;prog("");goChat();say(ok?("Поиск «"+q+"»:\n\n"+brief.join("\n\n")):out,ok?"поиск":"не знаю")})}
function answer(q){var low=q.toLowerCase(),m;if((m=q.match(/^(?:запомни|запомнить)\s*[:\-–]?\s*(.+)$/i))){saveFact(m[1]);return{t:"Записала:\n«"+m[1]+"»",s:"заметка"}}if((m=q.match(/^(?:найди|поиск:)\s*(.+)$/i))){$("sIn").value=m[1];return{t:null,s:"search",q:m[1]}}if(/запутан|bell/i.test(low)){var st=CNOT(H0(ket0()));showQ(st,"Запутанность: измерения совпадают.",false);var p=probs(st);return{t:"|00⟩ "+(p[0]*100).toFixed(0)+"% · |11⟩ "+(p[3]*100).toFixed(0)+"%",s:"квант"}}if(/суперпозиц/i.test(low)){showQ(H0(ket0()),"Суперпозиция.",false);return{t:"≈50/50",s:"квант"}}if((m=q.match(/^(?:посчитай|\/мат)\s*(.+)$/i))){try{return{t:"= "+safeMath(m[1]),s:"счёт"}}catch(e){return{t:e.message,s:"ошибка"}}}if(/привет|здравств/.test(low))return{t:"Здравствуйте. Меню справа — по сайту. Поле внизу — чат.",s:"система"}if(/кто ты|что ты/.test(low))return{t:"Я АКСИ. Простой локальный помощник на этой странице.",s:"система"}if(/что умеешь|помощь/.test(low))return{t:"Чат, поиск, заметки, квант, счёт, файлы, голос, DID.\nМеню справа на всех страницах.",s:"система"}var h=retrieve(q);if(h.length&&h[0].s>=2)return{t:h.map(function(x,i){return(i+1)+". "+x.text}).join("\n\n"),s:h[0].src};return{t:"Не знаю.\n«найди …» или «запомни: …».",s:"не знаю"}}
function send(q0){if(busy)return;var q=(q0||$("inp").value||"").trim();if(!q)return;$("inp").value="";busy=true;goChat();ask(q);var pack=answer(q);if(pack.s==="search"){prog("Ищу…");doSearch(pack.q).then(function(){busy=false;status("готово");prog("")});return}say(pack.t,pack.s);if(pack.s!=="не знаю"&&pack.s!=="заметка"&&q.length>3&&pack.t&&pack.t.length>18){var item={q:q.slice(0,160),a:pack.t.slice(0,320),ts:Date.now()};if(!learned.some(function(l){return l.q===item.q})){learned.push(item);idbAdd("learned",item).catch(function(){})}}busy=false;status("готово")}
document.querySelectorAll("[data-q]").forEach(function(b){b.onclick=function(){send(b.getAttribute("data-q"))}});
$("send").onclick=function(){send()};$("inp").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();send()}};
$("sBtn").onclick=function(){var q=$("sIn").value.trim();if(!q)return;ask("найди "+q);doSearch(q)};
$("sIn").onkeydown=function(e){if(e.key==="Enter")$("sBtn").click()};
$("nBtn").onclick=function(){var t=$("nIn").value;if(!t.trim())return;$("nIn").value="";saveFact(t);goChat();say("Заметка:\n«"+t.trim()+"»","заметка")};
$("mBtn").onclick=function(){try{var v=safeMath($("mIn").value);$("mOut").textContent="= "+v;goChat();say("Счёт: "+$("mIn").value+" = "+v,"счёт")}catch(e){$("mOut").textContent=e.message}};
$("qBell").onclick=function(){showQ(CNOT(H0(ket0())),"Если один 0 — второй 0; если 1 — оба 1.",true)};
$("qSuper").onclick=function(){showQ(H0(ket0()),"Суперпозиция ≈ 50/50.",true)};
$("fIn").onchange=function(e){var files=e.target.files,left=files.length;if(!left)return;Array.prototype.forEach.call(files,function(f){var r=new FileReader();r.onload=function(){var t=String(r.result||"");for(var i=0;i<t.length;i+=450){var c=t.slice(i,i+450);if(c.trim().length<15)continue;var item={text:c,ts:Date.now()};rag.push(item);idbAdd("rag",item).catch(function(){})}left--;if(!left){$("fOut").textContent="Фрагментов: "+rag.length;goChat();say("Файл в памяти.","файл")}};r.readAsText(f)})};
(function(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("vBtn").onclick=function(){alert("Голос недоступен")};return}var rec=new SR();rec.lang="ru-RU";rec.onresult=function(e){$("inp").value=e.results[0][0].transcript;send()};$("vBtn").onclick=function(){try{rec.start()}catch(e){}}})();
function sha(str){if(window.crypto&&crypto.subtle)return crypto.subtle.digest("SHA-256",new TextEncoder().encode(str)).then(function(buf){return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0")}).join("")});var h=0x811c9dc5;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=(h*0x01000193)>>>0}return Promise.resolve(("00000000"+h.toString(16)).slice(-8))}
sha("aksi-sovereign-local-2026").then(function(h){$("didFull").textContent="did:aksi:local:"+h.slice(0,32)});
$("didGen").onclick=function(){sha("user:"+($("didName").value||"agent")+":"+Date.now()).then(function(h){$("didUser").innerHTML="<div class='mono' style='margin-top:8px'>"+esc("did:aksi:local:"+h.slice(0,32))+"</div>"})};
Promise.resolve().then(function(){return idbAll("msgs")}).then(function(msgs){(msgs||[]).slice(-16).forEach(function(m){bubble(m.role==="user"?"user":"assistant",m.content,m.role==="assistant"?"история":null)});return idbAll("facts")}).then(function(f){facts=f||[];renderNotes();return idbAll("learned")}).then(function(l){learned=l||[];return idbAll("rag")}).then(function(r){rag=r||[];if(!$("thread").children.length)say("Готова. Меню справа — по всему сайту.","система");status("готово")}).catch(function(){status("готово")});
})();
</script>
</body>
</html>
