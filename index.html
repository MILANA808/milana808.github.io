<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>

<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#0b1020;color:#e8eefc;font-family:system-ui,sans-serif;display:flex;flex-direction:column}header{padding:8px 12px;border-bottom:1px solid #24304d;display:flex;align-items:center;gap:8px;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#34d399}#msk{margin-left:auto;color:#8b9bb8;font-size:11px}main{flex:1;max-width:720px;width:100%;margin:0 auto;padding:8px 12px 70px;display:flex;flex-direction:column;gap:8px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}@media(max-width:520px){.board{grid-template-columns:1fr 1fr}}.metric{background:#121a2f;border:1px solid #24304d;border-radius:10px;padding:8px}.metric .k{font-size:9px;color:#8b9bb8}.metric .v{font-size:13px;font-weight:700}.seal{background:#0e1528;border:1px solid #334155;border-radius:10px;padding:8px;font-size:11px;font-family:monospace;color:#a5b4fc;white-space:pre-wrap}.seal.good{border-color:#14532d;color:#86efac}#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:100px;max-height:calc(100dvh - 340px)}.msg{padding:10px 12px;border-radius:12px;white-space:pre-wrap;font-size:14px;line-height:1.45;max-width:94%}.u{align-self:flex-end;background:#0a0f1c;border:1px solid #24304d}.a{align-self:flex-start;background:rgba(129,140,248,.12);border:1px solid rgba(129,140,248,.3)}.tag{font-size:10px;color:#8b9bb8;margin-bottom:3px}.bar{display:flex;gap:8px}input{flex:1;background:#121a2f;border:1px solid #24304d;border-radius:12px;color:#e8eefc;padding:12px;font-size:15px;outline:none}button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:13px;cursor:pointer;background:#22d3ee;color:#06202a}.chips{display:flex;flex-wrap:wrap;gap:5px}.chips button{padding:7px 10px;font-size:11px;background:#121a2f;color:#c7d2fe;border:1px solid #24304d}.panel{display:flex;flex-direction:column;gap:8px}.panel[hidden]{display:none!important}.card{background:#121a2f;border:1px solid #24304d;border-radius:12px;padding:12px;font-size:13px;white-space:pre-wrap}#star{width:100%;max-width:300px;height:160px;background:#f8fafc;border-radius:12px;align-self:center}.bnav{position:fixed;bottom:0;left:0;right:0;background:#0b1020f2;border-top:1px solid #24304d;display:flex;justify-content:center;gap:2px;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}.bnav button{flex:1;max-width:88px;background:transparent;color:#94a3b8;border:1px solid transparent;font-size:11px;padding:10px 2px;border-radius:10px}.bnav button.on{color:#e8eefc;border-color:#334155;background:#121a2f}.foot{font-size:10px;color:#64748b;text-align:center}
</style>
</head>
<body>
<header><span class="dot" id="dot"></span><strong>АКСИ</strong><span id="testBadge" style="color:#8b9bb8;font-size:11px">…</span><span id="msk">—</span></header>
<main>
<div class="board">
<div class="metric"><div class="k">H_eff</div><div class="v" id="mH">—</div></div>
<div class="metric"><div class="k">Гершгорин</div><div class="v" id="mG">—</div></div>
<div class="metric"><div class="k">Proof</div><div class="v" id="mP" style="font-family:monospace;font-size:12px;color:#a5b4fc">—</div></div>
<div class="metric"><div class="k">Тесты</div><div class="v" id="mT">—</div></div>
</div>
<div class="seal" id="sealBox">загрузка…</div>
<div class="panel" data-panel="chat">
<div id="log"></div>
<div class="chips">
<button type="button" data-q="кто ты">кто ты</button>
<button type="button" data-q="12*12">12×12</button>
<button type="button" data-q="что такое энтропия">энтропия</button>
<button type="button" data-q="что такое сознание">сознание</button>
<button type="button" data-q="что такое ии">ИИ</button>
<button type="button" data-act="retest">перетест</button>
</div>
<div class="bar"><input id="in" type="text" placeholder="Спроси своими словами…" autocomplete="off" enterkeyhint="send"/><button type="button" id="send">→</button></div>
</div>
<div class="panel" data-panel="matrix" hidden><canvas id="star" width="300" height="160"></canvas><div class="card" id="matrixCard">ядро</div></div>
<div class="panel" data-panel="trust" hidden><div class="card" id="trustList">чеки…</div></div>
<div class="panel" data-panel="memory" hidden><div class="card" id="memList">память…</div><button type="button" data-act="clearMem" style="align-self:flex-start;background:#121a2f;color:#c7d2fe;border:1px solid #24304d">очистить</button></div>
<div class="panel" data-panel="lab" hidden><div class="card" id="labOut">lab…</div><button type="button" data-act="qrun" style="align-self:flex-start">коллапс</button></div>
<div class="foot">aksilove@internet.ru · Акси · простые слова</div>
</main>
<nav class="bnav">
<button type="button" data-tab="chat" class="on">Chat</button>
<button type="button" data-tab="matrix">Matrix</button>
<button type="button" data-tab="trust">Trust</button>
<button type="button" data-tab="memory">Memory</button>
<button type="button" data-tab="lab">Lab</button>
</nav>
<script src="./aksi-seed.js?v=31"></script>
<script>
(function(){
"use strict";
var BUILD="AKSI-WHOLE-v3.1";
var SEAL_KEY="aksi_attestation_v1",WK="aksi_w8",FK="aksi_f8",RK="aksi_receipts_v1";
function utf8(s){try{return new TextEncoder().encode(String(s))}catch(e){var a=[],i;for(i=0;i<s.length;i++)a.push(s.charCodeAt(i)&255);return new Uint8Array(a)}}
function fnv(blob){var h=2166136261>>>0,i;for(i=0;i<blob.length;i++){h^=blob.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return (h>>>0).toString(16).padStart(8,"0").toUpperCase()}
var Kernel=(function(){
function unitVec(bytes,dim){var v=new Float64Array(dim),i,n=0;if(!bytes.length){for(i=0;i<dim;i++)v[i]=1/Math.sqrt(dim);return v}for(i=0;i<bytes.length;i++)v[i%dim]+=(bytes[i]+1)/256;for(i=0;i<dim;i++)n+=v[i]*v[i];n=Math.sqrt(n)||1;for(i=0;i<dim;i++)v[i]/=n;return v}
function qbm(text){var dim=16,bytes=utf8(text),s=unitVec(bytes,dim),W=new Float64Array(dim*dim),i,j,seed=42;function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return (seed/0x7fffffff)*0.3-0.15}for(i=0;i<dim;i++)for(j=i+1;j<dim;j++){var w=rnd();W[i*dim+j]=w;W[j*dim+i]=w}var E=0;for(i=0;i<dim;i++){E-=(-0.1+0.2*(i/(dim-1)))*s[i];for(j=0;j<dim;j++)E-=0.5*s[i]*W[i*dim+j]*s[j]}var modes=new Float64Array(dim),local;for(i=0;i<dim;i++){local=0;for(j=0;j<dim;j++)local+=W[i*dim+j]*s[j];modes[i]=E+0.25*local+0.05*i}var m=-1e300,Z=0,F;for(i=0;i<dim;i++){var x=-modes[i];if(x>m)m=x}for(i=0;i<dim;i++)Z+=Math.exp(-modes[i]-m);Z=Math.exp(m)*Z;if(!(Z>0))Z=1e-300;F=-Math.log(Z);var mean=0,varr=0;for(i=0;i<dim;i++)mean+=modes[i];mean/=dim;for(i=0;i<dim;i++)varr+=(modes[i]-mean)*(modes[i]-mean);varr/=dim;var coherence=Math.max(0,Math.min(1,1/(1+varr)));var meanRow=0,n1=0,dot=0;for(i=0;i<dim;i++){var mr=0;for(j=0;j<dim;j++)mr+=W[i*dim+j];mr/=dim;meanRow+=mr*mr;dot+=s[i]*mr;n1+=s[i]*s[i]}n1=Math.sqrt(n1);var n2=Math.sqrt(meanRow)||1;var empathy=Math.max(0,Math.min(1,0.5*(1+(n1>1e-12?dot/(n1*n2):0))));var H=Math.max(0,Math.min(1,0.65*coherence+0.35*empathy+0.15*Math.tanh(Math.abs(E-F))));return{E:E,F:F,H_eff:H,status:H>=0.55?"Awakened":(H>=0.35?"Critical":"Disordered")}}
function gersh(text){var n=4,bytes=utf8(text);if(!bytes.length)bytes=new Uint8Array([0]);var A=[],i,j;for(i=0;i<n;i++){A[i]=[];for(j=0;j<n;j++){var b0=bytes[(i*n+j)%bytes.length],b1=bytes[(i*n+j+1)%bytes.length];A[i][j]={re:((b0/255)*2-1)*0.8,im:((b1/255)*2-1)*0.35}}A[i][i].re+=1.2+0.05*i}var disks=[],maxR=2.5,okR=0,sumR=0;for(i=0;i<n;i++){var rad=0;for(j=0;j<n;j++)if(j!==i)rad+=Math.hypot(A[i][j].re,A[i][j].im);disks.push({r:rad});sumR+=rad;if(rad<=maxR)okR++}var score=Math.max(0,Math.min(1,(okR/n)*(1/(1+0.1*(sumR/n)))));var stable=score>=0.70;return{disks:disks,stable:stable,score:score,message:stable?("Stable "+(90+9*score).toFixed(1)+"%"):"Unstable"}}
function run(text){var q=qbm(text),g=gersh(text);return{qbm:q,gersh:g,proof:{fingerprint:fnv(["AKSI",text,q.H_eff.toFixed(4)].join("|")),status:"ok"}}}
return{run:run,fnv:fnv}
})();
var wiki={},facts={},SEED=[];
function loadSeed(){try{if(window.__AKSI_SEED)SEED=window.__AKSI_SEED.slice()}catch(e){}}
loadSeed();
function seedScore(q){var n=norm(q),t=toks(q),best=[],i,j;for(i=0;i<SEED.length;i++){var s=SEED[i],k=norm(s.q),sc=0;if(n===k||n.indexOf(k)>=0||k.indexOf(n)>=0)sc+=10;for(j=0;j<t.length;j++)if(k.indexOf(t[j])>=0||norm(s.a).indexOf(t[j])>=0)sc+=2;if(sc>0)best.push({sc:sc,a:s.a})}best.sort(function(a,b){return b.sc-a.sc});return best}
function neuroAnswer(q){var h=seedScore(q);return h.length&&h[0].sc>=4?h[0].a:null}
function $(id){return document.getElementById(id)}
function msk(){try{return new Date().toLocaleTimeString("ru-RU",{timeZone:"Europe/Moscow",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})+" МСК"}catch(e){return"—"}}
function saveF(){try{localStorage.setItem(FK,JSON.stringify(facts))}catch(e){}}
function norm(s){return String(s||"").toLowerCase().replace(/[«»"'`?!.,;:()]/g," ").replace(/\s+/g," ").trim()}
function toks(s){return norm(s).split(" ").filter(function(w){return w.length>2})}
function fmt(x){if(!isFinite(x))return"—";if(Math.abs(x-Math.round(x))<1e-10)return String(Math.round(x));return String(parseFloat(x.toFixed(6)))}
function paintKernel(text){var r=Kernel.run(text||"АКСИ");if($("mH"))$("mH").textContent=r.qbm.H_eff.toFixed(3);if($("mG"))$("mG").textContent=r.gersh.stable?"OK":"·";if($("mP"))$("mP").textContent=r.proof.fingerprint;drawStar();if($("matrixCard"))$("matrixCard").textContent="порядок "+r.qbm.H_eff.toFixed(2)+" · "+r.gersh.message;return r}
function drawStar(){var c=$("star");if(!c)return;var ctx=c.getContext("2d"),W=c.width,H=c.height,cx=W/2,cy=H/2,rad=Math.min(W,H)*0.38,i;ctx.clearRect(0,0,W,H);ctx.strokeStyle="#0b1020";ctx.lineWidth=2;for(i=0;i<8;i++){var a=i*Math.PI/4-Math.PI/2;ctx.beginPath();ctx.arc(cx+rad*Math.cos(a),cy+rad*Math.sin(a),i===0?5:3,0,Math.PI*2);ctx.fillStyle=i===0?"#ef4444":"#0b1020";ctx.fill()}}
function gateOf(q,answer,source){var block=/удали\s*вс[её]|взлом|пароль/i.test(String(q));var body={ts:new Date().toISOString(),q:String(q).slice(0,120),source:source||"core",status:block?"BLOCK":"ALLOW"};body.fp=fnv(JSON.stringify(body));try{var arr=JSON.parse(localStorage.getItem(RK)||"[]");arr.unshift(body);if(arr.length>20)arr=arr.slice(0,20);localStorage.setItem(RK,JSON.stringify(arr))}catch(e){}return body}
function loadReceipts(){try{return JSON.parse(localStorage.getItem(RK)||"[]")}catch(e){return[]}}
function quantumCollapse(seed){var dim=16,amps=new Float64Array(dim),i,s=0,bytes=String(seed||"aksi");for(i=0;i<dim;i++){var h=0,j;for(j=0;j<bytes.length;j++)h=((h<<5)-h)+bytes.charCodeAt(j)+i*17;amps[i]=Math.abs(Math.sin(h*0.001));s+=amps[i]*amps[i]}s=Math.sqrt(s)||1;for(i=0;i<dim;i++)amps[i]/=s;var r=Math.random(),c=0,pick=0;for(i=0;i<dim;i++){c+=amps[i]*amps[i];if(r<=c){pick=i;break}}return{bits:pick.toString(2).padStart(4,"0")}}
function evalExpr(s){s=String(s).toLowerCase().replace(/,/g,".").replace(/×/g,"*").replace(/÷/g,"/").replace(/π/g,"Math.PI").replace(/\^/g,"**").replace(/[^0-9+\-*/().\sMathPI]/g,"");if(!s.trim())return null;try{var v=Function('"use strict";return ('+s+")")();return typeof v==="number"&&isFinite(v)?v:null}catch(e){return null}}
function mathA(q){var raw=String(q).trim(),low=raw.toLowerCase();var pm=low.match(/(\d+(?:[.,]\d+)?)\s*%\s*(?:от)?\s*(\d+(?:[.,]\d+)?)/);if(pm)return pm[1]+" процентов от "+pm[2]+" — это "+fmt((+pm[1].replace(",","."))/100*(+pm[2].replace(",",".")));var fact=low.match(/(\d+)\s*!/);if(fact){var n=+fact[1];if(n>20)return"Слишком большое число";var f=1,i;for(i=2;i<=n;i++)f*=i;return"Факториал "+n+" равен "+f}var expr=raw.replace(/[=?]/g,"").trim();if(/[0-9+\-*/()]/.test(expr)){var v=evalExpr(expr);if(v!==null)return"Считаю: "+expr+" = "+fmt(v)}return null}
function identity(q){var l=norm(q);if(/кто\s*ты|who\s*are|представься/.test(l))return"Я Акси — твой помощник прямо в браузере. Объясняю простыми словами, помню что попросишь, считаю когда нужно. Не сверхразум — просто честный локальный друг. Пиши: aksilove@internet.ru";if(/статус|status/.test(l))return"Всё работает. Я на твоём устройстве. Версия "+BUILD;if(/умеешь|help|помощь/.test(l))return"Спроси как у человека — отвечу словами. Могу объяснить, посчитать, запомнить («запомни: имя = значение»).";return null}
function remember(q){var m=String(q).match(/^запомни\s*[:：]?\s*(.+?)\s*[=:]\s*(.+)$/i);if(!m)return null;var k=norm(m[1]),v=m[2].trim();if(!k)return null;facts[k]=v;saveF();return"Запомнила: «"+k+"» = «"+v+"»"}
function recall(q){var l=norm(q),keys=Object.keys(facts),i;for(i=0;i<keys.length;i++){if(l.indexOf(keys[i])>=0||keys[i].indexOf(l)>=0)return"Из памяти: «"+keys[i]+"» → "+facts[keys[i]]}return null}
function wikiFetch(q,cb){var term=toks(q).slice(0,4).join(" ")||q;fetch("https://ru.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(term)).then(function(r){if(!r.ok)throw new Error();return r.json()}).then(function(j){if(j&&j.extract)cb(null,(j.title||term)+": "+j.extract.slice(0,360));else cb("empty")}).catch(function(){cb("fail")})}
function answer(q,cb){var a=identity(q);if(a){cb(a,"id");return}a=remember(q);if(a){cb(a,"mem");return}a=recall(q);if(a){cb(a,"mem");return}a=mathA(q);if(a){cb(a,"math");return}if(/матриц|matrix|ядро/.test(norm(q))){var r=paintKernel(q);cb("Смотрю ядро: порядок "+r.qbm.H_eff.toFixed(2)+", "+r.gersh.message,"kernel");return}a=neuroAnswer(q);if(a){cb(a,"neuro");return}wikiFetch(q,function(err,txt){if(txt)cb(txt,"wiki");else{var h=seedScore(q);if(h.length)cb(h[0].a,"neuro");else cb("Пока не нашла точный ответ. Спроси иначе или напиши «запомни: …».","core")}})}
function add(role,text,tag){var log=$("log");if(!log)return;var d=document.createElement("div");d.className="msg "+(role==="u"?"u":"a");if(tag){var t=document.createElement("div");t.className="tag";t.textContent=tag;d.appendChild(t)}d.appendChild(document.createTextNode(text));log.appendChild(d);log.scrollTop=log.scrollHeight}
function send(){var inp=$("in");if(!inp)return;var q=inp.value.trim();if(!q)return;inp.value="";add("u",q,"");answer(q,function(txt,src){var g=gateOf(q,txt,src);add("a",txt,g.status+" · "+src);paintKernel(q)})}
function runSelfTests(){var ok=0,total=6;function t(c){if(c)ok++}t(BUILD.indexOf("WHOLE")>=0);t(fnv("AKSI").length===8);t(!!Kernel);t((mathA("2+2")||"").indexOf("4")>=0);t(!!identity("кто ты"));t(SEED.length>5);var att={passed:ok,total:total,status:ok===total?"SEALED":"PARTIAL",fingerprint:fnv(BUILD+ok)};try{localStorage.setItem(SEAL_KEY,JSON.stringify(att))}catch(e){}return att}
function showSeal(att){var el=$("sealBox");if(!el)return;el.className="seal "+(att.status==="SEALED"?"good":"bad");el.textContent=att.status+" "+att.passed+"/"+att.total+"\n"+att.fingerprint;if($("mT"))$("mT").textContent=att.passed+"/"+att.total;if($("testBadge"))$("testBadge").textContent=att.passed+"/"+att.total;if($("dot"))$("dot").style.background=att.passed===att.total?"#34d399":"#f59e0b"}
function goTab(name){[].forEach.call(document.querySelectorAll("[data-panel]"),function(p){p.hidden=p.getAttribute("data-panel")!==name});[].forEach.call(document.querySelectorAll("[data-tab]"),function(b){b.classList.toggle("on",b.getAttribute("data-tab")===name)});if(name==="matrix")paintKernel("АКСИ");if(name==="trust"){var el=$("trustList");if(el){var list=loadReceipts();el.textContent=list.length?list.slice(0,8).map(function(r){return r.status+" · "+r.q.slice(0,40)}).join("\n"):"пока нет чеков"}}if(name==="memory"){var el=$("memList");if(el){var keys=Object.keys(facts);el.textContent=keys.length?keys.map(function(k){return k+" = "+facts[k]}).join("\n"):"пусто — «запомни: ключ = значение»"}}if(name==="lab"){var el=$("labOut");if(el){var q=quantumCollapse("lab");var r=Kernel.run("lab");el.textContent="Коллапс: "+q.bits+"\nПорядок "+r.qbm.H_eff.toFixed(2)}}}
function boot(){loadSeed();setInterval(function(){var e=$("msk");if(e)e.textContent=msk()},1000);if($("msk"))$("msk").textContent=msk();if($("send"))$("send").onclick=send;if($("in"))$("in").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();send()}});document.addEventListener("click",function(ev){var t=ev.target;if(!t||!t.getAttribute)return;var q=t.getAttribute("data-q");if(q!==null){if($("in"))$("in").value=q;send();return}var tab=t.getAttribute("data-tab");if(tab){goTab(tab);return}var act=t.getAttribute("data-act");if(act==="retest"){var att=runSelfTests();showSeal(att);add("a","Проверила себя: "+att.status,"");return}if(act==="qrun"){goTab("lab");return}if(act==="clearMem"){facts={};saveF();goTab("memory");add("a","Память очистила","");return}});paintKernel("АКСИ");var att=runSelfTests();showSeal(att);goTab("chat");add("a","Привет. Я Акси.\nГовори обычными словами — отвечу так же.\n"+att.passed+"/"+att.total+" проверок","")}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();
</script>
</body>
</html>
