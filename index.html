<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>АКСИ · Агент</title>
<meta name="description" content="АКСИ — твой offline-агент: math, память, gate, receipt"/>
<meta name="theme-color" content="#0b1020"/>
<style>
:root{--bg:#0b1020;--card:#121a2f;--line:#24304d;--tx:#e8eefc;--mut:#8b9bb8;--ok:#34d399;--bad:#f87171;--acc:#818cf8;--cyan:#22d3ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.45}
a{color:var(--acc)}
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:rgba(11,16,32,.96);border-bottom:1px solid var(--line);font-size:12px;color:var(--mut);backdrop-filter:blur(10px)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.shell{max-width:720px;margin:0 auto;padding:12px 14px 28px}
h1{font-size:1.35rem;margin:8px 0 4px}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
#log{max-height:min(55vh,480px);overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:120px}
.msg{padding:10px 12px;border-radius:12px;white-space:pre-wrap;font-size:14px}
.u{background:#0a0f1c;border:1px solid var(--line);align-self:flex-end;max-width:92%}
.a{background:rgba(129,140,248,.12);border:1px solid rgba(129,140,248,.35);align-self:flex-start;max-width:95%}
.composer{display:flex;gap:8px;margin-top:10px}
.composer input{flex:1;background:#0a0f1c;border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:12px;font-size:15px;outline:none}
button{border:0;border-radius:10px;padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer;background:var(--cyan);color:#06202a;font-family:inherit}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--tx);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{padding:8px 10px;font-size:12px;background:#0e1528;color:var(--tx);border:1px solid var(--line)}
.meta{font-size:11px;color:var(--mut);margin-top:8px;font-family:ui-monospace,Menlo,monospace}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
</style>
</head>
<body>
<div class="top">
  <span class="dot"></span>
  <strong style="color:var(--tx)">АКСИ · агент</strong>
  <span id="msk">—</span>
  <span id="st">mem 0 · gate —</span>
</div>
<div class="shell">
  <h1>Твой агент</h1>
  <p class="sub">Offline-first: считает, помнит, ставит gate. Без сервера. «запомни: имя = Акси»</p>
  <div class="card">
    <div id="log"></div>
    <div class="chips">
      <button type="button" data-q="кто ты">кто ты</button>
      <button type="button" data-q="12*12">12*12</button>
      <button type="button" data-q="x^2-4=0">x²−4=0</button>
      <button type="button" data-q="что помнишь">память</button>
      <button type="button" data-q="время">время</button>
    </div>
    <div class="composer">
      <input id="in" type="text" placeholder="Вопрос · 2+2*3 · запомни: город = Москва" autocomplete="off"/>
      <button type="button" id="send">Отправить</button>
    </div>
    <div class="meta" id="foot">receipt в localStorage · aksilove@internet.ru</div>
  </div>
  <div class="row">
    <button type="button" class="ghost" id="btnMem">Показать память</button>
    <button type="button" class="ghost" id="btnClear">Очистить чат</button>
    <button type="button" class="ghost" id="btnExport">Экспорт receipt</button>
  </div>
</div>
<script>
(function(){
"use strict";
var MEM_KEY="aksi_agent_mem_v1", REC_KEY="aksi_agent_receipts_v1";
var mem=loadMem(), lastGate="—";
function $(id){return document.getElementById(id)}
function msk(){
  try{return new Date().toLocaleTimeString("ru-RU",{timeZone:"Europe/Moscow",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})+" МСК"}
  catch(e){return "—"}
}
function paint(){
  $("msk").textContent=msk();
  $("st").textContent="mem "+Object.keys(mem).length+" · gate "+lastGate;
}
setInterval(paint,1000);paint();
function loadMem(){
  try{return JSON.parse(localStorage.getItem(MEM_KEY)||"{}")||{}}catch(e){return {}}
}
function saveMem(){
  try{localStorage.setItem(MEM_KEY,JSON.stringify(mem))}catch(e){}
  paint();
}
function fmt(x){
  if(x==null||!isFinite(x))return "—";
  if(Math.abs(x-Math.round(x))<1e-10)return String(Math.round(x));
  return String(parseFloat(x.toFixed(10)));
}
function evalExpr(s){
  s=String(s).toLowerCase().replace(/,/g,".").replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
  s=s.replace(/π/g,"Math.PI").replace(/\bpi\b/g,"Math.PI");
  s=s.replace(/корень(?:\s*из)?\s*\(?\s*([\d.]+)\s*\)?/g,"Math.sqrt($1)");
  s=s.replace(/√\s*\(?\s*([\d.]+)\s*\)?/g,"Math.sqrt($1)");
  s=s.replace(/\^/g,"**");
  s=s.replace(/[^0-9+\-*/().\sMathsqrtPI]/g,"");
  if(!s.trim())return null;
  try{
    var v=Function('"use strict";return ('+s+')')();
    return (typeof v==="number"&&isFinite(v))?v:null;
  }catch(e){return null}
}
function solveEq(raw){
  var s=String(raw).toLowerCase().replace(/,/g,".").replace(/\s/g,"").replace(/х/g,"x").replace(/\*/g,"");
  if(s.indexOf("=")<0)return null;
  var L=s.split("=")[0], R=s.split("=")[1], rN=parseFloat(R);
  if(!isFinite(rN)||/[x]/.test(R))return null;
  var a=0,b=0,c=0,e=L,m;
  m=e.match(/([+-]?\d*\.?\d*)x\^2/);
  if(m){a=m[1]===""||m[1]==="+"?1:m[1]==="-"?-1:parseFloat(m[1]);e=e.replace(m[0],"")}
  m=e.match(/([+-]?\d*\.?\d*)x/);
  if(m){b=m[1]===""||m[1]==="+"?1:m[1]==="-"?-1:parseFloat(m[1]);e=e.replace(m[0],"")}
  e.replace(/([+-]?\d+\.?\d*)/g,function(n){c+=parseFloat(n);return""});
  c-=rN;
  if(Math.abs(a)<1e-12){
    if(Math.abs(b)<1e-12)return "Нет решения";
    return "Корень: "+fmt(-c/b);
  }
  var d=b*b-4*a*c;
  if(d<-1e-12)return "Нет действительных корней";
  if(Math.abs(d)<1e-12)return "Корень: "+fmt(-b/(2*a));
  var s2=Math.sqrt(d);
  return "Корни: "+fmt((-b+s2)/(2*a))+", "+fmt((-b-s2)/(2*a));
}
function mathAnswer(q){
  var raw=String(q).trim(), low=raw.toLowerCase();
  var pm=low.match(/(\d+(?:[.,]\d+)?)\s*%\s*(?:от)?\s*(\d+(?:[.,]\d+)?)/);
  if(pm)return pm[1]+"% от "+pm[2]+" = "+fmt((+pm[1].replace(",","."))/100*(+pm[2].replace(",",".")));
  var fm=low.match(/(\d+)\s*!/);
  if(fm){
    var n=+fm[1],f=1,i;
    if(n>20)return "n! слишком велико (n≤20)";
    for(i=2;i<=n;i++)f*=i;
    return n+"! = "+f;
  }
  if(/=/.test(raw)&&/[xх]/i.test(raw)){
    var eq=solveEq(raw);
    if(eq)return "Уравнение: "+raw+"\n"+eq;
  }
  var expr=raw.replace(/^посчитай\s*/i,"").replace(/^вычисли\s*/i,"").replace(/^сколько\s+будет\s*/i,"");
  if(!/=/.test(expr)||!/[xх]/i.test(expr)){
    var v=evalExpr(expr);
    if(v!=null)return "Результат: "+fmt(v);
  }
  return null;
}
function teach(q){
  var m=String(q).match(/^(?:запомни|remember)\s*[:\-]?\s*(.+)$/i);
  if(!m)return null;
  var body=m[1].trim();
  var kv=body.match(/^([^=:]+)[=:]\s*(.+)$/);
  if(kv){
    var k=kv[1].trim().toLowerCase(), v=kv[2].trim();
    mem[k]=v; saveMem();
    return "Запомнила: «"+k+"» = «"+v+"» ("+Object.keys(mem).length+" фактов)";
  }
  mem["note_"+Date.now()]=body; saveMem();
  return "Записала в память ("+Object.keys(mem).length+" фактов)";
}
function recall(q){
  var low=q.toLowerCase();
  if(/что\s+помнишь|покажи\s+память|memory|факты/.test(low)){
    var keys=Object.keys(mem);
    if(!keys.length)return "Память пуста. Напиши: запомни: имя = …";
    return "Память:\n"+keys.map(function(k){return "• "+k+" = "+mem[k]}).join("\n");
  }
  var ask=low.match(/(?:что\s+такое|кто\s+такой|какой|какая|какое)\s+(.+?)[\?]?$/);
  if(ask){
    var key=ask[1].trim().toLowerCase();
    if(mem[key])return mem[key]+" (из памяти)";
  }
  for(var k in mem){
    if(low.indexOf(k)>=0)return mem[k]+" (память: "+k+")";
  }
  return null;
}
function respond(q){
  q=String(q||"").trim();
  if(!q)return "Напиши вопрос, пример или «запомни: …»";
  var t=teach(q); if(t)return t;
  var m=mathAnswer(q); if(m)return m;
  var r=recall(q); if(r)return r;
  var low=q.toLowerCase();
  if(/кто ты|что ты|представься/.test(low))
    return "Я АКСИ — твой offline-агент на этом сайте.\nСчитаю, храню факты у тебя в браузере, ставлю gate на ответ.\nНе AGI. Технология служит тебе.\nКонтакт автора: aksilove@internet.ru";
  if(/привет|здравств|hello|hi\b/.test(low))
    return "Привет. Я на связи.\nПопробуй: 12*12 · x^2-4=0 · запомни: город = Москва";
  if(/время|который час|мск/.test(low)) return msk();
  if(/что умеешь|помощь|help|команды/.test(low))
    return "• математика и уравнения\n• запомни: ключ = значение\n• что помнишь\n• gate + receipt в localStorage\nВсё без сервера.";
  if(/мир|explore|ссылк/.test(low))
    return "Мир (кроличьи норы):\nzoom.earth · flightradar24.com · arxiv.org · archive.org · ourworldindata.org";
  if(/акси|миссия|зачем/.test(low))
    return "АКСИ — суверенный слой агента: память и решения у человека, не в чужом облаке.";
  return "Не распознала как расчёт или команду.\nПримеры: 17*19 · корень из 49 · запомни: проект = АКСИ · кто ты";
}
function gateOf(q, ans){
  var math=!!mathAnswer(q);
  var taught=/^запомни/i.test(q);
  var known=/кто ты|привет|время|помощ|акси|мир|памят|что помнишь/i.test(q)||!!recall(q);
  var dec=math||taught||known?"ALLOW":"REVIEW";
  lastGate=dec;
  var body={system:"AKSI-AGENT-v1",claim:q,answer:String(ans).slice(0,500),decision:dec,ts:new Date().toISOString(),mem_n:Object.keys(mem).length};
  try{
    var arr=JSON.parse(localStorage.getItem(REC_KEY)||"[]");
    arr.push(body); if(arr.length>40)arr=arr.slice(-40);
    localStorage.setItem(REC_KEY,JSON.stringify(arr));
    localStorage.setItem("aksi_unity_last",JSON.stringify(body));
  }catch(e){}
  paint();
  return dec;
}
function append(role,text){
  var box=$("log");
  var d=document.createElement("div");
  d.className="msg "+(role==="u"?"u":"a");
  d.textContent=(role==="u"?"Вы: ":"АКСИ: ")+text;
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
}
function send(){
  var inp=$("in");
  var q=inp.value.trim();
  if(!q)return;
  inp.value="";
  append("u",q);
  var ans=respond(q);
  append("a",ans);
  var g=gateOf(q,ans);
  append("a","[gate "+g+"]");
}
$("send").onclick=send;
$("in").addEventListener("keydown",function(e){
  if(e.key==="Enter"){e.preventDefault();send()}
});
document.querySelectorAll("[data-q]").forEach(function(b){
  b.onclick=function(){$("in").value=b.getAttribute("data-q");send()};
});
$("btnMem").onclick=function(){append("a",respond("что помнишь"))};
$("btnClear").onclick=function(){$("log").innerHTML="";append("a","Чат очищен. Память на месте ("+Object.keys(mem).length+").")};
$("btnExport").onclick=function(){
  try{
    var t=localStorage.getItem("aksi_unity_last")||"{}";
    append("a","Последний receipt:\n"+t);
  }catch(e){append("a","Нет receipt")}
};
append("a","Онлайн · "+msk()+"\nЯ твой агент АКСИ. Спроси или сохрани факт.");
})();
</script>
</body>
</html>
