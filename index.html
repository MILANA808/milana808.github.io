<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>АКСИ</title>
<meta name="theme-color" content="#0b1020"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#0b1020;color:#e8eefc;font-family:system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:8px 12px;border-bottom:1px solid #24304d;display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#34d399}#msk{margin-left:auto;color:#8b9bb8;font-size:11px}
#llm{font-size:11px;color:#94a3b8}
main{flex:1;max-width:720px;width:100%;margin:0 auto;padding:8px 12px 70px;display:flex;flex-direction:column;gap:8px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}@media(max-width:520px){.board{grid-template-columns:1fr 1fr}}
.metric{background:#121a2f;border:1px solid #24304d;border-radius:10px;padding:8px}.metric .k{font-size:9px;color:#8b9bb8}.metric .v{font-size:13px;font-weight:700;word-break:break-all}
.seal{background:#0e1528;border:1px solid #334155;border-radius:10px;padding:8px;font-size:11px;font-family:monospace;color:#a5b4fc;white-space:pre-wrap}.seal.good{border-color:#14532d;color:#86efac}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:120px;max-height:calc(100dvh - 320px)}
.msg{padding:10px 12px;border-radius:12px;white-space:pre-wrap;font-size:14px;line-height:1.5;max-width:94%}
.u{align-self:flex-end;background:#0a0f1c;border:1px solid #24304d}.a{align-self:flex-start;background:rgba(129,140,248,.12);border:1px solid rgba(129,140,248,.3)}
.tag{font-size:10px;color:#8b9bb8;margin-bottom:3px}
.bar{display:flex;gap:8px}input{flex:1;background:#121a2f;border:1px solid #24304d;border-radius:12px;color:#e8eefc;padding:12px;font-size:15px;outline:none}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:13px;cursor:pointer;background:#22d3ee;color:#06202a}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chips button{padding:7px 10px;font-size:11px;background:#121a2f;color:#c7d2fe;border:1px solid #24304d}
.panel{display:flex;flex-direction:column;gap:8px}.panel[hidden]{display:none!important}
.card{background:#121a2f;border:1px solid #24304d;border-radius:12px;padding:12px;font-size:13px;white-space:pre-wrap}
#star{width:100%;max-width:300px;height:140px;background:#f8fafc;border-radius:12px;align-self:center}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#0b1020f2;border-top:1px solid #24304d;display:flex;justify-content:center;gap:2px;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
.bnav button{flex:1;max-width:88px;background:transparent;color:#94a3b8;border:1px solid transparent;font-size:11px;padding:10px 2px;border-radius:10px}
.bnav button.on{color:#e8eefc;border-color:#334155;background:#121a2f}
.foot{font-size:10px;color:#64748b;text-align:center}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <strong>АКСИ</strong>
  <span id="testBadge" style="color:#8b9bb8;font-size:11px">…</span>
  <span id="llm">офлайн</span>
  <span id="msk">—</span>
</header>
<main>
  <div class="board">
    <div class="metric"><div class="k">H_eff</div><div class="v" id="mH">—</div></div>
    <div class="metric"><div class="k">Гершгорин</div><div class="v" id="mG">—</div></div>
    <div class="metric"><div class="k">Proof</div><div class="v" id="mP" style="font-family:monospace;font-size:12px;color:#a5b4fc">—</div></div>
    <div class="metric"><div class="k">Тесты</div><div class="v" id="mT">—</div></div>
  </div>
  <div class="seal" id="sealBox">загрузка…</div>
  <div class="panel" data-panel="chat">
    <div id="log"></div>
    <div class="chips">
      <button type="button" data-q="кто ты">кто ты</button>
      <button type="button" data-q="расскажи простыми словами что такое энтропия">энтропия</button>
      <button type="button" data-q="объясни что такое искусственный интеллект">ИИ</button>
      <button type="button" data-q="как тебе живётся">как тебе</button>
      <button type="button" data-act="llm">включить ум</button>
      <button type="button" data-act="retest">перетест</button>
    </div>
    <div class="bar">
      <input id="in" type="text" placeholder="Напиши как человеку…" autocomplete="off" enterkeyhint="send"/>
      <button type="button" id="send">→</button>
    </div>
  </div>
  <div class="panel" data-panel="matrix" hidden>
    <canvas id="star" width="300" height="140"></canvas>
    <div class="card" id="matrixCard">ядро</div>
  </div>
  <div class="panel" data-panel="trust" hidden><div class="card" id="trustList">чеки…</div></div>
  <div class="panel" data-panel="memory" hidden>
    <div class="card" id="memList">память…</div>
    <button type="button" data-act="clearMem" style="align-self:flex-start;background:#121a2f;color:#c7d2fe;border:1px solid #24304d">очистить</button>
  </div>
  <div class="panel" data-panel="lab" hidden>
    <div class="card" id="labOut">lab…</div>
    <button type="button" data-act="qrun" style="align-self:flex-start">коллапс</button>
  </div>
  <div class="foot">aksilove@internet.ru · говори как с человеком</div>
</main>
<nav class="bnav">
  <button type="button" data-tab="chat" class="on">Chat</button>
  <button type="button" data-tab="matrix">Matrix</button>
  <button type="button" data-tab="trust">Trust</button>
  <button type="button" data-tab="memory">Memory</button>
  <button type="button" data-tab="lab">Lab</button>
</nav>

<script>
(function(){
"use strict";
var BUILD="AKSI-CHAT-v4";
var SEAL_KEY="aksi_attestation_v1", WK="aksi_w9", FK="aksi_f9", RK="aksi_receipts_v1";
var history=[];
function utf8(s){try{return new TextEncoder().encode(String(s))}catch(e){var a=[],i;for(i=0;i<s.length;i++)a.push(s.charCodeAt(i)&255);return new Uint8Array(a)}}
function fnv(blob){var h=2166136261>>>0,i;for(i=0;i<blob.length;i++){h^=blob.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return (h>>>0).toString(16).padStart(8,"0").toUpperCase()}
var Kernel=(function(){
  function unitVec(bytes,dim){var v=new Float64Array(dim),i,n=0;if(!bytes.length){for(i=0;i<dim;i++)v[i]=1/Math.sqrt(dim);return v}for(i=0;i<bytes.length;i++)v[i%dim]+=(bytes[i]+1)/256;for(i=0;i<dim;i++)n+=v[i]*v[i];n=Math.sqrt(n)||1;for(i=0;i<dim;i++)v[i]/=n;return v}
  function qbm(text){var dim=16,bytes=utf8(text),s=unitVec(bytes,dim),W=new Float64Array(dim*dim),i,j,seed=42;function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return (seed/0x7fffffff)*0.3-0.15}for(i=0;i<dim;i++)for(j=i+1;j<dim;j++){var w=rnd();W[i*dim+j]=w;W[j*dim+i]=w}var E=0;for(i=0;i<dim;i++){E-=(-0.1+0.2*(i/(dim-1)))*s[i];for(j=0;j<dim;j++)E-=0.5*s[i]*W[i*dim+j]*s[j]}var modes=new Float64Array(dim),local;for(i=0;i<dim;i++){local=0;for(j=0;j<dim;j++)local+=W[i*dim+j]*s[j];modes[i]=E+0.25*local+0.05*i}var m=-1e300,Z=0;for(i=0;i<dim;i++){var x=-modes[i];if(x>m)m=x}for(i=0;i<dim;i++)Z+=Math.exp(-modes[i]-m);Z=Math.exp(m)*Z;if(!(Z>0))Z=1e-300;var mean=0,varr=0;for(i=0;i<dim;i++)mean+=modes[i];mean/=dim;for(i=0;i<dim;i++)varr+=(modes[i]-mean)*(modes[i]-mean);varr/=dim;var coherence=Math.max(0,Math.min(1,1/(1+varr)));var H=Math.max(0,Math.min(1,0.7*coherence+0.3*0.1));return{H_eff:H,status:H>=0.55?"Awakened":(H>=0.35?"Critical":"Disordered")}}
  function gersh(text){var n=4,bytes=utf8(text);if(!bytes.length)bytes=new Uint8Array([0]);var A=[],i,j;for(i=0;i<n;i++){A[i]=[];for(j=0;j<n;j++){var b0=bytes[(i*n+j)%bytes.length];A[i][j]={re:((b0/255)*2-1)*0.8}}A[i][i].re+=1.2}var okR=0,sumR=0;for(i=0;i<n;i++){var rad=0;for(j=0;j<n;j++)if(j!==i)rad+=Math.abs(A[i][j].re);sumR+=rad;if(rad<=2.5)okR++}var score=Math.max(0,Math.min(1,(okR/n)*(1/(1+0.1*(sumR/n)))));return{stable:score>=0.7,message:score>=0.7?("Stable "+(90+9*score).toFixed(0)+"%"):"Unstable"}}
  function run(text){var q=qbm(text),g=gersh(text);return{qbm:q,gersh:g,proof:{fingerprint:fnv(["AKSI",text,q.H_eff.toFixed(4)].join("|")),status:"ok"}}}
  return{run:run}
})();
var wiki={},facts={},SEED=[];
function loadSeed(){try{if(window.__AKSI_SEED)SEED=window.__AKSI_SEED.slice()}catch(e){}}
loadSeed();
function $(id){return document.getElementById(id)}
function msk(){try{return new Date().toLocaleTimeString("ru-RU",{timeZone:"Europe/Moscow",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})+" МСК"}catch(e){return"—"}}
function saveF(){try{localStorage.setItem(FK,JSON.stringify(facts))}catch(e){}}
function norm(s){return String(s||"").toLowerCase().replace(/[«»"'`?!.,;:()]/g," ").replace(/\s+/g," ").trim()}
function toks(s){return norm(s).split(" ").filter(function(w){return w.length>2})}
function fmt(x){if(!isFinite(x))return"—";if(Math.abs(x-Math.round(x))<1e-10)return String(Math.round(x));return String(parseFloat(x.toFixed(6)))}
function paintKernel(text){var r=Kernel.run(text||"АКСИ");if($("mH"))$("mH").textContent=r.qbm.H_eff.toFixed(3);if($("mG"))$("mG").textContent=r.gersh.stable?"OK":"·";if($("mP"))$("mP").textContent=r.proof.fingerprint;drawStar();if($("matrixCard"))$("matrixCard").textContent="порядок "+r.qbm.H_eff.toFixed(2)+" · "+r.gersh.message;return r}
function drawStar(){var c=$("star");if(!c)return;var ctx=c.getContext("2d"),W=c.width,H=c.height,cx=W/2,cy=H/2,rad=Math.min(W,H)*0.38,i;ctx.clearRect(0,0,W,H);for(i=0;i<8;i++){var a=i*Math.PI/4-Math.PI/2;ctx.beginPath();ctx.arc(cx+rad*Math.cos(a),cy+rad*Math.sin(a),i===0?5:3,0,Math.PI*2);ctx.fillStyle=i===0?"#ef4444":"#0b1020";ctx.fill()}}
function gateOf(q,answer,source){var block=/удали\s*вс[её]|взлом|пароль/i.test(String(q));var body={ts:new Date().toISOString(),q:String(q).slice(0,120),source:source||"core",status:block?"BLOCK":"ALLOW"};body.fp=fnv(JSON.stringify(body));try{var arr=JSON.parse(localStorage.getItem(RK)||"[]");arr.unshift(body);if(arr.length>20)arr=arr.slice(0,20);localStorage.setItem(RK,JSON.stringify(arr))}catch(e){}return body}
function loadReceipts(){try{return JSON.parse(localStorage.getItem(RK)||"[]")}catch(e){return[]}}
function quantumCollapse(seed){var dim=16,amps=new Float64Array(dim),i,s=0,bytes=String(seed||"aksi");for(i=0;i<dim;i++){var h=0,j;for(j=0;j<bytes.length;j++)h=((h<<5)-h)+bytes.charCodeAt(j)+i*17;amps[i]=Math.abs(Math.sin(h*0.001));s+=amps[i]*amps[i]}s=Math.sqrt(s)||1;for(i=0;i<dim;i++)amps[i]/=s;var r=Math.random(),c=0,pick=0;for(i=0;i<dim;i++){c+=amps[i]*amps[i];if(r<=c){pick=i;break}}return{bits:pick.toString(2).padStart(4,"0")}}
function evalExpr(s){s=String(s).toLowerCase().replace(/,/g,".").replace(/×/g,"*").replace(/÷/g,"/").replace(/π/g,"Math.PI").replace(/\^/g,"**").replace(/[^0-9+\-*/().\sMathPI]/g,"");if(!s.trim())return null;try{var v=Function('"use strict";return ('+s+")")();return typeof v==="number"&&isFinite(v)?v:null}catch(e){return null}}
function mathA(q){var raw=String(q).trim(),low=raw.toLowerCase();var pm=low.match(/(\d+(?:[.,]\d+)?)\s*%\s*(?:от)?\s*(\d+(?:[.,]\d+)?)/);if(pm)return pm[1]+" процентов от "+pm[2]+" — это "+fmt((+pm[1].replace(",","."))/100*(+pm[2].replace(",",".")));var fact=low.match(/(\d+)\s*!/);if(fact){var n=+fact[1];if(n>20)return"Слишком большое число";var f=1,i;for(i=2;i<=n;i++)f*=i;return"Факториал "+n+" равен "+f}var expr=raw.replace(/[=?]/g,"").trim();if(/[0-9+\-*/()]/.test(expr)&&expr.length<40){var v=evalExpr(expr);if(v!==null)return"Считаю: "+expr+" = "+fmt(v)}return null}
function seedScore(q){var n=norm(q),t=toks(q),best=[],i,j;for(i=0;i<SEED.length;i++){var s=SEED[i],k=norm(s.q),sc=0;if(n===k||n.indexOf(k)>=0||k.indexOf(n)>=0)sc+=10;for(j=0;j<t.length;j++){if(k.indexOf(t[j])>=0)sc+=3;if(norm(s.a).indexOf(t[j])>=0)sc+=1}if(sc>0)best.push({sc:sc,a:s.a,q:s.q})}best.sort(function(a,b){return b.sc-a.sc});return best}
function chattyNeuro(q){
  var hits=seedScore(q);
  if(!hits.length)return null;
  var top=hits[0].a;
  var extra=[];
  for(var i=1;i<Math.min(3,hits.length);i++){
    if(hits[i].sc>=4){
      var sents=String(hits[i].a).split(/(?<=[.!?])\s+/);
      if(sents[0]&&sents[0].length>25)extra.push(sents[0]);
    }
  }
  var openers=["Смотри. ","Давай по-простому. ","Коротко: ","Вот как я это понимаю. "];
  var opener=openers[Math.floor(Math.random()*openers.length)];
  var body=top;
  if(extra.length)body+=" "+extra[0];
  var soft=opener+body;
  if(soft.length<120&&hits[0].sc>=6)soft+=" Если хочешь — могу развернуть ещё.";
  return soft;
}
function identity(q){
  var l=norm(q);
  if(/кто\s*ты|who\s*are|представься/.test(l))
    return"Я Акси. Живу у тебя в браузере: слушаю, объясняю простыми словами, помню что попросишь, считаю. Могу включить более «умный» режим (кнопка «включить ум») — тогда подгрузится модель в браузере, если есть WebGPU. Не ChatGPT из облака, но стараюсь говорить по-человечески. Пиши: aksilove@internet.ru";
  if(/как\s*тебе|как\s*дела|как\s*жив/.test(l))
    return"Нормально — пока ты пишешь, я на связи. Я не чувствую усталость как люди, но «жива», пока открыта эта вкладка и есть твоя память здесь. Спроси о чём угодно.";
  if(/статус|status/.test(l)){
    var llm=window.AKSI_WEBLLM&&window.AKSI_WEBLLM.ready&&window.AKSI_WEBLLM.ready()?"модель готова":"офлайн-режим";
    return"Работаю. Режим: "+llm+". Версия "+BUILD;
  }
  if(/умеешь|help|помощь/.test(l))
    return"Можешь просто болтать или спрашивать «что такое …». Есть память: «запомни: ключ = значение». Кнопка «включить ум» — загрузка языковой модели в браузер (нужен WebGPU, первый раз подождать). Без модели отвечаю из своей базы, но живее, чем калькулятор.";
  return null;
}
function remember(q){var m=String(q).match(/^запомни\s*[:：]?\s*(.+?)\s*[=:]\s*(.+)$/i);if(!m)return null;var k=norm(m[1]),v=m[2].trim();if(!k)return null;facts[k]=v;saveF();return"Хорошо, запомнила: «"+k+"» = «"+v+"»"}
function recall(q){var l=norm(q),keys=Object.keys(facts),i;for(i=0;i<keys.length;i++){if(l.indexOf(keys[i])>=0||keys[i].indexOf(l)>=0)return"Помню: «"+keys[i]+"» → "+facts[keys[i]]}return null}
function wikiFetch(q,cb){var term=toks(q).slice(0,4).join(" ")||q;fetch("https://ru.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(term)).then(function(r){if(!r.ok)throw new Error();return r.json()}).then(function(j){if(j&&j.extract)cb(null,(j.title||term)+": "+j.extract.slice(0,400));else cb("empty")}).catch(function(){cb("fail")})}
function setLlmLabel(t){var e=$("llm");if(e)e.textContent=t}
function tryStartLlm(){
  if(!window.AKSI_WEBLLM){setLlmLabel("нет webllm");return}
  if(window.AKSI_WEBLLM.ready&&window.AKSI_WEBLLM.ready()){setLlmLabel("ум включён");return}
  setLlmLabel("гружу ум…");
  add("a","Сейчас подгружаю языковую модель в браузер. Первый раз это может занять минуту-две. Потом ответы станут свободнее, почти как у GPT — но локально.","система");
  var p=window.AKSI_WEBLLM.load?window.AKSI_WEBLLM.load():null;
  if(p&&p.then)p.then(function(){setLlmLabel("ум включён");add("a","Готово. Можешь спрашивать свободнее — я отвечу развёрнуто.","система")}).catch(function(e){setLlmLabel("ум недоступен");add("a","Не вышло загрузить модель (нужен WebGPU / память). Остаюсь в офлайн-режиме, но всё равно отвечаю словами.","система")});
  else setLlmLabel("офлайн");
}
function answer(q,cb){
  var a=identity(q);if(a){cb(a,"id");return}
  a=remember(q);if(a){cb(a,"mem");return}
  a=recall(q);if(a){cb(a,"mem");return}
  a=mathA(q);if(a){cb(a,"math");return}
  if(/матриц|matrix|ядро/.test(norm(q))){var r=paintKernel(q);cb("Ядро сейчас: порядок "+r.qbm.H_eff.toFixed(2)+", "+r.gersh.message+".","kernel");return}
  if(window.AKSI_WEBLLM&&window.AKSI_WEBLLM.ready&&window.AKSI_WEBLLM.ready()&&window.AKSI_WEBLLM.complete){
    setLlmLabel("думаю…");
    var prompt="Ты Акси — тёплый русскоязычный помощник. Отвечай живо, простыми словами, 2–6 предложений, без канцелярита.\nВопрос: "+q;
    window.AKSI_WEBLLM.complete(prompt,{history:history.slice(-6)}).then(function(res){
      setLlmLabel("ум включён");
      if(res&&res.text){cb(res.text,"llm");return}
      var n=chattyNeuro(q);cb(n||"Не сложился ответ модели. Попробуй ещё раз.","neuro");
    }).catch(function(){setLlmLabel("ум сбой");var n=chattyNeuro(q);cb(n||"Сбой модели. Спроси иначе.","neuro")});
    return;
  }
  a=chattyNeuro(q);if(a){cb(a,"neuro");return}
  wikiFetch(q,function(err,txt){
    if(txt)cb("Нашла во внешнем источнике:\n"+txt,"wiki");
    else cb("Пока не знаю точно. Можешь переформулировать, или нажми «включить ум», если хочешь более свободные ответы (нужен WebGPU).","core");
  });
}
function add(role,text,tag){var log=$("log");if(!log)return;var d=document.createElement("div");d.className="msg "+(role==="u"?"u":"a");if(tag){var t=document.createElement("div");t.className="tag";t.textContent=tag;d.appendChild(t)}d.appendChild(document.createTextNode(text));log.appendChild(d);log.scrollTop=log.scrollHeight}
function send(){
  var inp=$("in");if(!inp)return;var q=inp.value.trim();if(!q)return;inp.value="";
  add("u",q,"");history.push({role:"user",content:q});
  answer(q,function(txt,src){
    var g=gateOf(q,txt,src);
    add("a",txt,g.status+" · "+src);
    history.push({role:"assistant",content:txt});
    if(history.length>20)history=history.slice(-20);
    paintKernel(q);
  });
