<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АКСИ Organism</title>
<meta name="theme-color" content="#0b0b0f">
<style>
:root{--bg:#0b0b0f;--card:#14141c;--ink:#f2f1eb;--muted:#9a97a3;--line:#2a2a36;--acc:#a78bfa;--warn:#e6b84d}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink);max-width:760px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.25rem;margin:8px 0}
.note{background:#1a1810;border:1px solid #3d3520;color:var(--warn);padding:12px;border-radius:12px;font-size:13px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:13px;color:var(--acc);margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
input,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#101018;color:var(--ink)}
button{cursor:pointer;background:#1a1a24}
button.p{background:var(--acc);border-color:var(--acc);color:#0b0b0f;font-weight:700}
pre{background:#0e0e14;padding:10px;border-radius:10px;font-size:11px;overflow:auto;max-height:180px;margin-top:8px;color:var(--muted);white-space:pre-wrap}
a{color:var(--muted)}
</style>
</head>
<body>
<div style="font-weight:800">АКСИ <span style="color:var(--acc)">Organism</span></div>
<h1>Стек из переписки — собран</h1>
<div class="note">Classical <b>quantum-inspired</b> browser stack. Не QPU. Не научный «first in world».</div>
<div class="card"><h2>Статус</h2><pre id="st">…</pre></div>
<div class="card"><h2>1. Cortex fidelity vault</h2>
<div class="row"><input id="pw" type="password" value="aksi"><input id="doc" style="flex:1" placeholder="текст"><button class="p" id="btnIn">ingest</button></div>
<div class="row"><input id="vq" style="flex:1" placeholder="поиск"><button id="btnVq">search</button></div>
<pre id="vOut">—</pre></div>
<div class="card"><h2>2. Think</h2>
<div class="row"><input id="tq" style="flex:1" value="что в памяти"><button class="p" id="btnThink">think</button></div>
<pre id="tOut">—</pre></div>
<div class="card"><h2>3. Labs</h2>
<div class="row">
<button id="btnZenoOn">Zeno on</button><button id="btnZenoOff">Zeno off</button>
<button id="btnEnt">Entangle</button><button id="btnFrag">HRR 30%</button>
<button id="btnChsh">CHSH</button><button id="btnZk">ZK</button>
</div><pre id="xOut">—</pre></div>
<div class="card"><h2>4. Sealed capsule</h2>
<div class="row"><button class="p" id="btnExp">Export</button><label style="font-size:13px;color:var(--muted)"><input type="file" id="imp">import</label></div>
<pre id="cOut">—</pre></div>
<p style="font-size:13px;color:var(--muted)"><a href="/">Главный продукт</a> · <a href="/HONEST.md">HONEST</a></p>
<script src="/aksi-capsule.js?v=12"></script>
<script src="/aksi-cortex-kernel.js"></script>
<script src="/aksi-quantum.js"></script>
<script src="/aksi-hrr.js"></script>
<script src="/aksi-resonance-net.js"></script>
<script src="/aksi-organism.js?v=4"></script>
<script>
(function(){
  function j(x){try{return JSON.stringify(x,null,2);}catch(e){return String(x);}}
  function el(id){return document.getElementById(id);}
  var O=window.AKSI_STACK||window.AKSI_ORGANISM;
  if(!O||!O.vaultIngest){el("st").textContent="Stack not loaded";return;}
  function paint(){el("st").textContent=j(O.status());} paint();
  if(window.AKSI_CAPSULE)AKSI_CAPSULE.remember("Organism online");
  if(window.AKSI_HRR)AKSI_HRR.get().add("hrr trace");
  el("btnIn").onclick=async function(){el("vOut").textContent=j(await O.vaultIngest(el("doc").value||"secret",el("pw").value||"aksi"));paint();};
  el("btnVq").onclick=async function(){el("vOut").textContent=j(await O.vaultSearch(el("vq").value||"secret",el("pw").value||"aksi"));};
  el("btnThink").onclick=async function(){el("tOut").textContent=j(await O.think(el("tq").value,{password:el("pw").value}));};
  el("btnZenoOn").onclick=function(){el("xOut").textContent=j(O.zenoConfigure(3000));};
  el("btnZenoOff").onclick=function(){el("xOut").textContent=j(O.zenoConfigure(0));};
  el("btnEnt").onclick=function(){el("xOut").textContent=j({seed:O.entangleSeed("A","B"),touch:O.entangleTouch("a","u","v")});};
  el("btnFrag").onclick=function(){el("xOut").textContent=j(O.hrrFragmentRestore(0.3));};
  el("btnChsh").onclick=function(){el("xOut").textContent=window.AKSI_QUANTUM&&AKSI_QUANTUM.chsh?j(AKSI_QUANTUM.chsh(256)):"no";};
  el("btnZk").onclick=function(){el("xOut").textContent=j(O.zkProve("secret","challenge"));};
  el("btnExp").onclick=async function(){var r=await O.exportOrganismCapsule({download:true});el("cOut").textContent=j({format:r.format,quantumSeal:r.quantumSeal,note:r.note});};
  el("imp").onchange=async function(e){var f=e.target.files&&e.target.files[0];if(!f)return;el("cOut").textContent=j(await O.importOrganismCapsule(await f.text()));paint();e.target.value="";};
})();
</script>
</body>
</html>
