<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06050b">
<meta name="description" content="AKSI Mesh — P2P комнаты с нуля. Proprietary.">
<title>AKSI Mesh</title>
<style>
:root{
  --bg:#06050b;--s1:#13111c;--s2:#1b1726;
  --line:rgba(167,139,250,.18);--line2:rgba(255,255,255,.07);
  --t:#f7f5ff;--m:#a8a0bd;--dim:#7a738f;
  --a:#a78bfa;--a2:#7c3aed;--ok:#34d399;
  --font:system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100dvh;color:var(--t);font:15px/1.55 var(--font);
  background:radial-gradient(ellipse 90% 55% at 50% -15%,rgba(124,58,237,.32),transparent 55%),var(--bg);
  max-width:720px;margin:0 auto;padding:16px 16px 40px;
}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{
  width:42px;height:42px;border-radius:13px;
  background:linear-gradient(145deg,#6d28d9,#a78bfa 55%,#c4b5fd);
  display:grid;place-items:center;font:800 14px/1 var(--font);color:#fff;
}
h1{font-size:18px;font-weight:750}
.sub{font-size:12px;color:var(--m)}
.card{background:var(--s2);border:1px solid var(--line2);border-radius:14px;padding:16px;margin-bottom:10px}
.card h2{font-size:14px;font-weight:650}
.muted{color:var(--m);font-size:13.5px;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{
  min-height:42px;padding:10px 14px;border-radius:12px;border:1px solid var(--line2);
  background:var(--s1);color:var(--t);font:600 13px/1 var(--font);cursor:pointer;
}
.btn.p{background:linear-gradient(135deg,var(--a2),var(--a));border:0;color:#fff}
input{
  width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);
  background:var(--s1);color:var(--t);font:inherit;
}
.msg{display:flex}.msg.me{justify-content:flex-end}
.bub{
  max-width:min(94%,460px);padding:12px 14px;border-radius:18px;
  white-space:pre-wrap;word-break:break-word;font-size:14.5px;
}
.msg.me .bub{background:linear-gradient(135deg,var(--a2),#8b5cf6);color:#fff;border-bottom-right-radius:6px}
.msg.ai .bub{background:var(--s1);border:1px solid var(--line2);border-bottom-left-radius:6px}
.meta{font-size:10.5px;color:var(--dim);margin-top:6px}
pre.out{
  background:var(--s1);border:1px solid var(--line2);border-radius:12px;padding:10px;
  overflow:auto;white-space:pre-wrap;color:var(--m);
}
a{color:var(--a)}
.pill{display:inline-flex;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;background:rgba(52,211,153,.12);color:var(--ok);margin-left:6px}
</style>
</head>
<body>
<header>
  <div class="logo">M</div>
  <div>
    <h1>AKSI Mesh <span class="pill">live</span></h1>
    <div class="sub">Система с нуля · вкладки + интернет · proprietary</div>
  </div>
</header>
<p class="muted" style="margin-bottom:14px">
  <a href="/">← АКСИ</a> · лицензия proprietary ·
  <a href="mailto:aksilove@internet.ru">aksilove@internet.ru</a>
</p>
<div id="root"></div>
<script src="aksi-mesh.js?v=1"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  if (window.AKSI_MESH) window.AKSI_MESH.mount("#root");
});
</script>
</body>
</html>
