<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>АКСИ · Путь</title>
<meta name="theme-color" content="#0f172a"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--bg:#0f172a;--card:#1e293b;--ink:#f8fafc;--muted:#94a3b8;--line:#334155;--cyan:#22d3ee;--ok:#4ade80;--warn:#fbbf24}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
#map{position:absolute;inset:0}
.top{position:fixed;top:0;left:0;right:0;z-index:5;padding:max(10px,env(safe-area-inset-top)) 12px 10px;background:linear-gradient(#0f172af2,#0f172a00)}
.top a{color:var(--muted);text-decoration:none;font-weight:600;font-size:13px}
.flags{float:right;display:flex;gap:6px}
.f{font-size:10px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.f.on{color:var(--ok);border-color:var(--ok)}
.f.warn{color:var(--warn);border-color:var(--warn)}
.card{clear:both;margin-top:10px;background:var(--card);border-radius:14px;padding:12px;border:1px solid #334155}
.card b{display:block;font-size:16px}
.card span{font-size:12px;color:var(--muted)}
.bot{position:fixed;left:8px;right:8px;bottom:max(10px,env(safe-area-inset-bottom));z-index:5;max-width:480px;margin:0 auto}
.panel{background:#0f172af5;border:1px solid #475569;border-radius:16px;padding:12px}
.m{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.m div{background:var(--card);border-radius:10px;text-align:center;padding:8px 2px}
.m b{display:block;font-size:1rem;color:var(--cyan)}
.m i{font-style:normal;font-size:9px;color:var(--muted);text-transform:uppercase}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:8px}
.row{display:flex;gap:8px}
button{flex:1;border:none;border-radius:12px;padding:12px;font:inherit;font-weight:700;color:#fff;cursor:pointer}
.g{background:linear-gradient(135deg,#06b6d4,#6366f1)}
.p{background:linear-gradient(135deg,#a855f7,#6366f1)}
.s{background:var(--card);color:var(--ink);border:1px solid var(--line)!important}
.hint{font-size:10px;color:var(--muted);margin-top:8px;line-height:1.35}
.arrow-wrap{width:40px;height:40px;margin-left:-20px;margin-top:-20px;display:flex;align-items:center;justify-content:center}
.arrow{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:30px solid #22d3ee;filter:drop-shadow(0 0 8px #22d3ee);transform-origin:50% 70%}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <a href="/">АКСИ</a>
  <div class="flags">
    <span class="f" id="f-gps">GPS</span>
    <span class="f" id="f-pdr">PDR</span>
    <span class="f" id="f-off">OFFLINE</span>
  </div>
  <div class="card"><b id="t1">Нажмите «Вести»</b><span id="t2">Стрелка идёт с вами · офлайн: GPS+инерция</span></div>
</div>
<div class="bot">
  <div class="panel">
    <div class="m">
      <div><b id="spd">—</b><i>км/ч</i></div>
      <div><b id="hdg">—</b><i>курс</i></div>
      <div><b id="acc">—</b><i>точн.м</i></div>
      <div><b id="mode">—</b><i>режим</i></div>
    </div>
    <input id="dest" placeholder="Куда? (нужен интернет для маршрута)"/>
    <div class="row">
      <button class="p" id="btn-go" type="button">Вести</button>
      <button class="g" id="btn-rt" type="button">Маршрут</button>
      <button class="s" id="btn-st" type="button">Стоп</button>
    </div>
    <p class="hint">Офлайн: стрелка двигается по GPS без сети. Если GPS пропал — включается PDR (шаги+компас). Тайлы карты кэшируются. Маршрут A→B нужен интернет (OSRM).</p>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
"use strict";
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(function(){});

var map=L.map("map",{zoomControl:false}).setView([55.75,37.62],16);
L.control.zoom({position:"bottomright"}).addTo(map);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OSM"}).addTo(map);

var watchId=null,on=false,last=null,lastGpsAt=0,hdg=0,marker=null,trail=null,pts=[];
var routeLine=null,steps=[],stepI=0,destMark=null;
var pdrActive=false,stepLen=0.75,accMagPrev=0,stepCooldown=0;

function $(id){return document.getElementById(id);}
function setF(id,cls){$(id).className="f"+(cls?" "+cls:"");}
function offlineFlag(){setF("f-off",navigator.onLine?"":"on");$("f-off").textContent=navigator.onLine?"ONLINE":"OFFLINE";}
offlineFlag();addEventListener("online",offlineFlag);addEventListener("offline",offlineFlag);

function ensureMarker(lat,lon,bearing){
  if(bearing!=null&&!isNaN(bearing))hdg=bearing;
  if(!marker){
    marker=L.marker([lat,lon],{icon:L.divIcon({className:"",html:'<div class="arrow-wrap"><div class="arrow" id="ar"></div></div>',iconSize:[40,40],iconAnchor:[20,20]}),zIndexOffset:999}).addTo(map);
  }else marker.setLatLng([lat,lon]);
  setTimeout(function(){var a=$("ar");if(a)a.style.transform="rotate("+hdg+"deg)";},0);
}

function haversine(a,b){
  var R=6371000,t=Math.PI/180,dLat=(b.lat-a.lat)*t,dLon=(b.lon-a.lon)*t;
  var x=Math.sin(dLat/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function destPoint(lat,lon,brng,dist){
  var R=6371000,to=Math.PI/180,from=180/Math.PI;
  var φ1=lat*to,λ1=lon*to,δ=dist/R,θ=brng*to;
  var φ2=Math.asin(Math.sin(φ1)*Math.cos(δ)+Math.cos(φ1)*Math.sin(δ)*Math.cos(θ));
  var λ2=λ1+Math.atan2(Math.sin(θ)*Math.sin(δ)*Math.cos(φ1),Math.cos(δ)-Math.sin(φ1)*Math.sin(φ2));
  return{lat:φ2*from,lon:((λ2*from+540)%360)-180};
}

function applyPos(lat,lon,spd,bearing,acc,src){
  if(bearing!=null&&!isNaN(bearing))hdg=bearing;
  else if(last){
    var dlon=lon-last.lon,dlat=lat-last.lat;
    if(Math.abs(dlon)+Math.abs(dlat)>1e-6)hdg=(Math.atan2(dlon,dlat)*180/Math.PI+360)%360;
  }
  ensureMarker(lat,lon,hdg);
  last={lat:lat,lon:lon};pts.push([lat,lon]);
  if(pts.length>1){if(trail)map.removeLayer(trail);trail=L.polyline(pts.slice(-400),{color:"#22d3ee",weight:4,opacity:.6}).addTo(map);}
  if(on){map.panTo([lat,lon],{animate:true,duration:.3});if(map.getZoom()<16)map.setZoom(17);}
  $("spd").textContent=spd!=null&&!isNaN(spd)?Math.max(0,Math.round(spd*3.6)):"—";
  $("hdg").textContent=Math.round(hdg)+"°";
  $("acc").textContent=acc!=null?Math.round(acc):"—";
  $("mode").textContent=src;
  $("t1").textContent=src==="PDR"?"Инерция (PDR)":"Вы на карте";
  $("t2").textContent=src==="PDR"?"GPS слабо — идём по компасу и шагам":"Стрелка = курс";
  if(steps.length)tickSteps(lat,lon);
}

function onGps(pos){
  lastGpsAt=Date.now();pdrActive=false;setF("f-gps","on");setF("f-pdr","");
  applyPos(pos.coords.latitude,pos.coords.longitude,pos.coords.speed,pos.coords.heading,pos.coords.accuracy,"GPS");
}
function onGpsErr(){setF("f-gps","warn");$("t2").textContent="GPS нет · пробуем PDR";}

// ——— PDR: when GPS stale, move arrow by compass + step detection ———
function onOrient(ev){
  var h=ev.webkitCompassHeading!=null?ev.webkitCompassHeading:(ev.alpha!=null?(360-ev.alpha):null);
  if(h!=null&&!isNaN(h))hdg=h;
  if(pdrActive&&last)ensureMarker(last.lat,last.lon,hdg);
}
function onMotion(ev){
  if(!on||!last)return;
  var a=ev.accelerationIncludingGravity;if(!a)return;
  var mag=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2);
  // peak detect ~step
  if(accMagPrev>11.5&&mag<accMagPrev&&(Date.now()-stepCooldown)>320){
    stepCooldown=Date.now();
    // if GPS older than 4s → pure PDR step
    if(Date.now()-lastGpsAt>4000){
      pdrActive=true;setF("f-pdr","on");setF("f-gps","warn");
      var np=destPoint(last.lat,last.lon,hdg,stepLen);
      applyPos(np.lat,np.lon,stepLen/0.5,hdg,null,"PDR");
    }
  }
  accMagPrev=mag;
}

function tickSteps(lat,lon){
  while(stepI<steps.length-1){
    var s=steps[stepI],end=s.maneuver&&s.maneuver.location;if(!end)break;
    if(haversine({lat:lat,lon:lon},{lat:end[1],lon:end[0]})<40)stepI++;else break;
  }
  var cur=steps[stepI];
  $("t1").textContent=(cur&&cur.maneuver&&cur.maneuver.instruction)||"По маршруту";
}

function start(){
  on=true;
  if(watchId==null)watchId=navigator.geolocation.watchPosition(onGps,onGpsErr,{enableHighAccuracy:true,maximumAge:500,timeout:10000});
  window.addEventListener("deviceorientation",onOrient,true);
  window.addEventListener("devicemotion",onMotion,true);
  $("t1").textContent="Ведём…";
  navigator.geolocation.getCurrentPosition(onGps,onGpsErr,{enableHighAccuracy:true,timeout:8000});
}
function stop(){
  on=false;pdrActive=false;
  if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  window.removeEventListener("deviceorientation",onOrient,true);
  window.removeEventListener("devicemotion",onMotion,true);
  $("t1").textContent="Стоп";$("mode").textContent="—";
}

async function route(){
  var q=$("dest").value.trim();if(!q){$("t1").textContent="Куда?";return;}
  if(!navigator.onLine){$("t1").textContent="Маршрут нужен интернет";return;}
  if(!last){try{await new Promise(function(r,j){navigator.geolocation.getCurrentPosition(function(p){onGps(p);r();},j,{enableHighAccuracy:true,timeout:8000});});}catch(e){$("t1").textContent="Нужен GPS";return;}}
  $("t1").textContent="Строим…";
  try{
    var g=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q),{headers:{"Accept-Language":"ru"}}).then(function(r){return r.json();});
    if(!g[0])throw new Error("Не найден");
    var B={lat:+g[0].lat,lon:+g[0].lon};
    if(destMark)map.removeLayer(destMark);destMark=L.marker([B.lat,B.lon]).addTo(map);
    var data=await fetch("https://router.project-osrm.org/route/v1/driving/"+last.lon+","+last.lat+";"+B.lon+","+B.lat+"?overview=full&geometries=geojson&steps=true").then(function(r){return r.json();});
    if(data.code!=="Ok")throw new Error("Нет пути");
    var rt=data.routes[0];
    if(routeLine)map.removeLayer(routeLine);
    routeLine=L.geoJSON(rt.geometry,{style:{color:"#a855f7",weight:6,opacity:.85}}).addTo(map);
    steps=[];(rt.legs||[]).forEach(function(l){(l.steps||[]).forEach(function(s){steps.push(s);});});stepI=0;
    map.fitBounds(routeLine.getBounds(),{padding:[60,60,160,60]});
    $("t1").textContent="Маршрут готов";$("t2").textContent=Math.round(rt.distance/100)/10+" км";
    start();
  }catch(e){$("t1").textContent=e.message||"Ошибка";}
}

$("btn-go").onclick=start;$("btn-st").onclick=stop;$("btn-rt").onclick=route;
})();
</script>
</body>
</html>
