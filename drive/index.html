<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Навигатор АКСИ</title>
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; font-family: system-ui, sans-serif; background: #0f172a; color: #fff; overflow: hidden; }
#map { position: absolute; top: 0; left: 0; right: 0; bottom: 160px; }
.bar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 160px;
  background: #1e293b; padding: 12px 14px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  border-top: 3px solid #22d3ee;
}
.bar a { color: #22d3ee; font-weight: 700; font-size: 1rem; text-decoration: none; }
#info { font-size: 1.15rem; font-weight: 700; margin: 8px 0; min-height: 1.4em; }
.row { display: flex; gap: 8px; }
button {
  flex: 1; min-height: 52px; border: none; border-radius: 12px;
  font-size: 1.1rem; font-weight: 800; color: #fff;
}
#go { background: #7c3aed; }
#stop { background: #334155; }
.arrow-wrap { width: 44px; height: 44px; margin-left: -22px; margin-top: -22px; display: flex; align-items: center; justify-content: center; }
.arrow {
  width: 0; height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-bottom: 34px solid #22d3ee;
  filter: drop-shadow(0 0 8px #22d3ee);
  transform-origin: 50% 70%;
}
</style>
</head>
<body>
<div id="map"></div>
<div class="bar">
  <a href="/">← МЕНЮ</a>
  <div id="info">Нажмите ВЕСТИ</div>
  <div class="row">
    <button type="button" id="go">ВЕСТИ</button>
    <button type="button" id="stop">СТОП</button>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var map = L.map("map", { zoomControl: true }).setView([55.75, 37.62], 15);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
  var watchId = null, marker = null, hdg = 0, last = null;
  var info = document.getElementById("info");

  function setArrow(lat, lon, bearing) {
    if (bearing != null && !isNaN(bearing)) hdg = bearing;
    if (!marker) {
      marker = L.marker([lat, lon], {
        icon: L.divIcon({
          className: "",
          html: '<div class="arrow-wrap"><div class="arrow" id="ar"></div></div>',
          iconSize: [44, 44],
          iconAnchor: [22, 22]
        })
      }).addTo(map);
    } else marker.setLatLng([lat, lon]);
    setTimeout(function () {
      var a = document.getElementById("ar");
      if (a) a.style.transform = "rotate(" + hdg + "deg)";
    }, 0);
    map.panTo([lat, lon]);
    last = { lat: lat, lon: lon };
  }

  function onPos(pos) {
    var lat = pos.coords.latitude, lon = pos.coords.longitude;
    var b = pos.coords.heading;
    if (b == null || isNaN(b)) {
      if (last) {
        var dlon = lon - last.lon, dlat = lat - last.lat;
        if (Math.abs(dlon) + Math.abs(dlat) > 1e-6)
          b = (Math.atan2(dlon, dlat) * 180 / Math.PI + 360) % 360;
      }
    }
    setArrow(lat, lon, b);
    var spd = pos.coords.speed;
    info.textContent = "Вы здесь" + (spd != null && !isNaN(spd) ? " · " + Math.max(0, Math.round(spd * 3.6)) + " км/ч" : "");
  }
  function onErr(err) {
    info.textContent = err.code === 1 ? "Разрешите геолокацию в настройках" : "Нет GPS";
  }

  document.getElementById("go").onclick = function () {
    info.textContent = "Ищем спутники…";
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(onPos, onErr, {
      enableHighAccuracy: true, maximumAge: 500, timeout: 15000
    });
  };
  document.getElementById("stop").onclick = function () {
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    info.textContent = "Стоп";
  };
})();
</script>
</body>
</html>
