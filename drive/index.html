<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>АКСИ · В пути</title>
<meta name="theme-color" content="#020617"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--bg:#020617;--ink:#f8fafc;--muted:#94a3b8;--cyan:#22d3ee;--violet:#a855f7;--ok:#4ade80;--warn:#fbbf24}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;overflow:hidden}
#map{position:absolute;inset:0;z-index:0}
.top{position:fixed;top:0;left:0;right:0;z-index:5;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(rgba(2,6,23,.95),transparent);pointer-events:none}
.top a{pointer-events:auto;color:var(--muted);text-decoration:none;font-size:13px}
.pill{pointer-events:auto;font-size:11px;padding:6px 10px;border-radius:999px;background:rgba(15,23,42,.9);border:1px solid rgba(34,211,238,.3)}
.pill.on{border-color:var(--ok);color:var(--ok)}
.dash{position:fixed;left:10px;right:10px;bottom:70px;z-index:5;max-width:480px;margin:0 auto;background:rgba(2,6,23,.92);border:1px solid rgba(168,85,247,.35);border-radius:18px;padding:12px 14px;backdrop-filter:blur(12px)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-bottom:10px}
.metrics div{background:#0f172a;border-radius:12px;padding:8px 4px}
.metrics b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums;color:var(--cyan)}
.metrics span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:600}
.pri{background:linear-gradient(135deg,#a855f7,#4f46e5);color:#fff;flex:1}
.g{background:#1e293b;color:var(--ink);border:1px solid #334155}
.note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.4}
.note em{color:var(--warn);font-style:normal}
#wx{font-size:12px;color:var(--cyan);margin-top:6px}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <a href="/">АКСИ</a>
  <span class="pill" id="net">…</span>
  <span class="pill" id="gps">GPS</span>
</div>
<div class="dash">
  <div class="metrics">
    <div><b id="spd">—</b><span>км/ч</span></div>
    <div><b id="hdg">—</b><span>курс°</span></div>
    <div><b id="acc">—</b><span>точность м</span></div>
    <div><b id="dist">0</b><span>км трек</span></div>
  </div>
  <div class="row">
    <button type="button" class="pri" id="btn-start">Старт трека</button>
    <button type="button" class="g" id="btn-stop">Стоп</button>
    <button type="button" class="g" id="btn-wx">Осадки</button>
  </div>
  <div id="wx">Погода: —</div>
  <p class="note"><em>Честно:</em> GPS работает без мобильного интернета. Если сигнал спутников <b>глушат</b> — ни одно приложение на Земле не узнает координаты. Карта офлайн — из кеша тайлов, которые вы уже открывали. Маршрут A→B без сети требует заранее скачанных данных.</p>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/nav.js"></script>
<script>
(function(){
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("/sw.js").catch(function(){});
  }
  var map=L.map("map",{zoomControl:true}).setView([55.75,37.62],13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:18,attribution:"© OSM"
  }).addTo(map);

  var watchId=null, marker=null, line=null, pts=[], last=null, trackKm=0;
  var gpsEl=document.getElementById("gps");
  var netEl=document.getElementById("net");

  function setNet(){
    netEl.textContent=navigator.onLine?"онлайн":"офлайн";
    netEl.className="pill"+(navigator.onLine?"":" on");
  }
  setNet();
  window.addEventListener("online",setNet);
  window.addEventListener("offline",setNet);

  function haversine(a,b){
    var R=6371,to=Math.PI/180;
    var dLat=(b.lat-a.lat)*to,dLon=(b.lon-a.lon)*to;
    var x=Math.sin(dLat/2)**2+Math.cos(a.lat*to)*Math.cos(b.lat*to)*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(x));
  }

  function onPos(pos){
    var lat=pos.coords.latitude, lon=pos.coords.longitude;
    var spd=pos.coords.speed; // m/s or null
    var hdg=pos.coords.heading;
    var acc=pos.coords.accuracy;
    document.getElementById("spd").textContent=spd!=null&&!isNaN(spd)?(spd*3.6).toFixed(0):"—";
    document.getElementById("hdg").textContent=hdg!=null&&!isNaN(hdg)?Math.round(hdg):"—";
    document.getElementById("acc").textContent=acc!=null?Math.round(acc):"—";
    gpsEl.textContent="GPS ✓";gpsEl.className="pill on";

    var p={lat:lat,lon:lon,t:Date.now()};
    if(last){
      var d=haversine(last,p);
      if(d<50){trackKm+=d;document.getElementById("dist").textContent=trackKm.toFixed(2);}
    }
    last=p;pts.push([lat,lon]);
    try{sessionStorage.setItem("AKSI_TRACK",JSON.stringify(pts.slice(-2000)));}catch(e){}

    if(!marker){
      marker=L.circleMarker([lat,lon],{radius:8,color:"#22d3ee",fillColor:"#a855f7",fillOpacity:1,weight:3}).addTo(map);
      map.setView([lat,lon],16);
    }else{
      marker.setLatLng([lat,lon]);
      map.panTo([lat,lon],{animate:true,duration:0.5});
    }
    if(line)map.removeLayer(line);
    if(pts.length>1)line=L.polyline(pts,{color:"#22d3ee",weight:4,opacity:0.85}).addTo(map);
  }
  function onErr(err){
    gpsEl.textContent=err.code===1?"GPS запрещён":err.code===2?"нет сигнала":"GPS таймаут";
    gpsEl.className="pill";
  }

  document.getElementById("btn-start").onclick=function(){
    if(!navigator.geolocation){alert("Нет геолокации");return;}
    if(watchId!=null)return;
    pts=[];trackKm=0;last=null;
    watchId=navigator.geolocation.watchPosition(onPos,onErr,{
      enableHighAccuracy:true,maximumAge:1000,timeout:15000
    });
    gpsEl.textContent="GPS…";
  };
  document.getElementById("btn-stop").onclick=function(){
    if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;}
    gpsEl.textContent="стоп";gpsEl.className="pill";
  };

  document.getElementById("btn-wx").onclick=async function(){
    var el=document.getElementById("wx");
    if(!last){el.textContent="Сначала включите трек (нужна точка)";return;}
    if(!navigator.onLine){el.textContent="Осадки: нет сети (нужен интернет для погоды)";return;}
    el.textContent="Загрузка…";
    try{
      var url="https://api.open-meteo.com/v1/forecast?latitude="+last.lat+"&longitude="+last.lon+"&current=temperature_2m,precipitation,weather_code,wind_speed_10m&timezone=auto";
      var j=await fetch(url).then(function(r){return r.json();});
      var c=j.current||{};
      el.textContent="Сейчас: "+(c.temperature_2m!=null?c.temperature_2m+"°C":"—")+
        ", осадки "+(c.precipitation!=null?c.precipitation+" мм":"—")+
        ", ветер "+(c.wind_speed_10m!=null?c.wind_speed_10m+" км/ч":"—");
    }catch(e){el.textContent="Погода недоступна";}
  };
})();
</script>
</body>
</html>
