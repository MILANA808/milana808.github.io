<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Навигатор</title>
<meta name="theme-color" content="#5b21b6">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: #0f172a;
  color: #fff;
  overflow: hidden;
}
/* колонка: карта сверху, кнопки снизу — кнопки ВСЕГДА на экране */
.wrap {
  height: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}
#map {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  background: #1e293b;
}
.controls {
  flex: 0 0 auto;
  background: #1e293b;
  border-top: 4px solid #22d3ee;
  padding: 12px 14px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
}
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.top a {
  color: #22d3ee;
  font-weight: 800;
  font-size: 18px;
  text-decoration: none;
  padding: 6px 0;
}
#status {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 10px;
  line-height: 1.3;
  min-height: 24px;
}
#dest {
  width: 100%;
  box-sizing: border-box;
  font-size: 16px;
  padding: 14px;
  border-radius: 12px;
  border: 2px solid #64748b;
  background: #0f172a;
  color: #fff;
  margin-bottom: 10px;
}
.btns {
  display: flex;
  gap: 8px;
}
.btns button {
  flex: 1;
  height: 56px;
  border: none;
  border-radius: 14px;
  font-size: 17px;
  font-weight: 800;
  color: #fff;
  -webkit-appearance: none;
  appearance: none;
}
#btn-go { background: #7c3aed; }
#btn-route { background: #0891b2; }
#btn-stop { background: #475569; }
.arrow-box {
  width: 52px;
  height: 52px;
  margin-left: -26px;
  margin-top: -26px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.arrow {
  width: 0;
  height: 0;
  border-left: 16px solid transparent;
  border-right: 16px solid transparent;
  border-bottom: 40px solid #22d3ee;
  filter: drop-shadow(0 0 10px #22d3ee);
  transform-origin: 50% 70%;
}
.leaflet-control-attribution { font-size: 9px !important; }
</style>
</head>
<body>
<div class="wrap">
  <div id="map"></div>
  <div class="controls">
    <div class="top">
      <a href="/">← МЕНЮ</a>
      <span id="spd" style="color:#94a3b8;font-weight:700;font-size:16px">— км/ч</span>
    </div>
    <div id="status">Нажмите ВЕСТИ</div>
    <input id="dest" type="text" placeholder="Куда едем?" enterkeyhint="go" autocomplete="off">
    <div class="btns">
      <button type="button" id="btn-go">ВЕСТИ</button>
      <button type="button" id="btn-route">ПУТЬ</button>
      <button type="button" id="btn-stop">СТОП</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  // карта в flex-блоке — invalidateSize после загрузки
  var map = L.map("map", { zoomControl: true }).setView([55.75, 37.62], 15);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "© OSM"
  }).addTo(map);
  setTimeout(function () { map.invalidateSize(); }, 200);
  window.addEventListener("resize", function () { map.invalidateSize(); });

  var watchId = null;
  var marker = null;
  var routeLine = null;
  var destMark = null;
  var last = null;
  var hdg = 0;
  var status = document.getElementById("status");
  var spdEl = document.getElementById("spd");

  function setArrow(lat, lon, bearing) {
    if (bearing != null && !isNaN(bearing)) hdg = bearing;
    if (!marker) {
      marker = L.marker([lat, lon], {
        icon: L.divIcon({
          className: "",
          html: '<div class="arrow-box"><div class="arrow" id="arrow"></div></div>',
          iconSize: [52, 52],
          iconAnchor: [26, 26]
        }),
        zIndexOffset: 1000
      }).addTo(map);
    } else {
      marker.setLatLng([lat, lon]);
    }
    setTimeout(function () {
      var el = document.getElementById("arrow");
      if (el) el.style.transform = "rotate(" + hdg + "deg)";
    }, 0);
    map.panTo([lat, lon], { animate: true, duration: 0.25 });
    if (map.getZoom() < 16) map.setZoom(17);
  }

  function onPos(pos) {
    var lat = pos.coords.latitude;
    var lon = pos.coords.longitude;
    var bearing = pos.coords.heading;
    var spd = pos.coords.speed;
    if ((bearing == null || isNaN(bearing)) && last) {
      var dlon = lon - last.lon;
      var dlat = lat - last.lat;
      if (Math.abs(dlon) + Math.abs(dlat) > 0.00001) {
        bearing = (Math.atan2(dlon, dlat) * 180 / Math.PI + 360) % 360;
      }
    }
    setArrow(lat, lon, bearing);
    last = { lat: lat, lon: lon };
    if (spd != null && !isNaN(spd)) {
      spdEl.textContent = Math.max(0, Math.round(spd * 3.6)) + " км/ч";
    }
    status.textContent = "Вы на карте";
  }

  function onErr(err) {
    if (err.code === 1) status.textContent = "Разрешите геолокацию";
    else status.textContent = "Нет GPS — выйдите на улицу";
  }

  function start() {
    if (!navigator.geolocation) {
      status.textContent = "Нет геолокации на телефоне";
      return;
    }
    status.textContent = "Ищем GPS…";
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(onPos, onErr, {
      enableHighAccuracy: true,
      maximumAge: 500,
      timeout: 15000
    });
  }

  function stop() {
    if (watchId != null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    status.textContent = "Стоп";
  }

  async function buildRoute() {
    var q = (document.getElementById("dest").value || "").trim();
    if (!q) {
      status.textContent = "Напишите адрес";
      return;
    }
    if (!navigator.onLine) {
      status.textContent = "Нужен интернет для пути";
      return;
    }
    status.textContent = "Ищем вас…";
    if (!last) {
      try {
        await new Promise(function (resolve, reject) {
          navigator.geolocation.getCurrentPosition(function (p) {
            onPos(p);
            resolve();
          }, reject, { enableHighAccuracy: true, timeout: 10000 });
        });
      } catch (e) {
        status.textContent = "Включите GPS";
        return;
      }
    }
    status.textContent = "Строим путь…";
    try {
      var geo = await fetch(
        "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(q),
        { headers: { "Accept-Language": "ru" } }
      ).then(function (r) { return r.json(); });
      if (!geo || !geo[0]) throw new Error("Адрес не найден");
      var B = { lat: +geo[0].lat, lon: +geo[0].lon };
      if (destMark) map.removeLayer(destMark);
      destMark = L.marker([B.lat, B.lon]).addTo(map);
      var url =
        "https://router.project-osrm.org/route/v1/driving/" +
        last.lon + "," + last.lat + ";" + B.lon + "," + B.lat +
        "?overview=full&geometries=geojson";
      var data = await fetch(url).then(function (r) { return r.json(); });
      if (data.code !== "Ok" || !data.routes || !data.routes[0]) throw new Error("Нет пути");
      var rt = data.routes[0];
      if (routeLine) map.removeLayer(routeLine);
      routeLine = L.geoJSON(rt.geometry, {
        style: { color: "#a855f7", weight: 6, opacity: 0.9 }
      }).addTo(map);
      map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });
      status.textContent = (rt.distance / 1000).toFixed(1) + " км · " + Math.round(rt.duration / 60) + " мин";
      start();
    } catch (e) {
      status.textContent = e.message || "Ошибка";
    }
  }

  document.getElementById("btn-go").onclick = start;
  document.getElementById("btn-stop").onclick = stop;
  document.getElementById("btn-route").onclick = buildRoute;
})();
</script>
</body>
</html>
