<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>АКСИ</title>
<meta name="theme-color" content="#5b21b6">
<link rel="manifest" href="/manifest.webmanifest">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:system-ui,-apple-system,sans-serif;background:#f3effc;color:#1a1030}
body{max-width:480px;margin:0 auto;display:flex;flex-direction:column;min-height:100dvh}
header{flex:0 0 auto;background:#5b21b6;color:#fff;padding:max(12px,env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center}
header strong{font-size:1.15rem}
header a{color:#fff;font-size:12px;font-weight:700;text-decoration:none}
.panel{flex:1 1 auto;min-height:0;display:none;flex-direction:column}
.panel.on{display:flex}
#thread{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
.msg{max-width:92%;padding:12px 14px;border-radius:14px;margin-bottom:10px;font-size:16px;line-height:1.45;word-break:break-word}
.msg.me{background:#5b21b6;color:#fff;margin-left:auto}
.msg.bot{background:#fff;border:1px solid #e4dcf5}
.msg .src{display:block;margin-top:6px;font-size:11px;font-weight:700;color:#7c3aed}
.hint{text-align:center;color:#6b6280;padding:24px 12px;font-size:15px}
.hint button{display:block;width:100%;margin:8px 0 0;padding:14px;border-radius:12px;border:2px solid #5b21b6;background:#fff;color:#5b21b6;font-size:15px;font-weight:700}
.bar{flex:0 0 auto;display:flex;gap:8px;padding:10px 12px;border-top:1px solid #e4dcf5;background:#fff}
.bar input{flex:1;font-size:16px;padding:12px;border-radius:12px;border:2px solid #ddd}
.bar button{width:56px;border:none;border-radius:12px;background:#5b21b6;color:#fff;font-size:1.2rem;font-weight:800}
.net-body{flex:1;overflow-y:auto;padding:14px}
.net-body input,.net-body textarea{width:100%;font-size:16px;padding:12px;border-radius:12px;border:2px solid #ddd;margin-bottom:8px;font-family:inherit}
.net-body textarea{min-height:88px}
#save-net{width:100%;padding:14px;border:none;border-radius:12px;background:#5b21b6;color:#fff;font-size:16px;font-weight:800;margin-bottom:14px}
.card{background:#fff;border:1px solid #e4dcf5;border-radius:12px;padding:12px;margin-bottom:8px}
.more{flex:1;overflow-y:auto;padding:14px}
.more a{display:block;padding:16px;margin-bottom:10px;background:#fff;border:1px solid #e4dcf5;border-radius:14px;text-decoration:none;color:#1a1030;font-weight:700;font-size:16px}
.more a small{display:block;font-weight:500;color:#6b6280;margin-top:4px;font-size:13px}
nav.tabs{flex:0 0 auto;display:flex;border-top:1px solid #e4dcf5;background:#fff;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;border:none;background:transparent;padding:10px 4px;font-size:11px;font-weight:700;color:#6b6280}
nav.tabs button.on{color:#5b21b6}
nav.tabs button .ic{display:block;font-size:18px;margin-bottom:2px}
</style>
</head>
<body>
<header>
  <strong>АКСИ</strong>
  <a href="/precedent/">Прецедент</a>
</header>
<section class="panel on" id="p-chat">
  <div id="thread"><div class="hint" id="hint">Спросите АКСИ
    <button type="button" data-q="ты здесь?">Ты здесь?</button>
    <button type="button" data-q="что умеешь?">Что умеешь?</button>
  </div></div>
  <div class="bar"><input id="inp" type="text" placeholder="Сообщение…" enterkeyhint="send"><button type="button" id="send">OK</button></div>
</section>
<section class="panel" id="p-net">
  <div class="net-body">
    <p style="margin-bottom:10px;color:#6b6280;font-size:13px">Знания для чата (локально)</p>
    <input id="nt" placeholder="Заголовок"><textarea id="nb" placeholder="Текст…"></textarea>
    <button type="button" id="save-net">Сохранить</button>
    <div id="nlist"></div>
  </div>
</section>
<section class="panel" id="p-more">
  <div class="more">
    <a href="/precedent/">Прецедент<small>DID · квант · подписи</small></a>
    <a href="/nav/">Навигатор<small>GPS и маршрут</small></a>
    <a href="/backup/">Бэкап</a>
    <a href="/live/">Live</a>
  </div>
</section>
<nav class="tabs">
  <button type="button" class="on" data-p="chat"><span class="ic">✦</span>Чат</button>
  <button type="button" data-p="net"><span class="ic">◈</span>Сеть</button>
  <button type="button" id="go-nav"><span class="ic">➤</span>Путь</button>
  <button type="button" data-p="more"><span class="ic">☰</span>Ещё</button>
</nav>
<script>
(function(){
var panels={chat:document.getElementById("p-chat"),net:document.getElementById("p-net"),more:document.getElementById("p-more")};
document.querySelectorAll("nav.tabs [data-p]").forEach(function(b){b.onclick=function(){var n=b.getAttribute("data-p");Object.keys(panels).forEach(function(k){panels[k].classList.toggle("on",k===n);});document.querySelectorAll("nav.tabs [data-p]").forEach(function(x){x.classList.toggle("on",x===b);});};});
document.getElementById("go-nav").onclick=function(){location.href="/nav/";};
var NET_KEY="AKSI_NET_V1";
function loadNet(){try{var a=JSON.parse(localStorage.getItem(NET_KEY)||"[]");return Array.isArray(a)?a:[];}catch(e){return[];}}
function renderNet(){var list=loadNet().filter(function(p){return p.ts>0;}).slice(0,40);var root=document.getElementById("nlist");root.innerHTML="";if(!list.length){root.innerHTML="<p style=color:#6b6280>Пусто</p>";return;}list.forEach(function(p){var d=document.createElement("div");d.className="card";d.innerHTML="<b></b><div style=color:#6b6280;font-size:14px;margin-top:4px></div>";d.querySelector("b").textContent=p.title;d.querySelector("div").textContent=String(p.body||"").slice(0,160);root.appendChild(d);});}
document.getElementById("save-net").onclick=function(){var t=document.getElementById("nt").value.trim(),b=document.getElementById("nb").value.trim();if(!t||!b)return;var list=loadNet();list.unshift({id:"u_"+Date.now().toString(36),title:t,body:b,tags:[],ts:Date.now()});localStorage.setItem(NET_KEY,JSON.stringify(list));document.getElementById("nt").value="";document.getElementById("nb").value="";renderNet();};
renderNet();
async function reply(q){
  var low=q.toLowerCase();
  if(/привет|здравств/.test(low))return{t:"Здравствуйте. АКСИ на связи.",s:null};
  if(/ты здесь|кто ты/.test(low))return{t:"Да. Локальный агент. Прецедент: /precedent/",s:"Состояние"};
  if(/умеешь|help|помощ/.test(low))return{t:"Чат, сеть знаний, навигатор, прецедент (DID+квант+подписи), бэкап.",s:"Справка"};
  if(/навигатор|путь/.test(low))return{t:"Вкладка Путь или /nav/ — ВЕСТИ и ПУТЬ.",s:"Справка"};
  var words=low.split(/\s+/),best=null,sc=0;
  loadNet().forEach(function(p){var blob=((p.title||"")+" "+(p.body||"")).toLowerCase(),s=0;words.forEach(function(w){if(w.length>1&&blob.indexOf(w)>=0)s+=2;});if(s>sc){sc=s;best=p;}});
  if(best&&sc>=2)return{t:best.body,s:"Сеть · "+best.title};
  if(navigator.onLine){try{var query=q.replace(/^(что такое|кто такой)\s+/i,"").trim();var s=await fetch("https://ru.wikipedia.org/w/api.php?action=opensearch&search="+encodeURIComponent(query)+"&limit=1&format=json&origin=*").then(function(r){return r.json();});if(s[1]&&s[1][0]){var j=await fetch("https://ru.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(s[1][0])).then(function(r){return r.json();});if(j.extract)return{t:j.title+".\n\n"+String(j.extract).slice(0,700),s:"Wikipedia"};}}catch(e){}}
  return{t:"Нет ответа в сети. Добавьте знание во вкладке Сеть.",s:null};
}
var thread=document.getElementById("thread"),hint=document.getElementById("hint");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function add(me,text,src){if(hint)hint.style.display="none";var d=document.createElement("div");d.className="msg "+(me?"me":"bot");d.innerHTML=esc(text).replace(/\n/g,"<br>")+(src?"<span class=\"src\">"+esc(src)+"</span>":"");thread.appendChild(d);thread.scrollTop=thread.scrollHeight;}
async function ask(t){t=(t||document.getElementById("inp").value||"").trim();if(!t)return;document.getElementById("inp").value="";add(true,t);var r=await reply(t);add(false,r.t,r.s);}
document.getElementById("send").onclick=function(){ask();};
document.getElementById("inp").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();ask();}});
document.querySelectorAll("[data-q]").forEach(function(b){b.onclick=function(){ask(b.getAttribute("data-q"));};});
})();
</script>
</body>
</html>
