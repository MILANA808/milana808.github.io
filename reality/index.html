<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe5d2">
<title>АКСИ Reality Layer</title>
<style>
:root{--s:#fbf7ef;--s2:#efe6d6;--ink:#2a241c;--muted:#7a6f60;--line:#ddd0bb;--a:#6b4f35;--ok:#2f6b48}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.45 system-ui,sans-serif;background:linear-gradient(165deg,#f7f0e4,#efe5d2);color:var(--ink);min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 56px}
.card{background:var(--s);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:18px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin:4px 0 12px}
.cap{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cap:last-child{border-bottom:0}
.cap b{display:block;font-size:13px}.cap small{color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 12px;background:var(--a);color:#fff;font-weight:800}
button.off{background:var(--s2);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.out{margin-top:10px;font-family:ui-monospace,monospace;font-size:11px;background:#2a241c;color:#efe6d6;border-radius:10px;padding:10px;white-space:pre-wrap;max-height:280px;overflow:auto}
.muted{color:var(--muted);font-size:12px}
.badge{display:inline-block;background:#e8f2ea;color:var(--ok);font-weight:800;font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid #b7d4c2}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <span class="badge">observe-only</span>
    <h1>АКСИ Reality Layer</h1>
    <p class="sub"><a href="/">← хаб</a> · <a href="/contour/">Contour</a> · <a href="/sovereign/index.html">Sovereign</a></p>
    <p class="muted">Наблюдения → RealityEvent. Opt-in. Без автономных действий. Доступ ≠ истина.</p>
  </div>
  <div class="card">
    <h3 style="font-size:12px;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Capabilities</h3>
    <div id="caps"></div>
  </div>
  <div class="card">
    <div class="row">
      <button type="button" id="loc">Геолокация</button>
      <button type="button" id="cam">Камера (probe)</button>
      <button type="button" id="mic">Микрофон (probe)</button>
      <button type="button" id="net">Сеть</button>
      <button type="button" class="off" id="state">World State</button>
    </div>
    <pre class="out" id="out">—</pre>
  </div>
</div>
<script src="/aksi-reality.js?v=280"></script>
<script>
(function(){
  var R=window.AKSI_REALITY;
  function $(id){return document.getElementById(id)}
  var defs=[['geolocation','Геолокация'],['camera','Камера'],['microphone','Микрофон'],['network','Сеть']];
  function render(){
    var c=R.capabilities();
    $('caps').innerHTML=defs.map(function(d){
      return '<div class="cap"><div><b>'+d[1]+'</b><small>'+d[0]+'</small></div><button type="button" class="'+(c[d[0]]?'':'off')+'" data-cap="'+d[0]+'">'+(c[d[0]]?'ON':'OFF')+'</button></div>';
    }).join('');
    document.querySelectorAll('[data-cap]').forEach(function(b){
      b.onclick=function(){R.setCapability(b.getAttribute('data-cap'),!R.capabilities()[b.getAttribute('data-cap')]);render()};
    });
  }
  function show(v){$('out').textContent=JSON.stringify(v,null,2)}
  $('loc').onclick=async function(){try{show(await R.observeLocation())}catch(e){show({error:e.message})}};
  $('cam').onclick=async function(){try{show(await R.requestMedia('camera'))}catch(e){show({error:e.message})}};
  $('mic').onclick=async function(){try{show(await R.requestMedia('microphone'))}catch(e){show({error:e.message})}};
  $('net').onclick=async function(){try{show(await R.networkProbe())}catch(e){show({error:e.message})}};
  $('state').onclick=function(){show(R.worldState())};
  render(); show(R.status());
})();
</script>
</body>
</html>
