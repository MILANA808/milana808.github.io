<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0812">
<meta name="description" content="АКСИ — суверенная Decision Integrity платформа. Offline Brain RU.">
<title>АКСИ</title>
<style>
:root{--bg:#0a0812;--ink:#f4f0ff;--muted:#a89bb8;--line:rgba(180,150,255,.22);--v:#a978ff;--c:#67e8f9;--ok:#6ee7a0;--card:rgba(18,12,32,.92)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.45 system-ui,-apple-system,sans-serif;background:radial-gradient(ellipse at 20% 0%,#2a1860 0%,transparent 50%),var(--bg);color:var(--ink);min-height:100vh}
a{color:var(--c);text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 88px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#b681ff,#5b2fc0);display:grid;place-items:center;font-weight:900}
.badge{margin-left:auto;font-size:11px;font-weight:900;background:var(--ok);color:#0a0812;padding:5px 10px;border-radius:999px}
h1{font-size:clamp(22px,5vw,30px);font-weight:900;letter-spacing:-.03em}
.lead{color:var(--muted);margin:6px 0 14px;font-size:13px}
.composer{display:flex;gap:8px;margin-bottom:10px}
input#q{flex:1;padding:14px 14px;border-radius:14px;border:1px solid var(--line);background:#120e1c;color:var(--ink);font:inherit}
button#go{padding:14px 18px;border:0;border-radius:14px;background:linear-gradient(135deg,#b681ff,#5b2fc0);color:#fff;font-weight:900;cursor:pointer;font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);padding:8px 12px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer}
.out{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;white-space:pre-wrap;word-break:break-word;min-height:120px;font-size:14px}
.meta{margin-top:8px;font-size:12px;color:var(--muted)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.nav a{padding:10px 14px;border-radius:12px;border:1px solid var(--line);font-weight:800;font-size:12px;color:var(--ink)}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px;margin-top:14px}
.mod{font-size:11px;font-weight:800;padding:8px;border-radius:10px;border:1px solid var(--line);text-align:center}
.mod.on{border-color:var(--ok);color:var(--ok)}
.foot{margin-top:24px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">A</div>
    <div>
      <h1>АКСИ</h1>
      <div class="lead">Decision Integrity · Brain fusion · offline-first</div>
    </div>
    <div class="badge">LIVE</div>
  </div>
  <div class="composer">
    <input id="q" placeholder="Спросите АКСИ…" autofocus autocomplete="off">
    <button type="button" id="go">→</button>
  </div>
  <div class="chips">
    <button type="button" data-q="кто ты">кто ты</button>
    <button type="button" data-q="миссия">миссия</button>
    <button type="button" data-q="формула">формула</button>
    <button type="button" data-q="что умеешь">что умеешь</button>
    <button type="button" data-q="как пользоваться">как пользоваться</button>
  </div>
  <div class="out" id="out">Загрузка ядра…</div>
  <div class="meta" id="meta"></div>
  <div class="mods" id="mods"></div>
  <div class="nav">
    <a href="/platform.html">Platform</a>
    <a href="/contour/">Contour</a>
    <a href="/sovereign/index.html">Sovereign</a>
    <a href="/reality/">Reality</a>
    <a href="/crypto/">Crypto</a>
  </div>
  <p class="foot">aksilove@internet.ru</p>
</div>
<script src="/aksi-neuro.js?v=302"></script>
<script src="/aksi-crystal.js?v=302"></script>
<script src="/aksi-mind.js?v=302"></script>
<script src="/aksi-brain-ru.js?v=302"></script>
<script src="/aksi-pi-contour.js?v=302"></script>
<script src="/aksi-reality.js?v=302"></script>
<script src="/aksi-api.js?v=302"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function mods(){
    var list = [
      ['BRAIN', !!window.AKSI_BRAIN],
      ['MIND', !!window.AKSI_MIND],
      ['CRYSTAL', !!window.AKSI_CRYSTAL],
      ['NEURO', !!window.AKSI_NEURO],
      ['API', !!(window.AKSI && AKSI.decide)],
      ['PI', !!(window.AKSI_PI_CONTOUR && AKSI_PI_CONTOUR.process)],
      ['REALITY', !!window.AKSI_REALITY]
    ];
    $('mods').innerHTML = list.map(function(m){
      return '<div class="mod '+(m[1]?'on':'')+'">'+m[0]+'</div>';
    }).join('');
  }
  async function ask(q){
    q = String(q || $('q').value || '').trim();
    if (!q) return;
    $('q').value = q;
    $('out').textContent = '…';
    $('meta').textContent = '';
    try {
      var p;
      if (window.AKSI_BRAIN) p = await AKSI_BRAIN.decide(q);
      else if (window.AKSI) p = await AKSI.decide(q);
      else p = { answer: 'Ядро ещё грузится. Обновите страницу (Ctrl+Shift+R).', source: 'boot' };
      $('out').textContent = p.answer || p.text || '—';
      $('meta').textContent = 'source: ' + (p.source || '?') + (p.version ? ' · ' + p.version : '');
    } catch (e) {
      $('out').textContent = String(e && e.message || e);
    }
    mods();
  }
  $('go').onclick = function(){ ask(); };
  $('q').addEventListener('keydown', function(e){ if (e.key === 'Enter') ask(); });
  document.querySelectorAll('[data-q]').forEach(function(b){
    b.onclick = function(){ ask(b.getAttribute('data-q')); };
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js?v=302').catch(function(){});
  }
  function boot(){
    mods();
    if (window.AKSI_BRAIN || window.AKSI) ask('кто ты');
    else {
      $('out').textContent = 'Подключение модулей…';
      setTimeout(boot, 300);
    }
  }
  setTimeout(boot, 150);
  setTimeout(mods, 800);
})();
</script>
</body>
</html>
