<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>АКСИ</title>
<style>
:root{--bg:#09090b;--elev:#111113;--card:#18181b;--line:#27272a;--t:#fafafa;--m:#a1a1aa;--dim:#71717a;--a2:#7c3aed;--ok:#4ade80;--font:system-ui,-apple-system,sans-serif;--safe-b:env(safe-area-inset-bottom,0px);--pad:16px;--max:720px}
*{box-sizing:border-box;margin:0;padding:0}html{height:100%}body{min-height:100%;min-height:100dvh;background:var(--bg);color:var(--t);font:15px/1.5 var(--font);display:flex;flex-direction:column;max-width:var(--max);margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
@media(min-width:768px){:root{--pad:20px;--max:800px}body{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
header{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px var(--pad);border-bottom:1px solid var(--line);background:rgba(9,9,11,.94);backdrop-filter:blur(16px);position:sticky;top:0;z-index:30}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#6d28d9,#a78bfa);display:grid;place-items:center;font:700 13px/1 var(--font)}
header h1{font-size:15px;font-weight:650}header .sub{font-size:11px;color:var(--m)}#st{margin-left:auto;font-size:11px;color:var(--ok)}
nav{display:flex;gap:4px;padding:8px var(--pad);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:56px;z-index:20;background:var(--bg)}nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-height:36px;padding:8px 14px;border-radius:999px;border:0;background:0;color:var(--m);font:12.5px/1 var(--font);font-weight:500}nav button.on{background:var(--card);color:var(--t)}
main{flex:1;overflow:auto;padding:var(--pad);padding-bottom:calc(88px + var(--safe-b))}.panel{display:none}.panel.on{display:block}
#thread{display:flex;flex-direction:column;gap:12px}.msg{display:flex}.msg.me{justify-content:flex-end}
.bub{max-width:min(92%,440px);padding:12px 14px;border-radius:16px;white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.5}
.msg.me .bub{background:var(--a2);color:#fff;border-bottom-right-radius:5px}.msg.ai .bub{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.meta{display:block;margin-top:8px;font:10px/1.3 ui-monospace,monospace;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{min-height:36px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--elev);color:var(--t);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.card h2{font-size:14px;margin:0 0 8px}.muted{color:var(--m);font-size:13px;line-height:1.55}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.btn{min-height:42px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--elev);color:var(--t);font:13px/1 var(--font)}.btn.p{background:var(--a2);border:0;color:#fff}
input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--t);font:inherit;outline:0}textarea{min-height:110px;resize:vertical}
.fact{padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:13px;background:var(--bg)}.fact button{float:right;border:0;background:0;color:var(--dim);font-size:16px;min-width:28px;min-height:28px}
.bar{position:fixed;left:0;right:0;bottom:0;max-width:var(--max);margin:0 auto;padding:10px var(--pad) calc(10px + var(--safe-b));display:flex;gap:10px;background:linear-gradient(transparent,var(--bg) 35%);z-index:40}
.bar input{flex:1;min-height:48px;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--t);font:inherit}.bar button{width:48px;height:48px;border-radius:14px;border:0;background:var(--a2);color:#fff;font-size:18px;flex-shrink:0}
</style>
</head>
<body>
<header><div class="logo">A</div><div><h1>АКСИ</h1><div class="sub">личное ядро · v1.1</div></div><span id="st">онлайн</span></header>
<nav>
<button type="button" class="on" data-tab="chat">Чат</button>
<button type="button" data-tab="teach">Учить</button>
<button type="button" data-tab="mem">Память</button>
<button type="button" data-tab="about">О продукте</button>
</nav>
<main>
<section class="panel on" id="tab-chat"><div id="thread"></div>
<div class="chips">
<button type="button" class="chip" data-ask="привет">привет</button>
<button type="button" class="chip" data-ask="кто ты">кто ты</button>
<button type="button" class="chip" data-ask="что умеешь">возможности</button>
<button type="button" class="chip" data-ask="что ты знаешь">память</button>
</div></section>
<section class="panel" id="tab-teach"><div class="card"><h2>Обучить</h2><p class="muted">В чате: <b>запомни: факт</b></p>
<textarea id="teachBox" placeholder="Меня зовут Альфия" style="margin-top:10px"></textarea>
<div class="row"><button type="button" class="btn p" id="btnTeach">Запомнить</button></div></div></section>
<section class="panel" id="tab-mem"><div class="card"><h2>Память · <span id="memN">0</span></h2><div id="memList"></div>
<div class="row"><button type="button" class="btn" id="btnExp">Экспорт</button><button type="button" class="btn" id="btnImp">Импорт</button><button type="button" class="btn" id="btnWipe">Стереть</button></div>
<input type="file" id="impFile" accept=".json" hidden></div></section>
<section class="panel" id="tab-about"><div class="card"><h2>Продукт</h2><p class="muted">АКСИ — локальное ядро: чат, обучение, память.</p></div>
<div class="card"><h2>Контакт</h2><p class="muted">aksilove@internet.ru</p></div></section>
</main>
<div class="bar"><input id="inp" type="text" placeholder="Спросить АКСИ…" enterkeyhint="send" autocomplete="off"><button type="button" id="send">↑</button></div>
<script>
(function(){
"use strict";
var KEY="aksi_v11_mem",VER="1.1",busy=false;
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function status(t){var el=$("st");if(el)el.textContent=t;}
function loadMem(){try{var a=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(a)?a.filter(function(x){return x&&typeof x.t==="string"&&x.t.trim();}):[];}catch(e){return[];}}
function saveMem(a){try{localStorage.setItem(KEY,JSON.stringify(a.slice(0,500)));}catch(e){}renderMem();}
function addFact(t,src){t=String(t||"").trim();if(!t||t.length>2000)return false;var a=loadMem();for(var i=0;i<a.length;i++)if(a[i].t.toLowerCase()===t.toLowerCase()){a.splice(i,1);break;}a.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:t,src:src||"u",ts:Date.now()});saveMem(a);return true;}
function renderMem(){var a=loadMem(),n=$("memN"),list=$("memList");if(n)n.textContent=String(a.length);if(!list)return;if(!a.length){list.innerHTML="<p class='muted'>Пусто — научи АКСИ</p>";return;}list.innerHTML=a.map(function(x){return "<div class='fact'><button type='button' data-del='"+esc(x.id)+"'>×</button>"+esc(x.t)+"</div>";}).join("");}
function showTab(name){document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("on");});document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-tab")===name);});var el=$("tab-"+name);if(el)el.classList.add("on");if(name==="mem")renderMem();}
function bubble(role,text,meta){var th=$("thread");if(!th)return;var d=document.createElement("div");d.className="msg "+(role==="me"?"me":"ai");d.innerHTML="<div class='bub'>"+esc(text)+(meta?"<span class='meta'>"+esc(meta)+"</span>":"")+"</div>";th.appendChild(d);var main=document.querySelector("main");if(main)main.scrollTop=main.scrollHeight;}
var STOP={"и":1,"в":1,"не":1,"на":1,"я":1,"с":1,"что":1,"а":1,"то":1,"как":1,"это":1,"по":1,"из":1,"за":1,"от":1,"для":1,"но":1,"да":1,"ты":1,"вы":1,"мы":1,"он":1,"она":1,"они":1,"же":1,"бы":1,"ли":1,"или":1,"если":1,"уже":1,"еще":1,"ещё":1,"только":1,"может":1,"есть":1,"был":1,"была":1,"было":1,"the":1,"a":1,"is":1,"to":1,"of":1};
function stem(w){w=w.toLowerCase();if(w.length<5)return w;var ends=["иями","ями","ами","иях","ях","ов","ев","ом","ем","ах","ию","ью","ия","ья","ие","ье","ый","ий","ой","ая","яя","ое","ее","ые","ишь","ешь","ите","ете","ать","ять","ить"];for(var i=0;i<ends.length;i++){var e=ends[i];if(w.length-e.length>=3&&w.slice(-e.length)===e)return w.slice(0,-e.length);}return w;}
function tokens(s){return String(s).toLowerCase().replace(/ё/g,"е").replace(/[^a-zа-я0-9\s]+/g," ").split(/\s+/).map(stem).filter(function(w){return w.length>1&&!STOP[w];});}
function uniq(arr){var o={},out=[],i;for(i=0;i<arr.length;i++)if(!o[arr[i]]){o[arr[i]]=1;out.push(arr[i]);}return out;}
function overlapScore(qTokens,text){var tt=tokens(text),set={},i,sc=0;for(i=0;i<tt.length;i++)set[tt[i]]=1;for(i=0;i<qTokens.length;i++)if(set[qTokens[i]])sc+=1;if(tt.length)sc+=sc/Math.max(tt.length,1)*0.5;return sc;}
var KB=[{k:["кто","ты","представься","акси"],a:"Я АКСИ "+VER+" — твоё личное локальное ядро.\n\nОтвечаю из знаний и фактов, которым ты учишь.\n\naksilove@internet.ru"},{k:["привет","здравств","добрый","hello","hi"],a:"Привет. АКСИ на связи.\n\nСпроси что угодно или: запомни: факт"},{k:["умеешь","возможн","команд","help","помоги","функци"],a:"• чат из знаний и памяти\n• запомни: … — обучение\n• Память — экспорт/импорт\n• офлайн после загрузки"},{k:["контакт","email","почта"],a:"aksilove@internet.ru"},{k:["продукт","прода","цена","куп"],a:"АКСИ — personal runtime. Пиши: aksilove@internet.ru"},{k:["офлайн","облако","приват","безопас"],a:"Чат и память в браузере. Факты в localStorage этого устройства."},{k:["учить","запомн","обуч","памят","факт"],a:"Напиши: запомни: факт\nИли вкладка «Учить».\nПотом: что ты знаешь"}];
function intent(q){var low=q.toLowerCase().trim();if(/^(запомни|выучи|remember)\s*[:\s]/.test(low))return"teach";if(/забудь всё|очисти память/.test(low))return"wipe";if(/что ты знаешь|что помнишь|моя память|покажи факт/.test(low))return"list";if(/который час|сколько времени|время сейчас|какая дата|какое число/.test(low))return"time";if(/^(привет|здравств|добрый|hello|hi)\b/.test(low))return"hi";return"ask";}
function retrieve(q){var qt=uniq(tokens(q)),hits=[],i,s,low=q.toLowerCase();var mem=loadMem();for(i=0;i<mem.length;i++){s=overlapScore(qt,mem[i].t);if(low.length>2&&mem[i].t.toLowerCase().indexOf(low)!==-1)s+=3;if(s>0)hits.push({text:mem[i].t,score:s+1.5,src:"mem"});}for(i=0;i<KB.length;i++){s=overlapScore(qt,KB[i].k.join(" ")+" "+KB[i].a);for(var j=0;j<KB[i].k.length;j++)if(low.indexOf(KB[i].k[j])!==-1)s+=2.5;if(s>0)hits.push({text:KB[i].a,score:s,src:"kb"});}hits.sort(function(a,b){return b.score-a.score;});return hits;}
function answer(q){q=String(q||"").trim();if(!q)return"";var it=intent(q);if(it==="teach"){var raw=q.replace(/^(запомни|выучи|remember)\s*[:\s]*/i,"").trim();if(!raw)return"Напиши так:\nзапомни: меня зовут Альфия";addFact(raw,"chat");return"Запомнила ✓\n«"+raw+"»\n\nВсего фактов: "+loadMem().length;}if(it==="wipe"){saveMem([]);return"Память очищена.";}if(it==="list"){var a=loadMem();if(!a.length)return"Пока ничего не помню.\nНаучи: запомни: …";return"Помню "+a.length+":\n\n"+a.slice(0,20).map(function(x,i){return (i+1)+". "+x.t;}).join("\n");}if(it==="time"){try{return"Сейчас (МСК):\n"+new Intl.DateTimeFormat("ru-RU",{timeZone:"Europe/Moscow",dateStyle:"full",timeStyle:"medium"}).format(new Date());}catch(e){return new Date().toLocaleString("ru-RU");}}if(it==="hi")return"Привет. АКСИ "+VER+" на связи.\n\nСпроси «кто ты», «возможности» или учи фактам.";var hits=retrieve(q);if(!hits.length)return"Не нашла точного ответа.\n\n• запомни: факт\n• что ты знаешь\n• кто ты\n\nФактов: "+loadMem().length;if(hits[0].src==="kb"&&hits[0].score>=3)return hits[0].text;var memHits=hits.filter(function(h){return h.src==="mem"&&h.score>=1;}).slice(0,5);if(memHits.length){if(memHits.length===1)return"Из памяти:\n"+memHits[0].text;return"Из памяти:\n\n"+memHits.map(function(h,i){return (i+1)+". "+h.text;}).join("\n");}if(hits[0].score>=1.5)return hits[0].text;return"Похоже на это:\n"+hits[0].text+"\n\nУточни или: запомни: …";}
function chat(q){q=String(q||"").trim();if(!q||busy)return;busy=true;try{bubble("me",q);var inp=$("inp");if(inp)inp.value="";status("…");var t0=Date.now();var text=answer(q)||"Попробуй переформулировать.";bubble("ai",text,(Date.now()-t0)+" мс · АКСИ "+VER);status("онлайн");showTab("chat");}catch(e){bubble("ai","Ошибка ядра: "+(e&&e.message?e.message:e),"err");status("онлайн");}busy=false;}
document.addEventListener("click",function(e){var el=e.target.closest?e.target.closest("button,[data-tab],[data-ask],[data-del]"):e.target;if(!el)return;var tab=el.getAttribute("data-tab");if(tab){showTab(tab);return;}var ask=el.getAttribute("data-ask");if(ask){chat(ask);return;}var del=el.getAttribute("data-del");if(del){saveMem(loadMem().filter(function(x){return x.id!==del;}));return;}if(el.id==="send"){chat(($("inp")||{}).value||"");return;}if(el.id==="btnTeach"){var box=$("teachBox"),v=box&&box.value;if(!v||!String(v).trim()){status("пусто");return;}var n=0;String(v).split(/\n+/).forEach(function(line){if(line.trim()&&addFact(line.trim(),"teach"))n++;});if(box)box.value="";bubble("ai","Сохранено: "+n+". Всего: "+loadMem().length);showTab("chat");return;}if(el.id==="btnExp"){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({product:"AKSI",ver:VER,facts:loadMem()},null,2)],{type:"application/json"}));a.download="aksi-memory.json";a.click();return;}if(el.id==="btnImp"){var f=$("impFile");if(f)f.click();return;}if(el.id==="btnWipe"){if(confirm("Стереть память?"))saveMem([]);return;}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target&&e.target.id==="inp"){e.preventDefault();chat(e.target.value);}});
var imp=$("impFile");if(imp)imp.addEventListener("change",function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result),facts=j.facts||[],cur=loadMem();facts.forEach(function(x){if(x&&x.t)cur.unshift({id:x.id||Date.now().toString(36),t:String(x.t),src:x.src||"imp",ts:x.ts||Date.now()});});saveMem(cur);status("импорт");}catch(err){status("ошибка файла");}};r.readAsText(f);e.target.value="";});
try{if(!localStorage.getItem("aksi_v11_seed")){["АКСИ — личное локальное ядро","Контакт: aksilove@internet.ru"].forEach(function(t){addFact(t,"seed");});localStorage.setItem("aksi_v11_seed","1");}}catch(e){}
renderMem();status("онлайн");
bubble("ai","АКСИ "+VER+"\n\nАлгоритм обновлён: лучше ищет по памяти.\nЖми «привет» или: запомни: …","старт");
})();
</script>
</body>
</html>
