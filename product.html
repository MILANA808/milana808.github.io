<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>АКСИ — нейросеть отвечает</title>
<meta name="description" content="АКСИ: ответы нейросети в браузере (WebLLM Qwen).">
<meta name="theme-color" content="#0c0c10">
<link rel="canonical" href="https://milana808.github.io/product.html">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0c0c10;--card:#14141a;--ink:#f0efe9;--muted:#9a97a3;--line:#2a2a33;--acc:#7c6cf0;--ok:#3ecf8e}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.logo{font-weight:800}.logo span{color:var(--acc)}
header a{color:var(--muted);text-decoration:none;font-size:13px;margin-left:12px}
.banner{max-width:720px;margin:0 auto;padding:14px 16px;width:100%}
.banner h1{font-size:1.15rem;margin-bottom:6px}
.banner p{color:var(--muted);font-size:14px}
.status{max-width:720px;margin:0 auto;padding:0 16px 10px;width:100%;font-size:13px;color:var(--muted)}
.status b{color:var(--ok)}
.bar-top{max-width:720px;margin:0 auto;padding:0 16px 12px;width:100%;display:flex;flex-wrap:wrap;gap:8px}
.bar-top button{font:inherit;font-size:13px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.bar-top button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.bar-top button:disabled{opacity:.55}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-width:720px;margin:0 auto;padding:0 16px 10px;width:100%}
.chips button{font:inherit;font-size:13px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.msgs{flex:1;overflow:auto;max-width:720px;width:100%;margin:0 auto;padding:8px 16px;display:flex;flex-direction:column;gap:12px;min-height:40vh}
.msg{padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word;max-width:95%}
.msg.user{align-self:flex-end;background:#1a1a24}
.msg .meta{margin-top:8px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.msg.typing{color:var(--muted);font-style:italic}
.composer{max-width:720px;width:100%;margin:0 auto;padding:12px 16px 20px;display:flex;gap:8px;border-top:1px solid var(--line)}
.composer input{flex:1;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#101014;color:var(--ink);font:inherit;font-size:16px}
.composer button{min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
.composer button:disabled{opacity:.5}
</style>
</head>
<body>
<header>
  <div class="logo">АКСИ <span>нейросеть</span></div>
  <nav>
    <a href="/seal.html">О продукте</a>
    <a href="/">Главная</a>
  </nav>
</header>
<div class="banner">
  <h1>Спросите — ответит нейросеть</h1>
  <p>Ответы генерирует локальная LLM (WebLLM / Qwen) в браузере. Первый раз модель скачается, дальше работает у вас.</p>
</div>
<div class="status" id="st">Статус: модель не загружена</div>
<div class="bar-top">
  <button type="button" class="primary" id="btnLoad">Включить нейросеть</button>
  <button type="button" id="btnAsk">Спросить пример</button>
</div>
<div class="chips">
  <button type="button" data-q="Объясни простыми словами, что такое искусственный интеллект">Что такое ИИ?</button>
  <button type="button" data-q="Напиши короткий дружеский совет, как не выгорать на работе">Совет</button>
  <button type="button" data-q="Придумай 3 идеи для полезного offline-приложения">Идеи</button>
</div>
<div class="msgs" id="msgs" role="log" aria-live="polite"></div>
<div class="composer">
  <input id="q" type="text" placeholder="Напишите вопрос — получите ответ нейросети" enterkeyhint="send" aria-label="Вопрос">
  <button type="button" id="go">Спросить</button>
</div>
<script src="/aksi-webllm.js?v=3"></script>
<script src="/aksi-neuro.js?v=10"></script>
<script>
(function () {
  var busy = false;
  function setStatus(t) { document.getElementById("st").innerHTML = t; }
  function paintStatus() {
    if (!window.AKSI_WEBLLM) { setStatus("Статус: модуль WebLLM не найден"); return; }
    var s = AKSI_WEBLLM.status();
    if (s.loading) setStatus("Статус: загрузка нейросети… <b>" + (s.progress || 0) + "%</b> — " + (s.message || ""));
    else if (s.ready) setStatus("Статус: <b>нейросеть готова</b> · " + (s.model || "") + " · " + (s.backend || ""));
    else if (s.error) setStatus("Статус: ошибка — " + s.error);
    else setStatus("Статус: нажмите «Включить нейросеть» (один раз, несколько минут)");
  }
  function add(role, text, meta) {
    var d = document.createElement("div");
    d.className = "msg " + role;
    d.textContent = text;
    if (meta) { var m = document.createElement("div"); m.className = "meta"; m.textContent = meta; d.appendChild(m); }
    document.getElementById("msgs").appendChild(d);
    d.scrollIntoView({ block: "end" });
  }
  function addTyping() {
    var d = document.createElement("div");
    d.className = "msg typing"; d.id = "typing"; d.textContent = "Нейросеть думает…";
    document.getElementById("msgs").appendChild(d);
    d.scrollIntoView({ block: "end" });
  }
  function clearTyping() { var t = document.getElementById("typing"); if (t) t.remove(); }
  add("bot",
    "Я отвечаю как обычная нейросеть: генерирую текст по вашему вопросу.\n\n1) Нажмите «Включить нейросеть»\n2) Дождитесь статуса «готова»\n3) Задайте вопрос\n\nЕсли спросить раньше — модель загрузится сама и потом ответит.",
    "WebLLM · локальная LLM"
  );
  window.addEventListener("aksi-webllm-progress", paintStatus);
  paintStatus();
  function ensureModel() {
    if (!window.AKSI_WEBLLM) return Promise.reject(new Error("WebLLM не загружен"));
    if (AKSI_WEBLLM.ready()) return Promise.resolve(true);
    var p = AKSI_WEBLLM.autoLoad ? AKSI_WEBLLM.autoLoad() : AKSI_WEBLLM.load();
    return Promise.resolve(p).then(function () {
      paintStatus();
      if (!AKSI_WEBLLM.ready()) throw new Error("Модель не стала ready");
      return true;
    });
  }
  document.getElementById("btnLoad").onclick = function () {
    var btn = document.getElementById("btnLoad");
    btn.disabled = true;
    add("bot", "Включаю нейросеть (скачивание в браузер). Подождите…", "загрузка");
    ensureModel().then(function () {
      btn.disabled = false;
      add("bot", "Нейросеть готова. Задайте любой вопрос.", "модель on");
    }).catch(function (e) {
      btn.disabled = false;
      add("bot", "Не удалось загрузить: " + (e.message || e) + "\nНужны Chrome/Edge, лучше с WebGPU.", "ошибка");
      paintStatus();
    });
  };
  async function answerWithNN(q) {
    if (window.AKSI_WEBLLM && AKSI_WEBLLM.ready()) {
      var r = await AKSI_WEBLLM.complete(q, {
        system: "Ты полезный русскоязычный ассистент АКСИ. Отвечай только по-русски, ясно, полными предложениями, по делу.",
        max_tokens: 400,
        temperature: 0.5
      });
      if (r && r.text) return { text: r.text, meta: "нейросеть · " + (r.model || "WebLLM") + " · " + (r.backend || "local") };
      if (r && r.error) throw new Error(r.error);
    }
    if (window.AKSI_NEURO && AKSI_NEURO.think) {
      var n = AKSI_NEURO.think(q);
      if (n && n.text && n.text.length > 20) return { text: n.text, meta: "Neuro (слабее) · offline" };
    }
    throw new Error("Нет готовой модели. Нажмите «Включить нейросеть».");
  }
  async function sendQuestion(q) {
    q = String(q || "").trim();
    if (!q || busy) return;
    busy = true;
    document.getElementById("go").disabled = true;
    add("user", q);
    try {
      if (!window.AKSI_WEBLLM || !AKSI_WEBLLM.ready()) {
        add("bot", "Модель не включена — загружаю, затем отвечу…", "автозагрузка");
        await ensureModel();
        add("bot", "Модель загружена. Генерирую ответ…", "ok");
      }
      addTyping();
      var out = await answerWithNN(q);
      clearTyping();
      add("bot", out.text, out.meta);
    } catch (e) {
      clearTyping();
      add("bot", "Ошибка: " + (e.message || e), "сбой");
    }
    busy = false;
    document.getElementById("go").disabled = false;
    document.getElementById("q").focus();
    paintStatus();
  }
  document.getElementById("go").onclick = function () {
    var q = document.getElementById("q").value;
    document.getElementById("q").value = "";
    sendQuestion(q);
  };
  document.getElementById("q").addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      var q = document.getElementById("q").value;
      document.getElementById("q").value = "";
      sendQuestion(q);
    }
  });
  document.getElementById("btnAsk").onclick = function () {
    sendQuestion("Объясни простыми словами, зачем людям искусственный интеллект");
  };
  document.querySelectorAll(".chips button").forEach(function (b) {
    b.onclick = function () { sendQuestion(b.getAttribute("data-q")); };
  });
})();
</script>
</body>
</html>
