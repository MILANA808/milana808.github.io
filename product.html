<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>АКСИ Product — Unified Runtime</title>
<meta name="description" content="AKSI unified: Bot + Cortex + Fly-Gate + Research. Offline-first sovereign agent.">
<meta name="theme-color" content="#080910">
<style>
:root{--bg:#080910;--ink:#f0f0f6;--muted:#8b8b9a;--violet:#a78bfa;--green:#4ade80;--red:#f87171;--line:#1c1c28;--card:#0e0e16}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.45 system-ui,sans-serif;background:radial-gradient(circle at 40% -20%,#1a1630,#080910 50%);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.logo{font-weight:950}.logo span{color:var(--violet)}
header a{color:var(--muted);text-decoration:none;font-size:12px;margin-left:10px}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px;max-width:900px;margin:0 auto;width:100%}
@media(max-width:700px){#board{grid-template-columns:1fr 1fr}}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.metric span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.metric b{font-size:14px}
.ok{color:var(--green)}.no{color:var(--red)}
.msgs{flex:1;overflow-y:auto;padding:12px 16px;max-width:900px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-height:40vh}
.msg{max-width:92%;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#151528}
.msg .meta{font-size:11px;color:var(--muted);margin-top:6px}
.badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;background:#1a1a28;margin-right:4px}
.bar{max-width:900px;width:100%;margin:0 auto;padding:12px 16px 20px;display:flex;gap:8px;border-top:1px solid var(--line)}
.bar input{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0a0a12;color:var(--ink);font:inherit;font-size:16px}
.bar button{background:var(--violet);color:#fff;border:0;border-radius:12px;padding:14px 18px;font-weight:800;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-width:900px;margin:0 auto;padding:0 16px 8px;width:100%}
.chips button{font-size:12px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:#15151f;color:var(--ink);cursor:pointer}
.hint{max-width:900px;margin:0 auto;padding:0 16px 8px;font-size:12px;color:var(--muted);width:100%}
</style>
</head>
<body>
<header>
  <div class="logo">АКСИ <span>Product</span></div>
  <nav>
    <a href="/infinity.html">Infinity</a>
    <a href="/bot.html">Bot</a>
    <a href="/brain.html">Brain</a>
    <a href="/matrix/">MATRIX</a>
    <a href="/">Home</a>
  </nav>
</header>

<div id="board">
  <div class="metric"><span>Bot</span><b id="m-bot">…</b></div>
  <div class="metric"><span>Cortex</span><b id="m-cx">…</b></div>
  <div class="metric"><span>Fly-Gate</span><b id="m-gate">…</b></div>
  <div class="metric"><span>Organism</span><b id="m-org">…</b></div>
</div>

<p class="hint">Единый runtime: память (Cortex) · research (Wikipedia) · gate (Fly) · organism. Offline-first. «запомни:» · «исследуй:» · вопрос.</p>

<div class="chips">
  <button type="button" data-q="статус">Статус</button>
  <button type="button" data-q="запомни: AKSI Product — unified Bot+Cortex+Fly-Gate+Research">Научить</button>
  <button type="button" data-q="исследуй: искусственный интеллект">Research ИИ</button>
  <button type="button" data-q="что такое AKSI Product">Память</button>
  <button type="button" data-q="Кто ты?">Кто ты</button>
</div>

<div class="msgs" id="msgs"></div>
<div class="bar">
  <input id="q" type="text" placeholder="запомни: … · исследуй: … · вопрос" enterkeyhint="send">
  <button type="button" id="go">▶</button>
</div>

<script src="/aksi-fly-brain.js?v=2"></script>
<script src="/aksi-fly-gate.js?v=2"></script>
<script src="/aksi-receipt.js?v=2"></script>
<script src="/aksi-organism.js?v=13"></script>
<script src="/agent.js?v=4"></script>
<script src="/aksi-cortex-kernel.js?v=3"></script>
<script src="/aksi-bot.js?v=5"></script>
<script>
(function(){
  var B = window.AKSI_BOT;
  if (!B) { document.getElementById('m-bot').textContent = 'missing'; return; }

  function paintStatus(s) {
    document.getElementById('m-bot').textContent = 'v' + (s.version || '?');
    document.getElementById('m-bot').className = 'ok';
    document.getElementById('m-cx').textContent = (s.cortex ? 'on' : 'off') + ' · ' + (s.cortexDocs || 0) + ' docs';
    document.getElementById('m-cx').className = s.cortex ? 'ok' : 'no';
    document.getElementById('m-gate').textContent = s.flyGate ? 'on' : 'off';
    document.getElementById('m-gate').className = s.flyGate ? 'ok' : 'no';
    document.getElementById('m-org').textContent = s.organism ? 'on' : 'off';
    document.getElementById('m-org').className = s.organism ? 'ok' : 'no';
  }

  B.status().then(paintStatus);

  function add(role, text, meta) {
    var d = document.createElement('div');
    d.className = 'msg ' + role;
    d.textContent = text;
    if (meta) {
      var m = document.createElement('div');
      m.className = 'meta';
      m.innerHTML = meta;
      d.appendChild(m);
    }
    document.getElementById('msgs').appendChild(d);
    d.scrollIntoView({ block: 'end' });
  }

  add('bot', ['AKSI Product v1.3 — unified runtime.', 'Bot + Cortex AES-GCM + Fly-Gate + local research.', 'Команды: запомни: · исследуй: · обычный вопрос.'].join('\n'));

  async function send() {
    var q = document.getElementById('q').value.trim();
    if (!q) return;
    document.getElementById('q').value = '';
    add('user', q);
    document.getElementById('go').disabled = true;
    try {
      var out = await B.think(q);
      var meta = '<span class="badge">' + (out.source || '') + '</span>';
      if (out.gate) meta += '<span class="badge ' + (out.gate.decision === 'ALLOWED' ? 'ok' : 'no') + '">gate ' + out.gate.decision + '</span>';
      if (out.sources) meta += ' · ' + out.sources.length + ' sources';
      if (out.score != null) meta += ' · score ' + Number(out.score).toFixed(3);
      add('bot', out.text || '—', meta);
    } catch (e) {
      add('bot', 'Ошибка: ' + e.message);
    }
    document.getElementById('go').disabled = false;
    B.status().then(paintStatus);
  }

  document.getElementById('go').onclick = send;
  document.getElementById('q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') send();
  });
  document.querySelectorAll('.chips button').forEach(function (b) {
    b.onclick = function () {
      document.getElementById('q').value = b.getAttribute('data-q');
      send();
    };
  });
})();
</script>
</body>
</html>
