<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>АКСИ ARIN v2 FULL</title>
<meta name="description" content="ARIN v2 FULL — полная комплексная resonance-нейросеть АКСИ">
<meta name="theme-color" content="#0c0c10">
<style>
:root{--bg:#0c0c10;--card:#14141a;--ink:#f0efe9;--muted:#9a97a3;--line:#2a2a33;--acc:#7c6cf0;--ok:#3ecf8e}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.logo{font-weight:800}.logo span{color:var(--acc)}
header a{color:var(--muted);text-decoration:none;font-size:13px;margin-left:12px}
.banner{max-width:720px;margin:0 auto;padding:14px 16px;width:100%}
.banner h1{font-size:1.15rem;margin-bottom:6px}
.banner p{color:var(--muted);font-size:14px}
.status{max-width:720px;margin:0 auto;padding:0 16px 10px;width:100%;font-size:13px;color:var(--muted)}
.status b{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-width:720px;margin:0 auto;padding:0 16px 10px;width:100%}
.chips button{font:inherit;font-size:13px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.msgs{flex:1;overflow:auto;max-width:720px;width:100%;margin:0 auto;padding:8px 16px;display:flex;flex-direction:column;gap:12px;min-height:42vh}
.msg{padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word;max-width:95%}
.msg.user{align-self:flex-end;background:#1a1a24}
.msg .meta{margin-top:8px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.composer{max-width:720px;width:100%;margin:0 auto;padding:12px 16px 20px;display:flex;gap:8px;border-top:1px solid var(--line)}
.composer input{flex:1;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#101014;color:var(--ink);font:inherit;font-size:16px}
.composer button{min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="logo">АКСИ <span>ARIN v2</span></div>
  <nav><a href="/ARIN.md">Спека</a><a href="/">Главная</a></nav>
</header>
<div class="banner">
  <h1>ARIN v2 FULL — полная Resonance-нейросеть</h1>
  <p>Complex embed · CReLU dense · interference memory · Born readout · gate. 2026-09-17 · 20/20 acc</p>
</div>
<div class="status" id="st">…</div>
<div class="chips">
  <button type="button" data-q="что такое arin">Что такое ARIN?</button>
  <button type="button" data-q="как работает арин">Как работает?</button>
  <button type="button" data-q="born rule">Born rule</button>
  <button type="button" data-q="crelu">CReLU</button>
  <button type="button" data-q="контакт">Контакт</button>
</div>
<div class="msgs" id="msgs"></div>
<div class="composer">
  <input id="q" placeholder="Вопрос к ARIN v2…" enterkeyhint="send">
  <button type="button" id="go">Спросить</button>
</div>
<script src="/aksi-resonance-net.js?v=2"></script>
<script src="/aksi-personal-net.js?v=3"></script>
<script src="/aksi-bot.js?v=11"></script>
<script src="/aksi-mind.js?v=3"></script>
<script>
(function(){
  function paint(){
    var r=window.AKSI_RESONANCE&&AKSI_RESONANCE.status&&AKSI_RESONANCE.status();
    document.getElementById("st").innerHTML=r&&r.ready
      ?("<b>"+r.architecture+"</b> · params "+r.parameters+" · loss "+(r.lastLoss!=null?r.lastLoss.toFixed(3):"—")+" · "+r.classes+" classes")
      :"загрузка…";
  }
  function add(role,text,meta){
    var d=document.createElement("div");d.className="msg "+role;d.textContent=text;
    if(meta){var m=document.createElement("div");m.className="meta";m.textContent=meta;d.appendChild(m);}
    document.getElementById("msgs").appendChild(d);d.scrollIntoView({block:"end"});
  }
  if(window.AKSI_RESONANCE)AKSI_RESONANCE.ensure();
  paint();
  add("bot","ARIN v2 FULL онлайн.\nСлои: complex-embed → CReLU dense → interference memory → Born readout → gate.\nСпека: /ARIN.md","v2.0.0-arin-full");
  async function send(q){
    q=String(q||"").trim();if(!q)return;
    add("user",q);
    var out=window.AKSI_MIND?await AKSI_MIND.think(q,{}):(AKSI_RESONANCE.ask(q));
    var meta=(out.meta||out.source||"")+(out.architecture?" · "+out.architecture:"");
    if(out.born!=null)meta+=" · born "+Number(out.born).toFixed(3);
    if(out.parts&&out.parts.personal&&out.parts.personal.born!=null)meta+=" · born "+Number(out.parts.personal.born).toFixed(3);
    add("bot",out.text||"—",meta);paint();
  }
  document.getElementById("go").onclick=function(){var q=document.getElementById("q").value;document.getElementById("q").value="";send(q);};
  document.getElementById("q").addEventListener("keydown",function(e){if(e.key==="Enter"){var q=document.getElementById("q").value;document.getElementById("q").value="";send(q);}});
  document.querySelectorAll(".chips button").forEach(function(b){b.onclick=function(){send(b.getAttribute("data-q"));};});
})();
</script>
</body>
</html>
