<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AKSI Whole — Unified Runtime</title>
<meta name="description" content="AKSI Whole: Bot + Cortex + ADIA + Fly-Gate + Research + Organism. One offline-first runtime.">
<meta name="theme-color" content="#06060a">
<link rel="canonical" href="https://milana808.github.io/product.html">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="AKSI Whole — Unified Runtime">
<meta property="og:description" content="All bricks connected: memory, research, gate, ADIA metrics.">
<meta property="og:url" content="https://milana808.github.io/product.html">
<meta name="twitter:card" content="summary">
<style>
:root{--bg:#06060a;--ink:#f2f0eb;--muted:#9b98a6;--accent:#8b7cf6;--green:#5ee9a8;--red:#f87171;--line:rgba(255,255,255,.08);--card:#0b0b11}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 system-ui,sans-serif;background:radial-gradient(circle at 40% -20%,rgba(139,124,246,.12),#06060a 52%);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
::selection{background:rgba(139,124,246,.35);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.logo{font-weight:800;letter-spacing:.04em}.logo span{color:var(--accent)}
header nav{display:flex;flex-wrap:wrap;gap:4px 12px}
header a{color:var(--muted);text-decoration:none;font-size:13px;min-height:40px;display:inline-flex;align-items:center}
header a:hover{color:var(--ink)}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 18px;max-width:920px;margin:0 auto;width:100%}
@media(max-width:800px){#board{grid-template-columns:1fr 1fr}}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.metric span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.metric b{font-size:13px;font-weight:600}
.ok{color:var(--green)}.no{color:var(--red)}
.hint{max-width:920px;margin:0 auto;padding:0 18px 10px;font-size:13px;color:var(--muted);width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-width:920px;margin:0 auto;padding:0 18px 10px;width:100%}
.chips button{font-size:12px;font-weight:500;padding:0 14px;min-height:36px;border-radius:999px;border:1px solid var(--line);background:#0f0f16;color:var(--ink);cursor:pointer;font-family:inherit}
.chips button:hover{border-color:rgba(255,255,255,.18)}
.msgs{flex:1;overflow-y:auto;padding:12px 18px;max-width:920px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-height:38vh}
.msg{max-width:92%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#12121a}
.msg .meta{font-size:11px;color:var(--muted);margin-top:8px}
.badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;background:#15151f;margin-right:4px}
.badge.ok{color:var(--green)}.badge.no{color:var(--red)}
.bar{max-width:920px;width:100%;margin:0 auto;padding:12px 18px 20px;display:flex;gap:8px;border-top:1px solid var(--line)}
.bar input{flex:1;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#0a0a10;color:var(--ink);font:inherit;font-size:16px}
.bar input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(139,124,246,.15)}
.bar button{min-height:48px;min-width:52px;background:var(--accent);color:#fff;border:0;border-radius:12px;font-weight:700;cursor:pointer;font-size:16px;padding:0 16px}
.bar button:disabled{opacity:.5;cursor:not-allowed}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">AKSI <span>Whole</span></div>
  <nav aria-label="Primary">
    <a href="/seal.html">Seal</a>
    <a href="/infinity.html">Infinity</a>
    <a href="/bot.html">Bot</a>
    <a href="/brain.html">Brain</a>
    <a href="/matrix/">MATRIX</a>
    <a href="/">Home</a>
  </nav>
</header>
<h1>AKSI Whole — Unified Runtime</h1>
<div id="board" aria-label="Module status">
  <div class="metric"><span>Bot</span><b id="m-bot">…</b></div>
  <div class="metric"><span>Cortex</span><b id="m-cx">…</b></div>
  <div class="metric"><span>Fly-Gate</span><b id="m-gate">…</b></div>
  <div class="metric"><span>ADIA</span><b id="m-adia">…</b></div>
  <div class="metric"><span>Organism</span><b id="m-org">…</b></div>
  <div class="metric"><span>Receipt</span><b id="m-rcpt">…</b></div>
  <div class="metric"><span>Fly-Brain</span><b id="m-fly">…</b></div>
  <div class="metric"><span>Agent</span><b id="m-agent">…</b></div>
</div>
<p class="hint">Все кирпичи в одном контуре: Cortex · Research · Fly-Gate · ADIA EQS · Organism · Receipt. Команды: <code>запомни:</code> · <code>исследуй:</code> · вопрос.</p>
<div class="chips">
  <button type="button" data-q="статус">Статус</button>
  <button type="button" data-q="запомни: AKSI Whole соединяет Bot Cortex ADIA Fly-Gate Research">Научить</button>
  <button type="button" data-q="исследуй: искусственный интеллект">Research</button>
  <button type="button" data-q="что такое AKSI Whole">Память</button>
  <button type="button" data-q="Кто ты?">Кто ты</button>
</div>
<div class="msgs" id="msgs" role="log" aria-live="polite" aria-relevant="additions"></div>
<div class="bar">
  <input id="q" type="text" placeholder="запомни: … · исследуй: … · вопрос" enterkeyhint="send" aria-label="Сообщение">
  <button type="button" id="go" aria-label="Отправить">▶</button>
</div>
<script src="/aksi-fly-brain.js?v=2"></script>
<script src="/aksi-fly-gate.js?v=2"></script>
<script src="/aksi-receipt.js?v=2"></script>
<script src="/aksi-organism.js?v=13"></script>
<script src="/agent.js?v=4"></script>
<script src="/aksi-algorithm.js?v=3"></script>
<script src="/aksi-cortex-kernel.js?v=3"></script>
<script src="/aksi-self-github.js?v=1"></script>
<script src="/aksi-bot.js?v=6"></script>
<script>
(function(){
  var B = window.AKSI_BOT;
  if (!B) { document.getElementById('m-bot').textContent = 'missing'; return; }
  function flag(on){ return on ? 'ok' : 'no'; }
  function paintStatus(s) {
    function set(id, text, on) {
      var el = document.getElementById(id);
      el.textContent = text;
      el.className = flag(on);
    }
    set('m-bot', 'v' + (s.version || '?'), true);
    set('m-cx', (s.cortex ? 'on' : 'off') + ' · ' + (s.cortexDocs || 0), !!s.cortex);
    set('m-gate', s.flyGate ? 'on' : 'off', !!s.flyGate);
    set('m-adia', s.adia ? 'on' : 'off', !!s.adia);
    set('m-org', s.organism ? 'on' : 'off', !!s.organism);
    set('m-rcpt', s.receipt ? 'on' : 'off', !!s.receipt);
    set('m-fly', s.flyBrain ? 'on' : 'off', !!s.flyBrain);
    set('m-agent', s.agent ? 'on' : 'off', !!s.agent);
  }
  B.status().then(paintStatus);
  function add(role, text, meta) {
    var d = document.createElement('div');
    d.className = 'msg ' + role;
    d.textContent = text;
    if (meta) {
      var m = document.createElement('div');
      m.className = 'meta';
      m.innerHTML = meta;
      d.appendChild(m);
    }
    document.getElementById('msgs').appendChild(d);
    d.scrollIntoView({ block: 'end' });
  }
  add('bot', ['AKSI Whole — все кирпичи соединены.', 'Cortex · Research · Fly-Gate · ADIA · Organism · Receipt · Agent', 'Команды: запомни: · исследуй: · вопрос'].join('\n'));
  async function send() {
    var q = document.getElementById('q').value.trim();
    if (!q) return;
    document.getElementById('q').value = '';
    add('user', q);
    document.getElementById('go').disabled = true;
    try {
      var out = await B.think(q);
      var meta = '<span class="badge">' + (out.source || '') + '</span>';
      if (out.gate) meta += '<span class="badge ' + (out.gate.decision === 'ALLOWED' ? 'ok' : 'no') + '">gate ' + out.gate.decision + '</span>';
      if (out.eqs != null) meta += '<span class="badge">EQS ' + Math.round(Number(out.eqs)) + '</span>';
      if (out.aksiScore != null) meta += '<span class="badge">AKSI ' + Number(out.aksiScore).toFixed(1) + '</span>';
      if (out.sources) meta += ' · ' + out.sources.length + ' sources';
      if (out.score != null) meta += ' · res ' + Number(out.score).toFixed(3);
      add('bot', out.text || '—', meta);
    } catch (e) {
      add('bot', 'Ошибка: ' + e.message);
    }
    document.getElementById('go').disabled = false;
    document.getElementById('q').focus();
    B.status().then(paintStatus);
  }
  document.getElementById('go').onclick = send;
  document.getElementById('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
  document.querySelectorAll('.chips button').forEach(function (b) {
    b.onclick = function () {
      document.getElementById('q').value = b.getAttribute('data-q');
      send();
    };
  });
})();
</script>
</body>
</html>
