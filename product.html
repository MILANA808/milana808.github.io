<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AKSI Product — Unified Runtime</title>
<meta name="description" content="AKSI unified runtime: Bot + Cortex + Fly-Gate + Research. Offline-first private agent.">
<meta name="theme-color" content="#06060a">
<link rel="canonical" href="https://milana808.github.io/product.html">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:url" content="https://milana808.github.io/product.html">
<meta property="og:title" content="AKSI Product — Unified Runtime">
<meta property="og:description" content="Bot + Cortex + Fly-Gate + Research. Offline-first.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="AKSI Product Runtime">
<meta name="twitter:description" content="Bot + Cortex + Gate + Research. Offline-first.">
<style>
:root{
  --bg:#06060a;--ink:#f2f0eb;--muted:#9b98a6;--dim:#6a6775;
  --violet:#8b7cf6;--green:#5ee9a8;--red:#f87171;
  --line:rgba(255,255,255,.08);--card:#0b0b11;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font:15px/1.5 system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at 40% -20%,rgba(139,124,246,.12),#06060a 50%);
  color:var(--ink);min-height:100vh;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(139,124,246,.35);color:#fff}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
header{
  padding:14px 18px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
}
.logo{font-weight:800;letter-spacing:.04em}.logo span{color:var(--violet)}
header nav{display:flex;flex-wrap:wrap;gap:4px 12px}
header a{color:var(--muted);text-decoration:none;font-size:13px;min-height:40px;display:inline-flex;align-items:center}
header a:hover{color:var(--ink)}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 18px;max-width:900px;margin:0 auto;width:100%}
@media(max-width:700px){#board{grid-template-columns:1fr 1fr}}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.metric span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.metric b{font-size:14px;font-weight:600}
.ok{color:var(--green)}.no{color:var(--red)}
h1{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.hint{max-width:900px;margin:0 auto;padding:0 18px 10px;font-size:13px;color:var(--muted);width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-width:900px;margin:0 auto;padding:0 18px 10px;width:100%}
.chips button{
  font-size:12px;font-weight:500;padding:0 14px;min-height:36px;border-radius:999px;
  border:1px solid var(--line);background:#0f0f16;color:var(--ink);cursor:pointer;font-family:inherit;
}
.chips button:hover{border-color:rgba(255,255,255,.18)}
.msgs{
  flex:1;overflow-y:auto;padding:12px 18px;max-width:900px;width:100%;margin:0 auto;
  display:flex;flex-direction:column;gap:10px;min-height:40vh;
}
.msg{
  max-width:92%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);white-space:pre-wrap;word-break:break-word;
}
.msg.user{align-self:flex-end;background:#12121a}
.msg .meta{font-size:11px;color:var(--muted);margin-top:8px}
.badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;background:#15151f;margin-right:4px}
.badge.ok{color:var(--green)}.badge.no{color:var(--red)}
.bar{
  max-width:900px;width:100%;margin:0 auto;padding:12px 18px 20px;
  display:flex;gap:8px;border-top:1px solid var(--line);
}
.bar input{
  flex:1;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);
  background:#0a0a10;color:var(--ink);font:inherit;font-size:16px;
}
.bar input:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 3px rgba(139,124,246,.15)}
.bar button{
  min-height:48px;min-width:52px;background:var(--violet);color:#fff;border:0;border-radius:12px;
  font-weight:700;cursor:pointer;font-size:16px;padding:0 16px;
}
.bar button:disabled{opacity:.5;cursor:not-allowed}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">AKSI <span>Product</span></div>
  <nav aria-label="Primary">
    <a href="/seal.html">Seal</a>
    <a href="/infinity.html">Infinity</a>
    <a href="/bot.html">Bot</a>
    <a href="/">Home</a>
  </nav>
</header>

<h1>AKSI Product Runtime</h1>

<div id="board" aria-label="Module status">
  <div class="metric"><span>Bot</span><b id="m-bot">…</b></div>
  <div class="metric"><span>Cortex</span><b id="m-cx">…</b></div>
  <div class="metric"><span>Fly-Gate</span><b id="m-gate">…</b></div>
  <div class="metric"><span>Organism</span><b id="m-org">…</b></div>
</div>

<p class="hint">Runtime: Cortex memory · research · gate. Offline-first. Commands: <code>запомни:</code> · <code>исследуй:</code> · question.</p>

<div class="chips">
  <button type="button" data-q="статус">Status</button>
  <button type="button" data-q="запомни: AKSI Product — unified Bot+Cortex+Fly-Gate+Research">Teach</button>
  <button type="button" data-q="исследуй: искусственный интеллект">Research AI</button>
  <button type="button" data-q="что такое AKSI Product">Memory</button>
  <button type="button" data-q="Кто ты?">Who are you</button>
</div>

<div class="msgs" id="msgs" role="log" aria-live="polite" aria-relevant="additions"></div>
<div class="bar">
  <input id="q" type="text" placeholder="запомни: … · исследуй: … · question" enterkeyhint="send" aria-label="Message">
  <button type="button" id="go" aria-label="Send">▶</button>
</div>

<script src="/aksi-fly-brain.js?v=2"></script>
<script src="/aksi-fly-gate.js?v=2"></script>
<script src="/aksi-receipt.js?v=2"></script>
<script src="/aksi-organism.js?v=13"></script>
<script src="/agent.js?v=4"></script>
<script src="/aksi-cortex-kernel.js?v=3"></script>
<script src="/aksi-bot.js?v=5"></script>
<script>
(function(){
  var B = window.AKSI_BOT;
  if (!B) { document.getElementById('m-bot').textContent = 'missing'; return; }
  function paintStatus(s) {
    document.getElementById('m-bot').textContent = 'v' + (s.version || '?');
    document.getElementById('m-bot').className = 'ok';
    document.getElementById('m-cx').textContent = (s.cortex ? 'on' : 'off') + ' · ' + (s.cortexDocs || 0) + ' docs';
    document.getElementById('m-cx').className = s.cortex ? 'ok' : 'no';
    document.getElementById('m-gate').textContent = s.flyGate ? 'on' : 'off';
    document.getElementById('m-gate').className = s.flyGate ? 'ok' : 'no';
    document.getElementById('m-org').textContent = s.organism ? 'on' : 'off';
    document.getElementById('m-org').className = s.organism ? 'ok' : 'no';
  }
  B.status().then(paintStatus);
  function add(role, text, meta) {
    var d = document.createElement('div');
    d.className = 'msg ' + role;
    d.textContent = text;
    if (meta) {
      var m = document.createElement('div');
      m.className = 'meta';
      m.innerHTML = meta;
      d.appendChild(m);
    }
    document.getElementById('msgs').appendChild(d);
    d.scrollIntoView({ block: 'end' });
  }
  add('bot', ['AKSI Product — unified runtime.', 'Bot + Cortex AES-GCM + Fly-Gate + research.', 'Commands: запомни: · исследуй: · question.'].join('\n'));
  async function send() {
    var q = document.getElementById('q').value.trim();
    if (!q) return;
    document.getElementById('q').value = '';
    add('user', q);
    document.getElementById('go').disabled = true;
    try {
      var out = await B.think(q);
      var meta = '<span class="badge">' + (out.source || '') + '</span>';
      if (out.gate) meta += '<span class="badge ' + (out.gate.decision === 'ALLOWED' ? 'ok' : 'no') + '">gate ' + out.gate.decision + '</span>';
      if (out.sources) meta += ' · ' + out.sources.length + ' sources';
      if (out.score != null) meta += ' · score ' + Number(out.score).toFixed(3);
      add('bot', out.text || '—', meta);
    } catch (e) {
      add('bot', 'Error: ' + e.message);
    }
    document.getElementById('go').disabled = false;
    document.getElementById('q').focus();
    B.status().then(paintStatus);
  }
  document.getElementById('go').onclick = send;
  document.getElementById('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
  document.querySelectorAll('.chips button').forEach(function (b) {
    b.onclick = function () {
      document.getElementById('q').value = b.getAttribute('data-q');
      send();
    };
  });
})();
</script>
</body>
</html>
