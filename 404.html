<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not found — AKSI Seal</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06060a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06060a;--ink:#f2f0eb;--muted:#9b98a6;--accent:#8b7cf6;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;font-family:"Instrument Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);text-align:center;padding:32px;
background-image:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(139,124,246,.12),transparent 55%)}
h1{font-family:Syne,system-ui,sans-serif;font-size:clamp(2rem,5vw,3rem);letter-spacing:-.03em;margin-bottom:12px}
p{color:var(--muted);margin-bottom:28px;max-width:32ch}
a{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;text-decoration:none}
a.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);margin-left:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
</style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>This path is not sealed. Return to the product or runtime.</p>
    <div class="row">
      <a href="/seal.html">AKSI Seal</a>
      <a class="ghost" href="/product.html">Runtime</a>
    </div>
  </div>
</body>
