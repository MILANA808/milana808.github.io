<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АКСИ Titan — нейросеть</title>
<meta name="theme-color" content="#0c0c10">
<style>
:root{--bg:#0c0c10;--card:#14141a;--ink:#f0efe9;--muted:#9a97a3;--line:#2a2a33;--acc:#7c6cf0;--ok:#3ecf8e}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800}.logo span{color:var(--acc)}
a{color:var(--muted);text-decoration:none;font-size:13px;margin-left:12px}
.banner{max-width:720px;margin:0 auto;padding:14px 16px}
.banner h1{font-size:1.15rem;margin-bottom:6px}
.banner p{color:var(--muted);font-size:14px}
.status{max-width:720px;margin:0 auto;padding:0 16px 10px;font-size:13px;color:var(--muted)}
.status b{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-width:720px;margin:0 auto;padding:0 16px 10px}
.chips button{font:inherit;font-size:13px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.msgs{flex:1;overflow:auto;max-width:720px;margin:0 auto;padding:8px 16px;display:flex;flex-direction:column;gap:12px;min-height:40vh;width:100%}
.msg{padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;max-width:95%}
.msg.user{align-self:flex-end;background:#1a1a24}
.msg .meta{margin-top:8px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.composer{max-width:720px;margin:0 auto;padding:12px 16px 20px;display:flex;gap:8px;border-top:1px solid var(--line);width:100%}
.composer input{flex:1;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#101014;color:var(--ink);font:inherit;font-size:16px}
.composer button{min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="logo">АКСИ <span>Titan</span></div>
  <nav><a href="/TITAN.md">Спека</a><a href="/episteme.html">Episteme</a><a href="/product.html">ARIN</a></nav>
</header>
<div class="banner">
  <h1>Полноценная локальная нейросеть</h1>
  <p>Backprop · generation · ~14k params. Честно: не сильнее frontier LLM, зато ваша и offline.</p>
</div>
<div class="status" id="st">обучение…</div>
<div class="chips">
  <button type="button" data-q="что такое акси">Что такое АКСИ?</button>
  <button type="button" data-q="titan">Titan?</button>
  <button type="button" data-q="контакт">Контакт</button>
  <button type="button" data-q="привет">Привет</button>
  <button type="button" id="btnTrain">Переобучить</button>
</div>
<div class="msgs" id="msgs"></div>
<div class="composer">
  <input id="q" placeholder="Вопрос к Titan…" enterkeyhint="send">
  <button type="button" id="go">Спросить</button>
</div>
<script src="/aksi-titan.js?v=11"></script>
<script>
(function(){
  function paint(){
    var s=AKSI_TITAN.status();
    document.getElementById("st").innerHTML=s.ready
      ?("<b>"+s.architecture+"</b> · params "+s.parameters+" · loss "+(s.loss!=null?s.loss.toFixed(2):"—")+" · "+s.honest)
      :"…";
  }
  function add(role,t,m){
    var d=document.createElement("div");d.className="msg "+role;d.textContent=t;
    if(m){var x=document.createElement("div");x.className="meta";x.textContent=m;d.appendChild(x);}
    document.getElementById("msgs").appendChild(d);d.scrollIntoView({block:"end"});
  }
  add("bot","Titan v1.1 загружается…","init");
  setTimeout(function(){
    AKSI_TITAN.ensure(); paint();
    add("bot","Готово.\n"+JSON.stringify(AKSI_TITAN.claim(),null,2),"claim");
  }, 50);
  function send(q){
    q=String(q||"").trim();if(!q)return;
    add("user",q);
    var out=AKSI_TITAN.ask(q);
    add("bot",out.text,(out.mode||"")+" · "+(out.architecture||""));
    paint();
  }
  document.getElementById("go").onclick=function(){var q=document.getElementById("q").value;document.getElementById("q").value="";send(q);};
  document.getElementById("q").onkeydown=function(e){if(e.key==="Enter"){var q=e.target.value;e.target.value="";send(q);}};
  document.querySelectorAll(".chips button[data-q]").forEach(function(b){b.onclick=function(){send(b.getAttribute("data-q"));};});
  document.getElementById("btnTrain").onclick=function(){
    add("bot","Переобучение…","train");
    setTimeout(function(){ var r=AKSI_TITAN.train({epochs:30,lr:0.15}); add("bot","Обучено: loss "+(r.loss&&r.loss.toFixed(2)),"train"); paint(); }, 20);
  };
})();
</script>
</body>
</html>
