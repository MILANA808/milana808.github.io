<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АКСИ — бенчмарки</title>
<style>
body{font:16px/1.5 system-ui;background:#0b0b0f;color:#f2f1eb;max-width:560px;margin:0 auto;padding:16px}
button{font:inherit;padding:12px 16px;border:0;border-radius:12px;background:#8b7cf7;color:#fff;font-weight:700;cursor:pointer}
pre{background:#16161f;padding:14px;border-radius:12px;overflow:auto;font-size:13px;margin-top:12px}
a{color:#9a97a3}
p{color:#9a97a3}
</style>
</head>
<body>
<h1>Бенчмарки</h1>
<p>Из плана: без цифр — прототип. С цифрами — инженерный проект.</p>
<button type="button" id="run">Запустить</button>
<pre id="out">—</pre>
<p><a href="/demo.html">Демо</a> · <a href="/capsule.html">Капсула</a> · <a href="/HONEST.md">Честно</a></p>
<script src="/aksi-capsule.js?v=12"></script>
<script>
document.getElementById('run').onclick=async function(){
  var C=window.AKSI_CAPSULE, o=document.getElementById('out');
  if(!C){ o.textContent='нет модуля'; return; }
  await C.ensureKeys();
  var t0=performance.now();
  for(var i=0;i<50;i++) C.remember('fact '+i+' '+Math.random());
  var tMem=performance.now()-t0;
  t0=performance.now();
  for(var j=0;j<20;j++) await C.ask('fact '+j);
  var tAsk=performance.now()-t0;
  t0=performance.now(); await C.sealLast(); var tSeal=performance.now()-t0;
  var cap=C.exportCapsule(); var size=new Blob([JSON.stringify(cap)]).size;
  t0=performance.now(); var v=(await C.verifyAll()).pop(); var tVer=performance.now()-t0;
  o.textContent=['version: '+C.version,'remember x50: '+tMem.toFixed(1)+' ms','ask x20: '+tAsk.toFixed(1)+' ms','seal: '+tSeal.toFixed(1)+' ms','export: '+size+' bytes','verify: '+tVer.toFixed(1)+' ms ok='+(v&&v.ok),'facts: '+C.status().facts,'','Тайминги на вашем устройстве — не scientific claim.'].join('\n');
};
</script>
</body>
</html>
