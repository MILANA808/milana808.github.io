<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>АКСИ · Квант-лаб</title>
<meta name="theme-color" content="#0b1020">
<style>
:root{--bg:#0b1020;--card:#121a2f;--ink:#e8eefc;--muted:#8b9bb8;--line:#243047;--cyan:#22d3ee;--violet:#a78bfa;--ok:#4ade80;--gate:#6366f1}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;max-width:960px;margin:0 auto;padding:12px 12px 28px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;padding-top:env(safe-area-inset-top)}
header a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600}
h1{font-size:1.25rem;font-weight:800}
.layout{display:grid;gap:12px}
@media(min-width:800px){.layout{grid-template-columns:1fr 1.1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.card h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);margin-bottom:10px}
#thread{height:min(42vh,320px);overflow-y:auto;margin-bottom:8px}
.msg{margin-bottom:8px;font-size:14px;line-height:1.4}
.msg.u{color:#c4b5fd}
.msg.a{color:var(--ink)}
.msg .n{font-size:10px;color:var(--muted);margin-bottom:2px}
.composer{display:flex;gap:8px}
.composer input{flex:1;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0b1020;color:var(--ink)}
.composer button{border:none;border-radius:12px;padding:0 16px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips button{border:1px solid var(--line);background:#0b1020;color:var(--ink);border-radius:999px;padding:8px 10px;font-size:12px;font-weight:600}
.circuit{overflow-x:auto;padding:8px 0}
.wire-row{display:flex;align-items:center;gap:0;min-height:56px;position:relative;margin:6px 0}
.wire-row::before{content:"";position:absolute;left:48px;right:8px;top:50%;height:2px;background:#334155;z-index:0}
.qlabel{width:48px;font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);z-index:1}
.slots{display:flex;gap:6px;z-index:1;padding-left:4px}
.slot{
  width:48px;height:40px;border-radius:10px;border:1px dashed #334155;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;cursor:pointer;background:#0b1020;user-select:none;
}
.slot.on{border-style:solid;border-color:var(--gate);background:#1e1b4b;color:#c7d2fe}
.slot.cnot{border-color:var(--cyan);color:var(--cyan)}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.palette button{border:1px solid var(--line);background:#0b1020;color:var(--ink);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700}
.probs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.probs div{background:#0b1020;border-radius:12px;padding:10px;text-align:center}
.probs b{display:block;font-size:1.05rem;color:var(--cyan)}
.probs i{font-style:normal;font-size:10px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:12px}
.bars div{flex:1;background:linear-gradient(180deg,var(--cyan),#6366f1);border-radius:6px 6px 2px 2px;position:relative;min-height:3px}
.bars span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.amp{font-family:ui-monospace,monospace;font-size:11px;color:#a5b4fc;margin-top:22px;line-height:1.5;word-break:break-all}
.explain{margin-top:10px;font-size:14px;line-height:1.5;color:#cbd5e1;background:#0b1020;border-radius:12px;padding:12px;border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row button{border:1px solid var(--line);background:#0b1020;color:var(--ink);border-radius:10px;padding:10px 12px;font-size:12px;font-weight:700}
.row button.pri{background:linear-gradient(135deg,#7c3aed,#2563eb);border:none;color:#fff}
</style>
</head>
<body>
<header>
  <div>
    <a href="/matrix/">← MATRIX</a>
    <h1>Квант-лаб · без бэкенда</h1>
  </div>
  <a href="/app/">Приложение</a>
</header>

<div class="layout">
  <div class="card">
    <h2>Чат → схема</h2>
    <div class="chips">
      <button type="button" data-q="Покажи запутанность двух кубитов и посчитай вероятности">Запутанность</button>
      <button type="button" data-q="Сделай суперпозицию на первом кубите">Суперпозиция</button>
      <button type="button" data-q="Схема телепортации (упрощённо)">Телепортация</button>
      <button type="button" data-q="Алгоритм Гровера на 2 кубитах (идея)">Гровер</button>
    </div>
    <div id="thread"></div>
    <div class="composer">
      <input id="inp" type="text" placeholder="Напишите про схему…" enterkeyhint="send">
      <button type="button" id="send">OK</button>
    </div>
  </div>

  <div class="card">
    <h2>Симулятор (statevector)</h2>
    <div class="circuit" id="circuit"></div>
    <div class="palette">
      <button type="button" data-g="H0">H₀</button>
      <button type="button" data-g="H1">H₁</button>
      <button type="button" data-g="X0">X₀</button>
      <button type="button" data-g="X1">X₁</button>
      <button type="button" data-g="Z0">Z₀</button>
      <button type="button" data-g="CNOT">CNOT₀₁</button>
      <button type="button" data-g="DEL">⌫ шаг</button>
      <button type="button" data-g="CLR">Сброс</button>
    </div>
    <div class="row">
      <button type="button" class="pri" id="btn-run">Пересчитать</button>
      <button type="button" id="btn-explain">Объясни схему</button>
      <button type="button" id="btn-json">JSON</button>
      <button type="button" id="btn-md">Отчёт MD</button>
    </div>
    <div class="bars" id="bars"></div>
    <div class="probs" id="probs"></div>
    <div class="amp" id="amp"></div>
    <div class="explain" id="explain">Задайте схему чатом или кнопками.</div>
  </div>
</div>

<script>
(function(){
"use strict";

// ——— Complex & statevector (2 qubits, index = 2*q0+q1) ———
function C(re,im){return{re:re||0,im:im||0};}
function cadd(a,b){return C(a.re+b.re,a.im+b.im);}
function cmul(a,b){return C(a.re*b.re-a.im*b.im,a.re*b.im+a.im*b.re);}
function cabs2(a){return a.re*a.re+a.im*a.im;}
var ISQ=1/Math.SQRT2;

function apply1(psi,q,M){
  var next=[C(),C(),C(),C()];
  for(var q0=0;q0<2;q0++){
    for(var q1=0;q1<2;q1++){
      var idx=2*q0+q1;
      var bit=q===0?q0:q1;
      for(var b=0;b<2;b++){
        var n0=q===0?b:q0, n1=q===1?b:q1;
        next[idx]=cadd(next[idx],cmul(M[bit][b],psi[2*n0+n1]));
      }
    }
  }
  return next;
}
function gateH(psi,q){
  var H=[[C(ISQ),C(ISQ)],[C(ISQ),C(-ISQ)]];
  return apply1(psi,q,H);
}
function gateX(psi,q){
  return apply1(psi,q,[[C(0),C(1)],[C(1),C(0)]]);
}
function gateZ(psi,q){
  return apply1(psi,q,[[C(1),C(0)],[C(0),C(-1)]]);
}
function gateCNOT(psi){
  var next=[C(),C(),C(),C()];
  for(var q0=0;q0<2;q0++){
    for(var q1=0;q1<2;q1++){
      var t=q0?(1-q1):q1;
      next[2*q0+t]=cadd(next[2*q0+t],psi[2*q0+q1]);
    }
  }
  return next;
}

function runCircuit(steps){
  var psi=[C(1),C(),C(),C()]; // |00>
  steps.forEach(function(g){
    if(g==="H0")psi=gateH(psi,0);
    else if(g==="H1")psi=gateH(psi,1);
    else if(g==="X0")psi=gateX(psi,0);
    else if(g==="X1")psi=gateX(psi,1);
    else if(g==="Z0")psi=gateZ(psi,0);
    else if(g==="Z1")psi=gateZ(psi,1);
    else if(g==="CNOT")psi=gateCNOT(psi);
  });
  var p=psi.map(cabs2);
  var labels=["00","01","10","11"];
  var S=0;p.forEach(function(x){if(x>1e-12)S-=x*Math.log2(x);});
  return{psi:psi,probs:p,labels:labels,entropy:S,steps:steps.slice()};
}

// ——— Templates: text → circuit ———
function textToCircuit(prompt){
  var t=String(prompt).toLowerCase();
  if(/тел[еe]порт/.test(t)){
    return{name:"teleportation_sketch",steps:["H1","CNOT","H0","CNOT","H1"],note:"Упрощённый эскиз идей телепортации на 2 кубитах (не полный 3-qubit протокол)."};
  }
  if(/гровер|grover|поиск/.test(t)){
    return{name:"grover_2q_idea",steps:["H0","H1","X0","X1","H1","CNOT","H1","X0","X1","H0","H1"],note:"Иллюстрация идеи Гровера на 2 кубитах (учебный шаблон)."};
  }
  if(/запутан|белл|bell|entangl|cnot.*h|h.*cnot/.test(t)){
    return{name:"bell_state",steps:["H0","CNOT"],note:"Состояние Белла Φ+: H на q0, затем CNOT."};
  }
  if(/суперпоз|hadamard|только h|h на/.test(t)){
    if(/втор|q1|1/.test(t))return{name:"superpos_q1",steps:["H1"],note:"Суперпозиция на q1."};
    return{name:"superpos_q0",steps:["H0"],note:"Суперпозиция на q0."};
  }
  if(/сброс|очист|zero|\|00/.test(t))return{name:"reset",steps:[],note:"|00⟩"};
  // default quantum-ish
  if(/квант|кубит|схем|simulat|вероятн/.test(t)){
    return{name:"bell_state",steps:["H0","CNOT"],note:"По умолчанию для квантового запроса — Белл."};
  }
  return null;
}

function explainResult(res){
  var p=res.probs;
  var lines=[];
  lines.push("Вероятности:");
  res.labels.forEach(function(L,i){
    lines.push("  |"+L+"⟩ = "+p[i].toFixed(4)+(p[i]>0.01?"  ("+Math.round(p[i]*100)+"%)":""));
  });
  lines.push("Энтропия Шеннона исхода: "+res.entropy.toFixed(3)+" бит (макс. 2 для 2 кубитов).");

  var dominant=p.map(function(x,i){return{x:x,i:i};}).filter(function(o){return o.x>0.2;});
  if(Math.abs(p[0]-0.5)<0.08&&Math.abs(p[3]-0.5)<0.08&&p[1]<0.08&&p[2]<0.08){
    lines.push("Вывод: классическая корреляция измерений — типичный Белл Φ+. Если первый кубит дал 0, второй почти наверняка 0; если 1 — то 1. Это и есть запутанность (в учебной модели без шума).");
  } else if(Math.abs(p[0]-0.5)<0.08&&Math.abs(p[1]-0.5)<0.08&&p[2]<0.08&&p[3]<0.08){
    lines.push("Вывод: суперпозиция на младшем кубите при |0⟩ на старшем — продукт-состояние, не Белл.");
  } else if(res.entropy<0.05){
    lines.push("Вывод: состояние почти базисное (детерминированный исход)." );
  } else if(res.entropy>0.9){
    lines.push("Вывод: заметная неопределённость исхода; проверьте, есть ли корреляции между кубитами.");
  } else {
    lines.push("Вывод: смешанный учебный профиль вероятностей — смотрите доминирующие |bas⟩.");
  }
  lines.push("Схема: ["+res.steps.join(" → ")+"]");
  return lines.join("\n");
}

// ——— State ———
var steps=[];
var lastRes=null;

function renderCircuit(){
  var root=document.getElementById("circuit");
  root.innerHTML="";
  var maxCols=Math.max(steps.length,4);
  [0,1].forEach(function(q){
    var row=document.createElement("div");row.className="wire-row";
    row.innerHTML="<div class=\"qlabel\">q"+q+"</div>";
    var slots=document.createElement("div");slots.className="slots";
    for(var c=0;c<maxCols;c++){
      var g=steps[c];
      var slot=document.createElement("div");
      slot.className="slot";
      var label="·";
      if(g==="H0"&&q===0){label="H";slot.className+=" on";}
      else if(g==="H1"&&q===1){label="H";slot.className+=" on";}
      else if(g==="X0"&&q===0){label="X";slot.className+=" on";}
      else if(g==="X1"&&q===1){label="X";slot.className+=" on";}
      else if(g==="Z0"&&q===0){label="Z";slot.className+=" on";}
      else if(g==="Z1"&&q===1){label="Z";slot.className+=" on";}
      else if(g==="CNOT"){label=q===0?"•":"⊕";slot.className+=" on cnot";}
      slot.textContent=label;
      slots.appendChild(slot);
    }
    row.appendChild(slots);
    root.appendChild(row);
  });
}

function paint(res){
  lastRes=res;
  var bars=document.getElementById("bars");bars.innerHTML="";
  res.probs.forEach(function(x,i){
    var d=document.createElement("div");
    d.style.height=Math.max(3,Math.round(x*90))+"px";
    d.innerHTML="<span>|"+res.labels[i]+"⟩</span>";
    bars.appendChild(d);
  });
  var probs=document.getElementById("probs");probs.innerHTML="";
  res.labels.forEach(function(L,i){
    var d=document.createElement("div");
    d.innerHTML="<b>"+res.probs[i].toFixed(3)+"</b><i>|"+L+"⟩</i>";
    probs.appendChild(d);
  });
  document.getElementById("amp").textContent=res.psi.map(function(a,i){
    return "|"+res.labels[i]+"⟩: "+a.re.toFixed(3)+(a.im>=0?"+":"")+a.im.toFixed(3)+"i";
  }).join("   ");
  document.getElementById("explain").textContent=explainResult(res);
}

function run(){
  renderCircuit();
  var res=runCircuit(steps);
  paint(res);
  return res;
}

function applyTemplate(tpl){
  steps=tpl.steps.slice();
  var res=run();
  return{tpl:tpl,res:res};
}

// ——— Chat ———
function addMsg(role,text){
  var d=document.createElement("div");
  d.className="msg "+(role==="u"?"u":"a");
  d.innerHTML="<div class=\"n\">"+(role==="u"?"вы":"АКСИ")+"</div>";
  var body=document.createElement("div");
  body.style.whiteSpace="pre-wrap";
  body.textContent=text;
  d.appendChild(body);
  document.getElementById("thread").appendChild(d);
  document.getElementById("thread").scrollTop=99999;
}

function handlePrompt(q){
  addMsg("u",q);
  var tpl=textToCircuit(q);
  if(!tpl){
    addMsg("a","Не распознала квантовый шаблон. Попробуйте: «запутанность», «суперпозиция», «телепортация». Или соберите схему кнопками справа.");
    return;
  }
  var out=applyTemplate(tpl);
  var p=out.res.probs;
  var msg=
    "Шаблон: "+tpl.name+"\n"+
    (tpl.note?tpl.note+"\n":"")+
    "Гейты: "+tpl.steps.join(" → ")+"\n\n"+
    "P|00⟩="+p[0].toFixed(3)+", P|01⟩="+p[1].toFixed(3)+", P|10⟩="+p[2].toFixed(3)+", P|11⟩="+p[3].toFixed(3)+"\n\n"+
    explainResult(out.res);
  addMsg("a",msg);
}

document.getElementById("send").onclick=function(){
  var v=document.getElementById("inp").value.trim();
  if(!v)return;
  document.getElementById("inp").value="";
  handlePrompt(v);
};
document.getElementById("inp").addEventListener("keydown",function(e){
  if(e.key==="Enter"){e.preventDefault();document.getElementById("send").click();}
});
document.querySelectorAll("[data-q]").forEach(function(b){
  b.onclick=function(){handlePrompt(b.getAttribute("data-q"));};
});
document.querySelectorAll("[data-g]").forEach(function(b){
  b.onclick=function(){
    var g=b.getAttribute("data-g");
    if(g==="CLR")steps=[];
    else if(g==="DEL")steps.pop();
    else steps.push(g);
    run();
  };
});
document.getElementById("btn-run").onclick=function(){run();};
document.getElementById("btn-explain").onclick=function(){
  var res=run();
  addMsg("a","Разбор текущей схемы:\n"+explainResult(res));
};
document.getElementById("btn-json").onclick=function(){
  var data={version:1,qubits:2,steps:steps,result:lastRes&&{probs:lastRes.probs,entropy:lastRes.entropy}};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="aksi-circuit.json";a.click();
};
document.getElementById("btn-md").onclick=function(){
  var res=run();
  var md="# Отчёт АКСИ · квантовая схема\n\n"+
    "Гейты: `"+steps.join(" → ")+"`\n\n"+
    "## Вероятности\n\n"+
    res.labels.map(function(L,i){return "- |"+L+"⟩: "+res.probs[i].toFixed(6);}).join("\n")+"\n\n"+
    "Энтропия: "+res.entropy.toFixed(4)+"\n\n"+
    "## Вывод\n\n"+explainResult(res)+"\n";
  var blob=new Blob([md],{type:"text/markdown"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="aksi-quantum-report.md";a.click();
};

run();
addMsg("a","Напишите «Покажи запутанность двух кубитов и посчитай вероятности» — построю H+CNOT, прогоню statevector и разберу числа. Схему можно менять руками справа.");
})();
</script>
</body>
</html>
