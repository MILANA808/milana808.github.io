<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>АКСИ-СМЫСЛ v1.0 — математический синтез речи</title>
<meta name="description" content="4D S, Хопфилд 4×4, cosine-синтез, DID proof. Без нейросетей BigTech."/>
<link rel="canonical" href="https://milana808.github.io/matrix-mind/"/>
<meta name="theme-color" content="#07080c"/>
<style>
:root{--bg:#07080c;--card:#12141c;--line:rgba(255,255,255,.1);--t:#e8ecf4;--m:#8b93a7;--a:#7eb6ff;--ok:#3dd68c;--accent:#b794f6}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 40px}
h1{margin:0;font-size:1.15rem}p.sub{margin:4px 0 14px;color:var(--m);font-size:.88rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.card h2{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--m)}
.mono{font:12px/1.5 ui-monospace,Menlo,monospace;word-break:break-all;color:var(--a)}
table.mem{width:100%;border-collapse:collapse;font:11px/1.2 ui-monospace,monospace}
table.mem td{border:1px solid var(--line);padding:6px 4px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips button{background:var(--card);border:1px solid var(--line);color:var(--m);border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
.composer{display:flex;gap:8px;margin:10px 0}
.composer input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--t);border-radius:12px;padding:12px 14px;font-size:15px}
.composer button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:linear-gradient(135deg,var(--a),var(--accent));color:#0a0b10;cursor:pointer}
.thought .label{font-size:11px;text-transform:uppercase;color:var(--m);margin:8px 0 6px}
.ans{padding:14px;border-radius:14px;background:rgba(126,182,255,.06);border:1px solid rgba(126,182,255,.22);white-space:pre-wrap;font-size:15px;min-height:3.2em}
.proof{margin-top:10px;font:11px/1.5 ui-monospace,monospace;color:var(--m);word-break:break-all}
.proof b{color:var(--ok)}
footer{margin-top:22px;font-size:12px;color:var(--m)}footer a{color:var(--a);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>АКСИ-СМЫСЛ v1.0</h1>
  <p class="sub">Математический синтез речи · 4D · Хопфилд 4×4 · cosine · DID · без BigTech NN</p>
  <div class="chips">
    <button type="button" data-zone="кто ты">кто ты</button>
    <button type="button" data-zone="алфавит">алфавит</button>
    <button type="button" data-zone="запомни">запомни</button>
    <button type="button" data-zone="math">math</button>
    <button type="button" data-zone="формула">формула</button>
    <button type="button" data-zone="привет">привет</button>
  </div>
  <div class="composer">
    <input id="q" type="text" placeholder="Текст или зона смысла…" autocomplete="off"/>
    <button type="button" id="go">Мысль</button>
  </div>
  <div class="thought">
    <div class="label">Мысль</div>
    <div class="ans" id="ans">Ожидание…</div>
  </div>
  <div class="grid">
    <div class="card"><h2>input (зона)</h2><div class="mono" id="vec-input">[—, —, —, —]</div></div>
    <div class="card"><h2>S (сознание)</h2><div class="mono" id="vec-S">[1.000, 0.000, 0.000, 0.000]</div></div>
  </div>
  <div class="card" style="margin-top:10px">
    <h2>memory · Хопфилд 4×4 (Хебб)</h2>
    <div id="vec-memory"></div>
  </div>
  <div class="proof" id="proof">proof: —</div>
  <footer>technology_serves_human · <a href="/one/">ONE</a> · <a href="/authority/">Authority</a> · aksilove@internet.ru</footer>
</div>
<script src="/matrix-mind/agent.js?v=1"></script>
</body>
</html>
