<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>АКСИ Vector Mind v2 — trained</title>
<meta name="description" content="Обученный векторный движок: 49 паттернов, Хопфилд, intent rank, ECDSA proof."/>
<link rel="canonical" href="https://milana808.github.io/matrix-mind/"/>
<style>
:root{--bg:#07080c;--card:#12141c;--line:rgba(255,255,255,.08);--t:#e8ecf4;--m:#8b93a7;--a:#7eb6ff;--ok:#3dd68c;--accent:#b794f6}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif}
.layout{display:grid;grid-template-rows:auto 1fr auto;height:100%;max-width:960px;margin:0 auto}
header{padding:12px 14px;border-bottom:1px solid var(--line)}header h1{margin:0;font-size:1.05rem}header p{margin:4px 0 0;font-size:12px;color:var(--m)}
#cwrap{position:relative;min-height:280px;background:radial-gradient(ellipse at 50% 40%,#14182a,var(--bg))}
canvas{display:block;width:100%;height:100%;min-height:280px}
.panel{padding:12px 14px 18px;border-top:1px solid var(--line)}
.composer{display:flex;gap:8px}.composer input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--t);border-radius:12px;padding:12px 14px}
.composer button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:linear-gradient(135deg,var(--a),var(--accent));color:#0a0b10;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips button{background:var(--card);border:1px solid var(--line);color:var(--m);border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer}
.ans{margin-top:10px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;font-size:14px;min-height:3em}
.proof{margin-top:8px;font:11px/1.5 ui-monospace,monospace;color:var(--m);word-break:break-all}.proof b{color:var(--ok)}
</style>
</head>
<body>
<div class="layout">
<header><h1>АКСИ · Vector Mind v2</h1><p>trained · 49 паттернов · Хопфилд · ECDSA · не бэкпроп</p></header>
<div id="cwrap"><canvas id="cv"></canvas></div>
<div class="panel">
<div class="chips">
<button type="button" data-q="кто ты">кто ты</button>
<button type="button" data-q="русский алфавит">алфавит</button>
<button type="button" data-q="формула aksi">формула</button>
<button type="button" data-q="запомни: факт обучения вектора">запомни</button>
</div>
<div class="composer"><input id="q" type="text" placeholder="Вопрос к обученному движку…"/><button type="button" id="go">Мысль</button></div>
<div class="ans" id="ans">Движок обучен — задайте вопрос…</div>
<div class="proof" id="proof">proof: —</div>
</div></div>
<script src="/aksi-math-ai.js?v=v2"></script>
<script src="/aksi-conscious.js?v=v2"></script>
<script src="/aksi-vector-mind.js?v=21"></script>
<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),graph=null,wave=0,nodes=[];
function resize(){var r=cv.parentElement.getBoundingClientRect();cv.width=Math.floor(r.width*devicePixelRatio);cv.height=Math.floor(Math.max(280,r.height)*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}window.addEventListener('resize',resize);resize();
function project(p){if(!p)return null;var w=cv.width/devicePixelRatio,h=cv.height/devicePixelRatio,cx=w*.5,cy=h*.48,scale=Math.min(w,h)*.28,z=1+(p.z||0)*.35;return{x:cx+p.x*scale*z,y:cy-p.y*scale*z,r:4+Math.abs(p.mag||0)*6};}
function buildNodes(g){nodes=[];if(!g)return;function add(p,color,label){if(p)nodes.push({p:p,color:color,label:label});}(g.concepts||[]).forEach(function(c){add(c,'#718096',c.label);});add(g.input,'#7eb6ff','input');add(g.memory,'#f6ad55','memory');add(g.state,'#b794f6','S');add(g.identity,'#3dd68c','identity');}
function draw(){var w=cv.width/devicePixelRatio,h=cv.height/devicePixelRatio;ctx.clearRect(0,0,w,h);wave+=.02;nodes.forEach(function(n,i){var a=project(n.p);if(!a)return;ctx.beginPath();ctx.fillStyle=n.color;ctx.globalAlpha=.85;ctx.arc(a.x,a.y,a.r*(1+.08*Math.sin(wave*3+i)),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='10px system-ui';ctx.fillText(n.label||'',a.x+8,a.y-6);});requestAnimationFrame(draw);}draw();
async function run(){var q=document.getElementById('q').value.trim();if(!q||!window.AKSI_VECTOR)return;document.getElementById('ans').textContent='… train → S_t → Hopfield → proof';var r=await AKSI_VECTOR.think(q);document.getElementById('ans').textContent=r.answer||r.error||'—';var p=r.proof||{};document.getElementById('proof').innerHTML='v'+(r.version||'')+' · t='+(r.state&&r.state.t)+' · res <b>'+(r.state&&r.state.resonance)+'</b> · pats '+(r.state&&r.state.patterns)+' · '+(p.alg||'')+' · <b>'+(p.hash||'').slice(0,20)+'…</b>';graph=r.graph;buildNodes(graph);}
document.getElementById('go').onclick=run;document.getElementById('q').addEventListener('keydown',function(e){if(e.key==='Enter')run();});document.querySelectorAll('[data-q]').forEach(function(b){b.onclick=function(){document.getElementById('q').value=b.getAttribute('data-q');run();};});
if(window.AKSI_VECTOR){var st=AKSI_VECTOR.status();document.getElementById('proof').textContent='trained:'+st.trained+' · curriculum:'+st.curriculum+' · patterns:'+st.patterns;AKSI_VECTOR.think('инициализация').then(function(r){graph=r.graph;buildNodes(graph);});}
})();
</script>
</body>
</html>
