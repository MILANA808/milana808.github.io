<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>АКСИ — Proof · подпись и аттестат</title>
<style>
:root{--bg:#0b1220;--panel:#111827;--card:#1a2332;--line:#243044;--ink:#e8eef7;--muted:#94a3b8;--acc:#8b5cf6;--acc2:#3b82f6;--ok:#34d399;--bad:#f87171}
[data-theme=light]{--bg:#f1f5f9;--panel:#fff;--card:#fff;--line:#e2e8f0;--ink:#0f172a;--muted:#64748b}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);max-width:820px;margin:0 auto;padding:16px;padding-bottom:48px;line-height:1.5}
header{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-weight:900;color:#fff}
h1{font-size:1.25rem;font-weight:800}.sub{font-size:13px;color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
nav a,button.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font-size:1rem;margin-bottom:8px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
textarea,input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-family:ui-monospace,Menlo,monospace}
textarea{min-height:110px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--acc);color:#fff;cursor:pointer}
.btn2{background:var(--acc2)}
#out{margin-top:12px;padding:12px;border-radius:12px;border:1px dashed var(--line);font-size:13px;white-space:pre-wrap;word-break:break-all;color:var(--muted)}
#out.ok{border-color:var(--ok);color:var(--ok)}
#out.bad{border-color:var(--bad);color:var(--bad)}
.sha{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;background:var(--card);padding:10px;border-radius:10px;margin-top:8px}
pre.att{white-space:pre-wrap;font-size:13px;line-height:1.45;max-height:280px;overflow:auto;background:var(--card);padding:12px;border-radius:12px;border:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <div class="logo">А</div>
  <div><h1>Proof · подпись АКСИ</h1><div class="sub">Ed25519 · аттестат Grok×АКСИ · проверка</div></div>
</header>
<nav>
  <a href="/">Главная</a>
  <a href="/chat/?v=13">Чат</a>
  <a href="/ATTESTATION.md">Аттестат</a>
  <button type="button" class="chip" id="btnTheme">Тема</button>
</nav>
<div class="card">
  <h2>1. Аттестат создания (Grok × АКСИ)</h2>
  <pre class="att" id="attText">загрузка…</pre>
  <div class="sha" id="attSha">SHA-256: …</div>
  <div class="row">
    <button type="button" class="btn" id="btnSignAtt">Подписать аттестат ключом АКСИ</button>
    <button type="button" class="btn btn2" id="btnCopyAtt">Копировать</button>
  </div>
  <div id="attOut" class="sha" style="margin-top:10px;display:none"></div>
</div>
<div class="card">
  <h2>2. Подписать любой текст</h2>
  <label>Текст</label>
  <textarea id="msg" placeholder="Текст для подписи…"></textarea>
  <div class="row"><button type="button" class="btn" id="btnSign">Подписать Ed25519</button></div>
  <div id="signOut" class="sha" style="margin-top:10px;display:none"></div>
</div>
<div class="card">
  <h2>3. Проверить подпись</h2>
  <label>Текст</label><textarea id="vMsg"></textarea>
  <label>Подпись</label><input id="vSig" autocomplete="off">
  <label>Public key JWK (для Ed25519)</label><textarea id="vPub" style="min-height:70px"></textarea>
  <div class="row"><button type="button" class="btn btn2" id="btnVerify">Проверить</button></div>
  <div id="out"></div>
</div>
<script src="/aksi-core.js?v=13"></script>
<script src="/aksi-product-core.js?v=13"></script>
<script src="/aksi-product-boost.js?v=13"></script>
<script>
(function(){
  function $(id){return document.getElementById(id);}
  $("btnTheme").onclick=function(){var c=document.documentElement.getAttribute("data-theme");document.documentElement.setAttribute("data-theme",c==="light"?"":"light");};
  function looksHex(s){return /^[0-9a-fA-F]+$/.test(s)&&s.length%2===0;}
  function hexToBytes(h){var u=new Uint8Array(h.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16);return u;}
  function b64ToBytes(b64){var bin=atob(b64.replace(/-/g,"+").replace(/_/g,"/"));var u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
  function showAtt(att, ed){
    $("attText").textContent=att.text;
    $("attSha").textContent="SHA-256: "+att.sha256+(ed?" · Ed25519 готово":"");
  }
  AksiProduct.init().then(function(info){
    showAtt(AksiProduct.getAttestation(), info.ed25519);
    fetch("/ATTESTATION.json").then(function(r){return r.json();}).then(function(j){
      if(j&&j.text) showAtt({text:j.text,sha256:j.sha256}, info.ed25519);
    }).catch(function(){});
  });
  $("btnCopyAtt").onclick=function(){
    var t=$("attText").textContent;
    navigator.clipboard.writeText(t).then(function(){$("attOut").style.display="block";$("attOut").textContent="Скопировано.";});
  };
  $("btnSignAtt").onclick=function(){
    var t=$("attText").textContent;
    AksiProduct.signText(t).then(function(r){
      $("attOut").style.display="block";
      $("attOut").textContent="algo: "+r.algo+"\nrealCrypto: "+!!r.realCrypto+"\nsig: "+r.sig+"\n"+(r.publicKey?JSON.stringify(r.publicKey):"");
      $("vMsg").value=t; $("vSig").value=typeof r.sig==="string"?r.sig:JSON.stringify(r.sig);
      if(r.publicKey) $("vPub").value=JSON.stringify(r.publicKey);
    });
  };
  $("btnSign").onclick=function(){
    var t=$("msg").value.trim(); if(!t) return alert("Введите текст");
    AksiProduct.signText(t).then(function(r){
      $("signOut").style.display="block";
      $("signOut").textContent="algo: "+r.algo+"\nrealCrypto: "+!!r.realCrypto+"\nsig: "+r.sig;
      $("vMsg").value=t; $("vSig").value=typeof r.sig==="string"?r.sig:JSON.stringify(r.sig);
      if(r.publicKey) $("vPub").value=JSON.stringify(r.publicKey);
    });
  };
  $("btnVerify").onclick=async function(){
    var out=$("out"); out.className="";
    var text=$("vMsg").value, sigRaw=$("vSig").value.trim(), pubRaw=$("vPub").value.trim();
    if(!text||!sigRaw){out.textContent="Нужны текст и подпись.";out.className="bad";return;}
    try{
      var hash=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      var hex=Array.from(new Uint8Array(hash)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
      if(hex===sigRaw||hex.indexOf(sigRaw)===0){out.textContent="✓ SHA-256 совпадает.\n"+hex;out.className="ok";return;}
    }catch(e){}
    if(pubRaw){
      try{
        var jwk=JSON.parse(pubRaw);
        var key=await crypto.subtle.importKey("jwk", jwk, {name:"Ed25519"}, false, ["verify"]);
        var sigBytes=looksHex(sigRaw)?hexToBytes(sigRaw):b64ToBytes(sigRaw);
        var ok=await crypto.subtle.verify({name:"Ed25519"}, key, sigBytes, new TextEncoder().encode(text));
        out.textContent=ok?"✓ Подпись Ed25519 ВЕРНА.":"✗ Подпись НЕВЕРНА.";
        out.className=ok?"ok":"bad"; return;
      }catch(e){out.textContent="Ошибка: "+e.message;out.className="bad";return;}
    }
    out.textContent="Укажите JWK для Ed25519 или полный SHA-256."; out.className="bad";
  };
})();
</script>
</body>
</html>
