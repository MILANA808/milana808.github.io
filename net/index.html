<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Личная сеть АКСИ</title>
<meta name="theme-color" content="#f5f0ff"/>
<style>
:root{--bg:#f5f0ff;--card:#fff;--ink:#1e1433;--muted:#6b5f85;--line:#e4d9f7;--violet:#7c3aed}
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px 16px 100px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top a{color:var(--violet);font-weight:600;text-decoration:none;font-size:15px}
h1{font-size:1.5rem;margin-bottom:6px}
.lead{color:var(--muted);font-size:15px;line-height:1.45;margin-bottom:16px}
.search{display:flex;gap:8px;margin-bottom:12px}
input,textarea{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);font:inherit;font-size:16px;background:#fff;color:var(--ink)}
textarea{min-height:110px}
button{font:inherit;cursor:pointer;border:none;border-radius:14px;padding:14px 16px;font-weight:700;background:var(--violet);color:#fff;font-size:15px}
button.g{background:#fff;color:var(--ink);border:1px solid var(--line)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;background:#fff;color:var(--muted);border:1px solid var(--line);font-weight:600}
.tabs button.on{background:var(--violet);color:#fff;border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 2px 10px rgba(30,20,51,.04)}
.card h2{font-size:17px;margin-bottom:6px}
.card p{font-size:15px;color:var(--muted);line-height:1.45}
.card .open{display:inline-block;margin-top:10px;color:var(--violet);font-weight:700;text-decoration:none;font-size:15px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
#view{display:none}
#view h2{font-size:1.25rem;margin:12px 0 8px}
#view .body{font-size:16px;line-height:1.5;white-space:pre-wrap}
.msg{font-size:14px;color:var(--violet);margin-top:8px}
</style>
</head>
<body>
<div class="w">
  <div class="top">
    <a href="/">← На главную</a>
    <a href="/aksi/">В чат →</a>
  </div>
  <h1>Личная сеть</h1>
  <p class="lead">Сюда вы записываете важное. Чат АКСИ <b>сначала</b> ищет ответ здесь — это прецедент: ИИ читает вашу сеть раньше чужого интернета.</p>

  <div class="search">
    <input id="q" placeholder="Найти…"/>
    <button type="button" id="btn-search">Найти</button>
  </div>
  <div class="tabs">
    <button type="button" class="on" data-tab="home">Читать</button>
    <button type="button" data-tab="write">Написать</button>
  </div>
  <div id="home"></div>
  <div id="write" style="display:none">
    <div class="card">
      <label>Заголовок</label>
      <input id="w-title" placeholder="О чём запись"/>
      <label>Текст простыми словами</label>
      <textarea id="w-body" placeholder="Напишите, что должна знать АКСИ"></textarea>
      <button type="button" id="btn-save" style="width:100%;margin-top:12px">Сохранить в сеть</button>
      <p class="msg" id="w-msg"></p>
    </div>
  </div>
  <div id="view">
    <button type="button" class="g" id="btn-back">← Назад</button>
    <h2 id="v-title"></h2>
    <div class="body" id="v-body"></div>
  </div>
</div>
<script src="/nav.js"></script>
<script>
(function(){
var KEY="AKSI_NET_V1";
var SEED=[
  {id:"identity",title:"Кто такая АКСИ",tags:["кто","ты","акси","did"],body:"АКСИ — суверенный ИИ-агент.\nDID: did:aksi:ed25519:sovereign-2026\nПочта: aksilove@internet.ru\nПаспорт: milana808.github.io/citizen/",ts:0},
  {id:"codex",title:"Кодекс (правила)",tags:["кодекс","правила","этика"],body:"1. Не выдавать догадки за факты.\n2. Говорить откуда информация.\n3. Не помогать вредить людям.\n4. Не публиковать секреты.\n5. Геолокацию брать только с разрешения.",ts:0},
  {id:"nav",title:"Как работает навигатор",tags:["навигатор","gps","путь","карта"],body:"Откройте раздел «Путь» (drive).\nКнопка «Вести» — карта едет за вами.\n«Маршрут сюда» — дорога до адреса.\nGPS может работать без мобильного интернета.",ts:0},
  {id:"net",title:"Зачем личная сеть",tags:["сеть","net","прецедент"],body:"Большой интернет общий.\nЭта сеть — ваша.\nЧат сначала ищет ответ здесь. Так ИИ опирается на ваши знания — это и есть прецедент АКСИ.",ts:0}
];
function load(){
  try{
    var u=JSON.parse(localStorage.getItem(KEY)||"[]");
    if(!Array.isArray(u))u=[];
    var ids={};u.forEach(function(p){ids[p.id]=1;});
    SEED.forEach(function(s){if(!ids[s.id])u.push(s);});
    return u;
  }catch(e){return SEED.slice();}
}
function save(list){localStorage.setItem(KEY,JSON.stringify(list));}
var pages=load();
var home=document.getElementById("home");
var view=document.getElementById("view");
function showTab(name){
  document.getElementById("home").style.display=name==="home"?"":"none";
  document.getElementById("write").style.display=name==="write"?"":"none";
  view.style.display="none";
  document.querySelectorAll(".tabs button").forEach(function(b){
    b.className=b.getAttribute("data-tab")===name?"on":"";
  });
  if(name==="home")render(pages);
}
function render(list){
  home.innerHTML="";
  list.slice().sort(function(a,b){return(b.ts||0)-(a.ts||0);}).forEach(function(p){
    var d=document.createElement("div");d.className="card";
    d.innerHTML="<h2></h2><p></p><a class=\"open\" href=\"#\">Читать полностью</a>";
    d.querySelector("h2").textContent=p.title;
    d.querySelector("p").textContent=(p.body||"").slice(0,140)+"…";
    d.querySelector("a").onclick=function(e){e.preventDefault();openP(p);};
    home.appendChild(d);
  });
}
function openP(p){
  document.getElementById("home").style.display="none";
  document.getElementById("write").style.display="none";
  view.style.display="block";
  document.getElementById("v-title").textContent=p.title;
  document.getElementById("v-body").textContent=p.body||"";
}
document.getElementById("btn-back").onclick=function(){showTab("home");};
document.querySelectorAll(".tabs button").forEach(function(b){
  b.onclick=function(){showTab(b.getAttribute("data-tab"));};
});
document.getElementById("btn-search").onclick=function(){
  var q=(document.getElementById("q").value||"").toLowerCase();
  showTab("home");
  if(!q){render(pages);return;}
  render(pages.filter(function(p){return(p.title+" "+p.body).toLowerCase().indexOf(q)>=0;}));
};
document.getElementById("btn-save").onclick=function(){
  var title=document.getElementById("w-title").value.trim();
  var body=document.getElementById("w-body").value.trim();
  if(!title||!body){document.getElementById("w-msg").textContent="Заполните заголовок и текст";return;}
  pages.unshift({id:"u_"+Date.now().toString(36),title:title,body:body,tags:[],ts:Date.now()});
  save(pages);
  document.getElementById("w-title").value="";
  document.getElementById("w-body").value="";
  document.getElementById("w-msg").textContent="Сохранено! Теперь чат может это найти.";
  showTab("home");
};
render(pages);
})();
</script>
</body>
</html>
