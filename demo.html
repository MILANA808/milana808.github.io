<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АКСИ — демо 60 секунд</title>
<meta name="theme-color" content="#0b0b0f">
<style>
:root{--bg:#0b0b0f;--card:#16161f;--ink:#f2f1eb;--muted:#9a97a3;--line:#2c2c38;--acc:#8b7cf7;--ok:#3ecf8e}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink);max-width:560px;margin:0 auto;min-height:100vh;padding:16px}
h1{font-size:1.25rem;margin:12px 0 8px}
p{color:var(--muted);font-size:14px;margin-bottom:12px}
.step{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px}
.step.on{border-color:var(--acc)}
.step .n{font-size:12px;color:var(--acc);font-weight:700;margin-bottom:4px}
button{font:inherit;width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer;margin-top:8px}
button.sec{background:transparent;border:1px solid var(--line);color:var(--ink)}
button:disabled{opacity:.4}
.log{margin-top:12px;padding:12px;background:#101018;border-radius:12px;font-size:13px;white-space:pre-wrap;min-height:80px;font-family:ui-monospace,monospace;color:var(--muted)}
a{color:var(--muted)}
</style>
</head>
<body>
<div style="font-weight:800">АКСИ <span style="color:var(--acc)">Демо</span></div>
<h1>60 секунд — капсула</h1>
<p>Из переписки: одно демо без «квантового AGI».</p>
<div class="step on" id="s1"><div class="n">1 · Память</div>Факт на устройстве</div>
<div class="step" id="s2"><div class="n">2 · Ответ</div>Спрос памяти</div>
<div class="step" id="s3"><div class="n">3 · Печать</div>ECDSA</div>
<div class="step" id="s4"><div class="n">4 · Файл</div>.json / .aksi</div>
<div class="step" id="s5"><div class="n">5 · Проверка</div>hash + подпись</div>
<button type="button" id="go">Запустить демо</button>
<button type="button" class="sec" id="cap">Открыть капсулу</button>
<div class="log" id="log">Нажмите «Запустить демо»</div>
<p style="margin-top:16px"><a href="/HONEST.md">Честно</a> · <a href="/bench.html">Бенчмарки</a> · <a href="/">Главная</a></p>
<script src="/aksi-capsule.js?v=12"></script>
<script>
(function(){
  var C=window.AKSI_CAPSULE, log=document.getElementById('log');
  function L(t){ log.textContent += (log.textContent && log.textContent!=='Нажмите «Запустить демо»' ? '\n' : '') + t; }
  function step(n){ for(var i=1;i<=5;i++){ var el=document.getElementById('s'+i); el.className='step'+(i===n?' on':''); } }
  document.getElementById('cap').onclick=function(){ location.href='/capsule.html'; };
  document.getElementById('go').onclick=async function(){
    if(!C){ L('Модуль не загрузился'); return; }
    this.disabled=true; log.textContent='';
    try{
      await C.ensureKeys();
      step(1); C.remember('Демо: клиент Иван — договор до 20 сентября'); L('✓ Факт сохранён');
      await new Promise(r=>setTimeout(r,350));
      step(2); var a=await C.ask('договор Ивана'); L('✓ '+(a.text||'').slice(0,70));
      await new Promise(r=>setTimeout(r,350));
      step(3); var s=await C.sealLast(); L('✓ hash '+s.seal.hash.slice(0,22)+'…');
      await new Promise(r=>setTimeout(r,350));
      step(4); C.downloadCapsule({alsoAksi:true}); L('✓ Скачаны .json и .aksi');
      await new Promise(r=>setTimeout(r,350));
      step(5); var v=await C.verifySeal(s.seal);
      L(v.ok&&v.sigOk?'✓ Верификация OK':'✗ Ошибка проверки');
      L('\nПродукт из переписки: память → печать → файл → проверка.');
    }catch(e){ L('Ошибка: '+(e.message||e)); }
    this.disabled=false;
  };
})();
</script>
</body>
</html>
