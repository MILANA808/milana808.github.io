<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AKSI-Q Reasoner</title><style>body{margin:0;background:#0f172a;color:#f1f5f9;font:16px system-ui;max-width:760px;margin:auto;padding:20px}main{background:#111827;border:1px solid #334155;border-radius:18px;padding:20px}textarea{width:100%;min-height:110px;box-sizing:border-box;background:#0b1220;color:#fff;border:1px solid #334155;border-radius:12px;padding:12px;font:inherit}button{margin-top:10px;padding:12px 16px;border:0;border-radius:10px;background:#7c3aed;color:white;font-weight:700}.state{display:flex;justify-content:space-between;border-bottom:1px solid #334155;padding:10px 0}.note{color:#94a3b8;font-size:13px;line-height:1.5}.ok{color:#86efac}.warn{color:#fbbf24}</style><main><div>AKSI-Q REASONER</div><h1>Прогони ответ через 3 кубита</h1><p class="note">Это классическая симуляция квантового состояния. Она исследует альтернативные состояния и неопределённость; не использует квантовое железо и не заявляет квантового преимущества.</p><textarea id="q" placeholder="Вставьте вопрос или ответ АКСИ…"></textarea><button id="run">Запустить</button><section id="out"></section></main><script src="/aksi-quantum-reasoner.js"></script><script>document.getElementById('run').onclick=()=>{const r=AKSIQuantumReasoner.run(document.getElementById('q').value);document.getElementById('out').innerHTML='<h2>Результат</h2>'+r.top_states.map(x=>'<div class="state"><b>|'+x.state+'⟩</b><span>'+(x.probability*100).toFixed(1)+'%</span></div>').join('')+'<p class="note">Энтропия: '+r.entropy.toFixed(4)+'<br><span class="ok">Simulation complete</span><br>'+r.interpretation+'</p>'}</script></html>
